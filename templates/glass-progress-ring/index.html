<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "label", "type": "string", "label": "标签", "default": "本月目标完成率"}, {"id": "percent", "type": "string", "label": "百分比", "default": "87"}, {"id": "light", "type": "color", "label": "光源色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #070B09; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #EAF4EE; }
      .g-bg{ position: absolute; inset: 0;
        background: radial-gradient(900px 520px at 24% 22%, rgba(0,255,140,.07), transparent 60%),
          radial-gradient(1000px 600px at 80% 82%, rgba(64,224,208,.06), transparent 60%); }
      .g-num{ font-family: 'MiSans SemiBold', 'PingFang SC', sans-serif; }
      .g-panel{ position: absolute; left: 610px; top: 170px; width: 700px; height: 740px;
        border-radius: 34px; background: rgba(14,26,20,.54);
        -webkit-backdrop-filter: blur(13px); backdrop-filter: blur(13px);
        border: 1px solid rgba(255,255,255,.16); }
      .g-panel::before{ content: ""; position: absolute; inset: 10px; border-radius: 28px;
        transform: translate(3px, 3px); background: rgba(4,9,7,.55); z-index: -1;
        box-shadow: 0 0 0 20px rgba(4,9,7,.35); }
      .g-ring{ position: absolute; left: 50%; top: 46%; width: 440px; height: 440px;
        margin: -220px 0 0 -220px; transform: rotate(-90deg); }
      .g-ring circle{ fill: none; stroke-width: 26; }
      .g-track{ stroke: rgba(255,255,255,.10); }
      .g-prog{ stroke: var(--light, #00FF00); stroke-linecap: round;
        filter: drop-shadow(0 0 14px var(--light, #00FF00)); }
      .g-center{ position: absolute; left: 0; right: 0; top: 34%; text-align: center; }
      .g-pct{ font-size: 128px; line-height: 1; color: #F4FBF7; }
      .g-label{ margin-top: 18px; font-size: 30px; font-weight: 700; color: #A9C4B6; letter-spacing: .08em; }
      .g-cap{ position: absolute; left: 0; right: 0; bottom: 64px; text-align: center;
        font-size: 22px; color: #8FAE9E; letter-spacing: .2em; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="g-bg"></div>
      <div class="g-panel" id="panel">
        <svg class="g-ring" viewBox="0 0 440 440">
          <circle class="g-track" cx="220" cy="220" r="190"/>
          <circle class="g-prog" id="prog" cx="220" cy="220" r="190"/>
        </svg>
        <div class="g-center"><div class="g-pct g-num" id="pct">0%</div><div class="g-label" id="label"></div></div>
        <div class="g-cap mono" id="cap">PROGRESS · LIVE</div>
      </div>

    </div>
    <script>
      const fallback = {"label": "本月目标完成率", "percent": "87", "light": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      document.documentElement.style.setProperty("--light", V.light ?? "#00FF00");
      $("label").textContent = V.label;
      const pctVal = Math.max(0, Math.min(100, Number(V.percent) || 0));
      const prog = $("prog");
      const len = 2 * Math.PI * 190;
      prog.style.strokeDasharray = String(len);
      prog.style.strokeDashoffset = String(len);
      tl.fromTo("#panel", { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0);
      tl.to(prog, { strokeDashoffset: len * (1 - pctVal / 100), duration: 1.5, ease: "power2.inOut" }, 0.45);
      const po = { n: 0 };
      tl.to(po, { n: pctVal, duration: 1.5, ease: "power2.inOut",
        onUpdate: () => { $("pct").textContent = Math.round(po.n) + "%"; } }, 0.45);
      tl.fromTo("#cap", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 1.7);
      tl.to("#pct", { scale: 1.06, duration: 0.18, ease: "power2.out" }, 1.95);
      tl.to("#pct", { scale: 1, duration: 0.24, ease: "power2.inOut" }, 2.13);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
