<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "quote", "type": "string", "label": "引言", "default": "自动化的本质不是偷懒，是把判断力留给真正需要判断的地方。"}, {"id": "author", "type": "string", "label": "署名", "default": "运营手记 · 第 42 期"}, {"id": "light", "type": "color", "label": "光源色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #070B09; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #EAF4EE; }
      .g-bg{ position: absolute; inset: 0;
        background: radial-gradient(1000px 560px at 50% 30%, rgba(0,255,140,.08), transparent 62%); }
      .g-panel{ position: absolute; left: 360px; top: 280px; width: 1200px; height: 520px;
        border-radius: 34px; background: rgba(14,26,20,.54);
        -webkit-backdrop-filter: blur(13px); backdrop-filter: blur(13px);
        border: 1px solid rgba(255,255,255,.16); }
      .g-panel::before{ content: ""; position: absolute; inset: 10px; border-radius: 28px;
        transform: translate(3px, 3px); background: rgba(4,9,7,.55); z-index: -1;
        box-shadow: 0 0 0 20px rgba(4,9,7,.35); }
      .g-inner{ position: absolute; inset: 0; padding: 60px 90px; }
      .g-mark{ font-size: 130px; line-height: .6; color: var(--light, #00FF00); opacity: .9;
        font-family: 'MiSans SemiBold', sans-serif; }
      .g-quote{ margin-top: 44px; font-size: 52px; font-weight: 700; line-height: 1.5; color: #F4FBF7; }
      .g-author{ margin-top: 38px; text-align: right; font-size: 28px; color: #8FAE9E; }
      .g-author::before{ content: "—— "; }
      .g-light{ position: absolute; left: 0; top: 0; width: 240px; height: 240px; margin: -120px 0 0 -120px;
        mix-blend-mode: screen; pointer-events: none; }
      .g-halo{ position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(ellipse at center, var(--light, #00FF00) 0%, transparent 65%);
        opacity: .45; filter: blur(30px); }
      .g-core{ position: absolute; left: 60px; top: 60px; width: 120px; height: 120px; border-radius: 50%;
        background: radial-gradient(ellipse at center, #FFFFFF 0%, var(--light, #00FF00) 55%, transparent 75%);
        opacity: .85; filter: blur(28px); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="g-bg"></div>
      <div class="g-panel" id="panel">
        <div class="g-inner">
          <div class="g-mark">“</div>
          <div class="g-quote" id="quote"></div>
          <div class="g-author" id="author"></div>
        </div>
      </div>
      <div class="g-light" id="light"><div class="g-halo"></div><div class="g-core"></div></div>

    </div>
    <script>
      const fallback = {"quote": "自动化的本质不是偷懒，是把判断力留给真正需要判断的地方。", "author": "运营手记 · 第 42 期", "light": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      document.documentElement.style.setProperty("--light", V.light ?? "#00FF00");
      $("quote").textContent = V.quote;
      $("author").textContent = V.author;
      const light = $("light");
      light.style.left = "360px"; light.style.top = "800px";
      tl.fromTo("#panel", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(".g-mark", { opacity: 0, scale: 1.6 }, { opacity: 0.9, scale: 1, duration: 0.45, ease: "power3.out" }, 0.3);
      tl.fromTo("#quote", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.55);
      tl.fromTo("#author", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 1.25);
      tl.to(light, { keyframes: [
        { left: 960, top: 800, scale: 1.1, filter: "hue-rotate(60deg)", duration: 0.9 },
        { left: 1560, top: 800, scale: 0.95, filter: "hue-rotate(120deg)", duration: 0.9 },
        { left: 960, top: 280, scale: 1.1, filter: "hue-rotate(40deg)", duration: 0.9 },
        { left: 360, top: 800, scale: 1.0, filter: "hue-rotate(0deg)", duration: 0.9 }
      ], ease: "none" }, 0.2);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
