<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "图表标题", "default": "月活跃用户增长趋势"}, {"id": "subtitle", "type": "string", "label": "副标题", "default": "2024.01 — 2024.12"}, {"id": "labels", "type": "string", "label": "X轴标签（逗号分隔）", "default": "1月,2月,3月,4月,5月,6月,7月,8月,9月,10月,11月,12月"}, {"id": "values", "type": "string", "label": "Y轴数值（逗号分隔）", "default": "120,145,180,210,260,340,420,480,510,580,640,720"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #F5F0E6); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #F5F0E6); color: var(--foreground, #1D1D20);
  font-family:'Noto Sans SC','PingFang SC',sans-serif; }
.scene{ position:absolute; inset:0; padding:64px 80px; }
.card{ background:#FFFDF7; border:3px solid #1D1D20; border-radius:16px; box-shadow:6px 6px 0 #2A292B; }
.tape{ position:absolute; width:120px; height:32px; background:rgba(185,232,51,.6); border:2px solid #1D1D20;
  border-radius:4px; transform:rotate(-5deg); z-index:5; }
.tape.pink{ background:rgba(241,59,136,.35); transform:rotate(4deg); }
.tape.blue{ background:rgba(62,123,242,.3); transform:rotate(-3deg); }
.chip{ display:inline-flex; align-items:center; gap:8px; padding:6px 14px; background:#FFFDF7; border:3px solid #1D1D20;
  border-radius:999px; font-family:'Fredoka','Arial Rounded MT Bold',sans-serif; font-weight:700; font-size:18px;
  letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; box-shadow:4px 4px 0 #2A292B; }
.chip.lime{ background:#B9E833; } .chip.blue{ background:#3E7BF2; color:#FFFDF7; }
.chip.pink{ background:#F13B88; color:#FFFDF7; } .chip.orange{ background:#FF9F1C; }
.num{ font-family:'Fredoka','Arial Rounded MT Bold',sans-serif; font-weight:700; }
.mono{ font-family:'IBM Plex Mono','JetBrains Mono',monospace; font-weight:700; }
.dashline{ border:none; border-top:3px dashed #1D1D20; }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="6" data-track-index="1">

        <div class="card" style="position:absolute;left:60px;top:56px;padding:16px 28px;">
          <span class="chip blue">TREND</span>
          <h1 id="title" class="num" style="display:inline-block;margin:0 0 0 16px;font-size:40px;vertical-align:middle;"></h1>
          <p id="subtitle" style="margin:6px 0 0;font-size:18px;color:#4D4A48;"></p>
        </div>
        <div class="card" style="position:absolute;left:80px;right:80px;top:220px;bottom:70px;padding:30px;">
          <span class="tape pink" style="right:40px;top:-16px;"></span>
          <svg id="chart" viewBox="0 0 1700 640" style="width:100%;height:100%;overflow:visible;"></svg>
        </div>

      </section>
    </div>
    <script>
      const fallback = {"title": "月活跃用户增长趋势", "subtitle": "2024.01 — 2024.12", "labels": "1月,2月,3月,4月,5月,6月,7月,8月,9月,10月,11月,12月", "values": "120,145,180,210,260,340,420,480,510,580,640,720", "accent": "#00FF00", "background": "#12100E", "foreground": "#F4EFE7"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 6;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("title").textContent = v.title; $("subtitle").textContent = v.subtitle;
      const labels = split(v.labels), values = split(v.values).map(Number);
      const svg = $("chart"), NS = "http://www.w3.org/2000/svg";
      const W = 1700, H = 640, padL = 40, padB = 56, padT = 26;
      const max = Math.max(...values, 1) * 1.15;
      const px = (i) => padL + (W - padL - 40) * (labels.length === 1 ? 0.5 : i / (labels.length - 1));
      const py = (val) => padT + (H - padT - padB) * (1 - val / max);
      for (let g = 0; g <= 4; g++) {
        const y = padT + (H - padT - padB) * g / 4;
        const ln = document.createElementNS(NS, "line");
        ln.setAttribute("x1", padL); ln.setAttribute("x2", W - 40); ln.setAttribute("y1", y); ln.setAttribute("y2", y);
        ln.setAttribute("stroke", "#C9C0B2"); ln.setAttribute("stroke-dasharray", "3 9"); ln.setAttribute("stroke-width", "2");
        svg.appendChild(ln);
      }
      const pts = values.map((val, i) => [px(i), py(val)]);
      const dAttr = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      const area = document.createElementNS(NS, "path");
      area.setAttribute("d", dAttr + ` L${pts[pts.length-1][0]} ${H-padB} L${pts[0][0]} ${H-padB} Z`);
      area.setAttribute("fill", "rgba(62,123,242,.12)"); area.setAttribute("opacity", "0"); svg.appendChild(area);
      const path = document.createElementNS(NS, "path");
      path.setAttribute("d", dAttr); path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#3E7BF2"); path.setAttribute("stroke-width", "6"); path.setAttribute("stroke-linecap", "round"); path.setAttribute("stroke-linejoin", "round");
      svg.appendChild(path);
      const len = path.getTotalLength();
      path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
      const dots = pts.map((p, i) => {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]); c.setAttribute("r", "10");
        c.setAttribute("fill", i === pts.length - 1 ? "#B9E833" : "#FFFDF7"); c.setAttribute("stroke", "#1D1D20"); c.setAttribute("stroke-width", "4");
        c.setAttribute("opacity", "0"); svg.appendChild(c);
        const t = document.createElementNS(NS, "text");
        t.setAttribute("x", p[0]); t.setAttribute("y", H - padB + 34); t.setAttribute("text-anchor", "middle");
        t.setAttribute("fill", "#4D4A48"); t.setAttribute("font-size", "19"); t.setAttribute("font-weight", "700"); t.setAttribute("opacity", "0");
        t.textContent = labels[i]; svg.appendChild(t);
        return { c, t };
      });
      tl.fromTo(".card", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.15 }, 0.1);
      tl.to(path, { strokeDashoffset: 0, duration: 2.0, ease: "power2.inOut" }, 0.5);
      tl.to(area, { opacity: 1, duration: 1.0 }, 1.6);
      dots.forEach((d, i) => {
        const at = 0.5 + (i / Math.max(dots.length - 1, 1)) * 2.0;
        tl.fromTo(d.c, { opacity: 0, scale: 0.3, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, at);
        tl.to(d.t, { opacity: 1, duration: 0.2 }, at);
      });
      tl.to(".scene", { clipPath: "inset(0 0 100% 0)", duration: 0.5, ease: "power2.in" }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
