<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"chapterNumber","type":"string","label":"章节编号","default":"01"},{"id":"chapterTitle","type":"string","label":"章节标题","default":"为什么流程比灵感更重要"},{"id":"progressPercent","type":"number","label":"进度百分比（0-100）","default":35},{"id":"duration","type":"number","label":"总时长（秒）","default":5},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden; display: flex; flex-direction: column; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .number{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 28px; font-weight: 600; color: var(--accent); letter-spacing: 0.1em; margin-bottom: 20px; }
      .title{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 96px; font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; color: var(--fg); margin: 0 0 64px; }
      .progress-wrap{ position: relative; width: 100%; height: 6px; background: rgba(244,239,231,0.12); border-radius: 3px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .progress-bar{ position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: var(--accent); border-radius: 3px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .progress-text{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 18px; color: rgba(244,239,231,0.5); margin-top: 18px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="number" id="chapterNumber">CHAPTER 01</div>
        <h1 class="title" id="chapterTitle">为什么流程比灵感更重要</h1>
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">0%</div>
      </section>
    </div>
    <script>
      const fallback = { chapterNumber: "01", chapterTitle: "为什么流程比灵感更重要", progressPercent: 35, accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.setProperty("--accent", v.accent);
      root.style.setProperty("--fg", v.foreground);
      document.getElementById("chapterNumber").textContent = "CHAPTER " + String(v.chapterNumber);
      document.getElementById("chapterTitle").textContent = v.chapterTitle;
      const pct = Math.max(0, Math.min(100, Number(v.progressPercent) || 0));
      const progressBar = document.getElementById("progressBar");
      const progressText = document.getElementById("progressText");
      progressBar.style.width = "0%";
      progressText.textContent = "0%";

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".number", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo(".title", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 0.25);
      tl.fromTo(".progress-wrap", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out", transformOrigin: "left" }, 0.7);
      tl.to(progressBar, { width: pct + "%", duration: 1.2, ease: "power2.inOut" }, 1.0);
      tl.to({ val: 0 }, { val: pct, duration: 1.2, ease: "power2.inOut", onUpdate: function() { progressText.textContent = Math.round(this.targets()[0].val) + "%"; } }, 1.0);
      tl.to(".scene", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.6);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
