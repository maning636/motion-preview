<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "VOL.15 · 视觉动效库"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.301 / 400"}, {"id": "kicker", "type": "string", "label": "眉题", "default": "OPENING HOOK · 开场钩子"}, {"id": "line1", "type": "string", "label": "大标题第一行", "default": "这本书只用三句话"}, {"id": "line2", "type": "string", "label": "大标题第二行（绿高亮）", "default": "就把我说服了"}, {"id": "cards", "type": "string", "label": "三条短结论（分号分隔）", "default": "方法比努力重要;先把问题问对;答案自己会长出来"}, {"id": "img1", "type": "image", "label": "底部插画横幅（横图）", "default": "./assets/banner.png"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .pft-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .pft-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .pft-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .pft-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* kicker + 大标题 */
      .pft-kicker{ position: absolute; left: 0; right: 0; top: 128px; text-align: center;
        font-size: 22px; letter-spacing: .3em; color: #141414; z-index: 5; }
      .pft-kicker b{ color: #9A9A92; font-weight: 400; }
      .pft-title{ position: absolute; left: 0; right: 0; top: 178px; text-align: center;
        font-size: 88px; font-weight: 900; line-height: 1.22; letter-spacing: .01em; z-index: 5; }
      .pft-title span{ display: inline-block; }
      .pft-title .hl{ position: relative; display: inline-block; padding: 0 16px; }
      .pft-title .hl i{ position: absolute; left: 0; right: 0; top: 10px; bottom: 10px; background: var(--ac, #00FF00);
        z-index: -1; transform: scaleX(0); transform-origin: 0 50%; }
      /* 三张迷你结论卡 */
      .pft-cards{ position: absolute; left: 170px; top: 478px; width: 1580px; height: 200px;
        display: flex; gap: 40px; z-index: 5; }
      .pft-card{ flex: 1; border: 3px solid #141414; padding: 26px 30px; position: relative; }
      .pft-card .no{ font-size: 18px; letter-spacing: .2em; margin-bottom: 14px; }
      .pft-card .tx{ font-size: 30px; font-weight: 900; line-height: 1.4; }
      .pft-card.c1{ background: var(--ac, #00FF00); color: #141414; box-shadow: 10px 10px 0 #141414; }
      .pft-card.c2{ background: #141414; color: #F6F5EF; box-shadow: 10px 10px 0 var(--ac, #00FF00); }
      .pft-card.c2 .no{ color: var(--ac, #00FF00); }
      .pft-card.c3{ background: #fff; color: #141414; box-shadow: 10px 10px 0 #141414; }
      .pft-card .no{ color: inherit; opacity: .62; }
      .pft-card.c2 .no{ opacity: 1; }
      /* 底部插画横幅 */
      .pft-banner{ position: absolute; left: 90px; right: 90px; top: 730px; height: 238px; z-index: 4; }
      .pft-banner .sh{ position: absolute; left: 14px; top: 14px; width: 100%; height: 100%; background: #141414; }
      .pft-banner .im{ position: absolute; left: 0; top: 0; width: 100%; height: 100%;
        border: 3px solid #141414; overflow: hidden; background: #fff; }
      .pft-banner img{ width: 100%; height: 100%; object-fit: cover; display: block; }
      /* 底部绿色署名条 */
      .pft-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(64px); }
      .pft-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .pft-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="pft-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="pft-kicker mono" id="kicker"></div>
      <div class="pft-title"><span id="line1"></span><br /><span class="hl"><i id="hlbg"></i><span id="line2"></span></span></div>
      <div class="pft-cards">
        <div class="pft-card c1" id="card0"><div class="no mono">FACT · 01</div><div class="tx"></div></div>
        <div class="pft-card c2" id="card1"><div class="no mono">FACT · 02</div><div class="tx"></div></div>
        <div class="pft-card c3" id="card2"><div class="no mono">FACT · 03</div><div class="tx"></div></div>
      </div>
      <div class="pft-banner" id="banner">
        <div class="sh"></div>
        <div class="im"><img id="bn" src="./assets/banner.png" alt="" /></div>
      </div>
      <div class="pft-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · HOOK TRIO</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "VOL.15 · 视觉动效库", "pageno": "P.301 / 400", "kicker": "OPENING HOOK · 开场钩子", "line1": "这本书只用三句话", "line2": "就把我说服了", "cards": "方法比努力重要;先把问题问对;答案自己会长出来", "img1": "./assets/banner.png", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      $("kicker").innerHTML = "";
      const kc = String(V.kicker).split("·");
      $("kicker").textContent = kc[0].trim();
      if (kc[1]) { const b = document.createElement("b"); b.textContent = " · " + kc.slice(1).join("·").trim(); $("kicker").appendChild(b); }
      $("line1").textContent = V.line1;
      $("line2").textContent = V.line2;
      const items = String(V.cards).split(";").map(s => s.trim()).filter(Boolean).slice(0, 3);
      for (let i = 0; i < 3; i++) $("card" + i).querySelector(".tx").textContent = items[i] || "";
      if (V.img1) $("bn").src = V.img1;
      // 页眉细线 + 文字
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      // kicker + 大标题
      tl.fromTo("#kicker", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45 }, 0.3);
      tl.fromTo(["#line1", ".hl"], { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.55, stagger: 0.12, ease: "power3.out" }, 0.45);
      tl.to("#hlbg", { scaleX: 1, duration: 0.38, ease: "power2.inOut" }, 1.1);
      // 三张迷你卡错峰 back.out 弹入
      tl.fromTo(["#card0", "#card1", "#card2"], { opacity: 0, y: 60, scale: 0.7 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, stagger: 0.16, ease: "back.out(1.8)" }, 1.25);
      // 底部横幅升起
      tl.fromTo("#banner", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 2.0);
      // 底部署名条
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 2.3);
      tl.fromTo([".pft-foot .f1", ".pft-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 2.55);
      // 呼吸浮动（保持画面活着，无收尾 fade-out）
      tl.to(["#card0", "#card1", "#card2"], { y: -8, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: 0.2 }, 3.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
