<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"图表标题","default":"渠道销售构成"},{"id":"subtitle","type":"string","label":"副标题","default":"线上与线下销售额季度占比"},{"id":"labels","type":"string","label":"分类标签（逗号分隔）","default":"Q1,Q2,Q3,Q4"},{"id":"seriesNames","type":"string","label":"系列名称（逗号分隔）","default":"线上,线下"},{"id":"values","type":"string","label":"数值（分号分隔行，逗号分隔系列）","default":"320,180;410,220;380,290;520,310"},{"id":"colors","type":"string","label":"系列颜色（逗号分隔）","default":"#00FF00,#6B7280"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      body{ font-family: 'MEBHeiHeiTi', sans-serif; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e); color: var(--foreground, #f4efe7);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title-area{ position: relative; z-index: 2; margin-bottom: 48px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0 0 12px; font-size: 72px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .subtitle{ margin: 0; font-size: 32px; font-weight: 400; color: #6B7280; line-height: 1.4;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-area{ position: relative; width: 100%; height: 600px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-svg{ width: 100%; height: 100%; overflow: visible;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .grid-line{ stroke: #3a3029; stroke-width: 1;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .axis-text{ fill: #6B7280; font-size: 20px; font-family: 'MEBHeiHeiTi', sans-serif; font-weight: 500; text-anchor: middle; }
      .axis-text-y{ text-anchor: end; dominant-baseline: middle;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .bar-label{ fill: #6B7280; font-size: 24px; font-family: 'MEBHeiHeiTi', sans-serif; font-weight: 500; text-anchor: middle; dominant-baseline: hanging; }
      .total-label{ fill: #f4efe7; font-size: 24px; font-family: 'MEBHeiHeiTi', sans-serif; font-weight: 700; text-anchor: middle; opacity: 0; }
      .legend{ position: absolute; top: 0; right: 0; display: flex; gap: 28px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .legend-item{ display: flex; align-items: center; gap: 10px; font-size: 18px; color: #6B7280; opacity: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .legend-dot{ width: 14px; height: 14px; border-radius: 2px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title-area">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <div class="legend" id="legend"></div>
          <svg class="chart-svg" id="chart-svg" viewBox="0 0 1696 600" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "渠道销售构成", subtitle: "线上与线下销售额季度占比", labels: "Q1,Q2,Q3,Q4", seriesNames: "线上,线下", values: "320,180;410,220;380,290;520,310", colors: "#00FF00,#6B7280", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#0E0E0E");
      document.documentElement.style.setProperty("--accent", v.accent);
      document.getElementById("root").style.backgroundColor = v.background;
      document.getElementById("root").style.color = v.foreground;
      for (const [id, value] of [["title", v.title], ["subtitle", v.subtitle]]) document.getElementById(id).textContent = value;

      const labels = v.labels.split(",");
      const seriesNames = v.seriesNames.split(",");
      const colors = v.colors.split(",");
      const rows = v.values.split(";").map(row => row.split(",").map(Number));
      const data = rows.map((values, i) => ({ label: labels[i] || `C${i + 1}`, values, total: values.reduce((a, b) => a + b, 0) }));
      const maxTotal = Math.max(...data.map(d => d.total)) * 1.15;

      const svg = document.getElementById("chart-svg");
      const chartW = 1696, chartH = 600, marginLeft = 80, marginRight = 40, marginTop = 60, marginBottom = 60;
      const plotW = chartW - marginLeft - marginRight, plotH = chartH - marginTop - marginBottom;
      const baselineY = marginTop + plotH;
      const barCount = data.length, barSlot = plotW / barCount, barWidth = Math.min(barSlot * 0.5, 220);

      const legend = document.getElementById("legend");
      seriesNames.forEach((name, i) => {
        const item = document.createElement("div"); item.className = "legend-item";
        const dot = document.createElement("span"); dot.className = "legend-dot"; dot.style.backgroundColor = colors[i] || v.accent;
        item.appendChild(dot); item.appendChild(document.createTextNode(name)); legend.appendChild(item);
      });

      for (let i = 0; i <= 5; i++) {
        const val = (maxTotal / 5) * i, y = baselineY - (val / maxTotal) * plotH;
        if (i > 0) {
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", marginLeft); line.setAttribute("x2", marginLeft + plotW); line.setAttribute("y1", y); line.setAttribute("y2", y);
          line.setAttribute("class", "grid-line"); line.setAttribute("opacity", "0"); svg.appendChild(line);
        }
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", marginLeft - 16); label.setAttribute("y", y); label.setAttribute("class", "axis-text axis-text-y"); label.textContent = Math.round(val); label.setAttribute("opacity", "0"); label.classList.add("y-label"); svg.appendChild(label);
      }

      const barElements = [];
      data.forEach((d, i) => {
        const x = marginLeft + barSlot * i + (barSlot - barWidth) / 2;
        let currentY = baselineY;
        const segments = [];
        d.values.forEach((value, j) => {
          const h = (value / maxTotal) * plotH;
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("x", x); rect.setAttribute("y", currentY); rect.setAttribute("width", barWidth); rect.setAttribute("height", 0); rect.setAttribute("fill", colors[j] || v.accent); rect.setAttribute("rx", 4); svg.appendChild(rect);
          segments.push({ rect, fromY: currentY, toY: currentY - h, height: h });
          currentY -= h;
        });
        const barLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
        barLabel.setAttribute("x", x + barWidth / 2); barLabel.setAttribute("y", baselineY + 28); barLabel.setAttribute("class", "bar-label"); barLabel.textContent = d.label; barLabel.setAttribute("opacity", "0"); svg.appendChild(barLabel);
        const totalLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
        totalLabel.setAttribute("x", x + barWidth / 2); totalLabel.setAttribute("y", currentY - 16); totalLabel.setAttribute("class", "total-label"); totalLabel.textContent = d.total; svg.appendChild(totalLabel);
        barElements.push({ segments, barLabel, totalLabel, baselineY });
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo(".legend-item", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.1, ease: "power2.out" }, 0.5);
      tl.fromTo(".grid-line", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out" }, 0.6);
      tl.fromTo(".y-label", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.05, ease: "power2.out" }, 0.7);
      barElements.forEach((be, i) => {
        be.segments.forEach((seg, j) => {
          tl.to(seg.rect, { attr: { height: seg.height, y: seg.toY }, duration: 0.8, ease: "power3.out" }, 0.9 + i * 0.15 + j * 0.08);
        });
        tl.fromTo(be.barLabel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.6 + i * 0.1);
        tl.fromTo(be.totalLabel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.8 + i * 0.1);
      });
      tl.to(".scene", { opacity: 0, scale: 1.01, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
