<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"内容分类树"},{"id":"subtitle","type":"string","label":"副标题","default":"从根主题到具体子类的层级展开"},{"id":"root","type":"string","label":"根节点","default":"自媒体内容"},{"id":"branches","type":"string","label":"分支名（逗号分隔，2 个）","default":"图文,视频"},{"id":"leaves","type":"string","label":"叶子名（逗号分隔，4 个）","default":"公众号,小红书,短视频,长视频"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 40px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 12px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 400; opacity: 0.55; }
      .chart-area{ position: relative; width: 100%; height: 680px; display: flex; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .svg-chart{ width: 1000px; height: 600px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .link{ stroke: rgba(244,239,231,0.18); stroke-width: 2; fill: none;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node{ fill: rgba(244,239,231,0.05); stroke: rgba(244,239,231,0.25); stroke-width: 2;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node.accent{ fill: color-mix(in srgb, var(--accent) 12%, transparent); stroke: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node-text{ fill: #f4efe7; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 20px; font-weight: 600; text-anchor: middle; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <svg class="svg-chart" id="svg-chart" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "内容分类树", subtitle: "从根主题到具体子类的层级展开", root: "自媒体内容", branches: "图文,视频", leaves: "公众号,小红书,短视频,长视频", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      const branches = String(v.branches).split(",").map(s => s.trim()).filter(Boolean);
      const leaves = String(v.leaves).split(",").map(s => s.trim()).filter(Boolean);
      const svg = document.getElementById("svg-chart");
      const W = 1000;
      const rootP = { x: W / 2, y: 80 };
      const branchPs = [{ x: W * 0.3, y: 260 }, { x: W * 0.7, y: 260 }];
      const leafPs = [{ x: W * 0.15, y: 460 }, { x: W * 0.38, y: 460 }, { x: W * 0.62, y: 460 }, { x: W * 0.85, y: 460 }];
      function node(p, name, isAccent) {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        const w = name.length * 22 + 40;
        rect.setAttribute("x", p.x - w / 2); rect.setAttribute("y", p.y - 28);
        rect.setAttribute("width", w); rect.setAttribute("height", 56); rect.setAttribute("rx", 10);
        rect.setAttribute("class", "node" + (isAccent ? " accent" : ""));
        g.appendChild(rect);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", p.x); text.setAttribute("y", p.y + 6);
        text.setAttribute("class", "node-text");
        text.textContent = name;
        g.appendChild(text);
        return g;
      }
      function line(a, b) {
        const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
        l.setAttribute("x1", a.x); l.setAttribute("y1", a.y + 28);
        l.setAttribute("x2", b.x); l.setAttribute("y2", b.y - 28);
        l.setAttribute("class", "link");
        return l;
      }
      svg.appendChild(line(rootP, branchPs[0]));
      svg.appendChild(line(rootP, branchPs[1]));
      svg.appendChild(line(branchPs[0], leafPs[0]));
      svg.appendChild(line(branchPs[0], leafPs[1]));
      svg.appendChild(line(branchPs[1], leafPs[2]));
      svg.appendChild(line(branchPs[1], leafPs[3]));
      svg.appendChild(node(rootP, v.root, true));
      branches.forEach((b, i) => svg.appendChild(node(branchPs[i], b, false)));
      leaves.forEach((l, i) => svg.appendChild(node(leafPs[i], l, false)));
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      document.querySelectorAll(".link").forEach((link, i) => {
        const len = Math.hypot(link.getAttribute("x2") - link.getAttribute("x1"), link.getAttribute("y2") - link.getAttribute("y1"));
        link.style.strokeDasharray = len; link.style.strokeDashoffset = len;
        tl.to(link, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 0.5 + i * 0.12);
      });
      document.querySelectorAll(".node").forEach((node, i) => {
        tl.fromTo(node, { opacity: 0, scale: 0.7, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)" }, 0.8 + i * 0.12);
      });
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
