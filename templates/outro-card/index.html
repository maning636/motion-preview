<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"mainText","type":"string","label":"主文案","default":"我们下期见"},{"id":"subText","type":"string","label":"副文案","default":"记得点赞 · 收藏 · 关注"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .main{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 120px; font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; color: var(--fg); text-align: center; margin: 0 0 32px; }
      .sub{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 32px; font-weight: 400; color: rgba(244,239,231,0.55); text-align: center; margin: 0 0 64px; }
      .line{ width: 120px; height: 6px; background: var(--accent); border-radius: 3px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="4.5" data-track-index="1">
        <h1 class="main" id="mainText">我们下期见</h1>
        <p class="sub" id="subText">记得点赞 · 收藏 · 关注</p>
        <div class="line" id="line"></div>
      </section>
    </div>
    <script>
      const fallback = { mainText: "我们下期见", subText: "记得点赞 · 收藏 · 关注", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.setProperty("--accent", v.accent);
      root.style.setProperty("--fg", v.foreground);
      document.getElementById("mainText").textContent = v.mainText;
      document.getElementById("subText").textContent = v.subText;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".main", { opacity: 0, scale: 0.85, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: "back.out(1.2)" }, 0.1);
      tl.fromTo(".sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.45);
      tl.fromTo(".line", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out", transformOrigin: "center" }, 0.8);
      tl.to(".line", { scaleX: 1.3, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 2 }, 1.6);
      tl.to(".scene", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.1);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
