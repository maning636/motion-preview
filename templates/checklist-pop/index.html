<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"上线前检查"},{"id":"item1","type":"string","label":"清单一","default":"默认文案能直接生成视频"},{"id":"item2","type":"string","label":"清单二","default":"透明 WebM 可以叠到剪辑里"},{"id":"item3","type":"string","label":"清单三","default":"模板能通过修改数据复用"},{"id":"duration","type":"number","label":"总时长（秒）","default":5},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="5" data-track-index="1">

        <div class="gridbg"></div>
        <header style="position:relative;z-index:2;display:flex;align-items:center;gap:24px;margin-bottom:48px;">
          <span class="chip"><b>CHECK</b>清单</span>
          <h1 id="title" class="num" style="margin:0;font-size:52px;"></h1>
        </header>
        <div id="list" style="display:flex;flex-direction:column;gap:26px;max-width:1200px;"></div>
        <style>
          .row{ display:flex; align-items:center; gap:26px; padding:26px 32px; border:1px solid #2A2A2E; border-radius:16px;
            background:rgba(255,255,255,.02); opacity:0; transform:translateX(120px); position:relative; overflow:hidden; }
          .row::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:0; background:var(--accent,#00FF00); }
          .box{ width:44px; height:44px; border:2px solid #6B7280; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; }
          .tick{ font-size:30px; color:var(--accent,#00FF00); opacity:0; transform:scale(.3); }
          .rtext{ font-size:32px; color:#F5F5F4; }
        </style>

      </section>
    </div>
    <script>
      const fallback = {"title": "上线前检查", "item1": "默认文案能直接生成视频", "item2": "透明 WebM 可以叠到剪辑里", "item3": "模板能通过修改数据复用", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 5;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("title").textContent = v.title;
      [v.item1, v.item2, v.item3].filter(Boolean).forEach((text) => {
        const row = document.createElement("div"); row.className = "row";
        row.innerHTML = `<span class="box"><span class="tick">✓</span></span><span class="rtext">${text}</span>`;
        $("list").appendChild(row);
      });
      tl.fromTo("header", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "power3.out" }, 0.1);
      tl.to(".row", { opacity: 1, x: 0, duration: 0.55, ease: "power3.out", stagger: 0.35 }, 0.4);
      tl.to(".tick", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(3)", stagger: 0.35 }, 0.9);
      tl.to(".row", { "--x": 1, duration: 0.01 }, 2.6);
      tl.to(".row", { css: { borderColor: "color-mix(in srgb, var(--accent) 35%, transparent)" }, duration: 0.5, stagger: 0.1 }, 2.6);
      tl.to(".scene", { y: -40, opacity: 0, duration: 0.5, ease: "power2.in" }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
