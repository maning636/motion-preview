<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"kicker","type":"string","label":"提示词","default":"记住这一点"},{"id":"point","type":"string","label":"重点句","default":"真正拉开差距的不是工具，而是你拆问题的能力。"},{"id":"source","type":"string","label":"说明","default":"适合结论句 / 金句 / 操作提醒"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="4.5" data-track-index="1">

        <div class="gridbg"></div>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;">
          <span class="chip" id="kicker"></span>
          <div style="position:relative;max-width:1300px;text-align:center;">
            <span id="mark" style="position:absolute;left:-2%;top:8%;width:104%;height:84%;background:color-mix(in srgb, var(--accent) 22%, transparent);transform:scaleX(0);transform-origin:left;border-radius:8px;"></span>
            <p id="point" class="num" style="position:relative;margin:0;font-size:64px;line-height:1.5;"></p>
          </div>
          <span id="source" style="font-size:22px;color:#9CA3AF;letter-spacing:.06em;"></span>
        </div>

      </section>
    </div>
    <script>
      const fallback = {"kicker": "记住这一点", "point": "真正拉开差距的不是工具，而是你拆问题的能力。", "source": "适合结论句 / 金句 / 操作提醒", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 4.5;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("kicker").textContent = v.kicker; $("point").textContent = v.point; $("source").textContent = v.source;
      tl.fromTo("#kicker", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.2);
      tl.fromTo("#point", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.4);
      tl.to("#mark", { scaleX: 1, duration: 0.7, ease: "power3.inOut" }, 1.3);
      tl.fromTo("#source", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.0);
      tl.to("#mark", { opacity: 0.6, duration: 0.4, yoyo: true, repeat: 1 }, 2.6);
      tl.to(".scene", { opacity: 0, y: -30, duration: 0.5 }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
