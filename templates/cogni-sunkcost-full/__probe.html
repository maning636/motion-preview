<script>window.__SET_IDS=["eyebrow", "foot", "h1", "sklh", "skln", "sklt", "skrh", "skrn", "skrt"];window.__SET_PREFIX=[];window.__PACKS=["dark", "cream", "mono", "night"];</script>
<script>
window.__errs = [];
window.addEventListener('error', function (e) {
  var m = (e.message || '') + '@' + (e.lineno || '?');
  window.__errs.push(m);
  /* 探针自己抛的也要落到 pre 上。否则页面上只剩一句 PROBE-STARTED，
     外面看见的还是「探针没跑起来」，等于白加 try/catch。 */
  var p = document.getElementById('__probe');
  if (p) p.textContent = 'PROBE-THREW: ' + m;
});
window.addEventListener('load', function () {
  /* pre 先建、最后再填。放在最前面是为了：哪怕后面任何一步抛了，
     页面上也还留着一个 <pre>，Python 侧能看见「探针跑到哪一步炸的」，
     而不是只丢一句「探针没跑起来」。 */
  var pre = document.createElement('pre');
  pre.id = '__probe';
  pre.textContent = 'PROBE-STARTED';
  document.body.appendChild(pre);
  try {
  var t = (window.__timelines && window.__timelines.main) || null;
  if (t) { t.pause(); t.time(t.duration()); }
  var stage = document.getElementById('stage');
  var sr = stage.getBoundingClientRect();
  var k = sr.width / 1920;
  var bad = [];
  /* ── F1 漏给 left/top ──────────────────────────────────────────
     「只给 top 不给 left」是这一族反复出现的错：position:absolute 的
     left 默认 auto，元素就贴到 x=0。在 1920 宽的舞台上 x=0 不刺眼，
     肉眼看过去只是「那个小圆怎么跑到左边去了」，
     而 DOM 读数里每个元素的位置都是「合法」的。
     判据：绝对定位 + 紧贴左沿 + 宽度还不到安全区（120px）——
     真正想靠左的版式元素不会这么窄这么靠边。 */
  [].slice.call(stage.querySelectorAll('*')).forEach(function (e) {
    var cs = getComputedStyle(e);
    if (cs.position !== 'absolute') return;
    var r = e.getBoundingClientRect();
    var x = (r.left - sr.left) / k, w = r.width / k;
    if (x <= 4 && w > 0 && w < 1150) {
      var id = e.id ? ('#' + e.id) : (e.className || e.tagName);
      bad.push('F1 疑似漏给 left：' + id + ' 绝对定位却贴在 x=' + x.toFixed(0)
        + '，宽 ' + w.toFixed(0) + '（安全区是 120）');
    }
  });

  /* ── F2 set() 的目标 id 不存在 ─────────────────────────────────
     set(id, val) 是 mix_base 共用的 helper，它对 getElementById 返回
     null 的情况**直接 return，不报错、不打日志**。
     写错一个 id，画面上就是那一条文案永远停在静态默认值，
     其它都正常——探针原来查不出来，因为元素确实都在、文字确实都有。
     这里把页面源码里所有 set('X' 的 id 收集进来（Python 侧注入），
     落定时逐个查在不在 DOM 里。 */
  (window.__SET_IDS || []).forEach(function (id) {
    if (!document.getElementById(id)) {
      bad.push('F2 set() 目标不存在：#' + id + ' —— set 对不存在的 id 静默失败，'

    }
  });
  /* ── F4 文字与包底色的对比度 ─────────────────────────────────
     这一条是被一次真实事故逼出来的：
     `mix_base.page()` 把舞台底色写死 #000、字色写死 #F4F1EA，
     而 cream / mono 两个包的 --pk-fg 是**深色**——深字压黑底，
     标题、标签、说明全糊掉，页面上不报任何错。
     换成 var(--pk-bg) / var(--pk-fg) 之后还差一截：
     次要文字的 rgba(244,241,234,.62) 仍然是浅色，浅底上照样隐形。
     于是又换成 --pk-muted。

     判据：有字的元素，计算色与 `--pk-bg` 合成后的对比度低于 2.0 就报。

    /* 一个模板不止一幅画面。只定格在末帧的话，第 2 秒压在实拍上的字幕、
       第 9 秒压在包底色上的尾卡，只会被看到后者——
       而这两处恰恰要用**不同的**那组变量。
       混剪 5 条全是这种结构，所以按时间轴采样若干帧一起判。
       代价只是多几次遍历，页面只加载一次。 */
    var SAMPLES = 5;
    for (var si = 0; si < SAMPLES; si++) {
      if (t) { t.time(t.duration() * (si / (SAMPLES - 1))); }
      void stage.offsetWidth;   /* 强制回流：seek 后样式要重算完再量色 */
      mediaRects = [].slice.call(stage.querySelectorAll('[data-media-layer]'))
        .filter(function (n) {
          var cs = getComputedStyle(n);
          var r = n.getBoundingClientRect();
          return cs.display !== 'none' && cs.visibility !== 'hidden'
            && +cs.opacity > .05 && r.width > 1 && r.height > 1;
        })
        .map(function (n) { return { n: n, r: n.getBoundingClientRect() }; });
      /* 不透明底板清单也要逐帧重算：米色手写卡这类满屏板
         是在时间轴上淡入淡出的，不跟着帧走就会拿到过期的板。 */
      plates = [].slice.call(stage.querySelectorAll('*')).filter(function (n) {
        var c = rgbaOf(getComputedStyle(n).backgroundColor);
        return c && c.a > .5 && !hiddenByAncestor(n);
      });
      scanOnce();
      noteOnStage();
    }
    f4samples += SAMPLES;
  }
  /* 可见性和包无关（切包不改几何），所以只判一次。
     放在包循环里会得到四份一模一样的报告，读的人以为有四个错。 */
  scanF6();
  scanF7();  document.documentElement.setAttribute('data-pack', homePack);

  /* F2b 动态拼接的前缀：set('v' + k, …) 这种静态扫不到具体 id，
     但至少能查「这个前缀一个元素都匹配不上」——
     实测真出过：注解写成了 set('v' + k, …) 而注解的元素叫 n0，
     结果注解灌进了 v0 那一列，而真正的取值一次没绑过。 */
  (window.__SET_PREFIX || []).forEach(function (p) {
    var n = 0;
    [].slice.call(stage.querySelectorAll('[id]')).forEach(function (e) {
      if (e.id.indexOf(p) === 0) n++;
    });
    if (!n) {
      bad.push('F2b set() 动态前缀 #' + p + '+… 一个元素都匹配不上 —— '
        + '前缀拼错了，绑的值灌进了别处或根本没绑上');
    }
  });

  /* ── F3 SVG 几何跑到 viewBox 外面 ─────────────────────────────
     SVG 默认 overflow:hidden。路径坐标一旦落在 viewBox 之外，
     被裁掉的是**几何**不是元素：<svg> 在 DOM 里、尺寸正常、
     getTotalLength() 也返回合理值，只有目检能看出少了一截。
     周期页的回环弧线就是这么废掉的（y=-40 落在 viewBox 0..300 之外）。 */
  [].slice.call(stage.querySelectorAll('svg')).forEach(function (svg) {
    var vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
    if (vb.length !== 4) return;
    [].slice.call(svg.querySelectorAll('path,polyline,line,circle,rect')).forEach(function (g) {
      var b;
      try { b = g.getBBox(); } catch (e) { return; }
      var over = [];
      if (b.x < vb[0] - 1) over.push('左 ' + Math.round(b.x - vb[0]));
      if (b.y < vb[1] - 1) over.push('上 ' + Math.round(b.y - vb[1]));
      if (b.x + b.width > vb[0] + vb[2] + 1) over.push('右 ' + Math.round(b.x + b.width - vb[0] - vb[2]));
      if (b.y + b.height > vb[1] + vb[3] + 1) over.push('下 ' + Math.round(b.y + b.height - vb[1] - vb[3]));
      if (over.length) {
        bad.push('F3 SVG 几何被裁：<' + g.tagName.toLowerCase() + '> 超出 viewBox ' + over.join('/')
          + ' px（SVG overflow:hidden，这几像素不会出现在画面上）');
      }
    });
  });

  } catch (ex) {
    /* 探针自己抛了也要说出来。原来是直接 return，页面上看不到 <pre>，
       Python 侧只报「探针没跑起来」，把「探针坏了」和「模板坏了」混成一句。 */
    bad.push('F0 探针自己抛了：' + (ex && ex.message ? ex.message : ex));
  }

  var rows = [];
  try {
    rows = [].slice.call(stage.querySelectorAll('*')).map(function (e) {
    var r = e.getBoundingClientRect();
    var cs = getComputedStyle(e);
    var id = e.id ? ('#' + e.id) : '';
    var cn = (typeof e.className === 'string' && e.className.trim())
      ? '.' + e.className.trim().split(/\s+/)[0] : e.tagName.toLowerCase();
    var name = (id || cn);
    while (name.length < 16) name += ' ';
    return name
      + ' x=' + ((r.left - sr.left) / k).toFixed(0)
      + ' y=' + ((r.top - sr.top) / k).toFixed(0)
      + ' w=' + (r.width / k).toFixed(0)
      + ' h=' + (r.height / k).toFixed(0)
      + ' op=' + (+cs.opacity).toFixed(2)
      + ' bg=' + (cs.backgroundColor === 'rgba(0, 0, 0, 0)' ? '-' : cs.backgroundColor)
      + ' 「' + (e.textContent || '').trim().slice(0, 16) + '」';
    });
  } catch (ex2) {
    bad.push('F0 逐元素读数抛了：' + (ex2 && ex2.message ? ex2.message : ex2));
  }
  /* 时间轴子补间清单：DUR 和 meta 里的 duration 对不上时，
     只有这一行能指出是哪个 fromTo 的 position 参数被当成了时长。 */
  var kids = '';
  if (t) {
    kids = t.getChildren(false, true, true).map(function (c) {
      return '   ' + c.startTime().toFixed(2) + ' → ' + c.endTime().toFixed(2)
        + '  ' + Number(c.duration()).toFixed(2) + 's';
    }).join('\n');
  }
  var pre2 = pre;
  pre2.textContent = 'DUR=' + (t ? t.duration().toFixed(2) : 'NO-TL')
    + '  ERRS=' + (window.__errs.length ? window.__errs.join(' | ') : 'none')
    + '  BAD=' + bad.length
    + '  F4扫=' + (typeof f4n === 'number' ? f4n : '?')
    + '/' + f4packs + '包×' + f4samples + '帧'
    + '  媒体层=' + (typeof f4media === 'number' ? f4media : '?')
    + '  F6补间=' + f6kids + '(带opacity ' + f6marked + ')'
    + '  F7未见=' + f7n
    + '\n' + (bad.length ? bad.map(function (x) { return '  ' + x; }).join('\n') : '  （无）')
    + '\n' + kids + '\n--\n' + rows.join('\n');
});
</script>
</head>
<body>
<div id="stage">

  <div class="eyebrow" id="eyebrow">THE SUNK COST</div>
  <div class="h1" id="h1" data-fit-max="76" data-fit-min="44">已经花掉的，不该影响下一个决定</div>

  <div class="sk" id="skL">
    <div class="kh" id="sklh">已经发生的</div>
    <div class="ki" id="sklt" data-fit-max="35" data-fit-min="22">过去式</div>
    <div class="kn" id="skln">改不了，也退不回来</div>
  </div>

  <div class="sk-eq" id="skeq">≠</div>

  <div class="sk key" id="skR" style="left:1000px">
    <div class="kh" id="skrh">还能决定的</div>
    <div class="ki" id="skrt" data-fit-max="35" data-fit-min="22">现在式</div>
    <div class="kn" id="skrn">这一条才该进决策</div>
  </div>

  <div class="footline" id="footline"></div>
  <div class="foot" id="footbox"><span id="foot">继续做，可能只是因为不想承认前面的错。</span><b>把两栏分开看，只看右边。</b></div>

</div>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  var tl = B.tl();
  /* 规格包：先定风格，再建任何元素。
     画面素材的配色**不跟着包走**——那是"底片"，用户自己的东西不能被模板改色；
     跟着包走的只有 UI 层（字色、强调色、描边、圆角、曲线）。这个边界必须守住。 */
  B.pack(v.pack);
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  function q(s) { return document.querySelector(s); }
  /* 素材位接真视频：留空就继续用 CSS 画面 */
  function live(n, src) {
    if (!src) return;
    var s = document.getElementById('s' + n), e = document.getElementById('v' + n);
    if (!s || !e) return;
    s.classList.add('live'); e.src = src;
    e.play().catch(function () {});
  }
  /* 景别缓推：v1/v3 里画面始终在极慢地动，这是「像镜头」的关键 */
  function push(n, at, dur, from, to, ease) {
    var s = q('#s' + n + ' .sky'), g = q('#s' + n + ' .glow'), r = q('#s' + n + ' .r2');
    if (s) tl.fromTo(s, { scale: from, y: '0%' },
      { scale: to, y: '-2%', duration: dur, ease: ease || 'none' }, at);
    if (g) tl.fromTo(g, { xPercent: -4, opacity: .8 },
      { xPercent: 5, opacity: 1, duration: dur, ease: 'none' }, at);
    if (r) tl.fromTo(r, { xPercent: 0 },
      { xPercent: -2.5, duration: dur, ease: 'none' }, at);
  }
  /* clip-path 形状插值。
     两个坑都在这里踩过：
       1. GSAP 各版本对 clipPath 字符串补间的处理不一致，所以不直接补间它，
          改成补间一个 {t:0→1} 的代理对象，onUpdate 里自己算 8 个点；
       2. **from 必须是编译期常量，不能从元素当前状态读。**
          settle 会把时间轴来回扫；一旦回退越过一个已完成的补间，
          GSAP 会把它按 ratio 0 重渲——onUpdate 拿到的就是起点，
          形状会「弹回矩形」。写成常量后，形状是 t 的纯函数，
          停在任何一帧算出来都一样。
     相邻两段的 from 必须等于上一段的 to，这条由 Python 侧保证。 */
  function polyStr(pts) {
    return 'polygon(' + pts.map(function (p) {
      return p[0].toFixed(2) + '% ' + p[1].toFixed(2) + '%'; }).join(',') + ')';
  }
  function morph(el, from, to, at, dur, ease) {
    if (!el || !to || !from || from.length !== to.length) return;
    var st = { t: 0 };
    tl.to(st, { t: 1, duration: dur == null ? .7 : dur, ease: ease || 'power2.inOut',
      onUpdate: function () {
        el.style.clipPath = polyStr(from.map(function (p, i) {
          return [p[0] + (to[i][0] - p[0]) * st.t,
                  p[1] + (to[i][1] - p[1]) * st.t];
        }));
      } }, at);
  }
  set('eyebrow', v.eyebrow); set('h1', v.title); set('foot', v.foot);
  set('sklh', v.leftLabel); set('sklt', v.leftTitle); set('skln', v.leftNote);
  set('skrh', v.rightLabel); set('skrt', v.rightTitle); set('skrn', v.rightNote);

  tl.fromTo('#eyebrow', { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: .4 }, 0);
  tl.fromTo('#h1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .08);
  /* 左边先出、右边后出：观众必须先认完「已经花了」，才谈得上把它踢出决策 */
  tl.fromTo('#skL', { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: .5,
    ease: 'power2.out' }, .32);
  tl.fromTo('#sklt', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .42 }, .56);
  tl.fromTo('#skln', { opacity: 0 }, { opacity: 1, duration: .4 }, .68);
  tl.fromTo('#skeq', { opacity: 0, scale: .6 },
    { opacity: 1, scale: 1, duration: .4, ease: 'back.out(2.2)' }, 1.24);
  tl.fromTo('#skR', { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: .55,
    ease: 'power3.out' }, 1.5);
  tl.fromTo('#skrt', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .44 }, 1.74);
  tl.fromTo('#skrn', { opacity: 0 }, { opacity: 1, duration: .4 }, 1.86);
  tl.fromTo('#footline', { width: 0 }, { width: 420, duration: .5, ease: 'power2.out' }, 2.42);
  tl.fromTo('#footbox', { opacity: 0 }, { opacity: 1, duration: .5 }, 2.56);

  B.hold(tl, 3.7, .5);
  B.fitAll();

})();
</script>
</body>
</html>
