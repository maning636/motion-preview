<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "这套流程替你做的四件事"}, {"id": "cards", "type": "string", "label": "卡片（标题|说明，逗号分隔×4）", "default": "脚本成稿|按选题自动拉出初稿,素材齐套|图与占位一次配齐,批量渲染|模板套变量秒级出片,定时分发|到点自动发完全平台"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #070B09; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #EAF4EE; }
      .g-bg{ position: absolute; inset: 0;
        background: radial-gradient(900px 520px at 22% 18%, rgba(0,255,140,.07), transparent 60%),
          radial-gradient(1000px 600px at 82% 86%, rgba(64,224,208,.06), transparent 60%); }
      .g-head{ position: absolute; left: 220px; top: 130px; display: flex; align-items: center; gap: 18px; }
      .g-dot{ width: 18px; height: 18px; border-radius: 50%; background: #00FF00; box-shadow: 0 0 20px #00FF00; }
      .g-head h1{ font-size: 56px; font-weight: 700; color: #F4FBF7; }
      .g-grid{ position: absolute; left: 220px; right: 220px; top: 280px; bottom: 130px;
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 36px; }
      .g-card{ position: relative; border-radius: 22px; background: rgba(14,26,20,.56);
        -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,.16); padding: 44px 48px;
        box-shadow: 12px 14px 0 rgba(4,9,7,.35); }
      .g-chip{ width: 46px; height: 10px; border-radius: 5px; margin-bottom: 22px;
        background: linear-gradient(90deg, #00FF00, #40E0D0); }
      .g-ct{ font-size: 40px; font-weight: 700; color: #F4FBF7; margin-bottom: 14px; }
      .g-cd{ font-size: 26px; line-height: 1.5; color: #8FAE9E; word-break: break-all; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="g-bg"></div>
      <div class="g-head" id="head"><span class="g-dot"></span><h1 id="title"></h1></div>
      <div class="g-grid" id="grid"></div>

    </div>
    <script>
      const fallback = {"title": "这套流程替你做的四件事", "cards": "脚本成稿|按选题自动拉出初稿,素材齐套|图与占位一次配齐,批量渲染|模板套变量秒级出片,定时分发|到点自动发完全平台", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      $("title").textContent = V.title;
      const cards = split(V.cards).slice(0, 4);
      const grid = $("grid");
      cards.forEach((txt) => {
        const [ct, cd] = txt.split("|").map((x) => (x ?? "").trim());
        const d = document.createElement("div");
        d.className = "g-card";
        d.innerHTML = `<div class="g-chip"></div><div class="g-ct"></div><div class="g-cd"></div>`;
        d.querySelector(".g-ct").textContent = ct ?? txt;
        d.querySelector(".g-cd").textContent = cd ?? "";
        grid.appendChild(d);
      });
      tl.fromTo("#head", { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.1);
      document.querySelectorAll(".g-card").forEach((el, i) => {
        tl.fromTo(el, { y: 60, opacity: 0, scale: 0.92 },
          { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.5 + i * 0.18);
      });
      window.__timelines.main = tl;

    </script>
  </body>
</html>
