<script>
(function () {

  var v = B.vars();

    s.classList.add('live'); e.src = src;

    if (s) tl.fromTo(s, { scale: from, y: '0%' },
      { scale: to, y: '-2%', duration: dur, ease: ease || 'none' }, at);
    if (g) tl.fromTo(g, { xPercent: -4, opacity: .8 },
      { xPercent: 5, opacity: 1, duration: dur, ease: 'none' }, at);

  /* clip-path 形状插值。
     两个坑都在这里踩过：
       1. GSAP 各版本对 clipPath 字符串补间的处理不一致，所以不直接补间它，

  set('nm2', v.r3); set('amt2', v.a3); set('why2', v.w3);

  tl.fromTo('#eb', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .4 }, 0);
  tl.fromTo('#h1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .08);
  for (var k = 0; k < 3; k++) {
    var at = .42 + k * .46;
    tl.fromTo('#lg' + k, { opacity: 0, x: -22 },
        { opacity: 1, x: 0, duration: .42, ease: 'power3.out' }, at);
    /* 条宽按文案里的百分数真算，不写死。
       写死的话换一组数据，条和数字就对不上了——
       而这种错在画面上表现为「条好像有点短」，很难一眼看出是数据问题。 */
    var p = parseFloat(document.getElementById('amt' + k).textContent
      .replace(/[^0-9.]/g, '')) || 0;
    var all = [parseFloat(document.getElementById('amt0').textContent.replace(/[^0-9.]/g, '')) || 1,
               parseFloat(document.getElementById('amt1').textContent.replace(/[^0-9.]/g, '')) || 1,
               parseFloat(document.getElementById('amt2').textContent.replace(/[^0-9.]/g, '')) || 1];
    var max = Math.max.apply(null, all) || 1;
    tl.fromTo('#fill' + k, { width: '0%' },
        { width: Math.min(100, p / max * 100) + '%',
          duration: .62, ease: 'power3.out' }, at + .16);
  }
  tl.fromTo('#total', { opacity: 0, y: 24 },
      { opacity: 1, y: 0, duration: .55, ease: 'power3.out' }, 1.9);
  tl.fromTo('#fline', { width: 0 }, { width: 200, duration: .5, ease: 'power3.out' }, 2.16);
  tl.fromTo('#foot', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .5 }, 2.28);
  B.hold(tl, 3.6, .6);
  B.fitAll();

})();
</script>
</body>
</html>
