<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"theme","type":"string","label":"中心主题","default":"AI 产品开发"},{"id":"branches","type":"string","label":"分支（逗号分隔，建议 6 个）","default":"数据,模型,工程,产品,运营,安全"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 80px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ position: absolute; top: 56px; left: 80px; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 22px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.45; }
      .svg-layer{ position: absolute; inset: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .center-node{ position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 220px; height: 220px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .center-text{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.2; color: var(--bg); }
      .branch{ position: absolute; display: flex; align-items: center; gap: 14px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .branch-dot{ width: 18px; height: 18px; border-radius: 50%; background: var(--accent); flex-shrink: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .branch-text{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 28px; font-weight: 500; line-height: 1.2; max-width: 240px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title">Mind Map</div>
        <svg class="svg-layer" id="lines" viewBox="0 0 1920 1080" preserveAspectRatio="none"></svg>
        <div class="center-node" id="centerNode">
          <div class="center-text" id="themeText"></div>
        </div>
        <div id="branches"></div>
      </section>
    </div>
    <script>
      const fallback = { theme: "AI 产品开发", branches: "数据,模型,工程,产品,运营,安全", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      root.style.setProperty("--bg", v.background);
      document.getElementById("themeText").textContent = v.theme;
      const branches = String(v.branches).split(",").map(s => s.trim()).filter(Boolean);
      const cx = 960, cy = 540, radius = 340;
      const container = document.getElementById("branches");
      const svg = document.getElementById("lines");
      const angleOffset = -Math.PI / 2;
      const angleStep = (2 * Math.PI) / Math.max(branches.length, 1);
      const positions = [];
      branches.forEach((branch, i) => {
        const rad = angleOffset + i * angleStep;
        const bx = cx + radius * Math.cos(rad);
        const by = cy + radius * Math.sin(rad);
        const el = document.createElement("div");
        el.className = "branch";
        el.innerHTML = `<span class="branch-dot"></span><span class="branch-text">${branch}</span>`;
        const rectW = 280, rectH = 60;
        el.style.left = (bx - rectW / 2) + "px";
        el.style.top = (by - rectH / 2) + "px";
        el.style.width = rectW + "px";
        container.appendChild(el);
        positions.push({ bx, by });
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", cx); line.setAttribute("y1", cy); line.setAttribute("x2", bx); line.setAttribute("y2", by);
        line.setAttribute("stroke", v.accent); line.setAttribute("stroke-width", "2"); line.setAttribute("class", "branch-line");
        svg.appendChild(line);
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: -16 }, { opacity: 0.45, y: 0, duration: 0.4, ease: "power2.out" }, 0.1);
      tl.fromTo(".center-node", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 0.3);
      document.querySelectorAll(".branch-line").forEach((line, i) => {
        const len = Math.sqrt(Math.pow(positions[i].bx - cx, 2) + Math.pow(positions[i].by - cy, 2));
        line.style.strokeDasharray = len; line.style.strokeDashoffset = len;
        tl.to(line, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.7 + i * 0.08);
      });
      document.querySelectorAll(".branch").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 1.0 + i * 0.08);
      });
      tl.to(".scene", { opacity: 0, scale: 1.01, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
