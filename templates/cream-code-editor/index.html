<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "filename", "type": "string", "label": "文件名", "default": "rag.py"}, {"id": "language", "type": "string", "label": "语言", "default": "Python 3.12"}, {"id": "code", "type": "string", "label": "代码行（\\n 分隔）", "default": "def retrieve(query, index):\n    hits = index.search(query, k=5)\n    contexts = [h.text for h in hits]\n    return contexts\n\ndef generate(query, contexts):\n    prompt = build_prompt(query, contexts)\n    return llm(prompt)"}, {"id": "highlightLine", "type": "number", "label": "高亮行号（1-based）", "default": 3}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ===== 奶油纸面贴纸工作台 · 设计令牌（见 design-systems/sticker-workbench/DESIGN.md） ===== */
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden;
        font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--background, #F5F0E6); color: var(--foreground, #1D1D20); }
      .outer-frame{ position: absolute; inset: 0; border: 10px solid #1D1D20; pointer-events: none; z-index: 40; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; font-weight: 700; }
      .fredoka{ font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif; }
      .corner-tag{ position: absolute; top: 74px; left: 120px; z-index: 30;
        background: #FFFDF7; border: 4px solid #1D1D20; border-radius: 8px;
        box-shadow: 10px 10px 0 #2A292B; padding: 14px 22px; transform: rotate(-2deg); }
      .corner-tag span{ font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif; font-weight: 700;
        font-size: 24px; letter-spacing: 0.06em; text-transform: uppercase; }
      .corner-index{ position: absolute; top: 84px; right: 120px; z-index: 30;
        font-size: 20px; color: #4D4A48; }
      .scene{ position: absolute; inset: 0; }
      .panel{ background: #FFFDF7; border: 4px solid #1D1D20; border-radius: 10px;
        box-shadow: 10px 10px 0 #2A292B; }
      .chip{ display: inline-block; padding: 8px 20px; border: 4px solid #1D1D20; border-radius: 8px;
        box-shadow: 6px 6px 0 #2A292B; font-size: 26px; font-weight: 800; line-height: 1.1; }
      .chip-blue{ background: #3E7BF2; color: #FFFDF7; }
      .chip-pink{ background: #F13B88; color: #FFFDF7; }
      .chip-orange{ background: #FF9F1C; color: #1D1D20; }
      .chip-lime{ background: #B9E833; color: #1D1D20; }
      .chip-violet{ background: #B99AF7; color: #1D1D20; }
      .chip-paper{ background: #FFFDF7; color: #1D1D20; }
      .ttl{ font-size: 52px; font-weight: 900; line-height: 1.2; }
      .sub{ font-size: 30px; font-weight: 700; line-height: 1.35; color: #4D4A48; }
      .num{ font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif; font-weight: 700; }
      .title-center{ position: absolute; top: 200px; left: 0; width: 100%; text-align: center; z-index: 20; }
      .sub-center{ position: absolute; top: 286px; left: 0; width: 100%; text-align: center; z-index: 20; }

      .wwrap{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .win{ width: 1280px; overflow: hidden; }
      .wbar{ display: flex; align-items: center; gap: 10px; padding: 18px 24px;
        border-bottom: 4px solid #1D1D20; background: #FFFDF7; }
      .wbar i{ width: 22px; height: 22px; border-radius: 50%; border: 3px solid #1D1D20; }
      .wbar i:nth-child(1){ background: #F13B88; } .wbar i:nth-child(2){ background: #FF9F1C; }
      .wbar i:nth-child(3){ background: #B9E833; }
      .wbar .wt{ margin-left: 14px; font-size: 22px; font-weight: 700; color: #4D4A48; }
      .wbody{ padding: 36px 40px; min-height: 420px; }
      .wurl{ border: 3px solid #1D1D20; border-radius: 8px; padding: 10px 18px;
        font-size: 22px; color: #4D4A48; margin-bottom: 26px; }
      .whead{ font-size: 44px; font-weight: 900; line-height: 1.25; margin-bottom: 16px; }
      .wtext{ font-size: 26px; font-weight: 700; color: #4D4A48; line-height: 1.55; }
      .wimg{ margin-top: 22px; height: 130px; border: 4px dashed #C9C0B2; border-radius: 10px;
        display: flex; align-items: center; justify-content: center; font-size: 24px; color: #4D4A48; font-weight: 700; }
      .wterm{ background: #1D1D20; border-radius: 0 0 10px 10px; padding: 36px 40px; min-height: 420px; }
      .wterm .tc{ font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 700;
        color: #B9E833; white-space: pre-wrap; line-height: 1.6; }
      .wterm .to{ font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 700;
        color: #FFFDF7; white-space: pre-wrap; line-height: 1.6; margin-top: 18px; }
      .wterm .tm{ margin-top: 26px; font-family: 'IBM Plex Mono', monospace; font-size: 20px; color: #C9C0B2; }
      .wcode{ font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 700; line-height: 1.7; }
      .wcode .ln{ display: flex; gap: 22px; padding: 0 12px; }
      .wcode .ln .no{ width: 44px; text-align: right; color: #C9C0B2; flex: none; }
      .wcode .ln.hl{ background: #B9E833; border-radius: 6px; }
      .wmsg{ max-width: 78%; padding: 18px 24px; border: 4px solid #1D1D20; border-radius: 14px;
        font-size: 26px; font-weight: 700; line-height: 1.4; margin-bottom: 18px; box-shadow: 6px 6px 0 #2A292B; }
      .wmsg.user{ margin-left: auto; background: #3E7BF2; color: #FFFDF7; }
      .wmsg.bot{ background: #FFFDF7; }
      .wkpis{ display: flex; gap: 26px; margin-bottom: 30px; }
      .wkpi{ flex: 1; border: 4px solid #1D1D20; border-radius: 10px; padding: 22px;
        text-align: center; box-shadow: 6px 6px 0 #2A292B; background: #FFFDF7; }
      .wkpi .kv{ font-size: 56px; line-height: 1; color: #3E7BF2; }
      .wkpi .kl{ font-size: 22px; font-weight: 800; margin-top: 8px; }
      .wmini{ display: flex; align-items: flex-end; gap: 14px; height: 160px; }
      .wmini i{ flex: 1; background: #3E7BF2; border: 3px solid #1D1D20; border-radius: 6px 6px 0 0; }
      .wcols{ display: flex; gap: 24px; }
      .wcol{ flex: 1; border: 4px solid #1D1D20; border-radius: 10px; padding: 18px; background: #FFFDF7; }
      .wcol.focus{ box-shadow: 0 0 0 6px #B9E833, 8px 8px 0 #2A292B; }
      .wcol .wct{ font-size: 24px; font-weight: 900; margin-bottom: 14px; }
      .wcard{ border: 3px solid #1D1D20; border-radius: 8px; padding: 12px 16px;
        font-size: 22px; font-weight: 700; margin-bottom: 12px; background: #FFFDF7;
        box-shadow: 4px 4px 0 #2A292B; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="outer-frame" id="frame"></div>
      <div class="corner-tag" id="cornerTag"><span>CODE EDITOR</span></div>
      <div class="corner-index mono" id="cornerIndex">03 / MOCK</div>
      <svg width="0" height="0" style="position:absolute"><defs>
        <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
          <path d="M1 1 L11 6 L1 11 Z" fill="#1D1D20" />
        </marker>
      </defs></svg>
      <section class="scene" id="rootScene" data-start="0" data-duration="6" data-track-index="1">
        <div class="wwrap"><div class="panel win" id="wWin">
          <div class="wbar"><i></i><i></i><i></i><span class="wt mono" id="wTitle"></span></div>
          <div class="wbody" id="wBody"></div>
        </div></div>
      </section>
    </div>
    <script>
      const FB = {"filename": "rag.py", "language": "Python 3.12", "code": "def retrieve(query, index):\n    hits = index.search(query, k=5)\n    contexts = [h.text for h in hits]\n    return contexts\n\ndef generate(query, contexts):\n    prompt = build_prompt(query, contexts)\n    return llm(prompt)", "highlightLine": 3};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      const $ = (id) => document.getElementById(id);
      const T = (id, val) => { const el = $(id); if (el) el.textContent = val; };
      const SP = (s) => String(s ?? '').split(',').map(x => x.trim()).filter(Boolean);
      const SPN = (s) => SP(s).map(Number);
      const scene = () => $('rootScene');
      function el(tag, cls, parent, text){ const e = document.createElement(tag);
        if (cls) e.className = cls; if (text != null) e.textContent = text;
        (parent || scene()).appendChild(e); return e; }
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const SPRING = "back.out(1.4)";
      function pop(sel, at, dx){ tl.fromTo(sel, { opacity: 0, x: dx || 0, scale: 0.88 },
        { opacity: 1, x: 0, scale: 1, duration: 0.38, ease: SPRING }, at); }
      function fade(sel, at){ tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.24 }, at); }
      function drawArrow(line, at){ const len = line.getAttribute('stroke-dasharray');
        tl.set(line, { attr: { "marker-end": "url(#arrowHead)" } }, at);
        tl.fromTo(line, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, at); }
      tl.fromTo("#frame", { opacity: 0 }, { opacity: 1, duration: 0.18 }, 0);
      tl.fromTo(["#cornerTag", "#cornerIndex"], { opacity: 0 }, { opacity: 1, duration: 0.18 }, 0);
      T("wTitle", v.filename || "code");
      const b = $("wBody"); const w = el("div", "wcode", b);
      const hl = Number(v.highlightLine) || -1;
      String(v.code || "").split("\n").forEach((line, i) => {
        const r = el("div", "ln" + (i + 1 === hl ? " hl" : ""), w);
        el("span", "no", r, String(i + 1)); el("span", "", r, line || " ");
        tl.fromTo(r, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.2 }, 0.6 + i * 0.09); });
      const lg = el("span", "chip chip-blue", b, v.language);
      lg.style.cssText = "position:absolute;top:96px;right:360px;font-size:20px;padding:6px 14px";
      tl.fromTo("#wWin", { opacity: 0, y: 40, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: SPRING }, 0.2);
      fade(lg, 0.5);
      tl.to("#rootScene", { opacity: 0, duration: 0.28, ease: "power2.in" }, 5.5);
      tl.to(["#cornerTag", "#cornerIndex"], { opacity: 0, duration: 0.28 }, 5.5);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
