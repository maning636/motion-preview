<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "一条内容的诞生链路"}, {"id": "steps", "type": "string", "label": "步骤列表（逗号分隔，3~4 个）", "default": "选题定调,脚本成稿,渲染成片,分发复盘"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #FCFBF6; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #1D1D20;
        background-image: linear-gradient(rgba(29,29,32,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(29,29,32,.045) 1px, transparent 1px); background-size: 64px 64px; }
      .b-head{ position: absolute; left: 140px; top: 130px; }
      .b-head h1{ font-size: 62px; font-weight: 900; }
      .b-under{ width: 400px; height: 20px; margin-top: 12px; background: #1E7A46;
        border-radius: 10px; transform-origin: left center; }
      .b-flow{ position: absolute; left: 140px; right: 140px; top: 400px; height: 360px; }
      .b-notes{ position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; }
      .note{ position: relative; background: #FFE98A; border-radius: 6px; padding: 36px 30px;
        font-size: 32px; font-weight: 800; line-height: 1.3; text-align: center;
        display: flex; align-items: center; justify-content: center; min-height: 220px;
        box-shadow: 6px 7px 0 rgba(29,29,32,.14); word-break: break-all; }
      .note::before{ content: ""; position: absolute; left: 50%; top: -15px; width: 90px; height: 28px;
        margin-left: -45px; background: rgba(255,255,255,.6); transform: rotate(-2deg);
        border-left: 1px solid rgba(29,29,32,.08); border-right: 1px solid rgba(29,29,32,.08); }
      .note .idx{ position: absolute; left: 18px; top: 12px; font-size: 20px; color: rgba(29,29,32,.45); }
      .b-arrows{ position: absolute; inset: 0; pointer-events: none; overflow: visible; }
      .b-arrows path{ fill: none; stroke: #1E7A46; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="b-head"><h1 id="title"></h1><div class="b-under" id="under"></div></div>
      <div class="b-flow" id="flow">
        <svg class="b-arrows" id="arrows"></svg>
        <div class="b-notes" id="notes"></div>
      </div>

    </div>
    <script>
      const fallback = {"title": "一条内容的诞生链路", "steps": "选题定调,脚本成稿,渲染成片,分发复盘", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      $("title").textContent = V.title;
      const steps = split(V.steps).slice(0, 4);
      const rots = [-2.5, 2, -1.5, 2.5];
      const notesEl = $("notes");
      const w = steps.length >= 4 ? 340 : 430;
      steps.forEach((s, i) => {
        const d = document.createElement("div");
        d.className = "note";
        d.style.width = w + "px";
        d.innerHTML = `<span class="idx mono">0${i + 1}</span><span class="txt"></span>`;
        d.querySelector(".txt").textContent = s;
        notesEl.appendChild(d);
      });
      const svg = $("arrows");
      const paths = [];
      const kids = notesEl.children;
      for (let i = 0; i < kids.length - 1; i++) {
        const a = kids[i], b = kids[i + 1];
        const x1 = a.offsetLeft + a.offsetWidth + 10;
        const y = a.offsetTop + a.offsetHeight / 2 - 6;
        const x2 = b.offsetLeft - 12;
        const mx = (x1 + x2) / 2;
        const ns = "http://www.w3.org/2000/svg";
        const p = document.createElementNS(ns, "path");
        p.setAttribute("d", `M ${x1} ${y} Q ${mx} ${y - 34} ${x2 - 14} ${y}`);
        const h1 = document.createElementNS(ns, "path");
        h1.setAttribute("d", `M ${x2 - 30} ${y - 16} L ${x2 - 8} ${y} L ${x2 - 30} ${y + 16}`);
        svg.appendChild(p); svg.appendChild(h1);
        paths.push(p, h1);
      }
      paths.forEach((p) => {
        const l = p.getTotalLength();
        p.style.strokeDasharray = String(l);
        p.style.strokeDashoffset = String(l);
      });
      tl.fromTo("#title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.1);
      tl.fromTo("#under", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.35);
      document.querySelectorAll(".note").forEach((el, i) => {
        tl.fromTo(el, { scale: 0.55, opacity: 0, rotation: rots[i % 4] + 10 },
          { scale: 1, opacity: 1, rotation: rots[i % 4], duration: 0.46, ease: "back.out(2.4)" }, 0.65 + i * 0.24);
      });
      paths.forEach((p, i) => {
        tl.to(p, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 0.95 + Math.floor(i / 2) * 0.24 + (i % 2) * 0.14);
      });
      window.__timelines.main = tl;

    </script>
  </body>
</html>
