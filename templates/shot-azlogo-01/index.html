<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "logo", "type": "string", "label": "Logo文字", "default": "MOTION"}, {"id": "eggBtn", "type": "string", "label": "彩蛋按钮", "default": "立即体验"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#lg{ position:absolute; left:50%; top:50%; display:flex; align-items:center; gap:26px; opacity:0; }
#lg .sq{ width:74px; height:74px; border-radius:18px; background:var(--accent); }
#lg .lt{ font-size:84px; letter-spacing:14px; color:var(--fg); }
#egg{ position:absolute; inset:0; display:none; background:#0A0A0F; }
#egg .panel{ position:absolute; left:-260px; top:160px; width:2400px; height:760px; border-radius:28px;
  background:#15151D; border:1px solid rgba(255,255,255,.14); transform:scale(2.4); transform-origin:1200px 380px; }
#egg .row{ position:absolute; left:960px; top:330px; display:flex; gap:30px; align-items:center; }
#egg .btn{ padding:22px 54px; border-radius:999px; background:var(--accent); color:#0A0A0F; font-size:34px; }
#egg .btn2{ padding:22px 54px; border-radius:999px; border:2px solid rgba(255,255,255,.3); color:rgba(255,255,255,.75); font-size:34px; }
#egg .tick{ position:absolute; left:908px; top:352px; width:16px; height:16px; border-radius:50%; background:var(--accent); opacity:0; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
<div id="lg"><div class="sq"></div><div class="lt" id="lt"></div></div><div id="egg"><div class="panel"><div class="row"><div class="btn" id="eb"></div><div class="btn2">了解更多</div></div><div class="tick"></div></div></div>
    </div>
    <script>
      const FB = {"logo": "MOTION", "eggBtn": "立即体验", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#lt').textContent=v.logo||'';$('#eb').textContent=v.eggBtn||'';
gsap.set('#lg',{xPercent:-50,yPercent:-50,scale:.96});
// 收黑 6f → logo 入场 10f → 定住 → 12f 彩蛋硬切 → 切回 logo 真静止
tl.to('#lg',{opacity:1,scale:1,duration:F(10),ease:'power2.out'},F(6));
// 彩蛋 f60-72 硬切插入（logo 层原地不动，回来逐像素一致）
tl.set('#egg',{display:'block'},F(60));
tl.set('#egg .tick',{opacity:1},F(64));   // tick 圆点只亮第 4-5f
tl.set('#egg .tick',{opacity:0},F(66));
tl.set('#egg',{display:'none'},F(72));
tl.to({},{duration:F(78)},F(72)); // 真静止收尾

      window.__timelines.main = tl;
    </script>
  </body>
</html>
