<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "看板标题", "default": "自动化运行看板"}, {"id": "bignum", "type": "string", "label": "大数字", "default": "12480"}, {"id": "sub", "type": "string", "label": "大数字说明", "default": "本周已自动完成的任务"}, {"id": "submetrics", "type": "string", "label": "副指标（小卡1标签,小卡2标签,完成率,小卡1数值）", "default": "今日新增,任务完成率,87,326"}, {"id": "light", "type": "color", "label": "光源色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #070B09; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #EAF4EE; }
      .g-bg{ position: absolute; inset: 0;
        background: radial-gradient(900px 520px at 22% 18%, rgba(0,255,140,.07), transparent 60%),
          radial-gradient(1000px 600px at 82% 86%, rgba(64,224,208,.06), transparent 60%); }
      .g-num{ font-family: 'MiSans SemiBold', 'PingFang SC', sans-serif; }
      /* 主玻璃面板：dark-green-black 54% 不透明 + blur(13px) + 34px 圆角 + 16% 边缘亮线 */
      .g-panel{ position: absolute; left: 220px; top: 190px; width: 1180px; height: 620px;
        border-radius: 34px; background: rgba(14,26,20,.54);
        -webkit-backdrop-filter: blur(13px); backdrop-filter: blur(13px);
        border: 1px solid rgba(255,255,255,.16); }
      /* 卡后 20px 深色 slab 外探 3px，制造厚度 */
      .g-panel::before{ content: ""; position: absolute; inset: 10px; border-radius: 28px;
        transform: translate(3px, 3px); background: rgba(4,9,7,.55); z-index: -1;
        box-shadow: 0 0 0 20px rgba(4,9,7,.35); }
      .g-inner{ position: absolute; inset: 0; padding: 64px 72px; }
      .g-head{ display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700;
        color: #A9C4B6; letter-spacing: .04em; }
      .g-dot{ width: 16px; height: 16px; border-radius: 50%; background: var(--light, #00FF00);
        box-shadow: 0 0 18px var(--light, #00FF00); }
      .g-big{ margin-top: 36px; font-size: 190px; line-height: 1; color: #F4FBF7; }
      .g-sub{ margin-top: 18px; font-size: 30px; color: #8FAE9E; }
      .g-bars{ position: absolute; left: 72px; right: 72px; bottom: 64px; height: 130px;
        display: flex; align-items: flex-end; gap: 22px; }
      .g-bars i{ flex: 1; border-radius: 10px 10px 0 0; transform-origin: bottom; transform: scaleY(0);
        background: linear-gradient(180deg, var(--light, #00FF00), color-mix(in srgb, var(--accent) 18%, transparent)); opacity: .85; }
      /* 浮动玻璃小卡：22px 圆角 */
      .g-card{ position: absolute; border-radius: 22px; background: rgba(14,26,20,.56);
        -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,.16); padding: 34px 40px;
        box-shadow: 12px 14px 0 rgba(4,9,7,.35); }
      .g-c1{ left: 1290px; top: 130px; width: 400px; }
      .g-c2{ left: 1290px; top: 600px; width: 400px; }
      .g-clabel{ font-size: 24px; color: #8FAE9E; margin-bottom: 12px; }
      .g-cnum{ font-size: 72px; line-height: 1; color: #F4FBF7; }
      .g-track{ height: 20px; border-radius: 10px; background: rgba(255,255,255,.10); overflow: hidden; margin: 16px 0; }
      .g-fill{ height: 100%; width: 100%; border-radius: 10px; transform-origin: left; transform: scaleX(0);
        background: linear-gradient(90deg, var(--light, #00FF00), #40E0D0); }
      /* 巡游光源：白热核 blur 28px + 两倍大暗晕，screen 混合 */
      .g-light{ position: absolute; left: 0; top: 0; width: 260px; height: 260px; margin: -130px 0 0 -130px;
        mix-blend-mode: screen; pointer-events: none; filter: hue-rotate(0deg); }
      .g-halo{ position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(ellipse at center, var(--light, #00FF00) 0%, transparent 65%);
        opacity: .5; filter: blur(30px); }
      .g-core{ position: absolute; left: 65px; top: 65px; width: 130px; height: 130px; border-radius: 50%;
        background: radial-gradient(ellipse at center, #FFFFFF 0%, var(--light, #00FF00) 55%, transparent 75%);
        opacity: .9; filter: blur(28px); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="g-bg"></div>
      <div class="g-panel" id="panel">
        <div class="g-inner">
          <div class="g-head"><span class="g-dot"></span><span id="title"></span></div>
          <div class="g-big g-num" id="big">0</div>
          <div class="g-sub" id="sub"></div>
          <div class="g-bars" id="bars"><i style="height:42%"></i><i style="height:58%"></i><i style="height:50%"></i><i style="height:74%"></i><i style="height:66%"></i><i style="height:92%"></i></div>
        </div>
      </div>
      <div class="g-card g-c1" id="card1"><div class="g-clabel" id="c1label">今日新增</div><div class="g-cnum g-num" id="c1num">0</div></div>
      <div class="g-card g-c2" id="card2"><div class="g-clabel" id="c2label">任务完成率</div><div class="g-track"><div class="g-fill" id="fill"></div></div><div class="g-cnum g-num" id="pct">0%</div></div>
      <div class="g-light" id="light"><div class="g-halo"></div><div class="g-core"></div></div>

    </div>
    <script>
      const fallback = {"title": "自动化运行看板", "bignum": "12480", "sub": "本周已自动完成的任务", "submetrics": "今日新增,任务完成率,87,326", "light": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      document.documentElement.style.setProperty("--light", V.light ?? "#00FF00");
      $("title").textContent = V.title;
      $("sub").textContent = V.sub;
      $("c1label").textContent = split(V.submetrics)[0] ?? "今日新增";
      $("c2label").textContent = split(V.submetrics)[1] ?? "任务完成率";
      const pctVal = Number(split(V.submetrics)[2]) || 87;
      const light = $("light");
      // 面板边框周长关键位（面板 left 220 top 190 w 1180 h 620）
      const P = { l: 220, t: 190, r: 1400, b: 810, cx: 810, cy: 500 };
      light.style.left = P.l + "px"; light.style.top = P.t + "px";

      tl.fromTo("#panel", { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
      countTo($("big"), V.bignum, 0.4, 1.3, 0, true);
      tl.fromTo("#sub", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.9);
      tl.to(".g-bars i", { scaleY: 1, duration: 0.7, stagger: 0.07, ease: "power4.out" }, 0.8);
      tl.fromTo("#card1", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.0);
      countTo($("c1num"), split(V.submetrics)[3] || 326, 1.15, 1.0, 0, true);
      tl.fromTo("#card2", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.2);
      tl.to("#fill", { scaleX: pctVal / 100, duration: 1.1, ease: "back.out(1.3)" }, 1.4);
      const po = { n: 0 };
      tl.to(po, { n: pctVal, duration: 1.1, ease: "back.out(1.3)",
        onUpdate: () => { $("pct").textContent = Math.round(po.n) + "%"; } }, 1.4);
      // 光源巡边一周（绿→青→紫→回到绿），过边角 scale 放大 = 折射 bloom
      tl.to(light, { keyframes: [
        { left: P.cx, top: P.t, scale: 1.0, filter: "hue-rotate(40deg)", duration: 0.42 },
        { left: P.r, top: P.t, scale: 1.35, filter: "hue-rotate(60deg)", duration: 0.42 },
        { left: P.r, top: P.cy, scale: 1.0, filter: "hue-rotate(90deg)", duration: 0.32 },
        { left: P.r, top: P.b, scale: 1.35, filter: "hue-rotate(120deg)", duration: 0.32 },
        { left: P.cx, top: P.b, scale: 1.0, filter: "hue-rotate(150deg)", duration: 0.42 },
        { left: P.l, top: P.b, scale: 1.35, filter: "hue-rotate(90deg)", duration: 0.42 },
        { left: P.l, top: P.cy, scale: 1.0, filter: "hue-rotate(45deg)", duration: 0.32 },
        { left: P.l, top: P.t, scale: 1.1, filter: "hue-rotate(0deg)", duration: 0.36 }
      ], ease: "none" }, 0.2);
      // 内容提亮 reactivity：光源过边角时面板微亮
      [1.04, 1.68, 2.52].forEach((t) => {
        tl.to("#panel", { filter: "brightness(1.14)", duration: 0.18, ease: "power1.in" }, t);
        tl.to("#panel", { filter: "brightness(1)", duration: 0.24, ease: "power1.out" }, t + 0.18);
      });
      window.__timelines.main = tl;

    </script>
  </body>
</html>
