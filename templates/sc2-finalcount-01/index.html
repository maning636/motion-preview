<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "SC2 · 差异化复刻"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.390 / 400"}, {"id": "kicker", "type": "string", "label": "眉题", "default": "COUNTDOWN · 倒数揭晓"}, {"id": "from", "type": "number", "label": "倒数起点", "default": 3}, {"id": "answer", "type": "string", "label": "答案大数字", "default": "400"}, {"id": "hl", "type": "string", "label": "高亮词（垫荧光绿）", "default": "篇长文"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .cda-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .cda-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .cda-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .cda-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      .cda-kicker{ position: absolute; left: 0; right: 0; top: 130px; text-align: center; z-index: 5;
        font-size: 24px; letter-spacing: .34em; color: #141414; }
      .cda-kicker b{ color: #9A9A92; font-weight: 400; }
      /* 弧舞台 */
      .cda-pivot{ position: absolute; left: 960px; top: 660px; width: 0; height: 0; z-index: 4; }
      .cda-tick{ position: absolute; left: 0; top: 0; }
      .cda-tick i{ display: block; width: 5px; height: 30px; background: #C9C8BE; margin-left: -2.5px; }
      .cda-arc{ position: absolute; left: 960px; top: 660px; width: 560px; height: 560px; margin-left: -280px;
        margin-top: -280px; border: 2px solid rgba(20,20,20,.18); border-radius: 50%;
        border-bottom-color: transparent; border-left-color: transparent; transform: rotate(-45deg); z-index: 3; }
      /* 倒数数字：收缩宽度 + xPercent 居中，scale 入场不会撑出画布 */
      .cda-num{ position: absolute; left: 960px; top: 430px; white-space: nowrap; z-index: 4;
        font-size: 300px; font-weight: 900; line-height: 1; color: #141414; opacity: 0; visibility: hidden; }
      /* 答案 */
      .cda-ans{ position: absolute; left: 960px; top: 400px; white-space: nowrap; z-index: 5;
        font-size: 220px; font-weight: 900; line-height: 1.1; color: #141414; opacity: 0; visibility: hidden; }
      .cda-ans .hl{ position: relative; display: inline-block; padding: 0 18px; }
      .cda-ans .hl i{ position: absolute; left: 0; right: 0; top: 14px; bottom: 10px; background: var(--ac, #00FF00);
        z-index: -1; transform: scaleX(0); transform-origin: 0 50%; }
      .cda-ring{ position: absolute; left: 960px; top: 560px; width: 520px; height: 520px; margin-left: -260px;
        margin-top: -260px; border: 3px solid var(--ac, #00FF00); border-radius: 50%; z-index: 3; opacity: 0; }
      .cda-sub{ position: absolute; left: 0; right: 0; top: 700px; text-align: center; z-index: 5;
        font-size: 20px; letter-spacing: .32em; color: #55554E; opacity: 0; }
      /* 底部荧光绿署名条 */
      .cda-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(60px); }
      .cda-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .cda-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="cda-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="cda-kicker mono" id="kicker"></div>
      <div class="cda-arc" id="arc"></div>
      <div class="cda-pivot" id="pivot"></div>
      <div class="cda-ring" id="ring"></div>
      <div class="cda-ans" id="ans"><span id="ansnum"></span><span class="hl"><i id="hlbg"></i><span id="hlword"></span></span></div>
      <div class="cda-sub mono" id="sub">ANSWER LOCKED · 答案锁定</div>
      <div class="cda-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · COUNTDOWN ARC</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "SC2 · 差异化复刻", "pageno": "P.390 / 400", "kicker": "COUNTDOWN · 倒数揭晓", "from": 3, "answer": "400", "hl": "篇长文", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      const kc = String(V.kicker).split("·");
      $("kicker").textContent = kc[0].trim();
      if (kc[1]) { const b = document.createElement("b"); b.textContent = " · " + kc.slice(1).join("·").trim(); $("kicker").appendChild(b); }
      const FROM = Math.min(Math.max(parseInt(V.from, 10) || 3, 2), 5);
      const TICKS = 21, R = 300;
      // 确定性伪随机（钉帧可复现）
      let seed = 42;
      const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
      // 上半圆刻度：-80°..+80° 切向排布
      const ticks = [];
      for (let i = 0; i < TICKS; i++) {
        const ang = -80 + (160 * i) / (TICKS - 1);
        const t = document.createElement("div");
        t.className = "cda-tick";
        t.style.transform = "rotate(" + ang + "deg) translateY(-" + R + "px)";
        const bar = document.createElement("i");
        t.appendChild(bar);
        $("pivot").appendChild(t);
        ticks.push({ el: t, bar, ang });
      }
      // 倒数数字（预建，钉帧安全；xPercent 居中，非激活层用 autoAlpha 隐藏，QA 不算遮挡）
      const nums = [];
      for (let i = 0; i < FROM; i++) {
        const d = document.createElement("div");
        d.className = "cda-num";
        d.textContent = String(FROM - i);
        $("root").appendChild(d);
        gsap.set(d, { xPercent: -50 });
        nums.push(d);
      }
      gsap.set("#ans", { xPercent: -50 });
      $("ansnum").textContent = V.answer + " ";
      $("hlword").textContent = V.hl;
      // ---- 时间轴 ----
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      tl.fromTo("#kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45 }, 0.35);
      // 刻度逐格显影
      tl.fromTo(".cda-tick i", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.3, stagger: 0.025, ease: "power2.out", transformOrigin: "50% 100%" }, 0.5);
      tl.fromTo("#arc", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);
      // 倒数：每一步点亮一组刻度 + 数字砸入换下一拍
      const step0 = 1.3, stepGap = 1.0;
      const per = Math.ceil(TICKS / FROM);
      for (let s = 0; s < FROM; s++) {
        const at = step0 + s * stepGap;
        const group = ticks.slice(s * per, (s + 1) * per).map((t) => t.bar);
        tl.to(group, { backgroundColor: "#00FF00", duration: 0.18, stagger: 0.03 }, at);
        tl.fromTo(nums[s], { autoAlpha: 0, scale: 1.35 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "expo.out" }, at);
        if (s > 0) tl.to(nums[s - 1], { autoAlpha: 0, scale: 0.82, duration: 0.22, ease: "power2.in" }, at - 0.05);
      }
      // 到零：弧散成粒子（散尽的刻度 visibility:hidden，不算遮挡）
      const zero = step0 + FROM * stepGap + 0.35;
      ticks.forEach((t, i) => {
        const rad = (t.ang * Math.PI) / 180;
        const out = 240 + rnd() * 320;
        const dx = Math.sin(rad) * out + (rnd() - 0.5) * 160;
        const dy = -Math.cos(rad) * out * 0.7 + (rnd() - 0.5) * 220 + 120;
        tl.to(t.el, { x: dx, y: dy, rotation: t.ang + (rnd() - 0.5) * 260, autoAlpha: 0,
          duration: 0.55 + rnd() * 0.3, ease: "power3.out" }, zero + rnd() * 0.12);
      });
      tl.to("#arc", { autoAlpha: 0, scale: 1.25, duration: 0.4, ease: "power2.out" }, zero);
      tl.to(nums[FROM - 1], { autoAlpha: 0, scale: 1.5, duration: 0.3, ease: "power2.in" }, zero);
      // 答案砸入 + 冲击环 + 绿高亮
      tl.fromTo("#ans", { autoAlpha: 0, scale: 2.1 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "expo.out" }, zero + 0.18);
      tl.fromTo("#ring", { opacity: 0.9, scale: 0.35 }, { autoAlpha: 0, scale: 1.7, duration: 0.7, ease: "power3.out" }, zero + 0.18);
      tl.to("#hlbg", { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, zero + 0.55);
      tl.fromTo("#sub", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, zero + 0.7);
      // 底部署名条
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 0.8);
      tl.fromTo([".cda-foot .f1", ".cda-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 1.05);
      // 答案定格脉冲，不收尾
      tl.to("#ans", { scale: 1.04, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, zero + 1.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
