<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"eyebrow","type":"string","label":"眉标","default":"ITERATION · 词语接力"},
  {"id":"title","type":"string","label":"主标题","default":"词在飞行，含义在交接"},
  {"id":"words","type":"string","label":"接力词（换行分隔，推荐 3-6 个）","default":"灵感\n草稿\n推翻\n重写\n定稿\n发表"},
  {"id":"relayCount","type":"number","label":"接力次数（2-3）","default":3},
  {"id":"accent","type":"color","label":"强调色","default":"#00FF00"},
  {"id":"background","type":"color","label":"背景色","default":"#12100E"},
  {"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},
  {"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"},{"value":"webm","label":"WebM"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

      *{ box-sizing: border-box; }
      html, body{
        margin:0; width:1920px; height:1080px; overflow:hidden;
        background: var(--background, #12100E);
      }
      #root{
        position:relative; width: 1920px; height: 1080px; overflow:hidden;
        background: var(--background, #12100E);
        color: var(--foreground, #F4EFE7);
        font-family: 'MEBHeiHeiTi','PingFang SC','Microsoft YaHei', sans-serif;
      }

      .gridbg{
        position:absolute; inset:0; pointer-events:none;
        background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px);
        background-size: 48px 48px;
        opacity: .55;
      }

      .scene{
        position:absolute; inset:0;
      }

      /* 顶 / 底脚标 */
      .eyebrow{
        position:absolute; top: 56px; left: 96px; right: 96px;
        display:flex; justify-content:space-between; align-items:center;
        font-family:'MiSans SemiBold','PingFang SC',sans-serif;
        font-size: 16px; letter-spacing:.22em; text-transform:uppercase;
        color: #8A8A85;
      }
      .eyebrow .acc{ color: var(--accent, #00FF00); font-weight: 700; letter-spacing:.18em; }

      .title{
        position:absolute;
        top: 108px; left: 96px; right: 96px;
        margin:0;
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-weight: 700;
        font-size: 52px; line-height: 1.05;
        letter-spacing: -.02em;
      }
      .title .dim{
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 45%, transparent);
      }

      /* —— 胶片条（横贯画面中央）—— */
      .filmstrip{
        position:absolute;
        top: 50%;
        left: 96px;
        right: 96px;
        height: 360px;
        transform: translateY(-50%);
        background: linear-gradient(180deg,
          rgba(255,255,255,.025) 0%,
          rgba(255,255,255,.055) 50%,
          rgba(255,255,255,.025) 100%);
        border: 1px solid rgba(255,255,255,.10);
        border-radius: 14px;
        overflow:hidden;
      }

      /* 胶片齿孔（上 / 下两条） */
      .filmstrip .perf{
        position:absolute; left:0; right:0; height: 36px;
        background-image:
          radial-gradient(circle at 50% 50%,
            color-mix(in srgb, var(--background, #12100E) 92%, transparent) 0 8px,
            transparent 9px);
        background-size: 56px 36px;
        background-repeat: repeat-x;
        background-position: center;
        opacity: .9;
      }
      .filmstrip .perf.top{ top: 0; border-bottom: 1px solid rgba(255,255,255,.06); }
      .filmstrip .perf.bot{ bottom: 0; border-top: 1px solid rgba(255,255,255,.06); }

      /* 胶片中央分格线 + 数字 */
      .filmstrip .frame-marker{
        position:absolute; top: 96px; bottom: 96px; left: 0; right: 0;
        pointer-events:none;
      }
      .filmstrip .frame-marker .tick{
        position:absolute; top:0; bottom:0; width: 1px;
        background: linear-gradient(180deg, transparent, rgba(255,255,255,.10), transparent);
      }
      .filmstrip .frame-marker .frame-no{
        position:absolute; top: 50%; left: 24px;
        transform: translateY(-50%);
        font-family:'MiSans SemiBold','PingFang SC',sans-serif;
        font-size: 18px; letter-spacing:.16em;
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 40%, transparent);
      }

      /* 中央接替槽位（胶片内可见窗口） */
      .slot{
        position:absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 760px; height: 220px;
        display:grid; place-items:center;
        border-radius: 10px;
        background:
          linear-gradient(180deg,
            rgba(255,255,255,.018),
            rgba(255,255,255,.04));
        border: 1px solid rgba(255,255,255,.08);
      }
      .slot .slot-frame{
        position:absolute; inset: -10px;
        border: 1px dashed rgba(255,255,255,.06);
        border-radius: 14px;
        pointer-events:none;
      }
      .slot .corner{
        position:absolute; width: 18px; height: 18px;
        border-color: var(--accent, #00FF00);
        opacity: .65;
      }
      .slot .corner.tl{ top: -1px; left: -1px;  border-top: 2px solid; border-left: 2px solid; }
      .slot .corner.tr{ top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
      .slot .corner.bl{ bottom: -1px; left: -1px;  border-bottom: 2px solid; border-left: 2px solid; }
      .slot .corner.br{ bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }

      /* 词（飞入飞出的载体） */
      .word{
        position:absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-weight: 700;
        font-size: 132px; line-height: 1;
        letter-spacing: -.01em;
        color: var(--foreground, #F4EFE7);
        text-shadow: 0 4px 24px rgba(0,0,0,.45);
        white-space: nowrap;
        will-change: transform, opacity;
      }
      .word.out-going{ color: color-mix(in srgb, var(--foreground, #F4EFE7) 60%, transparent); }
      .word.in-coming{ color: var(--foreground, #F4EFE7); }
      .word.active{
        color: var(--foreground, #F4EFE7);
        text-shadow:
          0 0 0 currentColor,
          0 0 22px color-mix(in srgb, var(--accent, #00FF00) 30%, transparent);
      }

      /* 词下方副标（用于显示词序号 / 接力进度） */
      .subline{
        position:absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, 188px);
        display:flex; align-items:center; gap: 10px;
        font-family:'MiSans SemiBold','PingFang SC',sans-serif;
        font-size: 16px; letter-spacing:.22em; text-transform:uppercase;
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 55%, transparent);
        white-space: nowrap;
      }
      .subline b{ color: var(--accent, #00FF00); font-weight: 700; }

      /* 飞入指示箭头（右侧） */
      .arrival-hint{
        position:absolute;
        top: 50%; right: 130px;
        transform: translateY(-50%);
        display:flex; align-items:center; gap: 10px;
        font-family:'MiSans SemiBold','PingFang SC',sans-serif;
        font-size: 14px; letter-spacing:.20em; text-transform:uppercase;
        color: color-mix(in srgb, var(--accent, #00FF00) 70%, transparent);
        opacity: 0;
      }
      .arrival-hint .bar{
        display:inline-block; width: 80px; height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent, #00FF00));
      }

      /* 离开指示（左侧） */
      .leave-hint{
        position:absolute;
        top: 50%; left: 130px;
        transform: translateY(-50%);
        display:flex; align-items:center; gap: 10px;
        font-family:'MiSans SemiBold','PingFang SC',sans-serif;
        font-size: 14px; letter-spacing:.20em; text-transform:uppercase;
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 45%, transparent);
        opacity: 0;
      }
      .leave-hint .bar{
        display:inline-block; width: 80px; height: 2px;
        background: linear-gradient(-90deg, transparent, rgba(255,255,255,.45));
      }

      /* 底部进度条 + 脚注 */
      .progress{
        position:absolute;
        left: 96px; right: 96px; bottom: 130px;
        height: 2px;
        background: rgba(255,255,255,.08);
        border-radius: 999px;
        overflow:hidden;
      }
      .progress .bar{
        position:absolute; left:0; top:0; bottom:0; width: 0%;
        background: linear-gradient(90deg, transparent, var(--accent, #00FF00));
        box-shadow: 0 0 12px color-mix(in srgb, var(--accent, #00FF00) 40%, transparent);
      }
      .progress .pin{
        position:absolute; top:50%;
        transform: translate(-50%, -50%);
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--accent, #00FF00);
        box-shadow: 0 0 0 4px rgba(0,0,0,.35), 0 0 14px color-mix(in srgb, var(--accent, #00FF00) 55%, transparent);
        left: 0%;
      }

      .footnote{
        position:absolute;
        left: 96px; right: 96px; bottom: 80px;
        display:flex; justify-content:space-between; align-items:center;
        font-family:'MiSans SemiBold','PingFang SC',sans-serif;
        font-size: 18px; letter-spacing:.06em;
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 55%, transparent);
      }
      .footnote .pos-pct{
        font-size: 28px; font-weight:700;
        color: var(--accent, #00FF00);
        letter-spacing: -.01em;
      }
      .footnote .pos-pct small{
        font-size: 13px; font-weight:500;
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 55%, transparent);
        margin-left: 6px;
      }

      /* 词元素初始全部不可见（GSAP 接管） */
      .word{ opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="7" data-track-index="1">

        <div class="gridbg"></div>

        <div class="eyebrow">
          <span><b class="acc" id="eyebrowAcc">VS</b>&nbsp;&nbsp;<span id="eyebrowText">ITERATION · 词语接力</span></span>
          <span>filmstrip · relay</span>
        </div>

        <h1 class="title" id="titleText">词在飞行<span class="dim">，含义在交接</span></h1>

        <!-- 胶片条（齿孔 + 帧标 + 中央接替槽 + 飞入/离开指示 + 副标 + 进度条） -->
        <div class="filmstrip" id="filmstrip">
          <div class="perf top"></div>
          <div class="perf bot"></div>

          <div class="frame-marker">
            <div class="tick" style="left: 16.66%;"></div>
            <div class="tick" style="left: 33.33%;"></div>
            <div class="tick" style="left: 50%;"></div>
            <div class="tick" style="left: 66.66%;"></div>
            <div class="tick" style="left: 83.33%;"></div>
            <div class="frame-no" id="frameNo">FRAME · 01</div>
          </div>

          <div class="slot" id="slot">
            <div class="slot-frame"></div>
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <!-- 词元素会由 JS 注入 -->
          </div>

          <div class="arrival-hint" id="arrivalHint">
            <span>INCOMING</span><span class="bar"></span>
          </div>
          <div class="leave-hint" id="leaveHint">
            <span class="bar"></span><span>OUTGOING</span>
          </div>

          <div class="subline" id="subline">
            <b id="subIdx">01</b><span>/</span><span id="subTotal">03</span><span>·RELAY</span>
          </div>

          <div class="progress" id="progress">
            <div class="bar" id="progressBar"></div>
            <div class="pin" id="progressPin"></div>
          </div>
        </div>

        <div class="footnote">
          <span id="footLeft">CYCLE 01 / 03</span>
          <span class="pos-pct"><span id="pctVal">0</span><small>%</small></span>
          <span id="footRight">FILMSTRIP · RELAY</span>
        </div>

      </section>
    </div>
    <script>
      /* ----- 变量接线（与全库契约一致） ----- */
      const fallback = {
        eyebrow: "ITERATION · 词语接力",
        title: "词在飞行，含义在交接",
        words: "灵感\n草稿\n推翻\n重写\n定稿\n发表",
        relayCount: 3,
        accent: "#00FF00",
        background: "#12100E",
        foreground: "#F4EFE7",
      };
      const v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables()
        : fallback;

      const $ = (id) => document.getElementById(id);
      const html = document.documentElement;
      html.style.setProperty("--foreground", v.foreground || "#F4EFE7");
      html.style.setProperty("--background", v.background || "#12100E");
      html.style.setProperty("--accent",     v.accent     || "#00FF00");

      /* ----- 内容回填 ----- */
      $("eyebrowText").textContent = v.eyebrow || fallback.eyebrow;
      $("eyebrowAcc").textContent  = (v.eyebrow || fallback.eyebrow).trim().slice(0,2).toUpperCase();
      $("titleText").innerHTML     = (() => {
        const t = String(v.title || fallback.title);
        const idx = t.indexOf("，") >= 0 ? t.indexOf("，") : t.indexOf(",");
        if (idx < 0) return t;
        return t.slice(0, idx)
          + '<span class="dim">' + t.slice(idx) + '</span>';
      })();

      const wordLines = String(v.words || fallback.words)
        .split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const totalWords = wordLines.length;

      /* 接力次数 = 用户设置（2-3），但实际能接替的轮次受词数限制：
         1 次接力 = 旧词 A → 新词 B；N 次接力需要 N+1 个不同词；剩余不够则停在最后词 */
      const relayCount = Math.max(2, Math.min(3,
        Math.floor(Number(v.relayCount ?? fallback.relayCount) || 3)));
      // 用接力所需的 (relayCount + 1) 个词
      const useCount = Math.min(totalWords, relayCount + 1);
      const words = wordLines.slice(0, useCount);

      /* 注入词元素到 slot */
      const slot = $("slot");
      const wordEls = words.map((txt, i) => {
        const el = document.createElement("span");
        el.className = "word " + (i === 0 ? "active in-coming" : "in-coming");
        el.textContent = txt;
        slot.appendChild(el);
        return el;
      });

      /* ----- 时间线 ----- */
      window.__timelines = window.__timelines || {};
      const DUR = 7;

      const tl = gsap.timeline({ paused: true });

      /* 派生 UI：副标 / 进度条 / pctVal 随 timeline 同步 */
      const subIdx = $("subIdx"), subTotal = $("subTotal"),
            frameNo = $("frameNo"), footLeft = $("footLeft"),
            pctVal = $("pctVal"), progressBar = $("progressBar"),
            progressPin = $("progressPin"),
            arrivalHint = $("arrivalHint"), leaveHint = $("leaveHint");
      subTotal.textContent = String(useCount);

      const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
      const totalRelays = useCount - 1; // N+1 个词 → N 次接力
      // 入场 + 末段停留各占一部分，剩余给接力
      const INTRO = 0.6, OUTRO = 1.0;
      const relayBudget = DUR - INTRO - OUTRO; // ≈ 5.4
      const perRelay = relayBudget / Math.max(totalRelays, 1);
      const INTRO_END = INTRO;
      const OUTRO_START = DUR - OUTRO;

      const updateDerived = () => {
        const t = tl.time();
        // 当前接力序号：t < INTRO_END → 0（首词就位未飞走）；其余按时间切分
        let idx = 0;
        if (t >= INTRO_END) {
          const rel = clamp((t - INTRO_END) / Math.max(perRelay, 0.0001), 0, totalRelays);
          idx = Math.min(totalRelays, Math.floor(rel + 0.0001));
        }
        subIdx.textContent = String(idx + 1).padStart(2, "0");
        frameNo.textContent = "FRAME · " + String(idx + 1).padStart(2, "0");
        footLeft.textContent = "CYCLE " + String(idx + 1).padStart(2, "0") + " / " + String(useCount).padStart(2, "0");

        // 进度条百分比
        const pct = clamp(t / DUR, 0, 1) * 100;
        pctVal.textContent = String(Math.round(pct));
        progressBar.style.width = pct + "%";
        progressPin.style.left  = pct + "%";

        // 提示带：接力进行中显示
        const inRelay = (t >= INTRO_END && t < OUTRO_START && totalRelays > 0 && idx < totalRelays);
        const showArr = inRelay && (t - INTRO_END) % perRelay < perRelay * 0.55;
        const showLve = inRelay && (t - INTRO_END) % perRelay < perRelay * 0.55;
        arrivalHint.style.opacity = showArr ? "1" : "0";
        leaveHint.style.opacity   = showLve ? "1" : "0";
      };
      tl.eventCallback("onUpdate", updateDerived);

      /* —— 入场 —— */
      // 整张胶片条从 clip-path 划入
      tl.fromTo("#filmstrip",
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power3.out" }, 0.05);
      // 顶眉 / 标题错峰入场
      tl.fromTo(".eyebrow",
        { opacity: 0, y: -10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.15);
      tl.fromTo(".title",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.25);
      // 底部脚注 / 进度条淡入
      tl.fromTo(".footnote, .progress",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.06 }, 0.4);

      /* 首词入场 */
      tl.fromTo(wordEls[0],
        { x: 220, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.55);

      /* —— 接力循环：每个接力槽，旧词 → 新词 —— */
      // 段长：每个接力槽 = perRelay 秒；
      // 接力开始前先有 0.05s overlap 让旧词起手
      const flyInDur  = 0.55;
      const flyOutDur = 0.45;

      for (let i = 0; i < totalRelays; i++) {
        const oldEl = wordEls[i];
        const newEl = wordEls[i + 1];
        const at = INTRO_END + i * perRelay;
        const overlap = 0.06;

        // 旧词向左飞出胶片框（slot 左缘约 -380 px）
        tl.to(oldEl,
          { x: -380, opacity: 0, duration: flyOutDur, ease: "power2.in" },
          at);
        tl.add(() => { oldEl.classList.remove("active"); }, at + flyOutDur * 0.55);

        // 新词从右飞入
        tl.fromTo(newEl,
          { x: 380, opacity: 0 },
          { x: 0, opacity: 1, duration: flyInDur, ease: "power3.out" },
          at + overlap);
        tl.add(() => {
          oldEl.classList.add("out-going");
          newEl.classList.add("active");
          newEl.classList.remove("out-going");
        }, at + overlap);
      }

      /* —— 末段：当前词短暂放大再回落，强化"接替完成" —— */
      const lastAt = OUTRO_START;
      tl.to(wordEls[wordEls.length - 1],
        { scale: 1.06, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 },
        lastAt);

      window.__timelines.main = tl;

      // 初始化派生 UI
      updateDerived();
    </script>
  </body>
</html>
