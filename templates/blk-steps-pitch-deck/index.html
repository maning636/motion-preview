<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "PITCH / 一句话"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "融资时我只讲这一句"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：万元"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#FFD429"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>步骤轴 · 融资时我只讲这一句</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{flex-direction:column;position:relative;padding-bottom:26px}
  /* 轨压在编号牌正中。绝对定位而不是排版流：编号牌一旦被 B.fit 缩过，
     用 margin-top 对轨的猜测就会失效，这里用固定几何关系钉死。 */
  .rail{position:absolute;left:86px;right:86px;top:80px;height:14px;
        background:var(--ink);z-index:0}
  /* align-items 必须是 stretch。早先留着 flex-start，节点就不纵向拉伸，
     .card 的 flex:1 形同虚设——内容全挤在顶部，下面空出七百像素，
     而 ink 面积、字节数、YSTD 一样是绿的。 */
  .track{display:flex;align-items:stretch;z-index:1;flex:1 1 auto;min-height:0}

  .node{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;padding-top:7px}
  .node .chip{width:160px;height:160px;border:var(--bw) solid var(--ink);border-radius:4px;
        display:flex;align-items:center;justify-content:center;flex:0 0 auto;
        font-family:var(--mono);font-weight:700;font-size:64px;letter-spacing:-.03em;
        box-shadow:7px 7px 0 var(--ink)}
  .node .card{flex:1 1 auto;width:100%;margin-top:46px;border:var(--bw) solid var(--ink);
        border-radius:4px;box-shadow:7px 7px 0 var(--ink);overflow:hidden;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:16px;padding:20px 16px;min-height:0}
  .node .val{font-family:var(--mono);font-weight:700;font-size:52px;line-height:.95;
        letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-align:center}
  .node .lab{font-weight:900;font-size:25px;line-height:1.2;text-align:center;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .node .share{width:100%;height:12px;border:var(--bw) solid currentColor;position:relative;
        overflow:hidden;flex:0 0 auto}
  .node .share i{position:absolute;left:0;top:0;bottom:0;width:0;background:currentColor}
  .node .sub{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.16em;
        margin-top:16px;flex:0 0 auto}
</style>
</head>
<body>
<div id="stage" class="blk-noise on-ink">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">PITCH / 一句话</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">融资时我只讲这一句</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：万元</div></div>
  <div class="body">
    <div class="rail" id="rail"></div>
    <div class="track"><div class="node" id="n0"><div class="blk chip" id="ch0" style="background:var(--yellow);color:var(--ink);">1</div><div class="blk card" id="cd0" style="background:var(--white);color:var(--ink);"><span class="val" id="v0" data-fit-max="46" data-fit-min="22">620</span><span class="lab" id="l0">今年做</span><span class="share"><i id="sh0"></i></span></div><span class="sub">STEP 01</span></div><div class="node" id="n1"><div class="blk chip" id="ch1" style="background:var(--pink);color:var(--ink);">2</div><div class="blk card" id="cd1" style="background:var(--blue);color:var(--ink);"><span class="val" id="v1" data-fit-max="46" data-fit-min="22">1800</span><span class="lab" id="l1">明年做</span><span class="share"><i id="sh1"></i></span></div><span class="sub">STEP 02</span></div><div class="node" id="n2"><div class="blk chip" id="ch2" style="background:var(--blue);color:var(--ink);">3</div><div class="blk card" id="cd2" style="background:var(--pink);color:var(--ink);"><span class="val" id="v2" data-fit-max="46" data-fit-min="22">5200</span><span class="lab" id="l2">三年做</span><span class="share"><i id="sh2"></i></span></div><span class="sub">STEP 03</span></div></div>
  </div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  tl.from('#rail', { scaleX: 0, transformOrigin: 'left center',
      duration: 0.7, ease: 'power3.inOut' }, 0.05);
  var shares = [0.119, 0.346, 1.0];
  document.querySelectorAll('.node').forEach(function (nd, i) {
    var at = 0.22 + i * 0.11;
    B.in.drop(tl, nd.querySelector('.chip'), at, { dist: 92, rot: i % 2 ? 5 : -5, d: 0.62 });
    B.in.pop(tl, nd.querySelector('.card'), at + 0.16, { d: 0.62 * 0.8, from: .88, ease: 'power3.out' });
    B.in.grow(tl, nd.querySelector('.share i'), Math.max(8, shares[i] * 100) + '%',
        at + 0.3, { d: 0.62 });
    tl.from(nd.querySelector('.sub'), { opacity: 0, y: 10, duration: 0.3 }, at + 0.34);
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
