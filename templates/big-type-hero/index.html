<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"headline","type":"string","label":"主标题","default":"注意力"},{"id":"accentWord","type":"string","label":"强调词","default":"稀缺"},{"id":"subheadline","type":"string","label":"副标题","default":"这个时代真正的货币"},{"id":"chapter","type":"string","label":"章节编号","default":"01"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden; display: flex; flex-direction: column; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chrome{ position: absolute; top: 96px; left: 112px; right: 112px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .idx{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 20px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.45; }
      .rule{ flex: 1; height: 1px; margin: 14px 0 0 32px; opacity: 0.22;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .type-stack{ position: relative; z-index: 2;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .headline{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 210px; font-weight: 700; line-height: 0.92; letter-spacing: -0.04em; text-transform: uppercase; }
      .headline em{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-style: italic; text-transform: none; }
      .subheadline{ margin: 48px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 36px; font-weight: 400; line-height: 1.4; opacity: 0.55; max-width: 900px; }
      .bottom-tick{ position: absolute; bottom: 96px; left: 112px; width: 72px; height: 3px; opacity: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="chrome">
          <span class="idx" id="idx">CHAPTER</span>
          <span class="rule" id="rule"></span>
        </div>
        <div class="type-stack">
          <h1 class="headline" id="headline"></h1>
          <p class="subheadline" id="subheadline"></p>
        </div>
        <div class="bottom-tick" id="tick"></div>
      </section>
    </div>
    <script>
      const fallback = { headline: "注意力", accentWord: "稀缺", subheadline: "这个时代真正的货币", chapter: "01", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      document.querySelectorAll(".rule, .bottom-tick").forEach(el => el.style.backgroundColor = v.accent);
      document.getElementById("idx").textContent = "CHAPTER " + v.chapter;
      document.getElementById("subheadline").textContent = v.subheadline;
      const hl = document.getElementById("headline");
      const safeHeadline = String(v.headline || "").trim();
      const safeAccent = String(v.accentWord || "").trim();
      if (safeAccent && safeHeadline.includes(safeAccent)) {
        hl.innerHTML = safeHeadline.replace(safeAccent, `<em style="color:${v.accent}">${safeAccent}</em>`);
      } else {
        hl.innerHTML = safeHeadline + (safeAccent ? ` <em style="color:${v.accent}">${safeAccent}</em>` : "");
      }
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".idx", { opacity: 0, y: -20 }, { opacity: 0.45, y: 0, duration: 0.6, ease: "power2.out" }, 0.1);
      tl.fromTo(".rule", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, opacity: 0.22, duration: 0.8, ease: "power2.inOut" }, 0.2);
      tl.fromTo(".headline", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.4);
      tl.fromTo(".subheadline", { opacity: 0, y: 30 }, { opacity: 0.55, y: 0, duration: 0.6, ease: "power2.out" }, 0.9);
      tl.fromTo(".bottom-tick", { opacity: 0, scaleX: 0, transformOrigin: "left center" }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out" }, 1.2);
      tl.to(".scene", { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, 4.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
