<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"图表标题","default":"2024 年度业绩"},{"id":"subtitle","type":"string","label":"副标题","default":"各部门季度销售额对比"},{"id":"labels","type":"string","label":"标签（逗号分隔）","default":"Q1,Q2,Q3,Q4,全年"},{"id":"values","type":"string","label":"数值（逗号分隔）","default":"45,72,58,91,85"},{"id":"colors","type":"string","label":"颜色（逗号分隔）","default":"#00FF00,#00FF00,#6B7280,#00FF00,#6B7280"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="6" data-track-index="1">

        <div class="gridbg"></div>
        <header style="position:relative;z-index:2;display:flex;align-items:center;gap:24px;">
          <span class="chip"><b>DATA</b>柱状图</span>
          <div>
            <h1 id="title" class="num" style="margin:0;font-size:52px;letter-spacing:-.02em;"></h1>
            <p id="subtitle" style="margin:6px 0 0;font-size:22px;color:#9CA3AF;"></p>
          </div>
        </header>
        <div id="plot" style="position:absolute;left:88px;right:88px;bottom:150px;top:260px;display:flex;align-items:flex-end;gap:36px;border-bottom:3px solid #3F3F46;padding:0 24px;">
        </div>
        <style>
          .bar-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
          .bar{ width:72%; max-width:150px; border-radius:10px 10px 0 0; transform-origin:bottom; transform:scaleY(0); position:relative; }
          .bar.hot{ background:linear-gradient(180deg,var(--accent,#00FF00),color-mix(in srgb, var(--accent) 35%, transparent)); }
          .bar.cold{ background:#2E2E33; }
          .bval{ font-size:30px; margin-bottom:10px; opacity:0; }
          .blab{ position:absolute; bottom:-46px; font-size:22px; color:#9CA3AF; opacity:0; }
        </style>

      </section>
    </div>
    <script>
      const fallback = {"title": "2024 年度业绩", "subtitle": "各部门季度销售额对比", "labels": "Q1,Q2,Q3,Q4,全年", "values": "45,72,58,91,85", "colors": "#00FF00,#00FF00,#6B7280,#00FF00,#6B7280", "accent": "#00FF00", "background": "#12100E", "foreground": "#F4EFE7"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 6;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("title").textContent = v.title; $("subtitle").textContent = v.subtitle;
      const labels = split(v.labels), values = split(v.values).map(Number), colors = split(v.colors);
      const max = Math.max(...values, 1);
      const plot = $("plot");
      const bars = labels.map((lab, i) => {
        const wrap = document.createElement("div"); wrap.className = "bar-wrap";
        const hot = (colors[i] || v.accent).toLowerCase() === (v.accent || "#00FF00").toLowerCase();
        wrap.innerHTML = `<span class="bval num" style="color:${hot ? "var(--accent,#00FF00)" : "#D4D4D8"}">0</span>
          <div class="bar ${hot ? "hot" : "cold"}" style="height:${(values[i] / max) * 88}%"></div>
          <span class="blab">${lab}</span>`;
        plot.appendChild(wrap);
        return { val: wrap.querySelector(".bval"), target: values[i] };
      });
      tl.fromTo("header", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power3.out" }, 0.1);
      tl.to(".bar", { scaleY: 1, duration: 0.8, ease: "power4.out", stagger: 0.1 }, 0.5);
      bars.forEach((b, i) => { countTo(b.val, b.target, 0.7 + i * 0.1, 0.7); tl.to(b.val, { opacity: 1, duration: 0.2 }, 0.7 + i * 0.1); });
      tl.to(".blab", { opacity: 1, y: 0, duration: 0.4, stagger: 0.06 }, 1.2);
      tl.to(".scene", { clipPath: "inset(0 0 100% 0)", duration: 0.5, ease: "power2.in" }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
