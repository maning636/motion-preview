<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"产品战略 SWOT"},{"id":"subtitle","type":"string","label":"副标题","default":"当前版本定位分析"},{"id":"strengths","type":"string","label":"优势（逗号分隔）","default":"技术积累,用户口碑,快速迭代"},{"id":"weaknesses","type":"string","label":"劣势（逗号分隔）","default":"品牌弱,渠道少,文档不足"},{"id":"opportunities","type":"string","label":"机会（逗号分隔）","default":"AI 原生需求,企业市场,出海窗口"},{"id":"threats","type":"string","label":"威胁（逗号分隔）","default":"大厂入场,监管变化,成本上涨"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

      *{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 48px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 12px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 28px; font-weight: 400; opacity: 0.55; }
      .grid{ display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 24px; height: 720px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .cell{ border: 1px solid rgba(244,239,231,0.12); border-radius: 8px; padding: 36px 40px; display: flex; flex-direction: column; gap: 18px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .cell-head{ display: flex; align-items: baseline; gap: 18px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .cell-letter{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 72px; font-weight: 700; line-height: 1; }
      .cell-name{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 18px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.5; }
      .cell-list{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .cell-list li{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 400; line-height: 1.4; opacity: 0.85; position: relative; padding-left: 22px; }
      .cell-list li::before{ content: "—"; position: absolute; left: 0; opacity: 0.45;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .positive .cell-letter{ color: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .positive{ border-color: color-mix(in srgb, var(--accent) 28%, transparent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="grid">
          <div class="cell positive" id="cellS">
            <div class="cell-head"><span class="cell-letter">S</span><span class="cell-name">Strengths</span></div>
            <ul class="cell-list" id="listS"></ul>
          </div>
          <div class="cell" id="cellW">
            <div class="cell-head"><span class="cell-letter">W</span><span class="cell-name">Weaknesses</span></div>
            <ul class="cell-list" id="listW"></ul>
          </div>
          <div class="cell positive" id="cellO">
            <div class="cell-head"><span class="cell-letter">O</span><span class="cell-name">Opportunities</span></div>
            <ul class="cell-list" id="listO"></ul>
          </div>
          <div class="cell" id="cellT">
            <div class="cell-head"><span class="cell-letter">T</span><span class="cell-name">Threats</span></div>
            <ul class="cell-list" id="listT"></ul>
          </div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "产品战略 SWOT", subtitle: "当前版本定位分析", strengths: "技术积累,用户口碑,快速迭代", weaknesses: "品牌弱,渠道少,文档不足", opportunities: "AI 原生需求,企业市场,出海窗口", threats: "大厂入场,监管变化,成本上涨", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      const fill = (id, text) => {
        const ul = document.getElementById(id);
        ul.innerHTML = "";
        String(text).split(",").filter(s => s.trim()).forEach(item => {
          const li = document.createElement("li");
          li.textContent = item.trim();
          ul.appendChild(li);
        });
      };
      fill("listS", v.strengths);
      fill("listW", v.weaknesses);
      fill("listO", v.opportunities);
      fill("listT", v.threats);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".header", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      ["#cellS", "#cellW", "#cellO", "#cellT"].forEach((sel, i) => {
        tl.fromTo(sel, { opacity: 0, y: 40, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.4 + i * 0.15);
        tl.fromTo(sel + " .cell-letter", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.7 + i * 0.15);
        tl.fromTo(sel + " .cell-name", { opacity: 0 }, { opacity: 0.5, duration: 0.4 }, 0.85 + i * 0.15);
        tl.fromTo(sel + " li", { opacity: 0, x: -12 }, { opacity: 0.85, x: 0, duration: 0.4, stagger: 0.08, ease: "power2.out" }, 1.0 + i * 0.15);
      });
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
