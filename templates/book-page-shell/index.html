<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "VOL.15 · 视觉动效库"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.075 / 400"}, {"id": "kicker", "type": "string", "label": "眉题", "default": "PAGE SHELL · 书页壳"}, {"id": "line1", "type": "string", "label": "大标题第一行", "default": "把任何一页"}, {"id": "line2", "type": "string", "label": "大标题第二行（绿高亮）", "default": "放进书页里"}, {"id": "desc", "type": "string", "label": "说明行", "default": "图片或已渲染的视频片段，统一套进纸感书页壳。"}, {"id": "img1", "type": "image", "label": "页面图片（竖版 3:4）", "default": "./assets/page.png"}, {"id": "video1", "type": "string", "label": "页面视频路径（填了就播视频）", "default": ""}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .bps-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .bps-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .bps-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .bps-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 左栏文案 */
      .bps-copy{ position: absolute; left: 110px; top: 240px; width: 760px; z-index: 5; }
      .bps-kicker{ font-size: 22px; letter-spacing: .3em; color: #141414; }
      .bps-kicker b{ color: #9A9A92; font-weight: 400; }
      .bps-title{ margin-top: 34px; font-size: 108px; font-weight: 900; line-height: 1.18; letter-spacing: .01em; }
      .bps-title span{ display: inline-block; }
      .bps-title .hl{ position: relative; display: inline-block; padding: 0 14px; }
      .bps-title .hl i{ position: absolute; left: 0; right: 0; top: 8px; bottom: 8px; background: var(--ac, #00FF00);
        z-index: -1; transform: scaleX(0); transform-origin: 0 50%; }
      .bps-desc{ margin-top: 40px; font-family: 'MiSans SemiBold', sans-serif; font-size: 27px; line-height: 1.7; color: #55554E; }
      .bps-tag{ margin-top: 46px; display: inline-block; border: 2px solid #141414; padding: 10px 22px;
        font-size: 20px; letter-spacing: .18em; background: #fff; box-shadow: 6px 6px 0 #141414; }
      /* 右侧书页卡 */
      .bps-stage{ position: absolute; right: 150px; top: 140px; width: 600px; height: 800px; z-index: 4;
        perspective: 1400px; }
      .bps-shadow{ position: absolute; left: 16px; top: 16px; width: 600px; height: 800px; background: #141414; }
      .bps-page{ position: absolute; left: 0; top: 0; width: 600px; height: 800px; background: #fff;
        border: 3px solid #141414; overflow: hidden; transform-style: preserve-3d; }
      .bps-page img, .bps-page video{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .bps-sweep{ position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none;
        background: linear-gradient(105deg, transparent 42%, color-mix(in srgb, var(--accent) 28%, transparent) 50%, transparent 58%); }
      /* 底部绿色署名条 */
      .bps-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(64px); }
      .bps-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .bps-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="bps-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="bps-copy">
        <div class="bps-kicker mono" id="kicker"></div>
        <div class="bps-title"><span id="line1"></span><br /><span class="hl"><i id="hlbg"></i><span id="line2"></span></span></div>
        <div class="bps-desc" id="desc"></div>
        <div class="bps-tag mono" id="tag">IMAGE / VIDEO · 3:4</div>
      </div>
      <div class="bps-stage">
        <div class="bps-shadow" id="shadow"></div>
        <div class="bps-page" id="page">
          <img id="pg" src="./assets/page.png" alt="" />
          <video id="pv" src="./assets/placeholder.mp4" muted playsinline style="display:none"></video>
          <div class="bps-sweep" id="sweep"></div>
        </div>
      </div>
      <div class="bps-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · PAGE SHELL</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "VOL.15 · 视觉动效库", "pageno": "P.075 / 400", "kicker": "PAGE SHELL · 书页壳", "line1": "把任何一页", "line2": "放进书页里", "desc": "图片或已渲染的视频片段，统一套进纸感书页壳。", "img1": "./assets/page.png", "video1": "", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      $("kicker").innerHTML = "";
      const kc = String(V.kicker).split("·");
      $("kicker").textContent = kc[0].trim();
      if (kc[1]) { const b = document.createElement("b"); b.textContent = " · " + kc.slice(1).join("·").trim(); $("kicker").appendChild(b); }
      $("line1").textContent = V.line1;
      $("line2").textContent = V.line2;
      $("desc").textContent = V.desc;
      const useVideo = String(V.video1 || "").trim().length > 0;
      if (useVideo) { $("pv").src = V.video1; $("pv").style.display = "block"; $("pg").style.display = "none"; $("tag").textContent = "VIDEO · 3:4"; }
      else if (V.img1) { $("pg").src = V.img1; }
      // 页眉细线 + 文字
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      // 左栏文案
      tl.fromTo("#kicker", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45 }, 0.3);
      tl.fromTo(["#line1", ".hl"], { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.55, stagger: 0.12, ease: "power3.out" }, 0.45);
      tl.fromTo("#desc", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45 }, 1.05);
      tl.fromTo("#tag", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, 1.25);
      // 绿高亮扫过第二行
      tl.to("#hlbg", { scaleX: 1, duration: 0.38, ease: "power2.inOut" }, 1.15);
      // 书页卡：升起 + 微 3D 倾斜落位
      tl.fromTo("#shadow", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.75);
      tl.fromTo("#page", { y: 150, rotateX: 16, opacity: 0, transformPerspective: 1400 },
        { y: 0, rotateX: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 0.7);
      // 绿色扫光掠过页面
      tl.fromTo("#sweep", { xPercent: -100 }, { xPercent: 100, duration: 0.8, ease: "power2.inOut" }, 1.6);
      // 底部署名条
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 1.9);
      tl.fromTo([".bps-foot .f1", ".bps-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 2.15);
      // 呼吸浮动（演完前保持书页活着）
      tl.to("#page", { y: -8, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.4);
      tl.to("#shadow", { x: 4, y: 4, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
