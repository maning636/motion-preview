<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"LLM 的可见与不可见"},{"id":"subtitle","type":"string","label":"副标题","default":"水面之上 10%，水面之下 90%"},{"id":"visible","type":"string","label":"可见部分","default":"Chat 界面 · 生成结果"},{"id":"visibleDesc","type":"string","label":"可见描述","default":"用户能直接感知的交互"},{"id":"hidden","type":"string","label":"隐藏部分","default":"参数 · 数据 · 推理 · 价值观"},{"id":"hiddenDesc","type":"string","label":"隐藏描述","default":"决定质量的隐性基础"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 40px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 12px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 400; opacity: 0.55; }
      .chart-area{ position: relative; width: 100%; height: 680px; display: flex; align-items: center; justify-content: center; gap: 80px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .iceberg{ position: relative; width: 520px; height: 100%;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .water{ position: absolute; left: 0; right: 0; top: 35%; height: 2px; background: rgba(244,239,231,0.4);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .water-label{ position: absolute; right: 0; top: 35%; transform: translateY(-24px); font-family: 'MEBHeiHeiTi', sans-serif; font-size: 16px; opacity: 0.5; }
      .tip{ position: absolute; left: 50%; top: 8%; transform: translateX(-50%); width: 0; height: 0; border-left: 100px solid transparent; border-right: 100px solid transparent; border-bottom: 160px solid var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .body{ position: absolute; left: 50%; top: 35%; transform: translateX(-50%); width: 0; height: 0; border-left: 220px solid transparent; border-right: 220px solid transparent; border-top: 380px solid rgba(244,239,231,0.08);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .side{ width: 420px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .side-block{ border-left: 3px solid rgba(244,239,231,0.18); padding-left: 28px; margin-bottom: 48px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .side-block.accent{ border-left-color: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .side-title{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 8px; }
      .side-block.accent .side-title{ color: var(--accent);font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .side-desc{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 20px; opacity: 0.55; }
      .ratio{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 18px; opacity: 0.4; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <div class="iceberg">
            <div class="tip"></div>
            <div class="water"></div>
            <div class="water-label">WATERLINE</div>
            <div class="body"></div>
          </div>
          <div class="side">
            <div class="side-block accent">
              <div class="side-title" id="visible"></div>
              <div class="side-desc" id="visibleDesc"></div>
              <div class="ratio">VISIBLE ~10%</div>
            </div>
            <div class="side-block">
              <div class="side-title" id="hidden"></div>
              <div class="side-desc" id="hiddenDesc"></div>
              <div class="ratio">HIDDEN ~90%</div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "LLM 的可见与不可见", subtitle: "水面之上 10%，水面之下 90%", visible: "Chat 界面 · 生成结果", visibleDesc: "用户能直接感知的交互", hidden: "参数 · 数据 · 推理 · 价值观", hiddenDesc: "决定质量的隐性基础", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      document.getElementById("visible").textContent = v.visible;
      document.getElementById("visibleDesc").textContent = v.visibleDesc;
      document.getElementById("hidden").textContent = v.hidden;
      document.getElementById("hiddenDesc").textContent = v.hiddenDesc;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo(".water", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.5);
      tl.fromTo(".tip", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.7);
      tl.fromTo(".body", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.9);
      tl.fromTo(".side-block", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, stagger: 0.15, ease: "power2.out" }, 1.1);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
