<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "left", "type": "string", "label": "左侧标签", "default": "方案 A"}, {"id": "right", "type": "string", "label": "右侧标签", "default": "方案 B"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#stage{ position:absolute; inset:0; overflow:hidden; }
.half{ position:absolute; top:0; height:1080px; width:1075px; will-change:transform;
  display:flex; align-items:center; justify-content:center; flex-direction:column; }
#hl{ left:0; background:#101820; clip-path:polygon(0 0,1075px 0,845px 1080px,0 1080px); }
#hr{ left:845px; background:#181410; clip-path:polygon(230px 0,1075px 0,1075px 1080px,0 1080px); }
.half h3{ font-size:120px; font-weight:900; }
#hl h3{ color:var(--accent); }
.half .sub{ margin-top:18px; font-size:26px; letter-spacing:6px; opacity:.45; font-family:'MiSans SemiBold',sans-serif; }
#flash{ position:absolute; inset:0; background:#FFF; opacity:0; pointer-events:none; }
#vs{ position:absolute; left:50%; top:50%; width:220px; height:220px; margin:-110px 0 0 -110px;
  border-radius:50%; background:var(--fg); color:#0A0A0F; display:none;
  align-items:center; justify-content:center; font-size:96px; font-weight:900;
  box-shadow:0 20px 60px rgba(0,0,0,.5); will-change:transform; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">

<div id="stage">
  <div class="half" id="hl"><h3 id="l3"></h3><div class="sub">BEFORE</div></div>
  <div class="half" id="hr"><h3 id="r3"></h3><div class="sub">AFTER</div></div>
  <div id="flash"></div>
  <div id="vs">VS</div>
</div>

    </div>
    <script>
      const FB = {"left": "方案 A", "right": "方案 B", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#l3').textContent=v.left||'';$('#r3').textContent=v.right||'';
// 两半屏带 78° 斜缝从画外 ±1200px ease-in(cubic) 10f 对冲撞合
gsap.set('#hl',{x:-1200}); gsap.set('#hr',{x:1200});
tl.to('#hl',{x:0,duration:F(10),ease:'power3.in'},F(10));
tl.to('#hr',{x:0,duration:F(10),ease:'power3.in'},F(10));
// 撞击帧 f20 三件套同帧起跑：白闪 + 震屏 + VS 盖章
tl.fromTo('#flash',{opacity:.9},{opacity:0,duration:F(3),ease:'none'},F(20));
const sh={f:0};
tl.to(sh,{f:5,duration:F(5),ease:'none',onUpdate:()=>{
  const a=12*Math.exp(-sh.f/1.6);
  $('#stage').style.transform='translate('+(a*Math.sin(sh.f*6.1)).toFixed(1)+'px,'+(a*0.7*Math.cos(sh.f*5.3)).toFixed(1)+'px)';
}},F(20));
tl.set('#stage',{clearProps:'transform'},F(26));
tl.set('#vs',{display:'flex'},F(20));
tl.fromTo('#vs',{scale:1.6},{scale:1,duration:F(6),ease:'back.out(2.6)'},F(20));
tl.to({},{duration:F(109)},F(26));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
