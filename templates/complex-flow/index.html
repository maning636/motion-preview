<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"RAG 检索流水线"},{"id":"steps","type":"string","label":"步骤名（逗号分隔）","default":"Query,Retrieve,Rank,Prompt,Generate"},{"id":"latencies","type":"string","label":"每步耗时 ms（逗号分隔）","default":"80,220,150,90,1200"},{"id":"highlightStart","type":"number","label":"高亮起始步骤（1-based）","default":3},{"id":"highlightEnd","type":"number","label":"高亮结束步骤（1-based）","default":4},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 56px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .flow-area{ position: relative; height: 640px; display: flex; align-items: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .track{ position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(244,239,231,0.10); transform: translateY(-50%);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .nodes{ position: relative; width: 100%; display: flex; justify-content: space-between; align-items: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node{ position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node-box{ width: 220px; height: 120px; border: 1px solid rgba(244,239,231,0.18); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(244,239,231,0.02);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node-name{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 24px; font-weight: 700; text-transform: uppercase; }
      .node-latency{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 16px; font-weight: 500; opacity: 0.5; }
      .node-index{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 0.12em; opacity: 0.35; margin-top: 4px; }
      .node.active .node-box{ border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node.active .node-name{ color: var(--accent);font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .connector-line{ position: absolute; top: 50%; height: 2px; background: rgba(244,239,231,0.10); transform: translateY(-50%);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
        </div>
        <div class="flow-area">
          <div class="track"></div>
          <div class="nodes" id="nodes"></div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "RAG 检索流水线", steps: "Query,Retrieve,Rank,Prompt,Generate", latencies: "80,220,150,90,1200", highlightStart: 3, highlightEnd: 4, accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      const steps = String(v.steps).split(",").map(s => s.trim());
      const latencies = String(v.latencies).split(",").map(s => s.trim());
      const hStart = Math.max(1, Number(v.highlightStart) || 1);
      const hEnd = Math.max(hStart, Number(v.highlightEnd) || hStart);
      const nodesContainer = document.getElementById("nodes");
      steps.forEach((step, i) => {
        const active = i + 1 >= hStart && i + 1 <= hEnd;
        const node = document.createElement("div");
        node.className = "node" + (active ? " active" : "");
        node.innerHTML = `
          <div class="node-box">
            <span class="node-name">${step}</span>
            <span class="node-latency">${latencies[i] || "0"} ms</span>
          </div>
          <span class="node-index">STEP 0${i + 1}</span>
        `;
        nodesContainer.appendChild(node);
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".track", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 0.3);
      document.querySelectorAll(".node").forEach((node, i) => {
        tl.fromTo(node, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5 + i * 0.18);
        tl.fromTo(node.querySelector(".node-box"), { scale: 0.95 }, { scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.55 + i * 0.18);
      });
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
