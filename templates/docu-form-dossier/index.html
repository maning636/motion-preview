<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "表格标题", "default": "自动化任务运行登记表"}, {"id": "cols", "type": "string", "label": "列名（逗号分隔）", "default": "日期,任务,耗时,状态"}, {"id": "rowsdata", "type": "string", "label": "行数据（分号隔行，逗号隔列）", "default": "08-09,脚本定稿,12分钟,完成;08-10,素材抓取,8分钟,完成;08-11,视频渲染,21分钟,完成;08-12,全平台发布,15分钟,完成;08-13,数据复盘,9分钟,进行中"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #F1EDE0; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #1D1D20; }
      .paper{ position: absolute; left: 300px; top: 90px; width: 1320px; height: 900px;
        background: #FFFDF7; border: 2px solid #1D1D20; padding: 48px 60px;
        box-shadow: 10px 10px 0 rgba(29,29,32,.10); }
      .p-head{ display: flex; align-items: baseline; justify-content: space-between; }
      .p-title{ font-size: 46px; font-weight: 900; letter-spacing: .04em; }
      .p-meta{ font-size: 22px; color: #6B6560; }
      .p-table{ width: 100%; margin-top: 30px; border-collapse: collapse; }
      .p-table th{ font-size: 24px; font-weight: 800; text-align: left; padding: 13px 18px;
        border: 1.5px solid #1D1D20; background: rgba(30,122,70,.12); }
      .p-table td{ font-size: 27px; font-weight: 600; padding: 16px 18px; border: 1.5px solid #1D1D20; }
      .p-table td .c{ display: inline-block; clip-path: inset(0 100% 0 0); }
      .p-table tbody tr:nth-child(even){ background: rgba(29,29,32,.03); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="paper" id="paper">
        <div class="p-head"><h1 class="p-title" id="title"></h1><span class="p-meta mono">录入：系统自动 · 2026-08-13</span></div>
        <table class="p-table"><thead><tr id="headRow"></tr></thead><tbody id="rows"></tbody></table>
      </div>

    </div>
    <script>
      const fallback = {"title": "自动化任务运行登记表", "cols": "日期,任务,耗时,状态", "rowsdata": "08-09,脚本定稿,12分钟,完成;08-10,素材抓取,8分钟,完成;08-11,视频渲染,21分钟,完成;08-12,全平台发布,15分钟,完成;08-13,数据复盘,9分钟,进行中", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      $("title").textContent = V.title;
      const cols = split(V.cols);
      const headRow = $("headRow");
      cols.forEach((c) => {
        const th = document.createElement("th");
        th.textContent = c;
        headRow.appendChild(th);
      });
      const rows = String(V.rowsdata ?? "").split(";").map((r) => r.split(",").map((x) => x.trim())).filter((r) => r.some(Boolean));
      const rowsEl = $("rows");
      rows.forEach((r) => {
        const tr = document.createElement("tr");
        cols.forEach((_, j) => {
          const td = document.createElement("td");
          const sp = document.createElement("span");
          sp.className = "c";
          sp.textContent = r[j] ?? "";
          td.appendChild(sp);
          tr.appendChild(td);
        });
        rowsEl.appendChild(tr);
      });
      tl.fromTo("#paper", { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#title", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.2);
      tl.fromTo(".p-meta", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0.35);
      tl.fromTo(".p-table thead th", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.06 }, 0.5);
      tl.to(".p-table td .c", { clipPath: "inset(0 0% 0 0)", duration: 0.16, stagger: 0.07, ease: "none" }, 0.75);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
