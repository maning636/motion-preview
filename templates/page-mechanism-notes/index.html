<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "VOL.15 · 视觉动效库"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.380 / 400"}, {"id": "title", "type": "string", "label": "页面标题", "default": "这套机制怎么跑起来"}, {"id": "items", "type": "string", "label": "机制条目（标题|说明，分号分隔，3 条）", "default": "输入层|原始素材统一收进一个入口；处理层|规则引擎先做清洗再分流；输出层|成品自动归档并回传数据"}, {"id": "notes", "type": "string", "label": "便签文字（分号分隔，3 条）", "default": "先收口，再分流；清洗先于分发；数据闭环回流"}, {"id": "img1", "type": "image", "label": "配图（竖版 3:4）", "default": "./assets/mech.png"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 7}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .mns-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .mns-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .mns-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .mns-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 标题 */
      .mns-kicker{ position: absolute; left: 110px; top: 140px; font-size: 21px; letter-spacing: .3em; color: #9A9A92; }
      .mns-title{ position: absolute; left: 110px; top: 182px; font-size: 62px; font-weight: 900; letter-spacing: .01em; }
      /* 左栏机制条目 */
      .mns-list{ position: absolute; left: 110px; top: 300px; width: 690px; z-index: 4;
        display: flex; flex-direction: column; gap: 34px; }
      .mns-item{ position: relative; background: #EAE9E1; border: 3px solid #9A9A92;
        padding: 26px 30px 26px 46px; }
      .mns-item .gbar{ position: absolute; left: 0; top: 0; bottom: 0; width: 8px;
        background: var(--ac, #00FF00); transform: scaleY(0); transform-origin: 50% 100%; }
      .mns-item .no{ font-size: 17px; letter-spacing: .22em; color: #9A9A92; }
      .mns-item .tt{ margin-top: 6px; font-size: 32px; font-weight: 900; color: #9A9A92; }
      .mns-item .ds{ margin-top: 8px; font-family: 'MiSans SemiBold', sans-serif; font-size: 21px;
        line-height: 1.55; color: #9A9A92; }
      /* 荧光绿便签 */
      .mns-note{ position: absolute; left: 836px; width: 300px; padding: 16px 18px; z-index: 5;
        background: var(--ac, #00FF00); border: 3px solid #141414; box-shadow: 8px 8px 0 #141414;
        font-family: 'MiSans SemiBold', sans-serif; font-size: 21px; line-height: 1.45; color: #141414;
        transform: rotate(-2deg); opacity: 0; }
      .mns-note .nl{ display: block; font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace;
        font-size: 14px; letter-spacing: .26em; opacity: .6; margin-bottom: 6px; }
      /* 右栏配图页 */
      .mns-stage{ position: absolute; right: 150px; top: 176px; width: 520px; height: 693px; z-index: 3; }
      .mns-shadow{ position: absolute; left: 16px; top: 16px; width: 520px; height: 693px; background: #141414; }
      .mns-page{ position: absolute; left: 0; top: 0; width: 520px; height: 693px; background: #fff;
        border: 3px solid #141414; overflow: hidden; }
      .mns-page img{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /* 底部绿色署名条 */
      .mns-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(60px); }
      .mns-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .mns-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <div class="mns-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="mns-kicker mono">MECHANISM · 机制拆解</div>
      <div class="mns-title" id="title"></div>
      <div class="mns-list" id="list"></div>
      <div class="mns-stage">
        <div class="mns-shadow" id="shadow"></div>
        <div class="mns-page" id="page"><img id="pg" src="./assets/mech.png" alt="" /></div>
      </div>
      <div class="mns-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · MECHANISM NOTES</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "VOL.15 · 视觉动效库", "pageno": "P.380 / 400", "title": "这套机制怎么跑起来", "items": "输入层|原始素材统一收进一个入口；处理层|规则引擎先做清洗再分流；输出层|成品自动归档并回传数据", "notes": "先收口，再分流；清洗先于分发；数据闭环回流", "img1": "./assets/mech.png", "accent": "#00FF00", "duration": 7};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      $("title").textContent = V.title;
      if (V.img1) $("pg").src = V.img1;
      const items = String(V.items).split(/[;；]/).map((s) => s.trim()).filter(Boolean).slice(0, 3);
      const notes = String(V.notes).split(/[;；]/).map((s) => s.trim());
      const list = $("list");
      const itemTops = [];
      items.forEach((it, i) => {
        const [tt, ds] = it.split(/[|｜]/).map((s) => (s || "").trim());
        const card = document.createElement("div");
        card.className = "mns-item";
        card.id = "item" + i;
        const bar = document.createElement("div"); bar.className = "gbar"; bar.id = "gbar" + i;
        const no = document.createElement("div"); no.className = "no mono"; no.textContent = "STEP 0" + (i + 1);
        const t = document.createElement("div"); t.className = "tt"; t.textContent = tt || it;
        const d = document.createElement("div"); d.className = "ds"; d.textContent = ds || "";
        card.appendChild(bar); card.appendChild(no); card.appendChild(t); card.appendChild(d);
        list.appendChild(card);
        // 便签：翻到条目与配图之间做注解
        const note = document.createElement("div");
        note.className = "mns-note";
        note.id = "note" + i;
        note.style.top = (300 + i * (180 + 34) + 24) + "px";
        const nl = document.createElement("span"); nl.className = "nl"; nl.textContent = "NOTE 0" + (i + 1);
        note.appendChild(nl);
        note.appendChild(document.createTextNode(notes[i] || ""));
        $("root").appendChild(note);
      });
      const n = items.length;
      // 页眉细线 + 文字
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      tl.fromTo(".mns-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, 0.3);
      tl.fromTo("#title", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
      // 右栏配图页落位
      tl.fromTo("#shadow", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.65);
      tl.fromTo("#page", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.55);
      // 条目灰底入场
      tl.fromTo(".mns-item", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, stagger: 0.1, ease: "power3.out" }, 0.9);
      // 逐条翻亮 + 绿条 scaleY + 便签翻出
      items.forEach((_, i) => {
        const t = 1.7 + i * 1.25;
        tl.to("#item" + i, { backgroundColor: "#FFFFFF", borderColor: "#141414",
          boxShadow: "8px 8px 0 #141414", duration: 0.3, ease: "power2.out" }, t);
        tl.to("#item" + i + " .tt", { color: "#141414", duration: 0.3 }, t);
        tl.to("#item" + i + " .ds", { color: "#55554E", duration: 0.3 }, t);
        tl.to("#item" + i + " .no", { color: "#141414", duration: 0.3 }, t);
        tl.to("#gbar" + i, { scaleY: 1, duration: 0.4, ease: "power2.out" }, t + 0.05);
        tl.fromTo("#note" + i, { opacity: 0, rotateY: -90, transformPerspective: 900, transformOrigin: "0% 50%" },
          { opacity: 1, rotateY: 0, duration: 0.55, ease: "back.out(1.5)" }, t + 0.28);
      });
      // 底部署名条（提前进场，定格后文字完全静止 ≥1.5s）
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 4.8);
      tl.fromTo([".mns-foot .f1", ".mns-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 5.0);
      // 时间轴补满到 duration，保证收尾完全静止
      tl.set("#root", {}, Math.max(0, Number(V.duration) - 0.01));
      window.__timelines.main = tl;
    </script>
  </body>
</html>
