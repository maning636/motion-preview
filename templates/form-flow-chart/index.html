<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "表单标题", "default": "AI 任务审批流程单"}, {"id": "items", "type": "string", "label": "行项目（逗号分隔）", "default": "提交需求单,部门初审,合规复核,预算核准,归档备案"}, {"id": "note", "type": "string", "label": "批注文字", "default": "此项须双人复核"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#C8392E"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #F1EDE0; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #1D1D20; }
      .paper{ position: absolute; left: 320px; top: 90px; width: 1280px; height: 900px;
        background: #FFFDF7; border: 2px solid #1D1D20; padding: 48px 64px;
        box-shadow: 10px 10px 0 rgba(29,29,32,.10); }
      .p-no{ position: absolute; right: 64px; top: 44px; font-size: 22px; color: #6B6560; letter-spacing: .08em; }
      .p-title{ font-size: 54px; font-weight: 900; letter-spacing: .06em; text-align: center; }
      .p-rule{ width: 560px; height: 8px; margin: 20px auto 34px; background: #1E7A46; border-radius: 4px;
        transform-origin: left center; }
      .p-table{ width: 100%; border-collapse: collapse; }
      .p-table th{ font-size: 26px; font-weight: 800; text-align: left; padding: 14px 20px;
        border: 1.5px solid #1D1D20; background: rgba(30,122,70,.10); }
      .p-table td{ font-size: 30px; font-weight: 700; padding: 20px; border: 1.5px solid #1D1D20; }
      .stamp{ display: inline-block; padding: 4px 18px; border: 4px solid var(--accent, #C8392E);
        color: var(--accent, #C8392E); border-radius: 6px; font-size: 28px; font-weight: 900;
        letter-spacing: .12em; transform: rotate(-8deg); }
      .p-circle{ position: absolute; pointer-events: none; overflow: visible; }
      .p-circle ellipse{ stroke: var(--accent, #C8392E); }
      .p-note{ position: absolute; display: flex; align-items: center; gap: 12px;
        color: var(--accent, #C8392E); font-size: 30px; font-weight: 800; font-style: italic;
        max-width: 520px; }
      .p-note .arr{ font-size: 44px; font-style: normal; }
      .p-sign{ position: absolute; left: 64px; bottom: 44px; font-size: 26px; font-weight: 700; color: #3A3733; }
      .p-sign .u{ display: inline-block; width: 180px; border-bottom: 2.5px solid #1D1D20; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="paper" id="paper">
        <div class="p-no mono">No.2026-0813 · 审批联</div>
        <h1 class="p-title" id="title"></h1>
        <div class="p-rule" id="rule"></div>
        <table class="p-table">
          <thead><tr><th style="width:130px">序号</th><th>审批事项</th><th style="width:230px">状态</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <svg class="p-circle" id="circle" viewBox="0 0 1200 130" preserveAspectRatio="none">
          <ellipse id="circleEl" cx="600" cy="65" rx="560" ry="50" fill="none" stroke-width="7" stroke-linecap="round"/>
        </svg>
        <div class="p-note" id="noteWrap"><span class="arr">←</span><span id="note"></span></div>
        <div class="p-sign" id="sign">审批人：<span class="u"></span>　复核人：<span class="u"></span>　日期：<span class="u"></span></div>
      </div>

    </div>
    <script>
      const fallback = {"title": "AI 任务审批流程单", "items": "提交需求单,部门初审,合规复核,预算核准,归档备案", "note": "此项须双人复核", "accent": "#C8392E", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      document.documentElement.style.setProperty("--accent", V.accent ?? "#C8392E");
      $("title").textContent = V.title;
      $("note").textContent = V.note;
      const items = split(V.items);
      const rowsEl = $("rows");
      items.forEach((it, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td class="mono">${String(i + 1).padStart(2, "0")}</td><td class="item"></td><td class="st"><span class="stamp">已办</span></td>`;
        tr.querySelector(".item").textContent = it;
        rowsEl.appendChild(tr);
      });
      // 红圈定位到重点行（第 3 行，不足则最后一行）
      const keyIdx = Math.min(2, items.length - 1);
      const keyRow = rowsEl.children[keyIdx];
      const circle = $("circle"), ellipse = $("circleEl");
      const paperRect = $("paper").getBoundingClientRect();
      const r = keyRow.getBoundingClientRect();
      circle.style.left = (r.left - paperRect.left - 30) + "px";
      circle.style.top = (r.top - paperRect.top - 22) + "px";
      circle.style.width = (r.width + 60) + "px";
      circle.style.height = (r.height + 44) + "px";
      // 批注放在纸张右侧留白区（斜放，不与签名栏挤），箭头左指红圈
      const noteWrap = $("noteWrap");
      noteWrap.style.left = (paperRect.width + 16) + "px";
      noteWrap.style.top = (r.top - paperRect.top - 8) + "px";
      noteWrap.style.maxWidth = "286px";
      gsap.set(noteWrap, { rotation: -6 });
      const len = ellipse.getTotalLength();
      ellipse.style.strokeDasharray = String(len);
      ellipse.style.strokeDashoffset = String(len);

      tl.fromTo("#paper", { y: 48, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#title", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, 0.25);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.45);
      tl.fromTo("#rows tr", { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.18, ease: "power2.out" }, 0.7);
      tl.fromTo(".stamp", { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, stagger: 0.18, ease: "power4.in" }, 0.95);
      const tDone = 0.7 + items.length * 0.18 + 0.35;
      tl.to(ellipse, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, tDone);
      tl.fromTo("#noteWrap", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, tDone + 0.45);
      tl.fromTo("#sign", { opacity: 0 }, { opacity: 1, duration: 0.4 }, tDone + 0.75);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
