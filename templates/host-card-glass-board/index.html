<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"hostName","type":"string","label":"主讲人姓名","default":"林知远"},
  {"id":"hostTitle","type":"string","label":"主讲人头衔","default":"AI 产品负责人"},
  {"id":"hostRole","type":"string","label":"主讲人角色标签","default":"主讲"},
  {"id":"boardTitle","type":"string","label":"信息板标题","default":"今天聊什么"},
  {"id":"boardItems","type":"string","label":"信息板条目（换行分隔）","default":"从 0 到 1 的产品判断\nAI 协作工作流\n团队落地节奏\n避坑与复盘"},
  {"id":"accent","type":"color","label":"强调色","default":"#00FF00"},
  {"id":"background","type":"color","label":"背景色","default":"#0E1116"},
  {"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},
  {"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"},{"value":"webm","label":"WebM"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

      *{ box-sizing: border-box; }
      html, body{
        margin:0; width:1920px; height:1080px; overflow:hidden;
        background: var(--background, #0E1116);
      }
      #root{
        position:relative; width:1920px; height:1080px; overflow:hidden;
        background: var(--background, #0E1116);
        color: var(--foreground, #F4EFE7);
        font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #scene{
        position:absolute; inset:0;
      }

      /* ---------- 背景层次：径向光斑 + 点阵 ---------- */
      .ambient{
        position:absolute; inset:0; pointer-events:none; overflow:hidden;
      }
      .ambient .glow{
        position:absolute; border-radius:50%;
        filter: blur(120px);
        opacity: .55;
      }
      .ambient .glow.g1{
        width: 900px; height: 900px;
        left: -260px; top: -240px;
        background: color-mix(in srgb, var(--accent, #00FF00) 22%, transparent);
      }
      .ambient .glow.g2{
        width: 1100px; height: 1100px;
        right: -360px; bottom: -420px;
        background: color-mix(in srgb, var(--foreground, #F4EFE7) 8%, transparent);
      }
      .gridbg{
        position:absolute; inset:0; pointer-events:none;
        background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px);
        background-size: 48px 48px;
        opacity: .55;
        mask-image: radial-gradient(ellipse at center, #000 40%, transparent 90%);
        -webkit-mask-image: radial-gradient(ellipse at center, #000 40%, transparent 90%);
      }

      /* ---------- 顶头 eyebrow ---------- */
      .eyebrow{
        position:absolute; top: 56px; left: 96px; right: 96px;
        display:flex; justify-content:space-between; align-items:center;
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-size: 16px; letter-spacing:.22em; text-transform:uppercase;
        color: #8A8A85;
      }
      .eyebrow .acc{ color: var(--accent, #00FF00); font-weight: 700; letter-spacing:.18em; }
      .eyebrow .dot{
        display:inline-block; width:6px; height:6px; border-radius:50%;
        background: var(--accent, #00FF00);
        box-shadow: 0 0 10px color-mix(in srgb, var(--accent, #00FF00) 70%, transparent);
        margin-right: 10px; vertical-align: middle;
      }

      /* ---------- 舞台：左右分栏 ---------- */
      .split{
        position:absolute;
        left: 96px; right: 96px; top: 150px; bottom: 120px;
        display: grid;
        grid-template-columns: 620px 1fr;
        grid-template-rows: 1fr;
        gap: 88px;
      }

      /* ---------- 左：主讲人卡 ---------- */
      .host{
        position:relative;
        display:flex; flex-direction:column; align-items:flex-start;
        padding-top: 30px;
        opacity:0; will-change: transform, opacity;
      }
      .host .role-chip{
        display:inline-flex; align-items:center; gap:10px;
        padding: 8px 18px;
        border:1px solid color-mix(in srgb, var(--accent, #00FF00) 55%, transparent);
        background: color-mix(in srgb, var(--accent, #00FF00) 10%, transparent);
        border-radius: 999px;
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-size: 18px; letter-spacing:.18em; color: var(--accent, #00FF00);
        text-transform: uppercase;
      }
      .host .role-chip .live{
        display:inline-block; width:8px; height:8px; border-radius:50%;
        background: var(--accent, #00FF00);
        box-shadow: 0 0 12px color-mix(in srgb, var(--accent, #00FF00) 80%, transparent);
      }

      .avatar-wrap{
        margin-top: 34px;
        position:relative;
        width: 360px; height: 360px;
      }
      .avatar-ring{
        position:absolute; inset:0;
        border-radius:50%;
        border: 1.5px solid color-mix(in srgb, var(--accent, #00FF00) 55%, transparent);
        opacity: .55;
      }
      .avatar-ring.r2{
        inset: 22px;
        border: 1px dashed color-mix(in srgb, var(--foreground, #F4EFE7) 25%, transparent);
        opacity: .8;
      }
      .avatar-svg{
        position:absolute; inset:40px;
        width: calc(100% - 80px); height: calc(100% - 80px);
        border-radius: 50%;
        background:
          radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--accent, #00FF00) 45%, transparent), transparent 55%),
          radial-gradient(circle at 70% 75%, color-mix(in srgb, var(--foreground, #F4EFE7) 22%, transparent), transparent 60%),
          linear-gradient(140deg,
            color-mix(in srgb, var(--background, #0E1116) 85%, transparent),
            color-mix(in srgb, var(--foreground, #F4EFE7) 10%, transparent)
          );
        border: 1px solid color-mix(in srgb, var(--foreground, #F4EFE7) 18%, transparent);
        box-shadow:
          inset 0 1px 0 color-mix(in srgb, var(--foreground, #F4EFE7) 20%, transparent),
          0 30px 60px rgba(0,0,0,.35),
          0 0 60px color-mix(in srgb, var(--accent, #00FF00) 22%, transparent);
        display:grid; place-items:center;
        overflow: hidden;
      }
      .avatar-initial{
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-weight: 700;
        font-size: 168px;
        line-height: 1;
        letter-spacing: -.04em;
        color: var(--foreground, #F4EFE7);
        text-shadow:
          0 0 40px color-mix(in srgb, var(--accent, #00FF00) 40%, transparent);
      }
      .avatar-badge{
        position:absolute; right: -8px; bottom: -8px;
        width: 84px; height: 84px; border-radius:50%;
        background: var(--accent, #00FF00);
        color: #0A0A0A;
        display:grid; place-items:center;
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-size: 14px; letter-spacing:.14em; font-weight:700;
        box-shadow:
          0 0 0 4px var(--background, #0E1116),
          0 0 24px color-mix(in srgb, var(--accent, #00FF00) 55%, transparent);
        text-transform: uppercase;
      }

      .host .name{
        margin-top: 38px;
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-weight: 700;
        font-size: 64px;
        letter-spacing: -.02em;
        line-height: 1.05;
        color: var(--foreground, #F4EFE7);
      }
      .host .title{
        margin-top: 12px;
        font-size: 22px;
        letter-spacing: .06em;
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 70%, transparent);
        display:flex; align-items:center; gap:14px;
      }
      .host .title::before{
        content:""; display:inline-block;
        width: 36px; height: 2px;
        background: var(--accent, #00FF00);
        box-shadow: 0 0 8px color-mix(in srgb, var(--accent, #00FF00) 55%, transparent);
      }

      /* ---------- 右：玻璃拟态信息板 ---------- */
      .board{
        position:relative;
        border-radius: 28px;
        padding: 56px 56px 48px;
        background:
          linear-gradient(155deg,
            rgba(255,255,255,.09) 0%,
            rgba(255,255,255,.03) 55%,
            rgba(255,255,255,.06) 100%);
        backdrop-filter: blur(24px) saturate(140%);
        -webkit-backdrop-filter: blur(24px) saturate(140%);
        border: 1px solid color-mix(in srgb, var(--foreground, #F4EFE7) 22%, transparent);
        box-shadow:
          inset 0 1px 0 color-mix(in srgb, var(--foreground, #F4EFE7) 30%, transparent),
          0 40px 80px rgba(0,0,0,.45),
          0 0 40px color-mix(in srgb, var(--accent, #00FF00) 12%, transparent);
        overflow: hidden;
        opacity:0; will-change: transform, opacity;
      }
      .board::before{
        content:""; position:absolute; inset:0; pointer-events:none;
        background:
          radial-gradient(circle at 90% 10%,
            color-mix(in srgb, var(--accent, #00FF00) 22%, transparent) 0%,
            transparent 40%),
          radial-gradient(circle at 10% 100%,
            color-mix(in srgb, var(--foreground, #F4EFE7) 8%, transparent) 0%,
            transparent 45%);
      }
      .board::after{
        content:""; position:absolute; top:0; left:0; right:0; height:1px;
        background: linear-gradient(90deg,
          transparent 0%,
          color-mix(in srgb, var(--foreground, #F4EFE7) 60%, transparent) 40%,
          color-mix(in srgb, var(--foreground, #F4EFE7) 60%, transparent) 60%,
          transparent 100%);
        opacity: .55;
      }

      .board-head{
        position:relative;
        display:flex; align-items:center; justify-content:space-between;
        margin-bottom: 34px;
      }
      .board-head .b-eyebrow{
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-size: 15px; letter-spacing: .28em;
        color: var(--accent, #00FF00);
        text-transform: uppercase;
        font-weight: 700;
      }
      .board-head .b-index{
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-size: 15px; letter-spacing: .22em;
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 55%, transparent);
      }
      .board-title{
        position:relative;
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-weight: 700;
        font-size: 48px;
        letter-spacing: -.01em;
        line-height: 1.1;
        color: var(--foreground, #F4EFE7);
        margin: 0 0 28px;
      }

      .board-list{
        position:relative;
        list-style: none;
        padding: 0; margin: 0;
        display: flex; flex-direction: column;
        gap: 16px;
      }
      .boardItem{
        display: flex; align-items: center;
        gap: 20px;
        padding: 20px 24px;
        border-radius: 14px;
        background: color-mix(in srgb, var(--foreground, #F4EFE7) 5%, transparent);
        border: 1px solid color-mix(in srgb, var(--foreground, #F4EFE7) 10%, transparent);
        font-size: 24px;
        line-height: 1.35;
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 88%, transparent);
        opacity: 0;
        will-change: transform, opacity;
      }
      .boardItem .num{
        flex: none;
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: .08em;
        width: 42px; height: 42px;
        display:grid; place-items:center;
        border-radius: 10px;
        background: color-mix(in srgb, var(--accent, #00FF00) 14%, transparent);
        color: var(--accent, #00FF00);
        border: 1px solid color-mix(in srgb, var(--accent, #00FF00) 45%, transparent);
      }
      .boardItem .txt{ flex: 1; }
      .boardItem .tag{
        flex: none;
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-size: 13px;
        letter-spacing: .18em;
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 45%, transparent);
        text-transform: uppercase;
      }

      /* ---------- 脚注 ---------- */
      .footnote{
        position:absolute; bottom: 56px; left: 96px; right: 96px;
        display:flex; align-items:center; justify-content:space-between;
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-size: 16px; letter-spacing:.16em;
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 50%, transparent);
        text-transform: uppercase;
      }
      .footnote .footL{ display:flex; align-items:center; gap: 12px; }
      .footnote .footL .dot{
        width: 6px; height: 6px; border-radius:50%;
        background: var(--accent, #00FF00);
        box-shadow: 0 0 10px color-mix(in srgb, var(--accent, #00FF00) 70%, transparent);
      }
      .footnote .footR{ color: var(--accent, #00FF00); font-weight: 700; letter-spacing: .2em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" data-start="0" data-duration="6" data-track-index="1">

        <div class="ambient">
          <div class="glow g1"></div>
          <div class="glow g2"></div>
        </div>
        <div class="gridbg"></div>

        <div class="eyebrow">
          <span><span class="dot"></span><b class="acc">SPEAKER</b>&nbsp;&nbsp;·&nbsp;&nbsp;AGENDA BOARD</span>
          <span>host · glass · board</span>
        </div>

        <div class="split">

          <!-- 左：主讲人 -->
          <div class="host" id="host">
            <span class="role-chip" id="roleChip">
              <span class="live"></span>
              <span id="hostRole">主讲</span>
            </span>
            <div class="avatar-wrap" id="hostAvatarWrap">
              <div class="avatar-ring"></div>
              <div class="avatar-ring r2"></div>
              <div class="avatar-svg" id="hostAvatar">
                <span class="avatar-initial" id="hostInitial">林</span>
              </div>
              <div class="avatar-badge" id="hostBadge">LIVE</div>
            </div>
            <h2 class="name" id="hostName">林知远</h2>
            <div class="title" id="hostTitle">AI 产品负责人</div>
          </div>

          <!-- 右：玻璃信息板 -->
          <div class="board" id="board">
            <div class="board-head">
              <span class="b-eyebrow">AGENDA</span>
              <span class="b-index" id="boardIndex">01 / 04</span>
            </div>
            <h3 class="board-title" id="boardTitle">今天聊什么</h3>
            <ul class="board-list" id="boardList">
              <li class="boardItem"><span class="num">01</span><span class="txt">从 0 到 1 的产品判断</span><span class="tag">Topic</span></li>
              <li class="boardItem"><span class="num">02</span><span class="txt">AI 协作工作流</span><span class="tag">Topic</span></li>
              <li class="boardItem"><span class="num">03</span><span class="txt">团队落地节奏</span><span class="tag">Topic</span></li>
              <li class="boardItem"><span class="num">04</span><span class="txt">避坑与复盘</span><span class="tag">Topic</span></li>
            </ul>
          </div>

        </div>

        <div class="footnote">
          <span class="footL"><span class="dot"></span><span id="footLeft">Speaker · Agenda</span></span>
          <span class="footR" id="footRight">host-card-glass-board</span>
        </div>

      </section>
    </div>
    <script>
      /* ----- 变量接线（与全库契约一致） ----- */
      const fallback = {
        hostName: "林知远",
        hostTitle: "AI 产品负责人",
        hostRole: "主讲",
        boardTitle: "今天聊什么",
        boardItems: "从 0 到 1 的产品判断\nAI 协作工作流\n团队落地节奏\n避坑与复盘",
        accent: "#00FF00",
        background: "#0E1116",
        foreground: "#F4EFE7",
      };
      const v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables()
        : fallback;

      const $ = (id) => document.getElementById(id);
      const html = document.documentElement;
      html.style.setProperty("--foreground", v.foreground || "#F4EFE7");
      html.style.setProperty("--background", v.background || "#0E1116");
      html.style.setProperty("--accent",     v.accent     || "#00FF00");

      const escapeHtml = (s) => String(s ?? "")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#39;");

      $("hostName").textContent  = v.hostName  || fallback.hostName;
      $("hostTitle").textContent = v.hostTitle || fallback.hostTitle;
      $("hostRole").textContent  = v.hostRole  || fallback.hostRole;
      $("boardTitle").textContent = v.boardTitle || fallback.boardTitle;

      // 首字头像
      const nameStr = String(v.hostName || fallback.hostName).trim();
      const initial = nameStr.charAt(0) || "•";
      $("hostInitial").textContent = initial;

      // 信息板条目（换行分隔，3-4 条）
      const setBoardItems = (raw) => {
        const ul = $("boardList");
        const idx = $("boardIndex");
        if (!ul) return;
        const lines = String(raw ?? "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
        const arr = lines.slice(0, 4);
        while (arr.length < 3) arr.push("");
        ul.innerHTML = arr.map((t, i) =>
          `<li class="boardItem"><span class="num">${String(i+1).padStart(2,"0")}</span><span class="txt">${escapeHtml(t)}</span><span class="tag">Topic</span></li>`
        ).join("");
        if (idx) idx.textContent = "01 / " + String(arr.length).padStart(2,"0");
      };
      setBoardItems(v.boardItems || fallback.boardItems);

      /* ----- 时间线 ----- */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 左侧主讲人卡：淡入 + 上移
      tl.fromTo("#host",
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      // 头像环缩放弹入
      tl.fromTo("#hostAvatar",
        { scale: 0.9, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, 0.25);
      tl.fromTo(".avatar-ring",
        { scale: 1.15, opacity: 0 },
        { scale: 1, opacity: 0.55, duration: 0.7, ease: "power2.out", stagger: 0.1 }, 0.3);
      tl.fromTo("#hostBadge",
        { scale: 0.6, opacity: 0, rotate: -20 },
        { scale: 1, opacity: 1, rotate: 0, duration: 0.5, ease: "back.out(1.8)" }, 0.7);

      // 右侧玻璃板：淡入 + 微上移
      tl.fromTo("#board",
        { opacity: 0, y: 32 },
        { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 0.5);

      // 板内条目错峰浮现（stagger 0.15s、x+20 → 0、opacity 0→1）
      tl.fromTo(".boardItem",
        { opacity: 0, x: 20 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power3.out", stagger: 0.15 }, 0.85);

      // 结尾稳定态：玻璃板光晕呼吸（sine.inOut），贯穿最后 2s 保持可读
      tl.fromTo("#board",
        { boxShadow: "inset 0 1px 0 rgba(244,239,231,.30), 0 40px 80px rgba(0,0,0,.45), 0 0 40px rgba(0,255,0,.12)" },
        { boxShadow: "inset 0 1px 0 rgba(244,239,231,.38), 0 40px 96px rgba(0,0,0,.55), 0 0 64px rgba(0,255,0,.24)",
          duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 2 }, 3.0);

      // 头像圆环持续微转（象征"直播中"）
      tl.fromTo(".avatar-ring",
        { rotation: 0, transformOrigin: "50% 50%" },
        { rotation: 12, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 0 }, 1.5);

      // LIVE 徽标呼吸光晕（贯穿 5s 起，1s 内 yoyo 呼吸）
      tl.fromTo("#hostBadge",
        { boxShadow: "0 0 0 4px rgba(14,17,22,1), 0 0 24px rgba(0,255,0,.55)" },
        { boxShadow: "0 0 0 4px rgba(14,17,22,1), 0 0 44px rgba(0,255,0,.88)",
          duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 2 }, 4.4);

      // 强制总时长 ≥ 6s（末尾留 0.6s 稳定态）
      tl.to({}, { duration: 0.1 }, 5.9);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
