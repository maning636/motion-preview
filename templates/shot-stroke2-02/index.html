<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#world{ position:absolute; left:0; top:0; width:3840px; height:1080px; will-change:transform; }
.sceneA{ position:absolute; left:0; top:0; width:1920px; height:1080px; }
.sceneB{ position:absolute; left:1920px; top:0; width:1920px; height:1080px; }
.aCard{ position:absolute; left:480px; top:380px; width:960px; height:400px; border:2px solid color-mix(in srgb, var(--fg) 22%, transparent);
  border-radius:18px; padding:48px; }
.aTitle{ font-size:44px; font-weight:800; }
.aSub{ margin-top:14px; font-size:22px; opacity:.55; font-family:'MiSans SemiBold',sans-serif; }
.track{ position:absolute; left:200px; top:260px; width:560px; height:10px; border-radius:5px;
  background:color-mix(in srgb, var(--fg) 14%, transparent); }
#wire{ position:absolute; left:0; top:0; width:3840px; height:1080px; pointer-events:none; }
#carry{ fill:none; stroke:var(--fg); stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
#head{ fill:var(--accent); }
.bCard{ position:absolute; left:680px; top:375px; width:560px; height:330px; padding:40px 44px; opacity:0; }
.bTitle{ font-size:40px; font-weight:800; color:var(--accent); }
.bLine{ margin-top:18px; height:14px; border-radius:7px; background:color-mix(in srgb, var(--fg) 30%, transparent); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.333333333333333" data-width="1920" data-height="1080">

<div id="world">
  <div class="sceneA">
    <div class="aCard">
      <div class="aTitle">数据同步中</div>
      <div class="aSub">进度条走满的那一刻，线带你去看结果 →</div>
      <div class="track"></div>
    </div>
  </div>
  <div class="sceneB">
    <div class="bCard" id="bCard">
      <div class="bTitle">同步完成</div>
      <div class="bLine" style="width:82%"></div>
      <div class="bLine" style="width:64%"></div>
      <div class="bLine" style="width:45%"></div>
    </div>
  </div>
  <svg id="wire" viewBox="0 0 3840 1080">
    <path id="carry" d="M 680 640 H 2600 V 375 H 3160 V 705 H 2600"/>
    <circle id="head" r="11" cx="680" cy="640"/>
  </svg>
</div>

    </div>
    <script>
      const FB = {"accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

const world=$('#world'), carry=$('#carry'), head=$('#head');
const L=carry.getTotalLength();
carry.style.strokeDasharray=L;
carry.style.strokeDashoffset=L;
const pen={d:0};
function paint(){
  carry.style.strokeDashoffset=Math.max(0,L-pen.d);
  const pt=carry.getPointAtLength(Math.min(pen.d,L-0.01));
  head.setAttribute('cx',pt.x); head.setAttribute('cy',pt.y);
}
// 镜头：f34-94 横移 1920px（inOut cubic）
tl.to(world,{x:-1920,duration:F(60),ease:'power2.inOut'},F(34));
// 线生长：seg1 f0-30 进度条 560px
tl.to(pen,{d:560,duration:F(30),ease:'none',onUpdate:paint},0);
// seg2 f30-34 冲出 260px（笔头到画面 x≈1500）
tl.to(pen,{d:820,duration:F(4),ease:'power1.in',onUpdate:paint},F(30));
// seg3 f34-94 与镜头同速 +1920px，笔头钉在画面 1500
tl.to(pen,{d:2740,duration:F(60),ease:'power2.inOut',onUpdate:paint},F(34));
// seg4 f94-112 围框闭合（余量）
tl.to(pen,{d:L,duration:F(18),ease:'power1.out',onUpdate:paint},F(94));
// f112-118 笔头消散
tl.to(head,{opacity:0,duration:F(6),ease:'none'},F(112));
// B 内容 f112-124 淡入
tl.to('#bCard',{opacity:1,y:0,duration:F(12),ease:'power2.out'},F(112));
gsap.set('#bCard',{y:24});
// 收尾真静止
tl.to({},{duration:F(36)},F(124));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
