<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "AUDIENCE / 涨粉复盘"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "哪一步真的拉来了人"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：人"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#FF5FA2"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>数据海报 · 哪一步真的拉来了人</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{display:flex;gap:32px}
  .hero{flex:1 1 0;min-width:0;border:var(--bw) solid var(--ink);border-radius:4px;
        padding:0 54px;display:flex;flex-direction:column;justify-content:center;gap:14px;
        box-shadow:9px 9px 0 var(--ink);position:relative;overflow:hidden}
  .hero .hv{font-family:var(--mono);font-weight:700;font-size:240px;line-height:.86;
        letter-spacing:-.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hero .hk{font-weight:900;font-size:52px;line-height:1.06;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis}
  .hero .htr{position:relative;height:22px;border:var(--bw) solid var(--ink);
        background:var(--paper);overflow:hidden;flex:0 0 auto}
  .hero .htr i{position:absolute;left:0;top:0;bottom:0;width:0;display:block}
  .side{flex:0 0 560px;display:flex;flex-direction:column;gap:18px}
  .fact{flex:1 1 0;min-height:0;border:var(--bw) solid var(--ink);border-radius:4px;
        padding:0 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;
        box-shadow:6px 6px 0 var(--ink);min-width:0}
  .fact .fk{font-weight:900;font-size:28px;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis;min-width:0}
  .fact .fv{font-family:var(--mono);font-weight:700;font-size:52px;line-height:.9;
        letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap;
        flex:0 0 auto}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">AUDIENCE / 涨粉复盘</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">哪一步真的拉来了人</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：人</div></div>
  <div class="body"><div class="hero" style="background:var(--white);color:var(--ink)"><span class="hv" id="hv" data-fit-max="240" data-fit-min="120">8420</span><span class="hk" id="hk" data-fit-max="52" data-fit-min="28">净增</span><span class="htr"><i id="htf" style="background:var(--ink)"></i></span></div><div class="side"><div class="fact" style="background:var(--orange);color:var(--ink)"><span class="fk" id="k0" data-fit-max="28" data-fit-min="15">取关</span><span class="fv" id="v0" data-fit-max="52" data-fit-min="26">1130</span></div><div class="fact" style="background:var(--purple);color:var(--ink)"><span class="fk" id="k1" data-fit-max="28" data-fit-min="15">转化率</span><span class="fv" id="v1" data-fit-max="52" data-fit-min="26">3.8%</span></div><div class="fact" style="background:var(--white);color:var(--ink)"><span class="fk" id="k2" data-fit-max="28" data-fit-min="15">客单</span><span class="fv" id="v2" data-fit-max="52" data-fit-min="26">268</span></div><div class="fact" style="background:var(--yellow);color:var(--ink)"><span class="fk" id="k3" data-fit-max="28" data-fit-min="15">复购</span><span class="fv" id="v3" data-fit-max="52" data-fit-min="26">22%</span></div></div></div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2", "k3", "v3", "k4", "v4"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  B.in.pop(tl, '.hero', 0.1, { d: 0.62, from: .9, ease: 'power3.out' });
  B.in.grow(tl, '#htf', '100%', 0.44, { d: 0.62 });
  document.querySelectorAll('.fact').forEach(function (f, i) {
    tl.from(f, { opacity: 0, x: 44, duration: 0.62 * 0.8, ease: 'power3.out' }, 0.2 + i * 0.11);
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
