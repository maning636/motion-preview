<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"source","type":"string","label":"来源","default":"数据来源：项目复盘记录"},{"id":"date","type":"string","label":"日期","default":"2026.07"},{"id":"claim","type":"string","label":"结论","default":"模板化之后，重复动效制作时间明显下降"},{"id":"value","type":"number","label":"数字","default":68},{"id":"unit","type":"string","label":"单位","default":"%"},{"id":"note","type":"string","label":"补充说明","default":"统计口径：同类型知识视频中的数据展示片段。"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="5" data-track-index="1">

        <div class="gridbg"></div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <div id="doc" style="position:relative;width:1300px;padding:70px 80px 50px;background:#131316;border:1px solid #2A2A2E;border-radius:20px;">
            <span class="num" style="position:absolute;top:-50px;left:40px;font-size:220px;color:var(--accent,#00FF00);line-height:1;">“</span>
            <p id="claim" class="num" style="margin:30px 0 40px;font-size:46px;line-height:1.6;"></p>
            <div style="display:flex;align-items:flex-end;justify-content:space-between;">
              <div style="display:flex;align-items:baseline;gap:14px;">
                <span class="num" id="value" style="font-size:150px;line-height:1;color:var(--accent,#00FF00);">0</span>
                <span class="num" id="unit" style="font-size:56px;color:var(--accent,#00FF00);"></span>
              </div>
              <div style="text-align:right;color:#9CA3AF;font-size:22px;line-height:1.8;">
                <div id="source"></div><div id="date"></div>
              </div>
            </div>
            <hr style="border:none;border-top:1px solid #2A2A2E;margin:36px 0 20px;" />
            <p id="note" style="margin:0;font-size:20px;color:#6B7280;"></p>
          </div>
        </div>

      </section>
    </div>
    <script>
      const fallback = {"source": "数据来源：项目复盘记录", "date": "2026.07", "claim": "模板化之后，重复动效制作时间明显下降", "value": 68, "unit": "%", "note": "统计口径：同类型知识视频中的数据展示片段。", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 5;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("claim").textContent = v.claim; $("unit").textContent = v.unit;
      $("source").textContent = v.source; $("date").textContent = v.date; $("note").textContent = v.note;
      tl.fromTo("#doc", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.fromTo("#claim", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.8, ease: "power3.out" }, 0.6);
      countTo($("value"), v.value, 1.2, 1.2);
      tl.fromTo("#note", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.4);
      tl.to(".scene", { opacity: 0, y: -30, duration: 0.5 }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
