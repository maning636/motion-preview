<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "titleEn", "type": "string", "label": "英文小标签（全大写）", "default": "YOUR OWN DASHBOARD"}, {"id": "titleCn", "type": "string", "label": "中文标题（整句）", "default": "就是手机上的一个页面"}, {"id": "titleAccent", "type": "string", "label": "标题高亮词（绿色）", "default": "手机上"}, {"id": "stepText", "type": "string", "label": "步骤行文字", "default": "点开就是你专属的一些功能"}, {"id": "imgScreen", "type": "image", "label": "屏幕截图（留空=内置假UI）", "default": ""}, {"id": "duration", "type": "number", "label": "总时长（秒，演完定格）", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0D12); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0D12);
  color: var(--foreground, #F5F5F3); font-family:'MEBHeiHeiTi',sans-serif; }

/* 左上文案区 */
.left{ position:absolute; left:150px; top:210px; width:860px; }
.ten{ font-family:'MiSans SemiBold'; font-weight:700; font-size:26px; letter-spacing:8px;
  color:#10B981; text-transform:uppercase; text-shadow:0 0 14px rgba(16,185,129,.45);
  display:flex; align-items:center; gap:18px; max-width:860px; white-space:nowrap; overflow:hidden; }
.ten::before{ content:''; width:34px; height:3px; background:#10B981; border-radius:2px;
  box-shadow:0 0 10px rgba(16,185,129,.8); flex:none; }
.tcn{ margin-top:30px; font-family:'MiSans SemiBold'; font-weight:700; font-size:72px;
  line-height:1.28; letter-spacing:2px; color:#FFFFFF; max-width:860px; overflow-wrap:break-word; }
.tcn .acc{ color:#34D399; text-shadow:0 0 20px rgba(52,211,153,.55); }
.step{ margin-top:44px; display:flex; align-items:center; gap:20px; max-width:860px; }
.sicon{ width:56px; height:56px; flex:none; }
.sicon svg{ width:100%; height:100%; overflow:visible; }
.sicon .st{ stroke:#10B981; stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round;
  filter:drop-shadow(0 0 8px rgba(16,185,129,.6)); }
.stext{ font-family:'MiSans SemiBold'; font-weight:700; font-size:34px; color:#FFFFFF;
  max-width:780px; overflow-wrap:break-word; }

/* 右侧 iPhone 样机（390:844） */
.phone{ position:absolute; left:1270px; top:105px; width:400px; height:866px;
  background:#12161C; border:1px solid rgba(16,185,129,.9); border-radius:60px;
  box-shadow:0 0 30px rgba(16,185,129,.4), 0 0 80px rgba(16,185,129,.14),
    inset 0 0 24px rgba(16,185,129,.06); will-change:transform; }
.screen{ position:absolute; left:14px; top:14px; width:372px; height:838px;
  border-radius:47px; overflow:hidden; background:#EEF2F0; }
.notch{ position:absolute; left:50%; top:24px; width:118px; height:30px; margin-left:-59px;
  background:#0A0D12; border-radius:15px; z-index:5; }
.scrimg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; z-index:4; }

/* 屏幕内置假 UI（迷你 dashboard） */
.fui{ position:absolute; inset:0; padding:64px 20px 20px; }
.fbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.fbar .ft{ font-family:'MiSans SemiBold'; font-weight:700; font-size:22px; color:#111827; }
.fbar .fd{ width:34px; height:34px; border-radius:50%; background:#10B981;
  box-shadow:0 0 10px rgba(16,185,129,.5); }
.fcard{ background:#FFFFFF; border-radius:16px; padding:18px; margin-bottom:16px;
  box-shadow:0 2px 8px rgba(10,13,18,.06); }
.frow{ display:flex; align-items:center; gap:12px; }
.fsq{ width:40px; height:40px; border-radius:10px; background:#D1FAE5; flex:none; }
.fsq.g2{ background:#A7F3D0; } .fsq.g3{ background:#6EE7B7; }
.flines{ flex:1; }
.fl{ height:10px; border-radius:5px; background:#E5E7EB; margin-bottom:8px; }
.fl:last-child{ margin-bottom:0; }
.fl.w60{ width:60%; } .fl.w40{ width:40%; } .fl.w80{ width:80%; }
.fl.hi{ background:#34D399; }
.fgrid{ display:flex; gap:16px; }
.fmini{ flex:1; background:#FFFFFF; border-radius:16px; padding:16px;
  box-shadow:0 2px 8px rgba(10,13,18,.06); }
.fnum{ font-family:'MiSans SemiBold'; font-weight:700; font-size:26px; color:#111827; margin-bottom:10px; }
.fnum span{ color:#10B981; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="left">
        <div class="ten e" id="tEn"></div>
        <div class="tcn e" id="tCn"></div>
        <div class="step e">
          <div class="sicon">
            <svg viewBox="0 0 56 56">
              <rect class="st" x="16" y="6" width="24" height="44" rx="7"/>
              <line class="st" x1="24" y1="12" x2="32" y2="12"/>
              <circle class="st" cx="28" cy="43" r="2.5"/>
            </svg>
          </div>
          <div class="stext" id="sTx"></div>
        </div>
      </div>

      <div class="phone" id="phone">
        <div class="screen">
          <div class="fui" id="fui">
            <div class="fbar fc">
              <div class="ft">我的工作台</div>
              <div class="fd"></div>
            </div>
            <div class="fcard fc">
              <div class="frow">
                <div class="fsq"></div>
                <div class="flines"><div class="fl w80"></div><div class="fl w60"></div></div>
              </div>
            </div>
            <div class="fgrid fc">
              <div class="fmini"><div class="fnum">128<span>+</span></div><div class="fl w60 hi"></div><div class="fl w40"></div></div>
              <div class="fmini"><div class="fnum">36<span>%</span></div><div class="fl w60"></div><div class="fl w40 hi"></div></div>
            </div>
            <div class="fcard fc" style="margin-top:16px;">
              <div class="frow">
                <div class="fsq g2"></div>
                <div class="flines"><div class="fl w60 hi"></div><div class="fl w80"></div></div>
              </div>
            </div>
            <div class="fcard fc">
              <div class="frow">
                <div class="fsq g3"></div>
                <div class="flines"><div class="fl w80"></div><div class="fl w40"></div></div>
              </div>
            </div>
          </div>
          <img class="scrimg" id="scrImg" alt="" />
        </div>
        <div class="notch"></div>
      </div>
    </div>
    <script>
      const FB = {"titleEn": "YOUR OWN DASHBOARD", "titleCn": "就是手机上的一个页面", "titleAccent": "手机上", "stepText": "点开就是你专属的一些功能", "imgScreen": "", "duration": 6};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      const $=(s)=>document.querySelector(s);
      const DUR=+v.duration>0?+v.duration:6;
      $('[data-composition-id]').setAttribute('data-duration',String(DUR));

      $('#tEn').textContent=v.titleEn||'';
      $('#sTx').textContent=v.stepText||'';

      /* 标题：titleCn 中出现 titleAccent 的部分染绿，否则高亮词接在句尾 */
      const cn=v.titleCn||'', acc=v.titleAccent||'';
      const tCn=$('#tCn');
      if(acc && cn.includes(acc)){
        const i=cn.indexOf(acc);
        tCn.textContent='';
        tCn.append(document.createTextNode(cn.slice(0,i)));
        const s=document.createElement('span'); s.className='acc'; s.textContent=acc;
        tCn.append(s, document.createTextNode(cn.slice(i+acc.length)));
      }else{
        tCn.textContent=cn;
        if(acc){ const s=document.createElement('span'); s.className='acc'; s.textContent=acc; tCn.append(s); }
      }

      /* 屏幕图片槽：填了路径就用图片铺满屏幕，盖住假 UI */
      const img=v.imgScreen||'';
      if(img){ const im=$('#scrImg'); im.src=img; im.style.display='block'; }

      window.__timelines=window.__timelines||{};
      const tl=gsap.timeline({paused:true});

      /* 1. 标题区依次入场（英文标签 → 中文标题 → 步骤行） */
      tl.fromTo('#tEn',{opacity:0,y:26},{opacity:1,y:0,duration:0.5,ease:'power3.out'},0.2);
      tl.fromTo('#tCn',{opacity:0,y:34},{opacity:1,y:0,duration:0.6,ease:'power3.out'},0.38);
      tl.fromTo('.step',{opacity:0,y:26},{opacity:1,y:0,duration:0.5,ease:'power3.out'},0.62);
      /* 2. 手机从右侧滑入，轻微旋转归位（4deg → 0） */
      tl.fromTo('#phone',{x:320,opacity:0,rotate:4},
        {x:0,opacity:1,rotate:0,duration:0.9,ease:'power3.out'},0.7);
      /* 3. 屏幕内容淡入（假 UI 卡片 stagger；若用截图槽则整屏淡入） */
      tl.fromTo('.fc',{opacity:0,y:18},{opacity:1,y:0,duration:0.4,ease:'power2.out',stagger:0.08},1.35);
      tl.fromTo('#scrImg',{opacity:0},{opacity:1,duration:0.5,ease:'power2.out'},1.35);
      /* 4. 定格微浮：有限次 yoyo（repeat 3 = 上下两轮后回到原位） */
      tl.to('#phone',{y:-10,duration:0.9,ease:'sine.inOut',yoyo:true,repeat:3},2.2);
      /* 5. 时间线补齐到总时长：避免渲染器 seek 超出时间线末端时状态丢失（实测会回退黑帧） */
      tl.set('#root',{willChange:'auto'},DUR);
      /* 演完定格，无收尾出场动画 */

      window.__timelines.main = tl;
    </script>
  </body>
</html>
