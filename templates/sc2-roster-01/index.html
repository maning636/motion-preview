<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "SC2 · 差异化复刻"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.392 / 400"}, {"id": "kicker", "type": "string", "label": "眉题", "default": "LIST REVEAL · 逐行显影"}, {"id": "rows", "type": "string", "label": "列表行（标题|说明，分号分隔）", "default": "选题库|每周更新的灵感仓库;素材夹|截图与金句统一归档;写作流|从提纲到成稿的流水线;发布表|五个平台的排期看板;复盘页|数据回流改下一轮"}, {"id": "hlRow", "type": "number", "label": "高亮第几行（1 起）", "default": 3}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .lr-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .lr-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .lr-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .lr-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      .lr-kicker{ position: absolute; left: 0; right: 0; top: 130px; text-align: center; z-index: 5;
        font-size: 52px; font-weight: 900; letter-spacing: .06em; }
      .lr-kicker b{ color: #9A9A92; font-weight: 400; }
      .lr-tag{ position: absolute; left: 0; right: 0; top: 214px; text-align: center; z-index: 5;
        font-size: 19px; letter-spacing: .3em; color: #55554E; }
      /* 列表面板 */
      .lr-panel{ position: absolute; left: 370px; top: 290px; width: 1180px; z-index: 4;
        background: #fff; border: 3px solid #141414; box-shadow: 14px 14px 0 #141414; }
      .lr-row{ position: relative; height: 118px; display: flex; align-items: center; padding: 0 44px;
        border-bottom: 2px solid rgba(20,20,20,.12); overflow: hidden; }
      .lr-row:last-child{ border-bottom: none; }
      .lr-hlbg{ position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: var(--ac, #00FF00);
        transform: scaleX(0); transform-origin: 0 50%; z-index: 0; }
      .lr-real{ position: relative; z-index: 1; display: flex; align-items: center; width: 100%; }
      .lr-avatar{ width: 62px; height: 62px; border-radius: 50%; background: #141414; color: #F6F5EF;
        display: flex; align-items: center; justify-content: center; font-size: 20px; letter-spacing: .06em;
        flex: 0 0 auto; }
      .lr-row.hl .lr-avatar{ background: #141414; color: var(--ac, #00FF00); }
      .lr-txt{ margin-left: 30px; flex: 1 1 auto; }
      .lr-title{ font-size: 36px; font-weight: 900; letter-spacing: .02em; line-height: 1.2; }
      .lr-desc{ margin-top: 6px; font-family: 'MiSans SemiBold', sans-serif; font-size: 22px; color: #55554E; }
      .lr-row.hl .lr-desc{ color: #141414; }
      .lr-page{ font-size: 20px; letter-spacing: .2em; color: #9A9A92; flex: 0 0 auto; }
      .lr-row.hl .lr-page{ color: #141414; }
      /* 骨架灰条 */
      .lr-sk{ position: absolute; left: 44px; right: 44px; top: 0; bottom: 0; z-index: 2;
        display: flex; align-items: center; pointer-events: none; }
      .lr-sk .c{ width: 62px; height: 62px; border-radius: 50%; background: #D9D8CE; flex: 0 0 auto; }
      .lr-sk .bars{ margin-left: 30px; flex: 1 1 auto; }
      .lr-sk .b1{ width: 220px; height: 26px; background: #D9D8CE; }
      .lr-sk .b2{ margin-top: 14px; width: 380px; height: 16px; background: #E4E3D9; }
      .lr-sk .pg{ width: 90px; height: 18px; background: #E4E3D9; flex: 0 0 auto; }
      /* 底部荧光绿署名条 */
      .lr-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(60px); }
      .lr-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .lr-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="lr-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="lr-kicker" id="kicker"></div>
      <div class="lr-tag mono" id="tag"></div>
      <div class="lr-panel" id="panel"></div>
      <div class="lr-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · LIST REVEAL</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "SC2 · 差异化复刻", "pageno": "P.392 / 400", "kicker": "LIST REVEAL · 逐行显影", "rows": "选题库|每周更新的灵感仓库;素材夹|截图与金句统一归档;写作流|从提纲到成稿的流水线;发布表|五个平台的排期看板;复盘页|数据回流改下一轮", "hlRow": 3, "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      const kc = String(V.kicker).split("·");
      $("kicker").textContent = kc[0].trim();
      if (kc[1]) { const b = document.createElement("b"); b.textContent = " · " + kc.slice(1).join("·").trim(); $("kicker").appendChild(b); }
      const items = String(V.rows).split(";").map((s) => s.trim()).filter(Boolean)
        .map((s) => { const p = s.split("|"); return { t: (p[0] || "").trim(), d: (p[1] || "").trim() }; })
        .slice(0, 6);
      const N = items.length;
      const HL = Math.min(Math.max(parseInt(V.hlRow, 10) || 3, 1), N);
      $("tag").textContent = N + " ROWS · SKELETON → INK · HL #" + String(HL).padStart(2, "0");
      // 建行：骨架层 + 真实内容层
      const panel = $("panel");
      items.forEach((it, i) => {
        const row = document.createElement("div");
        row.className = "lr-row" + (i + 1 === HL ? " hl" : "");
        if (i + 1 === HL) { const bg = document.createElement("div"); bg.className = "lr-hlbg"; row.appendChild(bg); }
        const real = document.createElement("div");
        real.className = "lr-real";
        const av = document.createElement("div"); av.className = "lr-avatar mono"; av.textContent = String(i + 1).padStart(2, "0");
        const txt = document.createElement("div"); txt.className = "lr-txt";
        const ti = document.createElement("div"); ti.className = "lr-title"; ti.textContent = it.t;
        const de = document.createElement("div"); de.className = "lr-desc"; de.textContent = it.d;
        txt.append(ti, de);
        const pg = document.createElement("div"); pg.className = "lr-page mono";
        pg.textContent = "P." + String(i + 1).padStart(2, "0") + " / " + String(N).padStart(2, "0");
        real.append(av, txt, pg);
        const sk = document.createElement("div");
        sk.className = "lr-sk";
        sk.innerHTML = '<div class="c"></div><div class="bars"><div class="b1"></div><div class="b2"></div></div><div class="pg"></div>';
        row.append(real, sk);
        panel.appendChild(row);
      });
      // ---- 时间轴 ----
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      tl.fromTo("#kicker", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.35);
      tl.fromTo("#tag", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 0.6);
      // 面板携骨架入场
      tl.fromTo("#panel", { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.55);
      // 逐行显影：骨架灰条收起，真实文字 blur→清晰
      const rowEls = panel.querySelectorAll(".lr-row");
      rowEls.forEach((row, i) => {
        const at = 1.05 + i * 0.55;
        const sk = row.querySelector(".lr-sk");
        const real = row.querySelector(".lr-real");
        tl.to(sk, { opacity: 0, scaleX: 0.6, duration: 0.35, ease: "power2.in", transformOrigin: "100% 50%" }, at);
        tl.fromTo(real, { opacity: 0, filter: "blur(8px)", y: 8 },
          { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "power2.out" }, at + 0.1);
        const bg = row.querySelector(".lr-hlbg");
        if (bg) tl.to(bg, { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, at + 0.35);
      });
      // 底部署名条
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 0.8);
      tl.fromTo([".lr-foot .f1", ".lr-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 1.05);
      // 全程慢速漂移（与逐行显影解耦的另一层运动），定格不回位；时间轴须盖过 data-duration，否则尾帧空白
      tl.fromTo("#panel", { y: 12 }, { y: -10, duration: 5.8, ease: "none" }, 0.6);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
