<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "ch1", "type": "string", "label": "章节1", "default": "背景"}, {"id": "ch2", "type": "string", "label": "章节2", "default": "问题"}, {"id": "ch3", "type": "string", "label": "章节3", "default": "方法"}, {"id": "ch4", "type": "string", "label": "章节4", "default": "结论"}, {"id": "current", "type": "number", "label": "当前章节（1-4）", "default": 2}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "accentColor", "type": "color", "label": "主色（优先于强调色）", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长（秒）", "default": 4}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0F);
  color: var(--foreground, #F4F4F2); font-family:'MEBHeiHeiTi',sans-serif; }
.bar{ position:absolute; left:50%; top:64px; transform:translateX(-50%); display:flex; gap:14px; }
.seg{ display:flex; align-items:center; gap:14px; background:#14141B;
  border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:14px 30px;
  font-family:'MiSans SemiBold'; font-weight:700; font-size:30px; color:rgba(255,255,255,.5); }
.seg .no{ width:44px; height:44px; border-radius:50%; border:3px solid rgba(255,255,255,.35);
  display:flex; align-items:center; justify-content:center; font-size:26px; }
.seg.done{ color:#F4F4F2; }
.seg.done .no{ border-color:var(--accent); color:var(--accent); }
.seg.cur{ color:#0A0A0F; background:var(--accent); border-color:var(--accent); }
.seg.cur .no{ border-color:#0A0A0F; color:#0A0A0F; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
<div class="bar" id="bar"></div>
    </div>
    <script>
      const FB = {"ch1": "背景", "ch2": "问题", "ch3": "方法", "ch4": "结论", "current": 2, "accent": "#00FF00", "accentColor": "#00FF00", "duration": 4};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
const $=(s)=>document.querySelector(s);
const F=(f)=>f/30;
const DUR=+v.duration>0?+v.duration:4;
$('[data-composition-id]').setAttribute('data-duration',String(DUR));
/* accentColor 定制时优先；仍为默认值时回退旧 accent 变量，保证旧预设渲染不变 */
const ACC=(v.accentColor&&String(v.accentColor).toLowerCase()!=='#00ff00')?v.accentColor:(v.accent||'#00FF00');
document.documentElement.style.setProperty('--accent', v.accent ?? '#00FF00');

const cur=Math.min(Math.max(1,+v.current||1),4);
const bar=$('#bar');
const segs=[];
for(let i=1;i<=4;i++){
  const s=document.createElement('div');
  s.className='seg'+(i<cur?' done':i===cur?' cur':'');
  s.innerHTML='<span class="no">'+i+'</span><span>'+(v['ch'+i]||'')+'</span>';
  bar.appendChild(s); segs.push(s);
}

window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.fromTo(bar,{y:-70,opacity:0},{y:0,opacity:1,duration:F(12),ease:'power3.out'},0);
segs.forEach((s,i)=>{
  tl.fromTo(s,{opacity:0,x:-30},{opacity:1,x:0,duration:F(8),ease:'power2.out'},F(6)+i*F(4));
});
if(cur>0) tl.fromTo(segs[cur-1],{scale:.85},{scale:1,duration:F(10),ease:'back.out(2)'},F(6)+(cur-1)*F(4)+F(6));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
