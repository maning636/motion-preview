<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"从想法到系统"},{"id":"time1","type":"string","label":"节点一编号","default":"01"},{"id":"label1","type":"string","label":"节点一","default":"做一次"},{"id":"time2","type":"string","label":"节点二编号","default":"02"},{"id":"label2","type":"string","label":"节点二","default":"存模板"},{"id":"time3","type":"string","label":"节点三编号","default":"03"},{"id":"label3","type":"string","label":"节点三","default":"反复生成"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="5.5" data-track-index="1">

        <div class="gridbg"></div>
        <header style="position:relative;z-index:2;margin-bottom:40px;">
          <span class="chip"><b>PATH</b>路径</span>
          <h1 id="title" class="num" style="margin:18px 0 0;font-size:52px;"></h1>
        </header>
        <div style="position:relative;margin-top:180px;">
          <div id="track" style="position:absolute;left:0;right:0;top:0;height:3px;background:#2A2A2E;"></div>
          <div id="fill" style="position:absolute;left:0;top:0;height:3px;width:0;background:var(--accent,#00FF00);box-shadow:0 0 18px var(--accent,#00FF00);"></div>
          <div id="cursor" style="position:absolute;top:-11px;left:0;width:25px;height:25px;border-radius:50%;background:var(--accent,#00FF00);box-shadow:0 0 24px var(--accent,#00FF00);"></div>
          <div id="nodes" style="display:flex;justify-content:space-between;"></div>
        </div>
        <style>
          .tnode{ position:relative; width:300px; text-align:center; opacity:0; transform:translateY(30px); }
          .tnode::before{ content:""; display:block; margin:0 auto 26px; width:22px; height:22px; border-radius:50%;
            background:#0A0A0B; border:4px solid var(--accent,#00FF00); transform:translateY(-36px); }
          .tt{ font-size:22px; color:var(--accent,#00FF00); letter-spacing:.2em; }
          .tlab{ margin-top:10px; font-size:34px; }
        </style>

      </section>
    </div>
    <script>
      const fallback = {"title": "从想法到系统", "time1": "01", "label1": "做一次", "time2": "02", "label2": "存模板", "time3": "03", "label3": "反复生成", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 5.5;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("title").textContent = v.title;
      const data = [[v.time1, v.label1], [v.time2, v.label2], [v.time3, v.label3]].filter((x) => x[1]);
      data.forEach(([t, lab]) => {
        const n = document.createElement("div"); n.className = "tnode";
        n.innerHTML = `<div class="tt num">${t}</div><div class="tlab num">${lab}</div>`;
        $("nodes").appendChild(n);
      });
      const trackW = 1744;
      tl.fromTo("header", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "power3.out" }, 0.1);
      tl.to("#fill", { width: trackW, duration: 2.6, ease: "power2.inOut" }, 0.5);
      tl.to("#cursor", { x: trackW, duration: 2.6, ease: "power2.inOut" }, 0.5);
      document.querySelectorAll(".tnode").forEach((n, i) => {
        tl.to(n, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.7 + i * 0.8);
      });
      tl.to(".scene", { opacity: 0, duration: 0.5 }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
