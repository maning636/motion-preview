<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "集结这一拍"}, {"id": "sub", "type": "string", "label": "副标题", "default": "每个字都滑升到位"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; }
#word{ display:flex; }
.ch{ display:inline-block; overflow:hidden; height:170px; }
.ch span{ display:inline-block; font-size:140px; font-weight:900; line-height:170px;
  will-change:transform; }
.ch.acc span{ color:var(--accent); }
#sub{ margin-top:30px; font-size:30px; opacity:0; font-family:'MiSans SemiBold',sans-serif; color:color-mix(in srgb, var(--fg) 55%, transparent); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
<div id="stage"><div id="word"></div><div id="sub"></div></div>
    </div>
    <script>
      const FB = {"title": "集结这一拍", "sub": "每个字都滑升到位", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

const T=(v.title||'集结这一拍');
$('#sub').textContent=v.sub||'';
const word=$('#word');
T.split('').forEach((c,i)=>{
  const box=document.createElement('div');
  box.className='ch'+(i===T.length-1?' acc':'');
  const sp=document.createElement('span');
  sp.textContent=c;
  box.appendChild(sp); word.appendChild(box);
});
// 逐字裂升：overflow 盒内 translateY 115%→0 带 10% 过冲（back.out(1.7)），delay i×2f
document.querySelectorAll('.ch span').forEach((sp,i)=>{
  tl.fromTo(sp,{yPercent:115},{yPercent:0,duration:F(14),ease:'back.out(1.7)'},F(15+i*2));
});
tl.to('#sub',{opacity:1,duration:F(10)},F(40));
tl.to({},{duration:F(85)},F(50));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
