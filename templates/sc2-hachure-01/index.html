<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "VOL.15 · 视觉动效库"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.386 / 400"}, {"id": "kicker", "type": "string", "label": "眉题", "default": "HATCH DEPTH · 排线纵深"}, {"id": "title", "type": "string", "label": "标题（高亮前段）", "default": "从一条排线里"}, {"id": "hl", "type": "string", "label": "绿高亮词", "default": "长出纵深"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .hd-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .hd-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .hd-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .hd-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 单点透视：透视线 + 排线框层 */
      .hd-stage{ position: absolute; inset: 0; z-index: 2; }
      .hd-rays{ position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .hd-rays line{ stroke: #141414; stroke-width: 2; opacity: .5; }
      .hd-frame{ position: absolute; border: 3px solid #141414; transform: scale(0); }
      .hd-frame.f1{ background: repeating-linear-gradient(45deg, rgba(20,20,20,.34) 0 2px, transparent 2px 9px); }
      .hd-frame.f2{ background: repeating-linear-gradient(45deg, rgba(20,20,20,.24) 0 2px, transparent 2px 11px); }
      .hd-frame.f3{ background: repeating-linear-gradient(45deg, rgba(20,20,20,.16) 0 2px, transparent 2px 13px); }
      .hd-frame.f4{ background: repeating-linear-gradient(45deg, rgba(20,20,20,.10) 0 2px, transparent 2px 15px); }
      /* 中心标题卡（排线收束处显影） */
      .hd-card{ position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
        z-index: 5; background: #F6F5EF; border: 3px solid #141414; box-shadow: 12px 12px 0 #141414;
        padding: 44px 56px 48px; text-align: center; opacity: 0; }
      .hd-kicker{ font-size: 20px; letter-spacing: .3em; color: #55554E; }
      .hd-title{ margin-top: 22px; font-size: 64px; font-weight: 900; line-height: 1.25; letter-spacing: .01em; white-space: nowrap; }
      .hd-title .hl{ position: relative; display: inline-block; padding: 0 12px; }
      .hd-title .hl i{ position: absolute; left: 0; right: 0; top: 6px; bottom: 6px; background: var(--ac, #00FF00);
        z-index: -1; transform: scaleX(0); transform-origin: 0 50%; }
      /* 底部荧光绿署名条 */
      .hd-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(60px); }
      .hd-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .hd-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="hd-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="hd-stage">
        <svg class="hd-rays" viewBox="0 0 1920 1080">
          <line id="ray0" x1="960" y1="497" x2="280" y2="70" />
          <line id="ray1" x1="960" y1="497" x2="1640" y2="70" />
          <line id="ray2" x1="960" y1="497" x2="1640" y2="930" />
          <line id="ray3" x1="960" y1="497" x2="280" y2="930" />
        </svg>
        <div class="hd-frame f4" id="fr4" style="left:310px; top:95px; width:1300px; height:810px;"></div>
        <div class="hd-frame f3" id="fr3" style="left:410px; top:170px; width:1100px; height:660px;"></div>
        <div class="hd-frame f2" id="fr2" style="left:510px; top:245px; width:900px; height:510px;"></div>
        <div class="hd-frame f1" id="fr1" style="left:610px; top:320px; width:700px; height:360px;"></div>
      </div>
      <div class="hd-card" id="card">
        <div class="hd-kicker mono" id="kicker"></div>
        <div class="hd-title"><span id="t1"></span><span class="hl"><i id="hlbg"></i><span id="t2"></span></span></div>
      </div>
      <div class="hd-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · HATCH DEPTH</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "VOL.15 · 视觉动效库", "pageno": "P.386 / 400", "kicker": "HATCH DEPTH · 排线纵深", "title": "从一条排线里", "hl": "长出纵深", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      $("kicker").textContent = V.kicker;
      $("t1").textContent = V.title;
      $("t2").textContent = V.hl;
      // 透视线 draw-on 准备
      const rays = ["#ray0", "#ray1", "#ray2", "#ray3"];
      rays.forEach(sel => {
        const el = document.querySelector(sel);
        const len = Math.hypot(el.x2.baseVal.value - el.x1.baseVal.value, el.y2.baseVal.value - el.y1.baseVal.value);
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      });
      // 页眉
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      // 排线框层从中心点向外生长（内层先，逐层向外）
      ["#fr1", "#fr2", "#fr3", "#fr4"].forEach((sel, i) => {
        tl.fromTo(sel, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "expo.out" }, 0.35 + i * 0.14);
      });
      // 透视线从中心向四角 draw-on
      rays.forEach((sel, i) => {
        tl.to(sel, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 0.8 + i * 0.07);
      });
      // 标题卡在排线收束处显影
      tl.fromTo("#card", { opacity: 0, scale: 0.82, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.6)" }, 1.6);
      tl.fromTo("#kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 1.9);
      tl.fromTo(".hd-title", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.0);
      // 绿高亮垫字扫入
      tl.to("#hlbg", { scaleX: 1, duration: 0.38, ease: "power2.inOut" }, 2.45);
      // 底部署名条
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 2.7);
      tl.fromTo([".hd-foot .f1", ".hd-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 2.95);
      // 收尾：框层极轻呼吸（排线活着），无 fade-out
      tl.to(["#fr2", "#fr3"], { scale: 1.012, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
