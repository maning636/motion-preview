<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"素材占位"},{"id":"subtitle","type":"string","label":"副标题","default":"此处需补产品 Demo 录屏"},{"id":"assetName","type":"string","label":"素材名","default":"产品 Demo 录屏"},{"id":"spec","type":"string","label":"规格说明","default":"1920×1080 · 6s · MP4"},{"id":"owner","type":"string","label":"负责人","default":"@设计组"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden; display: flex; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .frame{ width: 1200px; height: 720px; border: 2px dashed rgba(244,239,231,0.25); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; background: rgba(244,239,231,0.02);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .corner{ position: absolute; width: 24px; height: 24px; border-color: var(--accent); border-style: solid;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .corner.tl{ top: -2px; left: -2px; border-width: 4px 0 0 4px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .corner.tr{ top: -2px; right: -2px; border-width: 4px 4px 0 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .corner.bl{ bottom: -2px; left: -2px; border-width: 0 0 4px 4px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .corner.br{ bottom: -2px; right: -2px; border-width: 0 4px 4px 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .icon{ width: 80px; height: 80px; border: 2px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 40px; color: var(--accent); }
      .asset{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 44px; font-weight: 700; text-align: center; }
      .meta{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 22px; opacity: 0.55; text-align: center; }
      .owner{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 18px; color: var(--accent); border: 1px solid var(--accent); padding: 6px 14px; border-radius: 4px; }
      .title-area{ position: absolute; top: 96px; left: 112px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title-area">
          <h1 class="title" id="title" style="margin:0 0 12px;font-family: 'MEBHeiHeiTi', sans-serif;font-size:64px;font-weight:700;letter-spacing:-0.02em;"></h1>
          <p class="subtitle" id="subtitle" style="margin:0;font-family: 'MEBHeiHeiTi', sans-serif;font-size:24px;opacity:0.55;"></p>
        </div>
        <div class="frame" style="position:relative;">
          <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
          <div class="icon">+</div>
          <div class="asset" id="assetName"></div>
          <div class="meta" id="spec"></div>
          <div class="owner" id="owner"></div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "素材占位", subtitle: "此处需补产品 Demo 录屏", assetName: "产品 Demo 录屏", spec: "1920×1080 · 6s · MP4", owner: "@设计组", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      document.getElementById("assetName").textContent = v.assetName;
      document.getElementById("spec").textContent = v.spec;
      document.getElementById("owner").textContent = v.owner;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo(".frame", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.5);
      tl.fromTo(".corner", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, stagger: 0.08, ease: "back.out(2)" }, 0.8);
      tl.fromTo(".icon", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 1.1);
      tl.fromTo(".asset", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.3);
      tl.fromTo(".meta", { opacity: 0 }, { opacity: 0.55, duration: 0.4 }, 1.5);
      tl.fromTo(".owner", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.7);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
