<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "SHIPLOG / 版本节奏"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "发版不是终点，是下一起点"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：次"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#3D7BFF"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>推进轴 · 发版不是终点，是下一起点</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{position:relative;display:flex;align-items:stretch;gap:18px;padding:10px 0}
  /* top:50% + margin-top 定心，不碰 transform：B.fit 会把 transform 抹成 none */
  .rail{position:absolute;left:0;right:0;top:50%;height:20px;margin-top:-10px;
        background:var(--ink);z-index:0}
  .tcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;z-index:1}
  /* 卡片吃满 flex：原来卡片是自然高度 + 居中，每侧浪费近 200px，
     卡片显得又小又碎。justify-content 改 stretch，flex 让它撑满半区。 */
  .tcol .up,.tcol .dn{flex:1 1 0;min-height:0;display:flex;flex-direction:column;
        padding:0 6px}
  .tcol .mk{flex:0 0 0;height:0;position:relative}
  .tcol .mk i{position:absolute;left:50%;top:0;width:44px;height:44px;margin-left:-22px;
        background:var(--ink);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  .tcard{flex:1 1 auto;border:var(--bw) solid var(--ink);border-radius:4px;padding:22px 24px;
        display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;
        box-shadow:7px 7px 0 var(--ink)}
  .tcard .st{align-self:flex-start;font-family:var(--mono);font-weight:700;font-size:12px;
        letter-spacing:.14em;border:var(--bw) solid currentColor;border-radius:9999px;
        padding:3px 10px;white-space:nowrap}
  .tcard .nm{font-weight:900;font-size:30px;line-height:1.12;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis}
  .tcard .vv{font-family:var(--mono);font-weight:700;font-size:68px;line-height:.92;
        letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap;
        margin-top:auto}
  .tcard .tr{position:relative;height:18px;border:var(--bw) solid var(--ink);
        background:var(--paper);overflow:hidden;flex:0 0 auto}
  .tcard .tr i{position:absolute;left:0;top:0;bottom:0;width:0;display:block}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">SHIPLOG / 版本节奏</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">发版不是终点，是下一起点</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：次</div></div>
  <div class="body"><div class="rail"></div><div class="tcol"><div class="up"><div class="tcard" style="background:var(--white);color:var(--ink)"><span class="st" id="a0" data-fit-max="30" data-fit-min="16">阶段 01</span><span class="nm" id="k0" data-fit-max="30" data-fit-min="16">提测</span><span class="vv" id="v0" data-fit-max="68" data-fit-min="34">18</span><span class="tr"><i id="tf0" style="background:var(--ink)"></i></span></div></div><div class="mk"><i style="background:var(--ink)"></i></div><div class="dn"></div></div><div class="tcol"><div class="up"></div><div class="mk"><i style="background:var(--ink)"></i></div><div class="dn"><div class="tcard" style="background:var(--yellow);color:var(--ink)"><span class="st" id="a1" data-fit-max="30" data-fit-min="16">阶段 02</span><span class="nm" id="k1" data-fit-max="30" data-fit-min="16">灰度</span><span class="vv" id="v1" data-fit-max="68" data-fit-min="34">9</span><span class="tr"><i id="tf1" style="background:var(--ink)"></i></span></div></div></div><div class="tcol"><div class="up"><div class="tcard" style="background:var(--blue);color:var(--ink)"><span class="st" id="a2" data-fit-max="30" data-fit-min="16">阶段 03</span><span class="nm" id="k2" data-fit-max="30" data-fit-min="16">正式发布</span><span class="vv" id="v2" data-fit-max="68" data-fit-min="34">14</span><span class="tr"><i id="tf2" style="background:var(--ink)"></i></span></div></div><div class="mk"><i style="background:var(--ink)"></i></div><div class="dn"></div></div><div class="tcol"><div class="up"></div><div class="mk"><i style="background:var(--ink)"></i></div><div class="dn"><div class="tcard" style="background:var(--green);color:var(--ink)"><span class="st" id="a3" data-fit-max="30" data-fit-min="16">阶段 04</span><span class="nm" id="k3" data-fit-max="30" data-fit-min="16">紧急回滚</span><span class="vv" id="v3" data-fit-max="68" data-fit-min="34">2</span><span class="tr"><i id="tf3" style="background:var(--ink)"></i></span></div></div></div></div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2", "k3", "v3"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  tl.from('.rail', { scaleX: 0, transformOrigin: 'left center', duration: 0.62, ease: 'power3.inOut' }, 0.06);
  var sh = [0.4186, 0.2093, 0.3256, 0.0465];
  document.querySelectorAll('.tcol').forEach(function (c, i) {
    var mk = c.querySelector('.mk i');
    B.in.stamp(tl, mk, 0.34 + i * 0.1, { d: 0.62 * 0.7 });
    var card = c.querySelector('.tcard');
    var up = i % 2 === 0;
    tl.from(card, { opacity: 0, y: up ? -26 : 26, duration: 0.62 * 0.8, ease: 'power3.out' }, 0.44 + i * 0.1);
    var f = c.querySelector('.tr i');
    tl.fromTo(f, { width: '0%' },
      { width: Math.max(8, Math.round((sh[i] || 0) * 100)) + '%', duration: 0.62 * 0.8, ease: 'power3.out' }, 0.6 + i * 0.1);
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
