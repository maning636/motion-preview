<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "kicker", "type": "string", "label": "眉题", "default": "WORD ROLL · 答案只留一个"}, {"id": "words", "type": "string", "label": "词列（逗号分隔）", "default": "更快,更省,更准,好问题"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .wr-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .wr-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .wr-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .wr-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      .wr-kicker{ position: absolute; left: 0; right: 0; top: 170px; text-align: center; z-index: 5;
        font-size: 24px; letter-spacing: .34em; color: #141414; }
      .wr-kicker b{ color: #9A9A92; font-weight: 400; }
      /* 词列滚轮 */
      .wr-mask{ position: absolute; left: 50%; top: 250px; width: 1200px; height: 540px; z-index: 4;
        transform: translateX(-50%); overflow: hidden; }
      .wr-reel{ position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
      .wr-row{ position: relative; height: 180px; display: flex; align-items: center; justify-content: center; }
      .wr-word{ position: relative; display: inline-block; font-size: 118px; font-weight: 900;
        letter-spacing: .02em; color: #141414; padding: 0 26px; will-change: filter, opacity, transform; }
      .wr-word i{ position: absolute; left: 0; right: 0; top: 10px; bottom: 10px; background: var(--ac, #00FF00);
        z-index: -1; transform: scaleX(0); transform-origin: 0 50%; }
      /* 上下遮挡渐隐边（纸色遮罩，让滚出视口的词柔和消失） */
      .wr-edge{ position: absolute; left: 0; right: 0; height: 90px; z-index: 5; pointer-events: none; }
      .wr-edge.t{ top: 0; background: linear-gradient(#F6F5EF, rgba(246,245,239,0)); }
      .wr-edge.b{ bottom: 0; background: linear-gradient(rgba(246,245,239,0), #F6F5EF); }
      /* 底部荧光绿署名条 */
      .wr-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(64px); }
      .wr-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .wr-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="wr-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol">SC2 · 视觉动效库</div>
        <div class="r mono" id="pageno">P.303 / 400</div>
      </div>
      <div class="wr-kicker mono" id="kicker"></div>
      <div class="wr-mask" id="mask">
        <div class="wr-reel" id="reel"></div>
        <div class="wr-edge t"></div>
        <div class="wr-edge b"></div>
      </div>
      <div class="wr-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · WORD ROLL</div>
      </div>
    </div>
    <script>
      const fallback = {"kicker": "WORD ROLL · 答案只留一个", "words": "更快,更省,更准,好问题", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      const kc = String(V.kicker).split("·");
      $("kicker").textContent = kc[0].trim();
      if (kc[1]) { const b = document.createElement("b"); b.textContent = " · " + kc.slice(1).join("·").trim(); $("kicker").appendChild(b); }
      // 词列（首尾各垫一个空行，让中间行恒为当前词）
      const words = String(V.words).split(",").map(s => s.trim()).filter(Boolean).slice(0, 6);
      const ROW = 180;
      const reel = $("reel");
      const wordEls = [];
      const hlEls = [];
      ["", ...words, ""].forEach((w) => {
        const row = document.createElement("div");
        row.className = "wr-row";
        const sp = document.createElement("span");
        sp.className = "wr-word";
        const hl = document.createElement("i");
        sp.appendChild(hl);
        sp.appendChild(document.createTextNode(w));
        row.appendChild(sp);
        reel.appendChild(row);
        wordEls.push(sp);
        hlEls.push(hl);
      });
      const N = words.length;
      // 距离驱动的模糊/灰度/缩放：p 为当前位置（词索引浮点）
      const state = { p: 0 };
      function paint() {
        for (let i = 0; i < wordEls.length; i++) {
          const wi = i - 1; // 词索引
          if (wi < 0 || wi >= N) { wordEls[i].style.opacity = "0"; continue; }
          const d = Math.abs(wi - state.p);
          const blur = d < 1 ? 6 * d : 6 + 4 * Math.min(d - 1, 1);
          const op = d < 1 ? 1 - 0.55 * d : Math.max(0.08, 0.45 - 0.3 * (d - 1));
          const sc = d < 0.5 ? 1.12 - 0.24 * d : 1.0;
          wordEls[i].style.filter = blur > 0.05 ? "blur(" + blur.toFixed(1) + "px)" : "none";
          wordEls[i].style.opacity = op.toFixed(3);
          wordEls[i].style.transform = "scale(" + sc.toFixed(3) + ")";
          wordEls[i].style.color = d < 0.15 ? "#141414" : "#9A9A92";
        }
        reel.style.transform = "translateY(" + (-state.p * ROW) + "px)";
      }
      paint();
      // 页眉 + 眉题 + 署名条 + 滚轮入场
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      tl.fromTo("#kicker", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45 }, 0.3);
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 0.7);
      tl.fromTo([".wr-foot .f1", ".wr-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 0.95);
      tl.fromTo("#mask", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.4);
      // 首个词绿高亮扫入
      tl.to(hlEls[1], { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, 1.0);
      // 逐词滚动定格（每段 0.55s 滚动 + 0.85s 读词静置）
      let t = 1.6;
      for (let i = 1; i < N; i++) {
        tl.to(state, { p: i, duration: 0.55, ease: "power4.out", onUpdate: paint }, t);
        // 旧词高亮退场，新词高亮扫入
        tl.to(hlEls[i], { scaleX: 0, duration: 0.25, ease: "power2.in" }, t);
        tl.fromTo(hlEls[i + 1], { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, t + 0.35);
        t += 0.55 + 0.85;
      }
      window.__timelines.main = tl;
    </script>
  </body>
</html>
