<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "SC2 · 差异化复刻"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.391 / 400"}, {"id": "kicker", "type": "string", "label": "眉题", "default": "MILESTONE · 计数破阈"}, {"id": "target", "type": "number", "label": "目标数字", "default": 400}, {"id": "label", "type": "string", "label": "数字下方说明", "default": "篇长文 · 全部发布完毕"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 5}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .ccf-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .ccf-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .ccf-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .ccf-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      .ccf-kicker{ position: absolute; left: 0; right: 0; top: 170px; text-align: center; z-index: 5;
        font-size: 24px; letter-spacing: .34em; color: #141414; }
      .ccf-kicker b{ color: #9A9A92; font-weight: 400; }
      /* 超大数字 */
      .ccf-num{ position: absolute; left: 0; right: 0; top: 300px; text-align: center; z-index: 4;
        font-size: 330px; font-weight: 900; line-height: 1.05; color: #141414; }
      .ccf-label{ position: absolute; left: 0; right: 0; top: 700px; text-align: center; z-index: 5;
        font-family: 'MiSans SemiBold', sans-serif; font-size: 34px; color: #55554E; opacity: 0; }
      .ccf-sub{ position: absolute; left: 0; right: 0; top: 764px; text-align: center; z-index: 5;
        font-size: 19px; letter-spacing: .32em; color: #9A9A92; opacity: 0; }
      .ccf-ring{ position: absolute; left: 960px; top: 470px; width: 560px; height: 560px; margin-left: -280px;
        margin-top: -280px; border: 3px solid var(--ac, #00FF00); border-radius: 50%; z-index: 3; opacity: 0; }
      .ccf-tickmark{ position: absolute; left: 50%; top: 662px; width: 72px; height: 10px; margin-left: -36px;
        background: var(--ac, #00FF00); z-index: 5; transform: scaleX(0); transform-origin: 0 50%; }
      /* 纸屑 */
      .ccf-confetti{ position: absolute; left: 0; top: 0; width: 12px; height: 18px; z-index: 7; opacity: 0; }
      /* 底部荧光绿署名条 */
      .ccf-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(60px); }
      .ccf-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .ccf-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="ccf-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="ccf-kicker mono" id="kicker"></div>
      <div class="ccf-num" id="num">0</div>
      <div class="ccf-ring" id="ring"></div>
      <div class="ccf-tickmark" id="tickmark"></div>
      <div class="ccf-label" id="label"></div>
      <div class="ccf-sub mono" id="sub">TARGET REACHED · 破阈完成</div>
      <div id="confettiLayer"></div>
      <div class="ccf-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · COUNTER CONFETTI</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "SC2 · 差异化复刻", "pageno": "P.391 / 400", "kicker": "MILESTONE · 计数破阈", "target": 400, "label": "篇长文 · 全部发布完毕", "accent": "#00FF00", "duration": 5};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      const kc = String(V.kicker).split("·");
      $("kicker").textContent = kc[0].trim();
      if (kc[1]) { const b = document.createElement("b"); b.textContent = " · " + kc.slice(1).join("·").trim(); $("kicker").appendChild(b); }
      $("label").textContent = V.label;
      const TARGET = Math.max(parseInt(V.target, 10) || 400, 10);
      // 确定性伪随机
      let seed = 7;
      const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
      // 计数节拍
      const countStart = 0.9, countDur = 2.5, land = countStart + countDur, burst = land - 0.35;
      // ---- 时间轴 ----
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      tl.fromTo("#kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45 }, 0.4);
      // 数字入场 + 充能滚动（easeOutQuart ≈ power4.out 冲刺曲线）
      tl.fromTo("#num", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, countStart - 0.25);
      const counter = { n: 0 };
      tl.to(counter, { n: TARGET, duration: countDur, ease: "power4.out",
        onUpdate: () => { $("num").textContent = Math.round(counter.n).toLocaleString("en-US"); } }, countStart);
      // 纸屑：破阈前半拍从顶部两侧交叉喷发（绿黑双色）
      const layer = $("confettiLayer");
      const PIECES = 48;
      for (let i = 0; i < PIECES; i++) {
        const p = document.createElement("div");
        p.className = "ccf-confetti";
        p.style.background = i % 2 === 0 ? "#00FF00" : "#141414";
        const fromLeft = i % 4 < 2;
        const sx = fromLeft ? 120 + rnd() * 260 : 1540 + rnd() * 260;
        const sy = 60 + rnd() * 120;
        const dx = (fromLeft ? 1 : -1) * (380 + rnd() * 620);
        const upY = -(60 + rnd() * 160);
        const fallY = 620 + rnd() * 260;
        const rot = (rnd() - 0.5) * 900;
        const dur = 1.1 + rnd() * 0.5;
        const at = burst + rnd() * 0.15;
        layer.appendChild(p);
        tl.set(p, { x: sx, y: sy, opacity: 1 }, at);
        tl.to(p, { x: sx + dx, duration: dur, ease: "none" }, at);
        tl.to(p, { keyframes: [
          { y: sy + upY, duration: dur * 0.32, ease: "power2.out" },
          { y: sy + fallY, duration: dur * 0.68, ease: "power2.in" }
        ] }, at);
        tl.to(p, { rotation: rot, duration: dur, ease: "none" }, at);
        tl.to(p, { opacity: 0, duration: dur * 0.22, ease: "power1.in" }, at + dur * 0.78);
      }
      // 到位：过冲回落 + 冲击环 + 绿刻度线 + 标签
      tl.fromTo("#num", { scale: 1.14 }, { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, land);
      tl.fromTo("#ring", { opacity: 0.9, scale: 0.35 }, { opacity: 0, scale: 1.75, duration: 0.7, ease: "power3.out" }, land);
      tl.to("#tickmark", { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, land + 0.1);
      tl.fromTo("#label", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, land + 0.2);
      tl.fromTo("#sub", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35 }, land + 0.35);
      // 底部署名条
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 0.7);
      tl.fromTo([".ccf-foot .f1", ".ccf-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 0.95);
      // 定格加深脉冲，不收尾（时间轴须盖过 data-duration，否则尾帧空白）
      tl.to("#num", { scale: 1.05, duration: 0.28, ease: "sine.inOut", yoyo: true, repeat: 1 }, land + 0.8);
      tl.to("#num", { opacity: 1, duration: 0.4 }, 4.9);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
