<!DOCTYPE html>
<html lang="zh-CN" data-composition-variables='[{"id": "chapterNo", "type": "string", "label": "章节序号", "default": "EP.05"}, {"id": "chapterTitle", "type": "string", "label": "章节标题", "default": "落幕"}, {"id": "subtitle", "type": "string", "label": "副标题", "default": "The Curtain Falls"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#b91c1c"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
<head>
  <meta charset="UTF-8">
  <title>下划线扫光标题·皮影档案</title>
  <script src="../_lib/gsap.min.js"></script>
  <style>
    :root { --accent: #b91c1c; --ink: #0a0a0a; --paper: #faf6ed; --warm: #8b7355; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "MiSans", "PingFang SC", "Source Han Serif", "Songti SC", serif; }
    .composition { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
    .layer { position: absolute; inset: 0; }
    .l1-bg { z-index: 1; }
    .paper-base { position: absolute; inset: 0; background: var(--paper); }
    .paper-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(61,40,23,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(61,40,23,0.08) 1px, transparent 1px); background-size: 48px 48px; }
    .grain-layer { position: absolute; inset: 0; background-image: url("./assets/grain.png"); background-size: 320px 320px; opacity: 0.25; mix-blend-mode: multiply; }
    .paper-age { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 60%, rgba(61,40,23,0.18) 100%); }

    .l2-content { z-index: 10; }

    /* 中央标题 + 下划线扫光 */
    .title-wrap {
      position: absolute; left: 50%; top: 480px;
      transform: translate(-50%, -50%);
      text-align: center;
      width: max-content;
    }
    .chapter-no {
      font-family: "Courier New", monospace;
      font-size: 22px; letter-spacing: 0.4em;
      color: var(--accent); font-weight: 700;
      margin-bottom: 24px;
      padding-left: 0.4em;
    }
    .chapter-title {
      font-family: "Source Han Serif", "Songti SC", "STSong", serif;
      font-size: 200px;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: 0.1em;
      padding-left: 0.1em;
      line-height: 1;
      display: inline-block;
      position: relative;
    }
    /* 下划线扫光效果：橙色光带从左扫到右 */
    .title-underline {
      position: absolute; left: 0; right: 0; bottom: -16px;
      height: 6px; background: var(--ink);
    }
    .underline-sweep {
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 0%; background: var(--accent);
    }

    .subtitle {
      margin-top: 80px;
      font-family: "Source Han Serif", "Songti SC", serif;
      font-size: 26px;
      font-style: italic;
      color: var(--warm);
      letter-spacing: 0.15em;
      padding-left: 0.15em;
    }

    /* 顶部章号 + 底部右侧文字 */
    .l5-decoration { z-index: 40; pointer-events: none; }
    .top-label { position: absolute; left: 100px; top: 100px; font-family: "Courier New", monospace; font-size: 16px; color: var(--ink); letter-spacing: 0.2em; }
    .bottom-label { position: absolute; right: 100px; bottom: 100px; font-family: "Courier New", monospace; font-size: 16px; color: var(--warm); letter-spacing: 0.15em; }

    .l6-environment { z-index: 50; pointer-events: none; }
    .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.15) 100%); }

    .progress-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0%; z-index: 60; }

    .chapter-title { opacity: 0; }
    .underline-sweep { opacity: 0; }
    .top-label, .bottom-label, .subtitle, .chapter-no { opacity: 0; }
  </style>
</head>
<body>
  <div id="composition" class="composition" data-composition-id="docu-title-fade-line-2026-08-31" data-start="0" data-duration="6" data-width="1920" data-height="1080">
    <div class="layer l1-bg">
      <div class="paper-base"></div>
      <div class="paper-grid"></div>
      <div class="grain-layer"></div>
      <div class="paper-age"></div>
    </div>
    <div class="layer l2-content">
      <div class="title-wrap">
        <div class="chapter-no" data-composition-variable="chapterNo">EP.05</div>
        <div class="chapter-title" data-composition-variable="chapterTitle">
          落幕
          <div class="title-underline">
            <div class="underline-sweep"></div>
          </div>
        </div>
        <div class="subtitle" data-composition-variable="subtitle">The Curtain Falls</div>
      </div>
    </div>
    <div class="layer l5-decoration">
      <div class="top-label">— DOCU / 005 —</div>
      <div class="bottom-label">SCENE 12 · TAKE 03</div>
    </div>
    <div class="layer l6-environment">
      <div class="vignette"></div>
    </div>
    <div class="progress-bar"></div>
  </div>
  <script>
    window.addEventListener("load", () => {
      const vars = window.__hyperframes?.getVariables?.() || {};
      const duration = Math.max(1, Number(vars.duration) || 6);
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      window.__timelines = window.__timelines || {};
      tl.to(".top-label", { opacity: 1, duration: 0.4 }, 0);
      tl.to(".chapter-no", { opacity: 1, duration: 0.4 }, 0.1);
      tl.to(".chapter-title", { opacity: 1, duration: 0.6 }, 0.3);
      tl.to(".underline-sweep", { opacity: 1, width: "100%", duration: 0.7, ease: "power2.inOut" }, 0.7);
      tl.to(".subtitle", { opacity: 1, duration: 0.5 }, 1.2);
      tl.to(".bottom-label", { opacity: 1, duration: 0.4 }, 1.5);
      const exitAt = Math.max(2.0, duration - 0.6);
      tl.to(".subtitle", { opacity: 0, duration: 0.4 }, exitAt);
      tl.to(".bottom-label", { opacity: 0, duration: 0.4 }, exitAt);
      tl.to(".progress-bar", { width: "100%", duration: duration, ease: "none" }, 0);
      window.__timelines["docu-title-fade-line-2026-08-31"] = tl;
      window.__hyperframes?.ready?.();
    });
  </script>
</body>
</html>
