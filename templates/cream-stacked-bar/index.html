<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "图表标题", "default": "渠道销售构成"}, {"id": "subtitle", "type": "string", "label": "副标题", "default": "线上与线下销售额季度占比"}, {"id": "labels", "type": "string", "label": "分类标签（逗号分隔）", "default": "Q1,Q2,Q3,Q4"}, {"id": "seriesNames", "type": "string", "label": "系列名称（逗号分隔）", "default": "线上,线下"}, {"id": "values", "type": "string", "label": "数值（分号分隔行，逗号分隔系列）", "default": "320,180;410,220;380,290;520,310"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      /* ===== 奶油纸面贴纸工作台 · 设计令牌（见 design-systems/sticker-workbench/DESIGN.md） ===== */
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden;
        font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--background, #F5F0E6); color: var(--foreground, #1D1D20); }
      .outer-frame{ position: absolute; inset: 0; border: 10px solid #1D1D20; pointer-events: none; z-index: 40; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; font-weight: 700; }
      .fredoka{ font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif; }
      .corner-tag{ position: absolute; top: 74px; left: 120px; z-index: 30;
        background: #FFFDF7; border: 4px solid #1D1D20; border-radius: 8px;
        box-shadow: 10px 10px 0 #2A292B; padding: 14px 22px; transform: rotate(-2deg); }
      .corner-tag span{ font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif; font-weight: 700;
        font-size: 24px; letter-spacing: 0.06em; text-transform: uppercase; }
      .corner-index{ position: absolute; top: 84px; right: 120px; z-index: 30;
        font-size: 20px; color: #4D4A48; }
      .scene{ position: absolute; inset: 0; }
      .panel{ background: #FFFDF7; border: 4px solid #1D1D20; border-radius: 10px;
        box-shadow: 10px 10px 0 #2A292B; }
      .chip{ display: inline-block; padding: 8px 20px; border: 4px solid #1D1D20; border-radius: 8px;
        box-shadow: 6px 6px 0 #2A292B; font-size: 26px; font-weight: 800; line-height: 1.1; }
      .chip-blue{ background: #3E7BF2; color: #FFFDF7; }
      .chip-pink{ background: #F13B88; color: #FFFDF7; }
      .chip-orange{ background: #FF9F1C; color: #1D1D20; }
      .chip-lime{ background: #B9E833; color: #1D1D20; }
      .chip-violet{ background: #B99AF7; color: #1D1D20; }
      .chip-paper{ background: #FFFDF7; color: #1D1D20; }
      .ttl{ font-size: 52px; font-weight: 900; line-height: 1.2; }
      .sub{ font-size: 30px; font-weight: 700; line-height: 1.35; color: #4D4A48; }
      .num{ font-family: 'Fredoka', 'Arial Rounded MT Bold', sans-serif; font-weight: 700; }
      .title-center{ position: absolute; top: 200px; left: 0; width: 100%; text-align: center; z-index: 20; }
      .sub-center{ position: absolute; top: 286px; left: 0; width: 100%; text-align: center; z-index: 20; }

      .chart-card{ position: absolute; left: 240px; right: 240px; top: 270px; bottom: 220px;
        padding: 50px 60px 40px; }
      .bstage{ position: relative; width: 100%; height: 100%; }
      .vbar{ position: absolute; bottom: 60px; border: 4px solid #1D1D20; border-radius: 8px 8px 0 0;
        transform-origin: bottom; }
      .vlab{ position: absolute; bottom: 16px; transform: translateX(-50%);
        font-size: 24px; font-weight: 800; white-space: nowrap; }
      .vval{ position: absolute; transform: translateX(-50%); font-size: 26px; font-weight: 900; }
      .axis-x{ position: absolute; left: 0; right: 0; bottom: 56px; border-top: 4px solid #1D1D20; }
      .rank-row{ display: flex; align-items: center; gap: 24px; margin: 30px 0; }
      .rank-no{ width: 72px; height: 72px; flex: none; }
      .rank-bar{ flex: 1; height: 56px; background: #FFFDF7; border: 4px solid #1D1D20;
        border-radius: 8px; overflow: hidden; }
      .rank-fill{ height: 100%; width: 0; display: flex; align-items: center; padding-left: 20px;
        font-size: 26px; font-weight: 900; color: #FFFDF7; white-space: nowrap; }
      .rank-val{ width: 200px; flex: none; font-size: 30px; font-weight: 900; text-align: right; }
      .g-row{ display: flex; align-items: center; gap: 18px; margin: 16px 0; }
      .g-task{ width: 260px; flex: none; font-size: 26px; font-weight: 800; text-align: right; }
      .g-track{ flex: 1; height: 40px; position: relative; border-left: 3px solid #C9C0B2; }
      .g-bar{ position: absolute; top: 4px; height: 32px; border: 4px solid #1D1D20; border-radius: 8px; }
      .g-weeks{ display: flex; margin-left: 278px; }
      .g-weeks span{ flex: 1; font-size: 20px; font-weight: 700; color: #4D4A48; }
      .g-mile{ position: absolute; top: -8px; width: 24px; height: 24px; background: #B9E833;
        border: 4px solid #1D1D20; transform: rotate(45deg); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="outer-frame" id="frame"></div>
      <div class="corner-tag" id="cornerTag"><span>STACKED BAR</span></div>
      <div class="corner-index mono" id="cornerIndex">02 / CHART</div>
      <svg width="0" height="0" style="position:absolute"><defs>
        <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
          <path d="M1 1 L11 6 L1 11 Z" fill="#1D1D20" />
        </marker>
      </defs></svg>
      <section class="scene" id="rootScene" data-start="0" data-duration="6" data-track-index="1">
        <h2 class="ttl title-center" id="gTitle"></h2>
        <p class="sub sub-center" id="gSub"></p>
        <div class="panel chart-card" id="gCard"><div class="bstage" id="gStage"></div></div>
      </section>
    </div>
    <script>
      const FB = {"title": "渠道销售构成", "subtitle": "线上与线下销售额季度占比", "labels": "Q1,Q2,Q3,Q4", "seriesNames": "线上,线下", "values": "320,180;410,220;380,290;520,310"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      const $ = (id) => document.getElementById(id);
      const T = (id, val) => { const el = $(id); if (el) el.textContent = val; };
      const SP = (s) => String(s ?? '').split(',').map(x => x.trim()).filter(Boolean);
      const SPN = (s) => SP(s).map(Number);
      const scene = () => $('rootScene');
      function el(tag, cls, parent, text){ const e = document.createElement(tag);
        if (cls) e.className = cls; if (text != null) e.textContent = text;
        (parent || scene()).appendChild(e); return e; }
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const SPRING = "back.out(1.4)";
      function pop(sel, at, dx){ tl.fromTo(sel, { opacity: 0, x: dx || 0, scale: 0.88 },
        { opacity: 1, x: 0, scale: 1, duration: 0.38, ease: SPRING }, at); }
      function fade(sel, at){ tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.24 }, at); }
      function drawArrow(line, at){ const len = line.getAttribute('stroke-dasharray');
        tl.set(line, { attr: { "marker-end": "url(#arrowHead)" } }, at);
        tl.fromTo(line, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, at); }
      tl.fromTo("#frame", { opacity: 0 }, { opacity: 1, duration: 0.18 }, 0);
      tl.fromTo(["#cornerTag", "#cornerIndex"], { opacity: 0 }, { opacity: 1, duration: 0.18 }, 0);
      T("gTitle", v.title || ""); T("gSub", v.subtitle || ""); if (!v.subtitle) $("gSub").style.display = "none";
      const stage = $("gStage"); const PAL = ["#3E7BF2", "#F13B88", "#FF9F1C", "#B99AF7", "#B9E833"];
      const labels = SP(v.labels), series = SP(v.seriesNames);
      const rows = String(v.values).split(";").map(r => SPN(r));
      const totals = labels.map((_, i) => rows.reduce((s, r) => s + (r[i] || 0), 0));
      const mx = Math.max(...totals, 1);
      el("div", "axis-x", stage);
      const n = labels.length;
      labels.forEach((lb, i) => {
        const w = 70 / n, x = 5 + i * (90 / Math.max(n - 1, 1));
        let acc = 0;
        rows.forEach((r, j) => {
          const h = (r[i] || 0) / mx * 72;
          const b = el("div", "vbar", stage);
          b.style.cssText = "left:" + x + "%;width:" + w + "%;height:" + h + "%;bottom:calc(60px + " + acc + "%);background:" + PAL[j % 5];
          acc += h;
          tl.fromTo(b, { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: SPRING }, 0.4 + i * 0.15 + j * 0.08);
        });
        el("div", "vlab", stage, lb).style.left = (x + w / 2) + "%";
      });
      series.forEach((s, j) => { const c = el("span", "chip " + ["chip-blue","chip-pink","chip-orange","chip-violet"][j % 4], stage, s);
        c.style.cssText = "position:absolute;top:-70px;right:" + (j * 220) + "px;font-size:20px;padding:6px 14px"; });
      tl.fromTo("#gCard", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: SPRING }, 0.15);
      tl.to("#rootScene", { opacity: 0, duration: 0.28, ease: "power2.in" }, 5.5);
      tl.to(["#cornerTag", "#cornerIndex"], { opacity: 0, duration: 0.28 }, 5.5);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
