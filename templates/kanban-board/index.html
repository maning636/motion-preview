<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"Sprint 看板"},{"id":"subtitle","type":"string","label":"副标题","default":"四列任务状态可视化"},{"id":"columns","type":"string","label":"列名（逗号分隔）","default":"BACKLOG,IN PROGRESS,REVIEW,DONE"},{"id":"cards","type":"string","label":"每列卡片（| 分隔列，, 分隔卡）","default":"需求梳理,接口定义|API 开发,前端联调|Code Review,文档补齐|已上线,已验收"},{"id":"focusColumn","type":"number","label":"焦点列索引（0-based）","default":1},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 40px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 12px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 400; opacity: 0.55; }
      .board{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; height: 720px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .column{ border: 1px solid rgba(244,239,231,0.12); border-radius: 8px; padding: 24px; display: flex; flex-direction: column;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .column.focus{ border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .col-head{ display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .col-name{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.12em; }
      .col-count{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 16px; font-weight: 500; opacity: 0.45; }
      .card{ border: 1px solid rgba(244,239,231,0.10); border-radius: 6px; padding: 18px; margin-bottom: 14px; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 20px; font-weight: 500; line-height: 1.3; }
      .column.focus .card{ border-color: color-mix(in srgb, var(--accent) 40%, transparent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="board" id="board"></div>
      </section>
    </div>
    <script>
      const fallback = { title: "Sprint 看板", subtitle: "四列任务状态可视化", columns: "BACKLOG,IN PROGRESS,REVIEW,DONE", cards: "需求梳理,接口定义|API 开发,前端联调|Code Review,文档补齐|已上线,已验收", focusColumn: 1, accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      const columns = String(v.columns).split(",").map(s => s.trim());
      const cardGroups = String(v.cards).split("|").map(g => g.split(",").map(s => s.trim()).filter(Boolean));
      const focus = Math.max(0, Math.min(columns.length - 1, Number(v.focusColumn) || 0));
      const board = document.getElementById("board");
      board.style.gridTemplateColumns = `repeat(${columns.length}, 1fr)`;
      columns.forEach((col, i) => {
        const div = document.createElement("div");
        div.className = "column" + (i === focus ? " focus" : "");
        const cards = cardGroups[i] || [];
        div.innerHTML = `
          <div class="col-head">
            <span class="col-name">${col}</span>
            <span class="col-count">${cards.length}</span>
          </div>
          <div class="card-list" id="cards-${i}"></div>
        `;
        board.appendChild(div);
        const list = div.querySelector(".card-list");
        cards.forEach(c => {
          const card = document.createElement("div");
          card.className = "card";
          card.textContent = c;
          list.appendChild(card);
        });
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      document.querySelectorAll(".column").forEach((col, i) => {
        tl.fromTo(col, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.45 + i * 0.12);
        tl.fromTo(col.querySelectorAll(".card"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.1, ease: "power2.out" }, 0.75 + i * 0.12);
      });
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
