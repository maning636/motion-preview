<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"centerLabel","type":"string","label":"中央结论标签","default":"结论"},
  {"id":"centerValue","type":"string","label":"中央结论值（大数字/关键词）","default":"5"},
  {"id":"sources","type":"string","label":"来源线索（换行分隔，4–6 条）","default":"新闻·路透\n报告·艾瑞\n实验·A/B\n访谈·一线"},
  {"id":"caption","type":"string","label":"底部说明","default":"多源溯源 · 汇聚为结论"},
  {"id":"accent","type":"color","label":"强调色","default":"#00FF00"},
  {"id":"background","type":"color","label":"背景色","default":"#12100E"},
  {"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},
  {"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"},{"value":"webm","label":"WebM"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

      *{ box-sizing: border-box; }
      html, body{
        margin:0; width:1920px; height:1080px; overflow:hidden;
        background: var(--background, #12100E);
      }
      #root{
        position:relative; width:1920px; height:1080px; overflow:hidden;
        background: var(--background, #12100E);
        color: var(--foreground, #F4EFE7);
        font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .stage{ position:absolute; inset:0; }
      .gridbg{
        position:absolute; inset:0; pointer-events:none;
        background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px);
        background-size: 48px 48px;
        opacity: .55;
      }

      /* 顶头 eyebrow */
      .eyebrow{
        position:absolute; top: 56px; left: 96px; right: 96px;
        display:flex; justify-content:space-between; align-items:center;
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-size: 16px; letter-spacing:.22em; text-transform:uppercase;
        color: #8A8A85; z-index: 3;
      }
      .eyebrow .acc{ color: var(--accent, #00FF00); font-weight:700; letter-spacing:.18em; }

      /* 底部 caption */
      .caption{
        position:absolute; bottom: 56px; left: 96px; right: 96px;
        display:flex; justify-content:space-between; align-items:center;
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-size: 18px; letter-spacing:.14em;
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 65%, transparent);
        z-index: 3;
      }
      .caption .dot{
        display:inline-block; width:8px; height:8px; border-radius:50%;
        background: var(--accent, #00FF00);
        box-shadow: 0 0 10px color-mix(in srgb, var(--accent, #00FF00) 70%, transparent);
        margin-right: 12px; vertical-align: middle;
      }

      /* 连线层 */
      svg.lines{
        position:absolute; inset:0; width:1920px; height:1080px;
        pointer-events:none; z-index: 1; overflow: visible;
      }
      svg.lines .line{
        stroke: color-mix(in srgb, var(--accent, #00FF00) 55%, transparent);
        stroke-width: 1.5;
        fill: none;
        stroke-dasharray: 2 6;
      }

      /* 中央结论点 */
      #center{
        position:absolute; left:50%; top:50%;
        transform: translate(-50%, -50%);
        width: 460px; height: 460px;
        display:grid; place-items:center;
        z-index: 3;
        opacity: 0;
        will-change: transform, opacity;
      }
      #center .ring{
        position:absolute; inset:0;
        border-radius:50%;
        border: 1.5px solid color-mix(in srgb, var(--accent, #00FF00) 55%, transparent);
        box-shadow:
          0 0 60px color-mix(in srgb, var(--accent, #00FF00) 35%, transparent),
          inset 0 0 40px color-mix(in srgb, var(--accent, #00FF00) 12%, transparent);
      }
      #center .ring.outer{
        inset: -40px;
        border: 1px dashed color-mix(in srgb, var(--accent, #00FF00) 35%, transparent);
      }
      #center .ring.inner{
        inset: 40px;
        border: 1px solid color-mix(in srgb, var(--accent, #00FF00) 25%, transparent);
      }
      #center .core{
        position:relative;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap: 4px;
      }
      #center .coreLabel{
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-size: 22px; letter-spacing:.42em; text-transform:uppercase;
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 65%, transparent);
        margin-bottom: 6px;
      }
      #center .coreValue{
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-weight:700; letter-spacing:-.02em;
        font-size: 220px; line-height: .9;
        color: var(--accent, #00FF00);
        text-shadow: 0 0 40px color-mix(in srgb, var(--accent, #00FF00) 40%, transparent);
      }
      #center .coreSub{
        font-family: 'MEBHeiHeiTi','PingFang SC', sans-serif;
        font-size: 22px; letter-spacing:.14em;
        color: color-mix(in srgb, var(--foreground, #F4EFE7) 72%, transparent);
        margin-top: 6px;
      }

      /* 来源标签 */
      .source{
        position:absolute;
        display:flex; align-items:center; gap: 14px;
        padding: 14px 22px;
        border: 1px solid #2A2A2E;
        border-radius: 999px;
        background: color-mix(in srgb, var(--background, #12100E) 85%, #000);
        font-family: 'MiSans SemiBold','PingFang SC', sans-serif;
        font-size: 22px; letter-spacing:.06em;
        color: var(--foreground, #F4EFE7);
        white-space: nowrap;
        opacity: 0;
        z-index: 2;
        will-change: transform, opacity;
        box-shadow: 0 8px 24px rgba(0,0,0,.35);
      }
      .source .ico{
        display:inline-flex; align-items:center; justify-content:center;
        width: 32px; height: 32px; border-radius:50%;
        background: color-mix(in srgb, var(--accent, #00FF00) 22%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent, #00FF00) 60%, transparent);
        font-size: 16px; color: var(--accent, #00FF00); font-weight:700;
        letter-spacing: 0;
      }
      .source .tag{
        display:inline-block; margin-right: 2px;
        font-family: 'MEBHeiHeiTi','PingFang SC', sans-serif;
        font-size: 14px; letter-spacing:.24em;
        color: #8A8A85; text-transform: uppercase;
      }

      /* 汇聚小粒子（在源→中心的路径上） */
      .particle{
        position:absolute;
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--accent, #00FF00);
        box-shadow: 0 0 12px color-mix(in srgb, var(--accent, #00FF00) 70%, transparent);
        opacity: 0; z-index: 2; pointer-events:none;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="stage" data-start="0" data-duration="6" data-track-index="1">

        <div class="gridbg"></div>

        <div class="eyebrow">
          <span><b class="acc">CONVERGE</b>&nbsp;&nbsp;SOURCES → RESULT</span>
          <span>multi · trace · merge</span>
        </div>

        <!-- 连线层：由 JS 按源位置动态生成 -->
        <svg class="lines" id="lines" viewBox="0 0 1920 1080" preserveAspectRatio="none">
          <defs>
            <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#00FF00" stop-opacity="0.55"/>
              <stop offset="60%" stop-color="#00FF00" stop-opacity="0.10"/>
              <stop offset="100%" stop-color="#00FF00" stop-opacity="0"/>
            </radialGradient>
          </defs>
        </svg>

        <!-- 来源标签：由 JS 按预设位姿分布 -->
        <div class="source" id="src0">
          <span class="ico" data-slot="0">●</span>
          <span class="tag">SRC·01</span><span class="name">新闻·路透</span>
        </div>
        <div class="source" id="src1">
          <span class="ico" data-slot="1">●</span>
          <span class="tag">SRC·02</span><span class="name">报告·艾瑞</span>
        </div>
        <div class="source" id="src2">
          <span class="ico" data-slot="2">●</span>
          <span class="tag">SRC·03</span><span class="name">实验·A/B</span>
        </div>
        <div class="source" id="src3">
          <span class="ico" data-slot="3">●</span>
          <span class="tag">SRC·04</span><span class="name">访谈·一线</span>
        </div>

        <!-- 中央结论 -->
        <div id="center">
          <div class="ring outer"></div>
          <div class="ring"></div>
          <div class="ring inner"></div>
          <div class="core">
            <div class="coreLabel" id="centerLabel">结论</div>
            <div class="coreValue"  id="centerValue">5</div>
            <div class="coreSub"    id="centerSub">SOURCES · MERGED</div>
          </div>
        </div>

        <div class="caption">
          <span><span class="dot"></span><span id="captionText">多源溯源 · 汇聚为结论</span></span>
          <span id="captionRight">t = 6.0s</span>
        </div>

      </section>
    </div>
    <script>
      /* ----- 变量接线（与全库契约一致） ----- */
      const fallback = {
        centerLabel: "结论",
        centerValue: "5",
        sources: "新闻·路透\n报告·艾瑞\n实验·A/B\n访谈·一线",
        caption: "多源溯源 · 汇聚为结论",
        accent: "#00FF00",
        background: "#12100E",
        foreground: "#F4EFE7",
      };
      const v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables()
        : fallback;

      const $ = (id) => document.getElementById(id);
      const html = document.documentElement;
      html.style.setProperty("--foreground", v.foreground || "#F4EFE7");
      html.style.setProperty("--background", v.background || "#12100E");
      html.style.setProperty("--accent",     v.accent     || "#00FF00");

      /* ----- 内容回填 ----- */
      const escapeHtml = (s) => String(s ?? "")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#39;");

      const rawLines = String(v.sources ?? fallback.sources).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const sources = rawLines.slice(0, 6);
      while (sources.length < 4) sources.push("");

      // 预设四方位位姿：左上 / 右上 / 左 / 右（4 条即四周）
      // 若超过 4 条：追加"下左 / 下右"位
      const SLOTS = [
        { x: 300,  y: 260,  dx: -60, dy: -60 }, // 左上
        { x: 1620, y: 260,  dx:  60, dy: -60 }, // 右上
        { x: 240,  y: 620,  dx: -80, dy:   0 }, // 左
        { x: 1680, y: 620,  dx:  80, dy:   0 }, // 右
        { x: 500,  y: 900,  dx: -40, dy:  60 }, // 下左
        { x: 1420, y: 900,  dx:  40, dy:  60 }, // 下右
      ];

      const centerPos = { x: 960, y: 540 };

      // 填充来源标签内容并按位姿落位
      const sourceEls = [];
      for (let i = 0; i < 6; i++) {
        const el = $("src" + i);
        if (!el) continue;
        const slot = SLOTS[i];
        const text = sources[i] || "";
        el.querySelector(".name").textContent = text;
        if (text) {
          el.style.left = slot.x + "px";
          el.style.top  = slot.y + "px";
          el.style.transform = "translate(-50%, -50%)";
          el.dataset.txD = String(slot.dx);
          el.dataset.tyD = String(slot.dy);
          sourceEls.push({ el, slot, idx: i });
        } else {
          el.style.display = "none";
        }
      }

      $("centerLabel").textContent = v.centerLabel || fallback.centerLabel;
      $("centerValue").textContent = v.centerValue || fallback.centerValue;
      $("centerSub").textContent   = sources.length + " SOURCES · MERGED";
      $("captionText").textContent = v.caption || fallback.caption;

      /* ----- 连线：从每个源的中心连到 #center 中心 ----- */
      const svg = $("lines");
      // 清空已有 line（保留 defs）
      while (svg.lastChild && !(svg.lastChild.nodeType === 1 && svg.lastChild.tagName.toLowerCase() === "defs")) {
        svg.removeChild(svg.lastChild);
      }
      sourceEls.forEach((s, i) => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", s.slot.x);
        line.setAttribute("y1", s.slot.y);
        line.setAttribute("x2", centerPos.x);
        line.setAttribute("y2", centerPos.y);
        line.setAttribute("class", "line");
        line.setAttribute("id", "line" + i);
        line.style.opacity = "0";
        svg.appendChild(line);
      });

      // 中心光晕（放到 svg 底层）
      const glow = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      glow.setAttribute("cx", centerPos.x);
      glow.setAttribute("cy", centerPos.y);
      glow.setAttribute("r", 320);
      glow.setAttribute("fill", "url(#coreGlow)");
      glow.setAttribute("id", "coreGlow");
      glow.style.opacity = "0";
      const defs = svg.querySelector("defs");
      if (defs && defs.nextSibling) {
        svg.insertBefore(glow, defs.nextSibling);
      } else {
        svg.appendChild(glow);
      }

      /* ----- 时间线 ----- */
      window.__timelines = window.__timelines || {};
      const DUR = 6;
      const tl = gsap.timeline({ paused: true });

      // 1) 中央光晕先微亮起来作为视觉锚
      tl.fromTo("#coreGlow", { opacity: 0 }, { opacity: 0.6, duration: 0.6, ease: "power2.out" }, 0.1);

      // 2) 连线依次淡入（虚线扫入）
      const lineStagger = 0.09;
      tl.fromTo("#lines line",
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power2.out", stagger: lineStagger }, 0.25);

      // 3) 来源标签错峰淡入（在四周）
      const srcStagger = 0.14;
      sourceEls.forEach((s, i) => {
        const txD = -s.slot.dx * 0.6;
        const tyD = -s.slot.dy * 0.6;
        tl.fromTo(s.el,
          { opacity: 0, x: txD, y: tyD, scale: 0.94 },
          { opacity: 1, x: 0,   y: 0,   scale: 1,   duration: 0.5, ease: "power3.out" },
          0.45 + i * srcStagger);
      });

      // 4) 中央结论点先出场（比来源早一拍，作为"待汇聚"的靶点）
      tl.fromTo("#center",
        { opacity: 0, scale: 0.86 },
        { opacity: 1, scale: 1.0,  duration: 0.55, ease: "back.out(1.4)" }, 0.15);

      // 5) 来源依次向中央汇聚（错峰 0.22s，每条 0.9s）
      const flyDur = 0.9;
      const flyStagger = 0.22;
      const flyStart = 2.0;
      sourceEls.forEach((s, i) => {
        const dx = (centerPos.x - s.slot.x);
        const dy = (centerPos.y - s.slot.y);
        // 用 GSAP 直接 tween x/y（transform）—— 源元素本身在 slot 位置
        tl.to(s.el, {
          x: dx, y: dy,
          scale: 0.35,
          opacity: 0,
          duration: flyDur,
          ease: "power3.in"
        }, flyStart + i * flyStagger);
        // 汇聚瞬间中心闪一下（用 coreValue 缩放脉冲）
        const hitAt = flyStart + i * flyStagger + flyDur - 0.05;
        tl.fromTo("#centerValue",
          { scale: 1.0 },
          { scale: 1.08, duration: 0.22, ease: "power2.out", yoyo: true, repeat: 1 },
          hitAt);
        // 连线在飞入时变淡（源已合并）
        tl.to("#line" + i, { opacity: 0.35, duration: flyDur, ease: "power2.inOut" }, flyStart + i * flyStagger);
      });

      // 6) 汇聚完成后中央高亮呼吸
      const mergeEnd = flyStart + sourceEls.length * flyStagger + flyDur;
      tl.fromTo("#center",
        { scale: 1.0 },
        { scale: 1.06, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, mergeEnd);
      tl.fromTo("#coreGlow",
        { opacity: 0.6 },
        { opacity: 1.0, duration: 0.8, ease: "power2.out" }, mergeEnd);

      // 7) 结尾：回落到稳定态（停留 ~0.6s 可读）
      tl.to("#center",   { scale: 1.0,  duration: 0.35, ease: "power2.out" }, mergeEnd + 1.3);
      tl.to("#coreGlow", { opacity: 0.85, duration: 0.35, ease: "power2.out" }, mergeEnd + 1.3);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
