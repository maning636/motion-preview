<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#list{ position:absolute; left:510px; top:0; width:900px; will-change:transform; }
.lr{ display:flex; align-items:center; gap:24px; padding:0 34px; border-radius:14px; margin-bottom:18px;
  background:color-mix(in srgb, var(--fg) 6%, transparent); will-change:transform,opacity; }
.lr .d{ width:20px; height:20px; border-radius:50%; background:color-mix(in srgb, var(--fg) 35%, transparent); flex:none; }
.lr .tx{ height:15px; border-radius:8px; background:color-mix(in srgb, var(--fg) 24%, transparent); }
.lr .dt{ margin-left:auto; font-size:20px; opacity:.4; font-family:'MiSans SemiBold',sans-serif; flex:none; }
#stop{ background:#171A22; border:3px solid var(--accent); box-shadow:0 18px 50px rgba(0,0,0,.5); }
#stop .d{ background:var(--accent); }
#stop .tx{ background:color-mix(in srgb, var(--fg) 45%, transparent); }
#stopTx{ font-size:30px; font-weight:900; color:var(--fg); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
<div style="position:absolute;inset:0;overflow:hidden;padding-top:500px"><div id="list"><div class="lr" style="height:72px"><div class="d"></div><div class="tx" style="width:45%"></div><span class="dt">07-22</span></div><div class="lr" style="height:94px"><div class="d"></div><div class="tx" style="width:58%"></div><span class="dt">07-21</span></div><div class="lr" style="height:116px"><div class="d"></div><div class="tx" style="width:71%"></div><span class="dt">07-20</span></div><div class="lr" style="height:72px"><div class="d"></div><div class="tx" style="width:54%"></div><span class="dt">07-19</span></div><div class="lr" style="height:94px"><div class="d"></div><div class="tx" style="width:67%"></div><span class="dt">07-18</span></div><div class="lr" style="height:116px"><div class="d"></div><div class="tx" style="width:50%"></div><span class="dt">07-17</span></div><div class="lr" style="height:72px"><div class="d"></div><div class="tx" style="width:63%"></div><span class="dt">07-16</span></div><div class="lr" style="height:94px"><div class="d"></div><div class="tx" style="width:46%"></div><span class="dt">07-15</span></div><div class="lr" style="height:116px"><div class="d"></div><div class="tx" style="width:59%"></div><span class="dt">07-14</span></div><div class="lr" id="stop" style="height:72px"><div class="d"></div><span id="stopTx">v2.0 导演审查上线</span><span class="dt">今天</span></div><div class="lr" style="height:94px"><div class="d"></div><div class="tx" style="width:55%"></div><span class="dt">07-12</span></div><div class="lr" style="height:116px"><div class="d"></div><div class="tx" style="width:68%"></div><span class="dt">07-11</span></div><div class="lr" style="height:72px"><div class="d"></div><div class="tx" style="width:51%"></div><span class="dt">07-10</span></div><div class="lr" style="height:94px"><div class="d"></div><div class="tx" style="width:64%"></div><span class="dt">07-09</span></div></div></div>
    </div>
    <script>
      const FB = {"accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

// 高速长卷 out-exp 急刹：#list 绝对定位 top:0（padding-top 不生效），
// 停点行(i=9)中心 1044px → 画面正中 540px，位移 -504
const list=$('#list');
const mov={y:0};
tl.to(mov,{y:-504,duration:F(50),ease:'expo.out',onUpdate:()=>{
  list.style.transform='translateY('+mov.y+'px)';
}},F(4));
// 停点行抬升+其余退暗 0.38
tl.to('#stop',{scale:1.03,duration:F(8),ease:'power2.out'},F(56));
tl.to('.lr:not(#stop)',{opacity:.38,duration:F(8)},F(56));
// 收尾真静止（补齐到 135f）
tl.to({},{duration:F(71)},F(64));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
