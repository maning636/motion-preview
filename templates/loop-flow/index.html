<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"RLHF 迭代闭环"},{"id":"subtitle","type":"string","label":"副标题","default":"训练 → 推理 → 评估 → 反馈"},{"id":"steps","type":"string","label":"步骤名（逗号分隔，4 个）","default":"训练,推理,评估,反馈"},{"id":"exitCondition","type":"string","label":"退出条件","default":"奖励分数收敛"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 40px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 12px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 400; opacity: 0.55; }
      .chart-area{ position: relative; width: 100%; height: 680px; display: flex; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-svg{ width: 760px; height: 100%; overflow: visible;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node{ fill: rgba(244,239,231,0.04); stroke: rgba(244,239,231,0.18); stroke-width: 2;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node.accent{ stroke: var(--accent); fill: color-mix(in srgb, var(--accent) 10%, transparent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node-text{ fill: #f4efe7; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 22px; font-weight: 600; text-anchor: middle; }
      .node.accent .node-text{ fill: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .link{ fill: none; stroke: rgba(244,239,231,0.14); stroke-width: 3; stroke-linecap: round;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .arrow-head{ fill: rgba(244,239,231,0.14);font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .center-text{ fill: rgba(244,239,231,0.5); font-family: 'MEBHeiHeiTi', sans-serif; font-size: 18px; font-weight: 500; text-anchor: middle; }
      .center-label{ fill: var(--accent); font-family: 'MEBHeiHeiTi', sans-serif; font-size: 26px; font-weight: 700; text-anchor: middle; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <svg class="chart-svg" id="chart-svg" viewBox="0 0 760 680" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "RLHF 迭代闭环", subtitle: "训练 → 推理 → 评估 → 反馈", steps: "训练,推理,评估,反馈", exitCondition: "奖励分数收敛", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      document.documentElement.style.setProperty("--accent", v.accent);
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      const steps = String(v.steps).split(",").map(s => s.trim()).filter(Boolean);
      const svg = document.getElementById("chart-svg");
      const W = 760, H = 680, cx = W / 2, cy = H / 2, r = 240;
      const positions = steps.map((_, i) => {
        const angle = -90 + i * (360 / steps.length);
        const rad = angle * Math.PI / 180;
        return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
      });

      positions.forEach((p, i) => {
        const next = positions[(i + 1) % positions.length];
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const d = `M ${p.x} ${p.y} A ${r} ${r} 0 0 1 ${next.x} ${next.y}`;
        path.setAttribute("d", d);
        path.setAttribute("class", "link link-line");
        path.setAttribute("id", "link" + i);
        svg.appendChild(path);
        const marker = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        const angle = Math.atan2(next.y - p.y, next.x - p.x);
        const size = 10;
        const pts = `${next.x - size * Math.cos(angle) + size * Math.sin(angle)},${next.y - size * Math.sin(angle) - size * Math.cos(angle)} ${next.x},${next.y} ${next.x - size * Math.cos(angle) - size * Math.sin(angle)},${next.y - size * Math.sin(angle) + size * Math.cos(angle)}`;
        marker.setAttribute("points", pts);
        marker.setAttribute("class", "arrow-head");
        svg.appendChild(marker);
      });

      positions.forEach((p, i) => {
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", p.x - 80); rect.setAttribute("y", p.y - 40);
        rect.setAttribute("width", 160); rect.setAttribute("height", 80); rect.setAttribute("rx", 8);
        rect.setAttribute("class", "node" + (i === 0 ? " accent" : ""));
        svg.appendChild(rect);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", p.x); text.setAttribute("y", p.y + 7);
        text.setAttribute("class", "node-text");
        text.textContent = steps[i];
        svg.appendChild(text);
      });

      const centerLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
      centerLabel.setAttribute("x", cx); centerLabel.setAttribute("y", cy - 8);
      centerLabel.setAttribute("class", "center-label");
      centerLabel.textContent = v.exitCondition;
      svg.appendChild(centerLabel);
      const centerSub = document.createElementNS("http://www.w3.org/2000/svg", "text");
      centerSub.setAttribute("x", cx); centerSub.setAttribute("y", cy + 22);
      centerSub.setAttribute("class", "center-text");
      centerSub.textContent = "EXIT WHEN";
      svg.appendChild(centerSub);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      document.querySelectorAll(".link-line").forEach((link, i) => {
        const len = link.getTotalLength ? link.getTotalLength() : 300;
        link.style.strokeDasharray = len; link.style.strokeDashoffset = len;
        tl.to(link, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.5 + i * 0.15);
      });
      document.querySelectorAll(".arrow-head").forEach((head, i) => {
        tl.fromTo(head, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.9 + i * 0.15);
      });
      document.querySelectorAll(".node").forEach((node, i) => {
        tl.fromTo(node, { opacity: 0, scale: 0.8, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.8 + i * 0.12);
      });
      document.querySelectorAll(".node-text").forEach((t, i) => {
        tl.fromTo(t, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.0 + i * 0.12);
      });
      tl.fromTo(".center-label", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 1.5);
      tl.fromTo(".center-text", { opacity: 0 }, { opacity: 0.5, duration: 0.4 }, 1.7);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
