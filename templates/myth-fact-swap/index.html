<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"mythLabel","type":"string","label":"误区标签","default":"常见误区"},{"id":"myth","type":"string","label":"误区","default":"AI 会直接替你思考"},{"id":"factLabel","type":"string","label":"事实标签","default":"更准确的说法"},{"id":"fact","type":"string","label":"事实","default":"AI 会放大你的问题定义能力"},{"id":"caption","type":"string","label":"总结","default":"重点不是替代，而是协作结构"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="5.5" data-track-index="1">

        <div class="gridbg"></div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px;">
          <div id="cardMyth" style="position:absolute;width:1100px;padding:56px 64px;border:1px solid #3F3F46;border-radius:20px;background:#131316;text-align:center;">
            <span class="chip" id="mythLabel" style="color:#9CA3AF;"></span>
            <p id="myth" class="num" style="margin:26px 0 0;font-size:56px;line-height:1.5;color:#9CA3AF;text-decoration:line-through;text-decoration-color:rgba(255,80,80,.7);text-decoration-thickness:4px;"></p>
          </div>
          <div id="cardFact" style="position:absolute;width:1100px;padding:56px 64px;border:2px solid var(--accent,#00FF00);border-radius:20px;background:color-mix(in srgb, var(--accent) 5%, transparent);text-align:center;transform:rotateX(90deg);opacity:0;">
            <span class="chip" id="factLabel" style="border-color:var(--accent,#00FF00);"><b></b></span>
            <p id="fact" class="num" style="margin:26px 0 0;font-size:56px;line-height:1.5;color:var(--accent,#00FF00);"></p>
          </div>
        </div>
        <p id="caption" style="position:absolute;left:50%;bottom:80px;transform:translateX(-50%);font-size:26px;color:#D4D4D8;opacity:0;"></p>

      </section>
    </div>
    <script>
      const fallback = {"mythLabel": "常见误区", "myth": "AI 会直接替你思考", "factLabel": "更准确的说法", "fact": "AI 会放大你的问题定义能力", "caption": "重点不是替代，而是协作结构", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 5.5;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("mythLabel").textContent = v.mythLabel; $("myth").textContent = v.myth;
      $("factLabel").innerHTML = "<b>" + v.factLabel + "</b>"; $("fact").textContent = v.fact;
      $("caption").textContent = v.caption;
      tl.fromTo("#cardMyth", { rotateX: -90, opacity: 0 }, { rotateX: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.3);
      tl.to("#cardMyth", { rotateX: 90, opacity: 0, duration: 0.55, ease: "power2.in" }, 2.6);
      tl.to("#cardFact", { rotateX: 0, opacity: 1, duration: 0.65, ease: "power3.out" }, 3.0);
      tl.to("#caption", { opacity: 1, y: -10, duration: 0.5 }, 3.6);
      tl.to(".scene", { opacity: 0, duration: 0.5 }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
