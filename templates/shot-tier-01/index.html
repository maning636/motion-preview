<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#cam{ position:absolute; inset:0; will-change:transform; }
#page{ position:absolute; left:460px; top:60px; width:1000px; border-radius:18px; background:#14161F;
  border:1px solid color-mix(in srgb, var(--fg) 14%, transparent); padding:36px 40px; }
#phead{ height:56px; border-radius:12px; background:color-mix(in srgb, var(--fg) 10%, transparent); margin-bottom:30px; }
.slot{ position:relative; height:110px; margin-bottom:22px; }
.patch{ position:absolute; inset:0; border-radius:14px; background:var(--bg); }
.row{ position:absolute; inset:0; border-radius:14px; background:color-mix(in srgb, var(--fg) 7%, transparent);
  border:1px solid color-mix(in srgb, var(--fg) 14%, transparent); display:flex; align-items:center;
  padding:0 30px; gap:22px; opacity:0; will-change:transform; overflow:hidden; }
.row .dot{ width:26px; height:26px; border-radius:50%; background:var(--accent); flex:none; }
.row .tx{ height:16px; border-radius:8px; background:color-mix(in srgb, var(--fg) 26%, transparent); }
.seam{ position:absolute; left:0; bottom:0; width:100%; height:2px; background:var(--accent);
  box-shadow:0 0 6px var(--accent); transform:scaleX(0); opacity:0; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.5" data-width="1920" data-height="1080">
<div id="cam"><div id="page"><div id="phead"></div><div class="slot"><div class="patch" id="pt0"></div><div class="row" id="rw0"><div class="dot"></div><div class="tx" style="width:55%"></div><div class="tx" style="width:30%"></div><div class="seam" id="sm0"></div></div></div><div class="slot"><div class="patch" id="pt1"></div><div class="row" id="rw1"><div class="dot"></div><div class="tx" style="width:48%"></div><div class="tx" style="width:41%"></div><div class="seam" id="sm1"></div></div></div><div class="slot"><div class="patch" id="pt2"></div><div class="row" id="rw2"><div class="dot"></div><div class="tx" style="width:41%"></div><div class="tx" style="width:52%"></div><div class="seam" id="sm2"></div></div></div><div class="slot"><div class="patch" id="pt3"></div><div class="row" id="rw3"><div class="dot"></div><div class="tx" style="width:54%"></div><div class="tx" style="width:38%"></div><div class="seam" id="sm3"></div></div></div><div class="slot"><div class="patch" id="pt4"></div><div class="row" id="rw4"><div class="dot"></div><div class="tx" style="width:47%"></div><div class="tx" style="width:49%"></div><div class="seam" id="sm4"></div></div></div><div class="slot"><div class="patch" id="pt5"></div><div class="row" id="rw5"><div class="dot"></div><div class="tx" style="width:40%"></div><div class="tx" style="width:35%"></div><div class="seam" id="sm5"></div></div></div></div></div>
    </div>
    <script>
      const FB = {"accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

// 节拍：第 i 行 cue=12+i*9，飞行 12f；姿态 translateY(-120)→0 + rotateX 16°→0
for(let i=0;i<6;i++){
  const cue=12+i*9, rw='#rw'+i;
  gsap.set(rw,{transformPerspective:900});
  tl.set(rw,{opacity:1},F(cue));
  tl.fromTo(rw,{y:-120,rotationX:16,scale:1.06},
    {y:0,rotationX:0,scale:0.995,duration:F(12),ease:'power2.out'},F(cue));
  tl.to(rw,{scale:1,duration:F(4),ease:'power1.inOut'},F(cue+12));
  // 落地后补丁 2f 消失
  tl.to('#pt'+i,{opacity:0,duration:F(2)},F(cue+12));
  // 嵌入缝：底边 2px 从中心向两侧 5f 展开、8f 淡出
  tl.set('#sm'+i,{opacity:1},F(cue+12));
  tl.fromTo('#sm'+i,{scaleX:0},{scaleX:1,duration:F(5),ease:'power3.out'},F(cue+12));
  tl.to('#sm'+i,{opacity:0,duration:F(8)},F(cue+17));
}
// 相机匀速下摇（行雨与运镜并行）
tl.fromTo('#cam',{y:40},{y:-60,duration:F(56),ease:'none'},F(12));
// 收尾（补齐到 75f）
tl.to({},{duration:F(7)},F(68));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
