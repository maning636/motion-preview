<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "word", "type": "string", "label": "字标", "default": "MOTION"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#bg{ position:absolute; inset:0; background:linear-gradient(180deg,#1A1B2E 0%,#2E2440 55%,#4A3552 100%); }
#wm{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
#wm path{ stroke:#F2F0EB; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.5" data-width="1920" data-height="1080">
<div id="bg"></div><svg id="wm" width="1400" height="240" viewBox="0 0 1400 240"></svg>
    </div>
    <script>
      const FB = {"word": "MOTION", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

// 骨架单线字形（viewBox 100×140），pathLength 归一共享同一进度——同帧起笔同帧齐收
const GLYPHS={
 M:'M10,130 L10,10 L50,70 L90,10 L90,130',
 O:'M50,10 C18,10 10,42 10,70 C10,98 18,130 50,130 C82,130 90,98 90,70 C90,42 82,10 50,10',
 T:'M10,10 L90,10 M50,10 L50,130',
 I:'M25,10 L75,10 M50,10 L50,130 M25,130 L75,130',
 N:'M10,130 L10,10 L90,130 L90,10'};
const WORD=(v.word||'MOTION').toUpperCase();
const svg=$('#wm'), NS='http://www.w3.org/2000/svg';
const CW=100, GAP=CW*0.6+90; // ~0.6em 大字距
const total=WORD.length*CW+(WORD.length-1)*(GAP-CW);
const x0=(1400-total)/2, y0=50;
const paths=[];
for(let i=0;i<WORD.length;i++){
  const g=GLYPHS[WORD[i]]||GLYPHS.O;
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',g);
  p.setAttribute('transform','translate('+(x0+i*GAP)+','+y0+')');
  p.setAttribute('pathLength','1');
  p.style.strokeDasharray='1'; p.style.strokeDashoffset='1';
  svg.appendChild(p); paths.push(p);
}
// 全字符共享同一进度 p：f16-68 ease-in-out 描画
const prog={p:0};
tl.to(prog,{p:1,duration:F(52),ease:'power2.inOut',onUpdate:()=>{
  paths.forEach(p=>p.style.strokeDashoffset=String(1-prog.p));
}},F(16));
tl.to({},{duration:F(37)},F(68)); // 终态静置

      window.__timelines.main = tl;
    </script>
  </body>
</html>
