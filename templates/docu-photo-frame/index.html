<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "fact", "type": "string", "label": "事实句", "default": "这条视频 70% 的完播来自前 3 秒的钩子"}, {"id": "word", "type": "string", "label": "圈词（须为事实句子串）", "default": "70%"}, {"id": "note", "type": "string", "label": "批注", "default": "钩子比内容更值钱"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #EAE2CF; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #26211A; }
      .f-vig{ position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 52%, rgba(64,48,26,.32) 100%); }
      .f-card{ position: absolute; left: 310px; top: 300px; width: 1300px; height: 460px;
        background: #FBF7EC; padding: 70px 80px; box-shadow: 9px 11px 0 rgba(38,33,26,.2); }
      .f-card::before, .f-card::after{ content: ""; position: absolute; width: 120px; height: 34px;
        background: rgba(255,252,240,.55); border-left: 1px solid rgba(38,33,26,.1);
        border-right: 1px solid rgba(38,33,26,.1); }
      .f-card::before{ left: 60px; top: -17px; transform: rotate(-4deg); }
      .f-card::after{ right: 60px; top: -17px; transform: rotate(4deg); }
      .f-fact{ font-size: 62px; font-weight: 900; line-height: 1.5; text-align: center; }
      .f-fact .w{ position: relative; white-space: nowrap; }
      .f-circle{ position: absolute; pointer-events: none; overflow: visible; }
      .f-circle ellipse{ fill: none; stroke: #B03028; stroke-width: 8; stroke-linecap: round; }
      .f-note{ position: absolute; left: 1150px; top: 810px; display: flex; align-items: center; gap: 12px;
        color: #B03028; font-size: 34px; font-weight: 800; font-style: italic; max-width: 560px; }
      .f-note .arr{ font-size: 46px; font-style: normal; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="f-vig"></div>
      <div class="f-card" id="card">
        <div class="f-fact" id="fact"></div>
        <svg class="f-circle" id="circle" viewBox="0 0 400 160" preserveAspectRatio="none">
          <ellipse id="circleEl" cx="200" cy="80" rx="188" ry="68"/>
        </svg>
      </div>
      <div class="f-note" id="noteWrap"><span class="arr">↖</span><span id="note"></span></div>

    </div>
    <script>
      const fallback = {"fact": "这条视频 70% 的完播来自前 3 秒的钩子", "word": "70%", "note": "钩子比内容更值钱", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      const fact = String(V.fact ?? "");
      const word = String(V.word ?? "");
      $("note").textContent = V.note;
      const factEl = $("fact");
      const idx = word ? fact.indexOf(word) : -1;
      if (idx >= 0) {
        factEl.append(document.createTextNode(fact.slice(0, idx)));
        const w = document.createElement("span");
        w.className = "w"; w.id = "word";
        w.textContent = word;
        factEl.appendChild(w);
        factEl.append(document.createTextNode(fact.slice(idx + word.length)));
      } else {
        factEl.textContent = fact;
      }
      const circle = $("circle"), ellipse = $("circleEl");
      if ($("word")) {
        const cardRect = $("card").getBoundingClientRect();
        const r = $("word").getBoundingClientRect();
        circle.style.left = (r.left - cardRect.left - 26) + "px";
        circle.style.top = (r.top - cardRect.top - 18) + "px";
        circle.style.width = (r.width + 52) + "px";
        circle.style.height = (r.height + 36) + "px";
      } else {
        circle.style.display = "none";
      }
      const len = ellipse.getTotalLength();
      ellipse.style.strokeDasharray = String(len);
      ellipse.style.strokeDashoffset = String(len);
      tl.fromTo("#card", { opacity: 0, rotation: -3, y: 30 }, { opacity: 1, rotation: -1, y: 0, duration: 0.55, ease: "power3.out" }, 0.1);
      tl.fromTo("#fact", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.5);
      tl.to(ellipse, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 1.15);
      tl.fromTo("#noteWrap", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.7);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
