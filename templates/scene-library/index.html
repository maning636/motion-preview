<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"场景插画库"},{"id":"subtitle","type":"string","label":"副标题","default":"6 个可复用的内容生产场景"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 40px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 12px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 400; opacity: 0.55; }
      .grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; width: 1100px; margin: 0 auto;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .card{ padding: 24px; background: rgba(244,239,231,0.04); border: 1px solid rgba(244,239,231,0.12); border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 16px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .card svg{ width: 120px; height: 90px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .card svg path, .card svg circle, .card svg line, .card svg rect, .card svg polygon{ fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .card svg .accent{ stroke: var(--accent); fill: color-mix(in srgb, var(--accent) 12%, transparent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .card-label{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="grid" id="grid"></div>
      </section>
    </div>
    <script>
      const fallback = { title: "场景插画库", subtitle: "6 个可复用的内容生产场景", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      const scenes = [
        { name: "深度思考", svg: '<circle cx="60" cy="35" r="12"/><path d="M48 55 Q40 75 40 95 L52 95 L52 115 L72 115 L72 95 L84 95 Q84 75 76 55"/><path d="M80 70 L95 55"/><g class="accent"><path d="M110 25 a10 10 0 1 0 0 15 h-5 a10 10 0 1 0 0 -15z" transform="rotate(15 110 32)"/><line x1="110" y1="10" x2="110" y2="15"/><line x1="125" y1="18" x2="120" y2="22"/></g>' },
        { name: "协作共创", svg: '<rect x="60" y="35" width="80" height="55" rx="4"/><line x1="75" y1="50" x2="125" y2="50" class="accent"/><circle cx="45" cy="60" r="10"/><path d="M35 75 Q28 90 28 110 L38 110 L38 130 L55 130 L55 110 L68 110 Q68 90 60 75"/><circle cx="155" cy="60" r="10"/><path d="M145 75 Q138 90 138 110 L148 110 L148 130 L165 130 L165 110 L178 110 Q178 90 170 75"/>' },
        { name: "提示工程", svg: '<rect x="75" y="30" width="70" height="55" rx="4"/><line x1="85" y1="45" x2="135" y2="45" class="accent"/><circle cx="55" cy="60" r="10"/><path d="M45 75 Q38 90 38 110 L48 110 L48 130 L65 130 L65 110 L78 110 Q78 90 70 75"/><path d="M78 85 L95 65"/>' },
        { name: "知识检索", svg: '<rect x="90" y="35" width="60" height="90" rx="3"/><line x1="90" y1="60" x2="150" y2="60"/><line x1="90" y1="85" x2="150" y2="85"/><line x1="90" y1="110" x2="150" y2="110"/><rect x="110" y="95" width="12" height="4" rx="1" class="accent"/><circle cx="55" cy="75" r="16"/><line x1="65" y1="90" x2="80" y2="110"/>' },
        { name: "验证分析", svg: '<rect x="50" y="35" width="100" height="70" rx="4"/><line x1="65" y1="50" x2="135" y2="50"/><line x1="65" y1="90" x2="135" y2="90"/><line x1="65" y1="50" x2="65" y2="90"/><path class="accent" d="M70 80 Q90 78 105 60 T140 45"/><polygon class="accent" points="140,45 134,51 144,51" transform="rotate(-30 140 45)"/>' },
        { name: "上线发布", svg: '<path d="M20 150 Q50 125 80 150 T140 150 T200 150"/><g class="accent"><polygon points="60,110 75,75 90,110 75,118"/><polygon class="accent" points="68,115 75,140 82,115" style="fill:color-mix(in srgb, var(--accent) 15%, transparent)"/></g>' }
      ];
      const grid = document.getElementById("grid");
      scenes.forEach(s => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<svg viewBox="0 0 160 120">${s.svg}</svg><div class="card-label">${s.name}</div>`;
        grid.appendChild(card);
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      document.querySelectorAll(".card").forEach((card, i) => {
        tl.fromTo(card, { opacity: 0, y: 30, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power2.out" }, 0.45 + i * 0.08);
      });
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.4, ease: "power2.in" }, 4.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
