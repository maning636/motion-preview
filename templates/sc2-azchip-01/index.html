<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "VOL.15 · 视觉动效库"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.388 / 400"}, {"id": "chips", "type": "string", "label": "芯片词（逗号分隔 12 个）", "default": "选题,脚本,口播,字幕,封面,标题,剪辑,配乐,发布,复盘,投放,变现"}, {"id": "target", "type": "number", "label": "高亮目标芯片（从 1 数）", "default": 6}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .cg-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .cg-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .cg-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .cg-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 网格标签 */
      .cg-kicker{ position: absolute; left: 50%; top: 170px; transform: translateX(-50%); z-index: 5;
        font-size: 21px; letter-spacing: .3em; color: #55554E; }
      .cg-kicker b{ color: #141414; font-weight: 400; }
      /* 芯片网格 */
      .cg-grid{ position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); z-index: 4;
        display: grid; grid-template-columns: repeat(4, auto); gap: 30px 34px; }
      .cg-chip{ font-family: 'MiSans SemiBold', sans-serif; font-size: 30px; padding: 20px 46px;
        border: 3px solid #141414; border-radius: 999px; background: #E8E7DE; color: #9A9A92;
        text-align: center; opacity: 0; white-space: nowrap; }
      .cg-chip .n{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; font-size: 17px;
        letter-spacing: .12em; margin-right: 12px; opacity: .7; }
      /* 底部荧光绿署名条 */
      .cg-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(60px); }
      .cg-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .cg-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="cg-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="cg-kicker mono" id="kicker">SELECT ONE <b>· 单选压暗</b></div>
      <div class="cg-grid" id="grid"></div>
      <div class="cg-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · CHIP SELECT</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "VOL.15 · 视觉动效库", "pageno": "P.388 / 400", "chips": "选题,脚本,口播,字幕,封面,标题,剪辑,配乐,发布,复盘,投放,变现", "target": 6, "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      // 生成 12 枚芯片
      const words = String(V.chips).split(",").map(s => s.trim()).filter(Boolean).slice(0, 12);
      while (words.length < 12) words.push("项 " + (words.length + 1));
      const chips = words.map((w, i) => {
        const el = document.createElement("div");
        el.className = "cg-chip";
        const n = document.createElement("span"); n.className = "n"; n.textContent = String(i + 1).padStart(2, "0");
        const t = document.createElement("span"); t.textContent = w;
        el.appendChild(n); el.appendChild(t);
        $("grid").appendChild(el);
        return el;
      });
      const target = Math.min(Math.max(1, Math.round(V.target || 1)), chips.length);
      const tEl = chips[target - 1];
      const others = chips.filter(c => c !== tEl);
      // 页眉
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      tl.fromTo("#kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 0.4);
      // 芯片逐个点灰入场
      tl.to(chips, { opacity: 1, duration: 0.01, stagger: 0.07 }, 0.55);
      chips.forEach((el, i) => {
        tl.fromTo(el, { scale: 0.55 }, { scale: 1, duration: 0.34, ease: "back.out(2.2)" }, 0.55 + i * 0.07);
      });
      // 底部署名条
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 1.5);
      tl.fromTo([".cg-foot .f1", ".cg-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 1.75);
      // 停一拍后：目标芯片荧光绿弹亮放大，全场其余压暗聚光
      const T = 2.75;
      tl.to(others, { opacity: 0.25, duration: 0.45, ease: "power2.out" }, T);
      tl.to(tEl, { backgroundColor: V.accent, color: "#141414", duration: 0.2, ease: "power2.out" }, T);
      tl.fromTo(tEl, { scale: 1 }, { scale: 1.24, duration: 0.18, ease: "power2.out" }, T);
      tl.to(tEl, { scale: 1.14, duration: 0.3, ease: "back.out(2.8)" }, T + 0.18);
      tl.to(tEl, { boxShadow: "10px 10px 0 #141414", duration: 0.3, ease: "power2.out" }, T + 0.1);
      // 定格：目标芯片呼吸微浮，无 fade-out
      tl.to(tEl, { scale: 1.18, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 2 }, T + 0.9);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
