<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "两种方法的效率差距"}, {"id": "itemA", "type": "string", "label": "项目 A", "default": "传统整理"}, {"id": "valueA", "type": "number", "label": "数值 A", "default": 42}, {"id": "itemB", "type": "string", "label": "项目 B", "default": "AI 辅助"}, {"id": "valueB", "type": "number", "label": "数值 B", "default": 86}, {"id": "unit", "type": "string", "label": "单位", "default": "%"}, {"id": "caption", "type": "string", "label": "结论", "default": "AI 辅助在资料聚合和初稿生成阶段优势更明显。"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #F5F0E6); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #F5F0E6); color: var(--foreground, #1D1D20);
  font-family:'Noto Sans SC','PingFang SC',sans-serif; }
.scene{ position:absolute; inset:0; padding:64px 80px; }
.card{ background:#FFFDF7; border:3px solid #1D1D20; border-radius:16px; box-shadow:6px 6px 0 #2A292B; }
.tape{ position:absolute; width:120px; height:32px; background:rgba(185,232,51,.6); border:2px solid #1D1D20;
  border-radius:4px; transform:rotate(-5deg); z-index:5; }
.tape.pink{ background:rgba(241,59,136,.35); transform:rotate(4deg); }
.tape.blue{ background:rgba(62,123,242,.3); transform:rotate(-3deg); }
.chip{ display:inline-flex; align-items:center; gap:8px; padding:6px 14px; background:#FFFDF7; border:3px solid #1D1D20;
  border-radius:999px; font-family:'Fredoka','Arial Rounded MT Bold',sans-serif; font-weight:700; font-size:18px;
  letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; box-shadow:4px 4px 0 #2A292B; }
.chip.lime{ background:#B9E833; } .chip.blue{ background:#3E7BF2; color:#FFFDF7; }
.chip.pink{ background:#F13B88; color:#FFFDF7; } .chip.orange{ background:#FF9F1C; }
.num{ font-family:'Fredoka','Arial Rounded MT Bold',sans-serif; font-weight:700; }
.mono{ font-family:'IBM Plex Mono','JetBrains Mono',monospace; font-weight:700; }
.dashline{ border:none; border-top:3px dashed #1D1D20; }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="6" data-track-index="1">

        <div class="card" style="position:absolute;left:60px;top:56px;padding:16px 28px;">
          <span class="chip pink">VS</span>
          <h1 id="title" class="num" style="display:inline-block;margin:0 0 0 16px;font-size:40px;vertical-align:middle;"></h1>
        </div>
        <div style="position:absolute;left:100px;right:100px;top:230px;display:flex;flex-direction:column;gap:52px;">
          <div class="trow card" id="rowA" style="padding:32px 38px;">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;">
              <span class="rlab" style="font-size:30px;font-weight:700;"></span><span class="rval num" style="font-size:38px;color:#3E7BF2;">0</span>
            </div>
            <div style="height:48px;border:3px solid #1D1D20;border-radius:12px;background:#F5F0E6;overflow:hidden;">
              <div class="track" style="height:100%;background:#3E7BF2;border-right:3px solid #1D1D20;transform:scaleX(0);transform-origin:left;"></div>
            </div>
          </div>
          <div class="trow card" id="rowB" style="padding:32px 38px;">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;">
              <span class="rlab" style="font-size:30px;font-weight:700;"></span><span class="rval num" style="font-size:38px;color:#F13B88;">0</span>
            </div>
            <div style="height:48px;border:3px solid #1D1D20;border-radius:12px;background:#F5F0E6;overflow:hidden;">
              <div class="track" style="height:100%;background:#F13B88;border-right:3px solid #1D1D20;transform:scaleX(0);transform-origin:left;"></div>
            </div>
          </div>
        </div>
        <span class="chip lime" id="caption" style="position:absolute;left:100px;bottom:60px;font-size:20px;opacity:0;"></span>

      </section>
    </div>
    <script>
      const fallback = {"title": "两种方法的效率差距", "itemA": "传统整理", "valueA": 42, "itemB": "AI 辅助", "valueB": 86, "unit": "%", "caption": "AI 辅助在资料聚合和初稿生成阶段优势更明显。", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 6;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("title").textContent = v.title; $("caption").textContent = v.caption;
      const rows = [["#rowA", v.itemA, Number(v.valueA)], ["#rowB", v.itemB, Number(v.valueB)]];
      const maxV = Math.max(...rows.map((r) => r[2]), 1);
      rows.forEach(([sel, lab, val], i) => {
        const el = document.querySelector(sel);
        el.querySelector(".rlab").textContent = lab;
        tl.fromTo(el, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5 }, 0.3 + i * 0.4);
        tl.to(el.querySelector(".track"), { scaleX: val / maxV, duration: 1.0, ease: "power3.inOut" }, 0.5 + i * 0.4);
        const rv = el.querySelector(".rval"), o = { n: 0 };
        tl.to(o, { n: val, duration: 1.0, ease: "power2.out", onUpdate: () => { rv.textContent = Math.round(o.n) + (v.unit || ""); } }, 0.5 + i * 0.4);
      });
      tl.to("#caption", { opacity: 1, y: -8, duration: 0.4 }, 2.2);
      tl.to(".scene", { opacity: 0, duration: 0.5 }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
