<html lang="zh-CN" data-composition-variables='[{"id":"pack","name":"规格包","type":"select","label":"规格包（配色 / 字体 / 曲线）","options":[{"label":"暗色科技","value":"dark"},{"label":"奶油贴纸","value":"cream"},{"label":"单色克制","value":"mono"},{"label":"夜航","value":"night"}],"default":"night"},{"id":"eyebrow","name":"眉标","type":"string","label":"顶部眉标","default":"THE REFRAME"},{"id":"title","name":"标题","type":"string","label":"标题","default":"换个问法，答案整个换掉"},{"id":"oldLabel","name":"旧标签","type":"string","label":"旧问法的标签","default":"旧问法"},{"id":"oldQ","name":"旧问句","type":"string","label":"旧问句","default":"这个功能要不要做"},{"id":"oldA","name":"旧答案","type":"string","label":"旧问句的答案","default":"答：要，因为需求方提了"},{"id":"newLabel","name":"新标签","type":"string","label":"新问法的标签","default":"新问法"},{"id":"newQ","name":"新问句","type":"string","label":"新问句","default":"不做它，最坏会怎么样"},{"id":"newA","name":"新答案","type":"string","label":"新问句的答案","default":"答：没人来。那就不用做"},{"id":"foot","name":"落款","type":"string","label":"底部一句话","default":"问「要不要」你只能得到意见。"}]'>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="旧问法上盖一道横线，中间一条「换成」，下面是新问法和它的答案。同一个问题换个问法，答案整个换掉——认知类里最省力也最容易被忽略的一招。">
<title>重新框定 · 换个问法</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<link rel="stylesheet" href="../_lib/packs.css">
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<!-- packs.js 必须排在 blocks.js **之后**：blocks.js 结尾是 global.BBlocks = BB，
     会把它整个替换掉。谁先加载谁的东西就没了，表现是 B.pack is not a function。 -->
<script src="../_lib/packs.js"></script>
<style>
  /* 底色和字色**必须来自规格包**，不能写死。
     写死 #000 + #F4F1EA 的时候，四个包里只有 dark / night 正常：
     cream 的 --pk-fg 是 #2A2118、mono 是 #14140F，两个都是**深字**，
     压在这个写死的黑底上 → 标题、标签、说明全糊掉。
     而写死字面量色的元素（比如 rgba(244,241,234,.82)）反而还看得见，
     画面上就成了一半能看一半不能看——比全黑更难认。
     一共 33 条模板中招（混剪 5 + 认知 22 + 节拍 6）。

     注意区分两层契约（packs.css 顶部注释里写过）：
       --pk-bg / --pk-fg      = 包自带底板，舞台自己用它
       --pk-*-media           = 压在用户素材上的那一层
     这里改的是前者。 */
  html,body{margin:0;padding:0;background:var(--pk-bg,#000)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--pk-bg,#000);
        color:var(--pk-fg,#F4F1EA);font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
        -webkit-font-smoothing:antialiased}
  /* 统一安全区：混剪里所有贴边元素都从 72/88 起，不贴 0 */
  
  /* ── 通用 ── */
  .eyebrow{position:absolute;left:120px;top:104px;opacity:0;
      font-family:ui-monospace,Consolas,monospace;font-size:26px;font-weight:700;
      letter-spacing:.34em;color:var(--pk-accent);text-indent:.34em}
  .h1{position:absolute;left:120px;top:148px;width:1680px;opacity:0;
      font-size:76px;font-weight:900;line-height:1.16;color:var(--pk-fg);letter-spacing:.01em}
  .foot{position:absolute;left:120px;top:922px;width:1680px;opacity:0;
      font-size:34px;line-height:1.5;color:var(--pk-muted)}
  .foot b{color:var(--pk-accent);font-weight:700}
  /* 底部一条极细的分隔，给满屏一个「结束感」 */
  .footline{position:absolute;left:120px;top:884px;width:0;height:2px;background:var(--pk-accent)}

  /* ── 因果链 ── */
  .spine{position:absolute;left:120px;top:0;width:4px;height:0;background:var(--pk-accent);opacity:.9}
  .node{position:absolute;left:120px;width:64px;height:64px;margin:-32px 0 0 -32px;
      border-radius:50%;border:3px solid var(--pk-accent);background:var(--pk-bg);opacity:0;
      display:flex;align-items:center;justify-content:center;
      font-family:ui-monospace,Consolas,monospace;font-size:26px;font-weight:800;color:var(--pk-accent)}
  .clabel{position:absolute;opacity:0;font-family:ui-monospace,Consolas,monospace;
      font-size:30px;font-weight:800;letter-spacing:.20em;color:var(--pk-accent)}
  .ctext{position:absolute;opacity:0;font-size:52px;font-weight:700;line-height:1.30;color:var(--pk-fg)}
  .cnote{position:absolute;opacity:0;font-size:27px;line-height:1.5;
      color:var(--pk-muted)}

  /* ── 公式页 ── */
  .eqbox{position:absolute;left:120px;top:352px;width:1680px;height:210px;opacity:0;
      display:flex;align-items:center;justify-content:center;gap:0;
      border-top:2px solid rgba(244,241,234,.14);border-bottom:2px solid rgba(244,241,234,.14)}
  .eqbox .t{font-size:150px;font-weight:900;color:var(--pk-fg);font-variant-numeric:tabular-nums}
  .eqbox .o{font-size:110px;font-weight:300;color:var(--pk-muted);padding:0 26px}
  .eqbox .r{font-size:150px;font-weight:900;color:var(--pk-accent);font-variant-numeric:tabular-nums}
  .vcard{position:absolute;top:650px;width:520px;opacity:0;
      border-left:4px solid rgba(244,241,234,.18);padding-left:28px}
  .vcard .vn{font-size:40px;font-weight:900;color:var(--pk-fg)}
  .vcard .vd{font-size:26px;line-height:1.5;color:var(--pk-muted);margin-top:14px}
  .vcard .vv{font-size:30px;font-weight:800;color:var(--pk-accent);margin-top:14px;
      font-family:ui-monospace,Consolas,monospace}

  /* ── 引述页 ── */
  .qm{position:absolute;left:120px;top:236px;opacity:0;
      font-family:Georgia,'Times New Roman',serif;font-size:220px;line-height:.7;
      color:var(--pk-accent);opacity:0}
  .qtext{position:absolute;left:120px;top:376px;width:1560px;opacity:0;
      font-size:96px;font-weight:800;line-height:1.42;color:var(--pk-fg);letter-spacing:.01em}
  .qwho{position:absolute;left:120px;opacity:0;
      font-family:ui-monospace,Consolas,monospace;font-size:28px;font-weight:700;
      letter-spacing:.16em;color:var(--pk-muted)}
  .qrule{position:absolute;left:120px;width:0;height:2px;background:rgba(244,241,234,.28)}
  .qlab{position:absolute;opacity:0;font-family:ui-monospace,Consolas,monospace;
      font-size:26px;font-weight:800;letter-spacing:.22em;color:var(--pk-accent)}
  .qtake{position:absolute;opacity:0;font-size:36px;line-height:1.52;
      color:var(--pk-fg)}

  /* ── 曲线页 ── */
  .chart{position:absolute;left:120px;top:400px;width:1680px;height:400px}
  .svgbox{position:absolute;left:0;top:0;width:100%;height:100%}
  .grid{position:absolute;left:0;right:0;height:1px;background:rgba(244,241,234,.10)}
  .pivot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
      background:var(--pk-accent);opacity:0;box-shadow:0 0 0 8px rgba(232,160,72,.18)}
  .pvline{position:absolute;width:2px;background:rgba(232,160,72,.55);opacity:0}
  .pvlab{position:absolute;opacity:0;font-size:30px;font-weight:800;color:var(--pk-accent)}
  .phase{position:absolute;top:0;opacity:0}
  .phase .pn{font-family:ui-monospace,Consolas,monospace;font-size:24px;font-weight:800;
      letter-spacing:.18em;color:var(--pk-accent)}
  .phase .pt{font-size:32px;font-weight:700;color:var(--pk-fg);margin-top:12px}
  .phase .pd{font-size:25px;color:var(--pk-muted);margin-top:10px;line-height:1.45}

  /* ── 里程碑轴 ──
     年份在轴上、事件在轴下，都左对齐：四个节点均匀排开时，
     居中对齐会让第一个标签跑到 x=-30（画布外），左对齐天然避开。 */
  /* 轴不写 opacity:0。补间给的是 width（从 0 长到 1680），
     那根轴就是靠「长出来」这件事被看见的；顺手在 CSS 里写个 opacity:0，
     等于要求补间再开一次透明度，而没开——轴就永远是隐形的，
     而且 F1~F5 一条都不报（位置对、宽度对、时间轴正常）。
     F6 就是为这一条加的断言。 */
  .tl-axis{position:absolute;left:120px;top:560px;width:0;height:4px;
      background:var(--pk-accent)}
  .tl-dot{position:absolute;top:546px;width:32px;height:32px;border-radius:50%;
      background:var(--pk-accent);opacity:0}
  .tl-yr{position:absolute;top:482px;width:340px;opacity:0;
      font-family:ui-monospace,Consolas,monospace;font-size:34px;font-weight:800;
      letter-spacing:.06em;color:var(--pk-accent)}
  .tl-ti{position:absolute;top:606px;width:340px;opacity:0;
      font-size:32px;font-weight:800;line-height:1.28;color:var(--pk-fg)}
  .tl-no{position:absolute;top:700px;width:340px;opacity:0;
      font-size:23px;line-height:1.5;color:var(--pk-muted)}
  .tl-stem{position:absolute;top:492px;width:2px;height:0;
      background:var(--pk-line);opacity:0}

  /* ── 误区对照 ──
     底板用 var(--pk-panel)，不写死 rgba(...)：panel 是包给的，
     cream/mono 上是浅色、dark/night 上是深色，写死就等于脱离规格包。 */
  .myth{position:absolute;left:120px;width:1680px;height:196px;opacity:0;
      border:2px solid var(--pk-line);background:var(--pk-panel);
      display:flex;align-items:center;gap:40px;padding:0 44px}
  .myth .mk{flex:0 0 168px;font-family:ui-monospace,Consolas,monospace;
      font-size:28px;font-weight:800;letter-spacing:.22em;color:var(--pk-muted)}
  .myth .mv{flex:1;font-size:50px;font-weight:800;line-height:1.3;color:var(--pk-fg)}
  .myth.on{border-color:var(--pk-accent)}
  .myth.on .mk{color:var(--pk-accent)}
  /* 删除线是盖在文字上的一层，不是 flex 里的一个兄弟。
     写成 flex 兄弟（flex:0 0 56px）吧，width 补间被 flex-basis 压住，
     永远只有 56px；改成 flex:0 0 auto 吧，它一长就把文字挤成 0 宽——
     两次都是「横线没穿过文字」，而画面上根本看不出是为什么。
     绝对定位才既不参与排版、又真的压在那行字上。
     left 252 = 面板内边距 44 + 标签 168 + 间距 40，正好是正文左沿。 */
  .myth .x{position:absolute;left:252px;top:96px;width:0;height:4px;
      background:var(--pk-muted);opacity:0}

  /* ── 反向思考 ── */
  .iv-row{position:absolute;left:120px;width:1680px;height:104px;opacity:0;
      display:flex;align-items:center;gap:36px}
  .iv-n{flex:0 0 58px;height:58px;border-radius:50%;border:2px solid var(--pk-line);
      display:flex;align-items:center;justify-content:center;
      font-family:ui-monospace,Consolas,monospace;font-size:26px;font-weight:800;
      color:var(--pk-muted)}
  .iv-f{flex:0 0 700px;font-size:38px;font-weight:700;line-height:1.3;color:var(--pk-fg)}
  .iv-a{flex:0 0 40px;height:2px;background:var(--pk-accent);opacity:0}
  .iv-d{flex:1;font-size:30px;font-weight:700;line-height:1.3;color:var(--pk-accent)}

  /* ── 三方视角 ── */
  .ln{position:absolute;width:480px;opacity:0}
  .ln .lr{font-family:ui-monospace,Consolas,monospace;font-size:27px;font-weight:800;
      letter-spacing:.24em;color:var(--pk-accent)}
  .ln .ls{font-size:37px;font-weight:800;line-height:1.34;color:var(--pk-fg);
      margin-top:20px}
  .ln .la{font-size:24px;line-height:1.55;color:var(--pk-muted);margin-top:24px}
  .ln .lbar{width:0;height:3px;background:var(--pk-accent);margin-top:0}
  /* 收口：三方各说各的，但总有一件事是三方都认的。
     没有这一条，三栏只占上三分之一、中间空一大块——不是克制，是没填满；
     而这一条恰好是这一骨架真正的落点：先摊开分歧，再指出唯一的公约数。 */
  .ln-cons{position:absolute;left:120px;top:672px;width:1680px;opacity:0;
      border-top:2px solid var(--pk-line);padding-top:34px;
      display:flex;align-items:baseline;gap:40px}
  .ln-cons .ck{flex:0 0 250px;font-family:ui-monospace,Consolas,monospace;
      font-size:26px;font-weight:800;letter-spacing:.22em;color:var(--pk-accent)}
  .ln-cons .cv{flex:1;font-size:42px;font-weight:800;line-height:1.3;color:var(--pk-fg)}

  /* ── 瓶颈 ── */
  .bn{position:absolute;width:380px;opacity:0}
  .bn .bbar{height:92px;border-radius:8px;background:var(--pk-line)}
  .bn .bfill{position:absolute;left:0;top:0;height:92px;border-radius:8px;width:0;
      background:var(--pk-muted)}
  .bn .bnm{font-size:29px;font-weight:800;color:var(--pk-fg);margin-top:26px}
  .bn .bcv{font-family:ui-monospace,Consolas,monospace;font-size:46px;font-weight:800;
      color:var(--pk-muted);margin-top:10px;font-variant-numeric:tabular-nums}
  .bn.key .bfill{background:var(--pk-accent)}
  .bn.key .bcv{color:var(--pk-accent)}
  .bn .btag{position:absolute;right:0;top:110px;font-family:ui-monospace,Consolas,monospace;
      font-size:22px;font-weight:800;letter-spacing:.16em;color:var(--pk-accent);opacity:0}
  .bn-eq{position:absolute;left:120px;top:720px;width:1680px;opacity:0;
      display:flex;align-items:baseline;gap:26px}
  .bn-eq .t1{font-size:34px;color:var(--pk-muted)}
  .bn-eq .t2{font-size:96px;font-weight:900;color:var(--pk-fg);
      font-variant-numeric:tabular-nums}
  .bn-eq .t3{font-size:34px;color:var(--pk-muted)}

  /* ── 重新框定 ── */
  .rf{position:absolute;left:120px;width:1680px;opacity:0}
  .rf .rk{flex:0 0 190px;height:52px;border:2px solid var(--pk-line);
      display:flex;align-items:center;justify-content:center;
      font-family:ui-monospace,Consolas,monospace;font-size:26px;font-weight:800;
      letter-spacing:.20em;color:var(--pk-muted)}
  .rf .rq{flex:1;font-size:46px;font-weight:800;line-height:1.32;color:var(--pk-fg)}
  .rf .ra{font-size:30px;line-height:1.45;color:var(--pk-muted);margin-top:18px}
  .rf-row{display:flex;align-items:center;gap:40px}
  .rf-hit{position:absolute;left:120px;top:0;width:0;height:5px;
      background:var(--pk-muted);opacity:0}
  .rf-mid{position:absolute;left:120px;top:520px;width:1680px;opacity:0;
      display:flex;align-items:center;gap:28px}
  .rf-mid .mw{height:2px;background:var(--pk-line)}
  .rf-mid .ml{font-family:ui-monospace,Consolas,monospace;font-size:26px;font-weight:800;
      letter-spacing:.30em;color:var(--pk-accent);white-space:nowrap}

</style>
</head>
<body>
<div id="stage">

  <div class="eyebrow" id="eyebrow">THE REFRAME</div>
  <div class="h1" id="h1" data-fit-max="76" data-fit-min="44">换个问法，答案整个换掉</div>

  <div class="rf" id="rf1" style="top:346px">
    <div class="rf-row">
      <div class="rk" id="rfk1">旧问法</div>
      <div class="rq" id="rfq1" data-fit-max="46" data-fit-min="26">这个功能要不要做</div>
    </div>
    <div class="rf-hit" id="rfh1" style="top:34px"></div>
    <div class="ra" id="rfa1" data-fit-max="30" data-fit-min="20">答：要，因为需求方提了</div>
  </div>

  <div class="rf-mid" id="rfmid">
    <span class="mw" id="rfmw1" style="width:640px"></span>
    <span class="ml">换成</span>
    <span class="mw" id="rfmw2" style="width:640px"></span>
  </div>

  <div class="rf" id="rf2" style="top:602px">
    <div class="rf-row">
      <div class="rk" id="rfk2" style="border-color:var(--pk-accent);color:var(--pk-accent)">新问法</div>
      <div class="rq" id="rfq2" data-fit-max="46" data-fit-min="26">不做它，最坏会怎么样</div>
    </div>
    <div class="ra" id="rfa2" data-fit-max="30" data-fit-min="20"
      style="color:var(--pk-accent)">答：没人来。那就不用做</div>
  </div>

  <div class="footline" id="footline"></div>
  <div class="foot" id="footbox"><span id="foot">同一个功能，</span><b>问「要不要」你只能得到意见，问「不做的后果」你才能拿到决策。</b></div>

</div>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  var tl = B.tl();
  /* 规格包：先定风格，再建任何元素。
     画面素材的配色**不跟着包走**——那是"底片"，用户自己的东西不能被模板改色；
     跟着包走的只有 UI 层（字色、强调色、描边、圆角、曲线）。这个边界必须守住。 */
  B.pack(v.pack);
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  function q(s) { return document.querySelector(s); }
  /* 素材位接真视频：留空就继续用 CSS 画面 */
  function live(n, src) {
    if (!src) return;
    var s = document.getElementById('s' + n), e = document.getElementById('v' + n);
    if (!s || !e) return;
    s.classList.add('live'); e.src = src;
    e.play().catch(function () {});
  }
  /* 景别缓推：v1/v3 里画面始终在极慢地动，这是「像镜头」的关键 */
  function push(n, at, dur, from, to, ease) {
    var s = q('#s' + n + ' .sky'), g = q('#s' + n + ' .glow'), r = q('#s' + n + ' .r2');
    if (s) tl.fromTo(s, { scale: from, y: '0%' },
      { scale: to, y: '-2%', duration: dur, ease: ease || 'none' }, at);
    if (g) tl.fromTo(g, { xPercent: -4, opacity: .8 },
      { xPercent: 5, opacity: 1, duration: dur, ease: 'none' }, at);
    if (r) tl.fromTo(r, { xPercent: 0 },
      { xPercent: -2.5, duration: dur, ease: 'none' }, at);
  }
  /* clip-path 形状插值。
     两个坑都在这里踩过：
       1. GSAP 各版本对 clipPath 字符串补间的处理不一致，所以不直接补间它，
          改成补间一个 {t:0→1} 的代理对象，onUpdate 里自己算 8 个点；
       2. **from 必须是编译期常量，不能从元素当前状态读。**
          settle 会把时间轴来回扫；一旦回退越过一个已完成的补间，
          GSAP 会把它按 ratio 0 重渲——onUpdate 拿到的就是起点，
          形状会「弹回矩形」。写成常量后，形状是 t 的纯函数，
          停在任何一帧算出来都一样。
     相邻两段的 from 必须等于上一段的 to，这条由 Python 侧保证。 */
  function polyStr(pts) {
    return 'polygon(' + pts.map(function (p) {
      return p[0].toFixed(2) + '% ' + p[1].toFixed(2) + '%'; }).join(',') + ')';
  }
  function morph(el, from, to, at, dur, ease) {
    if (!el || !to || !from || from.length !== to.length) return;
    var st = { t: 0 };
    tl.to(st, { t: 1, duration: dur == null ? .7 : dur, ease: ease || 'power2.inOut',
      onUpdate: function () {
        el.style.clipPath = polyStr(from.map(function (p, i) {
          return [p[0] + (to[i][0] - p[0]) * st.t,
                  p[1] + (to[i][1] - p[1]) * st.t];
        }));
      } }, at);
  }
  set('eyebrow', v.eyebrow); set('h1', v.title); set('foot', v.foot);
  set('rfk1', v.oldLabel); set('rfq1', v.oldQ); set('rfa1', v.oldA);
  set('rfk2', v.newLabel); set('rfq2', v.newQ); set('rfa2', v.newA);
