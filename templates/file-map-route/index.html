<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "一条供应链的流转路径"}, {"id": "places", "type": "string", "label": "地点标签（逗号分隔，最多4个）", "default": "义乌仓,郑州中转,西安分拨,成都门店"}, {"id": "img1", "type": "image", "label": "地图图片", "default": "./placeholder-1.png"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #EAE2CF; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #26211A; }
      .f-vig{ position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 52%, rgba(64,48,26,.32) 100%); }
      .f-head{ position: absolute; left: 150px; top: 84px; display: flex; align-items: baseline; gap: 26px; }
      .f-hl{ display: inline-block; background: #F5D73F; font-size: 40px; font-weight: 900;
        padding: 2px 16px; transform: rotate(-1.5deg); }
      .f-head h1{ font-size: 50px; font-weight: 900; }
      .f-map{ position: absolute; left: 360px; top: 220px; width: 1200px; height: 760px;
        background: #FFFDF7; padding: 18px; box-shadow: 8px 10px 0 rgba(38,33,26,.18); }
      .f-map img{ width: 100%; height: 100%; object-fit: cover; display: block; filter: sepia(.18) contrast(.97); }
      .f-route{ position: absolute; left: 18px; top: 18px; right: 18px; bottom: 18px;
        width: calc(100% - 36px); height: calc(100% - 36px); pointer-events: none; overflow: visible; }
      .f-route path{ fill: none; stroke: #B03028; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 18 14; }
      .f-pin{ position: absolute; width: 40px; height: 40px; margin: -40px 0 0 -20px;
        background: #B03028; border: 4px solid #FFFDF7; border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg); box-shadow: 3px 4px 0 rgba(38,33,26,.3); z-index: 3; }
      .f-pin::after{ content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px;
        margin: -6px 0 0 -6px; background: #FFFDF7; border-radius: 50%; }
      .f-tag{ position: absolute; transform: translate(-50%, 0); background: #FFFDF7;
        border: 2px solid #26211A; padding: 4px 14px; font-size: 22px; font-weight: 800;
        white-space: nowrap; z-index: 4; box-shadow: 3px 3px 0 rgba(38,33,26,.2); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="f-vig"></div>
      <div class="f-head"><span class="f-hl" id="hl">ROUTE</span><h1 id="title"></h1></div>
      <div class="f-map" id="map">
        <img id="img1" alt="">
        <svg class="f-route" id="route" viewBox="0 0 1164 724" preserveAspectRatio="none"><path id="routePath" d=""/></svg>
      </div>

    </div>
    <script>
      const fallback = {"title": "一条供应链的流转路径", "places": "义乌仓,郑州中转,西安分拨,成都门店", "img1": "./placeholder-1.png", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      $("title").textContent = V.title;
      if (V.img1) $("img1").src = V.img1;
      const places = split(V.places).slice(0, 4);
      const POS = [[0.15, 0.68], [0.36, 0.28], [0.60, 0.56], [0.84, 0.24]];
      const MW = 1164, MH = 724;
      const map = $("map");
      const pts = places.map((_, i) => [POS[i][0] * MW, POS[i][1] * MH]);
      let dAttr = "";
      pts.forEach((p, i) => {
        if (i === 0) { dAttr = `M ${p[0]} ${p[1]}`; return; }
        const pr = pts[i - 1];
        dAttr += ` Q ${(pr[0] + p[0]) / 2} ${Math.max(pr[1], p[1]) + 54} ${p[0]} ${p[1]}`;
      });
      const route = $("routePath");
      route.setAttribute("d", dAttr);
      const rlen = route.getTotalLength();
      route.style.strokeDasharray = "18 14";
      route.style.strokeDashoffset = "0";
      route.style.opacity = "0";
      places.forEach((name, i) => {
        const pin = document.createElement("div");
        pin.className = "f-pin";
        pin.style.left = (18 + pts[i][0]) + "px";
        pin.style.top = (18 + pts[i][1]) + "px";
        map.appendChild(pin);
        const tag = document.createElement("span");
        tag.className = "f-tag";
        tag.style.left = (18 + pts[i][0]) + "px";
        tag.style.top = (18 + pts[i][1] + 14) + "px";
        tag.textContent = name;
        map.appendChild(tag);
      });
      tl.fromTo("#hl", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, 0.15);
      tl.fromTo("#title", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.35);
      tl.fromTo("#map", { scale: 0.85, opacity: 0, rotation: -2 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.55, ease: "power3.out" }, 0.5);
      map.querySelectorAll(".f-pin").forEach((pin, i) => {
        tl.fromTo(pin, { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2.6)" }, 0.95 + i * 0.28);
      });
      tl.to(route, { opacity: 1, duration: 0.05 }, 0.95);
      tl.fromTo(route, { strokeDashoffset: rlen }, { strokeDashoffset: 0, duration: places.length * 0.28, ease: "none" }, 0.95);
      map.querySelectorAll(".f-tag").forEach((tag, i) => {
        tl.fromTo(tag, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25 }, 1.15 + i * 0.28);
      });
      window.__timelines.main = tl;

    </script>
  </body>
</html>
