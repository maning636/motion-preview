<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"图表标题","default":"模型规模 vs 准确率"},{"id":"subtitle","type":"string","label":"副标题","default":"参数量与推理表现的相关性"},{"id":"xLabel","type":"string","label":"X 轴标签","default":"参数量（B）"},{"id":"yLabel","type":"string","label":"Y 轴标签","default":"准确率（%）"},{"id":"xValues","type":"string","label":"X 值（逗号分隔）","default":"1,3,7,13,20,35,70"},{"id":"yValues","type":"string","label":"Y 值（逗号分隔）","default":"62,71,78,83,86,89,92"},{"id":"labels","type":"string","label":"点标签（逗号分隔）","default":"A,B,C,D,E,F,G"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      body{ font-family: 'MEBHeiHeiTi', sans-serif; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e); color: var(--foreground, #f4efe7);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title-area{ position: relative; z-index: 2; margin-bottom: 48px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0 0 12px; font-size: 72px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .subtitle{ margin: 0; font-size: 32px; font-weight: 400; color: #6B7280; line-height: 1.4;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-area{ position: relative; width: 100%; height: 640px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-svg{ width: 100%; height: 100%; overflow: visible;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .grid-line{ stroke: #3a3029; stroke-width: 1;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .axis-text{ fill: #6B7280; font-size: 18px; font-family: 'MEBHeiHeiTi', sans-serif; font-weight: 500; text-anchor: middle; }
      .axis-text-y{ text-anchor: end; dominant-baseline: middle;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .axis-label{ fill: #f4efe7; font-size: 22px; font-family: 'MEBHeiHeiTi', sans-serif; font-weight: 600; }
      .scatter-point{ fill: var(--accent); stroke: #12100e; stroke-width: 3;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .point-label{ fill: #f4efe7; font-size: 16px; font-family: 'MEBHeiHeiTi', sans-serif; font-weight: 600; text-anchor: middle; opacity: 0; }
      .trend-line{ stroke: #6B7280; stroke-width: 2; stroke-dasharray: 8 6; opacity: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title-area">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <svg class="chart-svg" id="chart-svg" viewBox="0 0 1696 640" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "模型规模 vs 准确率", subtitle: "参数量与推理表现的相关性", xLabel: "参数量（B）", yLabel: "准确率（%）", xValues: "1,3,7,13,20,35,70", yValues: "62,71,78,83,86,89,92", labels: "A,B,C,D,E,F,G", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      document.documentElement.style.setProperty("--accent", v.accent);
      document.getElementById("root").style.backgroundColor = v.background;
      document.getElementById("root").style.color = v.foreground;
      for (const [id, value] of [["title", v.title], ["subtitle", v.subtitle]]) document.getElementById(id).textContent = value;

      const xs = v.xValues.split(",").map(Number);
      const ys = v.yValues.split(",").map(Number);
      const labels = (v.labels || "").split(",").filter(Boolean);
      const points = xs.map((x, i) => ({ x, y: ys[i] || 0, label: labels[i] || String(i + 1) }));

      const svg = document.getElementById("chart-svg");
      const chartW = 1696, chartH = 640, marginLeft = 100, marginRight = 60, marginTop = 40, marginBottom = 80;
      const plotW = chartW - marginLeft - marginRight, plotH = chartH - marginTop - marginBottom;
      const originX = marginLeft, originY = marginTop + plotH;
      const xMax = Math.max(...xs) * 1.1, yMax = Math.max(...ys) * 1.1;

      for (let i = 0; i <= 5; i++) {
        const xv = (xMax / 5) * i, xi = originX + (xv / xMax) * plotW;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", xi); line.setAttribute("x2", xi); line.setAttribute("y1", originY); line.setAttribute("y2", marginTop);
        line.setAttribute("class", "grid-line grid-v"); line.setAttribute("opacity", "0"); svg.appendChild(line);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", xi); text.setAttribute("y", originY + 32); text.setAttribute("class", "axis-text"); text.textContent = Math.round(xv); text.setAttribute("opacity", "0"); text.classList.add("x-label"); svg.appendChild(text);
      }
      for (let i = 0; i <= 5; i++) {
        const yv = (yMax / 5) * i, yi = originY - (yv / yMax) * plotH;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", originX); line.setAttribute("x2", originX + plotW); line.setAttribute("y1", yi); line.setAttribute("y2", yi);
        line.setAttribute("class", "grid-line grid-h"); line.setAttribute("opacity", "0"); svg.appendChild(line);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", originX - 18); text.setAttribute("y", yi); text.setAttribute("class", "axis-text axis-text-y"); text.textContent = Math.round(yv); text.setAttribute("opacity", "0"); text.classList.add("y-label"); svg.appendChild(text);
      }

      const xAxisLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
      xAxisLabel.setAttribute("x", originX + plotW / 2); xAxisLabel.setAttribute("y", originY + 68); xAxisLabel.setAttribute("class", "axis-label"); xAxisLabel.setAttribute("text-anchor", "middle"); xAxisLabel.textContent = v.xLabel; xAxisLabel.setAttribute("opacity", "0"); svg.appendChild(xAxisLabel);
      const yAxisLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
      yAxisLabel.setAttribute("x", 36); yAxisLabel.setAttribute("y", marginTop + plotH / 2); yAxisLabel.setAttribute("class", "axis-label"); yAxisLabel.setAttribute("text-anchor", "middle"); yAxisLabel.setAttribute("transform", `rotate(-90, 36, ${marginTop + plotH / 2})`); yAxisLabel.textContent = v.yLabel; yAxisLabel.setAttribute("opacity", "0"); svg.appendChild(yAxisLabel);

      const pointElems = [];
      points.forEach((p, i) => {
        const cx = originX + (p.x / xMax) * plotW, cy = originY - (p.y / yMax) * plotH;
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", cx); circle.setAttribute("cy", cy); circle.setAttribute("r", 0); circle.setAttribute("class", "scatter-point"); svg.appendChild(circle);
        const lab = document.createElementNS("http://www.w3.org/2000/svg", "text");
        lab.setAttribute("x", cx); lab.setAttribute("y", cy - 22); lab.setAttribute("class", "point-label"); lab.textContent = p.label; svg.appendChild(lab);
        pointElems.push({ circle, label: lab, r: 14 + (p.y / yMax) * 10 });
      });

      const n = points.length;
      let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
      points.forEach(p => { sumX += p.x; sumY += p.y; sumXY += p.x * p.y; sumXX += p.x * p.x; });
      const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
      const intercept = (sumY - slope * sumX) / n;
      const x1 = 0, y1 = slope * x1 + intercept, x2 = xMax, y2 = slope * x2 + intercept;
      const trendLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
      trendLine.setAttribute("x1", originX + (x1 / xMax) * plotW); trendLine.setAttribute("y1", originY - (y1 / yMax) * plotH);
      trendLine.setAttribute("x2", originX + (x2 / xMax) * plotW); trendLine.setAttribute("y2", originY - (y2 / yMax) * plotH);
      trendLine.setAttribute("class", "trend-line"); svg.appendChild(trendLine);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo(".grid-v", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.04, ease: "sine.out" }, 0.4);
      tl.fromTo(".grid-h", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.04, ease: "sine.out" }, 0.5);
      tl.fromTo(".x-label", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.03, ease: "power2.out" }, 0.6);
      tl.fromTo(".y-label", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.03, ease: "power2.out" }, 0.6);
      tl.fromTo(".axis-label", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.8);
      pointElems.forEach((pe, i) => {
        tl.to(pe.circle, { attr: { r: pe.r }, duration: 0.6, ease: "elastic.out(1, 0.5)" }, 1.0 + i * 0.1);
        tl.fromTo(pe.label, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.4 + i * 0.1);
      });
      tl.fromTo(".trend-line", { opacity: 0, drawSVG: 0 }, { opacity: 0.6, duration: 0.8, ease: "power2.out" }, 2.0);
      tl.to(".scene", { opacity: 0, scale: 1.01, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
