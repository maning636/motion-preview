<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"图表标题","default":"用户活跃热力图"},{"id":"subtitle","type":"string","label":"副标题","default":"一周各时段访问强度分布"},{"id":"rows","type":"string","label":"行标签（逗号分隔）","default":"周一,周二,周三,周四,周五,周六,周日"},{"id":"cols","type":"string","label":"列标签（逗号分隔）","default":"0–4,4–8,8–12,12–16,16–20,20–24"},{"id":"values","type":"string","label":"数值矩阵（分号分隔行，逗号分隔列）","default":"12,8,45,78,92,56;10,15,60,85,88,50;18,22,70,90,95,65;14,18,55,80,85,48;20,25,75,95,100,70;35,40,85,90,80,60;30,35,80,85,75,55"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      body{ font-family: 'MEBHeiHeiTi', sans-serif; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e); color: var(--foreground, #f4efe7);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title-area{ position: relative; z-index: 2; margin-bottom: 48px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0 0 12px; font-size: 72px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .subtitle{ margin: 0; font-size: 32px; font-weight: 400; color: #6B7280; line-height: 1.4;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-area{ position: relative; width: 100%; height: 640px; display: flex; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .heatmap{ display: grid; gap: 6px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .cell{ border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; opacity: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .row-label, .col-label{ color: #6B7280; font-size: 18px; font-weight: 500;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .row-label{ display: flex; align-items: center; justify-content: flex-end; padding-right: 16px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .col-label{ display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title-area">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <div class="heatmap" id="heatmap"></div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "用户活跃热力图", subtitle: "一周各时段访问强度分布", rows: "周一,周二,周三,周四,周五,周六,周日", cols: "0–4,4–8,8–12,12–16,16–20,20–24", values: "12,8,45,78,92,56;10,15,60,85,88,50;18,22,70,90,95,65;14,18,55,80,85,48;20,25,75,95,100,70;35,40,85,90,80,60;30,35,80,85,75,55", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#0E0E0E");
      document.documentElement.style.setProperty("--accent", v.accent);
      document.getElementById("root").style.backgroundColor = v.background;
      document.getElementById("root").style.color = v.foreground;
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;

      const rows = v.rows.split(",");
      const cols = v.cols.split(",");
      const matrix = v.values.split(";").map(row => row.split(",").map(Number));
      const flat = matrix.flat();
      const maxVal = Math.max(...flat);

      const heatmap = document.getElementById("heatmap");
      heatmap.style.gridTemplateColumns = `80px repeat(${cols.length}, 1fr)`;
      heatmap.style.gridTemplateRows = `50px repeat(${rows.length}, 1fr)`;
      heatmap.style.width = "1480px";
      heatmap.style.height = "600px";

      const corner = document.createElement("div"); heatmap.appendChild(corner);
      cols.forEach(c => { const cl = document.createElement("div"); cl.className = "col-label"; cl.textContent = c; heatmap.appendChild(cl); });

      const cells = [];
      rows.forEach((r, i) => {
        const rl = document.createElement("div"); rl.className = "row-label"; rl.textContent = r; heatmap.appendChild(rl);
        matrix[i].forEach((val, j) => {
          const cell = document.createElement("div"); cell.className = "cell";
          const intensity = val / maxVal;
          const rCol = parseInt(v.accent.slice(1, 3), 16), gCol = parseInt(v.accent.slice(3, 5), 16), bCol = parseInt(v.accent.slice(5, 7), 16);
          const bg = `rgba(${rCol}, ${gCol}, ${bCol}, ${0.08 + intensity * 0.92})`;
          cell.style.backgroundColor = bg;
          cell.textContent = Math.round(val);
          cell.style.color = intensity > 0.5 ? "#12100e" : "#f4efe7";
          heatmap.appendChild(cell);
          cells.push(cell);
        });
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo(".row-label", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.04, ease: "power2.out" }, 0.5);
      tl.fromTo(".col-label", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.04, ease: "power2.out" }, 0.6);
      cells.forEach((cell, i) => {
        tl.fromTo(cell, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.5)" }, 0.9 + i * 0.02);
      });
      tl.to(".scene", { opacity: 0, scale: 1.01, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
