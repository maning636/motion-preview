<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "wordmark", "type": "string", "label": "字标", "default": "MOTIONLIB"}, {"id": "kicker", "type": "string", "label": "副标", "default": "镜头动效素材库"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#lk{ position:absolute; inset:0; }
.wm{ position:absolute; left:0; right:0; top:430px; text-align:center; font-size:132px; letter-spacing:10px; color:var(--fg); }
.wm span{ display:inline-block; opacity:0; transform-origin:center bottom; }
.glint{ position:absolute; top:590px; left:760px; width:80px; height:6px; background:var(--accent); opacity:0; border-radius:3px; }
.kk{ position:absolute; left:0; right:0; top:640px; text-align:center; font-size:30px; letter-spacing:8px; color:rgba(255,255,255,.55); }
.kk .kt{ display:inline-block; clip-path:inset(0 100% 0 0); }
.kk .kc{ display:inline-block; width:14px; height:26px; background:var(--accent); vertical-align:-3px; margin-left:6px; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
<div id="lk">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0">
  <line id="cv" x1="960" y1="290" x2="960" y2="410" stroke="#F4F4F2" stroke-width="3" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
  <line id="ch2" x1="830" y1="350" x2="1090" y2="350" stroke="#F4F4F2" stroke-width="3" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
</svg>
<div class="wm" id="wm"></div><div class="glint" id="gl"></div>
<div class="kk"><span class="kt" id="kt"></span><span class="kc" id="kc"></span></div>
</div>
    </div>
    <script>
      const FB = {"wordmark": "MOTIONLIB", "kicker": "镜头动效素材库", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

// 字标逐字 letterpress：scale 1.6→1 + blur 6→0，delay=10+i·3、12f
const wm=$('#wm');
(v.wordmark||'').split('').forEach(ch=>{
  const s=document.createElement('span'); s.textContent=ch; wm.appendChild(s);
});
const n=wm.children.length;
for(let i=0;i<n;i++){
  tl.fromTo(wm.children[i],{opacity:0,scale:1.6,filter:'blur(6px)'},
    {opacity:1,scale:1,filter:'blur(0px)',duration:F(12),ease:'power2.out'},F(10+i*3));
}
// 十字准星：先竖后横，画完淡出
tl.to('#cv',{attr:{'stroke-dashoffset':0},duration:F(9),ease:'power1.inOut'},0);
tl.to('#ch2',{attr:{'stroke-dashoffset':0},duration:F(10),ease:'power1.inOut'},F(8));
tl.to(['#cv','#ch2'],{opacity:0,duration:F(10)},F(24));
// 字底 glint 短划闪过
tl.fromTo('#gl',{opacity:0,x:0},{opacity:1,duration:F(4)},F(30));
tl.to('#gl',{x:340,duration:F(10),ease:'power1.inOut'},F(30));
tl.to('#gl',{opacity:0,duration:F(4)},F(40));
// kicker 打字机：0.7f/字符 steps 逐字，块光标 2f 周期闪
const kt=$('#kt'); kt.textContent=v.kicker||'';
const nc=(v.kicker||'').length;
tl.fromTo(kt,{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:F(Math.max(1,Math.round(nc*0.7))),ease:'steps('+nc+')'},F(28));
for(let f=28;f<76;f+=4){ tl.set('#kc',{opacity:0},F(f)); tl.set('#kc',{opacity:1},F(f+2)); }
// lockup 静止满 1 秒（46→76f 硬底线），7f 上浮缩小淡出交棒
tl.to('#lk',{y:-40,scale:.88,opacity:0,transformOrigin:'960px 500px',duration:F(7),ease:'power2.in'},F(76));
tl.to({},{duration:F(7)},F(83));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
