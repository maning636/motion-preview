<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"leftLabel","type":"string","label":"左侧标签","default":"上海 SHANGHAI"},{"id":"leftValue","type":"number","label":"左侧数值","default":92},{"id":"leftUnit","type":"string","label":"左侧单位","default":"%"},{"id":"rightLabel","type":"string","label":"右侧标签","default":"亚马逊 AMAZON"},{"id":"rightValue","type":"number","label":"右侧数值","default":90},{"id":"rightUnit","type":"string","label":"右侧单位","default":"%"},{"id":"operator","type":"enum","label":"比较符号","default":">","options":[{"value":">","label":"大于"},{"value":"=","label":"等于"},{"value":"<","label":"小于"}]},{"id":"verdict","type":"string","label":"结论","default":"上海湿度更高"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="5" data-track-index="1">

        <div class="gridbg"></div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:100px;">
          <div class="duel" id="sideL" style="text-align:center;width:520px;">
            <span class="chip" id="leftLabel"></span>
            <div class="num dval" style="margin-top:26px;font-size:210px;line-height:1;color:#F5F5F4;"><span class="dv">0</span><span class="du" style="font-size:64px;"></span></div>
            <div class="glowline" style="margin:26px auto 0;width:0;height:5px;background:var(--accent,#00FF00);"></div>
          </div>
          <div id="badge" class="num" style="width:130px;height:130px;border-radius:50%;border:3px solid var(--accent,#00FF00);display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--accent,#00FF00);transform:scale(0);"></div>
          <div class="duel" id="sideR" style="text-align:center;width:520px;">
            <span class="chip" id="rightLabel"></span>
            <div class="num dval" style="margin-top:26px;font-size:210px;line-height:1;color:#F5F5F4;"><span class="dv">0</span><span class="du" style="font-size:64px;"></span></div>
            <div class="glowline" style="margin:26px auto 0;width:0;height:5px;background:var(--accent,#00FF00);"></div>
          </div>
        </div>

      </section>
    </div>
    <script>
      const fallback = {"leftLabel": "上海 SHANGHAI", "leftValue": 92, "leftUnit": "%", "rightLabel": "亚马逊 AMAZON", "rightValue": 90, "rightUnit": "%", "operator": ">", "verdict": "上海湿度更高", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 5;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("leftLabel").textContent = v.leftLabel; $("rightLabel").textContent = v.rightLabel;
      $("badge").textContent = v.operator || "VS";
      document.querySelector("#sideL .du").textContent = v.leftUnit || "";
      document.querySelector("#sideR .du").textContent = v.rightUnit || "";
      tl.fromTo("#sideL", { x: -160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#sideR", { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.2);
      countTo(document.querySelector("#sideL .dv"), v.leftValue, 0.6, 1.3);
      countTo(document.querySelector("#sideR .dv"), v.rightValue, 0.6, 1.3);
      tl.to("#badge", { scale: 1, duration: 0.5, ease: "back.out(2.5)" }, 1.4);
      const leftWins = Number(v.leftValue) >= Number(v.rightValue);
      tl.to(leftWins ? "#sideL .glowline" : "#sideR .glowline", { width: 380, duration: 0.6, ease: "power3.inOut" }, 2.4);
      tl.to(".scene", { opacity: 0, duration: 0.5 }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
