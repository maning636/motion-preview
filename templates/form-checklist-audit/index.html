<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "清单标题", "default": "发布前合规自查清单"}, {"id": "items", "type": "string", "label": "检查项（逗号分隔，末项为问题项）", "default": "标题无违禁词,封面版权已确认,数据来源已标注,定时发布时间正确,备用链接未替换"}, {"id": "note", "type": "string", "label": "问题项批注", "default": "此项必须今晚改完"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #F1EDE0; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #1D1D20; }
      .paper{ position: absolute; left: 380px; top: 90px; width: 1160px; height: 900px;
        background: #FFFDF7; border: 2px solid #1D1D20; padding: 50px 72px;
        box-shadow: 10px 10px 0 rgba(29,29,32,.10); }
      .p-title{ font-size: 48px; font-weight: 900; letter-spacing: .05em; }
      .p-sub{ margin-top: 10px; font-size: 22px; color: #6B6560; letter-spacing: .1em; }
      .p-list{ margin-top: 36px; }
      .p-item{ display: flex; align-items: center; gap: 24px; padding: 17px 4px;
        border-bottom: 1.5px solid rgba(29,29,32,.18); font-size: 32px; font-weight: 700; }
      .p-box{ flex: none; width: 44px; height: 44px; border: 3px solid #1D1D20; border-radius: 6px;
        display: flex; align-items: center; justify-content: center; }
      .p-box svg{ width: 34px; height: 34px; overflow: visible; }
      .p-box path{ fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .p-box .ck{ stroke: #1E7A46; }
      .p-box .xx{ stroke: #C8392E; }
      .p-item.bad .t{ color: #C8392E; }
      .p-note{ margin-top: 30px; display: flex; align-items: center; gap: 14px; color: #C8392E;
        font-size: 30px; font-weight: 800; font-style: italic; }
      .p-note .arr{ font-size: 42px; font-style: normal; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="paper" id="paper">
        <h1 class="p-title" id="title"></h1>
        <div class="p-sub mono" id="sub">AUDIT CHECKLIST · 审计底稿 №2026-0813</div>
        <div class="p-list" id="list"></div>
        <div class="p-note" id="noteWrap"><span class="arr">↩</span><span id="note"></span></div>
      </div>

    </div>
    <script>
      const fallback = {"title": "发布前合规自查清单", "items": "标题无违禁词,封面版权已确认,数据来源已标注,定时发布时间正确,备用链接未替换", "note": "此项必须今晚改完", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      $("title").textContent = V.title;
      $("note").textContent = V.note;
      const items = split(V.items);
      const list = $("list");
      items.forEach((it, i) => {
        const bad = i === items.length - 1;
        const d = document.createElement("div");
        d.className = "p-item" + (bad ? " bad" : "");
        const mark = bad
          ? `<path class="xx" d="M8 8 L26 26"/><path class="xx" d="M26 8 L8 26"/>`
          : `<path class="ck" d="M5 18 L14 27 L30 7"/>`;
        d.innerHTML = `<span class="p-box"><svg viewBox="0 0 34 34">${mark}</svg></span><span class="t"></span>`;
        d.querySelector(".t").textContent = it;
        list.appendChild(d);
      });
      const paths = list.querySelectorAll(".p-box path");
      paths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      tl.fromTo("#paper", { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#title", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power3.out" }, 0.2);
      tl.fromTo("#sub", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.5);
      tl.fromTo(".p-item", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.26, stagger: 0.16, ease: "power2.out" }, 0.65);
      paths.forEach((p, i) => {
        const grp = Math.floor(i / (paths.length > items.length ? 2 : 1));
        tl.to(p, { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, 0.85 + grp * 0.16 + (i % 2) * 0.08);
      });
      const tDone = 0.85 + items.length * 0.16 + 0.2;
      tl.fromTo("#noteWrap", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, tDone);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
