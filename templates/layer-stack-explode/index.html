<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "五层结构，一次看清"}, {"id": "layers", "type": "string", "label": "层名（逗号分隔，自下而上）", "default": "背景 BG,封面 COVER,碟片 DISC,歌词 LYRICS,控件 CONTROLS"}, {"id": "img1", "type": "image", "label": "中间层嵌图", "default": "./placeholder-1.png"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #0E100F; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #EDF2EE; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      .corner{ position: absolute; width: 34px; height: 34px; border: 3px solid var(--ac, #00FF00); }
      .c-tl{ left: -3px; top: -3px; border-right: none; border-bottom: none; }
      .c-tr{ right: -3px; top: -3px; border-left: none; border-bottom: none; }
      .c-bl{ left: -3px; bottom: -3px; border-right: none; border-top: none; }
      .c-br{ right: -3px; bottom: -3px; border-left: none; border-top: none; }
      .tc{ position: absolute; right: 90px; top: 84px; text-align: right; font-family: 'IBM Plex Mono', monospace;
        font-size: 20px; letter-spacing: .22em; color: rgba(237,242,238,.5); line-height: 1.9; z-index: 6; }
      .lse-head{ position: absolute; left: 90px; top: 76px; z-index: 6; }
      .lse-kicker{ font-size: 20px; letter-spacing: .3em; color: var(--ac); }
      .lse-title{ margin-top: 14px; font-size: 62px; font-weight: 900; }
      .lse-stage{ position: absolute; left: 60px; top: 200px; width: 1150px; height: 800px;
        perspective: 1700px; z-index: 4; }
      .lse-tilt{ position: absolute; left: 50%; top: 50%; width: 0; height: 0;
        transform-style: preserve-3d; transform: rotateX(56deg) rotateZ(-34deg); }
      .lse-card{ position: absolute; left: -340px; top: -210px; width: 680px; height: 420px;
        background: rgba(18,22,19,.94); border: 1.5px solid color-mix(in srgb, var(--accent) 38%, transparent); border-radius: 10px;
        overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
      .lse-card img{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .85; }
      .lse-card .wm{ position: absolute; right: 22px; bottom: 4px; font-size: 130px; font-weight: 900;
        color: rgba(237,242,238,.07); font-family: 'MiSans SemiBold', sans-serif; }
      .lse-card .nm{ position: absolute; left: 26px; top: 20px; font-size: 26px; letter-spacing: .18em;
        color: rgba(237,242,238,.85); background: rgba(10,12,10,.72); padding: 6px 16px; border-radius: 6px; }
      .lse-labels{ position: absolute; right: 110px; top: 330px; width: 420px; z-index: 5; }
      .lse-lab{ display: flex; align-items: baseline; gap: 18px; padding: 15px 0;
        border-top: 1px solid rgba(237,242,238,.12); font-size: 26px; }
      .lse-lab .n{ font-size: 20px; color: var(--ac); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="lse-head"><div class="lse-kicker mono">STRUCTURE · LAYERS</div><div class="lse-title" id="title"></div></div>
      <div class="tc mono">00:13 → 00:18<br>堆叠 → 爆炸分解</div>
      <div class="lse-stage" id="stage"><div class="lse-tilt" id="tilt"></div></div>
      <div class="lse-labels" id="labels"></div>

    </div>
    <script>
      const fallback = {"title": "五层结构，一次看清", "layers": "背景 BG,封面 COVER,碟片 DISC,歌词 LYRICS,控件 CONTROLS", "img1": "./placeholder-1.png", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("title").textContent = V.title;
      const layers = split(V.layers);
      const n = Math.max(layers.length, 1), mid = Math.floor(n / 2);
      const tilt = $("tilt"), cards = [];
      layers.forEach((nm, i) => {
        const c = document.createElement("div");
        c.className = "lse-card";
        c.innerHTML = (i === mid ? '<img id="lseImg" alt="">' : "") +
          '<span class="nm mono">LAYER ' + String(i + 1).padStart(2, "0") + '</span>' +
          '<span class="wm">' + String(i + 1).padStart(2, "0") + '</span>';
        c._name = nm;
        tilt.appendChild(c);
        cards.push(c);
        gsap.set(c, { z: i * 9 });
      });
      const img = document.getElementById("lseImg");
      if (img && V.img1) img.src = V.img1;
      const labEl = $("labels");
      for (let i = n - 1; i >= 0; i--) {
        const d = document.createElement("div");
        d.className = "lse-lab";
        d.innerHTML = '<span class="n mono">L' + String(i + 1).padStart(2, "0") + '</span><span></span>';
        d.querySelector("span:last-child").textContent = layers[i];
        labEl.appendChild(d);
      }
      tl.fromTo([".lse-head", ".tc"], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.1 }, 0.1);
      tl.fromTo("#stage", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      cards.forEach((c, i) => {
        tl.to(c, { z: i * 66, duration: 0.85, ease: "expo.out" }, 0.75 + i * 0.12);
      });
      tl.fromTo(".lse-lab", { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.1, ease: "power3.out" }, 1.35);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
