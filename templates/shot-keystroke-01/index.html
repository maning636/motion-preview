<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "query", "type": "string", "label": "搜索词", "default": "nano-lab"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#stage{ position:absolute; inset:0; will-change:transform; }
#search{ position:absolute; left:560px; top:90px; width:800px; height:84px; border-radius:42px;
  background:#161A24; border:1px solid color-mix(in srgb, var(--fg) 16%, transparent);
  display:flex; align-items:center; padding:0 36px; gap:18px; }
#mag{ width:30px; height:30px; border:4px solid color-mix(in srgb, var(--fg) 50%, transparent);
  border-radius:50%; position:relative; flex:none; }
#mag::after{ content:''; position:absolute; right:-12px; bottom:-8px; width:14px; height:4px;
  background:color-mix(in srgb, var(--fg) 50%, transparent); transform:rotate(45deg); }
#q{ font-size:30px; font-family:'MiSans SemiBold',sans-serif; }
#cur{ width:3px; height:34px; background:var(--accent); }
#grid{ position:absolute; left:360px; top:240px; display:flex; flex-wrap:wrap; gap:20px; width:1300px; }
.gc{ width:240px; height:140px; border-radius:14px; background:#141824;
  border:1px solid color-mix(in srgb, var(--fg) 10%, transparent); padding:20px; will-change:transform,opacity; }
.gc .t{ height:14px; border-radius:7px; background:color-mix(in srgb, var(--fg) 22%, transparent); width:65%; }
.gc .s{ margin-top:16px; height:10px; border-radius:5px; background:color-mix(in srgb, var(--fg) 10%, transparent); width:45%; }
#tgt{ border:2px solid var(--accent); background:color-mix(in srgb, var(--accent) 10%, #141824); }
#tgt .t{ background:color-mix(in srgb, var(--accent) 60%, transparent); }
#tgtName{ font-size:22px; color:var(--accent); font-family:'MiSans SemiBold',sans-serif; margin-bottom:12px; }
.rip{ position:absolute; border:3px solid var(--accent); border-radius:50%; opacity:0;
  pointer-events:none; box-shadow:0 0 40px color-mix(in srgb, var(--accent) 60%, transparent); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.0" data-width="1920" data-height="1080">

<div id="stage">
  <div id="search"><div id="mag"></div><span id="q"></span><div id="cur"></div></div>
  <div id="grid"><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc" id="tgt"><div id="tgtName">nano-lab</div><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div><div class="gc"><div class="t"></div><div class="s"></div></div></div>
  <div class="rip" id="rip1"></div><div class="rip" id="rip2"></div>
</div>

    </div>
    <script>
      const FB = {"query": "nano-lab", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

const Q=(v.query||'nano-lab');
const qEl=$('#q'), cur=$('#cur'), stage=$('#stage'), tgt=$('#tgt');
const TYPE0=20, FILTER0=55;
// 打字 3f/字符（unhurried 定稿值）+ 打完光标常亮改 8f 闪烁
const sim={f:0};
function paint(){
  const f=sim.f;
  const n=Math.max(0,Math.min(Q.length,Math.floor((f-TYPE0)/3)));
  qEl.textContent=Q.slice(0,n);
  if(f<TYPE0+Q.length*3){cur.style.opacity=1;}
  else{cur.style.opacity=(Math.floor(f/8)%2===0)?1:0;}
}
paint();
tl.to(sim,{f:150,duration:F(150),ease:'none',onUpdate:paint},0);
// 呼吸 ~11f 后过滤：非目标卡按阅读序 0.4f 错峰淡出下沉
const others=Array.from(document.querySelectorAll('.gc:not(#tgt)'));
others.forEach((c,k)=>{
  tl.to(c,{opacity:0,y:8,duration:F(5),ease:'none'},F(FILTER0)+k*0.4/30);
});
// 目标卡滑到首行槽位（bezier(0.35,0,0.2,1)），途中 sin 浮起
const SLIDE0=FILTER0+15; // f70
function cb(x1,y1,x2,y2){return function(x){
  let t=x;
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx;
  for(let i=0;i<5;i++){
    const f=((ax*t+bx)*t+cx)*t-x, d=(3*ax*t+2*bx)*t+cx;
    if(Math.abs(d)<1e-4)break; t-=f/d;
  }
  t=Math.max(0,Math.min(1,t));
  const cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  return ((ay*t+by)*t+cy)*t;
};}
const slide=cb(0.35,0,0.2,1);
// 目标卡当前格位（i=12: 第3行第3列, 左 880/上 560）→ 首行首列（左 360/上 240）
const dx=-520, dy=-320;
const mv={f:0};
tl.to(mv,{f:10,duration:F(10),ease:'none',onUpdate:()=>{
  const p=slide(Math.min(1,mv.f/10));
  const lift=Math.sin(p*Math.PI);
  tgt.style.transform='translate('+(dx*p).toFixed(1)+'px,'+(dy*p-18*lift).toFixed(1)+'px) scale('+(1+0.02*lift).toFixed(4)+')';
  tgt.style.boxShadow='0 '+(8+22*lift).toFixed(1)+'px '+(16+34*lift).toFixed(1)+'px rgba(0,0,0,.45)';
}},F(SLIDE0));
// 双圈 ripple 点击确认（起点差 3f、半径 14→54/78）
const CX=480, CY=310; // 首行首列卡中心（滑位后: 360+120, 240+70）
[['#rip1',54,0],['#rip2',78,3]].forEach(([id,R,dl])=>{
  const rp=$(id);
  rp.style.left=(CX-R)+'px'; rp.style.top=(CY-R)+'px';
  rp.style.width=(2*R)+'px'; rp.style.height=(2*R)+'px';
  const rr={f:0};
  tl.to(rr,{f:10,duration:F(10),ease:'none',onUpdate:()=>{
    const p=rr.f/10, e=1-Math.pow(1-p,3);
    rp.style.opacity=(p<0.15?p/0.15:1-(p-0.15)/0.85).toFixed(3);
    rp.style.transform='scale('+(14/R+(1-14/R)*e).toFixed(4)+')';
  }},F(SLIDE0+12+dl));
});
// 点击后相机 16f 推进 zoom 2.2（origin 锁目标卡中心）
tl.set(cur,{opacity:0},F(SLIDE0+27));
tl.to(stage,{scale:2.2,transformOrigin:CX+'px '+CY+'px',duration:F(16),ease:'power2.inOut'},F(SLIDE0+25));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
