<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"bg","type":"image","label":"起始画面","default":"./placeholder-1.png"},{"id":"fg","type":"image","label":"结束画面","default":"./placeholder-2.png"},{"id":"duration","type":"number","label":"总时长","default":6}]'>
<head><meta charset="UTF-8"><meta name="viewport" content="width=1920, height=1080"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1920px;height:1080px;overflow:hidden;background: var(--background, #000);}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background: var(--background, #000);font-family:'IBM Plex Mono',monospace;}
.bg-layer,#L0{position:absolute;inset:0;overflow:hidden;}
.fg-layer,#L1{position:absolute;inset:0;overflow:hidden;}
.bg-layer img,#L1 img{width:100%;height:100%;object-fit:cover;display:block;}
.tag{position:absolute;left:48px;top:40px;font-size:18px;letter-spacing:.4em;color:rgba(255,255,255,.78);z-index:20;}
.tag-no{position:absolute;right:48px;top:40px;font-size:18px;letter-spacing:.3em;color:rgba(255,255,255,.62);z-index:20;}
.bar{position:absolute;left:48px;bottom:40px;width:240px;height:3px;background:rgba(255,255,255,.32);z-index:20;}
.bar-fill{position:absolute;left:0;top:0;height:100%;background:#FF3B3B;width:0;}
.overlay{position:absolute;inset:0;pointer-events:none;z-index:5;}
.vig{position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35) 100%);}
.scan{position:absolute;left:0;right:0;top:-6%;height:120px;z-index:7;pointer-events:none;opacity:0;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,.22) 45%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.22) 55%,transparent);}
.grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;z-index:8;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 1px,transparent 1px 3px);}
.leak{position:absolute;inset:0;pointer-events:none;z-index:9;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(ellipse 70% 45% at 50% 50%,rgba(255,200,80,.55),rgba(255,120,40,.2) 55%,transparent 75%);}
.split-a,.split-b,.split-c{position:absolute;inset:0;z-index:10;pointer-events:none;background-color:transparent;}
.frame-a{position:absolute;left:40px;top:40px;right:40px;bottom:40px;border:2px solid rgba(255,255,255,.35);z-index:15;pointer-events:none;}
.label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:16;
  font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:.5em;color:rgba(255,255,255,.55);
  padding:8px 14px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
<div class="bg-layer" id="L0"><img src="./placeholder-1.png" alt=""></div>
<div class="fg-layer" id="L1"><img src="./placeholder-2.png" alt=""></div>
<div class="vig"></div>
<div class="scan" id="scan"></div>
<div class="grain"></div>
<div class="leak" id="leak"></div>
<div class="tag">TRANSITION-SCAN-LINE</div>
<div class="tag-no" id="tn">B38 / 15</div>
<div class="bar"><div class="bar-fill" id="bf"></div></div>
<div class="frame-a"></div>
<div class="label" id="lbl">SCAN LINE</div>
</div>
<script>
const $=id=>document.getElementById(id);
const tl=gsap.timeline({paused:true});
// apply JS-injected paths for preview
try{const V=window.__hyperframes&&window.__hyperframes.getVariables&&window.__hyperframes.getVariables();if(V){$("L0 img").src=V.bg||V.bg_path||"./placeholder-1.png";$("L1 img").src=V.fg||V.fg_path||"./placeholder-2.png";}}catch(e){}
window.__timelines=window.__timelines||{};
gsap.set($("L1"),{opacity:0});
gsap.set($("scan"),{opacity:.9,top:"-120px"});
tl.to($("scan"),{top:"1080px",duration:3.2,ease:"power1.inOut"},0.4);
tl.to($("L1"),{opacity:1,duration:3.2,ease:"none"},0.4);
tl.to($("L0"),{opacity:0,duration:3.2,ease:"none"},0.4);
tl.to($("scan"),{opacity:0,duration:.4},3.6);
tl.to($("bf"),{width:"100%",duration:6,ease:"none"});
tl.pause();
window.__timelines.main=tl;
</script>
</body></html>
