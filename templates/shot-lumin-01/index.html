<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}, {"id": "img1", "type": "image", "label": "页面图（可选，填了就把图贴进霓虹框）", "default": ""}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

.tube{ position:absolute; border:3px solid var(--accent); border-radius:14px;
  box-shadow:0 0 24px var(--accent), inset 0 0 18px color-mix(in srgb, var(--accent) 40%, transparent); opacity:.5; }
#tube1{ left:120px; top:120px; width:420px; height:240px; }
#tube2{ left:1380px; top:160px; width:380px; height:560px; }
#tube3{ left:200px; top:760px; width:520px; height:200px; }
#frameSvg{ position:absolute; left:230px; top:130px; width:1460px; height:820px; overflow:visible; }
.fpath{ fill:none; stroke:var(--accent); stroke-width:5; stroke-linejoin:round;
  filter:drop-shadow(0 0 14px var(--accent)); }
.fhead{ fill:#fff; filter:drop-shadow(0 0 10px var(--accent)); }
#panel{ position:absolute; left:230px; top:130px; width:1460px; height:820px; border-radius:18px;
  background:#101219; overflow:hidden; }
#dim{ position:absolute; inset:0; background:#05060a; opacity:1; pointer-events:none; z-index:5; }
#sideCol{ position:absolute; left:0; top:0; width:320px; height:100%; padding:44px 34px;
  border-right:1px solid color-mix(in srgb, var(--fg) 12%, transparent); }
.blk{ position:relative; will-change:transform; }
.sh{ position:absolute; left:8%; right:8%; bottom:-14px; height:18px; border-radius:50%;
  background:#000; filter:blur(14px); opacity:0; }
.row{ height:52px; border-radius:10px; background:color-mix(in srgb, var(--fg) 10%, transparent); margin-bottom:26px; }
#main{ position:absolute; left:360px; top:0; right:0; padding:56px 54px; }
.hero{ height:200px; border-radius:14px; background:color-mix(in srgb, var(--accent) 16%, transparent);
  border:1px solid color-mix(in srgb, var(--accent) 45%, transparent); margin-bottom:34px; }
.cardRow{ display:flex; gap:30px; }
.mcard{ flex:1; height:300px; border-radius:14px; background:color-mix(in srgb, var(--fg) 8%, transparent);
  border:1px solid color-mix(in srgb, var(--fg) 16%, transparent); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">

<div class="tube" id="tube1"></div><div class="tube" id="tube2"></div><div class="tube" id="tube3"></div>
<div id="panel">
  <div id="sideCol">
    <div class="blk"><div class="row"></div><div class="sh"></div></div>
    <div class="blk"><div class="row"></div><div class="sh"></div></div>
    <div class="blk"><div class="row"></div><div class="sh"></div></div>
  </div>
  <div id="main">
    <div class="blk"><div class="hero"></div><div class="sh"></div></div>
    <div class="cardRow">
      <div class="blk" style="flex:1"><div class="mcard"></div><div class="sh"></div></div>
      <div class="blk" style="flex:1"><div class="mcard"></div><div class="sh"></div></div>
      <div class="blk" style="flex:1"><div class="mcard"></div><div class="sh"></div></div>
    </div>
  </div>
  <img id="pageImg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#101219; display:none; z-index:4;" />
  <div id="dim"></div>
</div>
<svg id="frameSvg" viewBox="0 0 1460 820">
  <path class="fpath" id="fpA" d="M 0 410 L 0 0 L 1460 0 L 1460 410"/>
  <path class="fpath" id="fpB" d="M 0 410 L 0 820 L 1460 820 L 1460 410"/>
  <circle class="fhead" id="fhA" r="8"/><circle class="fhead" id="fhB" r="8"/>
</svg>

    </div>
    <script>
      const FB = {"accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
// 可选页面图：填了 img1 就把图贴进霓虹框面板（contain 完整显示，盖住线框 UI）
if (v.img1) { const im=$('#pageImg'); im.src=v.img1; im.style.display='block'; }
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

const fpA=$('#fpA'), fpB=$('#fpB'), fhA=$('#fhA'), fhB=$('#fhB');
const LA=fpA.getTotalLength(), LB=fpB.getTotalLength();
fpA.style.strokeDasharray=LA; fpA.style.strokeDashoffset=LA;
fpB.style.strokeDasharray=LB; fpB.style.strokeDashoffset=LB;
const fw={a:0,b:0};
function paintF(){
  fpA.style.strokeDashoffset=LA-fw.a;
  fpB.style.strokeDashoffset=LB-fw.b;
  let p=fpA.getPointAtLength(Math.min(fw.a,LA-0.01)); fhA.setAttribute('cx',p.x); fhA.setAttribute('cy',p.y);
  p=fpB.getPointAtLength(Math.min(fw.b,LB-0.01)); fhB.setAttribute('cx',p.x); fhB.setAttribute('cy',p.y);
}
paintF();
// 框：两头自左缘对奔 ~18f
tl.to(fw,{a:LA,b:LB,duration:F(18),ease:'power1.inOut',onUpdate:paintF},F(2));
tl.to([fhA,fhB],{opacity:0,duration:F(4)},F(20));
// 页面点亮 f18-72
tl.to('#dim',{opacity:0,duration:F(54),ease:'power1.inOut'},F(18));
// 组件贴落：悬浮 130px，与点亮同步、滞后 ~20f 收尾；错峰起点、并行下落
const blks=document.querySelectorAll('.blk');
blks.forEach((b,i)=>{
  const inner=b.firstElementChild, sh=b.querySelector('.sh');
  gsap.set(b,{y:-130});
  const st=24+i*8;
  tl.to(b,{y:0,duration:F(30),ease:'power2.in'},F(st));
  tl.fromTo(sh,{opacity:0,scaleX:1.5},{opacity:.55,scaleX:1,duration:F(30),ease:'power2.in'},F(st));
});
// 框光并入面板辉光
tl.to('#panel',{boxShadow:'0 0 60px color-mix(in srgb, var(--accent) 35%, transparent)',duration:F(18)},F(72));
tl.to(['#fpA','#fpB'],{opacity:.55,duration:F(18)},F(72));
// 背景霓虹管中亮尾熄 f100-122
tl.to('#tube2',{opacity:.05,duration:F(10)},F(100));
tl.to('#tube1',{opacity:.05,duration:F(10)},F(106));
tl.to('#tube3',{opacity:.05,duration:F(10)},F(112));
// 收尾真静止
tl.to({},{duration:F(13)},F(122));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
