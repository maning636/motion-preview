<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"可靠回答的组成"},{"id":"subtitle","type":"string","label":"副标题","default":"两个要素组合产生结果"},{"id":"leftA","type":"string","label":"左侧要素 A","default":"模型能力"},{"id":"leftADesc","type":"string","label":"要素 A 副释","default":"推理与表达"},{"id":"leftB","type":"string","label":"左侧要素 B","default":"上下文资料"},{"id":"leftBDesc","type":"string","label":"要素 B 副释","default":"检索到的证据"},{"id":"result","type":"string","label":"右侧结果","default":"可靠回答"},{"id":"resultDesc","type":"string","label":"结果副释","default":"有依据的输出"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 56px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 12px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 400; opacity: 0.55; }
      .equation{ display: flex; align-items: center; justify-content: center; gap: 40px; height: 600px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .term{ width: 320px; height: 220px; border: 1px solid rgba(244,239,231,0.18); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; background: rgba(244,239,231,0.02);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .term.accent{ border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .term-name{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 36px; font-weight: 700; text-align: center; }
      .term.accent .term-name{ color: var(--accent);font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .term-desc{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 20px; opacity: 0.55; text-align: center; }
      .op{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 72px; font-weight: 700; opacity: 0.35; }
      .eq{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 72px; font-weight: 700; color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="equation">
          <div class="term" id="termA">
            <div class="term-name" id="nameA"></div>
            <div class="term-desc" id="descA"></div>
          </div>
          <div class="op">+</div>
          <div class="term" id="termB">
            <div class="term-name" id="nameB"></div>
            <div class="term-desc" id="descB"></div>
          </div>
          <div class="eq">=</div>
          <div class="term accent" id="termResult">
            <div class="term-name" id="nameResult"></div>
            <div class="term-desc" id="descResult"></div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "可靠回答的组成", subtitle: "两个要素组合产生结果", leftA: "模型能力", leftADesc: "推理与表达", leftB: "上下文资料", leftBDesc: "检索到的证据", result: "可靠回答", resultDesc: "有依据的输出", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      document.getElementById("nameA").textContent = v.leftA;
      document.getElementById("descA").textContent = v.leftADesc;
      document.getElementById("nameB").textContent = v.leftB;
      document.getElementById("descB").textContent = v.leftBDesc;
      document.getElementById("nameResult").textContent = v.result;
      document.getElementById("descResult").textContent = v.resultDesc;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo("#termA", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.5);
      tl.fromTo(".op", { opacity: 0, scale: 0.8 }, { opacity: 0.35, scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.8);
      tl.fromTo("#termB", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 0.9);
      tl.fromTo(".eq", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 1.2);
      tl.fromTo("#termResult", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 1.4);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
