<html lang="zh-CN" data-composition-variables='[{"id":"pack","name":"规格包","type":"select","label":"规格包（配色 / 字体 / 曲线）","options":[{"label":"暗色科技","value":"dark"},{"label":"奶油贴纸","value":"cream"},{"label":"单色克制","value":"mono"},{"label":"夜航","value":"night"}],"default":"night"},{"id":"eyebrow","name":"眉标","type":"string","label":"顶部眉标","default":"THE FORK"},{"id":"title","name":"标题","type":"string","label":"标题","default":"一个决定，三条走向"},{"id":"h1","name":"走向一","type":"string","label":"走向 1 标题","default":"继续按现在的节奏投"},{"id":"p1","name":"走向一说明","type":"string","label":"走向 1 说明","default":"三个月后成本没降，曲线还在爬"},{"id":"h2","name":"走向二","type":"string","label":"走向 2 标题","default":"停下来先改产品"},{"id":"p2","name":"走向二说明","type":"string","label":"走向 2 说明","default":"收入掉一截，但单位成本开始下来"},{"id":"h3","name":"走向三","type":"string","label":"走向 3 标题","default":"加钱把量做上去"},{"id":"p3","name":"走向三说明","type":"string","label":"走向 3 说明","default":"规模上来后毛利被投流吃掉"},{"id":"foot","name":"收口","type":"string","label":"底部收口一句","default":"三条走向的概率不一样，但只有一条是你现在能动手改变的。"}]'>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="一条横轴、一个「今天」的点，从这里分出三条走向。与普通时间轴的区别是它不排先后，只排可能性——认知类里讲预判最容易变成单线故事，这个结构强迫你把三种结果都摆出来。">
<title>分叉时间轴 · 一个决定三条走向</title>
<link rel="stylesheet" href="../_lib/blocks.css">

<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<!-- packs.js 必须排在 blocks.js **之后**：blocks.js 结尾是 global.BBlocks = BB，
     会把它整个替换掉。谁先加载谁的东西就没了，表现是 B.pack is not a function。 -->
<script src="../_lib/packs.js"></script>
<style>
  /* 底色和字色**必须来自规格包**，不能写死。
     写死 #000 + #F4F1EA 的时候，四个包里只有 dark / night 正常：
     cream 的 --pk-fg 是 #2A2118、mono 是 #14140F，两个都是**深字**，
     压在这个写死的黑底上 → 标题、标签、说明全糊掉。
     而写死字面量色的元素（比如 rgba(244,241,234,.82)）反而还看得见，
     画面上就成了一半能看一半不能看——比全黑更难认。
     一共 33 条模板中招（混剪 5 + 认知 22 + 节拍 6）。

     注意区分两层契约（packs.css 顶部注释里写过）：
       --pk-bg / --pk-fg      = 包自带底板，舞台自己用它

  html,body{margin:0;padding:0;background:var(--pk-bg,#000)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--pk-bg,#000);
        color:var(--pk-fg,#F4F1EA);font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
        -webkit-font-smoothing:antialiased}
  /* 统一安全区：混剪里所有贴边元素都从 72/88 起，不贴 0 */
  
  /* ── 通用 ── */
  .eyebrow{position:absolute;left:120px;top:104px;opacity:0;

  .h1{position:absolute;left:120px;top:148px;width:1680px;opacity:0;

  .foot{position:absolute;left:120px;top:922px;width:1680px;opacity:0;

  .clabel{position:absolute;opacity:0;font-family:ui-monospace,Consolas,monospace;

  /* ── 引述页 ── */

  .qwho{position:absolute;left:120px;opacity:0;
      font-family:ui-monospace,Consolas,monospace;font-size:28px;font-weight:700;

  .qrule{position:absolute;left:120px;width:0;height:2px;background:rgba(244,241,234,.28)}
  .qlab{position:absolute;opacity:0;font-family:ui-monospace,Consolas,monospace;
      font-size:26px;font-weight:800;letter-spacing:.22em;color:var(--pk-accent)}
  .qtake{position:absolute;opacity:0;font-size:36px;line-height:1.52;
      color:var(--pk-fg)}

  /* ── 曲线页 ── */
  .chart{position:absolute;left:120px;top:400px;width:1680px;height:400px}
  .svgbox{position:absolute;left:0;top:0;width:100%;height:100%}
  .grid{position:absolute;left:0;right:0;height:1px;background:rgba(244,241,234,.10)}
  .pivot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
      background:var(--pk-accent);opacity:0;box-shadow:0 0 0 8px rgba(232,160,72,.18)}
  .pvline{position:absolute;width:2px;background:rgba(232,160,72,.55);opacity:0}
  .pvlab{position:absolute;opacity:0;font-size:30px;font-weight:800;color:var(--pk-accent)}
  .phase{position:absolute;top:0;opacity:0}
  .phase .pn{font-family:ui-monospace,Consolas,monospace;font-size:24px;font-weight:800;
      letter-spacing:.18em;color:var(--pk-accent)}
  .phase .pt{font-size:32px;font-weight:700;color:var(--pk-fg);margin-top:12px}
  .phase .pd{font-size:25px;color:var(--pk-muted);margin-top:10px;line-height:1.45}

  /* ── 判据树 ── */
  .tn{position:absolute;opacity:0;border:2px solid var(--pk-accent);
      border-radius:14px;background:rgba(232,160,72,.10);
      display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px}
  .tn.root{border-color:var(--pk-fg);background:rgba(244,241,234,.08)}
  .tn .t1{font-size:34px;font-weight:800;line-height:1.35}
  .tn.root .t1{font-size:40px}
  /* 树的连线。没有连线的话七个盒子就是散在画面上的方块，
     观众读到的是「七条并列信息」而不是「一棵树」——结构感全靠这 9 根线。 */
  .ln2{position:absolute;background:var(--pk-accent);opacity:.62}
  .tb{position:absolute;width:0;height:0;opacity:0;
      border-left:3px solid transparent;border-right:3px solid transparent}

  /* ── 证据墙 ── */
  .ev{position:absolute;top:470px;width:520px;height:330px;opacity:0;
      border:1px solid rgba(244,241,234,.14);border-radius:16px;
      background:rgba(244,241,234,.03);padding:34px 32px;display:flex;flex-direction:column}
  .ev .n{font-family:ui-monospace,Consolas,monospace;font-size:24px;font-weight:800;
      letter-spacing:.20em;color:var(--pk-accent)}
  .ev .e{margin-top:22px;font-size:36px;font-weight:700;line-height:1.45;color:var(--pk-fg)}
  .ev .s{margin-top:auto;font-size:22px;line-height:1.5;
      color:var(--pk-muted);font-family:ui-monospace,Consolas,monospace}

  /* ── 反直觉三连 ── */
  .fr{position:absolute;left:120px;width:1680px;height:170px;opacity:0}
  .fr .idx{position:absolute;left:0;top:6px;font-family:ui-monospace,Consolas,monospace;
      font-size:30px;font-weight:800;letter-spacing:.14em;color:var(--pk-accent)}
  .fr .old{position:absolute;left:150px;top:0;width:1500px;font-size:46px;
      font-weight:600;color:var(--pk-muted)}
  .fr .strike{position:absolute;left:150px;top:30px;width:0;height:3px;
      background:rgba(244,241,234,.70)}
  .fr .new{position:absolute;left:150px;top:62px;width:1500px;font-size:46px;
      font-weight:800;color:var(--pk-fg)}

  /* ── 定义页 ── */
  .termbig{position:absolute;left:120px;top:330px;width:1680px;opacity:0;
      font-size:150px;font-weight:900;line-height:1.1;letter-spacing:.02em;
      color:var(--pk-fg)}
  .termsub{position:absolute;left:120px;top:520px;width:1500px;opacity:0;
      font-size:40px;line-height:1.5;color:var(--pk-fg)}
  .chip{position:absolute;top:700px;width:520px;height:170px;opacity:0;
      border-radius:14px;padding:26px 28px;display:flex;flex-direction:column;
      background:rgba(244,241,234,.05)}
  .chip .cn{font-family:ui-monospace,Consolas,monospace;font-size:22px;font-weight:800;
      letter-spacing:.18em;color:var(--pk-accent)}
  .chip .cd{font-size:28px;line-height:1.5;margin-top:16px;color:var(--pk-fg)}

  /* ── 分叉时间轴 ── */
  .axis{position:absolute;left:120px;top:560px;width:1680px;height:3px;
      background:rgba(244,241,234,.20)}
  .now{position:absolute;left:540px;top:560px;width:26px;height:26px;margin:-11px 0 0 -13px;
      border-radius:50%;background:var(--pk-accent);opacity:0;
      box-shadow:0 0 0 10px rgba(232,160,72,.18)}
  .nowlab{position:absolute;left:540px;top:604px;width:300px;margin-left:-150px;opacity:0;
      text-align:center;font-family:ui-monospace,Consolas,monospace;font-size:24px;
      font-weight:800;letter-spacing:.16em;color:var(--pk-accent)}
  .br{position:absolute;width:0;height:0;opacity:0;
      border-left:3px solid transparent;border-right:3px solid transparent;
      border-bottom:5px solid var(--pk-accent)}
  /* 分叉的连接线：从主轴折向标签。之前只有一个小三角，没有线，
     三个标签就浮在画面上，看不出它们和「今天」有关系。 */
  .bl{position:absolute;background:var(--pk-accent);opacity:.62}
  /* 宽度 390 而非 460：f2 在 left:1520px，460 宽的话右边缘 1980 出画布 60px。
     390 让右边缘落在 1910px；最长的一行说明 13 字 ×24px = 312px，不会折行。 */
  .fl{position:absolute;opacity:0;width:390px}
  .fl .fh{font-size:34px;font-weight:800;color:var(--pk-fg)}
  .fl .fp{font-size:24px;line-height:1.5;margin-top:12px;color:var(--pk-muted)}

  /* ── 逐条对照表 ── */
  .th{position:absolute;top:330px;width:760px;opacity:0;font-size:32px;font-weight:800;
      letter-spacing:.10em}
  .th.a{left:120px;color:var(--pk-muted)}
  .th.b{left:1040px;color:var(--pk-accent)}
  .vline{position:absolute;left:920px;top:330px;width:2px;height:440px;
      background:rgba(244,241,234,.14)}
  .tr{position:absolute;left:120px;width:1680px;height:120px;opacity:0}
  .tr .rule{position:absolute;left:0;right:0;top:0;height:1px;background:rgba(244,241,234,.10)}
  .tr .ca{position:absolute;left:0;top:30px;width:700px;text-align:right;
      font-size:34px;font-weight:600;color:var(--pk-muted)}
  .tr .cb{position:absolute;left:920px;top:30px;width:700px;
      font-size:34px;font-weight:800;color:var(--pk-fg)}

</style>
</head>
<body>
<div id="stage">

  <div class="eyebrow" id="eb">THE FORK</div>
  <div class="h1" id="h1" data-fit-max="76" data-fit-min="44">一个决定，三条走向</div>
  <div class="axis" id="axis"></div>
  <div class="now" id="now"></div>
  <div class="nowlab" id="nowlab">今天</div>
  <div class="bl" id="b0v" style="left:820px;top:380px;width:2px;height:180px"></div>
  <div class="bl" id="b0h" style="left:820px;top:379px;width:46px;height:2px"></div>
  <div class="fl" id="f0" style="left:860px;top:300px">
    <div class="fh" id="fh0" data-fit-max="34" data-fit-min="22">继续按现在的节奏投</div>
    <div class="fp" id="fp0">三个月后成本没降，曲线还在爬</div>
  </div>
  <div class="bl" id="b1v" style="left:820px;top:560px;width:2px;height:40px"></div>
  <div class="bl" id="b1h" style="left:820px;top:599px;width:46px;height:2px"></div>
  <div class="fl" id="f1" style="left:860px;top:600px">
    <div class="fh" id="fh1" data-fit-max="34" data-fit-min="22">停下来先改产品</div>
    <div class="fp" id="fp1">收入掉一截，但单位成本开始下来</div>
  </div>
  <div class="bl" id="b2v" style="left:1480px;top:380px;width:2px;height:180px"></div>
  <div class="bl" id="b2h" style="left:1480px;top:379px;width:46px;height:2px"></div>
  <div class="fl" id="f2" style="left:1520px;top:300px">
    <div class="fh" id="fh2" data-fit-max="34" data-fit-min="22">加钱把量做上去</div>
    <div class="fp" id="fp2">规模上来后毛利被投流吃掉</div>
  </div>
  <div class="footline" id="fline"></div>
  <div class="foot" id="foot" data-fit-max="34" data-fit-min="22">三条走向的概率不一样，但只有一条是你现在能动手改变的。</div>

</div>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  var tl = B.tl();
  /* 规格包：先定风格，再建任何元素。
     画面素材的配色**不跟着包走**——那是"底片"，用户自己的东西不能被模板改色；
     跟着包走的只有 UI 层（字色、强调色、描边、圆角、曲线）。这个边界必须守住。 */
  B.pack(v.pack);
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  function q(s) { return document.querySelector(s); }
  /* 素材位接真视频：留空就继续用 CSS 画面 */
  function live(n, src) {
    if (!src) return;
    var s = document.getElementById('s' + n), e = document.getElementById('v' + n);
    if (!s || !e) return;
    s.classList.add('live'); e.src = src;
    e.play().catch(function () {});
  }
  /* 景别缓推：v1/v3 里画面始终在极慢地动，这是「像镜头」的关键 */
  function push(n, at, dur, from, to, ease) {
    var s = q('#s' + n + ' .sky'), g = q('#s' + n + ' .glow'), r = q('#s' + n + ' .r2');
    if (s) tl.fromTo(s, { scale: from, y: '0%' },
      { scale: to, y: '-2%', duration: dur, ease: ease || 'none' }, at);
    if (g) tl.fromTo(g, { xPercent: -4, opacity: .8 },
      { xPercent: 5, opacity: 1, duration: dur, ease: 'none' }, at);
    if (r) tl.fromTo(r, { xPercent: 0 },
      { xPercent: -2.5, duration: dur, ease: 'none' }, at);
  }
  /* clip-path 形状插值。
     两个坑都在这里踩过：
       1. GSAP 各版本对 clipPath 字符串补间的处理不一致，所以不直接补间它，
          改成补间一个 {t:0→1} 的代理对象，onUpdate 里自己算 8 个点；
       2. **from 必须是编译期常量，不能从元素当前状态读。**
          settle 会把时间轴来回扫；一旦回退越过一个已完成的补间，
          GSAP 会把它按 ratio 0 重渲——onUpdate 拿到的就是起点，
          形状会「弹回矩形」。写成常量后，形状是 t 的纯函数，
          停在任何一帧算出来都一样。
     相邻两段的 from 必须等于上一段的 to，这条由 Python 侧保证。 */
  function polyStr(pts) {
    return 'polygon(' + pts.map(function (p) {
      return p[0].toFixed(2) + '% ' + p[1].toFixed(2) + '%'; }).join(',') + ')';
  }
  function morph(el, from, to, at, dur, ease) {
    if (!el || !to || !from || from.length !== to.length) return;
    var st = { t: 0 };
    tl.to(st, { t: 1, duration: dur == null ? .7 : dur, ease: ease || 'power2.inOut',
      onUpdate: function () {
        el.style.clipPath = polyStr(from.map(function (p, i) {
          return [p[0] + (to[i][0] - p[0]) * st.t,
                  p[1] + (to[i][1] - p[1]) * st.t];
        }));
      } }, at);
  }
  set('eb', v.eyebrow); set('h1', v.title); set('foot', v.foot);
  set('fh0', v.h1); set('fp0', v.p1);
  set('fh1', v.h2); set('fp1', v.p2);
  set('fh2', v.h3); set('fp2', v.p3);

  tl.fromTo('#eb', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .4 }, 0);
  tl.fromTo('#h1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .08);
  tl.fromTo('#now', { opacity: 0, scale: .3 },
      { opacity: 1, scale: 1, duration: .4, ease: 'back.out(3)' }, .3);
  tl.fromTo('#nowlab', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .3 }, .44);
  tl.fromTo('#axis', { scaleX: 0, transformOrigin: '0% 50%' },
      { scaleX: 1, duration: .8, ease: 'power2.inOut' }, .36);
  for (var k = 0; k < 3; k++) {
    var at = .9 + k * .34;
    /* 竖线先长、横线再折过去，标签最后落：
       这样「从主轴分出去」这个动作是连续的，中间没有断点。 */
    tl.fromTo('#b' + k + 'v', { scaleY: 0, transformOrigin: '50% 100%' },
        { scaleY: 1, duration: .34, ease: 'power2.out' }, at);
    tl.fromTo('#b' + k + 'h', { scaleX: 0, transformOrigin: '0% 50%' },
        { scaleX: 1, duration: .26, ease: 'power2.out' }, at + .26);
    tl.fromTo('#f' + k, { opacity: 0, x: -18 },
        { opacity: 1, x: 0, duration: .44, ease: 'power3.out' }, at + .4);
  }
  tl.fromTo('#fline', { width: 0 }, { width: 200, duration: .5, ease: 'power3.out' }, 2.3);
  tl.fromTo('#foot', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .5 }, 2.42);
  B.hold(tl, 3.7, .6);
  B.fitAll();

})();
</script>
</body>
