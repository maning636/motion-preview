<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "红头标题", "default": "关于加强自动化流程管理的通知"}, {"id": "clauses", "type": "string", "label": "条款列表（逗号分隔）", "default": "所有定时任务统一登记备案,发布前须经双人复核,异常任务十分钟内上报,每周五进行运行复盘"}, {"id": "signature", "type": "string", "label": "落款", "default": "运营管理部"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #F1EDE0; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #1D1D20; }
      .paper{ position: absolute; left: 410px; top: 60px; width: 1100px; height: 960px;
        background: #FFFDF7; border: 2px solid #1D1D20; padding: 54px 78px;
        box-shadow: 12px 12px 0 rgba(29,29,32,.10); }
      .p-head{ text-align: center; color: #C8392E; font-size: 62px; font-weight: 900; letter-spacing: .14em; }
      .p-rule{ height: 6px; margin: 26px 0 8px; background: #C8392E; transform-origin: left center; }
      .p-rule2{ height: 2px; margin-bottom: 36px; background: #C8392E; transform-origin: left center; }
      .p-lead{ font-size: 26px; font-weight: 600; color: #3A3733; margin-bottom: 22px; }
      .p-clause{ display: flex; gap: 20px; font-size: 30px; font-weight: 700; line-height: 1.5;
        padding: 13px 0; border-bottom: 1px dashed rgba(29,29,32,.2); }
      .p-clause .no{ flex: none; color: #C8392E; font-weight: 900; }
      .p-sign{ margin-top: 46px; text-align: right; font-size: 28px; font-weight: 700; color: #3A3733; }
      .p-sign .u{ display: inline-block; min-width: 200px; border-bottom: 2px solid #1D1D20; text-align: center; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="paper" id="paper">
        <h1 class="p-head" id="title"></h1>
        <div class="p-rule" id="rule"></div>
        <div class="p-rule2" id="rule2"></div>
        <div class="p-lead" id="lead">各有关单位、各位同事：</div>
        <div id="clauses"></div>
        <div class="p-sign" id="sign"><span class="u" id="signName"></span><br/>2026 年 8 月 13 日</div>
      </div>

    </div>
    <script>
      const fallback = {"title": "关于加强自动化流程管理的通知", "clauses": "所有定时任务统一登记备案,发布前须经双人复核,异常任务十分钟内上报,每周五进行运行复盘", "signature": "运营管理部", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      $("title").textContent = V.title;
      $("signName").textContent = V.signature;
      const cn = ["一", "二", "三", "四", "五", "六", "七", "八"];
      const clauses = split(V.clauses);
      const box = $("clauses");
      clauses.forEach((c, i) => {
        const d = document.createElement("div");
        d.className = "p-clause";
        d.innerHTML = `<span class="no">${cn[i] ?? (i + 1)}、</span><span class="t"></span>`;
        d.querySelector(".t").textContent = c;
        box.appendChild(d);
      });
      tl.fromTo("#paper", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#title", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.2);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.5);
      tl.fromTo("#rule2", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.65);
      tl.fromTo("#lead", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.85);
      tl.fromTo(".p-clause", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.32, stagger: 0.2, ease: "power2.out" }, 1.0);
      tl.fromTo("#sign", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, 1.0 + clauses.length * 0.2 + 0.25);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
