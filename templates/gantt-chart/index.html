<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"Sprint 路线图"},{"id":"subtitle","type":"string","label":"副标题","default":"W1–W8 任务排期与关键里程碑"},{"id":"weeks","type":"string","label":"周标签（逗号分隔）","default":"W1,W2,W3,W4,W5,W6,W7,W8"},{"id":"tasks","type":"string","label":"任务名（逗号分隔）","default":"需求评审,架构设计,API 开发,前端实现,集成测试,文档交付,灰度发布"},{"id":"starts","type":"string","label":"每项起始周索引（0-based）","default":"0,1,2,3,4,5,6"},{"id":"ends","type":"string","label":"每项结束周索引（0-based）","default":"1,3,5,6,7,7,7"},{"id":"milestones","type":"string","label":"里程碑周索引（逗号分隔）","default":"1,5,7"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 40px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 12px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 400; opacity: 0.55; }
      .gantt{ display: grid; grid-template-columns: 240px 1fr; gap: 24px; height: 720px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .task-col{ display: flex; flex-direction: column;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .task-label{ height: 72px; display: flex; align-items: center; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 20px; font-weight: 500; opacity: 0.85; padding-right: 16px; border-bottom: 1px solid rgba(244,239,231,0.06); }
      .chart-col{ display: flex; flex-direction: column; position: relative;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .week-head{ height: 56px; display: grid; grid-template-columns: repeat(8, 1fr); border-bottom: 1px solid rgba(244,239,231,0.14);font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .week-label{ display: flex; align-items: center; justify-content: center; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 18px; font-weight: 500; opacity: 0.45; border-right: 1px solid rgba(244,239,231,0.08); }
      .task-row{ height: 72px; position: relative; border-bottom: 1px solid rgba(244,239,231,0.06);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .grid-line{ position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(244,239,231,0.06);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .bar{ position: absolute; height: 28px; top: 22px; border-radius: 4px; background: rgba(244,239,231,0.14);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .bar.accent{ background: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .milestone{ position: absolute; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); transform: translateX(-50%);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="gantt">
          <div class="task-col" id="taskCol"></div>
          <div class="chart-col" id="chartCol">
            <div class="week-head" id="weekHead"></div>
            <div id="rows"></div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "Sprint 路线图", subtitle: "W1–W8 任务排期与关键里程碑", weeks: "W1,W2,W3,W4,W5,W6,W7,W8", tasks: "需求评审,架构设计,API 开发,前端实现,集成测试,文档交付,灰度发布", starts: "0,1,2,3,4,5,6", ends: "1,3,5,6,7,7,7", milestones: "1,5,7", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      const weeks = String(v.weeks).split(",").map(s => s.trim());
      const tasks = String(v.tasks).split(",").map(s => s.trim());
      const starts = String(v.starts).split(",").map(s => parseInt(s.trim(), 10) || 0);
      const ends = String(v.ends).split(",").map(s => parseInt(s.trim(), 10) || 0);
      const milestones = String(v.milestones).split(",").map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n));
      const n = weeks.length || 8;

      const taskCol = document.getElementById("taskCol");
      tasks.forEach(t => {
        const div = document.createElement("div");
        div.className = "task-label";
        div.textContent = t;
        taskCol.appendChild(div);
      });

      const weekHead = document.getElementById("weekHead");
      weekHead.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
      weeks.forEach(w => {
        const div = document.createElement("div");
        div.className = "week-label";
        div.textContent = w;
        weekHead.appendChild(div);
      });

      const rows = document.getElementById("rows");
      tasks.forEach((t, i) => {
        const row = document.createElement("div");
        row.className = "task-row";
        const start = Math.max(0, Math.min(n - 1, starts[i] || 0));
        const end = Math.max(start, Math.min(n - 1, ends[i] || start));
        const bar = document.createElement("div");
        bar.className = "bar" + (i === 0 || i === tasks.length - 1 ? " accent" : "");
        bar.style.left = (start / n * 100) + "%";
        bar.style.width = ((end - start + 1) / n * 100) + "%";
        row.appendChild(bar);
        rows.appendChild(row);
      });

      milestones.forEach(m => {
        if (m < 0 || m >= n) return;
        const ms = document.createElement("div");
        ms.className = "milestone";
        ms.style.left = ((m + 0.5) / n * 100) + "%";
        weekHead.appendChild(ms);
      });

      for (let i = 1; i < n; i++) {
        const line = document.createElement("div");
        line.className = "grid-line";
        line.style.left = (i / n * 100) + "%";
        rows.appendChild(line);
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo(".week-label", { opacity: 0, y: -12 }, { opacity: 0.45, y: 0, duration: 0.4, stagger: 0.05, ease: "power2.out" }, 0.4);
      tl.fromTo(".task-label", { opacity: 0, x: -16 }, { opacity: 0.85, x: 0, duration: 0.4, stagger: 0.08, ease: "power2.out" }, 0.5);
      document.querySelectorAll(".bar").forEach((bar, i) => {
        const w = bar.style.width;
        gsap.set(bar, { width: 0 });
        tl.to(bar, { width: w, duration: 0.7, ease: "power2.out" }, 0.7 + i * 0.1);
      });
      tl.fromTo(".milestone", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, stagger: 0.1, ease: "back.out(2)" }, 1.4);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
