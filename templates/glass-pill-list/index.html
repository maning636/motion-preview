<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "本周跑通的五件事"}, {"id": "items", "type": "string", "label": "条目列表（逗号分隔，末条高亮）", "default": "选题池自动化入库,脚本初稿十分钟出炉,渲染管线一键批量,多平台定时分发,全流程零手工干预"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #070B09; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #EAF4EE; }
      .g-bg{ position: absolute; inset: 0;
        background: radial-gradient(900px 520px at 26% 20%, rgba(0,255,140,.07), transparent 60%),
          radial-gradient(1000px 600px at 80% 84%, rgba(64,224,208,.06), transparent 60%); }
      .g-head{ position: absolute; left: 300px; top: 130px; display: flex; align-items: center; gap: 18px; }
      .g-dot{ width: 18px; height: 18px; border-radius: 50%; background: #00FF00; box-shadow: 0 0 20px #00FF00; }
      .g-head h1{ font-size: 54px; font-weight: 700; color: #F4FBF7; }
      .g-list{ position: absolute; left: 300px; top: 270px; display: flex; flex-direction: column; gap: 26px; }
      .g-pill{ display: flex; align-items: center; gap: 22px; min-width: 760px; max-width: 1240px;
        padding: 24px 44px; border-radius: 999px; background: rgba(14,26,20,.56);
        -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,.16); box-shadow: 10px 12px 0 rgba(4,9,7,.3);
        font-size: 32px; font-weight: 700; color: #EAF4EE; }
      .g-pill .pd{ flex: none; width: 14px; height: 14px; border-radius: 50%;
        background: rgba(255,255,255,.3); }
      .g-pill.hot{ border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: 0 0 26px color-mix(in srgb, var(--accent) 22%, transparent), 10px 12px 0 rgba(4,9,7,.3); }
      .g-pill.hot .pd{ background: #00FF00; box-shadow: 0 0 14px #00FF00; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="g-bg"></div>
      <div class="g-head" id="head"><span class="g-dot"></span><h1 id="title"></h1></div>
      <div class="g-list" id="list"></div>

    </div>
    <script>
      const fallback = {"title": "本周跑通的五件事", "items": "选题池自动化入库,脚本初稿十分钟出炉,渲染管线一键批量,多平台定时分发,全流程零手工干预", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      $("title").textContent = V.title;
      const items = split(V.items).slice(0, 6);
      const list = $("list");
      items.forEach((it, i) => {
        const d = document.createElement("div");
        d.className = "g-pill" + (i === items.length - 1 ? " hot" : "");
        d.innerHTML = `<span class="pd"></span><span class="pt"></span>`;
        d.querySelector(".pt").textContent = it;
        list.appendChild(d);
      });
      tl.fromTo("#head", { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.1);
      document.querySelectorAll(".g-pill").forEach((el, i) => {
        tl.fromTo(el, { x: -70, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.5 + i * 0.16);
      });
      const hot = list.querySelector(".hot");
      if (hot) {
        const tHot = 0.5 + items.length * 0.16 + 0.15;
        tl.to(hot, { scale: 1.035, duration: 0.2, ease: "power2.out" }, tHot);
        tl.to(hot, { scale: 1, duration: 0.26, ease: "power2.inOut" }, tHot + 0.2);
      }
      window.__timelines.main = tl;

    </script>
  </body>
</html>
