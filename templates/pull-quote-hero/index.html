<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"quote","type":"string","label":"引用原文","default":"真正的好设计，是让人忘记设计的存在。"},{"id":"author","type":"string","label":"作者","default":"Dieter Rams"},{"id":"role","type":"string","label":"作者身份","default":"Industrial Designer"},{"id":"sourceLabel","type":"string","label":"来源标签","default":"ON DESIGN"},{"id":"duration","type":"number","label":"总时长（秒）","default":6},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 120px 160px; overflow: hidden; display: flex; flex-direction: column; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .source-label{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 18px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.45; margin-bottom: 36px; }
      .quote-wrap{ position: relative;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .quote-mark{ position: absolute; left: -80px; top: -40px; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 220px; font-weight: 700; line-height: 1; opacity: 0.10; }
      .quote-text{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 72px; font-weight: 500; line-height: 1.25; letter-spacing: -0.02em; max-width: 1400px; }
      .quote-text em{ font-style: italic; color: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .byline{ margin-top: 60px; display: flex; align-items: center; gap: 24px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .byline-dash{ width: 48px; height: 3px; background: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .byline-text{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 500; letter-spacing: 0.04em; }
      .byline-role{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 20px; font-weight: 400; opacity: 0.55; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="source-label" id="sourceLabel"></div>
        <div class="quote-wrap">
          <div class="quote-mark">"</div>
          <p class="quote-text" id="quote"></p>
        </div>
        <div class="byline">
          <span class="byline-dash"></span>
          <div>
            <div class="byline-text" id="author"></div>
            <div class="byline-role" id="role"></div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { quote: "真正的好设计，是让人忘记设计的存在。", author: "Dieter Rams", role: "Industrial Designer", sourceLabel: "ON DESIGN", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("sourceLabel").textContent = v.sourceLabel;
      document.getElementById("author").textContent = v.author;
      document.getElementById("role").textContent = v.role;
      const q = document.getElementById("quote");
      const safeQuote = String(v.quote || "").trim();
      const words = safeQuote.split(/(\s+)/);
      if (words.length > 2) {
        const mid = Math.floor(words.length / 2);
        words[mid] = `<em>${words[mid]}</em>`;
        q.innerHTML = words.join("");
      } else {
        q.textContent = safeQuote;
      }
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".source-label", { opacity: 0, y: -16 }, { opacity: 0.45, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);
      tl.fromTo(".quote-mark", { opacity: 0, scale: 0.8 }, { opacity: 0.10, scale: 1, duration: 0.8, ease: "power3.out" }, 0.3);
      tl.fromTo(".quote-text", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.5);
      tl.fromTo(".byline-dash", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 1.2);
      tl.fromTo(".byline-text", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 1.4);
      tl.fromTo(".byline-role", { opacity: 0, x: -16 }, { opacity: 0.55, x: 0, duration: 0.4, ease: "power2.out" }, 1.6);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.4, ease: "power2.in" }, 4.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
