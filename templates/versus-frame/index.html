<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"leftTitle","type":"string","label":"左侧方案","default":"预训练"},{"id":"rightTitle","type":"string","label":"右侧方案","default":"微调"},{"id":"dimensions","type":"string","label":"对比维度（逗号分隔）","default":"数据需求,成本,灵活性,上线周期"},{"id":"leftValues","type":"string","label":"左侧值（逗号分隔）","default":"极大,低,差,短"},{"id":"rightValues","type":"string","label":"右侧值（逗号分隔）","default":"小,中,好,中"},{"id":"recommendedSide","type":"enum","label":"推荐侧","options":[{"value":"left","label":"左侧"},{"value":"right","label":"右侧"}],"default":"right"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ text-align: center; margin-bottom: 56px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header-title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 22px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.45; }
      .compare{ display: grid; grid-template-columns: 1fr 80px 1fr; gap: 0; border-top: 1px solid rgba(244,239,231,0.14);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .col{ display: flex; flex-direction: column;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .col-header{ padding: 28px 0; text-align: center; border-bottom: 1px solid rgba(244,239,231,0.14);font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .col-title{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 42px; font-weight: 700; letter-spacing: -0.02em; }
      .col-sub{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 16px; font-weight: 500; opacity: 0.45; margin-top: 6px; }
      .cell{ padding: 28px 0; text-align: center; border-bottom: 1px solid rgba(244,239,231,0.10); font-family: 'MEBHeiHeiTi', sans-serif; font-size: 28px; font-weight: 500; }
      .vs{ display: flex; align-items: center; justify-content: center; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 32px; font-weight: 700; opacity: 0.35; border-left: 1px solid rgba(244,239,231,0.14); border-right: 1px solid rgba(244,239,231,0.14); }
      .winner{ color: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .winner-badge{ display: inline-block; margin-left: 12px; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid var(--accent); padding: 2px 8px; border-radius: 2px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <div class="header-title">VERSUS</div>
        </div>
        <div class="compare">
          <div class="col" id="leftCol">
            <div class="col-header">
              <div class="col-title" id="leftTitle"></div>
              <div class="col-sub" id="leftSub"></div>
            </div>
            <div id="leftCells"></div>
          </div>
          <div class="vs">vs</div>
          <div class="col" id="rightCol">
            <div class="col-header">
              <div class="col-title" id="rightTitle"></div>
              <div class="col-sub" id="rightSub"></div>
            </div>
            <div id="rightCells"></div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { leftTitle: "预训练", rightTitle: "微调", dimensions: "数据需求,成本,灵活性,上线周期", leftValues: "极大,低,差,短", rightValues: "小,中,好,中", recommendedSide: "right", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("leftTitle").textContent = v.leftTitle;
      document.getElementById("rightTitle").textContent = v.rightTitle;
      document.getElementById("leftSub").textContent = "方案 A";
      document.getElementById("rightSub").textContent = "方案 B";
      const dims = String(v.dimensions).split(",").map(s => s.trim());
      const leftVals = String(v.leftValues).split(",").map(s => s.trim());
      const rightVals = String(v.rightValues).split(",").map(s => s.trim());
      const leftCells = document.getElementById("leftCells");
      const rightCells = document.getElementById("rightCells");
      const rec = v.recommendedSide;
      dims.forEach((dim, i) => {
        const lw = document.createElement("div"); lw.className = "cell" + (rec === "left" ? " winner" : ""); lw.textContent = leftVals[i] || ""; leftCells.appendChild(lw);
        const rw = document.createElement("div"); rw.className = "cell" + (rec === "right" ? " winner" : ""); rw.textContent = rightVals[i] || ""; rightCells.appendChild(rw);
      });
      if (rec === "left") document.getElementById("leftTitle").innerHTML += '<span class="winner-badge">推荐</span>';
      if (rec === "right") document.getElementById("rightTitle").innerHTML += '<span class="winner-badge">推荐</span>';
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".header-title", { opacity: 0, y: -16 }, { opacity: 0.45, y: 0, duration: 0.4, ease: "power2.out" }, 0.1);
      tl.fromTo(".col-header", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.3);
      document.querySelectorAll("#leftCells .cell, #rightCells .cell").forEach((cell, i) => {
        tl.fromTo(cell, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.7 + i * 0.1);
      });
      tl.fromTo(".vs", { opacity: 0, scale: 0.8 }, { opacity: 0.35, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 0.9);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
