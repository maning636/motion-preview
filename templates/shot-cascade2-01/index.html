<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#wall{ position:absolute; inset:-200px; perspective:1000px; }
#tilt{ position:absolute; inset:0; transform:rotateX(20deg) scale(1.2); display:flex; gap:36px;
  justify-content:center; will-change:transform; }
.col{ width:460px; flex:none; overflow:visible; }
.colInner{ display:flex; flex-direction:column; will-change:transform; }
.pg{ width:460px; height:300px; flex:none; border-radius:14px; margin-bottom:24px;
  background:#14161F; border:1px solid color-mix(in srgb, var(--fg) 14%, transparent); padding:26px; }
.pg .t{ height:22px; border-radius:11px; background:color-mix(in srgb, var(--fg) 30%, transparent); width:55%; }
.pg .l{ height:12px; border-radius:6px; background:color-mix(in srgb, var(--fg) 14%, transparent); margin-top:16px; }
.pg.hot{ border-color:color-mix(in srgb, var(--accent) 55%, transparent); }
.pg.hot .t{ background:var(--accent); }
.maskT{ position:absolute; left:0; top:0; right:0; height:200px; z-index:5;
  background:linear-gradient(180deg,var(--bg),transparent); pointer-events:none; }
.maskB{ position:absolute; left:0; bottom:0; right:0; height:200px; z-index:5;
  background:linear-gradient(0deg,var(--bg),transparent); pointer-events:none; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">

    </div>
    <script>
      const FB = {"accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

// 单副本高 = 4×(300+24)=1296；差速 12/9/14s，中列反向
gsap.set('#c0',{y:0});        tl.to('#c0',{y:-1296,duration:12,ease:'none'},0);
gsap.set('#c1',{y:-1296});    tl.to('#c1',{y:0,duration:9,ease:'none'},0);
gsap.set('#c2',{y:-648});     tl.to('#c2',{y:-1944,duration:14,ease:'none'},0);
// 镜头缓推铺满全镜
tl.to('#tilt',{scale:1.26,duration:F(150),ease:'none'},0);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
