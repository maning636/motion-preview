<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "VOL.15 · 视觉动效库"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.302 / 400"}, {"id": "leftTitle", "type": "string", "label": "左卡标题（黑卡）", "default": "劝退点"}, {"id": "leftKicker", "type": "string", "label": "左卡角标", "default": "CON · 劝退"}, {"id": "leftBody", "type": "string", "label": "左卡说明", "default": "案例偏理想化，落地要自己补环境，不适合拿来照抄。"}, {"id": "rightTitle", "type": "string", "label": "右卡标题（白卡）", "default": "值得读"}, {"id": "rightKicker", "type": "string", "label": "右卡角标", "default": "PRO · 值得"}, {"id": "rightBody", "type": "string", "label": "右卡说明", "default": "框架清晰、方法可复用，第二章直接值回书价。"}, {"id": "banner", "type": "string", "label": "关键词横幅", "default": "结论：方法论五星，实操三星"}, {"id": "sticker", "type": "string", "label": "贴纸文字", "default": "买它"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .pvs-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .pvs-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .pvs-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .pvs-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 左右双结论卡 */
      .pvs-card{ position: absolute; top: 200px; width: 700px; height: 400px; border: 3px solid #141414;
        padding: 48px 52px; z-index: 4; }
      .pvs-card .tag{ font-size: 18px; letter-spacing: .24em; margin-bottom: 22px; }
      .pvs-card h3{ font-size: 64px; font-weight: 900; line-height: 1.15; margin-bottom: 24px; }
      .pvs-card p{ font-family: 'MiSans SemiBold', sans-serif; font-size: 26px; line-height: 1.65; }
      .pvs-left{ left: 190px; background: #141414; color: #F6F5EF; box-shadow: 10px 10px 0 var(--ac, #00FF00); }
      .pvs-left .tag{ color: var(--ac, #00FF00); }
      .pvs-left p{ color: #C9C9C0; }
      .pvs-right{ right: 190px; background: #fff; color: #141414; box-shadow: 10px 10px 0 #141414; }
      .pvs-right .tag{ color: #9A9A92; }
      .pvs-right p{ color: #55554E; }
      /* 底部关键词横幅 */
      .pvs-banner{ position: absolute; left: 50%; top: 664px; width: 1120px; height: 104px; margin-left: -560px;
        background: #fff; border: 3px solid #141414; box-shadow: 10px 10px 0 #141414; z-index: 4;
        display: flex; align-items: center; justify-content: center; }
      .pvs-banner .bx{ position: relative; display: inline-block; padding: 0 14px; font-size: 38px; font-weight: 900; }
      .pvs-banner .bx i{ position: absolute; left: 0; right: 0; top: 6px; bottom: 6px; background: var(--ac, #00FF00);
        z-index: -1; transform: scaleX(0); transform-origin: 0 50%; }
      /* 荧光绿圆形贴纸 */
      .pvs-sticker{ position: absolute; left: 50%; top: 502px; width: 226px; height: 226px; margin-left: -113px;
        border-radius: 50%; background: var(--ac, #00FF00); border: 3px solid #141414;
        box-shadow: 8px 8px 0 #141414; z-index: 7; display: flex; align-items: center; justify-content: center; }
      .pvs-sticker .st{ font-size: 56px; font-weight: 900; letter-spacing: .06em; color: #141414; }
      /* 底部绿色署名条 */
      .pvs-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(64px); }
      .pvs-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .pvs-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="pvs-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="pvs-card pvs-left" id="cardL">
        <div class="tag mono" id="tagL">CON · 劝退</div>
        <h3 id="leftTitle"></h3>
        <p id="leftBody"></p>
      </div>
      <div class="pvs-card pvs-right" id="cardR">
        <div class="tag mono" id="tagR">PRO · 值得</div>
        <h3 id="rightTitle"></h3>
        <p id="rightBody"></p>
      </div>
      <div class="pvs-banner" id="banner">
        <span class="bx"><i id="bnhl"></i><span id="bannerTx"></span></span>
      </div>
      <div class="pvs-sticker" id="sticker"><span class="st" id="stickerTx"></span></div>
      <div class="pvs-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · VERDICT</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "VOL.15 · 视觉动效库", "pageno": "P.302 / 400", "leftTitle": "劝退点", "leftKicker": "CON · 劝退", "leftBody": "案例偏理想化，落地要自己补环境，不适合拿来照抄。", "rightTitle": "值得读", "rightKicker": "PRO · 值得", "rightBody": "框架清晰、方法可复用，第二章直接值回书价。", "banner": "结论：方法论五星，实操三星", "sticker": "买它", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      $("tagL").textContent = V.leftKicker;
      $("tagR").textContent = V.rightKicker;
      $("leftTitle").textContent = V.leftTitle;
      $("leftBody").textContent = V.leftBody;
      $("rightTitle").textContent = V.rightTitle;
      $("rightBody").textContent = V.rightBody;
      $("bannerTx").textContent = V.banner;
      $("stickerTx").textContent = V.sticker;
      // 页眉细线 + 文字
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      // 双卡从两侧对撞落位
      tl.fromTo("#cardL", { x: -920, rotate: -3 }, { x: 0, rotate: 0, duration: 0.7, ease: "expo.out" }, 0.35);
      tl.fromTo("#cardR", { x: 920, rotate: 3 }, { x: 0, rotate: 0, duration: 0.7, ease: "expo.out" }, 0.35);
      // 底部关键词横幅
      tl.fromTo("#banner", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 1.0);
      tl.to("#bnhl", { scaleX: 1, duration: 0.36, ease: "power2.inOut" }, 1.45);
      // 贴纸从上方旋转砸入 + 2 帧回弹
      tl.fromTo("#sticker", { y: -720, rotate: -480, opacity: 0 },
        { y: 0, rotate: 0, opacity: 1, duration: 0.42, ease: "power4.in" }, 1.7);
      tl.to("#sticker", { y: -16, duration: 0.07, ease: "power1.out" }, 2.12);
      tl.to("#sticker", { y: 0, duration: 0.07, ease: "power2.in" }, 2.19);
      // 砸下瞬间横幅/双卡轻震
      tl.fromTo(["#banner", "#cardL", "#cardR"], { y: 0 }, { y: 5, duration: 0.06, yoyo: true, repeat: 1, ease: "power1.inOut" }, 2.12);
      // 底部署名条
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 2.4);
      tl.fromTo([".pvs-foot .f1", ".pvs-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 2.65);
      // 贴纸衰减摆动收停（4.3s 后完全静止，无 fade-out）
      tl.to("#sticker", { keyframes: [
        { rotate: 6, duration: 0.35, ease: "sine.inOut" },
        { rotate: -4, duration: 0.35, ease: "sine.inOut" },
        { rotate: 2, duration: 0.35, ease: "sine.inOut" },
        { rotate: 0, duration: 0.35, ease: "power2.out" }
      ] }, 2.9);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
