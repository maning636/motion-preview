<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"LLM 对话流"},{"id":"subtitle","type":"string","label":"副标题","default":"多轮问答如何逐步收敛"},{"id":"messages","type":"string","label":"消息（\\n 分隔，前缀 user: / assistant:）","default":"user: 帮我写一个 Python 爬虫\\nassistant: 好的，需要先确定目标网站结构\\nuser: 目标是新闻列表页\\nassistant: 那我们可以用 requests + BeautifulSoup 提取标题和链接"},{"id":"duration","type":"number","label":"总时长（秒）","default":6},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      body{ font-family: 'MEBHeiHeiTi', sans-serif; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e); color: var(--foreground, #f4efe7);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title-area{ margin-bottom: 48px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0 0 12px; font-size: 72px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .subtitle{ margin: 0; font-size: 32px; font-weight: 400; color: #6B7280;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .thread{ display: flex; flex-direction: column; gap: 28px; max-width: 1240px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .msg{ display: flex; gap: 20px; opacity: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .msg.user{ justify-content: flex-end;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .msg.assistant{ justify-content: flex-start;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .avatar{ width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .msg.user .avatar{ background: #3a3029; color: #f4efe7; order: 2;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .msg.assistant .avatar{ background: var(--accent); color: #12100e;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .bubble{ max-width: 760px; padding: 22px 28px; border-radius: 12px; font-size: 24px; line-height: 1.5;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .msg.user .bubble{ background: #3a3029; color: #f4efe7; order: 1; border-bottom-right-radius: 4px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .msg.assistant .bubble{ background: #211c18; color: #6B7280; border-bottom-left-radius: 4px; border: 1px solid #3a3029;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title-area">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="thread" id="thread"></div>
      </section>
    </div>
    <script>
      const fallback = { title: "LLM 对话流", subtitle: "多轮问答如何逐步收敛", messages: "user: 帮我写一个 Python 爬虫\nassistant: 好的，需要先确定目标网站结构\nuser: 目标是新闻列表页\nassistant: 那我们可以用 requests + BeautifulSoup 提取标题和链接", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      document.documentElement.style.setProperty("--accent", v.accent);
      document.getElementById("root").style.backgroundColor = v.background;
      document.getElementById("root").style.color = v.foreground;
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;

      const thread = document.getElementById("thread");
      const msgs = v.messages.split(/\n|\\n/).filter(s => s.trim()).map(line => {
        const isUser = line.startsWith("user:");
        const content = line.replace(/^user:\s*/, "").replace(/^assistant:\s*/, "");
        return { isUser, content };
      });

      const msgElems = [];
      msgs.forEach(m => {
        const row = document.createElement("div"); row.className = `msg ${m.isUser ? "user" : "assistant"}`;
        const avatar = document.createElement("div"); avatar.className = "avatar"; avatar.textContent = m.isUser ? "U" : "AI";
        const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.textContent = m.content;
        row.appendChild(avatar); row.appendChild(bubble);
        thread.appendChild(row);
        msgElems.push(row);
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      msgElems.forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, y: 24, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0.7 + i * 0.35);
      });
      tl.to(".scene", { opacity: 0, scale: 1.01, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
