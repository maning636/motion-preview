<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"AI 自主程度光谱"},{"id":"subtitle","type":"string","label":"副标题","default":"从完全规则驱动到完全智能体驱动"},{"id":"leftPole","type":"string","label":"左极端","default":"规则驱动"},{"id":"rightPole","type":"string","label":"右极端","default":"智能体驱动"},{"id":"markerLabel","type":"string","label":"Marker 标签","default":"当前产品"},{"id":"markerPosition","type":"number","label":"Marker 位置（0–1）","default":0.62},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 56px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 12px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 400; opacity: 0.55; }
      .axis-area{ position: relative; width: 100%; height: 600px; display: flex; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .axis{ position: relative; width: 100%; height: 4px; background: rgba(244,239,231,0.18);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .pole{ position: absolute; top: 30px; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 28px; font-weight: 600; }
      .pole.left{ left: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .pole.right{ right: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .marker{ position: absolute; top: 50%; transform: translate(-50%, -50%); width: 28px; height: 28px; border-radius: 50%; background: var(--accent); border: 4px solid #12100e;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .marker-label{ position: absolute; top: -48px; transform: translateX(-50%); font-family: 'MEBHeiHeiTi', sans-serif; font-size: 22px; font-weight: 700; color: var(--accent); white-space: nowrap; }
      .marker-value{ position: absolute; top: 36px; transform: translateX(-50%); font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 16px; opacity: 0.5; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="axis-area">
          <div class="axis" id="axis">
            <div class="pole left" id="leftPole"></div>
            <div class="pole right" id="rightPole"></div>
            <div class="marker" id="marker">
              <div class="marker-label" id="markerLabel"></div>
              <div class="marker-value" id="markerValue"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "AI 自主程度光谱", subtitle: "从完全规则驱动到完全智能体驱动", leftPole: "规则驱动", rightPole: "智能体驱动", markerLabel: "当前产品", markerPosition: 0.62, accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      document.getElementById("leftPole").textContent = v.leftPole;
      document.getElementById("rightPole").textContent = v.rightPole;
      document.getElementById("markerLabel").textContent = v.markerLabel;
      const pos = Math.max(0, Math.min(1, Number(v.markerPosition) || 0));
      document.getElementById("markerValue").textContent = pos.toFixed(2);
      const marker = document.getElementById("marker");
      marker.style.left = (pos * 100) + "%";

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo(".axis", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 0.5);
      tl.fromTo(".pole", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.1, ease: "power2.out" }, 1.0);
      tl.fromTo("#marker", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 1.3);
      tl.fromTo(".marker-label, .marker-value", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.05, ease: "power2.out" }, 1.6);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
