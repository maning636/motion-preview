<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "label", "type": "string", "label": "主题", "default": "做一条知识视频"}, {"id": "beforeLabel", "type": "string", "label": "之前标签", "default": "过去"}, {"id": "beforeValue", "type": "number", "label": "之前数值", "default": 12}, {"id": "afterLabel", "type": "string", "label": "之后标签", "default": "现在"}, {"id": "afterValue", "type": "number", "label": "之后数值", "default": 3}, {"id": "unit", "type": "string", "label": "单位", "default": "小时"}, {"id": "conclusion", "type": "string", "label": "结论", "default": "流程被压缩到原来的 1/4"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #F5F0E6); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #F5F0E6); color: var(--foreground, #1D1D20);
  font-family:'Noto Sans SC','PingFang SC',sans-serif; }
.scene{ position:absolute; inset:0; padding:64px 80px; }
.card{ background:#FFFDF7; border:3px solid #1D1D20; border-radius:16px; box-shadow:6px 6px 0 #2A292B; }
.tape{ position:absolute; width:120px; height:32px; background:rgba(185,232,51,.6); border:2px solid #1D1D20;
  border-radius:4px; transform:rotate(-5deg); z-index:5; }
.tape.pink{ background:rgba(241,59,136,.35); transform:rotate(4deg); }
.tape.blue{ background:rgba(62,123,242,.3); transform:rotate(-3deg); }
.chip{ display:inline-flex; align-items:center; gap:8px; padding:6px 14px; background:#FFFDF7; border:3px solid #1D1D20;
  border-radius:999px; font-family:'Fredoka','Arial Rounded MT Bold',sans-serif; font-weight:700; font-size:18px;
  letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; box-shadow:4px 4px 0 #2A292B; }
.chip.lime{ background:#B9E833; } .chip.blue{ background:#3E7BF2; color:#FFFDF7; }
.chip.pink{ background:#F13B88; color:#FFFDF7; } .chip.orange{ background:#FF9F1C; }
.num{ font-family:'Fredoka','Arial Rounded MT Bold',sans-serif; font-weight:700; }
.mono{ font-family:'IBM Plex Mono','JetBrains Mono',monospace; font-weight:700; }
.dashline{ border:none; border-top:3px dashed #1D1D20; }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="6" data-track-index="1">

        <div style="position:absolute;left:50%;top:70px;transform:translateX(-50%);"><span class="chip orange" id="label"></span></div>
        <div id="panelL" class="card" style="position:absolute;left:120px;top:50%;transform:translateY(-50%);width:640px;padding:56px;text-align:center;">
          <span class="tape" style="left:-30px;top:-16px;"></span>
          <span class="chip" id="beforeLabel"></span>
          <div class="num" style="margin-top:26px;font-size:170px;line-height:1;color:#4D4A48;"><span id="beforeValue">0</span><span style="font-size:52px;" id="unitL"></span></div>
        </div>
        <div id="arrow" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);width:90px;height:90px;border-radius:50%;background:#B9E833;border:3px solid #1D1D20;box-shadow:5px 5px 0 #2A292B;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;">→</div>
        <div id="panelR" class="card" style="position:absolute;right:120px;top:50%;transform:translateY(-50%);width:640px;padding:56px;text-align:center;background:#B9E833;">
          <span class="tape blue" style="right:-30px;top:-16px;"></span>
          <span class="chip" id="afterLabel"></span>
          <div class="num" style="margin-top:26px;font-size:170px;line-height:1;"><span id="afterValue">0</span><span style="font-size:52px;" id="unitR"></span></div>
        </div>
        <div id="concl" class="chip lime" style="position:absolute;left:50%;bottom:64px;transform:translateX(-50%);font-size:22px;opacity:0;"></div>

      </section>
    </div>
    <script>
      const fallback = {"label": "做一条知识视频", "beforeLabel": "过去", "beforeValue": 12, "afterLabel": "现在", "afterValue": 3, "unit": "小时", "conclusion": "流程被压缩到原来的 1/4", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 6;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("label").textContent = v.label; $("beforeLabel").textContent = v.beforeLabel;
      $("afterLabel").textContent = v.afterLabel; $("unitL").textContent = v.unit; $("unitR").textContent = v.unit;
      $("concl").textContent = v.conclusion;
      tl.fromTo("#panelL", { x: -180, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#panelR", { x: 180, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.2);
      countTo($("beforeValue"), v.beforeValue, 0.6, 1.0);
      countTo($("afterValue"), v.afterValue, 0.9, 1.2);
      tl.to("#arrow", { scale: 1, duration: 0.5, ease: "back.out(2.5)" }, 1.2);
      tl.to("#concl", { opacity: 1, y: -10, duration: 0.4 }, 1.9);
      tl.to(".scene", { opacity: 0, duration: 0.5 }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
