<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "query", "type": "string", "label": "敲入字符", "default": "ai"}, {"id": "item1", "type": "string", "label": "候选1", "default": "AI 文案生成"}, {"id": "item2", "type": "string", "label": "候选2", "default": "AI 配音合成"}, {"id": "item3", "type": "string", "label": "候选3", "default": "打开素材库"}, {"id": "item4", "type": "string", "label": "候选4", "default": "渲染默认预设"}, {"id": "item5", "type": "string", "label": "候选5", "default": "分享项目链接"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#dash{ position:absolute; inset:0; filter:blur(0px) brightness(1); }
.side{ position:absolute; left:0; top:0; bottom:0; width:260px; background:#121218; border-right:1px solid rgba(255,255,255,.07); }
.dc{ position:absolute; border-radius:16px; background:#15151D; border:1px solid rgba(255,255,255,.08); }
#dim{ position:absolute; inset:0; background:#000; opacity:0; }
#pal{ position:absolute; left:600px; top:250px; width:720px; border-radius:18px; background:#1B1B24;
  border:1px solid rgba(255,255,255,.16); box-shadow:0 30px 90px rgba(0,0,0,.6); opacity:0; overflow:hidden; }
.pin{ display:flex; align-items:center; gap:16px; padding:26px 30px; border-bottom:1px solid rgba(255,255,255,.09); }
.pin .kbd{ font-size:20px; color:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:4px 12px; }
.pin .qt{ font-size:32px; color:var(--fg); min-height:40px; }
.pin .cur{ width:16px; height:34px; background:var(--accent); }
.prow{ height:64px; display:flex; align-items:center; padding:0 30px; font-size:26px; color:rgba(255,255,255,.8);
  border-left:4px solid transparent; opacity:0; overflow:hidden; }
.prow.sel{ background:color-mix(in srgb, var(--accent) 10%, transparent); border-left-color:var(--accent); color:var(--fg); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
<div id="dash"><div class="side"></div><div class="dc" style="left:320px;top:120px;width:440px;height:300px"></div><div class="dc" style="left:800px;top:120px;width:440px;height:300px"></div><div class="dc" style="left:1280px;top:120px;width:440px;height:300px"></div><div class="dc" style="left:320px;top:470px;width:700px;height:420px"></div><div class="dc" style="left:1060px;top:470px;width:660px;height:420px"></div></div><div id="dim"></div><div id="pal"><div class="pin"><span class="kbd">⌘K</span><span class="qt" id="qt"></span><span class="cur" id="cur"></span></div><div class="prow" id="r1"></div><div class="prow" id="r2"></div><div class="prow" id="r3"></div><div class="prow" id="r4"></div><div class="prow" id="r5"></div></div>
    </div>
    <script>
      const FB = {"query": "ai", "item1": "AI 文案生成", "item2": "AI 配音合成", "item3": "打开素材库", "item4": "渲染默认预设", "item5": "分享项目链接", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

for(let i=1;i<=5;i++) $('#r'+i).textContent=v['item'+i]||'';
// 让路：压暗 + 模糊（10f）
tl.to('#dim',{opacity:.55,duration:F(10)},F(12));
tl.to('#dash',{filter:'blur(10px) brightness(.45)',duration:F(10)},F(12));
// 降临：-20px 弹落，过冲 +8 回正（与压暗跨骑）
tl.fromTo('#pal',{opacity:0,y:-20},{opacity:1,y:8,duration:F(8),ease:'power2.out'},F(18));
tl.to('#pal',{y:0,duration:F(7),ease:'power2.inOut'},F(26));
// 候选 5 行每 4f 错峰上浮
for(let i=1;i<=5;i++) tl.fromTo('#r'+i,{opacity:0,y:10},{opacity:1,y:0,duration:F(8)},F(32)+F((i-1)*4));
// 敲字收窄：两键间隔 ≥12f，行高塌缩 5→2（挤压感，非淡出）
tl.call(()=>{$('#qt').textContent=(v.query||'')[0]||'';},[],F(62));
tl.call(()=>{$('#qt').textContent=v.query||'';},[],F(74));
tl.to(['#r3','#r4','#r5'],{height:0,opacity:0,duration:F(10),ease:'power2.inOut'},F(76));
tl.set(['#r3','#r4','#r5'],{display:'none'},F(86));
// 选中定格：首条高亮，光标转常亮
tl.set('#r1',{className:'prow sel'},F(88));
for(let f=20;f<88;f+=8){ tl.set('#cur',{opacity:0},F(f)); tl.set('#cur',{opacity:1},F(f+4)); }
tl.set('#cur',{opacity:1},F(88));
tl.to({},{duration:F(62)},F(88)); // 真静止

      window.__timelines.main = tl;
    </script>
  </body>
</html>
