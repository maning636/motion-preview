<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"pack","name":"规格包","type":"select","label":"规格包（配色 / 字体 / 曲线）","options":[{"label":"暗色科技","value":"dark"},{"label":"奶油贴纸","value":"cream"},{"label":"单色克制","value":"mono"},{"label":"夜航","value":"night"}],"default":"night"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":4.8},{"id":"bpm","name":"BPM","label":"每分钟拍数","default":124},{"id":"beatsPerBar","name":"拍号","label":"每小节拍数（2~7）","default":4}]'>

<title>节拍地图 · 一条按 BPM 重排的时间轴</title>

<script src="../_lib/packs.js"></script>
<style>
  /* 底色和字色**必须来自规格包**，不能写死。

     压在这个写死的黑底上 → 标题、标签、说明全糊掉。

  .phase .pt{font-size:32px;font-weight:700;color:var(--pk-fg);margin-top:12px}

  /* ── 节拍地图 ── */
  .taxis{position:absolute;left:120px;top:560px;width:1680px;height:3px;

  .barlab{position:absolute;opacity:0;font-family:ui-monospace,Consolas,monospace;

  .barlab.down{color:var(--pk-accent);font-size:30px}
  .bpmbox{position:absolute;right:120px;top:104px;opacity:0;text-align:right}
  .bpmbox .bv{font-family:ui-monospace,Consolas,monospace;font-size:64px;font-weight:800;
      color:var(--pk-accent);line-height:1}
  .bpmbox .bs{font-size:22px;color:var(--pk-muted);margin-top:10px;
      font-family:ui-monospace,Consolas,monospace;letter-spacing:.10em}
  .evrow{position:absolute;left:120px;width:1680px;height:66px;opacity:0;
      border-top:1px solid rgba(244,241,234,.10)}
  .evrow .et{position:absolute;left:0;top:16px;font-size:30px;font-weight:700;
      color:var(--pk-fg)}
  .evrow .ed{position:absolute;left:0;top:0;font-family:ui-monospace,Consolas,monospace;

  /* ── 卡点标题 ── */
  .cdwrap{position:absolute;left:120px;top:300px;width:1680px;height:340px;
      display:flex;align-items:center;justify-content:center}
  .cdword{position:absolute;font-size:150px;font-weight:900;line-height:1;
      color:var(--pk-fg);opacity:0;white-space:nowrap;letter-spacing:.04em}
  .cdbar{position:absolute;left:120px;bottom:150px;width:0;height:6px;
      background:var(--pk-accent);border-radius:3px}
  .cdmeta{position:absolute;right:120px;top:110px;opacity:0;text-align:right;
      font-family:ui-monospace,Consolas,monospace;font-size:26px;font-weight:800;
      color:var(--pk-muted);letter-spacing:.14em}

  /* ── 节拍环 ── */
  .ringwrap{position:absolute;left:400px;top:540px;width:0;height:0}
  .ringdot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
      background:rgba(244,241,234,.22);opacity:0}
  .ringdot.on{background:var(--pk-accent);box-shadow:0 0 0 10px rgba(232,160,72,.20)}
  .ringhand{position:absolute;left:-2px;top:-230px;width:4px;height:230px;
      background:linear-gradient(to top,rgba(232,160,72,0),var(--pk-accent));opacity:0;
      transform-origin:50% 100%}
  .ringmid{position:absolute;left:400px;top:540px;width:0;height:0;opacity:0;text-align:center}
  .ringmid .rn{font-family:ui-monospace,Consolas,monospace;font-size:96px;font-weight:900;
      color:var(--pk-fg);line-height:1}
  .ringmid .rs{font-size:24px;color:var(--pk-muted);margin-top:14px;

  .ringside{position:absolute;left:900px;top:430px;width:900px;opacity:0}
  .ringside .st{font-size:30px;color:var(--pk-muted);
      font-family:ui-monospace,Consolas,monospace;letter-spacing:.16em}
  .ringside .sx{margin-top:24px;font-size:52px;font-weight:800;line-height:1.4;
      color:var(--pk-fg)}
  .ringside .sy{margin-top:22px;font-size:28px;line-height:1.5;
      color:var(--pk-muted)}

  /* ── 波形 ── */
  .wave{position:absolute;left:120px;top:360px;width:1680px;height:340px;
      display:flex;align-items:center;gap:0}
  .wbar{flex:1 1 0;background:rgba(244,241,234,.26);height:20%;opacity:0;
      border-radius:2px 2px 0 0}
  .wbar.down{background:var(--pk-accent)}
  .wlab{position:absolute;opacity:0;font-family:ui-monospace,Consolas,monospace;
      font-size:22px;font-weight:800;color:var(--pk-muted);text-align:center}
  .wlab.down{color:var(--pk-accent);font-size:26px}

  /* ── 倒数起拍 ── */
  .count{position:absolute;left:120px;top:300px;width:1680px;height:300px;
      display:flex;align-items:center;justify-content:center}
  .count .cn{font-size:280px;font-weight:900;line-height:1;color:var(--pk-fg);opacity:0;
      font-variant-numeric:tabular-nums}
  .count .cn.hit{color:var(--pk-accent)}
  .ctitle{position:absolute;left:0;right:0;top:700px;opacity:0;text-align:center;
      font-size:88px;font-weight:900;line-height:1.25;color:var(--pk-fg);padding:0 120px}

  /* ── 段落标记 ── */
  .segbar{position:absolute;left:120px;top:400px;width:0;height:120px;opacity:0;
      display:flex;border-radius:10px;overflow:hidden}
  .seg{position:relative;height:100%;display:flex;align-items:center;
      justify-content:center;font-family:ui-monospace,Consolas,monospace;
      font-size:22px;font-weight:800;letter-spacing:.14em;overflow:hidden}
  .segcard{position:absolute;top:560px;opacity:0}
  .segcard .sn{font-size:32px;font-weight:800;color:var(--pk-fg)}
  .segcard .sd{font-size:24px;color:var(--pk-muted);margin-top:12px}
  .segtick{position:absolute;top:520px;width:2px;height:20px;
      background:rgba(244,241,234,.35);opacity:0}

</style>
</head>
<body>
<div id="stage">

  <div class="eyebrow" id="eb">THE GRID</div>
  <div class="h1" id="h1" data-fit-max="76" data-fit-min="44" style="width:1180px">这一条片子，卡在这些点上</div>
  <div class="bpmbox" id="bpmbox">
    <div class="bv" id="bv">124</div>
    <div class="bs" id="bs"></div>
  </div>
  <div class="taxis" id="axis"></div>
  <div id="ticks"></div>
  <div id="barlabs"></div>
  
  <div class="evrow" id="ev0" style="top:600px">
    <div class="ed" id="ed0">BAR 1</div>
    <div class="et" id="et0" data-fit-max="30" data-fit-min="20">4 拍：只出数，不出画面</div>
  </div>

  <div class="evrow" id="ev1" style="top:670px">
    <div class="ed" id="ed1">BAR 2</div>
    <div class="et" id="et1" data-fit-max="30" data-fit-min="20">8 拍：底噪进来，字开始上</div>
  </div>

  <div class="evrow" id="ev2" style="top:740px">
    <div class="ed" id="ed2">BAR 3</div>
    <div class="et" id="et2" data-fit-max="30" data-fit-min="20">4 拍：唯一的重，所有元素同时进</div>
  </div>

  <div class="evrow" id="ev3" style="top:810px">
    <div class="ed" id="ed3">BAR 4</div>
    <div class="et" id="et3" data-fit-max="30" data-fit-min="20">4 拍：留白，字幕收</div>
  </div>

  <div class="footline" id="fline"></div>
  <div class="foot" id="foot" data-fit-max="34" data-fit-min="22">把 BPM 改一下，这条时间轴会整条重排——它不是标注，是真的算出来的。</div>

</div>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  var tl = B.tl();
  /* 规格包：先定风格，再建任何元素。
     画面素材的配色**不跟着包走**——那是"底片"，用户自己的东西不能被模板改色；
     跟着包走的只有 UI 层（字色、强调色、描边、圆角、曲线）。这个边界必须守住。 */
  B.pack(v.pack);
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  function q(s) { return document.querySelector(s); }
  /* 素材位接真视频：留空就继续用 CSS 画面 */
  function live(n, src) {
    if (!src) return;
    var s = document.getElementById('s' + n), e = document.getElementById('v' + n);
    if (!s || !e) return;
    s.classList.add('live'); e.src = src;
    e.play().catch(function () {});
  }
  /* 景别缓推：v1/v3 里画面始终在极慢地动，这是「像镜头」的关键 */
  function push(n, at, dur, from, to, ease) {
    var s = q('#s' + n + ' .sky'), g = q('#s' + n + ' .glow'), r = q('#s' + n + ' .r2');
    if (s) tl.fromTo(s, { scale: from, y: '0%' },
      { scale: to, y: '-2%', duration: dur, ease: ease || 'none' }, at);
    if (g) tl.fromTo(g, { xPercent: -4, opacity: .8 },
      { xPercent: 5, opacity: 1, duration: dur, ease: 'none' }, at);
    if (r) tl.fromTo(r, { xPercent: 0 },
      { xPercent: -2.5, duration: dur, ease: 'none' }, at);
  }
  /* clip-path 形状插值。
     两个坑都在这里踩过：
       1. GSAP 各版本对 clipPath 字符串补间的处理不一致，所以不直接补间它，
          改成补间一个 {t:0→1} 的代理对象，onUpdate 里自己算 8 个点；
       2. **from 必须是编译期常量，不能从元素当前状态读。**
          settle 会把时间轴来回扫；一旦回退越过一个已完成的补间，
          GSAP 会把它按 ratio 0 重渲——onUpdate 拿到的就是起点，
          形状会「弹回矩形」。写成常量后，形状是 t 的纯函数，
          停在任何一帧算出来都一样。
     相邻两段的 from 必须等于上一段的 to，这条由 Python 侧保证。 */
  function polyStr(pts) {
    return 'polygon(' + pts.map(function (p) {
      return p[0].toFixed(2) + '% ' + p[1].toFixed(2) + '%'; }).join(',') + ')';
  }
  function morph(el, from, to, at, dur, ease) {
    if (!el || !to || !from || from.length !== to.length) return;
    var st = { t: 0 };
    tl.to(st, { t: 1, duration: dur == null ? .7 : dur, ease: ease || 'power2.inOut',
      onUpdate: function () {
        el.style.clipPath = polyStr(from.map(function (p, i) {
          return [p[0] + (to[i][0] - p[0]) * st.t,
                  p[1] + (to[i][1] - p[1]) * st.t];
        }));
      } }, at);
  }
  /* 版式常量也要在 JS 侧给一份。上一版 px() 里直接写了 L / W——
     那是 Python 的变量名，浏览器里根本没有，一执行就 ReferenceError，
     整段脚本挂掉、时间轴是空的（DUR=0.00）。
     而 ERRS 当时报的是 none——因为 probe_full 的探针挂在组件脚本**之后**，
     连错误监听器都还没注册。和 §25 修的 D7 是同一个毛病。 */
  var L = 120, W = 1680;
  var bpm = Math.max(40, Math.min(220, parseFloat(v.bpm) || 124));
  var spb = 60 / bpm;
  var bpb = Math.max(2, Math.min(7, parseInt(v.beatsPerBar, 10) || 4));
  var BD = parseFloat(v.duration) || 4.8;  var BEATS = [];
  for (var i = 0; i * spb < BD - 0.001; i++) {
    BEATS.push({ i: i, t: +(i * spb).toFixed(4),
                 bar: Math.floor(i / bpb) + 1, down: (i % bpb) === 0 });
  }
  var BARS = BEATS.filter(function (b) { return b.down; });
  var ACCENT = BARS.filter(function (b) { return (b.bar - 1) % 4 === 0; });
  var BPMTXT = Math.round(bpm) + ' BPM';
  var BPMNOTE = bpb + '/4 · 一拍 ' + spb.toFixed(2) + 's · 共 ' + BARS.length + ' 小节';
  /* 拍在时间轴上的横向位置：一切版式都从这里来，不写死 */
  function px(t) { return (L + (t / BD) * W).toFixed(1) + 'px'; }
  set('eb', v.eyebrow); set('h1', v.title); set('foot', v.foot);
  set('bv', String(Math.round(bpm)));
  set('bs', BPMNOTE);
  var EV = [v.e1, v.e2, v.e3, v.e4];
  var tw = document.getElementById('ticks');
  var bl = document.getElementById('barlabs');
  BEATS.forEach(function (b) {
    var x = px(b.t);
    var tk = document.createElement('div');
    tk.className = 'tick ' + (b.down ? 'down' : 'up');
    tk.style.left = x;
    tk.style.opacity = '0';
    tw.appendChild(tk);
    if (b.down) {
      var lb2 = document.createElement('div');
      lb2.className = 'barlab down';
      lb2.style.left = x;
      lb2.style.top = '452px';
      lb2.style.transform = 'translateX(-50%)';
      lb2.style.opacity = '0';
      lb2.textContent = String(b.bar);
      bl.appendChild(lb2);
      tl.fromTo(lb2, { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: .3, ease: 'power2.out' }, b.t + .1);
    }
    tl.fromTo(tk, { scaleY: 0, transformOrigin: '50% 100%' },
        { scaleY: 1, opacity: 1, duration: .26,
          ease: b.down ? 'back.out(2.4)' : 'power2.out' }, b.t);
  });
  for (var k = 0; k < 4; k++) { set('et' + k, EV[k]); set('ed' + k, ''); }
  BARS.slice(0, 4).forEach(function (b, k) {
    set('ed' + k, 'BAR ' + b.bar);
    tl.fromTo('#ev' + k, { opacity: 0, x: -18 },
        { opacity: 1, x: 0, duration: .38, ease: 'power3.out' }, b.t + .12);
  });
  /* 行数是**运行时**算出来的（bpm / beatsPerBar / duration 都能改），
     而 body 里固定渲染了 4 行。强拍不足 4 个时，多出来那几行没有任何补间
     打开，永远停在 CSS 的 opacity:0——探针的 F6 报的就是这个。
     它们是绝对定位、不占位，所以画面上看不出来；但「没人打开的隐藏元素」
     本身就是 §27.4 记的那类陷阱，留着迟早咬人。显式关掉。 */
  for (var kk = BARS.length; kk < 4; kk++) {
    tl.set('#ev' + kk, { opacity: 0 }, 0);
  }
  tl.fromTo('#eb', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .4 }, 0);
  tl.fromTo('#h1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .06);
  tl.fromTo('#bpmbox', { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: .5 }, .2);
  tl.fromTo('#axis', { scaleX: 0, transformOrigin: '0% 50%' },
      { scaleX: 1, duration: BD - .5, ease: 'none' }, .2);
  tl.fromTo('#fline', { width: 0 }, { width: 200, duration: .5, ease: 'power3.out' }, BD - .3);
  tl.fromTo('#foot', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .5 }, BD - .18);
  B.hold(tl, BD + .4, .4);
  B.fitAll();

})();
</script>
</body>
</html>
