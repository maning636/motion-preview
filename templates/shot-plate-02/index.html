<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "card1", "type": "string", "label": "页卡1标题", "default": "模板库"}, {"id": "card2", "type": "string", "label": "页卡2标题", "default": "导演台"}, {"id": "card3", "type": "string", "label": "页卡3标题", "default": "渲染队列"}, {"id": "slogan", "type": "string", "label": "收场巨字", "default": "模板即生产力"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#stage{ position:absolute; inset:0; perspective:1400px; }
.fc{ position:absolute; left:660px; top:300px; width:600px; height:420px; border-radius:22px;
  background:#16161F; border:1px solid rgba(255,255,255,.16); padding:34px;
  box-shadow:0 30px 90px rgba(0,0,0,.55); transform-style:preserve-3d; }
.fc .ft{ font-size:36px; color:var(--fg); margin-bottom:24px; }
.fc i{ display:block; height:13px; border-radius:7px; background:rgba(255,255,255,.15); margin-bottom:13px; }
.fc b{ display:block; height:120px; border-radius:12px; background:linear-gradient(135deg,color-mix(in srgb, var(--accent) 28%, transparent),color-mix(in srgb, var(--accent) 6%, transparent)); margin-bottom:20px; }
#ringbox{ position:absolute; inset:0; pointer-events:none; }
#big{ position:absolute; left:0; right:0; top:430px; text-align:center; font-size:150px; opacity:0;
  background:linear-gradient(90deg,#FF7AD9,#B78CFF 45%,#00FF00); -webkit-background-clip:text; background-clip:text; color:transparent;
  -webkit-text-stroke:2px rgba(255,255,255,.25); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
<div id="stage"><div class="fc" id="fc0"><div class="ft" id="t1"></div><b></b><i></i><i style="width:74%"></i><i style="width:58%"></i></div><div class="fc" id="fc1"><div class="ft" id="t2"></div><b></b><i></i><i style="width:74%"></i><i style="width:58%"></i></div><div class="fc" id="fc2"><div class="ft" id="t3"></div><b></b><i></i><i style="width:74%"></i><i style="width:58%"></i></div></div><svg id="ringbox" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><filter id="turb"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="90"/></filter><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9EC6"/><stop offset="1" stop-color="#9A6BFF"/></linearGradient></defs><circle id="ring" cx="960" cy="540" r="60" fill="none" stroke="url(#rg)" stroke-width="46" opacity="0" filter="url(#turb)"/></svg><div id="big"></div>
    </div>
    <script>
      const FB = {"card1": "模板库", "card2": "导演台", "card3": "渲染队列", "slogan": "模板即生产力", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#t1').textContent=v.card1||'';$('#t2').textContent=v.card2||'';$('#t3').textContent=v.card3||'';
$('#big').textContent=v.slogan||'';
// 翻飞：侧棱薄边(ry≈88°)→阶梯站定，单条 out-cubic 44f 保证丝滑；三卡大幅重叠成一叠
const LAND=[{x:-120,y:-56,ry:-10,rx:4,rz:-3,s:1.74},{x:0,y:0,ry:0,rx:0,rz:0,s:1.66},{x:120,y:56,ry:10,rx:-4,rz:3,s:1.6}];
LAND.forEach((L,i)=>{
  const el='#fc'+i;
  tl.set(el,{zIndex:10+i},0);
  tl.fromTo(el,{rotationY:88,x:-260+i*40,y:120,scale:1.2,opacity:0},
    {rotationY:L.ry,rotationX:L.rx,rotationZ:L.rz,x:L.x,y:L.y,scale:L.s,opacity:1,duration:F(44),ease:'power3.out'},F(i*3));
});
// 站定慢转不停（+0.34°/f，30f 共 ~10°）
tl.to('.fc',{rotationY:'+=10',duration:F(30),ease:'none'},F(48));
// 收束：10f ease-in 吸入中心缩小，透明度前 60% 满格
tl.to('.fc',{x:0,y:0,scale:0,duration:F(10),ease:'power2.in'},F(80));
tl.to('.fc',{opacity:0,duration:F(4)},F(86));
// 单个湍流烟雾环：减速外扩缓慢长大、衰减极慢
tl.set('#ring',{opacity:.95},F(88));
tl.to('#ring',{attr:{r:820,'stroke-width':120},duration:F(50),ease:'power2.out'},F(88));
tl.to('#ring',{opacity:0,duration:F(42),ease:'power1.out'},F(96));
// 巨字横贯收场：渐显+微放大
tl.fromTo('#big',{opacity:0,scale:.94},{opacity:1,scale:1.05,duration:F(26),ease:'power2.out'},F(96));
tl.to({},{duration:F(26)},F(124));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
