<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"windowTitle","type":"string","label":"终端标题","default":"~/projects/rag-demo · zsh"},{"id":"command","type":"string","label":"命令","default":"curl -s https://api.example.com/v1/search | jq .results[0]"},{"id":"output","type":"string","label":"输出内容（\n 分隔）","default":"{\n  \"title\": \"RAG 最佳实践\",\n  \"score\": 0.94,\n  \"source\": \"docs/retrieval.md\"\n}"},{"id":"meta","type":"string","label":"尾部元数据","default":"tokens: 1,240 · latency: 420ms · cost: $0.002"},{"id":"duration","type":"number","label":"总时长（秒）","default":6},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>

    <style>

  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';

  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden; display: flex; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .terminal{ width: 1400px; border: 1px solid rgba(244,239,231,0.18); border-radius: 10px; overflow: hidden; background: rgba(244,239,231,0.02);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .term-header{ height: 48px; border-bottom: 1px solid rgba(244,239,231,0.12); display: flex; align-items: center; gap: 10px; padding: 0 18px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .term-dot{ width: 12px; height: 12px; border-radius: 50%;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .term-title{ margin-left: 14px; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 15px; opacity: 0.55; }
      .term-body{ padding: 32px 36px; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; line-height: 1.6; min-height: 520px; }
      .prompt{ color: var(--accent); margin-right: 10px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .cursor{ display: inline-block; width: 12px; height: 24px; background: var(--accent); animation: blink 1s steps(1) infinite; vertical-align: middle;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
      .output{ margin-top: 18px; white-space: pre-wrap; opacity: 0.85;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .meta{ margin-top: 28px; font-size: 16px; opacity: 0.45;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="terminal">
          <div class="term-header">
            <span class="term-dot" style="background:#FF5F57"></span>
            <span class="term-dot" style="background:#FEBC2E"></span>
            <span class="term-dot" style="background:#28C840"></span>
            <span class="term-title" id="windowTitle"></span>
          </div>
          <div class="term-body">
            <div><span class="prompt">$</span><span id="cmd"></span><span class="cursor" id="cursor"></span></div>
            <div class="output" id="output"></div>
            <div class="meta" id="meta"></div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { windowTitle: "~/projects/rag-demo · zsh", command: "curl -s https://api.example.com/v1/search | jq .results[0]", output: "{\n  \"title\": \"RAG 最佳实践\",\n  \"score\": 0.94,\n  \"source\": \"docs/retrieval.md\"\n}", meta: "tokens: 1,240 · latency: 420ms · cost: $0.002", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("windowTitle").textContent = v.windowTitle;
      document.getElementById("cmd").textContent = v.command;
      document.getElementById("output").textContent = v.output;
      document.getElementById("meta").textContent = v.meta;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".terminal", { opacity: 0, y: 40, scale: 0.98 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.fromTo(".term-header", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.4);
      const cmdEl = document.getElementById("cmd");
      const fullCmd = v.command;
      cmdEl.textContent = "";
      tl.to({}, { duration: fullCmd.length * 0.03, onUpdate: function() {
        const p = this.progress();
        cmdEl.textContent = fullCmd.slice(0, Math.round(fullCmd.length * p));
      } }, 0.6);
      tl.fromTo(".output", { opacity: 0, y: 12 }, { opacity: 0.85, y: 0, duration: 0.5, ease: "power2.out" }, 1.6);
      tl.fromTo("#cursor", { opacity: 1 }, { opacity: 0, duration: 0.1 }, 1.5);
      tl.fromTo(".meta", { opacity: 0 }, { opacity: 0.45, duration: 0.4 }, 2.0);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
