    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#ground{ position:absolute; left:0; top:880px; width:1920px; height:4px;
  background:color-mix(in srgb, var(--fg) 30%, transparent); }
.bar{ position:absolute; bottom:200px; width:160px; border-radius:10px 10px 0 0; transform-origin:50% 100%;
  transform:scaleY(0); background:color-mix(in srgb, var(--fg) 16%, transparent);
  border:1px solid color-mix(in srgb, var(--fg) 25%, transparent); }
.bar.hot{ background:color-mix(in srgb, var(--accent) 75%, transparent); border-color:var(--accent); }
.blabel{ position:absolute; bottom:0; width:160px; text-align:center; font-size:44px; font-weight:900;
  opacity:0; font-family:'MiSans SemiBold',sans-serif; }
.sq{ position:absolute; width:14px; height:14px; border-radius:2px; will-change:transform,opacity; }

    </style>
  </head>
  <body>

="sq" id="sq1_2"></div><div class="sq" id="sq1_3"></div><div class="sq" id="sq1_4"></div><div class="sq" id="sq1_5"></div><div class="sq" id="sq1_6"></div><div class="sq" id="sq1_7"></div><div class="sq" id="sq1_8"></div><div class="sq" id="sq1_9"></div><div class="sq" id="sq1_10"></div><div class="sq" id="sq1_11"></div><div class="sq" id="sq1_12"></div><div class="sq" id="sq1_13"></div><div class="sq" id="sq1_14"></div><div class="sq" id="sq1_15"></div><div class="sq" id="sq1_16"></div><div class="sq" id="sq1_17"></div><div class="sq" id="sq1_18"></div><div class="sq" id="sq1_19"></div><div class="sq" id="sq1_20"></div><div class="sq" id="sq1_21"></div><div class="sq" id="sq1_22"></div><div class="sq" id="sq1_23"></div><div class="sq" id="sq1_24"></div><div class="sq" id="sq1_25"></div><div class="sq" id="sq1_26"></div><div class="sq" id="sq2_0"></div><div class="sq" id="sq2_1"></div><div class="sq" id="sq2_2"></div><div class="sq" id="sq2_3"></div><div class="sq" id="sq2_4"></div><div class="sq" id="sq2_5"></div><div class="sq" id="sq2_6"></div><div class="sq" id="sq2_7"></div><div class="sq" id="sq2_8"></div><div class="sq" id="sq2_9"></div><div class="sq" id="sq2_10"></div><div class="sq" id="sq2_11"></div><div class="sq" id="sq2_12"></div><div class="sq" id="sq2_13"></div><div class="sq" id="sq2_14"></div><div class="sq" id="sq2_15"></div><div class="sq" id="sq2_16"></div><div class="sq" id="sq2_17"></div><div class="sq" id="sq2_18"></div><div class="sq" id="sq2_19"></div><div class="sq" id="sq2_20"></div><div class="sq" id="sq2_21"></div><div class="sq" id="sq2_22"></div><div class="sq" id="sq2_23"></div><div class="sq" id="sq2_24"></div><div class="sq" id="sq2_25"></div><div class="sq" id="sq2_26"></div><div class="sq" id="sq2_27"></div><div class="sq" id="sq2_28"></div><div class="sq" id="sq2_29"></div><div class="sq" id="sq2_30"></div><div class="sq" id="sq2_31"></div><div class="sq" id="sq2_32"></div><div class="sq" id="sq2_33"></div><div class="sq" id="sq2_34"></div><div class="sq" id="sq2_35"></div><div class="sq" id="sq2_36"></div><div class="sq" id="sq2_37"></div><div class="sq" id="sq2_38"></div><div class="sq" id="sq2_39"></div><div class="sq" id="sq2_40"></div><div class="sq" id="sq2_41"></div><div class="sq" id="sq2_42"></div><div class="sq" id="sq2_43"></div><div class="sq" id="sq2_44"></div><div class="sq" id="sq2_45"></div><div class="sq" id="sq2_46"></div><div class="sq" id="sq2_47"></div><div class="sq" id="sq3_0"></div><div class="sq" id="sq3_1"></div><div class="sq" id="sq3_2"></div><div class="sq" id="sq3_3"></div><div class="sq" id="sq3_4"></div><div class="sq" id="sq3_5"></div><div class="sq" id="sq3_6"></div><div class="sq" id="sq3_7"></div><div class="sq" id="sq3_8"></div><div class="sq" id="sq3_9"></div><div class="sq" id="sq3_10"></div><div class="sq" id="sq3_11"></div><div class="sq" id="sq3_12"></div><div class="sq" id="sq3_13"></div><div class="sq" id="sq3_14"></div><div class="sq" id="sq3_15"></div><div class="sq" id="sq3_16"></div><div class="sq" id="sq3_17"></div>

    <script>
      const FB = {"accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

const G=880, H=[560,380,680,260], X=[420,720,1020,1320];
const hot=[false,false,true,false];
// 粒子：闭式坠落（重力加速），落地 15% 单次回弹，柱间错峰 6f
const sqs=[];
for(let b=0;b<4;b++){
  const cnt=Math.floor(H[b]/14);
  for(let k=0;k<cnt;k++){
    const el=$('#sq'+b+'_'+k);
    el.style.background=hot[b]?'var(--accent)':'color-mix(in srgb, var(--fg) 45%, transparent)';
    const start=b*6+k*1.2;
    const landY=G-14-k*14;             // 堆在已落粒子上
    const dist=landY-(-30);
    const g=1.6;                        // px/f²
    const tFall=Math.sqrt(2*dist/g);
    sqs.push({el,x:X[b]+((k%3)-1)*3,start,landY,dist,g,tFall});
  }
}
const sim={n:0};
function paintSq(){
  for(const p of sqs){
    const n=sim.n-p.start;
    if(n<=0){ p.el.style.opacity=0; continue; }
    let y,op=1;
    if(n<p.tFall){
      y=-30+0.5*p.g*n*n;
    }else{
      const bn=n-p.tFall;
      const bh=14*0.15*Math.sin(Math.PI*Math.min(1,bn/6));
      y=p.landY-bh;
    }
    p.el.style.opacity=op;
    p.el.style.transform='translate('+p.x+'px,'+y+'px)';
  }
}
paintSq();
tl.to(sim,{n:110,duration:F(110),ease:'none',onUpdate:paintSq},0);
// 堆满→粒子面淡出→实体柱+标签 back-out 弹出
tl.to('.sq',{opacity:0,duration:F(8)},F(100));
for(let b=0;b<4;b++){
  tl.to('#bar'+b,{scaleY:1,duration:F(8),ease:'back.out(1.4)'},F(104+b*2));
  tl.to('#bl'+b,{opacity:1,duration:F(6),ease:'back.out(2)'},F(110+b*2));
}
// 收尾真静止（补齐到 135f）
tl.to({},{duration:F(19)},F(116));

      window.__timelines.main = tl;
    </script>
  </body>
