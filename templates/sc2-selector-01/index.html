<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "kicker", "type": "string", "label": "眉题", "default": "PICKER · 选择器滚筒"}, {"id": "options", "type": "string", "label": "候选词（逗号分隔）", "default": "收集灵感，生成大纲，撰写初稿，排版美化，一键分发"}, {"id": "target", "type": "string", "label": "目标词（须在候选中）", "default": "撰写初稿"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .pc-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .pc-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .pc-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .pc-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 左栏文案 */
      .pc-copy{ position: absolute; left: 140px; top: 330px; width: 520px; z-index: 5; }
      .pc-kicker{ font-size: 22px; letter-spacing: .3em; color: #141414; }
      .pc-kicker b{ color: #9A9A92; font-weight: 400; }
      .pc-title{ margin-top: 30px; font-size: 84px; font-weight: 900; line-height: 1.2; }
      .pc-desc{ margin-top: 30px; font-family: 'MiSans SemiBold', sans-serif; font-size: 25px;
        line-height: 1.7; color: #55554E; }
      /* 滚筒选择器 */
      .pc-stage{ position: absolute; right: 220px; top: 170px; width: 640px; height: 740px; z-index: 4; }
      .pc-shadow{ position: absolute; left: 16px; top: 16px; width: 640px; height: 740px; background: #141414; }
      .pc-card{ position: absolute; left: 0; top: 0; width: 640px; height: 740px; background: #fff;
        border: 3px solid #141414; overflow: hidden; }
      .pc-view{ position: absolute; left: 60px; right: 60px; top: 110px; height: 520px; overflow: hidden; }
      .pc-list{ position: absolute; left: 0; right: 0; top: 0; }
      .pc-row{ height: 104px; display: flex; align-items: center; justify-content: center;
        font-family: 'MiSans SemiBold', sans-serif; font-size: 44px; color: #141414; will-change: transform, filter, opacity; }
      .pc-row .tick{ width: 18px; height: 18px; background: var(--ac, #00FF00); margin-right: 20px;
        flex: none; opacity: 0; }
      .pc-mask-t{ position: absolute; left: 0; right: 0; top: 0; height: 130px; z-index: 3; pointer-events: none;
        background: linear-gradient(#fff 20%, rgba(255,255,255,0)); }
      .pc-mask-b{ position: absolute; left: 0; right: 0; bottom: 0; height: 130px; z-index: 3; pointer-events: none;
        background: linear-gradient(rgba(255,255,255,0), #fff 80%); }
      /* 荧光绿咬合选框（焦点行正中，零位移） */
      .pc-frame{ position: absolute; left: 36px; right: 36px; top: 318px; height: 104px; z-index: 2; pointer-events: none; }
      .pc-frame .edge{ position: absolute; top: 0; bottom: 0; width: 46px; }
      .pc-frame .el{ left: 0; border-left: 6px solid var(--ac, #00FF00); border-top: 6px solid var(--ac, #00FF00);
        border-bottom: 6px solid var(--ac, #00FF00); }
      .pc-frame .er{ right: 0; border-right: 6px solid var(--ac, #00FF00); border-top: 6px solid var(--ac, #00FF00);
        border-bottom: 6px solid var(--ac, #00FF00); }
      .pc-frame .box{ position: absolute; inset: 0; border: 6px solid var(--ac, #00FF00); opacity: 0; }
      .pc-cap{ position: absolute; left: 60px; top: 40px; font-size: 19px; letter-spacing: .26em; color: #9A9A92; }
      .pc-cap b{ color: #141414; font-weight: 400; }
      /* 底部绿色署名条 */
      .pc-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        clip-path: inset(100% 0% 0% 0%); }
      .pc-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .pc-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="pc-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol">VOL.15 · 视觉动效库</div>
        <div class="r mono" id="pageno">P.394 / 400</div>
      </div>
      <div class="pc-copy">
        <div class="pc-kicker mono" id="kicker"></div>
        <div class="pc-title" id="title">滚到那一个<br />就锁定</div>
        <div class="pc-desc" id="desc">候选词逐格滚过视口，停在目标词时荧光绿选框从两侧咬合锁定。</div>
      </div>
      <div class="pc-stage">
        <div class="pc-shadow" id="shadow"></div>
        <div class="pc-card" id="card">
          <div class="pc-cap mono" id="cap">ROLL · <b>SELECT ONE</b></div>
          <div class="pc-view" id="view">
            <div class="pc-list" id="list"></div>
            <div class="pc-mask-t"></div>
            <div class="pc-mask-b"></div>
          </div>
          <div class="pc-frame" id="frame">
            <div class="edge el" id="el"></div>
            <div class="edge er" id="er"></div>
            <div class="box" id="box"></div>
          </div>
        </div>
      </div>
      <div class="pc-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · PICKER CAROUSEL</div>
      </div>
    </div>
    <script>
      const fallback = {"kicker": "PICKER · 选择器滚筒", "options": "收集灵感，生成大纲，撰写初稿，排版美化，一键分发", "target": "撰写初稿", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("kicker").textContent = "";
      const kc = String(V.kicker).split("·");
      $("kicker").textContent = kc[0].trim();
      if (kc[1]) { const b = document.createElement("b"); b.textContent = " · " + kc.slice(1).join("·").trim(); $("kicker").appendChild(b); }
      // 候选词列
      const opts = String(V.options).split(/[，,]/).map(s => s.trim()).filter(Boolean);
      let targetIdx = opts.indexOf(String(V.target).trim());
      if (targetIdx < 0) targetIdx = Math.floor(opts.length / 2);
      const ROW_H = 104, VIEW_H = 520;
      const list = $("list");
      list.textContent = "";
      const rows = opts.map((w) => {
        const r = document.createElement("div");
        r.className = "pc-row";
        const tick = document.createElement("span");
        tick.className = "tick";
        const t = document.createElement("span");
        t.textContent = w;
        r.appendChild(tick); r.appendChild(t);
        list.appendChild(r);
        return r;
      });
      // 距离衰减渲染：按 |i - pos| 控制透明度/缩放/模糊/对勾
      const proxy = { pos: 0 };
      function paint() {
        const p = proxy.pos;
        list.style.transform = `translateY(${VIEW_H / 2 - ROW_H / 2 - p * ROW_H}px)`;
        rows.forEach((r, i) => {
          const d = Math.abs(i - p);
          const op = d < 0.5 ? 1 : d < 1.5 ? 0.5 : 0.16;
          const sc = 1 - Math.min(1, d / 2) * 0.16;
          const blur = d < 0.5 ? 0 : Math.min(3.2, (d - 0.5) * 3.2);
          r.style.opacity = op.toFixed(3);
          r.style.transform = `scale(${sc.toFixed(3)})`;
          r.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : "none";
          r.querySelector(".tick").style.opacity = Math.max(0, 1 - d * 1.8).toFixed(3);
        });
      }
      paint();
      // 页眉
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      // 左栏
      tl.fromTo("#kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45 }, 0.3);
      tl.fromTo("#title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.45);
      tl.fromTo("#desc", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45 }, 0.95);
      // 滚筒卡入场
      tl.fromTo("#shadow", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.65);
      tl.fromTo("#card", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.6);
      // 逐格吸附滚动到目标词（outQuint 减速 + 格间静止）
      let t = 1.5;
      for (let s = 1; s <= targetIdx; s++) {
        tl.to(proxy, { pos: s, duration: 0.62, ease: "power4.out", onUpdate: paint }, t);
        t += 1.05;
      }
      const landT = t - 0.43; // 最后一步吸附完成时刻
      // 荧光绿选框从两侧咬合锁定
      tl.fromTo("#el", { x: -140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, ease: "expo.out" }, landT);
      tl.fromTo("#er", { x: 140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, ease: "expo.out" }, landT);
      tl.to("#box", { opacity: 1, duration: 0.1 }, landT + 0.3);
      tl.fromTo("#frame", { scale: 1.05 }, { scale: 1, duration: 0.22, ease: "power2.out" }, landT + 0.3);
      tl.fromTo(rows[targetIdx], { scale: 1 }, { scale: 1.06, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, landT + 0.3);
      // 底部署名条（clip-path 自底向上揭示，包围盒全程不出画布）
      tl.to("#foot", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "expo.out" }, landT + 0.55);
      tl.fromTo([".pc-foot .f1", ".pc-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, landT + 0.8);
      // 尾部定格段：把时间轴撑满 6s，锁定后画面静止可读
      tl.to({}, { duration: 0.1 }, 5.9);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
