<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"跨角色协作流程"},{"id":"subtitle","type":"string","label":"副标题","default":"产品、设计、开发在各阶段的职责"},{"id":"roles","type":"string","label":"角色（逗号分隔）","default":"产品,设计,开发"},{"id":"steps","type":"string","label":"步骤（格式：role:label，\\n 分隔）","default":"产品:需求评审\\n设计:输出原型\\n产品:确认原型\\n开发:技术评审\\n开发:功能开发\\n设计:验收 UI\\n产品:验收功能"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      body{ font-family: 'MEBHeiHeiTi', sans-serif; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e); color: var(--foreground, #f4efe7);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title-area{ margin-bottom: 40px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0 0 12px; font-size: 72px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .subtitle{ margin: 0; font-size: 32px; font-weight: 400; color: #6B7280;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-area{ position: relative; width: 100%; height: 640px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-svg{ width: 100%; height: 100%; overflow: visible;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .lane-line{ stroke: #3a3029; stroke-width: 2;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .lane-label{ fill: #6B7280; font-size: 18px; font-weight: 600;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .step-box{ fill: #211c18; stroke: #3a3029; stroke-width: 2;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .step-text{ fill: #f4efe7; font-size: 18px; font-weight: 600; text-anchor: middle;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .step-active{ fill: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .step-text-active{ fill: #12100e;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .connector{ fill: none; stroke: #6B7280; stroke-width: 2.5; marker-end: url(#laneArrow); opacity: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title-area">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <svg class="chart-svg" id="chart-svg" viewBox="0 0 1696 640" preserveAspectRatio="xMidYMid meet">
            <defs>
              <marker id="laneArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                <polygon points="0 0, 10 3, 0 6" fill="#6B7280" />
              </marker>
            </defs>
          </svg>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "跨角色协作流程", subtitle: "产品、设计、开发在各阶段的职责", roles: "产品,设计,开发", steps: "产品:需求评审\n设计:输出原型\n产品:确认原型\n开发:技术评审\n开发:功能开发\n设计:验收 UI\n产品:验收功能", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      document.documentElement.style.setProperty("--accent", v.accent);
      document.getElementById("root").style.backgroundColor = v.background;
      document.getElementById("root").style.color = v.foreground;
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;

      const roles = v.roles.split(",");
      const steps = v.steps.split("\\n").map(s => {
        const [role, label] = s.split(":");
        return { role: role.trim(), label: label.trim() };
      });

      const svg = document.getElementById("chart-svg");
      const chartW = 1696, chartH = 640;
      const laneH = chartH / roles.length;
      const marginLeft = 120, marginRight = 80;
      const plotW = chartW - marginLeft - marginRight;

      roles.forEach((role, i) => {
        const y = i * laneH;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", marginLeft); line.setAttribute("x2", chartW - marginRight); line.setAttribute("y1", y); line.setAttribute("y2", y); line.setAttribute("class", "lane-line lane-elem"); line.setAttribute("opacity", "0"); svg.appendChild(line);
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", 30); label.setAttribute("y", y + laneH / 2 + 6); label.setAttribute("class", "lane-label lane-elem"); label.textContent = role; label.setAttribute("opacity", "0"); svg.appendChild(label);
      });
      const bottomLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
      bottomLine.setAttribute("x1", marginLeft); bottomLine.setAttribute("x2", chartW - marginRight); bottomLine.setAttribute("y1", chartH); bottomLine.setAttribute("y2", chartH); bottomLine.setAttribute("class", "lane-line lane-elem"); bottomLine.setAttribute("opacity", "0"); svg.appendChild(bottomLine);

      const stepSpacing = plotW / (steps.length + 1);
      const stepElems = [];
      steps.forEach((step, i) => {
        const roleIdx = roles.indexOf(step.role);
        if (roleIdx < 0) return;
        const x = marginLeft + stepSpacing * (i + 1);
        const y = roleIdx * laneH + laneH / 2;
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", x - 90); rect.setAttribute("y", y - 28); rect.setAttribute("width", 180); rect.setAttribute("height", 56); rect.setAttribute("rx", 6); rect.setAttribute("class", "step-box step-node"); rect.setAttribute("opacity", "0"); svg.appendChild(rect);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", x); text.setAttribute("y", y + 6); text.setAttribute("class", "step-text step-label"); text.textContent = step.label; text.setAttribute("opacity", "0"); svg.appendChild(text);
        stepElems.push({ rect, text, x, y });
      });

      const connElems = [];
      for (let i = 0; i < stepElems.length - 1; i++) {
        const a = stepElems[i], b = stepElems[i + 1];
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${a.x + 90} ${a.y} L ${b.x - 90} ${b.y}`);
        path.setAttribute("class", "connector conn-line"); path.setAttribute("opacity", "0"); svg.appendChild(path);
        connElems.push(path);
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo(".lane-elem", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.05, ease: "sine.out" }, 0.5);
      stepElems.forEach((se, i) => {
        tl.fromTo([se.rect, se.text], { opacity: 0, y: 16, scale: 0.95, transformOrigin: "center" }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power2.out" }, 0.9 + i * 0.15);
      });
      connElems.forEach((conn, i) => {
        tl.fromTo(conn, { opacity: 0, strokeDasharray: 300, strokeDashoffset: 300 }, { opacity: 1, strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.2 + i * 0.15);
      });
      if (stepElems[0]) {
        tl.to(stepElems[0].rect, { fill: v.accent, stroke: v.accent, duration: 0.3 }, 2.8);
        tl.to(stepElems[0].text, { fill: "#12100e", duration: 0.3 }, 2.8);
      }
      tl.to(".scene", { opacity: 0, scale: 1.01, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
