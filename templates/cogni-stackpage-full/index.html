<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"pack","name":"规格包","type":"select","label":"规格包（配色 / 字体 / 曲线）","options":[{"label":"暗色科技","value":"dark"},{"label":"奶油贴纸","value":"cream"},{"label":"单色克制","value":"mono"},{"label":"夜航","value":"night"}],"default":"night"},{"id":"eyebrow","name":"眉标","type":"string","label":"顶部眉标","default":"THE LAYERS"},{"id":"title","name":"标题","type":"string","label":"标题","default":"一个目标拆到今天下午能做的动作"},{"id":"l1t","name":"目标层","type":"string","label":"第一层 目标","default":"把新客留到第二次"},{"id":"l1d","name":"目标层注解","type":"string","label":"第一层 注解","default":"目标层：这一层如果错了，下面两层做得再好也没用"},{"id":"l2t","name":"手段层","type":"string","label":"第二层 手段","default":"交付前 24 小时的一次主动回访"},{"id":"l2d","name":"手段层注解","type":"string","label":"第二层 注解","default":"手段层：只挑一个，其余全不做"},{"id":"l3t","name":"动作层","type":"string","label":"第三层 动作","default":"客服工单 + 一个「为什么回来」的选项"},{"id":"l3d","name":"动作层注解","type":"string","label":"第三层 注解","default":"动作层：能落到某个人今天下午的那张表上"},{"id":"foot","name":"收口","type":"string","label":"底部收口一句","default":"大部分计划死在第三层：写的是方向，交的是动作。中间那层是唯一能检验的。"}]'>
<head>

<meta name="description" content="三层：目标 / 手段 / 动作，越往下越窄。大多数计划死在第三层——写的是「方向」，交的是「动作」。中间那层是唯一能检验的。">
<title>拆层 · 从目标到今天下午的动作</title>

<script src="../_lib/packs.js"></script>
<style>
  /* 底色和字色**必须来自规格包**，不能写死。
     写死 #000 + #F4F1EA 的时候，四个包里只有 dark / night 正常：
     cream 的 --pk-fg 是 #2A2118、mono 是 #14140F，两个都是**深字**，
     压在这个写死的黑底上 → 标题、标签、说明全糊掉。
     而写死字面量色的元素（比如 rgba(244,241,234,.82)）反而还看得见，
     画面上就成了一半能看一半不能看——比全黑更难认。
     一共 33 条模板中招（混剪 5 + 认知 22 + 节拍 6）。

     注意区分两层契约（packs.css 顶部注释里写过）：
       --pk-bg / --pk-fg      = 包自带底板，舞台自己用它

     这里改的是前者。 */
  html,body{margin:0;padding:0;background:var(--pk-bg,#000)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--pk-bg,#000);
        color:var(--pk-fg,#F4F1EA);font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;

  .foot{position:absolute;left:120px;top:922px;width:1680px;opacity:0;

  .qwho{position:absolute;left:120px;opacity:0;

  .qrule{position:absolute;left:120px;width:0;height:2px;background:rgba(244,241,234,.28)}

  /* ── 曲线页 ── */
  .chart{position:absolute;left:120px;top:400px;width:1680px;height:400px}

  .grid{position:absolute;left:0;right:0;height:1px;background:rgba(244,241,234,.10)}
  .pivot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;

  .pvline{position:absolute;width:2px;background:rgba(232,160,72,.55);opacity:0}
  .pvlab{position:absolute;opacity:0;font-size:30px;font-weight:800;color:var(--pk-accent)}
  .phase{position:absolute;top:0;opacity:0}
  .phase .pn{font-family:ui-monospace,Consolas,monospace;font-size:24px;font-weight:800;
      letter-spacing:.18em;color:var(--pk-accent)}
  .phase .pt{font-size:32px;font-weight:700;color:var(--pk-fg);margin-top:12px}
  .phase .pd{font-size:25px;color:var(--pk-muted);margin-top:10px;line-height:1.45}

  /* ── 五问 ── */
  .phen{position:absolute;left:120px;top:296px;width:1680px;height:104px;opacity:0;
      border-left:6px solid var(--pk-accent);background:rgba(244,241,234,.05);
      display:flex;align-items:center;padding:0 36px}
  .phen .pt{font-size:48px;font-weight:800;color:var(--pk-fg)}
  .qrow{position:absolute;left:120px;width:1680px;height:80px;opacity:0}
  .qrow .qn{position:absolute;left:0;top:0;width:110px;font-family:ui-monospace,Consolas,monospace;
      font-size:24px;font-weight:800;letter-spacing:.14em;color:var(--pk-muted)}
  .qrow .qa{position:absolute;left:130px;top:-2px;font-size:36px;font-weight:700;
      color:var(--pk-fg)}
  .qrow .ln{position:absolute;left:14px;width:2px;background:rgba(232,160,72,.55)}
  .qrow .dt{position:absolute;left:6px;width:18px;height:18px;margin-top:-8px;border-radius:50%;
      background:rgba(244,241,234,.30)}
  .qrow.root .qa{color:var(--pk-fg);font-weight:900}
  .qrow.root .dt{background:var(--pk-accent);box-shadow:0 0 0 6px rgba(232,160,72,.18)}
  .qrow.root .qn{color:var(--pk-accent)}

  /* ── 张力 ── */
  .tbox{position:absolute;top:352px;width:790px;height:270px;opacity:0;
      border:1px solid rgba(244,241,234,.16);border-radius:18px;
      background:rgba(244,241,234,.03);padding:38px 40px;display:flex;
      flex-direction:column;justify-content:center}
  .tbox .tk{font-family:ui-monospace,Consolas,monospace;font-size:22px;font-weight:800;
      letter-spacing:.20em;color:var(--pk-muted)}
  .tbox .tv{margin-top:22px;font-size:44px;font-weight:800;line-height:1.42;color:var(--pk-fg)}
  .tbut{position:absolute;left:50%;top:452px;width:96px;height:96px;margin-left:-48px;opacity:0;
      border-radius:50%;background:var(--pk-bg);border:3px solid var(--pk-accent);
      display:flex;align-items:center;justify-content:center;
      font-size:32px;font-weight:900;color:var(--pk-accent)}
  .contra{position:absolute;left:120px;top:700px;width:1680px;opacity:0;
      border-top:2px solid rgba(232,160,72,.45);padding-top:34px;
      font-size:40px;font-weight:800;line-height:1.5;color:var(--pk-fg)}

  /* ── 前后 ── */
  .bah{position:absolute;left:120px;width:1680px;height:170px;opacity:0}
  .bah .metric{position:absolute;left:0;top:30px;width:520px;font-size:36px;font-weight:700;
      color:var(--pk-fg)}
  .bah .before{position:absolute;left:600px;top:24px;width:380px;text-align:right;
      font-size:44px;font-weight:800;color:var(--pk-muted);
      font-variant-numeric:tabular-nums}
  .bah .arrow{position:absolute;left:1000px;top:56px;width:140px;height:3px;
      background:rgba(244,241,234,.30)}
  .bah .after{position:absolute;left:1160px;top:24px;width:380px;
      font-size:44px;font-weight:900;color:var(--pk-accent);
      font-variant-numeric:tabular-nums}
  .bah .rule{position:absolute;left:0;right:0;top:0;height:1px;background:rgba(244,241,234,.10)}
  .bah .note3{position:absolute;left:130px;right:36px;top:96px;font-size:26px;line-height:1.45;
      color:var(--pk-muted)}

  /* ── 拆层 ── */
  .layer{position:absolute;left:50%;height:150px;opacity:0;
      border:1px solid rgba(244,241,234,.14);border-radius:14px;
      background:rgba(244,241,234,.04);display:flex;align-items:center;padding:0 40px}
  .layer .ln2{position:absolute;left:40px;top:0;bottom:0;width:6px;
      background:var(--pk-accent);border-radius:3px}
  .layer .lv{position:absolute;left:70px;top:30px;font-size:26px;font-weight:800;
      color:var(--pk-accent);font-family:ui-monospace,Consolas,monospace;letter-spacing:.10em}
  .layer .lb3{position:absolute;left:70px;top:70px;width:520px;font-size:38px;font-weight:800;
      color:var(--pk-fg)}
  .layer .ld3{position:absolute;left:620px;top:0;bottom:0;right:36px;display:flex;
      align-items:center;font-size:30px;line-height:1.45;color:var(--pk-fg)}

  /* ── 前提 ── */
  .prow{position:absolute;left:120px;width:1680px;height:170px;opacity:0}
  .prow .rule{position:absolute;left:0;right:0;top:0;height:1px;background:rgba(244,241,234,.10)}
  .prow .pn{position:absolute;left:0;top:28px;width:520px;font-size:34px;font-weight:800;
      color:var(--pk-fg)}
  .prow .pq{position:absolute;left:0;top:80px;width:520px;font-size:26px;line-height:1.45;
      color:var(--pk-muted)}
  .prow .pc{position:absolute;left:600px;top:32px;width:1080px;font-size:32px;line-height:1.5;
      color:var(--pk-fg)}
  .prow .pc b{color:var(--pk-accent);font-weight:800}

  /* ── 一句话 ── */
  .oneline{position:absolute;left:120px;top:352px;width:1680px;height:230px;opacity:0;
      border:1px solid rgba(232,160,72,.45);border-radius:20px;
      background:rgba(232,160,72,.07);display:flex;align-items:center;padding:0 48px}
  .oneline .ot{font-size:58px;font-weight:900;line-height:1.42;color:var(--pk-fg)}
  .sac{position:absolute;top:660px;width:520px;height:180px;opacity:0;
      border-left:4px solid rgba(244,241,234,.22);padding-left:28px;display:flex;
      flex-direction:column;justify-content:center}
  .sac .sn{font-family:ui-monospace,Consolas,monospace;font-size:22px;font-weight:800;
      letter-spacing:.18em;color:var(--pk-muted)}
  .sac .sx{font-size:30px;line-height:1.45;margin-top:16px;color:var(--pk-fg)}

</style>
</head>
<body>
<div id="stage">

  <div class="eyebrow" id="eb">THE LAYERS</div>
  <div class="h1" id="h1" data-fit-max="76" data-fit-min="44">一个目标拆到今天下午能做的动作</div>
  
  <div class="layer" id="ly0" style="left:120px;width:1680px;top:340px">
    <div class="ln2"></div>
    <div class="lv">GOAL</div>
    <div class="lb3" id="lyt0" data-fit-max="38" data-fit-min="24">把新客留到第二次</div>
    <div class="ld3" id="lyd0" data-fit-max="30" data-fit-min="20">目标层：这一层如果错了，下面两层做得再好也没用</div>
  </div>

  <div class="layer" id="ly1" style="left:210px;width:1500px;top:516px">
    <div class="ln2"></div>
    <div class="lv">MEANS</div>
    <div class="lb3" id="lyt1" data-fit-max="38" data-fit-min="24">交付前 24 小时的一次主动回访</div>
    <div class="ld3" id="lyd1" data-fit-max="30" data-fit-min="20">手段层：只挑一个，其余全不做</div>
  </div>

  <div class="layer" id="ly2" style="left:300px;width:1320px;top:692px">
    <div class="ln2"></div>
    <div class="lv">ACTION</div>
    <div class="lb3" id="lyt2" data-fit-max="38" data-fit-min="24">客服工单 + 一个「为什么回来」的选项</div>
    <div class="ld3" id="lyd2" data-fit-max="30" data-fit-min="20">动作层：能落到某个人今天下午的那张表上</div>
  </div>

  <div class="footline" id="fline"></div>
  <div class="foot" id="foot" data-fit-max="34" data-fit-min="22">大部分计划死在第三层：写的是「方向」，交的是「动作」。中间那层是唯一能检验的。</div>

</div>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  var tl = B.tl();
  /* 规格包：先定风格，再建任何元素。
     画面素材的配色**不跟着包走**——那是"底片"，用户自己的东西不能被模板改色；
     跟着包走的只有 UI 层（字色、强调色、描边、圆角、曲线）。这个边界必须守住。 */
  B.pack(v.pack);
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  function q(s) { return document.querySelector(s); }
  /* 素材位接真视频：留空就继续用 CSS 画面 */
  function live(n, src) {
    if (!src) return;
    var s = document.getElementById('s' + n), e = document.getElementById('v' + n);
    if (!s || !e) return;
    s.classList.add('live'); e.src = src;
    e.play().catch(function () {});
  }
  /* 景别缓推：v1/v3 里画面始终在极慢地动，这是「像镜头」的关键 */
  function push(n, at, dur, from, to, ease) {
    var s = q('#s' + n + ' .sky'), g = q('#s' + n + ' .glow'), r = q('#s' + n + ' .r2');
    if (s) tl.fromTo(s, { scale: from, y: '0%' },
      { scale: to, y: '-2%', duration: dur, ease: ease || 'none' }, at);
    if (g) tl.fromTo(g, { xPercent: -4, opacity: .8 },
      { xPercent: 5, opacity: 1, duration: dur, ease: 'none' }, at);
    if (r) tl.fromTo(r, { xPercent: 0 },
      { xPercent: -2.5, duration: dur, ease: 'none' }, at);
  }
  /* clip-path 形状插值。
     两个坑都在这里踩过：
       1. GSAP 各版本对 clipPath 字符串补间的处理不一致，所以不直接补间它，
          改成补间一个 {t:0→1} 的代理对象，onUpdate 里自己算 8 个点；
       2. **from 必须是编译期常量，不能从元素当前状态读。**
          settle 会把时间轴来回扫；一旦回退越过一个已完成的补间，
          GSAP 会把它按 ratio 0 重渲——onUpdate 拿到的就是起点，
          形状会「弹回矩形」。写成常量后，形状是 t 的纯函数，
          停在任何一帧算出来都一样。
     相邻两段的 from 必须等于上一段的 to，这条由 Python 侧保证。 */
  function polyStr(pts) {
    return 'polygon(' + pts.map(function (p) {
      return p[0].toFixed(2) + '% ' + p[1].toFixed(2) + '%'; }).join(',') + ')';
  }
  function morph(el, from, to, at, dur, ease) {
    if (!el || !to || !from || from.length !== to.length) return;
    var st = { t: 0 };
    tl.to(st, { t: 1, duration: dur == null ? .7 : dur, ease: ease || 'power2.inOut',
      onUpdate: function () {
        el.style.clipPath = polyStr(from.map(function (p, i) {
          return [p[0] + (to[i][0] - p[0]) * st.t,
                  p[1] + (to[i][1] - p[1]) * st.t];
        }));
      } }, at);
  }
  set('eb', v.eyebrow); set('h1', v.title); set('foot', v.foot);
  var TT = [v.l1t, v.l2t, v.l3t], DD = [v.l1d, v.l2d, v.l3d];
  for (var k = 0; k < 3; k++) { set('lyt' + k, TT[k]); set('lyd' + k, DD[k]); }

  tl.fromTo('#eb', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .4 }, 0);
  tl.fromTo('#h1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .06);
  /* 上层先落、下层后落：观众是顺着「为什么」往下读的，不是从下往上 */
  for (var i = 0; i < 3; i++) {
    var at = .4 + i * .5;
    tl.fromTo('#ly' + i, { opacity: 0, y: 24, scale: .98 },
        { opacity: 1, y: 0, scale: 1, duration: .5, ease: 'power3.out' }, at);
  }
  tl.fromTo('#fline', { width: 0 }, { width: 200, duration: .5, ease: 'power3.out' }, 2.1);
  tl.fromTo('#foot', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .5 }, 2.22);
  B.hold(tl, 3.4, .6);
  B.fitAll();

})();
</script>
</body>
