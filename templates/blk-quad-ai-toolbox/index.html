<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "AI TOOLBOX / 2026"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "把 AI 塞进日常的六个位置"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：小时 / 周"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#FF5FA2"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>四象限 · 把 AI 塞进日常的六个位置</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  /* 必须显式 flex-direction:column。基础层给的是 .body{display:flex}，
     没写方向就是 row——四象限网格和余项条会并排，第五条 KPI 被挤成
     右侧一条竖的（「团队渗透 74%」竖着排），完全不是要的样子。 */
  .body{position:relative;flex-direction:column}
  /* 十字轴走 3×3 网格：中间行/列就是轴。
     早先试过 .grid 的 background 画两条线——被 stage 的点阵伪元素压住，
     缝里只剩米色；绝对定位那版又被 gsap 的 transform 覆盖。占真实网格单元最省心。 */
  .grid{flex:1 1 auto;display:grid;gap:0;
        grid-template-columns:1fr 40px 1fr;
        grid-template-rows:1fr 40px 1fr;min-height:0}
  .axh{grid-column:1/4;grid-row:2;background:var(--ink)}
  .axv{grid-column:2;grid-row:1/4;background:var(--ink)}
  #stage.on-ink .axh,#stage.on-ink .axv{background:var(--paper)}
  .q{border:var(--bw) solid var(--ink);border-radius:4px;
     display:flex;flex-direction:column;justify-content:center;gap:14px;padding:26px 30px;
     min-width:0;min-height:0;position:relative;overflow:hidden}
  .q .tag{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.16em;
        opacity:.78}
  .q .k{font-weight:900;font-size:32px;line-height:1.1;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis}
  .q .v{font-family:var(--mono);font-weight:700;font-size:104px;line-height:.86;
        letter-spacing:-.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
  /* 第五个 KPI 排成底部一条。静默丢掉比放不下难看得多：
     观众看不出少了什么，只会以为这张图本来就只有四个数。 */
  .rest{flex:0 0 auto;display:flex;gap:20px;margin-top:22px}
  .rest:empty{display:none}
  .rc{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:space-between;
        gap:20px;border:var(--bw) solid var(--ink);border-radius:4px;padding:0 28px;
        box-shadow:6px 6px 0 var(--ink)}
  .rest .rk{font-weight:900;font-size:26px;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis;min-width:0}
  .rest .rv{font-family:var(--mono);font-weight:700;font-size:46px;line-height:.9;
        letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap;
        flex:0 0 auto}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">AI TOOLBOX / 2026</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">把 AI 塞进日常的六个位置</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：小时 / 周</div></div>
  <div class="body">
    <div class="grid" id="grid"><div class="blk q" id="q0" style="grid-column:1;grid-row:1;background:var(--white);color:var(--ink)"><span class="tag">Q1 HIGH</span><span class="k" id="k0" data-fit-max="20" data-fit-min="12">提效倍数</span><span class="v" id="v0" data-fit-max="104" data-fit-min="44">4.2x</span></div><div class="blk q" id="q1" style="grid-column:3;grid-row:1;background:var(--yellow);color:var(--ink)"><span class="tag">Q2 GROW</span><span class="k" id="k1" data-fit-max="20" data-fit-min="12">日均调用</span><span class="v" id="v1" data-fit-max="104" data-fit-min="44">87</span></div><div class="blk q" id="q2" style="grid-column:1;grid-row:3;background:var(--blue);color:var(--ink)"><span class="tag">Q3 HOLD</span><span class="k" id="k2" data-fit-max="20" data-fit-min="12">省下工时</span><span class="v" id="v2" data-fit-max="104" data-fit-min="44">22h</span></div><div class="blk q" id="q3" style="grid-column:3;grid-row:3;background:var(--green);color:var(--ink)"><span class="tag">Q4 RISK</span><span class="k" id="k3" data-fit-max="20" data-fit-min="12">复用模板</span><span class="v" id="v3" data-fit-max="104" data-fit-min="44">36</span></div><div class="axh"></div><div class="axv"></div></div>
    <div class="rest" id="rest"><div class="rc" style="background:var(--pink);color:var(--ink)"><span class="rk">团队渗透</span><span class="rv">74%</span></div></div>
  </div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2", "k3", "v3", "k4", "v4"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  document.querySelectorAll('.q').forEach(function (q, i) {
    B.in.pop(tl, q, 0.1 + i * 0.08, { d: 0.42, from: .86, ease: 'power3.out' });
  });
  document.querySelectorAll('.rc').forEach(function (r, i) {
    tl.from(r, { opacity: 0, y: 18, duration: 0.42 * 0.7, ease: 'power3.out' }, 0.4 + i * 0.08);
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
