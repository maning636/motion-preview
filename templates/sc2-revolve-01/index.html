<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "SC2 · 差异化复刻"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.389 / 400"}, {"id": "kicker", "type": "string", "label": "眉题", "default": "CAROUSEL 3D · 纸卡轮播"}, {"id": "cards", "type": "string", "label": "卡片（标题|说明，分号分隔，3 张）", "default": "灵感采集|碎片想法先进篮子;结构拆解|长文拆成可复用骨架;动笔成稿|从第一句写到最后一行"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 7}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .c3-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .c3-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .c3-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .c3-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 眉题（大标题位） */
      .c3-kicker{ position: absolute; left: 0; right: 0; top: 128px; text-align: center; z-index: 5;
        font-size: 56px; font-weight: 900; letter-spacing: .08em; }
      .c3-kicker b{ color: #9A9A92; font-weight: 400; }
      .c3-tag{ position: absolute; left: 0; right: 0; top: 218px; text-align: center; z-index: 5;
        font-size: 19px; letter-spacing: .3em; color: #55554E; }
      /* 3D 环形舞台 */
      .c3-stage{ position: absolute; left: 50%; top: 570px; width: 0; height: 0; z-index: 4;
        perspective: 1500px; }
      .c3-ring{ position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
      .c3-card{ position: absolute; left: -160px; top: -230px; width: 320px; height: 460px;
        transform-style: preserve-3d; }
      .c3-face{ position: absolute; inset: 0; background: #fff; border: 3px solid #141414;
        box-shadow: 10px 10px 0 #141414; padding: 34px 30px;
        -webkit-backface-visibility: hidden; backface-visibility: hidden; }
      /* 卡背：纯图形无文字（墨黑底 + 荧光绿网格 + 圆环），侧/背位展示用 */
      .c3-face.back{ transform: rotateY(180deg); background: #141414; box-shadow: 10px 10px 0 rgba(20,20,20,.25);
        background-image: linear-gradient(color-mix(in srgb, var(--accent) 22%, transparent) 1px, transparent 1px),
          linear-gradient(90deg, color-mix(in srgb, var(--accent) 22%, transparent) 1px, transparent 1px),
          radial-gradient(circle at 50% 46%, transparent 62px, var(--ac, #00FF00) 62px, var(--ac, #00FF00) 68px, transparent 68px);
        background-size: 36px 36px, 36px 36px, 100% 100%; }
      .c3-no{ position: absolute; right: 22px; top: 26px; font-size: 17px; letter-spacing: .12em; color: #9A9A92; }
      .c3-bar{ width: 54px; height: 8px; background: var(--ac, #00FF00); margin-top: 60px; }
      .c3-title{ margin-top: 26px; font-size: 52px; font-weight: 900; line-height: 1.25; letter-spacing: .02em; }
      .c3-div{ margin-top: 24px; height: 2px; background: #141414; width: 100%; }
      .c3-desc{ margin-top: 22px; font-family: 'MiSans SemiBold', sans-serif; font-size: 24px;
        line-height: 1.65; color: #55554E; }
      /* 底部荧光绿署名条 */
      .c3-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(60px); }
      .c3-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .c3-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <div class="c3-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="c3-kicker" id="kicker"></div>
      <div class="c3-tag mono" id="tag"></div>
      <div class="c3-stage">
        <div class="c3-ring" id="ring"></div>
      </div>
      <div class="c3-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · CAROUSEL 3D</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "SC2 · 差异化复刻", "pageno": "P.389 / 400", "kicker": "CAROUSEL 3D · 纸卡轮播", "cards": "灵感采集|碎片想法先进篮子;结构拆解|长文拆成可复用骨架;动笔成稿|从第一句写到最后一行", "accent": "#00FF00", "duration": 7};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      const kc = String(V.kicker).split("·");
      $("kicker").textContent = kc[0].trim();
      if (kc[1]) { const b = document.createElement("b"); b.textContent = " · " + kc.slice(1).join("·").trim(); $("kicker").appendChild(b); }
      // 解析卡片：固定 3 张（节拍与停驻窗口按 3 卡调校）
      const items = String(V.cards).split(";").map((s) => s.trim()).filter(Boolean)
        .map((s) => { const p = s.split("|"); return { t: (p[0] || "").trim(), d: (p[1] || "").trim() }; });
      const N = 3;
      const RADIUS = 430;
      const ring = $("ring");
      for (let i = 0; i < N; i++) {
        const it = items[i % Math.max(items.length, 1)] || { t: "", d: "" };
        const card = document.createElement("div");
        card.className = "c3-card";
        // 先转到方位角再沿 Z 推出半径：卡天然 billboard 朝外
        card.style.transform = "rotateY(" + (i * 360 / N) + "deg) translateZ(" + RADIUS + "px)";
        const f = document.createElement("div");
        f.className = "c3-face front";
        const no = document.createElement("div"); no.className = "c3-no mono"; no.textContent = "CARD " + String(i + 1).padStart(2, "0");
        const bar = document.createElement("div"); bar.className = "c3-bar";
        const ti = document.createElement("div"); ti.className = "c3-title"; ti.textContent = it.t;
        const dv = document.createElement("div"); dv.className = "c3-div";
        const de = document.createElement("div"); de.className = "c3-desc"; de.textContent = it.d;
        f.append(no, bar, ti, dv, de);
        const bk = document.createElement("div");
        bk.className = "c3-face back";
        card.append(f, bk);
        ring.appendChild(card);
      }
      $("tag").textContent = N + " CARDS · 720° 步进轮播 · R" + RADIUS;
      // 页眉
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      tl.fromTo("#kicker", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.35);
      tl.fromTo("#tag", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 0.6);
      // 环形整体入场（俯角落位）
      tl.fromTo(".c3-stage", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.55);
      tl.fromTo("#ring", { rotationX: -14 }, { rotationX: -6, duration: 1.0, ease: "expo.out" }, 0.55);
      // 第一圈半：一口气快转 480°（0.55-1.6s），制造轮换冲量
      tl.fromTo("#ring", { rotationY: 0 }, { rotationY: 480, duration: 1.05, ease: "power1.inOut" }, 0.55);
      // 余下 240° 拆成两步停驻：每卡朝前静止 ≥1s（1.85-3.15 / 3.85-5.15 / 5.9 起定格）
      tl.to("#ring", { rotationY: 600, duration: 0.7, ease: "power2.inOut" }, 3.15);
      tl.to("#ring", { rotationY: 720, duration: 0.75, ease: "power2.inOut" }, 5.15);
      // 底部署名条
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 0.9);
      tl.fromTo([".c3-foot .f1", ".c3-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 1.15);
      // 隐形补位：只拉长时间轴盖满 7s（否则尾帧空白），不产生任何运动
      tl.to("#tag", { opacity: 1, duration: 0.3 }, 6.72);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
