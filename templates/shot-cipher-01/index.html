<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "噪声里长答案"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; }
#word{ display:flex; }
.sc{ display:inline-block; width:118px; height:150px; line-height:150px; text-align:center;
  font-size:96px; font-weight:900; font-family:'MiSans SemiBold',monospace;
  color:color-mix(in srgb, var(--fg) 45%, transparent); border-radius:12px; }
.sc.lit{ background:var(--accent); color:#0A0A0A; }
.sc.done{ color:var(--fg); }
#bar{ margin-top:70px; width:420px; height:6px; border-radius:3px;
  background:color-mix(in srgb, var(--fg) 12%, transparent); overflow:hidden; }
#barFill{ width:0; height:100%; background:var(--accent); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.0" data-width="1920" data-height="1080">
<div id="stage"><div id="word"></div><div id="bar"><div id="barFill"></div></div></div>
    </div>
    <script>
      const FB = {"title": "噪声里长答案", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

const T=(v.title||'噪声里长答案');
const CHSET='ABCDEF0123456789#$%&';
const word=$('#word'), fill=$('#barFill');
const slots=T.split('').map(c=>{
  const s=document.createElement('span');
  s.className='sc'; s.textContent=c; word.appendChild(s); return s;
});
const N=slots.length;
function h(n){const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x);}
const sim={f:0};
function paint(){
  const f=Math.floor(sim.f);
  let locked=0;
  slots.forEach((s,i)=>{
    const lockF=20+i*6;
    if(f<lockF){
      // 乱码期：每 2f 跳一个伪随机字符（帧确定）
      const idx=Math.floor(h(i*101+Math.floor(f/2)*7+13)*CHSET.length);
      s.textContent=CHSET[idx];
      s.className='sc';
    }else if(f<lockF+2){
      s.textContent=T[i]; s.className='sc lit'; locked++;
    }else{
      s.textContent=T[i]; s.className='sc done'; locked++;
    }
  });
  fill.style.width=(locked/N*100).toFixed(1)+'%';
}
paint();
tl.to(sim,{f:120,duration:F(120),ease:'none',onUpdate:paint},0);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
