<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "VOL.15 · 视觉动效库"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.379 / 400"}, {"id": "cta", "type": "string", "label": "横幅 CTA 文案", "default": "在评论区扣出关键词，领取完整清单"}, {"id": "words", "type": "string", "label": "评论关键词（逗号分隔 3 个）", "default": "清单，模板，教程"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 5}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .ccb-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .ccb-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .ccb-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .ccb-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 中部引导行 */
      .ccb-hint{ position: absolute; left: 0; right: 0; top: 430px; text-align: center; z-index: 4;
        font-size: 24px; letter-spacing: .34em; color: #9A9A92; }
      .ccb-hint .arr{ display: inline-block; margin-top: 26px; font-size: 40px; color: #141414; }
      /* 底部墨黑横幅 */
      .ccb-banner{ position: absolute; left: 0; right: 0; bottom: 60px; height: 150px; background: #141414;
        z-index: 5; display: flex; align-items: center; padding: 0 90px; transform: translateY(210px); }
      .ccb-banner .tag{ font-size: 19px; letter-spacing: .26em; color: #9A9A92; margin-right: 56px;
        border-right: 2px solid #55554E; padding-right: 56px; white-space: nowrap; }
      .ccb-banner .cta{ font-size: 42px; font-weight: 900; letter-spacing: .04em; color: #F6F5EF; }
      /* 荧光绿书签（从横幅上缘抽出） */
      .ccb-bm-wrap{ position: absolute; right: 210px; bottom: 210px; width: 300px; height: 250px;
        overflow: hidden; z-index: 4; }
      .ccb-bm{ position: absolute; left: 0; bottom: 0; width: 300px; height: 196px;
        background: var(--ac, #00FF00); border: 3px solid #141414; border-bottom: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transform: translateY(100%); }
      .ccb-bm .lab{ font-size: 16px; letter-spacing: .3em; color: #141414; opacity: .65; margin-bottom: 12px; }
      .ccb-bm .kw{ font-size: 46px; font-weight: 900; letter-spacing: .14em; color: #141414; }
      /* 底部绿色署名条 */
      .ccb-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(60px); }
      .ccb-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .ccb-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="ccb-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="ccb-hint mono" id="hint">KEYWORD DROP · 评论区见<div class="arr" id="arr">↓</div></div>
      <div class="ccb-bm-wrap">
        <div class="ccb-bm" id="bm">
          <div class="lab mono">KEYWORD</div>
          <div class="kw" id="kw"></div>
        </div>
      </div>
      <div class="ccb-banner" id="banner">
        <div class="tag mono" id="btag">COMMENT · CTA</div>
        <div class="cta" id="cta"></div>
      </div>
      <div class="ccb-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · COMMENT CTA BOOKMARK</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "VOL.15 · 视觉动效库", "pageno": "P.379 / 400", "cta": "在评论区扣出关键词，领取完整清单", "words": "清单，模板，教程", "accent": "#00FF00", "duration": 5};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      $("cta").textContent = V.cta;
      const words = String(V.words).split(/[,，]/).map((s) => s.trim()).filter(Boolean).slice(0, 3);
      while (words.length < 3) words.push(words[words.length - 1] || "关键词");
      $("kw").textContent = words[0];
      // 页眉细线 + 文字
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      // 中部引导行
      tl.fromTo("#hint", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45 }, 0.4);
      tl.fromTo("#arr", { y: -6 }, { y: 4, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.9);
      tl.to("#arr", { y: 0, duration: 0.3, ease: "power1.out" }, 2.9);
      // 墨黑横幅推入
      tl.to("#banner", { y: 0, duration: 0.55, ease: "expo.out" }, 0.5);
      tl.fromTo(["#btag", "#cta"], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.1 }, 0.85);
      // 书签抽出 + 0.9s 一换连换 3 个
      tl.to("#bm", { y: "0%", duration: 0.5, ease: "back.out(1.6)" }, 1.15);
      for (let i = 1; i < 3; i++) {
        const t = 1.15 + i * 0.9;
        tl.to("#bm", { y: "100%", duration: 0.28, ease: "power2.in" }, t);
        tl.call(() => { $("kw").textContent = words[i]; }, null, t + 0.29);
        tl.to("#bm", { y: "0%", duration: 0.5, ease: "back.out(1.6)" }, t + 0.34);
      }
      // 底部绿色署名条（提前进场，定格后文字完全静止 ≥1.5s）
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 2.7);
      tl.fromTo([".ccb-foot .f1", ".ccb-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 2.9);
      // 时间轴补满到 duration，保证收尾完全静止
      tl.set("#root", {}, Math.max(0, Number(V.duration) - 0.01));
      window.__timelines.main = tl;
    </script>
  </body>
</html>
