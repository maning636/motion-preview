<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "label", "type": "string", "label": "标签", "default": "本月自动发布"}, {"id": "number", "type": "string", "label": "数字", "default": "326"}, {"id": "unit", "type": "string", "label": "单位", "default": "条内容"}, {"id": "light", "type": "color", "label": "光源色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #070B09; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #EAF4EE; }
      .g-bg{ position: absolute; inset: 0;
        background: radial-gradient(900px 520px at 30% 20%, rgba(0,255,140,.07), transparent 60%),
          radial-gradient(1000px 600px at 76% 84%, rgba(64,224,208,.06), transparent 60%); }
      .g-num{ font-family: 'MiSans SemiBold', 'PingFang SC', sans-serif; }
      .g-panel{ position: absolute; left: 510px; top: 260px; width: 900px; height: 560px;
        border-radius: 34px; background: rgba(14,26,20,.54);
        -webkit-backdrop-filter: blur(13px); backdrop-filter: blur(13px);
        border: 1px solid rgba(255,255,255,.16); }
      .g-panel::before{ content: ""; position: absolute; inset: 10px; border-radius: 28px;
        transform: translate(3px, 3px); background: rgba(4,9,7,.55); z-index: -1;
        box-shadow: 0 0 0 20px rgba(4,9,7,.35); }
      .g-inner{ position: absolute; inset: 0; padding: 62px 70px; }
      .g-head{ display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700;
        color: #A9C4B6; letter-spacing: .06em; }
      .g-dot{ width: 16px; height: 16px; border-radius: 50%; background: var(--light, #00FF00);
        box-shadow: 0 0 18px var(--light, #00FF00); }
      .g-bigrow{ margin-top: 52px; display: flex; align-items: baseline; gap: 22px; }
      .g-big{ font-size: 216px; line-height: 1; color: #F4FBF7; }
      .g-unit{ font-size: 56px; font-weight: 700; color: #8FAE9E; }
      .g-light{ position: absolute; left: 0; top: 0; width: 240px; height: 240px; margin: -120px 0 0 -120px;
        mix-blend-mode: screen; pointer-events: none; }
      .g-halo{ position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(ellipse at center, var(--light, #00FF00) 0%, transparent 65%);
        opacity: .5; filter: blur(30px); }
      .g-core{ position: absolute; left: 60px; top: 60px; width: 120px; height: 120px; border-radius: 50%;
        background: radial-gradient(ellipse at center, #FFFFFF 0%, var(--light, #00FF00) 55%, transparent 75%);
        opacity: .9; filter: blur(28px); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="g-bg"></div>
      <div class="g-panel" id="panel">
        <div class="g-inner">
          <div class="g-head"><span class="g-dot"></span><span id="label"></span></div>
          <div class="g-bigrow"><span class="g-big g-num" id="big">0</span><span class="g-unit" id="unit"></span></div>
        </div>
      </div>
      <div class="g-light" id="light"><div class="g-halo"></div><div class="g-core"></div></div>

    </div>
    <script>
      const fallback = {"label": "本月自动发布", "number": "326", "unit": "条内容", "light": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      document.documentElement.style.setProperty("--light", V.light ?? "#00FF00");
      $("label").textContent = V.label;
      $("unit").textContent = V.unit;
      const light = $("light");
      const P = { l: 510, t: 260, r: 1410, b: 820, cx: 960, cy: 540 };
      light.style.left = P.l + "px"; light.style.top = P.t + "px";
      tl.fromTo("#panel", { y: 46, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0);
      countTo($("big"), V.number, 0.35, 1.4, 0, true);
      tl.fromTo("#unit", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.35 }, 1.35);
      tl.to(light, { keyframes: [
        { left: P.cx, top: P.t, scale: 1.0, filter: "hue-rotate(40deg)", duration: 0.4 },
        { left: P.r, top: P.t, scale: 1.3, filter: "hue-rotate(70deg)", duration: 0.4 },
        { left: P.r, top: P.b, scale: 1.0, filter: "hue-rotate(120deg)", duration: 0.5 },
        { left: P.cx, top: P.b, scale: 1.3, filter: "hue-rotate(150deg)", duration: 0.4 },
        { left: P.l, top: P.b, scale: 1.0, filter: "hue-rotate(90deg)", duration: 0.4 },
        { left: P.l, top: P.t, scale: 1.15, filter: "hue-rotate(0deg)", duration: 0.5 }
      ], ease: "none" }, 0.25);
      [1.05, 1.6].forEach((t) => {
        tl.to("#panel", { filter: "brightness(1.13)", duration: 0.16, ease: "power1.in" }, t);
        tl.to("#panel", { filter: "brightness(1)", duration: 0.22, ease: "power1.out" }, t + 0.16);
      });
      window.__timelines.main = tl;

    </script>
  </body>
</html>
