<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "cardA", "type": "string", "label": "起点卡", "default": "转化率 +38%"}, {"id": "cardB", "type": "string", "label": "终点卡", "default": "营收 +210万"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

.dc{ position:absolute; width:460px; height:260px; border-radius:20px; background:#14141C;
  border:1px solid rgba(255,255,255,.14); padding:34px; }
.dc h3{ font-size:38px; color:var(--fg); margin-bottom:20px; }
.dc i{ display:block; height:12px; border-radius:6px; background:rgba(255,255,255,.14); margin-bottom:12px; }
#cA{ left:180px; top:560px; }
#cB{ left:1280px; top:240px; }
#cB{ box-shadow:0 0 0 0 transparent; }
#arcBox{ position:absolute; inset:0; pointer-events:none; }
#bpulse{ position:absolute; left:1280px; top:240px; width:460px; height:260px; border-radius:20px;
  border:3px solid var(--accent); opacity:0; pointer-events:none; }
#numB{ font-size:54px; color:var(--accent); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.7" data-width="1920" data-height="1080">
<div class="dc" id="cA"><h3 id="ta"></h3><i></i><i style="width:66%"></i></div><div class="dc" id="cB"><h3 id="tb"></h3><div id="numB">0</div></div><svg id="arcBox" width="1920" height="1080"><defs><radialGradient id="hg"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="color-mix(in srgb, var(--accent) 80%, transparent)"/><stop offset="1" stop-color="transparent"/></radialGradient></defs><path id="arc" fill="none" stroke="#00FF00" stroke-width="4.5" style="filter:drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 70%, transparent))"/><circle id="head" r="18" fill="url(#hg)" opacity="0"/></svg><div id="bpulse"></div>
    </div>
    <script>
      const FB = {"cardA": "转化率 +38%", "cardB": "营收 +210万", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#ta').textContent=v.cardA||'';$('#tb').textContent=v.cardB||'';
// 手写 bezier：A 卡右缘 → 高抛弧 → B 卡左缘
const P0=[640,650],P1=[860,240],P2=[1100,180],P3=[1280,370];
const arc=$('#arc');
arc.setAttribute('d','M'+P0+' C'+P1+' '+P2+' '+P3);
const len=arc.getTotalLength();
arc.style.strokeDasharray=len; arc.style.strokeDashoffset=len;
// 22f out-cubic 生长，光头领跑（仅生长期挂载）
const prog={t:0};
tl.to(prog,{t:1,duration:F(22),ease:'power3.out',onUpdate:()=>{
  arc.style.strokeDashoffset=len*(1-prog.t);
  const pt=arc.getPointAtLength(len*prog.t);
  gsap.set('#head',{x:pt.x,y:pt.y});
}},F(10));
tl.set('#head',{opacity:1},F(10));
tl.set('#head',{opacity:0},F(33)); // 生长完即摘罩
// 落点描边脉冲：扩散 out-cubic 6f / 消散线性 12f
tl.fromTo('#bpulse',{opacity:.9,scale:1},{scale:1.18,duration:F(6),ease:'power3.out'},F(32));
tl.to('#bpulse',{opacity:0,duration:F(12),ease:'none'},F(38));
// 终点指标 count-up（0→210）
const cnt={n:0};
tl.to(cnt,{n:210,duration:F(28),ease:'power2.out',onUpdate:()=>{
  $('#numB').textContent='+'+Math.round(cnt.n)+'万';
}},F(32));
tl.to({},{duration:F(79)},F(62)); // 真静止

      window.__timelines.main = tl;
    </script>
  </body>
</html>
