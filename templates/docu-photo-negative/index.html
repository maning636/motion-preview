<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "name", "type": "string", "label": "档案名称", "default": "流量异常的内部复盘"}, {"id": "code", "type": "string", "label": "编号", "default": "JG-2026-0813"}, {"id": "level", "type": "string", "label": "密级", "default": "机密"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #EAE2CF; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #26211A; }
      .f-vig{ position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 52%, rgba(64,48,26,.32) 100%); }
      .f-docin{ position: absolute; left: 560px; top: 260px; width: 840px; height: 620px;
        background: #FBF7EC; padding: 54px 60px; box-shadow: 6px 8px 0 rgba(38,33,26,.15); }
      .f-docin .dl{ height: 20px; background: rgba(38,33,26,.16); margin-bottom: 30px; border-radius: 2px; }
      .f-docin .dl:nth-child(2){ width: 82%; } .f-docin .dl:nth-child(3){ width: 64%; }
      .f-cover{ position: absolute; left: 520px; top: 220px; width: 880px; height: 640px;
        background: #D9C49A; border: 2.5px solid #8A7448; padding: 44px 56px;
        box-shadow: 10px 12px 0 rgba(38,33,26,.24); z-index: 2; }
      .f-cover::before{ content: ""; position: absolute; left: 0; right: 0; top: 0; height: 130px;
        background: #CBB586; border-bottom: 2.5px solid #8A7448;
        clip-path: polygon(0 0, 100% 0, 100% 46%, 50% 100%, 0 46%); }
      .f-code{ position: relative; margin-top: 120px; font-size: 24px; color: #57503F; letter-spacing: .1em; }
      .f-namel{ position: relative; margin-top: 34px; font-size: 24px; color: #57503F; letter-spacing: .16em; }
      .f-name{ position: relative; margin-top: 12px; font-size: 56px; font-weight: 900;
        border-bottom: 3px solid #26211A; padding-bottom: 16px; }
      .f-lvl{ position: absolute; right: 56px; top: 170px; padding: 8px 22px; border: 6px solid #B03028;
        color: #B03028; border-radius: 6px; font-size: 34px; font-weight: 900; letter-spacing: .22em;
        transform: rotate(-8deg); }
      .f-round{ position: absolute; right: 70px; bottom: 56px; width: 160px; height: 160px;
        border: 7px solid #B03028; border-radius: 50%; color: #B03028; font-size: 28px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; text-align: center;
        transform: rotate(9deg); opacity: .92; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="f-vig"></div>
      <div class="f-docin" id="docin"><div class="dl"></div><div class="dl"></div><div class="dl"></div></div>
      <div class="f-cover" id="cover">
        <div class="f-code mono">编号：<span id="code"></span></div>
        <div class="f-namel">档案名称</div>
        <div class="f-name" id="name"></div>
        <div class="f-lvl" id="level"></div>
        <div class="f-round" id="round">机 密<br/>保 管</div>
      </div>

    </div>
    <script>
      const fallback = {"name": "流量异常的内部复盘", "code": "JG-2026-0813", "level": "机密", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      $("code").textContent = V.code;
      $("name").textContent = V.name;
      $("level").textContent = V.level;
      tl.fromTo("#docin", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.1);
      tl.fromTo("#cover", { y: -80, opacity: 0, rotation: -4 }, { y: 0, opacity: 1, rotation: 1, duration: 0.55, ease: "back.out(1.5)" }, 0.25);
      tl.fromTo(".f-code", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.75);
      tl.fromTo(".f-name", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power3.out" }, 0.9);
      tl.fromTo("#level", { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.in" }, 1.35);
      tl.fromTo("#round", { scale: 2.8, opacity: 0, rotation: 32 }, { scale: 1, opacity: 0.92, rotation: 9, duration: 0.2, ease: "power4.in" }, 1.6);
      tl.to("#cover", { keyframes: [
        { x: -7, duration: 0.06 }, { x: 5, duration: 0.07 }, { x: 0, duration: 0.08 }
      ], ease: "none" }, 1.78);
      tl.to("#cover", { x: 66, y: 30, rotation: 3.5, duration: 0.55, ease: "power3.inOut" }, 2.15);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
