<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"累计用户增长"},{"id":"subtitle","type":"string","label":"副标题","default":"过去一年活跃用户累积曲线"},{"id":"labels","type":"string","label":"X 轴标签（逗号分隔）","default":"1月,3月,5月,7月,9月,11月"},{"id":"values","type":"string","label":"数值（逗号分隔）","default":"1200,2100,3800,5400,7200,9500"},{"id":"source","type":"string","label":"数据来源","default":"内部统计 2025"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title-area{ margin-bottom: 40px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 10px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 28px; font-weight: 400; opacity: 0.55; }
      .chart-area{ position: relative; width: 100%; height: 620px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-svg{ width: 100%; height: 100%; overflow: visible;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .axis-text{ fill: rgba(244,239,231,0.55); font-family: 'MEBHeiHeiTi', sans-serif; font-size: 18px; font-weight: 500; text-anchor: middle; }
      .axis-text-y{ text-anchor: end; dominant-baseline: middle;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .grid-line{ stroke: rgba(244,239,231,0.10); stroke-width: 1;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .area-path{ opacity: 0.42;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .line-path{ fill: none; stroke-linecap: round; stroke-linejoin: round;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .point{ fill: var(--bg); stroke-width: 3;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .source{ position: absolute; bottom: 0; right: 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 16px; opacity: 0.45; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title-area">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <svg class="chart-svg" id="chart" viewBox="0 0 1696 620" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="source" id="source"></div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "累计用户增长", subtitle: "过去一年活跃用户累积曲线", labels: "1月,3月,5月,7月,9月,11月", values: "1200,2100,3800,5400,7200,9500", source: "内部统计 2025", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      root.style.setProperty("--bg", v.background);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      document.getElementById("source").textContent = v.source ? "SOURCE: " + v.source : "";
      const labels = String(v.labels).split(",").map(s => s.trim());
      const values = String(v.values).split(",").map(s => Number(s.trim()));
      const maxValue = Math.max(...values) * 1.1 || 1;
      const svg = document.getElementById("chart");
      const chartW = 1696, chartH = 620, marginLeft = 80, marginRight = 40, marginTop = 40, marginBottom = 50;
      const plotW = chartW - marginLeft - marginRight, plotH = chartH - marginTop - marginBottom;
      const baselineY = marginTop + plotH;
      const xFor = i => marginLeft + (i / (values.length - 1)) * plotW;
      const yFor = val => baselineY - (val / maxValue) * plotH;
      const gridCount = 5;
      for (let i = 0; i <= gridCount; i++) {
        const val = (maxValue / gridCount) * i, y = yFor(val);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", marginLeft); line.setAttribute("x2", marginLeft + plotW); line.setAttribute("y1", y); line.setAttribute("y2", y);
        line.setAttribute("class", "grid-line"); svg.appendChild(line);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", marginLeft - 14); text.setAttribute("y", y); text.setAttribute("class", "axis-text axis-text-y");
        text.textContent = Math.round(val).toLocaleString(); svg.appendChild(text);
      }
      labels.forEach((label, i) => {
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", xFor(i)); text.setAttribute("y", baselineY + 32); text.setAttribute("class", "axis-text");
        text.textContent = label; svg.appendChild(text);
      });
      const lineD = values.map((val, i) => `${i === 0 ? "M" : "L"} ${xFor(i)} ${yFor(val)}`).join(" ");
      const areaD = `${lineD} L ${xFor(values.length - 1)} ${baselineY} L ${xFor(0)} ${baselineY} Z`;
      const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      const grad = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
      grad.setAttribute("id", "areaGrad"); grad.setAttribute("x1", "0"); grad.setAttribute("y1", "0"); grad.setAttribute("x2", "0"); grad.setAttribute("y2", "1");
      grad.innerHTML = `<stop offset="0%" stop-color="${v.accent}" stop-opacity="0.42"/><stop offset="100%" stop-color="${v.accent}" stop-opacity="0"/>`;
      defs.appendChild(grad); svg.appendChild(defs);
      const area = document.createElementNS("http://www.w3.org/2000/svg", "path");
      area.setAttribute("d", areaD); area.setAttribute("fill", "url(#areaGrad)"); area.setAttribute("class", "area-path"); svg.appendChild(area);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
      line.setAttribute("d", lineD); line.setAttribute("stroke", v.accent); line.setAttribute("stroke-width", "4"); line.setAttribute("class", "line-path"); svg.appendChild(line);
      values.forEach((val, i) => {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", xFor(i)); c.setAttribute("cy", yFor(val)); c.setAttribute("r", 6);
        c.setAttribute("stroke", v.accent); c.setAttribute("class", "point"); c.setAttribute("id", `point-${i}`);
        svg.appendChild(c);
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 18 }, { opacity: 0.55, y: 0, duration: 0.4, ease: "power2.out" }, 0.3);
      tl.fromTo(".grid-line", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.04 }, 0.4);
      tl.fromTo(".axis-text", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.03 }, 0.5);
      const lineLen = line.getTotalLength();
      line.style.strokeDasharray = lineLen; line.style.strokeDashoffset = lineLen;
      tl.to(line, { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, 0.7);
      tl.fromTo(".area-path", { opacity: 0 }, { opacity: 0.42, duration: 1.0, ease: "power2.out" }, 0.9);
      values.forEach((_, i) => {
        tl.fromTo(`#point-${i}`, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" }, 1.4 + i * 0.08);
      });
      tl.fromTo(".source", { opacity: 0 }, { opacity: 0.45, duration: 0.4 }, 1.8);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
