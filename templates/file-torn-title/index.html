<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "真正贵的是注意力"}, {"id": "highlight", "type": "string", "label": "高亮词（须为标题子串）", "default": "注意力"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #EAE2CF; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #26211A; }
      .f-vig{ position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(64,48,26,.34) 100%); }
      .f-strip{ position: absolute; left: 260px; top: 400px; width: 1400px; height: 280px;
        background: #FBF7EC; display: flex; align-items: center; justify-content: center;
        box-shadow: 8px 10px 0 rgba(38,33,26,.22);
        clip-path: polygon(0 8%, 3% 0, 96% 2%, 100% 10%, 98.5% 88%, 95% 100%, 40% 96%, 4% 100%, 0 90%); }
      .f-title{ font-size: 96px; font-weight: 900; letter-spacing: .02em; text-align: center;
        max-width: 1280px; }
      .f-title .hl{ background: #F5D73F; padding: 0 12px; clip-path: inset(0 100% 0 0); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="f-vig"></div>
      <div class="f-strip" id="strip"><h1 class="f-title" id="title"></h1></div>

    </div>
    <script>
      const fallback = {"title": "真正贵的是注意力", "highlight": "注意力", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      const t = String(V.title ?? "");
      const key = String(V.highlight ?? "");
      const titleEl = $("title");
      const idx = key ? t.indexOf(key) : -1;
      if (idx >= 0) {
        titleEl.append(document.createTextNode(t.slice(0, idx)));
        const hl = document.createElement("span");
        hl.className = "hl"; hl.id = "hlSpan";
        hl.textContent = key;
        titleEl.appendChild(hl);
        titleEl.append(document.createTextNode(t.slice(idx + key.length)));
      } else {
        titleEl.textContent = t;
      }
      tl.fromTo("#strip", { clipPath: "polygon(50% 8%, 50% 0, 50% 2%, 50% 10%, 50% 88%, 50% 100%, 50% 96%, 50% 100%, 50% 90%)", rotation: -3 },
        { clipPath: "polygon(0% 8%, 3% 0, 96% 2%, 100% 10%, 98.5% 88%, 95% 100%, 40% 96%, 4% 100%, 0% 90%)", rotation: -1.5,
          duration: 0.6, ease: "power4.out" }, 0.15);
      tl.fromTo("#title", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, 0.55);
      if ($("hlSpan")) {
        tl.to("#hlSpan", { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.inOut" }, 1.15);
      }
      window.__timelines.main = tl;

    </script>
  </body>
</html>
