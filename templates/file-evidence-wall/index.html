<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "件任务按规矩办完"}, {"id": "highlight", "type": "string", "label": "高亮词", "default": "36%"}, {"id": "note", "type": "string", "label": "批注", "default": "问题源头在这里"}, {"id": "img1", "type": "image", "label": "档案照片1", "default": "./placeholder-1.png"}, {"id": "img2", "type": "image", "label": "档案照片2（红圈重点）", "default": "./placeholder-2.png"}, {"id": "img3", "type": "image", "label": "档案照片3", "default": "./placeholder-3.png"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #EAE2CF; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #26211A; }
      .f-vig{ position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 52%, rgba(64,48,26,.32) 100%); }
      .f-head{ position: absolute; left: 150px; top: 96px; display: flex; align-items: baseline; gap: 28px; }
      .f-hl{ display: inline-block; background: #F5D73F; font-size: 64px; font-weight: 900;
        padding: 4px 22px; transform: rotate(-1.5deg); }
      .f-head h1{ font-size: 52px; font-weight: 900; }
      .f-wall{ position: absolute; left: 150px; right: 150px; top: 300px; display: flex;
        justify-content: center; gap: 72px; }
      .f-photo{ position: relative; width: 430px; height: 540px; background: #FFFDF7; padding: 16px 16px 64px;
        box-shadow: 7px 9px 0 rgba(38,33,26,.18); }
      .f-photo img{ width: 100%; height: 100%; object-fit: cover; display: block;
        filter: sepia(.22) contrast(.96); }
      .f-tag{ position: absolute; left: -14px; top: 24px; background: #1E7A46; color: #FFFDF7;
        font-size: 20px; font-weight: 800; letter-spacing: .1em; padding: 6px 14px; }
      .f-tape{ position: absolute; width: 120px; height: 36px; background: rgba(255,252,240,.55);
        border-left: 1px solid rgba(38,33,26,.1); border-right: 1px solid rgba(38,33,26,.1); }
      .f-tape.a{ left: -30px; top: -18px; transform: rotate(-38deg); }
      .f-tape.b{ right: -30px; top: -18px; transform: rotate(38deg); }
      .f-circle{ position: absolute; pointer-events: none; overflow: visible; }
      .f-note{ position: absolute; display: flex; align-items: center; gap: 14px; color: #B03028;
        font-size: 34px; font-weight: 800; font-style: italic; max-width: 560px; }
      .f-note .arr{ font-size: 48px; font-style: normal; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="f-vig"></div>
      <div class="f-head">
        <span class="f-hl" id="hl"></span>
        <h1 id="title"></h1>
      </div>
      <div class="f-wall" id="wall">
        <figure class="f-photo" id="ph1"><img id="img1" alt=""><span class="f-tag mono">EXHIBIT A</span><span class="f-tape a"></span><span class="f-tape b"></span></figure>
        <figure class="f-photo" id="ph2"><img id="img2" alt=""><span class="f-tag mono">EXHIBIT B</span><span class="f-tape a"></span><span class="f-tape b"></span></figure>
        <figure class="f-photo" id="ph3"><img id="img3" alt=""><span class="f-tag mono">EXHIBIT C</span><span class="f-tape a"></span><span class="f-tape b"></span></figure>
      </div>
      <svg class="f-circle" id="circle" viewBox="0 0 500 620" preserveAspectRatio="none">
        <ellipse id="circleEl" cx="250" cy="310" rx="225" ry="285" fill="none" stroke="#B03028" stroke-width="8" stroke-linecap="round"/>
      </svg>
      <div class="f-note" id="noteWrap"><span class="arr">⤵</span><span id="note"></span></div>

    </div>
    <script>
      const fallback = {"title": "件任务按规矩办完", "highlight": "36%", "note": "问题源头在这里", "img1": "./placeholder-1.png", "img2": "./placeholder-2.png", "img3": "./placeholder-3.png", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      $("hl").textContent = V.highlight;
      $("title").textContent = V.title;
      $("note").textContent = V.note;
      ["img1", "img2", "img3"].forEach((k) => { if (V[k]) $(k).src = V[k]; });
      const rots = [-4, 3, -2.5];
      // 红圈定位到中间照片
      const ph2 = $("ph2"), circle = $("circle"), ellipse = $("circleEl");
      circle.style.left = (ph2.offsetLeft + $("wall").offsetLeft - 40) + "px";
      circle.style.top = (ph2.offsetTop + $("wall").offsetTop - 40) + "px";
      circle.style.width = (ph2.offsetWidth + 80) + "px";
      circle.style.height = (ph2.offsetHeight + 80) + "px";
      const noteWrap = $("noteWrap");
      noteWrap.style.left = (ph2.offsetLeft + $("wall").offsetLeft + ph2.offsetWidth * 0.45) + "px";
      noteWrap.style.top = (ph2.offsetTop + $("wall").offsetTop + ph2.offsetHeight + 36) + "px";
      const len = ellipse.getTotalLength();
      ellipse.style.strokeDasharray = String(len);
      ellipse.style.strokeDashoffset = String(len);

      tl.fromTo("#hl", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power3.out" }, 0.2);
      tl.fromTo("#title", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.4);
      ["#ph1", "#ph2", "#ph3"].forEach((sel, i) => {
        tl.fromTo(sel, { scale: 0.6, opacity: 0, rotation: rots[i] + 9 },
          { scale: 1, opacity: 1, rotation: rots[i], duration: 0.45, ease: "back.out(2.2)" }, 0.65 + i * 0.18);
      });
      tl.to(ellipse, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 1.7);
      tl.fromTo("#noteWrap", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.25);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
