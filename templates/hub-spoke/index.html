<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"AI Agent 工具集成"},{"id":"subtitle","type":"string","label":"副标题","default":"中心 Hub 调度多个外围 Spoke"},{"id":"hub","type":"string","label":"中心 Hub 名","default":"AI Agent"},{"id":"spokes","type":"string","label":"Spoke 名（逗号分隔）","default":"GitHub,Slack,Notion,Calendar,Email,Docs"},{"id":"hotSpokes","type":"string","label":"高亮 Spoke 索引（逗号分隔，0-based）","default":"0,2"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 32px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 12px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 400; opacity: 0.55; }
      .chart-area{ position: relative; width: 100%; height: 720px; display: flex; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .svg-layer{ position: absolute; inset: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .hub{ position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 220px; height: 220px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 2;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .hub-text{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.2; color: var(--bg); }
      .spoke{ position: absolute; display: flex; align-items: center; gap: 14px; z-index: 2;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .spoke-dot{ width: 18px; height: 18px; border-radius: 50%; background: rgba(244,239,231,0.18); flex-shrink: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .spoke.hot .spoke-dot{ background: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .spoke-text{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 26px; font-weight: 500; line-height: 1.2; max-width: 260px; }
      .spoke.hot .spoke-text{ color: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <svg class="svg-layer" id="lines" viewBox="0 0 1696 720" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="hub" id="hubNode">
            <div class="hub-text" id="hubText"></div>
          </div>
          <div id="spokes"></div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "AI Agent 工具集成", subtitle: "中心 Hub 调度多个外围 Spoke", hub: "AI Agent", spokes: "GitHub,Slack,Notion,Calendar,Email,Docs", hotSpokes: "0,2", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      root.style.setProperty("--bg", v.background);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      document.getElementById("hubText").textContent = v.hub;
      const spokes = String(v.spokes).split(",").map(s => s.trim()).filter(Boolean);
      const hot = String(v.hotSpokes).split(",").map(s => parseInt(s.trim(), 10));
      const container = document.getElementById("spokes");
      const svg = document.getElementById("lines");
      const cx = 848, cy = 360, radius = 260;
      const angleOffset = -Math.PI / 2;
      const angleStep = (2 * Math.PI) / Math.max(spokes.length, 1);
      spokes.forEach((spoke, i) => {
        const rad = angleOffset + i * angleStep;
        const bx = cx + radius * Math.cos(rad);
        const by = cy + radius * Math.sin(rad);
        const el = document.createElement("div");
        el.className = "spoke" + (hot.includes(i) ? " hot" : "");
        el.innerHTML = `<span class="spoke-dot"></span><span class="spoke-text">${spoke}</span>`;
        const rectW = 320, rectH = 60;
        el.style.left = (bx - rectW / 2) + "px";
        el.style.top = (by - rectH / 2) + "px";
        el.style.width = rectW + "px";
        container.appendChild(el);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", cx); line.setAttribute("y1", cy);
        line.setAttribute("x2", bx); line.setAttribute("y2", by);
        line.setAttribute("stroke", hot.includes(i) ? v.accent : "rgba(244,239,231,0.12)");
        line.setAttribute("stroke-width", hot.includes(i) ? "3" : "2");
        line.setAttribute("class", "spoke-line");
        svg.appendChild(line);
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".hub", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 0.3);
      document.querySelectorAll(".spoke-line").forEach((line, i) => {
        const len = Math.sqrt(Math.pow(parseFloat(line.getAttribute("x2")) - cx, 2) + Math.pow(parseFloat(line.getAttribute("y2")) - cy, 2));
        line.style.strokeDasharray = len; line.style.strokeDashoffset = len;
        tl.to(line, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.7 + i * 0.07);
      });
      document.querySelectorAll(".spoke").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 1.0 + i * 0.07);
      });
      tl.to(".scene", { opacity: 0, scale: 1.01, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
