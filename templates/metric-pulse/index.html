<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"headline","type":"string","label":"主标题","default":"本周内容增长"},{"id":"value","type":"number","label":"核心数字","default":286},{"id":"unit","type":"string","label":"数字单位","default":"%"},{"id":"note","type":"string","label":"补充说明","default":"连续四周保持上升，爆款内容贡献了主要增量。"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="6" data-track-index="1">

        <div class="gridbg"></div>
        <header style="position:relative;z-index:2;"><span class="chip"><b>LIVE</b><span id="headline"></span></span></header>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <span class="ring" style="position:absolute;width:420px;height:420px;border:2px solid var(--accent,#00FF00);border-radius:50%;opacity:0;"></span>
          <span class="ring" style="position:absolute;width:420px;height:420px;border:2px solid var(--accent,#00FF00);border-radius:50%;opacity:0;"></span>
          <div style="text-align:center;">
            <div class="num" style="font-size:280px;line-height:1;color:var(--accent,#00FF00);"><span id="value">0</span><span id="unit" style="font-size:96px;"></span></div>
          </div>
        </div>
        <p id="note" style="position:absolute;right:88px;bottom:90px;max-width:520px;font-size:24px;line-height:1.7;color:#9CA3AF;border-left:3px solid var(--accent,#00FF00);padding-left:20px;"></p>

      </section>
    </div>
    <script>
      const fallback = {"headline": "本周内容增长", "value": 286, "unit": "%", "note": "连续四周保持上升，爆款内容贡献了主要增量。", "accent": "#00FF00", "background": "#12100E", "foreground": "#F4EFE7"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 6;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("headline").textContent = v.headline; $("unit").textContent = v.unit; $("note").textContent = v.note;
      tl.fromTo("header", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5 }, 0.1);
      countTo($("value"), v.value, 0.4, 1.5);
      tl.fromTo(".ring", { scale: 0.6, opacity: 0.7 }, { scale: 1.6, opacity: 0, duration: 1.6, ease: "power1.out", stagger: 0.5, repeat: 1 }, 0.6);
      tl.fromTo("#note", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6 }, 2.0);
      tl.to(".scene", { opacity: 0, duration: 0.5 }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
