<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#flash{ position:absolute; left:960px; top:540px; width:0; height:0; opacity:0; }
.beam{ position:absolute; left:50%; top:50%; translate:-50% -50%; border-radius:999px; }
.bA{ width:840px; height:26px; rotate:-38deg; }
.bB{ width:420px; height:18px; rotate:52deg; }
.glow{ background:linear-gradient(90deg,transparent,#3f9bff 20%,#2277f2 80%,transparent); filter:blur(18px); opacity:.55; }
.main{ background:linear-gradient(90deg,transparent,#3f9bff 8%,#2277f2 92%,transparent); filter:blur(4px); }
.core{ background:linear-gradient(90deg,transparent 40%,#eaf4ff 50%,transparent 60%); height:4px !important; filter:blur(1px); }
.dot{ position:absolute; left:50%; top:50%; translate:-50% -50%; width:26px; height:26px; border-radius:50%;
  background:#fff; box-shadow:0 0 70px 40px rgba(63,155,255,.75); }
.spikes{ position:absolute; left:50%; top:50%; }
.spike{ position:absolute; left:0; top:0; width:3px; border-radius:2px;
  background:linear-gradient(180deg,#3f9bff,transparent); transform-origin:50% 0; }
#card{ position:absolute; left:960px; top:540px; width:680px; height:1015px; opacity:0;
  transform:translate(-50%,-50%); will-change:transform; transform-style:preserve-3d; }
.face{ position:absolute; inset:0; border-radius:26px; overflow:hidden; backface-visibility:hidden;
  background:linear-gradient(160deg,#14161f,#0c0e14); border:2px solid color-mix(in srgb, var(--accent) 55%, transparent);
  box-shadow:0 30px 90px rgba(0,0,0,.6); padding:64px 56px; }
.face.back{ transform:rotateY(180deg); display:flex; align-items:center; justify-content:center; }
.backMark{ font-size:120px; font-weight:900; color:var(--accent); opacity:.85; }
.cTag{ display:inline-block; font-size:20px; letter-spacing:6px; color:var(--accent); border:1px solid var(--accent);
  border-radius:999px; padding:8px 22px; font-family:'MiSans SemiBold',sans-serif; }
.cTitle{ margin-top:44px; font-size:88px; font-weight:900; line-height:1.15; }
.cTitle em{ color:var(--accent); font-style:normal; }
.cSub{ margin-top:36px; font-size:26px; line-height:1.7; opacity:.6; font-family:'MiSans SemiBold',sans-serif; }
.cFoot{ position:absolute; left:56px; bottom:48px; font-size:22px; opacity:.45; font-family:'MiSans SemiBold',sans-serif; }
#sheen{ position:absolute; inset:0; overflow:hidden; border-radius:26px; pointer-events:none; }
#sheenBand{ position:absolute; top:-20%; left:0; width:45%; height:140%; translate:-160% 0; rotate:18deg;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.2" data-width="1920" data-height="1080">

<div id="flash">
  <div class="beam bA glow"></div><div class="beam bA main"></div><div class="beam bA core"></div>
  <div class="beam bB glow"></div><div class="beam bB main"></div><div class="beam bB core"></div>
  <div class="spikes" id="spikes"></div>
  <div class="dot"></div>
</div>
<div id="card">
  <div class="face front">
    <span class="cTag">NEW DROP</span>
    <div class="cTitle">这张卡<br>是<em>变出来</em>的</div>
    <div class="cSub">星芒一闪，卡片自旋十三圈从光里飞出，抵达瞬间硬定格——魔术感来自节奏，不是特效堆料。</div>
    <div class="cFoot">magician-card-flourish · 重写实现</div>
    <div id="sheen"><div id="sheenBand"></div></div>
  </div>
  <div class="face back"><div class="backMark">✦</div></div>
</div>

    </div>
    <script>
      const FB = {"accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

// 放射短刺 10 根，长短相间
const spk=$('#spikes');
for(let i=0;i<10;i++){
  const s=document.createElement('div'); s.className='spike';
  const len=i%2?46:78;
  s.style.height=len+'px';
  s.style.transform='rotate('+(i*36)+'deg) translateY(30px)';
  spk.appendChild(s);
}
const flash=$('#flash'), card=$('#card');
// 星芒：渐亮 2.5f → 旋转 90° → 坍缩，9f 完
tl.set(flash,{opacity:1},0);
tl.fromTo(flash,{scale:.4,opacity:0},{scale:1,opacity:1,duration:F(2.5),ease:'power2.out'},0);
tl.to(flash,{rotate:90,duration:F(9),ease:'power2.inOut'},0);
tl.to(spk,{rotate:-40,duration:F(9),ease:'none'},0);
tl.to(flash,{scale:.1,opacity:0,duration:F(2),ease:'power3.in'},F(7));
// 弹射：slow-in 蓄力 → burst → 减速弧线；自旋 13 整圈 2.4 次幂衰减
const fly={p:0};
tl.set(card,{opacity:1},F(9));
tl.to(fly,{p:0.06,duration:F(7),ease:'power1.in',onUpdate:pose},F(9));
tl.to(fly,{p:1,duration:F(43),ease:'power3.out',onUpdate:pose},F(16));
function pose(){
  const p=fly.p;
  const z=14000*(1-p);
  const s=900/(900+z);
  const y=-Math.sin(p*Math.PI)*180;
  const rot=4680*(1-Math.pow(1-p,2.4));
  card.style.transform='translate(-50%,-50%) translateY('+y+'px) scale('+s+') rotate3d(1,1,0,'+rot+'deg)';
}
pose();
// f59 硬定格；f67 sheen 扫光一次
tl.to('#sheenBand',{x:'420%',duration:F(12),ease:'power2.inOut'},F(67));
tl.fromTo(card,{filter:'brightness(1.25)'},{filter:'brightness(1)',duration:F(12)},F(67));
// 收尾真静止
tl.to({},{duration:F(47)},F(79));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
