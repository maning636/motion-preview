<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "图表标题", "default": "2024 年度业绩"}, {"id": "subtitle", "type": "string", "label": "副标题", "default": "各部门季度销售额对比"}, {"id": "labels", "type": "string", "label": "类别（逗号分隔）", "default": "Q1,Q2,Q3,Q4"}, {"id": "series", "type": "string", "label": "数据系列（每行一个,逗号分隔数字）", "default": "Q1=45,Q2=72,Q3=58,Q4=91"}, {"id": "show_values", "type": "boolean", "label": "显示数值", "default": true}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#12100E"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); font-weight: normal; font-style: normal; }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; font-style: normal; }
      *{ box-sizing: border-box; font-family: 'MEBHeiHeiTi', sans-serif; }
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100E); color: var(--foreground, #F4EFE7); font-family: 'MEBHeiHeiTi', sans-serif; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg, #12100E); color: var(--fg, #F4EFE7); font-family: 'MEBHeiHeiTi', sans-serif; }
      .scene{ position: absolute; inset: 0; padding: 96px 112px; overflow: hidden; font-family: 'MEBHeiHeiTi', sans-serif; }
      .title-area{ position: relative; z-index: 2; margin-bottom: 36px; font-family: 'MEBHeiHeiTi', sans-serif; }
      .title{ margin: 0 0 12px; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em; font-family: 'MiSans SemiBold', sans-serif; }
      .subtitle{ margin: 0; font-size: 28px; color: #6B7280; line-height: 1.4; font-family: 'MEBHeiHeiTi', sans-serif; }
      .chart-area{ position: relative; width: 100%; height: 700px; font-family: 'MEBHeiHeiTi', sans-serif; }
      .grid-line{ stroke: #3a3029; stroke-width: 1; }
      .grid-line-strong{ stroke: #6B7280; stroke-width: 1.5; }
      .axis-text{ fill: #6B7280; font-size: 18px; font-family: 'MEBHeiHeiTi', sans-serif; font-weight: 500; text-anchor: middle; }
      .axis-text-y{ text-anchor: end; dominant-baseline: middle; font-family: 'MEBHeiHeiTi', sans-serif; }
      .bar-rect{ transform-box: fill-box; transform-origin: bottom center; }
      .bar-value{ fill: #F4EFE7; font-size: 24px; font-family: 'MiSans SemiBold', sans-serif; font-weight: 700; text-anchor: middle; opacity: 0; }
      .bar-label{ fill: #6B7280; font-size: 22px; font-family: 'MEBHeiHeiTi', sans-serif; font-weight: 500; text-anchor: middle; dominant-baseline: hanging; opacity: 0; }
      .baseline{ stroke: #6B7280; stroke-width: 2; }
      .donut-text{ fill: #F4EFE7; font-size: 22px; font-family: 'MEBHeiHeiTi', sans-serif; font-weight: 500; text-anchor: middle; }
      .donut-segment{ transition: opacity 0.3s; }
      .donut-center{ fill: #F4EFE7; font-family: 'MiSans SemiBold', sans-serif; font-weight: 700; text-anchor: middle; }
      .donut-center-label{ fill: #6B7280; font-size: 22px; font-family: 'MEBHeiHeiTi', sans-serif; font-weight: 500; text-anchor: middle; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title-area">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <svg id="chart-svg" viewBox="0 0 1696 700" preserveAspectRatio="xMidYMid meet"></svg>
        </div>      </section>
    </div>
    <script>
      const FB = {"title": "2024 年度业绩", "subtitle": "各部门季度销售额对比", "labels": "Q1,Q2,Q3,Q4", "series": "Q1=45,Q2=72,Q3=58,Q4=91", "show_values": true, "accent": "#00FF00", "background": "#12100E", "foreground": "#F4EFE7"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      document.documentElement.style.setProperty('--bg', v.background);
      document.documentElement.style.setProperty('--fg', v.foreground);
      document.documentElement.style.setProperty('--accent', v.accent);
      // title/subtitle 为可选,存在时才设
      const titleEl = document.getElementById("title");
      if (titleEl) titleEl.textContent = v.title || "";
      const subtitleEl = document.getElementById("subtitle");
      if (subtitleEl) subtitleEl.textContent = v.subtitle || "";
      const SVGNS = "http://www.w3.org/2000/svg";
      const labels = v.labels.split(",").map(s => s.trim());
      const seriesArr = v.series.split(",").map(s => {
        const [name, ...vals] = s.split("=");
        return { name: name.trim(), values: (vals[0] || "").split(",").map(Number) };
      });
      const allVals = seriesArr.flatMap(s => s.values);
      const maxValue = Math.max(...allVals, 1) * 1.15;
      const svg = document.getElementById("chart-svg");
      const W = 1696, H = 700, mL = 80, mR = 30, mT = 40, mB = 70;
      const pW = W - mL - mR, pH = H - mT - mB;
      const bY = mT + pH;
      const gridN = 5;
      for (let i = 0; i <= gridN; i++) {
        const v_ = (maxValue / gridN) * i, y = bY - (v_ / maxValue) * pH;
        if (i > 0) {
          const ln = document.createElementNS(SVGNS, "line");
          ln.setAttribute("x1", mL); ln.setAttribute("x2", mL + pW); ln.setAttribute("y1", y); ln.setAttribute("y2", y);
          ln.setAttribute("class", i === gridN ? "grid-line-strong grid-line-elem" : "grid-line grid-line-elem");
          ln.setAttribute("opacity", "0"); svg.appendChild(ln);
        }
        const tx = document.createElementNS(SVGNS, "text");
        tx.setAttribute("x", mL - 16); tx.setAttribute("y", y); tx.setAttribute("class", "axis-text axis-text-y y-label"); tx.setAttribute("opacity", "0"); tx.textContent = Math.round(v_); svg.appendChild(tx);
      }
      const baseLn = document.createElementNS(SVGNS, "line");
      baseLn.setAttribute("x1", mL); baseLn.setAttribute("x2", mL + pW); baseLn.setAttribute("y1", bY); baseLn.setAttribute("y2", bY); baseLn.setAttribute("class", "baseline baseline-elem"); baseLn.setAttribute("opacity", "0"); svg.appendChild(baseLn);

      // 系列颜色循环
      const palette = [v.accent, v.accent + "AA", v.accent + "77"];
      const labelColors = palette.length > seriesArr.length ? palette : palette.concat(Array(seriesArr.length - palette.length).fill(v.accent));

      const barEls = [];
      const grpW = pW / labels.length;
      const barW = Math.min(grpW * 0.7 / seriesArr.length, 90);
      labels.forEach((lab, gi) => {
        seriesArr.forEach((s, si) => {
          const val = s.values[gi] || 0;
          const x = mL + grpW * gi + (grpW - barW * seriesArr.length) / 2 + si * barW;
          const h = (val / maxValue) * pH;
          const r = document.createElementNS(SVGNS, "rect");
          r.setAttribute("x", x); r.setAttribute("y", bY); r.setAttribute("width", barW); r.setAttribute("height", 0); r.setAttribute("fill", labelColors[si % labelColors.length]); r.setAttribute("rx", 6); r.setAttribute("class", "bar-rect bar-rect-elem"); r.dataset.h = String(h); r.dataset.by = String(bY); svg.appendChild(r);
          barEls.push({ rect: r, targetH: h, bY });
        });
        // X label
        const lt = document.createElementNS(SVGNS, "text");
        lt.setAttribute("x", mL + grpW * gi + grpW / 2); lt.setAttribute("y", bY + 28); lt.setAttribute("class", "bar-label bar-label-elem"); lt.textContent = lab; svg.appendChild(lt);
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo(".grid-line-elem", { opacity: 0 }, { opacity: 1, duration: 0.6, stagger: 0.05, ease: "sine.out" }, 0.4);
      tl.fromTo(".y-label", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.05, ease: "power2.out" }, 0.5);
      tl.fromTo(".baseline-elem", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out" }, 0.5);
      document.querySelectorAll(".bar-rect-elem").forEach((r, i) => {
        tl.set(r, { attr: { height: 0 } }, 0);
        tl.to(r, { attr: { height: parseFloat(r.dataset.h), y: parseFloat(r.dataset.by) - parseFloat(r.dataset.h) }, duration: 0.9, ease: "elastic.out(1, 0.6)" }, 0.6 + i * 0.04);
      });
      tl.fromTo(".bar-label-elem", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.05, ease: "power2.out" }, 1.6);
      tl.to(".scene", { opacity: 0, scale: 1.01, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
