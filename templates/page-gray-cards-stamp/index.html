<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "VOL.15 · 视觉动效库"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.378 / 400"}, {"id": "kicker", "type": "string", "label": "眉题", "default": "CHECKLIST · 逐项核验"}, {"id": "items", "type": "string", "label": "条目（分号分隔，3-4 条）", "default": "信息源可信；数据可复核；结论可复现；方法可迁移"}, {"id": "stamp", "type": "string", "label": "印章文字", "default": "已验证"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .gcs-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .gcs-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .gcs-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .gcs-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 眉题 + 大标题 */
      .gcs-kicker{ position: absolute; left: 110px; top: 150px; font-size: 22px; letter-spacing: .3em; color: #141414; }
      .gcs-kicker b{ color: #9A9A92; font-weight: 400; }
      .gcs-title{ position: absolute; left: 110px; top: 196px; font-size: 72px; font-weight: 900; letter-spacing: .01em; }
      .gcs-title .hl{ position: relative; display: inline-block; padding: 0 12px; }
      .gcs-title .hl i{ position: absolute; left: 0; right: 0; top: 6px; bottom: 6px; background: var(--ac, #00FF00);
        z-index: -1; transform: scaleX(0); transform-origin: 0 50%; }
      /* 灰卡一排 */
      .gcs-row{ position: absolute; left: 110px; right: 110px; top: 380px; height: 420px; z-index: 4;
        display: flex; gap: 40px; }
      .gcs-card{ position: relative; flex: 1; height: 420px; background: #E4E3DB;
        border: 3px solid #9A9A92; padding: 34px 30px; }
      .gcs-card .idx{ font-size: 20px; letter-spacing: .2em; color: #9A9A92; }
      .gcs-card .txt{ margin-top: 150px; font-size: 34px; font-weight: 900; line-height: 1.35; color: #9A9A92; }
      .gcs-card .bar{ position: absolute; left: 30px; right: 30px; top: 96px; height: 3px; background: #9A9A92;
        transform: scaleX(0); transform-origin: 0 50%; }
      .gcs-stamp{ position: absolute; right: 24px; top: 252px; padding: 12px 22px;
        border: 4px solid var(--ac, #00FF00); color: var(--ac, #00FF00); background: rgba(246,245,239,.85);
        font-size: 30px; font-weight: 900; letter-spacing: .22em; transform: rotate(-8deg); opacity: 0;
        white-space: nowrap; }
      /* 底部绿色署名条 */
      .gcs-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(60px); }
      .gcs-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .gcs-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="gcs-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="gcs-kicker mono" id="kicker"></div>
      <div class="gcs-title">逐条核验，<span class="hl"><i id="hlbg"></i>盖章放行</span></div>
      <div class="gcs-row" id="row"></div>
      <div class="gcs-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · GRAY CARDS STAMP</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "VOL.15 · 视觉动效库", "pageno": "P.378 / 400", "kicker": "CHECKLIST · 逐项核验", "items": "信息源可信；数据可复核；结论可复现；方法可迁移", "stamp": "已验证", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      const kc = String(V.kicker).split("·");
      $("kicker").textContent = kc[0].trim();
      if (kc[1]) { const b = document.createElement("b"); b.textContent = " · " + kc.slice(1).join("·").trim(); $("kicker").appendChild(b); }
      const items = String(V.items).split(/[;；]/).map((s) => s.trim()).filter(Boolean).slice(0, 4);
      const row = $("row");
      items.forEach((it, i) => {
        const card = document.createElement("div");
        card.className = "gcs-card";
        card.id = "card" + i;
        const idx = document.createElement("div");
        idx.className = "idx mono";
        idx.textContent = "0" + (i + 1);
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.id = "bar" + i;
        const txt = document.createElement("div");
        txt.className = "txt";
        txt.textContent = it;
        const stamp = document.createElement("div");
        stamp.className = "gcs-stamp";
        stamp.id = "stamp" + i;
        stamp.textContent = V.stamp;
        card.appendChild(idx); card.appendChild(bar); card.appendChild(txt); card.appendChild(stamp);
        row.appendChild(card);
      });
      const n = items.length;
      // 页眉细线 + 文字
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      tl.fromTo("#kicker", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45 }, 0.3);
      tl.fromTo(".gcs-title", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.to("#hlbg", { scaleX: 1, duration: 0.38, ease: "power2.inOut" }, 0.95);
      // 灰卡垫底入场
      tl.fromTo(".gcs-card", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.1, ease: "power3.out" }, 0.7);
      // 逐张点亮 + 盖章
      const step = 3.6 / n;
      items.forEach((_, i) => {
        const t = 1.5 + i * step;
        tl.to("#card" + i, { backgroundColor: "#FFFFFF", borderColor: "#141414",
          boxShadow: "10px 10px 0 #141414", duration: 0.3, ease: "power2.out" }, t);
        tl.to("#card" + i + " .idx", { color: "#141414", duration: 0.3 }, t);
        tl.to("#card" + i + " .txt", { color: "#141414", duration: 0.3 }, t);
        tl.to("#bar" + i, { scaleX: 1, backgroundColor: V.accent ?? "#00FF00", duration: 0.35, ease: "power2.out" }, t + 0.05);
        // 印章砸入 back.out
        tl.fromTo("#stamp" + i, { opacity: 0, scale: 2.4, rotate: -8 },
          { opacity: 1, scale: 1, rotate: -8, duration: 0.45, ease: "back.out(2.2)" }, t + 0.22);
        // 卡片轻顿一下（盖章震感）
        tl.fromTo("#card" + i, { y: 0 }, { y: 5, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, t + 0.5);
      });
      // 底部署名条（提前进场，定格后文字完全静止 ≥1.5s）
      const footT = 3.7;
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, footT);
      tl.fromTo([".gcs-foot .f1", ".gcs-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, footT + 0.2);
      // 时间轴补满到 duration，保证收尾完全静止
      tl.set("#root", {}, Math.max(0, Number(V.duration) - 0.01));
      window.__timelines.main = tl;
    </script>
  </body>
</html>
