<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "章节标题", "default": "自动发布"}, {"id": "block1", "type": "string", "label": "内容块1", "default": "配置一次发布时间"}, {"id": "block2", "type": "string", "label": "内容块2", "default": "选择目标平台"}, {"id": "block3", "type": "string", "label": "内容块3", "default": "查看发布状态"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#ttl{ position:absolute; left:0; top:0; font-size:120px; color:var(--fg); white-space:nowrap; transform-origin:left center; }
#blocks{ position:absolute; left:150px; top:260px; width:1200px; }
.blk{ height:150px; border-radius:16px; background:#15151C; border:1px solid rgba(255,255,255,.1);
  margin-bottom:34px; display:flex; align-items:center; padding:0 40px; font-size:32px; color:rgba(255,255,255,.8); opacity:0; }
.blk::before{ content:''; width:14px; height:60px; border-radius:7px; background:var(--accent); margin-right:28px; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.5" data-width="1920" data-height="1080">
<div id="ttl"></div>
<div id="blocks"><div class="blk" id="b1"></div><div class="blk" id="b2"></div><div class="blk" id="b3"></div></div>
    </div>
    <script>
      const FB = {"title": "自动发布", "block1": "配置一次发布时间", "block2": "选择目标平台", "block3": "查看发布状态", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#ttl').textContent=v.title||'';
$('#b1').textContent=v.block1||'';$('#b2').textContent=v.block2||'';$('#b3').textContent=v.block3||'';
// 居中登场：xPercent 修正随降格同步归零
tl.set('#ttl',{x:960,y:430,xPercent:-50,yPercent:-50},0);
// 显影 12f blur→0 + 站稳 20f
tl.fromTo('#ttl',{opacity:0,filter:'blur(12px)'},{opacity:1,filter:'blur(0px)',duration:F(12),ease:'power3.out'},0);
// 降格：单次连续补间 20f，scale→0.3 飞左上角落成节标签
tl.to('#ttl',{x:150,y:130,scale:.3,xPercent:0,duration:F(20),ease:'power2.inOut'},F(32));
// 内容骨架错峰生长（降格 +12f 起，宽 .35→1 + 上移 28px 淡入）
['#b1','#b2','#b3'].forEach((b,i)=>{
  tl.fromTo(b,{opacity:0,y:28,scaleX:.35,transformOrigin:'left center'},{opacity:1,y:0,scaleX:1,duration:F(16),ease:'power3.out'},F(44)+F(i*5));
});
tl.to({},{duration:F(45)},F(60)); // 真静止

      window.__timelines.main = tl;
    </script>
  </body>
</html>
