<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"两种方法的效率差距"},{"id":"itemA","type":"string","label":"项目 A","default":"传统整理"},{"id":"valueA","type":"number","label":"数值 A","default":42},{"id":"itemB","type":"string","label":"项目 B","default":"AI 辅助"},{"id":"valueB","type":"number","label":"数值 B","default":86},{"id":"unit","type":"string","label":"单位","default":"%"},{"id":"caption","type":"string","label":"结论","default":"AI 辅助在资料聚合和初稿生成阶段优势更明显。"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="5.5" data-track-index="1">

        <div class="gridbg"></div>
        <header style="position:relative;z-index:2;margin-bottom:70px;">
          <span class="chip"><b>COMPARE</b>对比</span>
          <h1 id="title" class="num" style="margin:18px 0 0;font-size:52px;"></h1>
        </header>
        <div style="display:flex;flex-direction:column;gap:64px;">
          <div class="trow" id="rowA">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;">
              <span class="rlab" style="font-size:32px;color:#9CA3AF;"></span>
              <span class="rval num" style="font-size:44px;color:#9CA3AF;">0</span>
            </div>
            <div style="height:56px;background:#1A1A1E;border-radius:12px;overflow:hidden;">
              <div class="track" style="height:100%;width:100%;background:#3F3F46;border-radius:12px;transform-origin:left;transform:scaleX(0);"></div>
            </div>
          </div>
          <div class="trow" id="rowB">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;">
              <span class="rlab" style="font-size:32px;color:var(--accent,#00FF00);"></span>
              <span class="rval num" style="font-size:44px;color:var(--accent,#00FF00);">0</span>
            </div>
            <div style="height:56px;background:#1A1A1E;border-radius:12px;overflow:hidden;">
              <div class="track" style="height:100%;width:100%;background:linear-gradient(90deg,color-mix(in srgb, var(--accent) 50%, transparent),var(--accent,#00FF00));border-radius:12px;transform-origin:left;transform:scaleX(0);"></div>
            </div>
          </div>
        </div>
        <p id="caption" style="margin-top:70px;font-size:28px;color:#D4D4D8;border-left:4px solid var(--accent,#00FF00);padding-left:22px;"></p>

      </section>
    </div>
    <script>
      const fallback = {"title": "两种方法的效率差距", "itemA": "传统整理", "valueA": 42, "itemB": "AI 辅助", "valueB": 86, "unit": "%", "caption": "AI 辅助在资料聚合和初稿生成阶段优势更明显。", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 5.5;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("title").textContent = v.title; $("caption").textContent = v.caption;
      const maxV = Math.max(Number(v.valueA), Number(v.valueB), 1);
      const rows = [["#rowA", v.itemA, Number(v.valueA)], ["#rowB", v.itemB, Number(v.valueB)]];
      rows.forEach(([sel, lab, val]) => {
        const el = document.querySelector(sel);
        el.querySelector(".rlab").textContent = lab;
        el.querySelector(".track").style.transform = `scaleX(${val / maxV})`;
        el.querySelector(".track").style.transition = "none";
        gsap.set(el.querySelector(".track"), { scaleX: 0 });
        el.dataset.target = val / maxV;
        el.dataset.val = val;
      });
      tl.fromTo("header", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "power3.out" }, 0.1);
      document.querySelectorAll(".rval").forEach((el) => { el.textContent = "0" + (v.unit || ""); });
      rows.forEach(([sel], i) => {
        const el = document.querySelector(sel);
        tl.fromTo(el, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5 }, 0.4 + i * 0.4);
        tl.to(el.querySelector(".track"), { scaleX: Number(el.dataset.target), duration: 1.1, ease: "power4.inOut" }, 0.6 + i * 0.4);
        const rv = el.querySelector(".rval"), target = Number(el.dataset.val), o = { n: 0 };
        tl.to(o, { n: target, duration: 1.1, ease: "power2.out", onUpdate: () => { rv.textContent = Math.round(o.n) + (v.unit || ""); } }, 0.6 + i * 0.4);
      });
      tl.fromTo("#caption", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5 }, 2.2);
      tl.to(".scene", { clipPath: "inset(100% 0 0 0)", duration: 0.5, ease: "power2.in" }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
