<body>
<div id="stage">

  <div class="eyebrow" id="eb">BEFORE / AFTER</div>
  <div class="h1" id="h1" data-fit-max="76" data-fit-min="44">同一个团队，三个月前后</div>

  <div class="bah" id="r0" style="top:430px">

    <div class="arrow" id="a0"></div>

    <div class="note3" id="n0" data-fit-max="26" data-fit-min="18">只改了落地页第一屏，文案从「功能清单」换成「一个具体场景」</div>
  </div>

    <div class="before" id="b1">6 天</div>

  </div>

  <div class="bah" id="r2" style="top:774px">
    <div class="rule"></div>

    <div class="before" id="b2">¥41</div>

  <div class="foot" id="foot" data-fit-max="34" data-fit-min="22">只有一个数变好了，先别庆祝。看第二个数是不是在往相反方向走。</div>

</div>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  var tl = B.tl();
  /* 规格包：先定风格，再建任何元素。
     画面素材的配色**不跟着包走**——那是"底片"，用户自己的东西不能被模板改色；
     跟着包走的只有 UI 层（字色、强调色、描边、圆角、曲线）。这个边界必须守住。 */
  B.pack(v.pack);
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  function q(s) { return document.querySelector(s); }
  /* 素材位接真视频：留空就继续用 CSS 画面 */
  function live(n, src) {
    if (!src) return;
    var s = document.getElementById('s' + n), e = document.getElementById('v' + n);
    if (!s || !e) return;
    s.classList.add('live'); e.src = src;
    e.play().catch(function () {});
  }
  /* 景别缓推：v1/v3 里画面始终在极慢地动，这是「像镜头」的关键 */
  function push(n, at, dur, from, to, ease) {
    var s = q('#s' + n + ' .sky'), g = q('#s' + n + ' .glow'), r = q('#s' + n + ' .r2');
    if (s) tl.fromTo(s, { scale: from, y: '0%' },
      { scale: to, y: '-2%', duration: dur, ease: ease || 'none' }, at);
    if (g) tl.fromTo(g, { xPercent: -4, opacity: .8 },
      { xPercent: 5, opacity: 1, duration: dur, ease: 'none' }, at);
    if (r) tl.fromTo(r, { xPercent: 0 },
      { xPercent: -2.5, duration: dur, ease: 'none' }, at);
  }
  /* clip-path 形状插值。
     两个坑都在这里踩过：
       1. GSAP 各版本对 clipPath 字符串补间的处理不一致，所以不直接补间它，
          改成补间一个 {t:0→1} 的代理对象，onUpdate 里自己算 8 个点；
       2. **from 必须是编译期常量，不能从元素当前状态读。**
          settle 会把时间轴来回扫；一旦回退越过一个已完成的补间，
          GSAP 会把它按 ratio 0 重渲——onUpdate 拿到的就是起点，
          形状会「弹回矩形」。写成常量后，形状是 t 的纯函数，
          停在任何一帧算出来都一样。
     相邻两段的 from 必须等于上一段的 to，这条由 Python 侧保证。 */
  function polyStr(pts) {
    return 'polygon(' + pts.map(function (p) {
      return p[0].toFixed(2) + '% ' + p[1].toFixed(2) + '%'; }).join(',') + ')';
  }
  function morph(el, from, to, at, dur, ease) {
    if (!el || !to || !from || from.length !== to.length) return;
    var st = { t: 0 };
    tl.to(st, { t: 1, duration: dur == null ? .7 : dur, ease: ease || 'power2.inOut',
      onUpdate: function () {
        el.style.clipPath = polyStr(from.map(function (p, i) {
          return [p[0] + (to[i][0] - p[0]) * st.t,
                  p[1] + (to[i][1] - p[1]) * st.t];
        }));
      } }, at);
  }
  set('eb', v.eyebrow); set('h1', v.title); set('foot', v.foot);
  /* id 和取值写成一串**字面量对**再循环绑，不要写 set('v' + k, NS[k])。
     动态拼接的 set 目标，F2 静态扫不到（前缀拼错也没人管）——
     上一版就是 `set('v' + k, NS[k])` 写成了注解，结果注解灌进了「改之后」那一列，
     而「改之后」的真实取值一次没绑过：画面上三行橙色长句，
     F1/F2/F3 三条断言全静。
     写成字面量对之后，F2 就能逐个核对。
     注意：箭头的 id 是 a0/a1/a2，但它是纯装饰线，**不绑任何文字**——
     上一版多绑了一组，箭头上就多出一个小小的「3.4%」。 */
  [['m0', v.m1], ['b0', v.b1], ['v0', v.a1], ['n0', v.n1],
   ['m1', v.m2], ['b1', v.b2], ['v1', v.a2], ['n1', v.n2],
   ['m2', v.m3], ['b2', v.b3], ['v2', v.a3], ['n2', v.n3]
  ].forEach(function (p) { set(p[0], p[1]); });

  tl.fromTo('#eb', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .4 }, 0);
  tl.fromTo('#h1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .06);
  tl.fromTo('#hd', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .4 }, .3);
  for (var i = 0; i < 3; i++) {
    var at = .6 + i * .56;
    tl.fromTo('#r' + i, { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: .45, ease: 'power3.out' }, at);
    /* 箭头是**固定宽度**，不量左边那列。
       量宽度这件事在这一族已经栽过三次（§19 造副本、§22 划线、这里）：
       `.before` 是 width:380px 的块级，offsetWidth 恒等于 380，
       于是「文字有多宽」永远是 380，箭头直接穿到右边那列上。
       两列之间的空档是 1000~1140，箭头 140 就够。 */
    tl.fromTo('#a' + i, { width: 0 },
        { width: 140, duration: .4, ease: 'power2.inOut' }, at + .2);
    tl.fromTo('#v' + i, { opacity: 0, x: 18 },
        { opacity: 1, x: 0, duration: .4, ease: 'power3.out' }, at + .34);
  }
  tl.fromTo('#fline', { width: 0 }, { width: 200, duration: .5, ease: 'power3.out' }, 2.6);
  tl.fromTo('#foot', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .5 }, 2.72);
  B.hold(tl, 3.9, .6);
  B.fitAll();

})();
</script>
</body>
</html>
