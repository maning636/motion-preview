<!DOCTYPE html>
<html lang="zh-CN" data-composition-variables='[{"id": "chapterNo", "type": "string", "label": "章节序号", "default": "INTERLUDE"}, {"id": "chapterTitle", "type": "string", "label": "章节标题", "default": "幕间休息"}, {"id": "subtitle", "type": "string", "label": "副标题", "default": "Please Stand By"}, {"id": "accent", "type": "color", "label": "强调色（横条）", "default": "#b91c1c"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
<head>
  <meta charset="UTF-8">
  <title>横条大标题·皮影档案</title>
  <script src="../_lib/gsap.min.js"></script>
  <style>
    :root { --accent: #b91c1c; --ink: #0a0a0a; --paper: #faf6ed; --warm: #8b7355; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "MiSans", "PingFang SC", "Source Han Serif", "Songti SC", serif; }
    .composition { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
    .layer { position: absolute; inset: 0; }
    .l1-bg { z-index: 1; }
    .paper-base { position: absolute; inset: 0; background: var(--paper); }
    .paper-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(61,40,23,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(61,40,23,0.08) 1px, transparent 1px); background-size: 48px 48px; }
    .grain-layer { position: absolute; inset: 0; background-image: url("./assets/grain.png"); background-size: 320px 320px; opacity: 0.25; mix-blend-mode: multiply; }
    .paper-age { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 60%, rgba(61,40,23,0.18) 100%); }

    /* 横条大标题——黑底米白字，顶部贯通（最简版：block 流式布局，不用 flex） */
    .banner-wrap { z-index: 11; }
    .banner {
      position: absolute; left: 0; right: 0; top: 360px;
      height: 280px;
      background: var(--ink);
      padding: 64px 100px;
      box-sizing: border-box;
    }
    .banner-no {
      font-family: "Courier New", monospace;
      font-size: 28px;
      color: rgba(250,246,237,0.55);
      letter-spacing: 0.3em;
      font-weight: 700;
      margin-bottom: 30px;
    }
    .banner-title {
      font-family: "Source Han Serif", "Songti SC", "STSong", serif;
      font-size: 140px;
      color: var(--paper);
      font-weight: 900;
      letter-spacing: 0.1em;
      padding-left: 0.1em;
      line-height: 1;
    }
    /* 朱砂色块（独立 div，不在 banner 内，避免 flex 干扰） */
    .banner-accent {
      position: absolute; left: 0; top: 360px;
      width: 16px; height: 280px;
      background: var(--accent);
      z-index: 12;
    }

    .subtitle {
      position: absolute; left: 100px; top: 700px;
      font-family: "Source Han Serif", "Songti SC", serif;
      font-size: 26px;
      font-style: italic;
      color: var(--warm);
      letter-spacing: 0.15em;
      z-index: 11;
    }

    .l5-decoration { z-index: 40; pointer-events: none; }
    .stamp-bottom {
      position: absolute; right: 100px; bottom: 100px;
      font-family: "Courier New", monospace;
      font-size: 14px;
      color: var(--ink);
      letter-spacing: 0.2em;
      text-align: right;
      line-height: 1.8;
      z-index: 40;
    }
    .stamp-bottom .num {
      font-family: "Source Han Serif", "Songti SC", serif;
      font-size: 56px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    .l6-environment { z-index: 50; pointer-events: none; }
    .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.15) 100%); }
    .progress-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); width: 0%; z-index: 60; }

    /* 初始态 */
    .banner-wrap { opacity: 0; transform: translateX(-80px); }
    .subtitle { opacity: 0; }
    .stamp-bottom { opacity: 0; }
  </style>
</head>
<body>
  <div id="composition" class="composition" data-composition-id="docu-title-banner-2026-08-31" data-start="0" data-duration="6" data-width="1920" data-height="1080">
    <div class="layer l1-bg">
      <div class="paper-base"></div>
      <div class="paper-grid"></div>
      <div class="grain-layer"></div>
      <div class="paper-age"></div>
    </div>
    <div class="layer banner-wrap">
      <div class="banner-accent"></div>
      <div class="banner">
        <div class="banner-no" data-composition-variable="chapterNo">INTERLUDE</div>
        <div class="banner-title" data-composition-variable="chapterTitle">幕间休息</div>
      </div>
    </div>
    <div class="layer l3-subtitle" style="z-index:11;">
      <div class="subtitle" data-composition-variable="subtitle">Please Stand By</div>
    </div>
    <div class="layer l5-decoration">
      <div class="stamp-bottom">
        CHAPTER<br/>
        <span class="num">005</span>
      </div>
    </div>
    <div class="layer l6-environment">
      <div class="vignette"></div>
    </div>
    <div class="progress-bar"></div>
  </div>
  <script>
    window.addEventListener("load", () => {
      const vars = window.__hyperframes?.getVariables?.() || {};
      const duration = Math.max(1, Number(vars.duration) || 6);
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      window.__timelines = window.__timelines || {};
      // banner-wrap 整个从左侧推入
      tl.to(".banner-wrap", { opacity: 1, x: 0, duration: 0.7, ease: "power2.out" }, 0);
      tl.to(".subtitle", { opacity: 1, duration: 0.5 }, 0.8);
      tl.to(".stamp-bottom", { opacity: 1, duration: 0.5 }, 1.0);
      const exitAt = Math.max(2.0, duration - 0.6);
      tl.to(".subtitle", { opacity: 0, duration: 0.4 }, exitAt);
      tl.to(".stamp-bottom", { opacity: 0, duration: 0.4 }, exitAt);
      tl.to(".progress-bar", { width: "100%", duration: duration, ease: "none" }, 0);
      window.__timelines["docu-title-banner-2026-08-31"] = tl;
      window.__hyperframes?.ready?.();
    });
  </script>
</body>
</html>
