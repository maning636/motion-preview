<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "kicker", "type": "string", "label": "眉题", "default": "MOSAIC · 碎片化之后"}, {"id": "title", "type": "string", "label": "大标题", "default": "重组出"}, {"id": "hl", "type": "string", "label": "高亮词（接标题后）", "default": "完整信息页"}, {"id": "desc", "type": "string", "label": "说明（；分两行）", "default": "24 块马赛克沿对角线错峰翻面；格缝收拢，版面落定"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .mr-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .mr-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .mr-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .mr-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 舞台：信息页 + 马赛克格阵列 */
      .mr-stage{ position: absolute; left: 260px; top: 170px; width: 1400px; height: 740px; z-index: 4;
        perspective: 1600px; }
      .mr-shadow{ position: absolute; left: 16px; top: 16px; width: 1400px; height: 740px; background: #141414; }
      .mr-page{ position: absolute; left: 0; top: 0; width: 1400px; height: 740px; background: #fff;
        border: 3px solid #141414; display: flex; flex-direction: column; justify-content: center;
        padding: 0 110px; }
      .mr-kicker{ font-size: 22px; letter-spacing: .3em; color: #141414; }
      .mr-kicker b{ color: #9A9A92; font-weight: 400; }
      .mr-title{ margin-top: 30px; font-size: 96px; font-weight: 900; line-height: 1.2; letter-spacing: .01em; }
      .mr-title span{ display: inline-block; }
      .mr-title .hl{ position: relative; display: inline-block; padding: 0 16px; }
      .mr-title .hl i{ position: absolute; left: 0; right: 0; top: 8px; bottom: 8px; background: var(--ac, #00FF00);
        z-index: -1; transform: scaleX(0); transform-origin: 0 50%; }
      .mr-desc{ margin-top: 34px; font-family: 'MiSans SemiBold', sans-serif; font-size: 28px;
        line-height: 1.8; color: #55554E; }
      .mr-grid{ position: absolute; left: 0; top: 0; width: 1400px; height: 740px; z-index: 3;
        display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(4, 1fr);
        transform-style: preserve-3d; }
      .mr-tile{ border: 2px solid #141414; will-change: transform, opacity; }
      /* 底部荧光绿署名条 */
      .mr-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(64px); }
      .mr-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .mr-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="mr-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol">SC2 · 视觉动效库</div>
        <div class="r mono" id="pageno">P.304 / 400</div>
      </div>
      <div class="mr-stage">
        <div class="mr-shadow" id="shadow"></div>
        <div class="mr-page" id="page">
          <div class="mr-kicker mono" id="kicker"></div>
          <div class="mr-title"><span id="title"></span><span class="hl"><i id="hlbg"></i><span id="hl"></span></span></div>
          <div class="mr-desc"><div id="desc1"></div><div id="desc2"></div></div>
        </div>
        <div class="mr-grid" id="grid"></div>
      </div>
      <div class="mr-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · MOSAIC REFRAME</div>
      </div>
    </div>
    <script>
      const fallback = {"kicker": "MOSAIC · 碎片化之后", "title": "重组出", "hl": "完整信息页", "desc": "24 块马赛克沿对角线错峰翻面；格缝收拢，版面落定", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      // 文案
      const kc = String(V.kicker).split("·");
      $("kicker").textContent = kc[0].trim();
      if (kc[1]) { const b = document.createElement("b"); b.textContent = " · " + kc.slice(1).join("·").trim(); $("kicker").appendChild(b); }
      $("title").textContent = V.title;
      $("hl").textContent = V.hl;
      const dl = String(V.desc).split(/[；;]/).map(s => s.trim());
      $("desc1").textContent = dl[0] || "";
      $("desc2").textContent = dl[1] || "";
      // 6×4 马赛克格阵列：纸白/浅灰/荧光绿杂色
      const COLS = 6, ROWS = 4;
      const palette = ["#ffffff", "#E9E8E1", "#ffffff", "#E9E8E1", "#ffffff", V.accent ?? "#00FF00"];
      const tiles = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const t = document.createElement("div");
          t.className = "mr-tile";
          t.style.background = palette[(r * COLS + c + r) % palette.length];
          $("grid").appendChild(t);
          tiles.push({ el: t, d: c + r }); // 对角线距离
        }
      }
      // 页眉 + 舞台阴影 + 署名条
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      tl.fromTo("#shadow", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.4);
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 0.8);
      tl.fromTo([".mr-foot .f1", ".mr-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 1.05);
      // 格块浮现（对角错峰，初始带缝 scale 0.9）
      tiles.forEach(({ el, d }) => {
        tl.fromTo(el, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 0.9, duration: 0.5, ease: "back.out(1.6)" }, 0.4 + d * 0.05);
      });
      // 格缝收拢：scale 0.9 → 1
      tiles.forEach(({ el, d }) => {
        tl.to(el, { scale: 1, duration: 0.4, ease: "power2.inOut" }, 1.7 + d * 0.03);
      });
      // 沿对角线错峰 rotateY 翻面，露出信息页
      tiles.forEach(({ el, d }) => {
        tl.to(el, { rotationY: -95, opacity: 0, duration: 0.45, ease: "power2.in", transformPerspective: 1600 }, 2.5 + d * 0.09);
      });
      // 翻面结束后格阵整体隐藏（visibility:hidden），避免遮挡信息页文字
      tl.set("#grid", { autoAlpha: 0 }, 3.8);
      // 信息页内容渐次落定
      tl.fromTo("#kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45 }, 2.9);
      tl.fromTo(["#title", ".hl"], { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.55, stagger: 0.12, ease: "power3.out" }, 3.05);
      tl.to("#hlbg", { scaleX: 1, duration: 0.38, ease: "power2.inOut" }, 3.7);
      tl.fromTo(["#desc1", "#desc2"], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.14 }, 3.85);
      // 定格尾段：把时间轴撑到 6s，保证信息页完全静止 ≥1.5s（QA 可读窗口）
      tl.set("#page", { x: 0 }, 5.98);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
