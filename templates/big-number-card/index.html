<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","type":"string","label":"角标","default":"核心结论"},{"id":"prefix","type":"string","label":"前缀","default":"效率提升"},{"id":"value","type":"number","label":"数字","default":3.2},{"id":"unit","type":"string","label":"单位","default":"倍"},{"id":"caption","type":"string","label":"说明","default":"同样的选题流程，AI 参与后从整理资料到产出初稿明显提速。"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="5" data-track-index="1">

        <div class="gridbg"></div>
        <span class="corner" style="top:72px;left:88px;border-top:3px solid var(--accent,#00FF00);border-left:3px solid var(--accent,#00FF00);"></span>
        <span class="corner" style="bottom:72px;right:88px;border-bottom:3px solid var(--accent,#00FF00);border-right:3px solid var(--accent,#00FF00);"></span>
        <style>.corner{position:absolute;width:64px;height:64px;opacity:0;}</style>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;">
          <span class="chip" id="eyebrow"></span>
          <div style="display:flex;align-items:baseline;gap:20px;">
            <span id="prefix" style="font-size:44px;color:#D4D4D8;"></span>
            <span class="num" id="value" style="font-size:260px;line-height:1;color:var(--accent,#00FF00);">0</span>
            <span class="num" id="unit" style="font-size:72px;color:var(--accent,#00FF00);"></span>
          </div>
          <div id="under" style="width:0;height:4px;background:var(--accent,#00FF00);"></div>
          <p id="caption" style="max-width:900px;text-align:center;font-size:26px;line-height:1.7;color:#9CA3AF;margin:14px 0 0;"></p>
        </div>

      </section>
    </div>
    <script>
      const fallback = {"eyebrow": "核心结论", "prefix": "效率提升", "value": 3.2, "unit": "倍", "caption": "同样的选题流程，AI 参与后从整理资料到产出初稿明显提速。", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 5;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("eyebrow").textContent = v.eyebrow; $("prefix").textContent = v.prefix;
      $("unit").textContent = v.unit; $("caption").textContent = v.caption;
      const dec = String(v.value).includes(".") ? 1 : 0;
      tl.to(".corner", { opacity: 1, duration: 0.4, stagger: 0.1 }, 0.1);
      tl.fromTo("#eyebrow", { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.2);
      tl.fromTo("#prefix", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.4);
      countTo($("value"), v.value, 0.5, 1.4, dec);
      tl.fromTo("#unit", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4 }, 1.6);
      tl.to("#under", { width: 520, duration: 0.6, ease: "power3.inOut" }, 1.7);
      tl.fromTo("#caption", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 2.0);
      tl.to(".scene", { opacity: 0, scale: 0.98, duration: 0.5 }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
