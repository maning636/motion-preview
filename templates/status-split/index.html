<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"leftTitle","type":"string","label":"左侧状态","default":"往年常规"},{"id":"leftTag","type":"string","label":"左侧标签","default":"稳定期"},{"id":"rightTitle","type":"string","label":"右侧状态","default":"2026 异常"},{"id":"rightTag","type":"string","label":"右侧标签","default":"高温 · 潮湿"},{"id":"connector","type":"string","label":"转折词","default":"转向"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="5" data-track-index="1">

        <div style="position:absolute;inset:0;display:flex;">
          <div id="halfL" style="flex:1;background:#101013;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;">
            <span class="chip" id="leftTag" style="color:#9CA3AF;"></span>
            <h2 id="leftTitle" class="num" style="margin:0;font-size:64px;color:#9CA3AF;"></h2>
          </div>
          <div id="halfR" style="flex:1;background:color-mix(in srgb, var(--accent) 6%, transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;">
            <span class="chip" id="rightTag" style="border-color:var(--accent,#00FF00);"><b></b></span>
            <h2 id="rightTitle" class="num" style="margin:0;font-size:64px;color:var(--accent,#00FF00);"></h2>
          </div>
        </div>
        <div id="conn" class="num" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);padding:18px 30px;background:#0A0A0B;border:2px solid var(--accent,#00FF00);border-radius:14px;font-size:34px;color:var(--accent,#00FF00);z-index:5;"></div>

      </section>
    </div>
    <script>
      const fallback = {"leftTitle": "往年常规", "leftTag": "稳定期", "rightTitle": "2026 异常", "rightTag": "高温 · 潮湿", "connector": "转向", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 5;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("leftTag").textContent = v.leftTag; $("leftTitle").textContent = v.leftTitle;
      $("rightTag").innerHTML = "<b>" + v.rightTag + "</b>"; $("rightTitle").textContent = v.rightTitle;
      $("conn").textContent = v.connector;
      tl.fromTo("#halfL", { xPercent: -100 }, { xPercent: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.fromTo("#halfR", { xPercent: 100 }, { xPercent: 0, duration: 0.7, ease: "power3.out" }, 0.2);
      tl.fromTo("#conn", { rotate: -90, scale: 0 }, { rotate: 0, scale: 1, duration: 0.6, ease: "back.out(2)" }, 1.2);
      tl.to(".scene", { opacity: 0, duration: 0.5 }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
