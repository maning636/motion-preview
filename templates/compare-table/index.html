<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"模型能力对比"},{"id":"objects","type":"string","label":"对比对象（逗号分隔）","default":"Claude,GPT-4,Gemini"},{"id":"dimensions","type":"string","label":"对比维度（逗号分隔）","default":"推理,代码,长上下文,多模态,价格"},{"id":"valuesA","type":"string","label":"对象 A 各维度值","default":"强,强,中,弱,高"},{"id":"valuesB","type":"string","label":"对象 B 各维度值","default":"强,中,强,中,中"},{"id":"valuesC","type":"string","label":"对象 C 各维度值","default":"中,中,强,强,低"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 48px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .table-wrap{ border: 1px solid rgba(244,239,231,0.14); border-radius: 8px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .row{ display: grid; grid-template-columns: 240px repeat(3, 1fr); min-height: 88px; align-items: center; border-bottom: 1px solid rgba(244,239,231,0.10);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .row:last-child{ border-bottom: none;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .row.head{ background: rgba(244,239,231,0.04);font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .cell{ padding: 0 32px; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 26px; font-weight: 500; }
      .cell.dim{ opacity: 0.55; font-size: 22px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .cell.object{ font-weight: 700; font-size: 30px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .cell.win{ color: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
        </div>
        <div class="table-wrap" id="table"></div>
      </section>
    </div>
    <script>
      const fallback = { title: "模型能力对比", objects: "Claude,GPT-4,Gemini", dimensions: "推理,代码,长上下文,多模态,价格", valuesA: "强,强,中,弱,高", valuesB: "强,中,强,中,中", valuesC: "中,中,强,强,低", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      const objects = String(v.objects).split(",").map(s => s.trim());
      const dims = String(v.dimensions).split(",").map(s => s.trim());
      const valsA = String(v.valuesA).split(",").map(s => s.trim());
      const valsB = String(v.valuesB).split(",").map(s => s.trim());
      const valsC = String(v.valuesC).split(",").map(s => s.trim());
      const allVals = [valsA, valsB, valsC];
      const table = document.getElementById("table");

      const head = document.createElement("div");
      head.className = "row head";
      head.innerHTML = '<div class="cell dim">DIMENSION</div>' + objects.map(o => `<div class="cell object">${o}</div>`).join("");
      table.appendChild(head);

      dims.forEach((dim, i) => {
        const row = document.createElement("div");
        row.className = "row";
        const rowVals = allVals.map(arr => arr[i] || "");
        const scores = rowVals.map(x => ({ "强": 3, "中": 2, "弱": 1, "高": 3, "中": 2, "低": 1, "是": 2, "否": 0 }[x] || 0));
        const maxScore = Math.max(...scores);
        row.innerHTML = `<div class="cell dim">${dim}</div>` + rowVals.map((val, j) => `<div class="cell${scores[j] === maxScore && maxScore > 0 ? " win" : ""}">${val}</div>`).join("");
        table.appendChild(row);
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".row", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.1, ease: "power2.out" }, 0.4);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
