<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "GEAR / 装备清单"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "出门干活带这几样就够"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：元"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#FF8A3D"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>分栏数字条 · 出门干活带这几样就够</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{gap:20px}
  .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
       border:var(--bw) solid var(--ink);border-radius:4px;overflow:hidden;
       box-shadow:7px 7px 0 var(--ink)}
  .col .cap{flex:0 0 auto;height:14px;background:var(--ink)}
  .col .in{flex:1 1 auto;display:flex;flex-direction:column;align-items:flex-start;
           justify-content:space-between;padding:24px 22px 20px;min-height:0}
  .col .top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .col .ico{width:50px;height:50px;border:var(--bw) solid var(--ink);border-radius:4px;
            display:flex;align-items:center;justify-content:center;
            background:var(--paper);color:var(--ink);flex:0 0 auto}
  .col .idx{font-family:var(--mono);font-weight:700;font-size:34px;line-height:1;
            letter-spacing:-.04em;opacity:.42}
  .col .mid{flex:1 1 auto;display:flex;flex-direction:column;gap:12px;min-height:0;
            justify-content:center;width:100%}
  .col .k{font-family:var(--mono);font-weight:700;font-size:18px;letter-spacing:.06em;
          line-height:1.35;width:100%;opacity:.9;white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis}
  /* nowrap 是必须的：128px 字号下「1.2亿」「18 个月」会各自断成两行，
     版面上就是「1.2」下面挂一个「亿」。不锁的话 B.fit 量到的宽度也不对。 */
  .col .v{font-family:var(--mono);font-weight:700;font-size:128px;line-height:.88;
          letter-spacing:-.06em;font-variant-numeric:tabular-nums;width:100%;
          white-space:nowrap;overflow:hidden}
  .col .share{width:100%;height:12px;border:var(--bw) solid currentColor;position:relative;
          background:var(--paper);overflow:hidden;flex:0 0 auto}
  .col .share i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink)}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">GEAR / 装备清单</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">出门干活带这几样就够</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：元</div></div>
  <div class="body"><div class="blk col " id="c0" style="background:var(--yellow);color:var(--ink);"><div class="cap"></div><div class="in"><span class="top"><span class="ico"><span class="ico"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6a18 18 0 100 36 18 18 0 000-36zM24 13v12l9 6"/></svg></span></span><span class="idx">01</span></span><div class="mid"><span class="v" id="v0" data-fit-max="128" data-fit-min="52">2.1w</span><span class="k" id="k0" data-fit-max="18" data-fit-min="12">总投入</span></div><span class="share"><i id="sh0"></i></span></div></div><div class="blk col " id="c1" style="background:var(--blue);color:var(--ink);"><div class="cap"></div><div class="in"><span class="top"><span class="ico"><span class="ico"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6a18 18 0 100 36 18 18 0 000-36zM24 16a8 8 0 100 16 8 8 0 000-16zM24 1v5M24 42v5M1 24h5M42 24h5"/></svg></span></span><span class="idx">02</span></span><div class="mid"><span class="v" id="v1" data-fit-max="128" data-fit-min="52">主机</span><span class="k" id="k1" data-fit-max="18" data-fit-min="12">最值</span></div><span class="share"><i id="sh1"></i></span></div></div><div class="blk col " id="c2" style="background:var(--green);color:var(--ink);"><div class="cap"></div><div class="in"><span class="top"><span class="ico"><span class="ico"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5l17 6v12c0 11-7 17-17 20C14 40 7 34 7 23V11zM17 24l5 5 10-11"/></svg></span></span><span class="idx">03</span></span><div class="mid"><span class="v" id="v2" data-fit-max="128" data-fit-min="52">92%</span><span class="k" id="k2" data-fit-max="18" data-fit-min="12">使用率</span></div><span class="share"><i id="sh2"></i></span></div></div><div class="blk col " id="c3" style="background:var(--pink);color:var(--ink);"><div class="cap"></div><div class="in"><span class="top"><span class="ico"><span class="ico"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 41V19M19 41V9M31 41V25M43 41V4"/></svg></span></span><span class="idx">04</span></span><div class="mid"><span class="v" id="v3" data-fit-max="128" data-fit-min="52">1</span><span class="k" id="k3" data-fit-max="18" data-fit-min="12">闲置件</span></div><span class="share"><i id="sh3"></i></span></div></div><div class="blk col " id="c4" style="background:var(--orange);color:var(--ink);"><div class="cap"></div><div class="in"><span class="top"><span class="ico"><span class="ico"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5l6 13 14 2-10 10 3 14-13-7-13 7 3-14L4 20l14-2z"/></svg></span></span><span class="idx">05</span></span><div class="mid"><span class="v" id="v4" data-fit-max="128" data-fit-min="52">3</span><span class="k" id="k4" data-fit-max="18" data-fit-min="12">保质期</span></div><span class="share"><i id="sh4"></i></span></div></div></div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2", "k3", "v3", "k4", "v4"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  document.querySelectorAll('.col').forEach(function (c, i) {
    var at = 0.12 + i * 0.11;
    B.in.drop(tl, c, at, { dist: 150, rot: (i % 2 ? 2 : -2), d: 0.62 });
    tl.from(c.querySelector('.cap'), { scaleX: 0, transformOrigin: 'left center',
        duration: 0.62, ease: 'power3.inOut' }, at + 0.1);
  });
  var shares = [0.023, 0.0, 1.0, 0.011, 0.033];
  document.querySelectorAll('.share i').forEach(function (e, i) {
    B.in.grow(tl, e, Math.max(8, shares[i] * 100) + '%', 0.3 + i * 0.11, { d: 0.62 });
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
