<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

.ui{ position:absolute; inset:0; padding:120px 140px; }
.ui .bar{ height:64px; border-radius:14px; margin-bottom:34px; display:flex; align-items:center; padding:0 24px; gap:16px; }
.ui .b{ height:16px; border-radius:8px; }
.ui .grid{ display:flex; gap:28px; }
.ui .card{ flex:1; height:300px; border-radius:18px; padding:26px; }
.ui .cl{ height:14px; border-radius:7px; margin-top:20px; }
#uiL{ background:#F4F4F1; color:#17171A; }
#uiL .bar{ background:#FFFFFF; box-shadow:0 2px 14px rgba(0,0,0,.08); }
#uiL .b{ background:#D8D8D2; }
#uiL .card{ background:#FFFFFF; box-shadow:0 4px 22px rgba(0,0,0,.07); }
#uiL .cl{ background:#E2E2DC; }
#uiD{ background:#101014; color:#EDEDEA; will-change:clip-path,transform; }
#uiD .bar{ background:#1A1A20; }
#uiD .b{ background:#34343C; }
#uiD .card{ background:#1A1A20; }
#uiD .cl{ background:#2A2A32; }
#uiD .acc{ background:var(--accent) !important; }
#edge{ position:absolute; top:-140px; width:4px; height:1360px; background:#FFF;
  box-shadow:0 0 18px 4px rgba(255,255,255,.75); transform:rotate(15deg);
  transform-origin:top center; opacity:0; will-change:left,opacity; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.0" data-width="1920" data-height="1080">

<div class="ui" id="uiL"><div class="bar"><div class="b acc" style="width:44px;background:var(--accent)"></div><div class="b" style="width:130px"></div><div class="b" style="width:80px"></div></div><div class="grid"><div class="card"><div class="cl" style="width:60%"></div><div class="cl" style="width:85%"></div><div class="cl" style="width:45%"></div></div><div class="card"><div class="cl" style="width:70%"></div><div class="cl" style="width:50%"></div><div class="cl" style="width:80%"></div></div><div class="card"><div class="cl" style="width:55%"></div><div class="cl" style="width:75%"></div><div class="cl" style="width:40%"></div></div></div></div>
<div class="ui" id="uiD"><div class="bar"><div class="b acc" style="width:44px;background:var(--accent)"></div><div class="b" style="width:130px"></div><div class="b" style="width:80px"></div></div><div class="grid"><div class="card"><div class="cl" style="width:60%"></div><div class="cl" style="width:85%"></div><div class="cl" style="width:45%"></div></div><div class="card"><div class="cl" style="width:70%"></div><div class="cl" style="width:50%"></div><div class="cl" style="width:80%"></div></div><div class="card"><div class="cl" style="width:55%"></div><div class="cl" style="width:75%"></div><div class="cl" style="width:40%"></div></div></div></div>
<div id="edge"></div>

    </div>
    <script>
      const FB = {"accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

const uiD=$('#uiD'), uiL=$('#uiL'), edge=$('#edge');
const SLANT=290, T0=15, SW=38; // 15° 斜边（tan15°×1080≈289）
function cl(x){return Math.max(0,Math.min(1,x));}
const sim={f:0};
function paint(){
  const f=sim.f;
  const p=cl((f-T0)/SW);
  const e=1-Math.pow(1-p,3); // out-poly3 先快后缓
  const xt=-SLANT-40+e*(1920+2*SLANT+80); // 顶端边界 x（底端超扫 40px+）
  const xb=xt-SLANT;
  uiD.style.clipPath='polygon(0 0,'+xt.toFixed(0)+'px 0,'+xb.toFixed(0)+'px 1080px,0 1080px)';
  edge.style.left=(xt-2)+'px';
  edge.style.opacity=(p>0&&p<1?1:0);
}
paint();
tl.to(sim,{f:120,duration:F(120),ease:'none',onUpdate:paint},0);
// 扫完 2f 亮线淡出；深版 scale 1→0.995→1 坐实；浅色层条件卸载
tl.to(edge,{opacity:0,duration:F(2)},F(53));
tl.set(uiL,{display:'none'},F(55));
tl.to(uiD,{scale:0.995,duration:F(6),ease:'power2.inOut'},F(53));
tl.to(uiD,{scale:1,duration:F(10),ease:'power2.out'},F(59));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
