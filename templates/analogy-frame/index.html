<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"conceptA","type":"string","label":"陌生概念","default":"RAG"},{"id":"descA","type":"string","label":"陌生概念解释","default":"检索增强生成"},{"id":"conceptB","type":"string","label":"熟悉概念","default":"开卷考试"},{"id":"descB","type":"string","label":"熟悉概念解释","default":"可以翻书查资料的考试"},{"id":"dimension","type":"string","label":"类比成立维度","default":"先查资料再回答"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 56px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .card{ flex: 1; border: 1px solid rgba(244,239,231,0.14); border-radius: 8px; padding: 64px 56px; display: flex; flex-direction: column; gap: 20px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .card-label{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 16px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.45; }
      .card-title{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 82px; font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; }
      .card-desc{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 28px; font-weight: 400; line-height: 1.45; opacity: 0.6; }
      .connector{ display: flex; flex-direction: column; align-items: center; gap: 14px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .approx{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 120px; font-weight: 700; line-height: 1; }
      .approx-hint{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 18px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.45; }
      .bottom-hint{ position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%); font-family: 'MEBHeiHeiTi', sans-serif; font-size: 22px; font-weight: 500; opacity: 0.55; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <article class="card" id="cardA">
          <span class="card-label">UNKNOWN</span>
          <h2 class="card-title" id="titleA"></h2>
          <p class="card-desc" id="descA"></p>
        </article>
        <div class="connector">
          <span class="approx" id="approx">≈</span>
          <span class="approx-hint">就像</span>
        </div>
        <article class="card" id="cardB">
          <span class="card-label">FAMILIAR</span>
          <h2 class="card-title" id="titleB"></h2>
          <p class="card-desc" id="descB"></p>
        </article>
        <div class="bottom-hint" id="hint"></div>
      </section>
    </div>
    <script>
      const fallback = { conceptA: "RAG", descA: "检索增强生成", conceptB: "开卷考试", descB: "可以翻书查资料的考试", dimension: "先查资料再回答", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      document.getElementById("titleA").textContent = v.conceptA;
      document.getElementById("descA").textContent = v.descA;
      document.getElementById("titleB").textContent = v.conceptB;
      document.getElementById("descB").textContent = v.descB;
      document.getElementById("hint").textContent = v.dimension;
      document.getElementById("approx").style.color = v.accent;
      document.querySelectorAll(".card").forEach(c => c.style.borderColor = v.accent);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cardA", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 0.2);
      tl.fromTo("#cardA .card-label", { opacity: 0 }, { opacity: 0.45, duration: 0.4 }, 0.5);
      tl.fromTo("#cardA .card-title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.6);
      tl.fromTo("#cardA .card-desc", { opacity: 0, y: 16 }, { opacity: 0.6, y: 0, duration: 0.5, ease: "power2.out" }, 0.9);
      tl.fromTo("#approx", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 0.8);
      tl.fromTo(".approx-hint", { opacity: 0 }, { opacity: 0.45, duration: 0.4 }, 1.1);
      tl.fromTo("#cardB", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 1.0);
      tl.fromTo("#cardB .card-label", { opacity: 0 }, { opacity: 0.45, duration: 0.4 }, 1.3);
      tl.fromTo("#cardB .card-title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.4);
      tl.fromTo("#cardB .card-desc", { opacity: 0, y: 16 }, { opacity: 0.6, y: 0, duration: 0.5, ease: "power2.out" }, 1.7);
      tl.fromTo("#hint", { opacity: 0, y: 16 }, { opacity: 0.55, y: 0, duration: 0.5, ease: "power2.out" }, 2.0);
      tl.to(".scene", { opacity: 0, scale: 1.01, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
