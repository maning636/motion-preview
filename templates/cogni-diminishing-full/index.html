  set('mdnote', v.note);
  /* 眉标和标题必须自己开口。漏掉这两行的话，整条标题从头到尾不出现，
     而 F1~F5 一条都不报——F6 才抓得到（第一版就栽在这）。 */
  tl.fromTo('#eyebrow', { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: .4 }, 0);
  tl.fromTo('#h1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .6,
    ease: 'power3.out' }, .08);
  var HS = [320, 300, 250, 180, 110, 50];
  for (var i = 0; i < 6; i++) {
    var at = .36 + i * .22;
    tl.fromTo('#mdc' + i, { opacity: 0, y: 20 },
      { opacity: 1, y: 0, duration: .4, ease: 'power2.out' }, at);
    /* 柱高一次给足，数字后到——先看见「越来越少」，再听见「少多少」 */
    tl.fromTo('#mdb' + i, { height: 0 },
      { height: HS[i], duration: .5, ease: 'power3.out' }, at + .05);
    tl.fromTo('#mdv' + i, { opacity: 0 }, { opacity: 1, duration: .3 }, at + .3);
    tl.fromTo('#mdl' + i, { opacity: 0 }, { opacity: 1, duration: .3 }, at + .34);
  }
  tl.fromTo('#mdaxis', { width: 0 }, { width: 1680, duration: .6,
    ease: 'power2.inOut' }, .3);
  tl.fromTo('#mdnote', { opacity: 0, y: 16 },
    { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 1.86);
  tl.fromTo('#footline', { width: 0 }, { width: 420, duration: .5, ease: 'power2.out' }, 2.34);
  tl.fromTo('#foot', { opacity: 0 }, { opacity: 1, duration: .5 }, 2.48);

  B.hold(tl, 3.6, .5);
  B.fitAll();

})();
</script>
</body>
</html>
