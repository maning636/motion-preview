<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "LEARNING / 90 天"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "九十天学一件事的账"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：小时"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#FF8A3D"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>环绕 · 九十天学一件事的账</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{position:relative;flex:1 1 auto;min-height:0}
  .hub{position:absolute;left:50%;top:50%;width:380px;height:380px;margin:-190px 0 0 -190px;
        border-radius:50%;border:var(--bw) solid var(--ink);background:var(--accent);
        color:var(--ink);display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:6px;box-shadow:9px 9px 0 var(--ink);z-index:2;text-align:center}
  .hub .pv{font-family:var(--mono);font-weight:700;font-size:104px;line-height:.9;
        letter-spacing:-.05em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hub .pk{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.14em}
  .sat{position:absolute;width:300px;height:150px;margin:-75px 0 0 -150px;
        border:var(--bw) solid var(--ink);border-radius:4px;padding:0 20px;
        display:flex;align-items:center;gap:16px;box-shadow:6px 6px 0 var(--ink);
        z-index:1;min-width:0}
  .sat .ico{flex:0 0 46px;width:46px;height:46px}
  .sat .tx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
  .sat .nm{font-weight:900;font-size:24px;line-height:1.1;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis}
  .sat .vv{font-family:var(--mono);font-weight:700;font-size:42px;line-height:.92;
        letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">LEARNING / 90 天</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">九十天学一件事的账</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：小时</div></div>
  <div class="body"><div class="sat" id="sat0" style="left:calc(50% + 0px);top:calc(50% + -250px);background:var(--pink);color:var(--ink)"><span class="ico"><span class="ico"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 41V19M19 41V9M31 41V25M43 41V4"/></svg></span></span><span class="tx"><span class="nm" id="k0" data-fit-max="24" data-fit-min="13">第 1 月</span><span class="vv" id="v0" data-fit-max="42" data-fit-min="21">28</span></span></div><div class="sat" id="sat1" style="left:calc(50% + 560px);top:calc(50% + 0px);background:var(--orange);color:var(--ink)"><span class="ico"><span class="ico"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5l6 13 14 2-10 10 3 14-13-7-13 7 3-14L4 20l14-2z"/></svg></span></span><span class="tx"><span class="nm" id="k1" data-fit-max="24" data-fit-min="13">第 2 月</span><span class="vv" id="v1" data-fit-max="42" data-fit-min="21">34</span></span></div><div class="sat" id="sat2" style="left:calc(50% + 0px);top:calc(50% + 250px);background:var(--purple);color:var(--ink)"><span class="ico"><span class="ico"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 25l11 11L40 12"/></svg></span></span><span class="tx"><span class="nm" id="k2" data-fit-max="24" data-fit-min="13">第 3 月</span><span class="vv" id="v2" data-fit-max="42" data-fit-min="21">41</span></span></div><div class="sat" id="sat3" style="left:calc(50% + -560px);top:calc(50% + 0px);background:var(--white);color:var(--ink)"><span class="ico"><span class="ico"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 4l18 10v20L24 44 6 34V14zM6 14l18 10 18-10M24 24v20"/></svg></span></span><span class="tx"><span class="nm" id="k3" data-fit-max="24" data-fit-min="13">第 4 月</span><span class="vv" id="v3" data-fit-max="42" data-fit-min="21">52</span></span></div><div class="hub"><span class="pv" id="h1" data-fit-max="104" data-fit-min="52">155</span><span class="pk" id="h2" data-fit-max="15" data-fit-min="11">4 项合计 · h</span></div></div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2", "k3", "v3"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  B.in.pop(tl, '.hub', 0.1, { d: 0.62, from: .5, ease: 'back.out(1.6)' });
  var ang = [-1.5708, 0.0, 1.5708, 3.1416];
  document.querySelectorAll('.sat').forEach(function (s, i) {
    var a = ang[i] || 0;
    tl.fromTo(s, { x: -Math.cos(a) * 190, y: -Math.sin(a) * 150, opacity: 0, scale: .6 },
      { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.62, ease: 'power3.out' }, 0.3 + i * 0.1);
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
