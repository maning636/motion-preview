<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "kicker", "type": "string", "label": "眉题", "default": "SCANLINE · 扫描线标注聚焦"}, {"id": "note", "type": "string", "label": "注释签文字", "default": "AI 正在精读本段"}, {"id": "img1", "type": "image", "label": "素材页（竖版 3:4）", "default": "./assets/page.png"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .sf-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .sf-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .sf-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .sf-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 左栏文案 */
      .sf-copy{ position: absolute; left: 140px; top: 300px; width: 560px; z-index: 5; }
      .sf-kicker{ font-size: 22px; letter-spacing: .3em; color: #141414; }
      .sf-kicker b{ color: #9A9A92; font-weight: 400; }
      .sf-title{ margin-top: 30px; font-size: 84px; font-weight: 900; line-height: 1.2; }
      .sf-status{ margin-top: 38px; display: inline-block; border: 2px solid #141414; padding: 12px 24px;
        font-size: 20px; letter-spacing: .2em; background: #fff; box-shadow: 6px 6px 0 #141414; color: #141414; }
      .sf-status b{ color: #9A9A92; font-weight: 400; }
      /* 右侧素材页（纸感桌面上的竖版页） */
      .sf-stage{ position: absolute; right: 240px; top: 140px; width: 600px; height: 800px; z-index: 4; }
      .sf-shadow{ position: absolute; left: 16px; top: 16px; width: 600px; height: 800px; background: #141414; }
      .sf-page{ position: absolute; left: 0; top: 0; width: 600px; height: 800px; background: #fff;
        border: 3px solid #141414; overflow: hidden; transform: rotate(-1.6deg); transform-origin: 50% 50%; }
      .sf-page img{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /* 荧光绿扫描线 */
      .sf-scan{ position: absolute; left: 0; right: 0; top: 0; height: 6px; z-index: 3;
        background: var(--ac, #00FF00); box-shadow: 0 0 22px var(--ac, #00FF00); }
      .sf-scan::before{ content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 44px;
        background: linear-gradient(color-mix(in srgb, var(--accent) 18%, transparent), transparent); }
      /* 墨黑标注圈（SVG 椭圆描画） */
      .sf-anno{ position: absolute; inset: 0; z-index: 4; pointer-events: none; }
      .sf-anno ellipse{ stroke: #141414; stroke-width: 5; fill: none; stroke-dasharray: 1; stroke-dashoffset: 1; }
      .sf-anno line{ stroke: #141414; stroke-width: 4; stroke-dasharray: 1; stroke-dashoffset: 1; }
      /* 荧光绿注释签 */
      .sf-note{ position: absolute; left: 110px; top: 492px; z-index: 5; background: var(--ac, #00FF00);
        border: 3px solid #141414; box-shadow: 8px 8px 0 #141414; padding: 16px 26px;
        font-family: 'MiSans SemiBold', sans-serif; font-size: 28px; color: #141414; white-space: nowrap;
        opacity: 0; }
      .sf-note .cap{ display: block; font-family: 'IBM Plex Mono','JetBrains Mono',monospace; font-size: 16px;
        letter-spacing: .24em; color: #141414; opacity: .65; margin-bottom: 6px; }
      /* 底部绿色署名条 */
      .sf-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(64px); }
      .sf-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .sf-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="sf-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol">VOL.15 · 视觉动效库</div>
        <div class="r mono" id="pageno">P.396 / 400</div>
      </div>
      <div class="sf-copy">
        <div class="sf-kicker mono" id="kicker"></div>
        <div class="sf-title" id="title">扫到哪里<br />就懂哪里</div>
        <div class="sf-status mono" id="status">SCAN · <b id="snum">00 / 01</b></div>
      </div>
      <div class="sf-stage">
        <div class="sf-shadow" id="shadow"></div>
        <div class="sf-page" id="page">
          <img id="pg" src="./assets/page.png" alt="" />
          <div class="sf-scan" id="scan"></div>
          <svg class="sf-anno" viewBox="0 0 600 800">
            <ellipse id="ellip" cx="300" cy="352" rx="230" ry="96" pathLength="1" />
            <line id="lead" x1="340" y1="444" x2="312" y2="490" pathLength="1" />
          </svg>
          <div class="sf-note" id="note"><span class="cap">ANNOTATION · 01</span><span id="notetxt"></span></div>
        </div>
      </div>
      <div class="sf-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · SCANLINE FOCUS</div>
      </div>
    </div>
    <script>
      const fallback = {"kicker": "SCANLINE · 扫描线标注聚焦", "note": "AI 正在精读本段", "img1": "./assets/page.png", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("kicker").textContent = "";
      const kc = String(V.kicker).split("·");
      $("kicker").textContent = kc[0].trim();
      if (kc[1]) { const b = document.createElement("b"); b.textContent = " · " + kc.slice(1).join("·").trim(); $("kicker").appendChild(b); }
      $("notetxt").textContent = V.note;
      if (V.img1) $("pg").src = V.img1;
      // 页眉
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      // 左栏
      tl.fromTo("#kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45 }, 0.3);
      tl.fromTo("#title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.45);
      tl.fromTo("#status", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, 0.9);
      // 素材页入场
      tl.fromTo("#shadow", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.65);
      tl.fromTo("#page", { y: 110, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.6);
      // 荧光绿扫描线匀速自顶向下（零缓动）
      tl.fromTo("#scan", { y: -20, opacity: 0 }, { opacity: 1, duration: 0.15 }, 1.5);
      tl.to("#scan", { y: 352, duration: 1.3, ease: "none" }, 1.65);
      // 扫到标注区停顿：墨黑圈描画 + 引线 + 绿注释签弹出
      tl.to("#ellip", { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 2.95);
      tl.to("#lead", { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, 3.5);
      tl.fromTo("#note", { opacity: 0, scale: 0.8, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(1.8)" }, 3.6);
      tl.to("#snum", { duration: 0.01, onStart: () => { $("snum").textContent = "01 / 01"; } }, 3.65);
      // 扫描线继续扫到底部
      tl.to("#scan", { y: 830, duration: 1.1, ease: "none" }, 4.0);
      // 底部署名条（提前进场，定格后保持完全静止）
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 0.9);
      tl.fromTo([".sf-foot .f1", ".sf-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 1.15);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
