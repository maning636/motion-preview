<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"图表标题","default":"月活跃用户增长趋势"},{"id":"subtitle","type":"string","label":"副标题","default":"2024.01 — 2024.12"},{"id":"labels","type":"string","label":"X轴标签（逗号分隔）","default":"1月,2月,3月,4月,5月,6月,7月,8月,9月,10月,11月,12月"},{"id":"values","type":"string","label":"Y轴数值（逗号分隔）","default":"120,145,180,210,260,340,420,480,510,580,640,720"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="7" data-track-index="1">

        <div class="gridbg"></div>
        <header style="position:relative;z-index:2;display:flex;align-items:center;gap:24px;">
          <span class="chip"><b>TREND</b>趋势</span>
          <div>
            <h1 id="title" class="num" style="margin:0;font-size:52px;"></h1>
            <p id="subtitle" style="margin:6px 0 0;font-size:22px;color:#9CA3AF;"></p>
          </div>
        </header>
        <svg id="chart" viewBox="0 0 1744 620" style="position:absolute;left:88px;right:88px;top:270px;width:1744px;height:620px;overflow:visible;"></svg>

      </section>
    </div>
    <script>
      const fallback = {"title": "月活跃用户增长趋势", "subtitle": "2024.01 — 2024.12", "labels": "1月,2月,3月,4月,5月,6月,7月,8月,9月,10月,11月,12月", "values": "120,145,180,210,260,340,420,480,510,580,640,720", "accent": "#00FF00", "background": "#12100E", "foreground": "#F4EFE7"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 7;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("title").textContent = v.title; $("subtitle").textContent = v.subtitle;
      const labels = split(v.labels), values = split(v.values).map(Number);
      const svg = $("chart"), NS = "http://www.w3.org/2000/svg";
      const W = 1744, H = 620, padL = 30, padB = 60, padT = 30;
      const max = Math.max(...values, 1) * 1.15, min = 0;
      const px = (i) => padL + (W - padL - 30) * (labels.length === 1 ? 0.5 : i / (labels.length - 1));
      const py = (val) => padT + (H - padT - padB) * (1 - (val - min) / (max - min));
      for (let g = 0; g <= 4; g++) {
        const y = padT + (H - padT - padB) * g / 4;
        const ln = document.createElementNS(NS, "line");
        ln.setAttribute("x1", padL); ln.setAttribute("x2", W - 30); ln.setAttribute("y1", y); ln.setAttribute("y2", y);
        ln.setAttribute("stroke", "#232328"); ln.setAttribute("stroke-dasharray", "4 8"); ln.setAttribute("stroke-width", "1.5");
        svg.appendChild(ln);
      }
      const pts = values.map((val, i) => [px(i), py(val)]);
      const dAttr = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      const area = document.createElementNS(NS, "path");
      area.setAttribute("d", dAttr + ` L${pts[pts.length-1][0]} ${H-padB} L${pts[0][0]} ${H-padB} Z`);
      area.setAttribute("fill", "color-mix(in srgb, var(--accent) 8%, transparent)"); area.setAttribute("opacity", "0"); svg.appendChild(area);
      const path = document.createElementNS(NS, "path");
      path.setAttribute("d", dAttr); path.setAttribute("fill", "none");
      path.setAttribute("stroke", "var(--accent,#00FF00)"); path.setAttribute("stroke-width", "5"); path.setAttribute("stroke-linecap", "round"); path.setAttribute("stroke-linejoin", "round");
      svg.appendChild(path);
      const len = path.getTotalLength();
      path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
      const dots = pts.map((p, i) => {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]); c.setAttribute("r", "9");
        c.setAttribute("fill", "#0A0A0B"); c.setAttribute("stroke", "var(--accent,#00FF00)"); c.setAttribute("stroke-width", "4");
        c.setAttribute("opacity", "0"); svg.appendChild(c);
        const t = document.createElementNS(NS, "text");
        t.setAttribute("x", p[0]); t.setAttribute("y", H - padB + 34); t.setAttribute("text-anchor", "middle");
        t.setAttribute("fill", "#9CA3AF"); t.setAttribute("font-size", "19"); t.setAttribute("opacity", "0");
        t.textContent = labels[i]; svg.appendChild(t);
        return { c, t };
      });
      const last = pts[pts.length - 1];
      const ring = document.createElementNS(NS, "circle");
      ring.setAttribute("cx", last[0]); ring.setAttribute("cy", last[1]); ring.setAttribute("r", "10");
      ring.setAttribute("fill", "none"); ring.setAttribute("stroke", "var(--accent,#00FF00)"); ring.setAttribute("stroke-width", "3"); ring.setAttribute("opacity", "0");
      svg.appendChild(ring);
      tl.fromTo("header", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "power3.out" }, 0.1);
      tl.to(path, { strokeDashoffset: 0, duration: 2.0, ease: "power2.inOut" }, 0.5);
      tl.to(area, { opacity: 1, duration: 1.0 }, 1.6);
      dots.forEach((d, i) => {
        const at = 0.5 + (i / Math.max(dots.length - 1, 1)) * 2.0;
        tl.fromTo(d.c, { opacity: 0, scale: 0.3, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, at);
        tl.to(d.t, { opacity: 1, duration: 0.2 }, at);
      });
      tl.fromTo(ring, { opacity: 0.9, attr: { r: 10 } }, { opacity: 0, attr: { r: 46 }, duration: 1.0, ease: "power1.out", repeat: 2 }, 2.6);
      tl.to(".scene", { clipPath: "inset(0 0 100% 0)", duration: 0.5, ease: "power2.in" }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
