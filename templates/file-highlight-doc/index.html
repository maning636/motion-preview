<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "文件标题", "default": "平台分成规则（节选）"}, {"id": "lines", "type": "string", "label": "正文行（逗号分隔）", "default": "第一条 基础分成比例为流水的一半,第二条 独家内容额外奖励一成,第三条 每月结算一次逾期顺延,第四条 违规内容取消当月全部奖励,第五条 规则解释权归平台所有"}, {"id": "hlrows", "type": "string", "label": "高亮行号（逗号分隔，从1计）", "default": "2,4"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #EAE2CF; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #26211A; }
      .f-vig{ position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 52%, rgba(64,48,26,.32) 100%); }
      .f-doc{ position: absolute; left: 460px; top: 60px; width: 1000px; height: 960px;
        background: #FBF7EC; padding: 48px 64px; box-shadow: 9px 11px 0 rgba(38,33,26,.2); }
      .f-scan{ display: flex; justify-content: space-between; font-size: 20px; color: #57503F;
        letter-spacing: .12em; padding-bottom: 16px; border-bottom: 2px solid #26211A; }
      .f-title{ margin-top: 26px; font-size: 44px; font-weight: 900; }
      .f-lines{ margin-top: 28px; }
      .f-line{ position: relative; font-size: 27px; font-weight: 600; line-height: 1.5;
        padding: 9px 6px; color: #2E2A20; }
      .f-line .hl{ position: absolute; left: 0; top: 6px; bottom: 6px; width: 100%;
        background: #F5D73F; opacity: .8; transform-origin: left center; transform: scaleX(0); z-index: 0; }
      .f-line .tx{ position: relative; z-index: 1; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="f-vig"></div>
      <div class="f-doc" id="doc">
        <div class="f-scan mono"><span>SCAN COPY · 扫描件</span><span id="pg">P.1/1</span></div>
        <h1 class="f-title" id="title"></h1>
        <div class="f-lines" id="lines"></div>
      </div>

    </div>
    <script>
      const fallback = {"title": "平台分成规则（节选）", "lines": "第一条 基础分成比例为流水的一半,第二条 独家内容额外奖励一成,第三条 每月结算一次逾期顺延,第四条 违规内容取消当月全部奖励,第五条 规则解释权归平台所有", "hlrows": "2,4", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      $("title").textContent = V.title;
      const lines = split(V.lines).slice(0, 10);
      const hlrows = split(V.hlrows).map((x) => parseInt(x, 10)).filter((n) => n > 0);
      const box = $("lines");
      lines.forEach((ln, i) => {
        const d = document.createElement("div");
        d.className = "f-line";
        if (hlrows.includes(i + 1)) d.innerHTML = `<span class="hl"></span><span class="tx"></span>`;
        else d.innerHTML = `<span class="tx"></span>`;
        d.querySelector(".tx").textContent = ln;
        box.appendChild(d);
      });
      tl.fromTo("#doc", { opacity: 0, rotation: -2, y: 26 }, { opacity: 1, rotation: -0.5, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo(".f-scan", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.45);
      tl.fromTo("#title", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, 0.6);
      tl.fromTo(".f-line", { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.22, stagger: 0.08, ease: "power2.out" }, 0.8);
      const tHl = 0.8 + lines.length * 0.08 + 0.2;
      box.querySelectorAll(".hl").forEach((el, i) => {
        tl.to(el, { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, tHl + i * 0.3);
      });
      window.__timelines.main = tl;

    </script>
  </body>
</html>
