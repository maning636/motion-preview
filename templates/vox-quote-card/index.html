<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "kicker", "type": "string", "label": "顶部小标签", "default": "金句 · QUOTE"}, {"id": "quotePre", "type": "string", "label": "金句前半", "default": "专业只是马车，"}, {"id": "accentWord", "type": "string", "label": "高亮关键词", "default": "能力才是马"}, {"id": "quotePost", "type": "string", "label": "金句后半（可空）", "default": "。"}, {"id": "author", "type": "string", "label": "作者", "default": "匿名博主"}, {"id": "sourceLabel", "type": "string", "label": "出处标签", "default": "ON ABILITY"}, {"id": "markerColor", "type": "color", "label": "马克笔颜色", "default": "#B9E833"}, {"id": "imgBg", "type": "image", "label": "锁定背景", "default": "./assets/bg.png"}, {"id": "duration", "type": "number", "label": "总时长（秒，动效演完定格）", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background: var(--background, #EEE8D8); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #EEE8D8);
  color: var(--foreground, #1D1D20); font-family:'MEBHeiHeiTi','PingFang SC',sans-serif; }

.bgimg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.kicker{ position:absolute; left:90px; top:80px; font-family:'MiSans SemiBold'; font-weight:700;
  font-size:26px; letter-spacing:.3em; color:#1D1D20; border:3px solid #1D1D20; padding:10px 24px; }
.qmark{ position:absolute; left:76px; top:210px; font-family:'MiSans SemiBold'; font-weight:900;
  font-size:220px; line-height:1; color:var(--marker,#B9E833); -webkit-text-stroke:6px #1D1D20; }
.quote{ position:absolute; left:200px; right:200px; top:430px; font-family:'MiSans SemiBold';
  font-weight:700; font-size:88px; line-height:1.35; color:#1D1D20; }
.acc{ position:relative; display:inline-block; padding:0 12px; white-space:nowrap; }
.acc .hl{ position:absolute; left:-4px; right:-4px; top:8%; bottom:4%; background:var(--marker,#B9E833);
  transform:scaleX(0); transform-origin:left center; z-index:-1; border:4px solid #1D1D20;
  border-radius:6px; }
.who{ position:absolute; left:200px; bottom:120px; display:flex; align-items:baseline; gap:18px; }
.who .dash{ width:56px; height:6px; background:#1D1D20; align-self:center; }
.who .nm{ font-family:'MiSans SemiBold'; font-weight:700; font-size:36px; color:#1D1D20; }
.who .src{ font-size:26px; letter-spacing:.2em; color:rgba(29,29,32,.55); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
<img class="bgimg" id="bg" alt="">
<div class="kicker" id="k"></div>
<div class="qmark">“</div>
<div class="quote"><span id="q1"></span><span class="acc" id="accw"><span class="hl" id="hl"></span><span id="q2"></span></span><span id="q3"></span></div>
<div class="who"><span class="dash"></span><span class="nm" id="an"></span><span class="src" id="asl"></span></div>
    </div>
    <script>
      const FB = {"kicker": "金句 · QUOTE", "quotePre": "专业只是马车，", "accentWord": "能力才是马", "quotePost": "。", "author": "匿名博主", "sourceLabel": "ON ABILITY", "markerColor": "#B9E833", "imgBg": "./assets/bg.png", "duration": 6};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
const $=(s)=>document.querySelector(s);
const F=(f)=>f/30;
const DUR=+v.duration>0?+v.duration:6;
$('[data-composition-id]').setAttribute('data-duration',String(DUR));
document.documentElement.style.setProperty('--marker',v.markerColor||'#B9E833');

$('#k').textContent=v.kicker||'';
$('#q1').textContent=v.quotePre||'';
$('#q2').textContent=v.accentWord||'';
$('#q3').textContent=v.quotePost||'';
$('#an').textContent=v.author||'';
$('#asl').textContent=v.sourceLabel||'';
$('#bg').src=v.imgBg||'';
if(!v.accentWord)$('#accw').style.display='none';

window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

/* 引号落印 → 正文浮现 → 马克笔扫过关键词 → 署名 */
tl.fromTo('.qmark',{opacity:0,scale:1.6,rotation:-12},{opacity:1,scale:1,rotation:0,duration:F(10),ease:'back.out(1.8)'},F(2));
tl.fromTo('.quote',{opacity:0,y:34},{opacity:1,y:0,duration:F(14),ease:'power3.out'},F(8));
tl.fromTo('#hl',{scaleX:0},{scaleX:1,duration:F(12),ease:'power2.inOut'},F(20));
tl.fromTo('#accw',{color:'#1D1D20'},{color:'#1D1D20',duration:F(1)},F(20));
tl.fromTo('.who',{opacity:0,x:-24},{opacity:1,x:0,duration:F(10),ease:'power3.out'},F(30));
/* 高亮轻微呼吸，画面不死 */
tl.to('#hl',{scaleX:1.02,duration:F(20),ease:'sine.inOut',yoyo:true,repeat:Math.max(1,Math.ceil(DUR/1.2))},F(32));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
