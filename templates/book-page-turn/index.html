<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "VOL.15 · 视觉动效库"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.075 → P.076"}, {"id": "hint", "type": "string", "label": "底部提示", "default": "翻到下一页"}, {"id": "imgA", "type": "image", "label": "翻起页（当前页）", "default": "./assets/page-a.png"}, {"id": "imgB", "type": "image", "label": "底页（翻开后露出）", "default": "./assets/page-b.png"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 5}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      .bpt-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .bpt-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414; }
      .bpt-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; }
      .bpt-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 中央书页台 */
      .bpt-stage{ position: absolute; left: 660px; top: 150px; width: 600px; height: 800px;
        perspective: 2200px; z-index: 4; }
      .bpt-shadow{ position: absolute; left: 18px; top: 18px; width: 600px; height: 800px; background: #141414; }
      .bpt-page{ position: absolute; left: 0; top: 0; width: 600px; height: 800px; background: #fff;
        border: 3px solid #141414; overflow: hidden; }
      .bpt-page img{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #pageB{ z-index: 1; }
      #pageB .dim{ position: absolute; inset: 0; background: rgba(20,20,20,.5); z-index: 2; }
      #pageA{ z-index: 2; transform-origin: 0 50%; transform-style: preserve-3d; }
      #pageA .curl{ position: absolute; inset: 0; z-index: 2; opacity: 0;
        background: linear-gradient(90deg, rgba(20,20,20,.42) 0%, rgba(20,20,20,0) 45%); }
      /* 底页书签带（翻开后抽出） */
      .bpt-ribbon{ position: absolute; right: -14px; top: 120px; width: 44px; height: 220px; z-index: 3;
        background: var(--ac, #00FF00); border: 3px solid #141414; transform: translateX(-58px); }
      .bpt-ribbon::after{ content: ""; position: absolute; left: 50%; bottom: -3px; transform: translateX(-50%);
        border-left: 19px solid transparent; border-right: 19px solid transparent; border-top: 26px solid #141414; }
      /* 翻页箭头提示 */
      .bpt-hint{ position: absolute; right: 240px; top: 500px; z-index: 5; text-align: center; }
      .bpt-hint .arr{ font-size: 64px; font-weight: 900; color: var(--ac, #00FF00);
        text-shadow: 3px 3px 0 #141414; }
      .bpt-hint .tx{ margin-top: 10px; font-size: 24px; letter-spacing: .14em; }
      .bpt-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px; }
      .bpt-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; }
      .bpt-foot .f2{ font-size: 18px; letter-spacing: .26em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="bpt-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="bpt-stage" id="stage">
        <div class="bpt-shadow" id="shadow"></div>
        <div class="bpt-page" id="pageB"><img id="imB" src="./assets/page-b.png" alt="" /><div class="dim" id="dim"></div></div>
        <div class="bpt-ribbon" id="ribbon"></div>
        <div class="bpt-page" id="pageA"><img id="imA" src="./assets/page-a.png" alt="" /><div class="curl" id="curl"></div></div>
      </div>
      <div class="bpt-hint" id="hintBox">
        <div class="arr">⟲</div>
        <div class="tx" id="hint"></div>
      </div>
      <div class="bpt-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · PAGE TURN</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "VOL.15 · 视觉动效库", "pageno": "P.075 → P.076", "hint": "翻到下一页", "imgA": "./assets/page-a.png", "imgB": "./assets/page-b.png", "accent": "#00FF00", "duration": 5};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      $("hint").textContent = V.hint;
      if (V.imgA) $("imA").src = V.imgA;
      if (V.imgB) $("imB").src = V.imgB;
      // 入场：页眉 + 整台推入
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0 }, { opacity: 1, duration: 0.35, stagger: 0.07 }, 0.2);
      tl.fromTo("#stage", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 0.15);
      tl.fromTo("#foot", { y: 64 }, { y: 0, duration: 0.45, ease: "expo.out" }, 0.3);
      tl.fromTo("#hintBox", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.4 }, 0.7);
      // 翻页：A 沿左书脊掀起，底页压暗渐亮，卷边阴影随行
      tl.to("#hintBox", { opacity: 0, duration: 0.25 }, 1.15);
      tl.to("#curl", { opacity: 1, duration: 0.3 }, 1.2);
      tl.to("#pageA", { rotateY: -12, duration: 0.28, ease: "power2.in" }, 1.2);
      tl.to("#pageA", { rotateY: -104, duration: 1.05, ease: "power2.inOut" }, 1.48);
      tl.to("#pageA", { opacity: 0, duration: 0.12 }, 2.42);
      tl.to("#dim", { opacity: 0, duration: 0.9, ease: "power2.out" }, 1.6);
      tl.to("#curl", { opacity: 0.35, duration: 0.8 }, 1.7);
      tl.to("#pageB", { scale: 1.025, duration: 0.9, ease: "power2.out" }, 1.6);
      tl.to("#pageB", { scale: 1, duration: 0.5, ease: "power2.inOut" }, 2.5);
      // 书签带抽出 + 页码跳变
      tl.to("#ribbon", { x: 0, duration: 0.5, ease: "back.out(1.5)" }, 2.6);
      // 呼吸定格
      tl.to(["#pageB"], { y: -6, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.2);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
