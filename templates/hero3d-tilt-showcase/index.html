<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "一条管线跑完整个发布日"}, {"id": "points", "type": "string", "label": "要点列表（逗号分隔）", "default": "脚本到成片全自动,模板库随取随用,数据次日自动复盘"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "img1", "type": "image", "label": "展示图（文档/录屏截图）", "default": "./placeholder-1.png"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #0A0A0B; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #F5F5F4; }
      .h-bg{ position: absolute; inset: 0;
        background: radial-gradient(1100px 620px at 38% 50%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 62%),
          radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px);
        background-size: auto, 48px 48px; }
      .h-stage{ position: absolute; inset: 0; perspective: 1500px; }
      .h-world{ position: absolute; inset: 0; transform-style: preserve-3d; }
      .h-card{ position: absolute; left: 150px; top: 110px; width: 720px; height: 860px;
        border-radius: 22px; background: #151517; border: 1px solid rgba(255,255,255,.16);
        box-shadow: 0 34px 80px rgba(0,0,0,.55); overflow: hidden; }
      .h-card img{ width: 100%; height: 100%; object-fit: cover; display: block; }
      .h-card .cap{ position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 28px;
        font-size: 24px; letter-spacing: .14em; color: var(--accent, #00FF00);
        background: linear-gradient(transparent, rgba(0,0,0,.8)); }
      .h-card .bar{ position: absolute; left: 0; top: 0; right: 0; height: 10px; background: var(--accent, #00FF00); }
      .h-shadow{ position: absolute; left: 170px; top: 990px; width: 680px; height: 60px;
        background: radial-gradient(ellipse at center, rgba(0,0,0,.65), transparent 70%); }
      .h-side{ position: absolute; left: 1060px; top: 210px; width: 700px; }
      .h-chip{ display: inline-block; margin-bottom: 24px; padding: 8px 22px; font-size: 22px;
        letter-spacing: .18em; color: var(--accent, #00FF00); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
        border-radius: 999px; }
      .h-side h1{ font-family: 'MiSans SemiBold', 'PingFang SC', sans-serif; font-size: 80px;
        line-height: 1.18; text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 30%, transparent); word-break: break-all; }
      .h-points{ margin-top: 42px; display: flex; flex-direction: column; gap: 26px; }
      .h-pt{ display: flex; align-items: baseline; gap: 18px; font-size: 32px; font-weight: 700;
        color: #D6DAD8; }
      .h-pt .sq{ flex: none; width: 14px; height: 14px; background: var(--accent, #00FF00);
        transform: rotate(45deg) translateY(-1px); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="h-bg"></div>
      <div class="h-stage">
        <div class="h-world" id="world">
          <div class="h-shadow" id="shadow"></div>
          <div class="h-card" id="card"><img id="img1" alt=""><div class="bar"></div><div class="cap mono">LIVE PREVIEW</div></div>
          <div class="h-side" id="side">
            <span class="h-chip" id="chip">SHOWCASE</span>
            <h1 id="title"></h1>
            <div class="h-points" id="points"></div>
          </div>
        </div>
      </div>

    </div>
    <script>
      const fallback = {"title": "一条管线跑完整个发布日", "points": "脚本到成片全自动,模板库随取随用,数据次日自动复盘", "accent": "#00FF00", "img1": "./placeholder-1.png", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      document.documentElement.style.setProperty("--accent", V.accent ?? "#00FF00");
      $("title").textContent = V.title;
      if (V.img1) $("img1").src = V.img1;
      const pts = split(V.points);
      const box = $("points");
      pts.forEach((p) => {
        const d = document.createElement("div");
        d.className = "h-pt";
        d.innerHTML = `<span class="sq"></span><span class="tx"></span>`;
        d.querySelector(".tx").textContent = p;
        box.appendChild(d);
      });
      gsap.set("#card", { rotationY: 16, rotationX: 3, transformPerspective: 1500 });
      tl.fromTo("#world", { rotationX: 7, rotationY: -7 }, { rotationX: 2, rotationY: -2, duration: 2.4, ease: "power2.out" }, 0);
      tl.fromTo("#card", { rotationY: 64, rotationX: 10, opacity: 0, z: -240 },
        { rotationY: 16, rotationX: 3, opacity: 1, z: 0, duration: 0.9, ease: "power3.out" }, 0.2);
      tl.fromTo("#shadow", { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: "power2.out" }, 0.5);
      tl.fromTo("#chip", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35 }, 0.7);
      tl.fromTo("#title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.85);
      tl.fromTo(".h-pt", { opacity: 0, x: 34 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.16, ease: "power2.out" }, 1.15);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
