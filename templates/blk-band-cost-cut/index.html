<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "COST / 成本结构"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "钱花在哪，删掉才知道"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：元 / 月"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#FFD429"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>上下分带 · 钱花在哪，删掉才知道</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{flex-direction:column;gap:26px}
  .band{flex:0 0 300px;display:flex;gap:0;border:var(--bw) solid var(--ink);
        border-radius:4px;overflow:hidden;box-shadow:9px 9px 0 var(--ink)}
  .cell{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:12px;border-right:var(--bw) solid var(--ink);padding:0 12px}
  .cell:last-child{border-right:0}
  .cell .v{font-family:var(--mono);font-weight:700;font-size:104px;line-height:.86;
        letter-spacing:-.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cell .k{font-family:var(--mono);font-weight:700;font-size:19px;letter-spacing:.1em;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .detail{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
  /* color:var(--ink) 不能省：#stage.on-ink 把整台文字设成纸色，
     .dr 只给 background:var(--white) 不给 color 时，纸色 #FFF6E5 印在
     #FFFFFF 上是 1.07:1 —— 明细行的标签和数值整行隐形。 */
  .dr{flex:1 1 0;display:flex;align-items:center;gap:22px;border:var(--bw) solid var(--ink);
        border-radius:4px;background:var(--white);color:var(--ink);padding:0 26px;min-height:0;
        box-shadow:5px 5px 0 var(--ink)}
  .dr .sw{flex:0 0 20px;height:20px;border:var(--bw) solid var(--ink)}
  .dr .k{font-weight:900;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dr .tk{flex:1 1 auto;height:16px;min-width:50px;position:relative;overflow:hidden;
        border:var(--bw) solid var(--ink);background:var(--paper)}
  .dr .tk i{position:absolute;left:0;top:0;bottom:0;width:0;display:block}
  .dr .v{font-family:var(--mono);font-weight:700;font-size:34px;letter-spacing:-.03em;
        font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
</style>
</head>
<body>
<div id="stage" class="blk-noise on-ink">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">COST / 成本结构</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">钱花在哪，删掉才知道</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：元 / 月</div></div>
  <div class="body">
    <div class="band" id="band"><div class="cell" id="c0" style="background:var(--white);color:var(--ink)"><span class="v" id="bv0" data-fit-max="104" data-fit-min="44">3.5w</span><span class="k" id="bk0" data-fit-max="19" data-fit-min="12">月度总支出</span></div><div class="cell" id="c1" style="background:var(--yellow);color:var(--ink)"><span class="v" id="bv1" data-fit-max="104" data-fit-min="44">62%</span><span class="k" id="bk1" data-fit-max="19" data-fit-min="12">固定占比</span></div><div class="cell" id="c2" style="background:var(--blue);color:var(--ink)"><span class="v" id="bv2" data-fit-max="104" data-fit-min="44">8.2k</span><span class="k" id="bk2" data-fit-max="19" data-fit-min="12">可压缩</span></div><div class="cell" id="c3" style="background:var(--green);color:var(--ink)"><span class="v" id="bv3" data-fit-max="104" data-fit-min="44">51%</span><span class="k" id="bk3" data-fit-max="19" data-fit-min="12">最大项占比</span></div><div class="cell" id="c4" style="background:var(--pink);color:var(--ink)"><span class="v" id="bv4" data-fit-max="104" data-fit-min="44">6.8w</span><span class="k" id="bk4" data-fit-max="19" data-fit-min="12">年度节省</span></div></div>
    <div class="detail" id="detail"><div class="dr" id="d0"><span class="sw" style="background:var(--white)"></span><span class="k" id="k0" data-fit-max="19" data-fit-min="12">房租</span><span class="tk"><i id="t0" style="background:var(--white)"></i></span><span class="v" id="v0" data-fit-max="104" data-fit-min="44">4200</span></div><div class="dr" id="d1"><span class="sw" style="background:var(--yellow)"></span><span class="k" id="k1" data-fit-max="19" data-fit-min="12">人力</span><span class="tk"><i id="t1" style="background:var(--yellow)"></i></span><span class="v" id="v1" data-fit-max="104" data-fit-min="44">18000</span></div><div class="dr" id="d2"><span class="sw" style="background:var(--blue)"></span><span class="k" id="k2" data-fit-max="19" data-fit-min="12">投放</span><span class="tk"><i id="t2" style="background:var(--blue)"></i></span><span class="v" id="v2" data-fit-max="104" data-fit-min="44">6500</span></div><div class="dr" id="d3"><span class="sw" style="background:var(--green)"></span><span class="k" id="k3" data-fit-max="19" data-fit-min="12">软件订阅</span><span class="tk"><i id="t3" style="background:var(--green)"></i></span><span class="v" id="v3" data-fit-max="104" data-fit-min="44">2300</span></div><div class="dr" id="d4"><span class="sw" style="background:var(--pink)"></span><span class="k" id="k4" data-fit-max="19" data-fit-min="12">差旅</span><span class="tk"><i id="t4" style="background:var(--pink)"></i></span><span class="v" id="v4" data-fit-max="104" data-fit-min="44">4100</span></div></div>
  </div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2", "k3", "v3", "k4", "v4"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  B.in.pop(tl, '.band', 0.1, { d: 0.42, from: .9, ease: 'power3.out' });
  document.querySelectorAll('.cell').forEach(function (c, i) {
    B.in.slideX(tl, c, 0.24 + i * 0.08, { from: 30, d: 0.42 * 0.7 });
  });
  document.querySelectorAll('.dr').forEach(function (r, i) {
    B.in.slideX(tl, r, 0.5 + i * 0.08, { from: 50, d: 0.42 * 0.7 });
  });
  var sh = [0.056, 1.0, 0.132, 0.823, 0.11];
  document.querySelectorAll('.dr .tk i').forEach(function (e, i) {
    B.in.grow(tl, e, Math.max(6, (sh[i] || 0) * 100) + '%', 0.8 + i * 0.08, { d: 0.42 });
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
