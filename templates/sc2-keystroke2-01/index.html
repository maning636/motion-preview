<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "kicker", "type": "string", "label": "眉题", "default": "TERMINAL · 敲一行试试"}, {"id": "cmd", "type": "string", "label": "命令行", "default": "hyperframes render --preset default"}, {"id": "results", "type": "string", "label": "结果行（分号分隔）", "default": "✓ 解析变量 9 项 · 0.12s;✓ 渲染 180 帧 @1080p · 41.6s;✓ 输出 renders/default.mp4"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .tc-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .tc-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .tc-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .tc-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 眉题 */
      .tc-kicker{ position: absolute; left: 0; right: 0; top: 168px; text-align: center; z-index: 5;
        font-size: 24px; letter-spacing: .34em; color: #141414; }
      .tc-kicker b{ color: #9A9A92; font-weight: 400; }
      /* 墨黑代码块卡片 */
      .tc-stage{ position: absolute; left: 310px; top: 250px; width: 1300px; height: 640px; z-index: 4; }
      .tc-shadow{ position: absolute; left: 16px; top: 16px; width: 1300px; height: 640px; background: #141414; }
      .tc-card{ position: absolute; left: 0; top: 0; width: 1300px; height: 640px; background: #141414;
        border: 3px solid #141414; padding: 44px 52px; overflow: hidden; }
      .tc-bar{ display: flex; align-items: center; gap: 12px; margin-bottom: 34px; }
      .tc-dot{ width: 18px; height: 18px; border: 2px solid #F6F5EF; }
      .tc-dot.g{ background: var(--ac, #00FF00); border-color: var(--ac, #00FF00); }
      .tc-bartitle{ margin-left: 18px; font-size: 18px; letter-spacing: .26em; color: #9A9A92; }
      .tc-line{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; font-size: 34px; line-height: 1.9;
        color: #F6F5EF; white-space: pre-wrap; word-break: break-all; }
      .tc-prompt{ color: var(--ac, #00FF00); }
      .tc-cursor{ display: inline-block; width: 20px; height: 40px; background: var(--ac, #00FF00);
        vertical-align: text-bottom; margin-left: 4px; }
      .tc-res{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; font-size: 30px; line-height: 1.9;
        color: var(--ac, #00FF00); opacity: 0; transform: translateY(12px); white-space: pre-wrap; }
      /* 底部荧光绿署名条 */
      .tc-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(64px); }
      .tc-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .tc-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="tc-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol">SC2 · 视觉动效库</div>
        <div class="r mono" id="pageno">P.301 / 400</div>
      </div>
      <div class="tc-kicker mono" id="kicker"></div>
      <div class="tc-stage">
        <div class="tc-shadow" id="shadow"></div>
        <div class="tc-card" id="card">
          <div class="tc-bar">
            <div class="tc-dot"></div><div class="tc-dot"></div><div class="tc-dot g"></div>
            <div class="tc-bartitle mono">PAPER TERMINAL · ZSH</div>
          </div>
          <div class="tc-line"><span class="tc-prompt">$ </span><span id="typed"></span><span class="tc-cursor" id="cursor"></span></div>
          <div id="results"></div>
        </div>
      </div>
      <div class="tc-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · TYPING CODE</div>
      </div>
    </div>
    <script>
      const fallback = {"kicker": "TERMINAL · 敲一行试试", "cmd": "hyperframes render --preset default", "results": "✓ 解析变量 9 项 · 0.12s;✓ 渲染 180 帧 @1080p · 41.6s;✓ 输出 renders/default.mp4", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      // 眉题
      const kc = String(V.kicker).split("·");
      $("kicker").textContent = kc[0].trim();
      if (kc[1]) { const b = document.createElement("b"); b.textContent = " · " + kc.slice(1).join("·").trim(); $("kicker").appendChild(b); }
      // 结果行（分号分隔）
      const resLines = String(V.results).split(";").map(s => s.trim()).filter(Boolean);
      const resEls = resLines.map((txt) => {
        const d = document.createElement("div");
        d.className = "tc-res";
        d.textContent = txt;
        $("results").appendChild(d);
        return d;
      });
      // 页眉
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      // 眉题 + 卡片入场
      tl.fromTo("#kicker", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45 }, 0.3);
      tl.fromTo("#shadow", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.45);
      tl.fromTo("#card", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.4);
      // 底部署名条
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 0.9);
      tl.fromTo([".tc-foot .f1", ".tc-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 1.15);
      // 逐字敲入命令（光标恒亮不闪）
      const cmd = String(V.cmd);
      const typeStart = 1.3, typeDur = Math.min(2.0, Math.max(0.8, cmd.length * 0.055));
      const prog = { i: 0 };
      tl.to(prog, { i: cmd.length, duration: typeDur, ease: "none",
        onUpdate: () => { $("typed").textContent = cmd.slice(0, Math.round(prog.i)); } }, typeStart);
      // 回车：光标换行停顿后，结果行逐行展开
      const resStart = typeStart + typeDur + 0.35;
      tl.to("#cursor", { opacity: 0, duration: 0.12 }, resStart - 0.05);
      resEls.forEach((el, i) => {
        tl.to(el, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, resStart + i * 0.45);
      });
      // 收尾定格：光标在末行复亮（恒亮），保持最后一帧
      const endT = resStart + resEls.length * 0.45 + 0.2;
      tl.set("#cursor", { opacity: 1 }, endT);
      tl.to("#card", { y: -6, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, endT + 0.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
