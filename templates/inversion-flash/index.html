<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"phrase","type":"string","label":"重锤短句","default":"等一下。"},{"id":"flashAt","type":"number","label":"闪屏时间点（秒）","default":0.5},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100E); color: var(--foreground, #F4EFE7);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .phrase{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 140px; font-weight: 700; letter-spacing: -0.03em; text-align: center; max-width: 1600px; }
      .flash-layer{ position: absolute; inset: 0; background: #F4EFE7; opacity: 0; pointer-events: none;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .flash-text{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #12100E; opacity: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 140px; font-weight: 700; letter-spacing: -0.03em; text-align: center; max-width: 1600px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1.5" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="1.5" data-track-index="1">
        <div class="phrase" id="phrase"></div>
        <div class="flash-layer" id="flashLayer"></div>
        <div class="flash-text" id="flashText"></div>
      </section>
    </div>
    <script>
      const fallback = { phrase: "等一下。", flashAt: 0.5, background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      document.getElementById("phrase").textContent = v.phrase;
      const flashText = document.getElementById("flashText");
      flashText.textContent = v.phrase;
      flashText.style.color = v.background;
      const flashLayer = document.getElementById("flashLayer");
      flashLayer.style.backgroundColor = v.foreground;
      const t = Number(v.flashAt) || 0.5;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".phrase", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, 0.1);
      tl.to(".flash-layer", { opacity: 1, duration: 0.08, ease: "steps(1)" }, t);
      tl.to(".flash-text", { opacity: 1, duration: 0.08, ease: "steps(1)" }, t);
      tl.to(".phrase", { opacity: 0, duration: 0.08, ease: "steps(1)" }, t);
      tl.to(".flash-layer", { opacity: 0, duration: 0.08, ease: "steps(1)" }, t + 0.18);
      tl.to(".flash-text", { opacity: 0, duration: 0.08, ease: "steps(1)" }, t + 0.18);
      tl.to(".phrase", { opacity: 1, duration: 0.08, ease: "steps(1)" }, t + 0.18);
      tl.to(".scene", { opacity: 0, duration: 0.15, ease: "power2.in" }, 1.25);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
