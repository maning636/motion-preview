<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "metric", "type": "string", "label": "指标数字", "default": "99.9%"}, {"id": "cap", "type": "string", "label": "指标说明", "default": "渲染成功率 · 本季度"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; will-change:transform,filter; transform-origin:960px 470px; }
#m{ font-size:230px; font-weight:900; color:var(--accent); }
#c{ margin-top:20px; font-size:34px; opacity:.55; font-family:'MiSans SemiBold',sans-serif; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
<div id="wrap" style="position:absolute;inset:0"><div id="stage"><div id="m"></div><div id="c"></div></div></div>
    </div>
    <script>
      const FB = {"metric": "99.9%", "cap": "渲染成功率 · 本季度", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#m').textContent=v.metric||'';$('#c').textContent=v.cap||'';
const stage=$('#stage');
// 三档跳切：1 → 1.6（f35）→ 2.6（f75），零补间；每跳 2f 加深脉冲当 tick
tl.set(stage,{scale:1.6},F(35));
tl.set(stage,{scale:2.6},F(75));
function tick(f){
  tl.fromTo('#wrap',{filter:'brightness(.85)'},{filter:'brightness(1)',duration:F(2),
    onComplete:()=>gsap.set('#wrap',{clearProps:'filter'})},F(f));
}
tick(35); tick(75);
// 末挡 hold 到 135f
tl.to({},{duration:F(60)},F(75));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
