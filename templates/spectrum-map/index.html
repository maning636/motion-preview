<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"模型可控性谱系"},{"id":"subtitle","type":"string","label":"副标题","default":"从完全开放到严格约束的连续分布"},{"id":"leftLabel","type":"string","label":"左端标签","default":"开放生成"},{"id":"rightLabel","type":"string","label":"右端标签","default":"严格约束"},{"id":"items","type":"string","label":"对象名（逗号分隔，5 个）","default":"创意写作,通用问答,代码生成,检索增强,工具调用"},{"id":"positions","type":"string","label":"位置百分比（逗号分隔，5 个）","default":"10,35,55,75,92"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 60px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 12px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 400; opacity: 0.55; }
      .chart-area{ position: relative; width: 100%; height: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .axis-line{ width: 1200px; height: 4px; background: rgba(244,239,231,0.25); border-radius: 2px; position: relative;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .axis-label{ position: absolute; top: -50px; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 700; }
      .axis-label.left{ left: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .axis-label.right{ right: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .marker{ position: absolute; top: -14px; width: 32px; height: 32px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 15%, transparent); border: 3px solid var(--accent); transform: translateX(-50%);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .marker-label{ position: absolute; top: 36px; left: 50%; transform: translateX(-50%); font-family: 'MEBHeiHeiTi', sans-serif; font-size: 20px; font-weight: 600; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <div class="axis-line" id="axis">
            <div class="axis-label left" id="leftLabel"></div>
            <div class="axis-label right" id="rightLabel"></div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "模型可控性谱系", subtitle: "从完全开放到严格约束的连续分布", leftLabel: "开放生成", rightLabel: "严格约束", items: "创意写作,通用问答,代码生成,检索增强,工具调用", positions: "10,35,55,75,92", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      document.getElementById("leftLabel").textContent = v.leftLabel;
      document.getElementById("rightLabel").textContent = v.rightLabel;
      const items = String(v.items).split(",").map(s => s.trim()).filter(Boolean);
      const positions = String(v.positions).split(",").map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
      const axis = document.getElementById("axis");
      items.forEach((item, i) => {
        const pct = positions[i] || 50;
        const marker = document.createElement("div");
        marker.className = "marker";
        marker.style.left = pct + "%";
        const label = document.createElement("div");
        label.className = "marker-label";
        label.textContent = item;
        marker.appendChild(label);
        axis.appendChild(marker);
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo(".axis-line", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 0.45);
      tl.fromTo(".axis-label", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.8);
      document.querySelectorAll(".marker").forEach((m, i) => {
        tl.fromTo(m, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.7)" }, 1.0 + i * 0.12);
      });
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
