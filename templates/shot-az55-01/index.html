<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#view{ position:absolute; inset:0; perspective:2600px; overflow:hidden; }
#floor{ position:absolute; left:260px; top:140px; width:1400px; height:800px;
  transform:rotateX(75deg); transform-style:preserve-3d; border-radius:20px;
  background:color-mix(in srgb, var(--fg) 5%, transparent);
  border:1px solid color-mix(in srgb, var(--fg) 12%, transparent); will-change:transform; }
.slot{ position:absolute; width:380px; height:240px; transform-style:preserve-3d; }
.rise{ position:absolute; inset:0; transform-origin:50% 100%; transform-style:preserve-3d; will-change:transform; }
.pcard{ position:absolute; inset:0; border-radius:12px; background:#F5F0E4; color:#262219; padding:28px;
  backface-visibility:hidden; }
.pcard .t{ font-size:30px; font-weight:900; }
.pcard .l{ margin-top:14px; height:10px; border-radius:5px; background:rgba(38,34,25,.25); }
.pcard.hot{ background:var(--accent); color:#0A0A0F; }
.pcard.hot .l{ background:rgba(10,10,15,.25); }
.rsh{ position:absolute; left:6%; right:6%; bottom:-8px; height:104px; border-radius:12px;
  background:#000; filter:blur(30px); opacity:.26; transform:translateZ(-2px); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
<div id="view"><div id="floor"><div class="slot" style="left:60px;top:60px"><div class="rsh" id="sh0"></div><div class="rise" id="rs0"><div class="pcard"><div class="t">模块 A</div><div class="l" style="width:70%"></div><div class="l" style="width:48%"></div></div></div></div><div class="slot" style="left:500px;top:60px"><div class="rsh" id="sh1"></div><div class="rise" id="rs1"><div class="pcard"><div class="t">模块 B</div><div class="l" style="width:70%"></div><div class="l" style="width:48%"></div></div></div></div><div class="slot" style="left:940px;top:60px"><div class="rsh" id="sh2"></div><div class="rise" id="rs2"><div class="pcard"><div class="t">模块 C</div><div class="l" style="width:70%"></div><div class="l" style="width:48%"></div></div></div></div><div class="slot" style="left:60px;top:440px"><div class="rsh" id="sh3"></div><div class="rise" id="rs3"><div class="pcard"><div class="t">模块 D</div><div class="l" style="width:70%"></div><div class="l" style="width:48%"></div></div></div></div><div class="slot" style="left:500px;top:440px"><div class="rsh" id="sh4"></div><div class="rise" id="rs4"><div class="pcard hot"><div class="t">模块 E</div><div class="l" style="width:70%"></div><div class="l" style="width:48%"></div></div></div></div><div class="slot" style="left:940px;top:440px"><div class="rsh" id="sh5"></div><div class="rise" id="rs5"><div class="pcard"><div class="t">模块 F</div><div class="l" style="width:70%"></div><div class="l" style="width:48%"></div></div></div></div></div></div>
    </div>
    <script>
      const FB = {"accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

// 远排先近排后，错峰 7f：rotateX 0→-95° 过冲→回正 -90°（纸的韧性）
const rows=[[0,1,2],[3,4,5]];
rows.forEach((row,ri)=>{
  row.forEach((id,ci)=>{
    const cue=8+(1-ri)*0+ri*7+ci*7+ (1-ri)*0; // 近排(row1)晚
    const farCue=8+((ri===0)?0:21)+ci*7;
    tl.to('#rs'+id,{rotationX:-95,duration:F(14),ease:'power2.out'},F(farCue));
    tl.to('#rs'+id,{rotationX:-90,duration:F(6),ease:'power1.inOut'},F(farCue+14));
    // 根部投影随立起收窄：高 104→14、透明度 .26→.1
    tl.to('#sh'+id,{height:14,opacity:.1,duration:F(20),ease:'power1.inOut'},F(farCue));
  });
});
// 全部站定后场景 75°→68° 轻回正
tl.to('#floor',{rotationX:68,duration:F(18),ease:'power2.inOut'},F(64));
// 收尾真静止（补齐到 135f）
tl.to({},{duration:F(53)},F(82));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
