<!DOCTYPE html>
<html lang="zh-CN" data-composition-variables='[{"id": "chapterNo", "type": "string", "label": "章节序号", "default": "第 一 章"}, {"id": "chapterTitle", "type": "string", "label": "章节标题", "default": "起源"}, {"id": "subtitle", "type": "string", "label": "副标题", "default": "Origin · 1986"}, {"id": "accent", "type": "color", "label": "强调色（朱砂红）", "default": "#b91c1c"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
<head>
  <meta charset="UTF-8">
  <title>章节大标题·皮影档案</title>
  <script src="../_lib/gsap.min.js"></script>
  <style>
    :root {
      --accent: #b91c1c;
      --ink: #0a0a0a;
      --paper: #faf6ed;
      --warm: #8b7355;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "MiSans", "PingFang SC", "Source Han Serif", "Songti SC", serif; }
    .composition { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
    .layer { position: absolute; inset: 0; }

    /* L1: 米白纸底 + 网格 + 牛皮纸纹理 + 胶片噪点 */
    .l1-bg { z-index: 1; }
    .paper-base {
      position: absolute; inset: 0;
      background: var(--paper);
    }
    .paper-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(61,40,23,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61,40,23,0.08) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .grain-layer {
      position: absolute; inset: 0;
      background-image: url("./assets/grain.png");
      background-size: 320px 320px;
      opacity: 0.25;
      mix-blend-mode: multiply;
    }
    /* 纸页四边轻微做旧——角落暗色 */
    .paper-age {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(61,40,23,0.18) 100%);
    }

    /* L2: 章节序号（顶部，"第 一 章"风格） */
    .l2-content { z-index: 10; }
    .chapter-no {
      position: absolute; left: 50%; top: 240px;
      transform: translateX(-50%);
      font-size: 28px;
      letter-spacing: 0.6em;
      font-weight: 600;
      color: var(--ink);
      padding-left: 0.6em; /* 抵消 letter-spacing 居中偏移 */
    }
    .chapter-no::before, .chapter-no::after {
      content: ""; position: absolute; top: 50%;
      width: 80px; height: 1px;
      background: var(--ink);
    }
    .chapter-no::before { right: calc(100% + 40px); }
    .chapter-no::after { left: calc(100% + 40px); }

    /* 章节主标题（中央，宋体巨号） */
    .chapter-title {
      position: absolute; left: 50%; top: 320px;
      transform: translateX(-50%);
      font-family: "Source Han Serif", "Songti SC", "STSong", "SimSun", serif;
      font-size: 220px;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: 0.15em;
      line-height: 1;
      padding-left: 0.15em;
    }

    /* 副标题（标题下方，serif italic 风格） */
    .subtitle {
      position: absolute; left: 50%; top: 600px;
      transform: translateX(-50%);
      font-family: "Source Han Serif", "Songti SC", "Songti TC", serif;
      font-size: 28px;
      font-weight: 400;
      font-style: italic;
      color: var(--warm);
      letter-spacing: 0.2em;
      padding-left: 0.2em;
    }

    /* L4: 强调装饰 */
    .l4-emphasis { z-index: 30; pointer-events: none; }
    /* 朱砂红印章（"纪录片"）右下角 */
    .stamp {
      position: absolute; right: 80px; bottom: 80px;
      width: 140px; height: 140px;
      border: 6px solid var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.4em;
      text-align: center;
      line-height: 1.4;
      transform: rotate(-8deg);
      opacity: 0.85;
    }
    /* 朱砂朱红细线（标题上方分隔） */
    .accent-line {
      position: absolute; left: 50%; top: 580px;
      transform: translateX(-50%);
      width: 600px; height: 2px;
      background: var(--accent);
    }

    /* L5: 装饰 */
    .l5-decoration { z-index: 40; pointer-events: none; }
    /* 顶部页码/章节信息（左侧） */
    .corner-mark {
      position: absolute; left: 80px; top: 80px;
      font-size: 14px;
      font-family: "Courier New", monospace;
      color: var(--ink);
      letter-spacing: 0.2em;
    }
    .corner-mark::before {
      content: "— ";
    }
    /* 右侧日期戳 */
    .date-mark {
      position: absolute; right: 80px; top: 80px;
      font-size: 14px;
      font-family: "Courier New", monospace;
      color: var(--ink);
      letter-spacing: 0.15em;
      text-align: right;
    }

    /* L6: 环境 */
    .l6-environment { z-index: 50; pointer-events: none; }
    /* 暗角 */
    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.15) 100%);
    }

    .progress-bar {
      position: absolute; left: 0; bottom: 0; height: 3px;
      background: var(--accent); width: 0%; z-index: 60;
    }

    /* 初始态 */
    .chapter-no { opacity: 0; }
    .chapter-title { opacity: 0; clip-path: inset(0 0 100% 0); }
    .subtitle { opacity: 0; }
    .accent-line { transform: translateX(-50%) scaleX(0); }
    .stamp { opacity: 0; transform: rotate(-8deg) scale(1.5); }
    .corner-mark, .date-mark { opacity: 0; }
  </style>
</head>
<body>
  <div id="composition" class="composition" data-composition-id="docu-title-chapter-2026-08-31" data-start="0" data-duration="6" data-width="1920" data-height="1080">
    <div class="layer l1-bg">
      <div class="paper-base"></div>
      <div class="paper-grid"></div>
      <div class="grain-layer"></div>
      <div class="paper-age"></div>
    </div>

    <div class="layer l2-content">
      <div class="chapter-no" data-composition-variable="chapterNo">第 一 章</div>
      <div class="chapter-title" data-composition-variable="chapterTitle">起源</div>
      <div class="subtitle" data-composition-variable="subtitle">Origin · 1986</div>
    </div>

    <div class="layer l4-emphasis">
      <div class="stamp">纪录片<br/>2026</div>
      <div class="accent-line"></div>
    </div>

    <div class="layer l5-decoration">
      <div class="corner-mark">DOCU · 001</div>
      <div class="date-mark">2026 / 08 / 31</div>
    </div>

    <div class="layer l6-environment">
      <div class="vignette"></div>
    </div>

    <div class="progress-bar"></div>
  </div>

  <script>
    window.addEventListener("load", () => {
      const vars = window.__hyperframes?.getVariables?.() || {};
      const duration = Math.max(1, Number(vars.duration) || 6);
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      window.__timelines = window.__timelines || {};

      // 入场：序号 → 主标题（拉幕式 clip-path 从上往下揭幕）→ 朱砂线 → 副标题 → 印章
      tl.to(".chapter-no", { opacity: 1, duration: 0.4 }, 0);
      tl.to(".chapter-title", { clipPath: "inset(0 0 0% 0)", opacity: 1, duration: 0.8, ease: "power2.out" }, 0.4);
      tl.to(".accent-line", { scaleX: 1, duration: 0.5, transformOrigin: "center center" }, 1.0);
      tl.to(".subtitle", { opacity: 1, duration: 0.5 }, 1.3);
      tl.to(".corner-mark, .date-mark", { opacity: 1, duration: 0.4 }, 1.0);
      tl.to(".stamp", { opacity: 0.85, scale: 1, duration: 0.5, ease: "back.out(1.5)" }, 1.6);

      // 出场
      const exitAt = Math.max(1.5, duration - 0.8);
      tl.to(".subtitle", { opacity: 0, duration: 0.4 }, exitAt);
      tl.to(".stamp", { opacity: 0, duration: 0.4 }, exitAt);

      // 进度条
      tl.to(".progress-bar", { width: "100%", duration: duration, ease: "none" }, 0);

      window.__timelines["docu-title-chapter-2026-08-31"] = tl;
      window.__hyperframes?.ready?.();
    });
  </script>
</body>
</html>
