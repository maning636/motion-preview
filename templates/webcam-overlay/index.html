<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"position","type":"string","label":"位置（top-left/top-right/bottom-left/bottom-right）","default":"top-right"},{"id":"size","type":"number","label":"圆形直径（px）","default":240},{"id":"borderWidth","type":"number","label":"边框宽度（px）","default":4},{"id":"showPip","type":"string","label":"是否显示小三角指示器（true/false）","default":"true"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 48px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .webcam{ position: absolute; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .ring{ position: absolute; inset: 0; border-radius: 50%; border: solid var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .pip{ position: absolute; width: 0; height: 0; border-style: solid;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .placeholder{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 18px; color: var(--fg); opacity: 0.35; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="webcam" id="webcam">
          <div class="ring" id="ring"></div>
          <div class="placeholder" id="placeholder">camera<br/>mask</div>
          <div class="pip" id="pip"></div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { position: "top-right", size: 240, borderWidth: 4, showPip: "true", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.setProperty("--accent", v.accent);
      root.style.setProperty("--bg", v.background);
      root.style.setProperty("--fg", v.foreground);
      root.style.backgroundColor = v.background;

      const size = Number(v.size) || 240;
      const margin = 48;
      const positions = {
        "top-left": { left: margin, top: margin },
        "top-right": { right: margin, top: margin },
        "bottom-left": { left: margin, bottom: margin },
        "bottom-right": { right: margin, bottom: margin }
      };
      const pos = positions[v.position] || positions["top-right"];
      const webcam = document.getElementById("webcam");
      webcam.style.width = size + "px";
      webcam.style.height = size + "px";
      Object.assign(webcam.style, pos);

      const ring = document.getElementById("ring");
      ring.style.borderWidth = (Number(v.borderWidth) || 4) + "px";

      const placeholder = document.getElementById("placeholder");
      placeholder.style.color = v.foreground;

      const pip = document.getElementById("pip");
      const showPip = String(v.showPip).toLowerCase() === "true";
      if (showPip) {
        const bw = 10;
        pip.style.borderWidth = bw + "px";
        pip.style.borderColor = "transparent transparent transparent " + v.accent;
        // position pip on the outer edge based on corner
        if (v.position === "top-right") { pip.style.right = (size * 0.15) + "px"; pip.style.bottom = (size * 0.08) + "px"; pip.style.transform = "rotate(-15deg)"; }
        else if (v.position === "top-left") { pip.style.left = (size * 0.15) + "px"; pip.style.bottom = (size * 0.08) + "px"; pip.style.transform = "rotate(15deg) scaleX(-1)"; }
        else if (v.position === "bottom-right") { pip.style.right = (size * 0.15) + "px"; pip.style.top = (size * 0.08) + "px"; pip.style.transform = "rotate(15deg)"; }
        else { pip.style.left = (size * 0.15) + "px"; pip.style.top = (size * 0.08) + "px"; pip.style.transform = "rotate(-15deg) scaleX(-1)"; }
      } else {
        pip.style.display = "none";
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".webcam", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.2);
      tl.fromTo(".ring", { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 0.5);
      tl.to(".ring", { scale: 1.03, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.0);
      tl.fromTo(".pip", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.9);
      tl.to(".scene", { opacity: 0, duration: 0.4, ease: "power2.in" }, 5.6);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
