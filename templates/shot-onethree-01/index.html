<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#actor{ position:absolute; left:0; top:420px; width:260px; height:220px; border-radius:20px;
  background:#16181F; border:2px solid var(--accent); display:flex; align-items:center;
  justify-content:center; font-size:44px; font-weight:900; will-change:transform; z-index:3; }
.ghost{ position:absolute; left:0; top:420px; width:260px; height:220px; border-radius:20px;
  border:2px solid color-mix(in srgb, var(--accent) 50%, transparent); display:none; z-index:2; }
#badge{ position:absolute; right:120px; top:100px; font-size:30px; font-family:'Courier New',monospace;
  color:var(--accent); border:2px solid var(--accent); border-radius:8px; padding:8px 20px; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
<div class="ghost" id="gh1"></div><div class="ghost" id="gh2"></div><div id="actor">冲刺</div><div id="badge">on 3s</div>
    </div>
    <script>
      const FB = {"accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

const actor=$('#actor'), badge=$('#badge'), gh1=$('#gh1'), gh2=$('#gh2');
const sim={f:0};
function outPoly4(p){ return 1-Math.pow(1-p,4); }
function paint(){
  const f=sim.f;
  let x, rot=0, sx=1, sy=1;
  if(f<48){
    // 一拍三：q=floor(f/3)*3 驱动，每步 ≈79px，姿势一步一个样
    const q=Math.floor(f/3)*3;
    x=120+(1380-120)*(q/48);
    rot=Math.sin(q)*5;
    badge.textContent='on 3s';
  }else{
    // 一拍一：逐帧丝滑冲刺折返中央 + 过冲 36px + 回弹
    const t=f-48;
    if(t<20){ x=1380+(996-1380)*outPoly4(t/20); }
    else if(t<26){ const p=(t-20)/6; x=996-36*p; sx=0.9+0.1*p; sy=1-0.12*(1-p)*0; }
    else{ x=960; }
    // 运动拉伸由速度驱动
    const v=Math.abs((f<68?1380+(996-1380)*outPoly4(Math.min(20,Math.max(0,f-48))/20):960)-x);
    badge.textContent='on 1s';
    rot=0;
  }
  actor.style.transform='translate('+x+'px,0) rotate('+rot+'deg) scale('+sx+',1)';
  // 残影 2 层条件挂载：速度高才显示
  let vel=0;
  if(f>=48&&f<68){
    const t=f-48;
    const x1=1380+(996-1380)*outPoly4(Math.min(20,t)/20);
    const x0=1380+(996-1380)*outPoly4(Math.min(20,Math.max(0,t-1))/20);
    vel=Math.abs(x1-x0);
  }
  if(vel>10){
    gh1.style.display='block'; gh2.style.display='block';
    gh1.style.transform='translate('+(x-vel*2)+'px,0)'; gh1.style.opacity=.3;
    gh2.style.transform='translate('+(x-vel*4)+'px,0)'; gh2.style.opacity=.15;
  }else{
    gh1.style.display='none'; gh2.style.display='none';
  }
}
paint();
tl.to(sim,{f:108,duration:F(108),ease:'none',onUpdate:paint},0);
// 切换瞬间角标 pop 1.35x
tl.fromTo(badge,{scale:1.35},{scale:1,duration:F(4),ease:'power2.out'},F(48));
// f108-150 真静止
tl.to({},{duration:F(42)},F(108));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
