<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"订单状态机"},{"id":"subtitle","type":"string","label":"副标题","default":"状态流转与关键转换"},{"id":"states","type":"string","label":"状态（逗号分隔）","default":"待支付,已支付,配送中,已完成"},{"id":"transitions","type":"string","label":"转换关系（格式：from>to,from>to）","default":"待支付>已支付,已支付>配送中,配送中>已完成,待支付>已取消"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      body{ font-family: 'MEBHeiHeiTi', sans-serif; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e); color: var(--foreground, #f4efe7);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title-area{ margin-bottom: 48px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0 0 12px; font-size: 72px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .subtitle{ margin: 0; font-size: 32px; font-weight: 400; color: #6B7280;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-area{ position: relative; width: 100%; height: 620px; display: flex; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-svg{ width: 100%; height: 100%; overflow: visible;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .state-circle{ fill: #211c18; stroke: #3a3029; stroke-width: 3;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .state-active{ fill: var(--accent); stroke: var(--accent);font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .state-text{ fill: #f4efe7; font-size: 20px; font-weight: 600; text-anchor: middle;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .state-text.active{ fill: #12100e;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .arrow{ fill: none; stroke: #3a3029; stroke-width: 2.5; marker-end: url(#arrowhead);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .arrow.active{ stroke: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title-area">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <svg class="chart-svg" id="chart-svg" viewBox="0 0 1696 620" preserveAspectRatio="xMidYMid meet">
            <defs>
              <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                <polygon points="0 0, 10 3, 0 6" fill="#3a3029" />
              </marker>
            </defs>
          </svg>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "订单状态机", subtitle: "状态流转与关键转换", states: "待支付,已支付,配送中,已完成", transitions: "待支付>已支付,已支付>配送中,配送中>已完成,待支付>已取消", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      document.documentElement.style.setProperty("--accent", v.accent);
      document.getElementById("root").style.backgroundColor = v.background;
      document.getElementById("root").style.color = v.foreground;
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;

      const states = v.states.split(",");
      const transitions = v.transitions.split(",").map(t => t.split(">"));
      const svg = document.getElementById("chart-svg");
      const cx = 848, cy = 310, r = 220;
      const angleStep = (2 * Math.PI) / states.length;
      const stateNodes = states.map((s, i) => {
        const angle = -Math.PI / 2 + i * angleStep;
        return { name: s, x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
      });

      const arrowElems = [];
      transitions.forEach(([from, to], i) => {
        const a = stateNodes.find(n => n.name === from), b = stateNodes.find(n => n.name === to);
        if (!a || !b) return;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
        const cpX = midX + (b.y - a.y) * 0.25, cpY = midY - (b.x - a.x) * 0.25;
        path.setAttribute("d", `M ${a.x} ${a.y} Q ${cpX} ${cpY} ${b.x} ${b.y}`);
        path.setAttribute("class", "arrow arrow-line"); path.setAttribute("opacity", "0"); svg.appendChild(path);
        arrowElems.push(path);
      });

      const stateElems = [];
      stateNodes.forEach((n, i) => {
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", n.x); circle.setAttribute("cy", n.y); circle.setAttribute("r", 52); circle.setAttribute("class", "state-circle state-node"); circle.setAttribute("opacity", "0"); svg.appendChild(circle);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", n.x); text.setAttribute("y", n.y + 6); text.setAttribute("class", "state-text state-label"); text.textContent = n.name; text.setAttribute("opacity", "0"); svg.appendChild(text);
        stateElems.push({ circle, text });
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      stateElems.forEach((se, i) => {
        tl.fromTo([se.circle, se.text], { opacity: 0, scale: 0.8, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.5)" }, 0.6 + i * 0.12);
      });
      arrowElems.forEach((arrow, i) => {
        tl.fromTo(arrow, { opacity: 0, strokeDasharray: 500, strokeDashoffset: 500 }, { opacity: 1, strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 1.4 + i * 0.12);
      });
      if (stateElems[0]) {
        tl.to(stateElems[0].circle, { fill: v.accent, stroke: v.accent, duration: 0.4 }, 2.5);
        tl.to(stateElems[0].text, { fill: "#12100e", duration: 0.4 }, 2.5);
      }
      tl.to(".scene", { opacity: 0, scale: 1.01, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
