<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "kicker", "type": "string", "label": "眉题", "default": "QUAD SPLIT · 四分屏平行场景"}, {"id": "cells", "type": "string", "label": "四格内容（标题|说明，分号分隔）", "default": "灵感采集|碎片想法一键收进素材库；大纲生成|AI 三分钟搭好文章骨架；初稿撰写|千字初稿边写边改；排版分发|一键排版同步多平台"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 7}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .qs-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .qs-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .qs-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .qs-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      .qs-kicker{ position: absolute; left: 210px; top: 118px; font-size: 22px; letter-spacing: .3em; color: #141414; z-index: 5; }
      .qs-kicker b{ color: #9A9A92; font-weight: 400; }
      /* 四分格 */
      .qs-wrap{ position: absolute; left: 210px; top: 180px; width: 1500px; height: 720px; z-index: 4; }
      .qs-grid{ position: absolute; inset: 0; display: grid; grid-template-columns: 738px 738px;
        grid-template-rows: 348px 348px; gap: 24px; }
      .qs-cell{ position: relative; background: #fff; border: 3px solid #141414;
        box-shadow: 10px 10px 0 #141414; padding: 30px 34px; display: flex; overflow: hidden; }
      .qs-cell .txt{ flex: 1; min-width: 0; }
      .qs-cell .idx{ font-size: 18px; letter-spacing: .26em; color: #9A9A92; }
      .qs-cell .name{ margin-top: 14px; font-size: 44px; font-weight: 900; line-height: 1.15; }
      .qs-cell .dsc{ margin-top: 16px; font-family: 'MiSans SemiBold', sans-serif; font-size: 23px;
        line-height: 1.6; color: #55554E; }
      .qs-cell svg{ flex: none; width: 150px; height: 150px; margin: auto 0 auto 18px; }
      .qs-cell svg path, .qs-cell svg circle, .qs-cell svg line{ stroke: #141414; stroke-width: 5;
        fill: none; stroke-linecap: square; stroke-dasharray: 1; stroke-dashoffset: 1; }
      .qs-cell svg .grn{ stroke: var(--ac, #00FF00); }
      .qs-cell .dim{ position: absolute; inset: 0; background: #F6F5EF; opacity: 0; pointer-events: none; }
      /* 荧光绿聚焦框 */
      .qs-focus{ position: absolute; left: -10px; top: -10px; width: 758px; height: 368px;
        border: 6px solid var(--ac, #00FF00); z-index: 5; pointer-events: none; opacity: 0; }
      .qs-focus .tag{ position: absolute; right: 0; top: -52px; background: var(--ac, #00FF00);
        color: #141414; font-size: 20px; font-weight: 900; letter-spacing: .18em; padding: 8px 18px;
        border: 3px solid #141414; pointer-events: auto; }
      /* 底部绿色署名条 */
      .qs-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(64px); }
      .qs-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .qs-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1920" data-height="1080">
      <div class="qs-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol">VOL.15 · 视觉动效库</div>
        <div class="r mono" id="pageno">P.395 / 400</div>
      </div>
      <div class="qs-kicker mono" id="kicker"></div>
      <div class="qs-wrap" id="wrap">
        <div class="qs-grid" id="grid"></div>
        <div class="qs-focus" id="focus"><div class="tag mono" id="ftag">NOW · 01</div></div>
      </div>
      <div class="qs-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · QUAD SPLIT</div>
      </div>
    </div>
    <script>
      const fallback = {"kicker": "QUAD SPLIT · 四分屏平行场景", "cells": "灵感采集|碎片想法一键收进素材库；大纲生成|AI 三分钟搭好文章骨架；初稿撰写|千字初稿边写边改；排版分发|一键排版同步多平台", "accent": "#00FF00", "duration": 7};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("kicker").textContent = "";
      const kc = String(V.kicker).split("·");
      $("kicker").textContent = kc[0].trim();
      if (kc[1]) { const b = document.createElement("b"); b.textContent = " · " + kc.slice(1).join("·").trim(); $("kicker").appendChild(b); }
      // 四格简笔画（stroke 描画，pathLength=1 归一化）
      const ICONS = [
        '<svg viewBox="0 0 150 150"><circle cx="75" cy="70" r="46" pathLength="1"/><line x1="75" y1="116" x2="75" y2="138" pathLength="1" class="grn"/><circle cx="75" cy="70" r="10" pathLength="1" class="grn"/></svg>',
        '<svg viewBox="0 0 150 150"><line x1="30" y1="120" x2="120" y2="120" pathLength="1"/><line x1="42" y1="120" x2="42" y2="78" pathLength="1"/><line x1="75" y1="120" x2="75" y2="52" pathLength="1"/><line x1="108" y1="120" x2="108" y2="30" pathLength="1" class="grn"/></svg>',
        '<svg viewBox="0 0 150 150"><line x1="30" y1="42" x2="120" y2="42" pathLength="1"/><line x1="30" y1="75" x2="120" y2="75" pathLength="1"/><line x1="30" y1="108" x2="88" y2="108" pathLength="1" class="grn"/></svg>',
        '<svg viewBox="0 0 150 150"><circle cx="42" cy="105" r="14" pathLength="1"/><line x1="56" y1="98" x2="104" y2="42" pathLength="1"/><line x1="56" y1="105" x2="110" y2="105" pathLength="1"/><line x1="104" y1="42" x2="122" y2="42" pathLength="1" class="grn"/><line x1="110" y1="105" x2="128" y2="105" pathLength="1" class="grn"/></svg>'
      ];
      const cells = String(V.cells).split(/[；;]/).map(s => s.trim()).filter(Boolean).slice(0, 4);
      while (cells.length < 4) cells.push("场景" + (cells.length + 1) + "|待补充说明");
      const grid = $("grid");
      grid.textContent = "";
      const dims = [], names = [];
      cells.forEach((c, i) => {
        const parts = c.split("|");
        const cell = document.createElement("div");
        cell.className = "qs-cell";
        const txt = document.createElement("div");
        txt.className = "txt";
        const idx = document.createElement("div");
        idx.className = "idx mono"; idx.textContent = "0" + (i + 1) + " / 04";
        const name = document.createElement("div");
        name.className = "name"; name.textContent = (parts[0] || "").trim();
        const dsc = document.createElement("div");
        dsc.className = "dsc"; dsc.textContent = (parts[1] || "").trim();
        txt.appendChild(idx); txt.appendChild(name); txt.appendChild(dsc);
        const icon = document.createElement("span");
        icon.style.display = "contents";
        icon.innerHTML = ICONS[i % ICONS.length];
        const dim = document.createElement("div");
        dim.className = "dim";
        cell.appendChild(txt); cell.appendChild(icon); cell.appendChild(dim);
        grid.appendChild(cell);
        dims.push(dim); names.push((parts[0] || "").trim());
      });
      // 页眉
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      tl.fromTo("#kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45 }, 0.35);
      // 四格入场（错拍 stagger）
      tl.fromTo(".qs-cell", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.14, ease: "expo.out" }, 0.4);
      // 四格简笔画并行描画（起笔错开 0.15s）
      document.querySelectorAll(".qs-cell").forEach((cell, i) => {
        tl.to(cell.querySelectorAll("path, circle, line"), { strokeDashoffset: 0, duration: 0.7, stagger: 0.12, ease: "power2.inOut" }, 0.95 + i * 0.15);
      });
      // 底部署名条
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 1.9);
      tl.fromTo([".qs-foot .f1", ".qs-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 2.1);
      // 荧光绿粗框轮流聚焦（每格 1.2s），其余格压暗
      const POS = [[-10, -10], [752, -10], [-10, 362], [752, 362]];
      for (let i = 0; i < 4; i++) {
        const ft = 2.4 + i * 1.2;
        if (i === 0) tl.fromTo("#focus", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, ft);
        else tl.to("#focus", { x: POS[i][0] + 10 - 0, y: POS[i][1] + 10, duration: 0.35, ease: "expo.inOut" }, ft);
        tl.call(() => {}, [], ft); // 占位保持节拍
        dims.forEach((d, j) => {
          tl.to(d, { opacity: j === i ? 0 : 0.72, duration: 0.3 }, ft);
        });
        tl.to("#ftag", { opacity: 1, duration: 0.01, onStart: () => { $("ftag").textContent = "NOW · 0" + (i + 1); } }, ft);
      }
      // 初始框定位（跟随第一格）
      gsap.set("#focus", { x: 0, y: 0 });
      // 尾部定格段：第四格聚焦后保持静止可读（7s 正片播到此处即最后一帧）
      tl.to({}, { duration: 0.1 }, 7.9);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
