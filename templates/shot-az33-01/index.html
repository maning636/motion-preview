<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "metric", "type": "string", "label": "暗场大数字", "default": "0.3s"}, {"id": "cap", "type": "string", "label": "暗场说明", "default": "平均响应延迟"}, {"id": "title", "type": "string", "label": "亮场标题", "default": "答案已经揭晓"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#scA{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; background:#08080C; will-change:transform; }
#scA #m{ font-size:220px; font-weight:900; color:var(--fg); opacity:.85; }
#scA #c{ margin-top:22px; font-size:32px; opacity:.4; font-family:'MiSans SemiBold',sans-serif; }
#vig{ position:absolute; inset:0; opacity:0; pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.9) 100%); }
#scB{ position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  flex-direction:column; background:#151924; }
#scB #t{ font-size:96px; font-weight:900; }
#scB #t em{ color:var(--accent); font-style:normal; }
#scB .l{ margin-top:34px; height:14px; border-radius:7px; background:color-mix(in srgb, var(--fg) 20%, transparent); width:36%; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.0" data-width="1920" data-height="1080">

<div id="scA"><div id="m"></div><div id="c"></div></div>
<div id="vig"></div>
<div id="scB"><div id="t"></div><div class="l"></div><div class="l" style="width:28%"></div></div>

    </div>
    <script>
      const FB = {"metric": "0.3s", "cap": "平均响应延迟", "title": "答案已经揭晓", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#m').textContent=v.metric||'';$('#c').textContent=v.cap||'';
$('#t').innerHTML=(v.title||'').replace('答案','<em>答案</em>');
const scA=$('#scA'), vig=$('#vig');
// 4s 匀加速推近 1.00→1.14（加速曲线是本体）+ 暗角同曲线渐深
const sim={f:0};
function paint(){
  const p=Math.min(1,sim.f/120);
  const e=p*p; // Easing.in(quad)
  scA.style.transform='scale('+(1+0.14*e).toFixed(4)+')';
  vig.style.opacity=(0.5*e).toFixed(3);
}
paint();
tl.to(sim,{f:120,duration:F(120),ease:'none',onUpdate:paint},0);
// 张力顶点零过渡硬切亮场
tl.set(['#scA','#vig'],{display:'none'},F(120));
tl.set('#scB',{display:'flex'},F(120));
tl.to({},{duration:F(30)},F(120));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
