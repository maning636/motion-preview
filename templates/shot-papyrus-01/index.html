<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}, {"id": "textA1", "type": "string", "label": "窗口A·标题行", "default": "未命名文档 · 草稿"}, {"id": "textA2", "type": "string", "label": "窗口A·副标题", "default": "正文 2,400 字 · 3 张配图"}, {"id": "textA3", "type": "string", "label": "窗口A·备注行", "default": "上次保存于 10 分钟前"}, {"id": "photo", "type": "image", "label": "窗口A·配图（相对路径或URL，留空不显示）", "default": ""}, {"id": "textB1", "type": "string", "label": "窗口B·标题行", "default": "已送达"}, {"id": "textB2", "type": "string", "label": "窗口B·副标题", "default": "对方已接收 · 刚刚"}, {"id": "textB3", "type": "string", "label": "窗口B·状态章", "default": "传输完成"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#stage{ position:absolute; inset:0; overflow:hidden; }
.w{ position:absolute; left:0; top:0; width:700px; height:460px; border-radius:18px; background:#14161F;
  border:1px solid color-mix(in srgb, var(--fg) 16%, transparent); will-change:transform,opacity;
  transform-origin:0 0; }
.w .hd{ height:64px; border-bottom:1px solid color-mix(in srgb, var(--fg) 12%, transparent);
  display:flex; align-items:center; padding:0 26px; font-size:24px; opacity:.7; }
.w .bd{ padding:34px 30px; }
.w .ln{ height:14px; border-radius:7px; background:color-mix(in srgb, var(--fg) 18%, transparent); margin-bottom:20px; }
#sendBtn{ display:inline-block; margin-top:14px; background:var(--accent); color:#0A0A0F; font-weight:800;
  font-size:26px; border-radius:999px; padding:14px 40px; }
.prop{ position:absolute; left:0; top:0; will-change:transform,opacity; transform-origin:0 0; }
#plane{ position:absolute; left:0; top:0; width:150px; height:120px; will-change:transform,opacity;
  transform-origin:0 0; z-index:6; }
#ring{ position:absolute; left:0; top:0; width:80px; height:80px; border-radius:50%;
  border:6px solid var(--accent); opacity:0; will-change:transform,opacity; z-index:5; }
.w .t{ font-size:28px; font-weight:700; margin-bottom:14px; }
.w .t.dim{ font-size:22px; font-weight:400; opacity:.6; }
#photoA{ width:100%; height:150px; object-fit:cover; border-radius:12px; margin:2px 0 16px; display:none; }
.chip{ display:inline-block; margin-top:10px; border:2px solid var(--accent); color:var(--accent);
  border-radius:999px; padding:8px 26px; font-size:22px; font-weight:700; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
<div id="stage"><div class="w" id="winA" data-wx="520" data-wy="560" data-d="1"><div class="hd">窗口 A · 草稿</div><div class="bd"><div class="t" id="tA1"></div><div class="t dim" id="tA2"></div><img id="photoA" alt=""/><div class="t dim" id="tA3"></div><span id="sendBtn">发送 →</span></div></div><div class="w" id="winB" data-wx="3200" data-wy="600" data-d="1"><div class="hd">窗口 B · 收件箱</div><div class="bd"><div class="t" id="tB1"></div><div class="t dim" id="tB2"></div><div class="chip">✓ <span id="tB3"></span></div></div></div><div class="prop" data-wx="200" data-wy="120" data-d="0.45" data-s="30" style="width:30px;height:30px;border-radius:50%;filter:blur(3px);background:var(--accent);opacity:.7"></div><div class="prop" data-wx="441" data-wy="293" data-d="0.75" data-s="67" style="width:67px;height:67px;border-radius:22%;background:color-mix(in srgb, var(--fg) 22%, transparent);opacity:.7"></div><div class="prop" data-wx="682" data-wy="466" data-d="1.3" data-s="44" style="width:44px;height:44px;border-radius:50%;filter:blur(8px);background:color-mix(in srgb, var(--fg) 22%, transparent);opacity:.7"></div><div class="prop" data-wx="923" data-wy="639" data-d="0.45" data-s="81" style="width:81px;height:81px;border-radius:22%;filter:blur(3px);background:color-mix(in srgb, var(--fg) 22%, transparent);opacity:.7"></div><div class="prop" data-wx="1164" data-wy="812" data-d="0.75" data-s="58" style="width:58px;height:58px;border-radius:50%;background:color-mix(in srgb, var(--fg) 22%, transparent);opacity:.7"></div><div class="prop" data-wx="1405" data-wy="145" data-d="1.3" data-s="35" style="width:35px;height:35px;border-radius:22%;filter:blur(8px);background:var(--accent);opacity:.7"></div><div class="prop" data-wx="1646" data-wy="318" data-d="0.45" data-s="72" style="width:72px;height:72px;border-radius:50%;filter:blur(3px);background:color-mix(in srgb, var(--fg) 22%, transparent);opacity:.7"></div><div class="prop" data-wx="1887" data-wy="491" data-d="0.75" data-s="49" style="width:49px;height:49px;border-radius:22%;background:color-mix(in srgb, var(--fg) 22%, transparent);opacity:.7"></div><div class="prop" data-wx="2128" data-wy="664" data-d="1.3" data-s="86" style="width:86px;height:86px;border-radius:50%;filter:blur(8px);background:color-mix(in srgb, var(--fg) 22%, transparent);opacity:.7"></div><div class="prop" data-wx="2369" data-wy="837" data-d="0.45" data-s="63" style="width:63px;height:63px;border-radius:22%;filter:blur(3px);background:color-mix(in srgb, var(--fg) 22%, transparent);opacity:.7"></div><div class="prop" data-wx="2610" data-wy="170" data-d="0.75" data-s="40" style="width:40px;height:40px;border-radius:50%;background:var(--accent);opacity:.7"></div><div class="prop" data-wx="2851" data-wy="343" data-d="1.3" data-s="77" style="width:77px;height:77px;border-radius:22%;filter:blur(8px);background:color-mix(in srgb, var(--fg) 22%, transparent);opacity:.7"></div><div class="prop" data-wx="3092" data-wy="516" data-d="0.45" data-s="54" style="width:54px;height:54px;border-radius:50%;filter:blur(3px);background:color-mix(in srgb, var(--fg) 22%, transparent);opacity:.7"></div><div class="prop" data-wx="3333" data-wy="689" data-d="0.75" data-s="31" style="width:31px;height:31px;border-radius:22%;background:color-mix(in srgb, var(--fg) 22%, transparent);opacity:.7"></div><div class="prop" data-wx="3574" data-wy="862" data-d="1.3" data-s="68" style="width:68px;height:68px;border-radius:50%;filter:blur(8px);background:color-mix(in srgb, var(--fg) 22%, transparent);opacity:.7"></div><div class="prop" data-wx="315" data-wy="195" data-d="0.45" data-s="45" style="width:45px;height:45px;border-radius:22%;filter:blur(3px);background:var(--accent);opacity:.7"></div><div id="ring"></div><div id="plane"><svg id="planeSvg" viewBox="0 0 150 120" style="overflow:visible"><polygon points="10,60 140,10 78,66" fill="#F4F4F2"/><polygon points="10,60 78,66 60,110" fill="#C9C9C4"/><polygon points="78,66 140,10 60,110" fill="#8f8f8a"/><polygon points="10,60 140,10 78,66" fill="none" stroke="#3a3a3a" stroke-width="2"/></svg></div></div>
    </div>
    <script>
      const FB = {"accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2", "textA1": "未命名文档 · 草稿", "textA2": "正文 2,400 字 · 3 张配图", "textA3": "上次保存于 10 分钟前", "photo": "", "textB1": "已送达", "textB2": "对方已接收 · 刚刚", "textB3": "传输完成"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const TXT={tA1:v.textA1||FB.textA1,tA2:v.textA2||FB.textA2,tA3:v.textA3||FB.textA3,
  tB1:v.textB1||FB.textB1,tB2:v.textB2||FB.textB2,tB3:v.textB3||FB.textB3};
for(const k in TXT){ const el=document.getElementById(k); if(el) el.textContent=TXT[k]; }
if(v.photo){ const im=$('#photoA'); im.src=v.photo; im.style.display='block'; }
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

// 世界坐标相机：screen = 960 + (world-cam)*zoom*depth
const cam={cx:520,cy:560,z:1.55};
const fly={p:0};
const P0=[520,560],P1=[1100,-80],P2=[2200,1100],P3=[3200,600];
function bez(t){
  const u=1-t;
  return [u*u*u*P0[0]+3*u*u*t*P1[0]+3*u*t*t*P2[0]+t*t*t*P3[0],
          u*u*u*P0[1]+3*u*u*t*P1[1]+3*u*t*t*P2[1]+t*t*t*P3[1]];
}
function place(el,wx,wy,d,extra){
  const s=cam.z*d;
  el.style.transform='translate('+(960+(wx-cam.cx)*s)+'px,'+(540+(wy-cam.cy)*s)+'px) scale('+s+')'+(extra||'');
}
const wins=[ $('#winA'), $('#winB') ];
const props=[...document.querySelectorAll('.prop')];
const plane=$('#plane'), ring=$('#ring');
let planeOp=1, propOp=1;
function paint(){
  wins.forEach(w=>{ place(w,+w.dataset.wx-350,+w.dataset.wy-230,+w.dataset.d); });
  props.forEach(pr=>{
    place(pr,+pr.dataset.wx,+pr.dataset.wy,+pr.dataset.d);
    pr.style.opacity=(0.7*propOp).toFixed(3);
  });
  // 飞机：贝塞尔 + 切线俯仰 + 途中放大
  const p=Math.min(1,Math.max(0,fly.p));
  const pos=bez(p), ahead=bez(Math.min(1,p+0.012));
  const ang=Math.atan2(ahead[1]-pos[1],ahead[0]-pos[0])*180/Math.PI;
  const mag=1+0.7*Math.sin(Math.PI*Math.min(1,Math.max(0,(p-0.2)/0.6)));
  const sMag=p>0.95?1.1:mag;
  place(plane,pos[0]-75,pos[1]-60,1,' rotate('+ang+'deg) ');
  plane.style.transform+=' scale('+sMag+')';
  plane.style.opacity=planeOp;
  // 相机：f42 起跟随飞机（f42-56 平滑并入）
  if(fly.follow>0){
    const tx=pos[0], ty=pos[1];
    cam.cx=cam.cx+(tx-cam.cx)*fly.follow;
    cam.cy=cam.cy+(ty-cam.cy)*fly.follow;
  }
}
// 点击脉冲（f12）
tl.fromTo('#sendBtn',{scale:1},{scale:1.22,duration:F(3),ease:'power2.out'},F(12));
tl.to('#sendBtn',{scale:1,duration:F(4),ease:'power2.inOut'},F(15));
tl.set(ring,{opacity:.9},F(12));
tl.fromTo(ring,{scale:.4},{scale:3,opacity:0,duration:F(10),ease:'power3.out',
  onUpdate:()=>place(ring,520-40,560-40,1)},F(12));
// 拉远 f16-42：z 1.55→0.62，中心→旅程中点
tl.to(cam,{cx:1860,cy:540,z:0.62,duration:F(26),ease:'power2.inOut',onUpdate:paint},F(16));
// 飞行 f34-104（70f ease-in-out）
tl.to(fly,{p:1,duration:F(70),ease:'power2.inOut',onUpdate:paint},F(34));
tl.to(fly,{follow:1,duration:F(14),ease:'power1.inOut',onUpdate:paint},F(42));
// B 接管 f112-146：变焦推到 3.1，道具/飞机淡出
tl.to(cam,{z:3.1,duration:F(34),ease:'power2.in',onUpdate:paint},F(112));
tl.to({o:1},{o:0,duration:F(20),ease:'none',onUpdate:function(){ planeOp=this.targets()[0].o; paint(); }},F(112));
tl.to({o:1},{o:0,duration:F(34),ease:'none',onUpdate:function(){ propOp=this.targets()[0].o; paint(); }},F(112));
paint();
// 收尾真静止（补齐到 150f）
tl.to({},{duration:F(4)},F(146));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
