<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "key", "type": "string", "label": "键帽文字", "default": "⌘K"}, {"id": "pano", "type": "string", "label": "全景标题", "default": "一切就绪"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#kc{ position:absolute; left:810px; top:390px; width:300px; height:300px; border-radius:36px;
  background:linear-gradient(180deg,#2A2A33,#1B1B22); display:flex; align-items:center; justify-content:center;
  font-size:120px; color:var(--fg); box-shadow:0 12px 0 #0D0D12, 0 30px 60px rgba(0,0,0,.5);
  will-change:transform; }
#kring{ position:absolute; left:960px; top:540px; width:90px; height:90px; border-radius:50%;
  border:6px solid var(--accent); transform:translate(-50%,-50%); opacity:0; }
.roar{ position:absolute; left:710px; top:390px; width:500px; height:300px; border-radius:20px;
  background:#17171F; border:1px solid color-mix(in srgb, var(--accent) 35%, transparent); opacity:0; will-change:transform,filter; }
#pano{ position:absolute; inset:0; display:none; background:#0D0D13; padding:56px 90px; }
#pano .tb{ height:88px; border-radius:16px; background:#15151D; display:flex; align-items:center; padding:0 30px; margin-bottom:44px; }
#pano .mkc{ width:56px; height:56px; border-radius:10px; background:#22222C; color:var(--fg);
  display:flex; align-items:center; justify-content:center; font-size:26px; margin-right:auto; }
#pano h2{ font-size:64px; color:var(--fg); margin-bottom:40px; }
#pano .grid{ display:flex; gap:34px; }
#pano .gc{ flex:1; height:420px; border-radius:18px; background:#15151D; border:1px solid rgba(255,255,255,.12); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
<div id="kc"></div><div id="kring"></div><div class="roar" id="rr0"></div><div class="roar" id="rr1"></div><div class="roar" id="rr2"></div><div class="roar" id="rr3"></div><div class="roar" id="rr4"></div><div class="roar" id="rr5"></div><div id="pano"><div class="tb"><div class="mkc" id="mk"></div></div><h2 id="pt"></h2><div class="grid"><div class="gc"></div><div class="gc"></div><div class="gc"></div></div></div>
    </div>
    <script>
      const FB = {"key": "⌘K", "pano": "一切就绪", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#kc').textContent=v.key||'';$('#mk').textContent=v.key||'';$('#pt').textContent=v.pano||'';
// 键帽呼吸悬浮（有限 repeat）
tl.to('#kc',{y:-16,duration:F(14),yoyo:true,repeat:1,ease:'sine.inOut'},F(2));
// 3f 压扁引信：厚度 12→3 + 下沉 14px + 变暗；亮环溢出
tl.to('#kc',{y:14,scale:.96,boxShadow:'0 3px 0 #0D0D12, 0 10px 24px rgba(0,0,0,.5)',
  filter:'brightness(.75)',duration:F(3),ease:'power2.in'},F(30));
tl.set('#kring',{opacity:.9},F(30));
tl.to('#kring',{width:560,height:560,opacity:0,duration:F(10),ease:'power3.out'},F(30));
// 轰鸣 f33-63：六物两轮 pass 持续加速冲镜（scale 1.5→3 + blur 速度门控）
for(let i=0;i<6;i++){
  const pass2=i>=3, st=33+(i%3)*7+(pass2?3:0), du=pass2?20:26;
  tl.fromTo('#rr'+i,{opacity:.95,scale:.5,y:(i%3-1)*260,x:(i%2?260:-260)},
    {scale:3,x:0,y:0,duration:F(du),ease:'power2.in',
     onUpdate:function(){ const p=this.progress();
       gsap.set('#rr'+i,{filter:'blur('+(1+p*4)+'px)'}); }},F(st));
  tl.to('#rr'+i,{opacity:0,duration:F(4)},F(st+du-4));
}
// 猛切 f63：一帧硬切静止全景，键帽嵌顶栏回收
tl.set('#kc',{display:'none'},F(63));
tl.set('#kring',{display:'none'},F(63));
tl.set('.roar',{display:'none'},F(63));
tl.set('#pano',{display:'block'},F(63));
tl.to({},{duration:F(87)},F(63)); // 死寂真静止（补齐到 150f=data-duration）

      window.__timelines.main = tl;
    </script>
  </body>
</html>
