<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "TIMEBOX / 时间盒"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "把一周切成格子再塞进去"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：小时"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#2FD07A"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>大字陈述 · 把一周切成格子再塞进去</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{flex-direction:column;justify-content:center;position:relative}
  /* 积木角标：四块小方砖错落压在标题左上。
     原先这里放的是 &rdquo;，渲染出来是两个逗号、看着就是「99」，
     三个模板三个样，全被当成排版噪声忽略。装饰件要么是图形要么别放。 */
  .bricks{position:absolute;left:0;top:-14px;display:flex;gap:8px;z-index:1}
  .bricks i{display:block;width:26px;height:26px;border:var(--bw) solid var(--ink);
        background:var(--accent)}
  .bricks i:nth-child(2){background:transparent}
  .bricks i:nth-child(3){background:var(--ink)}
  .sline{position:relative;z-index:2;max-width:1680px}
  .sline h2{font-size:132px;font-weight:900;line-height:1.14;letter-spacing:-.02em}
  /* 高亮块必须自带近黑字：#stage.on-ink 下正文是纸色，
     em 只给 background:var(--accent) 不给 color 时，
     纸色 #FFF6E5 印在黄底 #FFD429 上是 1.33:1 —— 高亮的那几个字直接消失。 */
  .sline h2 em{font-style:normal;background:var(--accent);color:var(--ink);padding:2px 16px;
        box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .sline .rule{height:0;border-top:7px solid var(--ink);margin:38px 0 28px;width:600px}
  .sline .sub{font-size:34px;line-height:1.5;font-weight:700;max-width:1300px;opacity:.78}
  /* 底部三片改成上下两行（数在上、名在下），比挤在一行更能撑住画面；
     上面留白也顺带收掉。 */
  .pts{position:absolute;left:0;right:0;bottom:0;display:flex;gap:22px;z-index:2}
  .pt{flex:1 1 0;min-width:0;border:var(--bw) solid var(--ink);border-radius:4px;
      padding:22px 24px 20px;box-shadow:8px 8px 0 var(--ink);
      display:flex;flex-direction:column;gap:10px}
  .pt .n{font-family:var(--mono);font-weight:700;font-size:58px;line-height:.95;
        letter-spacing:-.04em;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .pt .t{font-size:23px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        border-top:3px solid currentColor;padding-top:12px}
  #stage.on-ink .pt{background:var(--paper);color:var(--ink);box-shadow:8px 8px 0 var(--accent)}
  #stage.on-ink .sline .rule{border-color:var(--paper)}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">TIMEBOX / 时间盒</div></div>
    <div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：小时</div></div>
  <div class="body">
    <div class="bricks" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="sline">
      <h2 id="s1" data-fit-max="132" data-fit-min="52">把一周切成格子再塞<em>进去</em></h2>
      <div class="rule"></div>
      <div class="sub" id="s2" data-fit-max="34" data-fit-min="19">被打断的四十二次，才是真正的成本</div>
    </div>
    <div class="pts"><div class="pt" id="p0"><span class="n" id="v0" data-fit-max="58" data-fit-min="32">31.6h</span><span class="t" id="k0" data-fit-max="23" data-fit-min="14">总投入</span></div><div class="pt" id="p1"><span class="n" id="v1" data-fit-max="58" data-fit-min="32">8.1h</span><span class="t" id="k1" data-fit-max="23" data-fit-min="14">最满</span></div><div class="pt" id="p2"><span class="n" id="v2" data-fit-max="58" data-fit-min="32">4.0h</span><span class="t" id="k2" data-fit-max="23" data-fit-min="14">最闲</span></div></div>
  </div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  tl.from('.bricks i', { scale: 0, opacity: 0, duration: 0.32, ease: 'back.out(2.6)',
      stagger: 0.07 }, 0.05);
  tl.from('.sline .rule', { scaleX: 0, transformOrigin: 'left center',
      duration: 0.5, ease: 'power3.inOut' }, 0.34);
  B.in.drop(tl, '.sline', 0.12, { dist: 70, rot: 0, d: 0.42 });
  tl.from('#s2', { y: 20, opacity: 0, duration: 0.42, ease: 'power2.out' }, 0.56);
  document.querySelectorAll('.pt').forEach(function (p, i) {
    B.in.pop(tl, p, 0.76 + i * 0.08, { d: 0.42, from: .86, ease: 'power3.out' });
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
