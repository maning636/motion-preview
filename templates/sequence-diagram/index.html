<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"API 调用时序"},{"id":"subtitle","type":"string","label":"副标题","default":"客户端与服务端交互过程"},{"id":"actors","type":"string","label":"参与者（逗号分隔）","default":"客户端,网关,服务A,数据库"},{"id":"steps","type":"string","label":"步骤（格式：from>to:label，\\n 分隔）","default":"客户端>网关:发送请求\\n网关>服务A:转发请求\\n服务A>数据库:查询数据\\n数据库>服务A:返回结果\\n服务A>网关:组装响应\\n网关>客户端:返回结果"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      body{ font-family: 'MEBHeiHeiTi', sans-serif; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e); color: var(--foreground, #f4efe7);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title-area{ margin-bottom: 40px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0 0 12px; font-size: 72px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .subtitle{ margin: 0; font-size: 32px; font-weight: 400; color: #6B7280;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-area{ position: relative; width: 100%; height: 640px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-svg{ width: 100%; height: 100%; overflow: visible;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .actor-box{ fill: #211c18; stroke: #3a3029; stroke-width: 2;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .actor-text{ fill: #f4efe7; font-size: 20px; font-weight: 600; text-anchor: middle;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .lifeline{ stroke: #3a3029; stroke-width: 2; stroke-dasharray: 8 6;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .msg-line{ stroke: var(--accent); stroke-width: 2.5; marker-end: url(#msgArrow); opacity: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .msg-text{ fill: #6B7280; font-size: 18px; font-weight: 500; text-anchor: middle; opacity: 0;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title-area">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <svg class="chart-svg" id="chart-svg" viewBox="0 0 1696 640" preserveAspectRatio="xMidYMid meet">
            <defs>
              <marker id="msgArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                <polygon points="0 0, 10 3, 0 6" fill="#00FF00" />
              </marker>
            </defs>
          </svg>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "API 调用时序", subtitle: "客户端与服务端交互过程", actors: "客户端,网关,服务A,数据库", steps: "客户端>网关:发送请求\n网关>服务A:转发请求\n服务A>数据库:查询数据\n数据库>服务A:返回结果\n服务A>网关:组装响应\n网关>客户端:返回结果", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      document.documentElement.style.setProperty("--accent", v.accent);
      document.getElementById("root").style.backgroundColor = v.background;
      document.getElementById("root").style.color = v.foreground;
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;

      const actors = v.actors.split(",");
      const steps = v.steps.split("\\n").map(s => {
        const [pair, label] = s.split(":");
        const [from, to] = pair.split(">");
        return { from: from.trim(), to: to.trim(), label: label.trim() };
      });

      const svg = document.getElementById("chart-svg");
      const chartW = 1696, chartH = 640;
      const marginTop = 60, marginBottom = 60;
      const actorY = 40, actorH = 48;
      const lineEndY = chartH - marginBottom;
      const actorSpacing = chartW / (actors.length + 1);
      const actorX = actors.map((_, i) => actorSpacing * (i + 1));

      actors.forEach((a, i) => {
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", actorX[i] - 80); rect.setAttribute("y", actorY); rect.setAttribute("width", 160); rect.setAttribute("height", actorH); rect.setAttribute("rx", 6); rect.setAttribute("class", "actor-box actor-node"); rect.setAttribute("opacity", "0"); svg.appendChild(rect);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", actorX[i]); text.setAttribute("y", actorY + 30); text.setAttribute("class", "actor-text actor-label"); text.textContent = a; text.setAttribute("opacity", "0"); svg.appendChild(text);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", actorX[i]); line.setAttribute("x2", actorX[i]); line.setAttribute("y1", actorY + actorH); line.setAttribute("y2", lineEndY); line.setAttribute("class", "lifeline life-line"); line.setAttribute("opacity", "0"); svg.appendChild(line);
      });

      const stepHeight = (lineEndY - (actorY + actorH)) / (steps.length + 1);
      const msgElems = [];
      steps.forEach((step, i) => {
        const fromIdx = actors.indexOf(step.from), toIdx = actors.indexOf(step.to);
        if (fromIdx < 0 || toIdx < 0) return;
        const y = actorY + actorH + stepHeight * (i + 1);
        const x1 = actorX[fromIdx], x2 = actorX[toIdx];
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1); line.setAttribute("y1", y); line.setAttribute("x2", x2); line.setAttribute("y2", y); line.setAttribute("class", "msg-line msg-elem"); svg.appendChild(line);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", (x1 + x2) / 2); text.setAttribute("y", y - 12); text.setAttribute("class", "msg-text msg-elem"); text.textContent = step.label; svg.appendChild(text);
        msgElems.push({ line, text });
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo(".actor-node", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08, ease: "power2.out" }, 0.5);
      tl.fromTo(".actor-label", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08, ease: "power2.out" }, 0.55);
      tl.fromTo(".life-line", { opacity: 0 }, { opacity: 1, duration: 0.6, stagger: 0.06, ease: "sine.out" }, 0.9);
      msgElems.forEach((m, i) => {
        tl.fromTo([m.line, m.text], { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.3 + i * 0.18);
      });
      tl.to(".scene", { opacity: 0, scale: 1.01, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
