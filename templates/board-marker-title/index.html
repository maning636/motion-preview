<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "先把流程跑通"}, {"id": "subline", "type": "string", "label": "补充行", "default": "再谈优化，顺序不能反"}, {"id": "underline", "type": "color", "label": "下划线颜色", "default": "#1E7A46"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #FCFBF6; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #1D1D20;
        background-image: linear-gradient(rgba(29,29,32,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(29,29,32,.045) 1px, transparent 1px); background-size: 64px 64px; }
      .b-wrap{ position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; }
      .b-title{ font-size: 128px; font-weight: 900; letter-spacing: .03em; text-align: center;
        max-width: 1600px; line-height: 1.2; }
      .b-under{ width: 700px; height: 60px; margin-top: 6px; overflow: visible; }
      .b-under path{ fill: none; stroke: var(--under, #1E7A46); stroke-width: 26;
        stroke-linecap: round; opacity: .85; }
      .b-sub{ margin-top: 34px; font-size: 42px; font-weight: 700; font-style: italic;
        color: rgba(29,29,32,.72); max-width: 1400px; text-align: center; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="b-wrap">
        <h1 class="b-title" id="title"></h1>
        <svg class="b-under" id="underSvg" viewBox="0 0 700 60" preserveAspectRatio="none">
          <path id="underPath" d="M 12 34 Q 175 14 350 32 T 688 26"/>
        </svg>
        <div class="b-sub" id="sub"></div>
      </div>

    </div>
    <script>
      const fallback = {"title": "先把流程跑通", "subline": "再谈优化，顺序不能反", "underline": "#1E7A46", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      document.documentElement.style.setProperty("--under", V.underline ?? "#1E7A46");
      $("title").textContent = V.title;
      $("sub").textContent = V.subline;
      const p = $("underPath");
      const len = p.getTotalLength();
      p.style.strokeDasharray = String(len);
      p.style.strokeDashoffset = String(len);
      tl.fromTo("#title", { opacity: 0, scale: 0.9, y: 26 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.8)" }, 0.1);
      tl.to(p, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 0.65);
      tl.fromTo("#sub", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.25);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
