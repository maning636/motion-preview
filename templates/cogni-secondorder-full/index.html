<head>

<title>二阶效应 · 一阶好不代表二阶好</title>
<link rel="stylesheet" href="../_lib/blocks.css">

<script src="../_lib/packs.js"></script>
<style>
  /* 底色和字色**必须来自规格包**，不能写死。
     写死 #000 + #F4F1EA 的时候，四个包里只有 dark / night 正常：
     cream 的 --pk-fg 是 #2A2118、mono 是 #14140F，两个都是**深字**，
     压在这个写死的黑底上 → 标题、标签、说明全糊掉。
     而写死字面量色的元素（比如 rgba(244,241,234,.82)）反而还看得见，
     画面上就成了一半能看一半不能看——比全黑更难认。
     一共 33 条模板中招（混剪 5 + 认知 22 + 节拍 6）。

     注意区分两层契约（packs.css 顶部注释里写过）：
       --pk-bg / --pk-fg      = 包自带底板，舞台自己用它
       --pk-*-media           = 压在用户素材上的那一层
     这里改的是前者。 */
  html,body{margin:0;padding:0;background:var(--pk-bg,#000)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--pk-bg,#000);
        color:var(--pk-fg,#F4F1EA);font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
        -webkit-font-smoothing:antialiased}
  /* 统一安全区：混剪里所有贴边元素都从 72/88 起，不贴 0 */
  
  /* ── 通用 ── */
  .eyebrow{position:absolute;left:120px;top:104px;opacity:0;
      font-family:ui-monospace,Consolas,monospace;font-size:26px;font-weight:700;

  .h1{position:absolute;left:120px;top:148px;width:1680px;opacity:0;
      font-size:76px;font-weight:900;line-height:1.16;color:var(--pk-fg);letter-spacing:.01em}
  .foot{position:absolute;left:120px;top:922px;width:1680px;opacity:0;
      font-size:34px;line-height:1.5;color:var(--pk-muted)}
  .foot b{color:var(--pk-accent);font-weight:700}
  /* 底部一条极细的分隔，给满屏一个「结束感」 */
  .footline{position:absolute;left:120px;top:884px;width:0;height:2px;background:var(--pk-accent)}

  /* ── 因果链 ── */
  .spine{position:absolute;left:120px;top:0;width:4px;height:0;background:var(--pk-accent);opacity:.9}
  .node{position:absolute;left:120px;width:64px;height:64px;margin:-32px 0 0 -32px;
      border-radius:50%;border:3px solid var(--pk-accent);background:var(--pk-bg);opacity:0;
      display:flex;align-items:center;justify-content:center;

  .clabel{position:absolute;opacity:0;font-family:ui-monospace,Consolas,monospace;
      font-size:30px;font-weight:800;letter-spacing:.20em;color:var(--pk-accent)}
  .ctext{position:absolute;opacity:0;font-size:52px;font-weight:700;line-height:1.30;color:var(--pk-fg)}

  .vcard .vv{font-size:30px;font-weight:800;color:var(--pk-accent);margin-top:14px;
      font-family:ui-monospace,Consolas,monospace}

  /* ── 引述页 ── */
  .qm{position:absolute;left:120px;top:236px;opacity:0;

  .qtext{position:absolute;left:120px;top:376px;width:1560px;opacity:0;

  .qwho{position:absolute;left:120px;opacity:0;
      font-family:ui-monospace,Consolas,monospace;font-size:28px;font-weight:700;
      letter-spacing:.16em;color:var(--pk-muted)}
  .qrule{position:absolute;left:120px;width:0;height:2px;background:rgba(244,241,234,.28)}

      font-size:26px;font-weight:800;letter-spacing:.22em;color:var(--pk-accent)}
  .qtake{position:absolute;opacity:0;font-size:36px;line-height:1.52;
      color:var(--pk-fg)}

  /* ── 曲线页 ── */
  .chart{position:absolute;left:120px;top:400px;width:1680px;height:400px}
  .svgbox{position:absolute;left:0;top:0;width:100%;height:100%}
  .grid{position:absolute;left:0;right:0;height:1px;background:rgba(244,241,234,.10)}
  .pivot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
      background:var(--pk-accent);opacity:0;box-shadow:0 0 0 8px rgba(232,160,72,.18)}
  .pvline{position:absolute;width:2px;background:rgba(232,160,72,.55);opacity:0}
  .pvlab{position:absolute;opacity:0;font-size:30px;font-weight:800;color:var(--pk-accent)}
  .phase{position:absolute;top:0;opacity:0}
  .phase .pn{font-family:ui-monospace,Consolas,monospace;font-size:24px;font-weight:800;
      letter-spacing:.18em;color:var(--pk-accent)}
  .phase .pt{font-size:32px;font-weight:700;color:var(--pk-fg);margin-top:12px}
  .phase .pd{font-size:25px;color:var(--pk-muted);margin-top:10px;line-height:1.45}

  /* ═══ 1 · 沉没成本：两张清单并排，中间一个不等号 ═══ */
  /* 左卡必须写 left。只给 top 不给 left，position:absolute 会贴到 x=0——
     探针的 F1 专查这一件。右边那张靠行内 style 给 left=1000px，
     左边这张靠 CSS 里的 left，两边写法不一致就一定会漏一边。 */
  .sk{position:absolute;left:120px;top:344px;width:800px;height:252px;opacity:0;
      border:2px solid var(--pk-line);background:var(--pk-panel);padding:38px 42px}
  .sk .kh{font-family:ui-monospace,Consolas,monospace;font-size:29px;font-weight:800;
      letter-spacing:.22em;color:var(--pk-muted)}
  .sk .ki{font-size:35px;font-weight:700;line-height:1.34;color:var(--pk-fg);
      margin-top:26px}
  .sk .kn{font-size:23px;line-height:1.5;color:var(--pk-muted);margin-top:6px}
  .sk.key{border-color:var(--pk-accent)}
  .sk.key .kh{color:var(--pk-accent)}
  .sk-eq{position:absolute;left:964px;top:426px;width:0;height:88px;opacity:0;
      display:flex;align-items:center;justify-content:center;
      font-size:52px;font-weight:900;color:var(--pk-accent)}

  /* ═══ 2 · 幸存者偏差：一排圆点，只有两个被点名 ═══ */
  .sv{position:absolute;top:392px;width:104px;height:104px;margin-left:-52px;
      border-radius:50%;border:3px solid var(--pk-line);opacity:0;
      display:flex;align-items:center;justify-content:center;
      font-family:ui-monospace,Consolas,monospace;font-size:24px;font-weight:800;
      color:var(--pk-muted)}
  .sv.known{border-color:var(--pk-accent);color:var(--pk-accent);
      background:var(--pk-panel)}
  .sv-lb{position:absolute;top:516px;width:180px;margin-left:-90px;text-align:center;
      opacity:0;font-size:25px;font-weight:700;color:var(--pk-muted)}
  .sv-br{position:absolute;top:566px;height:0;width:0;border-left:0 solid transparent;
      opacity:0}
  /* 两条横线都不写 opacity:0。补间给的是 width（从 0 长出来），
     那根线就是靠「长出来」被看见的；顺手在 CSS 里写个 opacity:0，
     等于要求补间再开一次透明度而没开——线永远是隐形的，F1~F5 一条都不报。
     上一批的 .tl-axis 就是这么丢的，这里又写了一遍。 */
  .sv-rule{position:absolute;left:120px;top:610px;width:0;height:3px;
      background:var(--pk-line)}
  .sv-note{position:absolute;left:120px;top:660px;width:1680px;opacity:0;
      display:flex;align-items:baseline;gap:34px}
  .sv-note .n1{font-size:30px;color:var(--pk-muted)}
  .sv-note .n2{font-family:ui-monospace,Consolas,monospace;font-size:104px;
      font-weight:900;color:var(--pk-accent);font-variant-numeric:tabular-nums}
  .sv-note .n3{font-size:30px;color:var(--pk-muted)}
  .sv-note .n2b{font-family:ui-monospace,Consolas,monospace;font-size:56px;
      font-weight:900;color:var(--pk-muted);font-variant-numeric:tabular-nums}

  /* ═══ 3 · 技能曲线：一条越走越平的线 + 三段 ═══
     三段色带和三个标签都必须显式定位到舞台上。
     之前它们挂在一个普通流 div（.skc-bd / .skc-lbd）里，
     于是 position:absolute 参照的是 #stage 而不是那个 div——
     标签写 top:-108px 直接跑到画布外，色带写 height:0 等于没有。
     F6 查不出这两类（它只查透明度），是目检看出来的。 */
  .skc{position:absolute;left:200px;top:330px;width:1500px;height:400px;opacity:0;
      z-index:2}
  .skc-bd{position:absolute;left:0;top:0;width:0;height:0;z-index:1}
  .skc-lbd{position:absolute;left:0;top:0;width:0;height:0;z-index:3}
  /* 色带的 left 要加 SVG 元素自己的 200px 偏移。
     SVG 内部的 viewBox 坐标从 0 起，但 SVG 元素在版面上是 left:200px，
     所以 viewBox 的 x=0 对应舞台的 x=200。直接照抄内部坐标会整体左移 200，
     探针的 F1 会报「贴在 x=0」——那不是误报，是真的错位。 */
  .skc-band{position:absolute;left:200px;top:330px;width:0;height:400px;
      opacity:0;background:var(--pk-line);z-index:1}
  .skc-lb{position:absolute;opacity:0}
  .skc-lb .t{font-size:31px;font-weight:800;color:var(--pk-fg)}
  .skc-lb .d{font-size:22px;line-height:1.5;color:var(--pk-muted);margin-top:8px}
  .skc-ax{position:absolute;left:200px;top:730px;width:0;height:3px;
      background:var(--pk-line)}

  /* ═══ 4 · 二阶效应：一条脊线，三阶递进 ═══ */
  .so-spine{position:absolute;left:120px;top:392px;width:4px;height:0;
      background:var(--pk-accent);opacity:.9}
  .so{position:absolute;left:120px;width:1680px;height:150px;opacity:0;
      display:flex;align-items:center;gap:40px}
  /* 圆点在 left:-6px（贴着脊线），标签必须让开。
     不让的话圆点正好压在「一阶」的「一」上，三个标签都被切掉第一个字。 */
  .so .ord{flex:0 0 184px;padding-left:34px;font-family:ui-monospace,Consolas,monospace;
      font-size:30px;font-weight:800;letter-spacing:.18em;color:var(--pk-accent)}
  .so .now{flex:0 0 660px;font-size:34px;font-weight:700;line-height:1.32;
      color:var(--pk-fg)}
  .so .arw{flex:0 0 44px;height:2px;background:var(--pk-line)}
  .so .nxt{flex:1;font-size:30px;line-height:1.36;color:var(--pk-accent);font-weight:700}
  .so .dot{position:absolute;left:-6px;width:16px;height:16px;margin-top:-8px;
      border-radius:50%;background:var(--pk-accent);opacity:0}

  /* ═══ 5 · 默认选项：两张卡，其中一张写着「什么都不做」 ═══ */
  .df{position:absolute;left:120px;top:352px;width:800px;height:276px;opacity:0;
      border:2px solid var(--pk-line);background:var(--pk-panel);padding:40px 44px}
  .df .dh{font-family:ui-monospace,Consolas,monospace;font-size:28px;font-weight:800;
      letter-spacing:.22em;color:var(--pk-muted)}
  .df .dt{font-size:52px;font-weight:900;line-height:1.2;color:var(--pk-fg);margin-top:26px}
  .df .dd{font-size:25px;line-height:1.55;color:var(--pk-muted);margin-top:24px}
  .df.key{border-color:var(--pk-accent)}
  .df.key .dh{color:var(--pk-accent)}
  .df-badge{position:absolute;right:40px;top:40px;padding:10px 22px;
      border:2px solid var(--pk-accent);border-radius:999px;opacity:0;
      font-family:ui-monospace,Consolas,monospace;font-size:24px;font-weight:800;
      letter-spacing:.16em;color:var(--pk-accent)}
  .df-when{position:absolute;left:120px;top:700px;width:1680px;opacity:0;
      border-left:4px solid var(--pk-accent);padding-left:34px}
  .df-when .wl{font-size:30px;line-height:1.6;color:var(--pk-fg)}
  .df-when .wl b{color:var(--pk-accent);font-weight:800}

  /* ═══ 6 · 可逆性分级：能反悔的 / 不能反悔的 ═══ */
  .rv{position:absolute;left:120px;top:340px;width:800px;height:416px;opacity:0;
      border:2px solid var(--pk-line);background:var(--pk-panel);padding:38px 42px}
  .rv .rh{display:flex;align-items:baseline;gap:20px}
  .rv .rh .t{font-family:ui-monospace,Consolas,monospace;font-size:28px;font-weight:800;
      letter-spacing:.20em;color:var(--pk-muted)}
  .rv .rh .sp{margin-left:auto;font-size:30px;font-weight:800;color:var(--pk-muted)}
  .rv .ri{font-size:32px;font-weight:700;line-height:1.3;color:var(--pk-fg);margin-top:26px}
  .rv .rn{font-size:22px;line-height:1.5;color:var(--pk-muted);margin-top:5px}
  .rv.key{border-color:var(--pk-accent)}
  .rv.key .rh .t{color:var(--pk-accent)}
  .rv.key .rh .sp{color:var(--pk-accent)}

</style>
</head>
<body>
<div id="stage">

  <div class="eyebrow" id="eyebrow">THE SECOND ORDER</div>
  <div class="h1" id="h1" data-fit-max="76" data-fit-min="44">一阶的结果好，不代表二阶也是</div>
  <div class="so-spine" id="sospine"></div>
  <div class="so-bd">
  <div class="so" id="sor0" style="top:376px">
    <div class="dot" id="sod0"></div>
    <div class="ord" id="soord0">一阶</div>
    <div class="now" id="sonow0" data-fit-max="34" data-fit-min="22">补贴一上，单量立刻涨 40%</div>
    <div class="arw" id="soarw0"></div>
    <div class="nxt" id="sonxt0" data-fit-max="30" data-fit-min="20">补贴一停，单量掉回原点</div>
  </div>

  <div class="so" id="sor1" style="top:544px">
    <div class="dot" id="sod1"></div>
    <div class="ord" id="soord1">二阶</div>
    <div class="now" id="sonow1" data-fit-max="34" data-fit-min="22">商家开始只做补贴品</div>
    <div class="arw" id="soarw1"></div>
    <div class="nxt" id="sonxt1" data-fit-max="30" data-fit-min="20">供给结构被改掉了</div>
  </div>

  <div class="so" id="sor2" style="top:712px">
    <div class="dot" id="sod2"></div>
    <div class="ord" id="soord2">三阶</div>
    <div class="now" id="sonow2" data-fit-max="34" data-fit-min="22">价格战谁都赚不到</div>
    <div class="arw" id="soarw2"></div>
    <div class="nxt" id="sonxt2" data-fit-max="30" data-fit-min="20">退出成本比进场成本高</div>
  </div>
</div>
  <div class="footline" id="footline"></div>
  <div class="foot" id="footbox"><span id="foot">大家都在看一阶，所以谁都不看二阶。</span><b>没人看的那一阶，就是你的机会。</b></div>

</div>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  var tl = B.tl();
  /* 规格包：先定风格，再建任何元素。
     画面素材的配色**不跟着包走**——那是"底片"，用户自己的东西不能被模板改色；
     跟着包走的只有 UI 层（字色、强调色、描边、圆角、曲线）。这个边界必须守住。 */
  B.pack(v.pack);
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  function q(s) { return document.querySelector(s); }
  /* 素材位接真视频：留空就继续用 CSS 画面 */
  function live(n, src) {
    if (!src) return;
    var s = document.getElementById('s' + n), e = document.getElementById('v' + n);
    if (!s || !e) return;
    s.classList.add('live'); e.src = src;
    e.play().catch(function () {});
  }
  /* 景别缓推：v1/v3 里画面始终在极慢地动，这是「像镜头」的关键 */
  function push(n, at, dur, from, to, ease) {
    var s = q('#s' + n + ' .sky'), g = q('#s' + n + ' .glow'), r = q('#s' + n + ' .r2');
    if (s) tl.fromTo(s, { scale: from, y: '0%' },
      { scale: to, y: '-2%', duration: dur, ease: ease || 'none' }, at);
    if (g) tl.fromTo(g, { xPercent: -4, opacity: .8 },
      { xPercent: 5, opacity: 1, duration: dur, ease: 'none' }, at);
    if (r) tl.fromTo(r, { xPercent: 0 },
      { xPercent: -2.5, duration: dur, ease: 'none' }, at);
  }
  /* clip-path 形状插值。
     两个坑都在这里踩过：
       1. GSAP 各版本对 clipPath 字符串补间的处理不一致，所以不直接补间它，
          改成补间一个 {t:0→1} 的代理对象，onUpdate 里自己算 8 个点；
       2. **from 必须是编译期常量，不能从元素当前状态读。**
          settle 会把时间轴来回扫；一旦回退越过一个已完成的补间，
          GSAP 会把它按 ratio 0 重渲——onUpdate 拿到的就是起点，
          形状会「弹回矩形」。写成常量后，形状是 t 的纯函数，
          停在任何一帧算出来都一样。
     相邻两段的 from 必须等于上一段的 to，这条由 Python 侧保证。 */
  function polyStr(pts) {
    return 'polygon(' + pts.map(function (p) {
      return p[0].toFixed(2) + '% ' + p[1].toFixed(2) + '%'; }).join(',') + ')';
  }
  function morph(el, from, to, at, dur, ease) {
    if (!el || !to || !from || from.length !== to.length) return;
    var st = { t: 0 };
    tl.to(st, { t: 1, duration: dur == null ? .7 : dur, ease: ease || 'power2.inOut',
      onUpdate: function () {
        el.style.clipPath = polyStr(from.map(function (p, i) {
          return [p[0] + (to[i][0] - p[0]) * st.t,
                  p[1] + (to[i][1] - p[1]) * st.t];
        }));
      } }, at);
  }
  set('eyebrow', v.eyebrow); set('h1', v.title); set('foot', v.foot);

  tl.fromTo('#eyebrow', { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: .4 }, 0);
  tl.fromTo('#h1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .08);
  tl.fromTo('#sospine', { height: 0 }, { height: 400, duration: .8, ease: 'power2.inOut' }, .3);
  for (var i = 0; i < 3; i++) {
    var at = .44 + i * .58;
    tl.fromTo('#sor' + i, { opacity: 0, x: -22 },
      { opacity: 1, x: 0, duration: .44, ease: 'power2.out' }, at);
    tl.fromTo('#sod' + i, { opacity: 0, scale: .3 },
      { opacity: 1, scale: 1, duration: .32, ease: 'back.out(2.2)' }, at + .04);
    tl.fromTo('#soarw' + i, { opacity: 0, x: -10 },
      { opacity: 1, x: 0, duration: .3 }, at + .26);
    tl.fromTo('#sonxt' + i, { opacity: 0, x: 16 },
      { opacity: 1, x: 0, duration: .42, ease: 'power2.out' }, at + .3);
  }
  tl.fromTo('#footline', { width: 0 }, { width: 420, duration: .5, ease: 'power2.out' }, 2.6);
  tl.fromTo('#footbox', { opacity: 0 }, { opacity: 1, duration: .5 }, 2.74);

  B.hold(tl, 3.9, .5);
  B.fitAll();

})();
</script>
