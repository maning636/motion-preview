<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "REVENUE / 月度账"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "把收入拆开看才不慌"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：万元"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#FFD429"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>环形仪表 · 把收入拆开看才不慌</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{display:flex;align-items:stretch;gap:64px}
  .dial{flex:0 0 620px;position:relative;height:auto;display:flex;
        align-items:center;justify-content:center}
  .dial svg{position:absolute;inset:0;width:100%;height:100%}
  /* 轨道和进度必须两种颜色。早先都是 #0F0F0F，on-ink 底上轨道直接隐形、
     纸底上两段黑弧连成一片，看不出进度到哪——等于画了条没意义的弧。 */
  .dial .trk{fill:none;stroke:var(--ink);stroke-width:26;opacity:.16}
  .dial .prg{fill:none;stroke:var(--accent);stroke-width:26;stroke-linecap:butt}
  #stage.on-ink .dial .trk{stroke:var(--paper);opacity:.22}
  .dial .mid{position:relative;z-index:2;text-align:center}
  .dial .pv{font-family:var(--mono);font-weight:700;font-size:132px;line-height:.86;
        letter-spacing:-.06em;font-variant-numeric:tabular-nums}
  .dial .pk{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.14em;
        margin-top:14px;opacity:.8}
  .legend{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:14px}
  /* color:var(--ink) 不能省：#stage.on-ink 把整台文字设成纸色，
     .lg 只给 background:var(--white) 不给 color 时，纸色 #FFF6E5 印在
     #FFFFFF 上是 1.07:1 —— 整条图例的数字和标签全部隐形。 */
  .lg{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:18px;
        border:var(--bw) solid var(--ink);
        border-radius:4px;background:var(--white);color:var(--ink);padding:0 24px;
        box-shadow:6px 6px 0 var(--ink)}
  /* 图例行均分高度：原来每行只有 50px、五行 280px，右侧上下各空两百多像素，
     版面上半张图是黑的。 */
  .lg .dot{width:20px;height:20px;flex:0 0 auto;border:var(--bw) solid var(--ink)}
  .lg .k{font-size:22px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lg .track{flex:1 1 auto;height:16px;min-width:60px;position:relative;overflow:hidden;
        border:var(--bw) solid var(--ink);background:var(--paper)}
  /* 填充恒为实色（on-ink 时反过来用纸色），不跟色标取同一个值。
     跟色标取同一个值时，轮转到 var(--white) 的那一行就成了白条印在米色底槽上，
     对比度 1.07:1——而它恰好常常是数值最大的那一行：
     blk-radial-ai-toolbox 里「查竞品资料 6.0」是全表最大，条子却是空的。 */
  .lg .track i{position:absolute;left:0;top:0;bottom:0;width:0;display:block;
        background:var(--ink)}
  #stage.on-ink .lg .track i{background:var(--paper)}
  .lg .v{font-family:var(--mono);font-weight:700;font-size:34px;letter-spacing:-.03em;
        font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
</style>
</head>
<body>
<div id="stage" class="blk-noise on-ink">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">REVENUE / 月度账</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">把收入拆开看才不慌</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：万元</div></div>
  <div class="body">
    <div class="dial">
      <svg viewBox="0 0 400 400" aria-hidden="true">
        <circle class="trk" cx="200" cy="200" r="160" stroke-dasharray="670 1005"
          transform="rotate(150 200 200)"/>
        <circle class="prg" id="ring" cx="200" cy="200" r="160" stroke-dasharray="0 1005"
          transform="rotate(150 200 200)"/>
      </svg>
      <div class="mid">
        <div class="pv" id="pctv" data-fit-max="132" data-fit-min="60">0%</div>
        <div class="pk" id="pctk" data-fit-max="17" data-fit-min="12">万</div>
      </div>
    </div>
    <div class="legend" id="legend"><div class="lg" id="lg0"><span class="dot" style="background:var(--yellow)"></span><span class="k" id="k0" data-fit-max="24" data-fit-min="14">主业交付</span><span class="track"><i id="tb0"></i></span><span class="v" id="v0" data-fit-max="40" data-fit-min="22">3.2</span></div><div class="lg" id="lg1"><span class="dot" style="background:var(--blue)"></span><span class="k" id="k1" data-fit-max="24" data-fit-min="14">内容分成</span><span class="track"><i id="tb1"></i></span><span class="v" id="v1" data-fit-max="40" data-fit-min="22">1.4</span></div><div class="lg" id="lg2"><span class="dot" style="background:var(--green)"></span><span class="k" id="k2" data-fit-max="24" data-fit-min="14">咨询顾问</span><span class="track"><i id="tb2"></i></span><span class="v" id="v2" data-fit-max="40" data-fit-min="22">2.1</span></div><div class="lg" id="lg3"><span class="dot" style="background:var(--pink)"></span><span class="k" id="k3" data-fit-max="24" data-fit-min="14">培训场次</span><span class="track"><i id="tb3"></i></span><span class="v" id="v3" data-fit-max="40" data-fit-min="22">0.8</span></div><div class="lg" id="lg4"><span class="dot" style="background:var(--orange)"></span><span class="k" id="k4" data-fit-max="24" data-fit-min="14">杂项</span><span class="track"><i id="tb4"></i></span><span class="v" id="v4" data-fit-max="40" data-fit-min="22">0.3</span></div></div>
  </div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2", "k3", "v3", "k4", "v4"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  document.querySelectorAll('.lg').forEach(function (l, i) {
    B.in.slideX(tl, l, 0.3 + i * 0.11, { from: 40, d: 0.62 * 0.8 });
  });
  
  /* 圆周 CIRC=1005，可见弧 240° = 670。
     dasharray 的 [实线, 间隔] 是**循环**的：间隔必须 ≥ 圆周减实线，
     否则第二段实线会从 CIRC-间隔 处再画一段，弧就断成两截（早先就是这么废的）。
     所以 gap 固定给 1005，实线给 pct 比例下的弧长。 */
  var CIRC = 1005, SPAN = 670;
  var ring = document.getElementById('ring');
  tl.fromTo(ring, { strokeDasharray: '0 ' + CIRC },
      { strokeDasharray: (41.0 * SPAN / 100) + ' ' + CIRC, duration: 0.62,
        ease: 'power3.out' }, 0.2);
  B.countUp(tl, '#pctv', 41.0, 0.2, 0.62, { suffix: '%', decimals: 0 });
  document.getElementById('pctk').textContent = "主业交付";
  document.querySelectorAll('.lg .track i').forEach(function (e, i) {
    B.in.grow(tl, e, Math.max(4, [41, 18, 27, 10, 4][i]) + '%', 0.34 + i * 0.11, { d: 0.62 * 0.8 });
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
