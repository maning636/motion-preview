<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "暗场标题", "default": "暗夜里的光"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#bg{ position:absolute; inset:0; background:#141412; }
.tt{ position:absolute; left:0; right:0; top:440px; text-align:center; font-size:130px; letter-spacing:10px; white-space:nowrap; }
#dim{ color:#f5f5f3; opacity:.07; }
#bri{ color:#f5f5f3; -webkit-mask-image:radial-gradient(circle 1px at -999px 540px, #000 60%, transparent 100%);
  mask-image:radial-gradient(circle 1px at -999px 540px, #000 60%, transparent 100%); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.3" data-width="1920" data-height="1080">
<div id="bg"></div><div class="tt" id="dim"></div><div class="tt" id="bri"></div>
    </div>
    <script>
      const FB = {"title": "暗夜里的光", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#dim').textContent=v.title||'';$('#bri').textContent=v.title||'';
// 锥形光摆两个来回：x=960+560·sin(2πf/55)，亮版 radial mask 随光斑走
const spot={t:0};
tl.to(spot,{t:4*Math.PI,duration:F(110),ease:'none',onUpdate:()=>{
  const x=960+560*Math.sin(spot.t);
  const m='radial-gradient(circle 380px at '+x.toFixed(0)+'px 540px, rgba(0,0,0,.95) 55%, transparent 100%)';
  $('#bri').style.webkitMaskImage=m; $('#bri').style.maskImage=m;
}},0);
// f110-125 全亮定格：光斑半径扩到覆盖全屏
const rad={r:380};
tl.to(rad,{r:2200,duration:F(15),ease:'power3.out',onUpdate:()=>{
  const m='radial-gradient(circle '+rad.r.toFixed(0)+'px at 960px 540px, rgba(0,0,0,.95) 55%, transparent 100%)';
  $('#bri').style.webkitMaskImage=m; $('#bri').style.maskImage=m;
}},F(110));
tl.to({},{duration:F(35)},F(125)); // 真静止

      window.__timelines.main = tl;
    </script>
  </body>
</html>
