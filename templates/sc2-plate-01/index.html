<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "vol", "type": "string", "label": "页眉左（卷/栏目）", "default": "VOL.15 · 视觉动效库"}, {"id": "pageno", "type": "string", "label": "页眉右（页码）", "default": "P.387 / 400"}, {"id": "kicker", "type": "string", "label": "堆上方标签", "default": "CARD STACK · 卡堆翻览"}, {"id": "cards", "type": "string", "label": "卡片（标题|说明，分号分隔 3 条）", "default": "选题库|先囤 100 个题，再谈日更;模板库|重复的结构，只做一次;素材库|用的时候，它得在手边"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #F6F5EF; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #141414;
        background-image: linear-gradient(rgba(20,20,20,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20,20,20,.045) 1px, transparent 1px);
        background-size: 36px 36px; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      /* 顶部细线页眉 */
      .cs-head{ position: absolute; left: 90px; right: 90px; top: 48px; height: 44px; z-index: 6; }
      .cs-head .rule{ position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #141414;
        transform: scaleX(0); transform-origin: 0 50%; }
      .cs-head .l{ position: absolute; left: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #141414; }
      .cs-head .r{ position: absolute; right: 0; top: 12px; font-size: 19px; letter-spacing: .22em; color: #9A9A92; }
      /* 堆上方标签 */
      .cs-kicker{ position: absolute; left: 50%; top: 104px; transform: translateX(-50%); z-index: 6;
        display: inline-block; border: 2px solid #141414; padding: 10px 24px; font-size: 20px;
        letter-spacing: .22em; background: var(--ac, #00FF00); box-shadow: 6px 6px 0 #141414; color: #141414; }
      /* 卡堆舞台 */
      .cs-stage{ position: absolute; left: 50%; top: 505px; width: 0; height: 0; z-index: 4; }
      .cs-card{ position: absolute; left: -230px; top: -290px; width: 460px; height: 580px;
        background: #fff; border: 3px solid #141414; box-shadow: 14px 14px 0 #141414;
        padding: 40px 40px 36px; display: flex; flex-direction: column; opacity: 0; }
      .cs-card .stripe{ position: absolute; left: 0; top: 0; right: 0; height: 12px; background: #141414; }
      .cs-card .dot{ position: absolute; right: 26px; top: 26px; width: 22px; height: 22px; background: var(--ac, #00FF00);
        border: 2px solid #141414; }
      .cs-card .no{ margin-top: 30px; font-size: 20px; letter-spacing: .2em; color: #9A9A92; }
      .cs-card .t{ margin-top: 26px; font-size: 58px; font-weight: 900; line-height: 1.2; }
      .cs-card .rule2{ margin-top: 30px; width: 72px; height: 6px; background: var(--ac, #00FF00); }
      .cs-card .d{ margin-top: 26px; font-family: 'MiSans SemiBold', sans-serif; font-size: 25px;
        line-height: 1.65; color: #55554E; }
      /* 底部荧光绿署名条 */
      .cs-foot{ position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: var(--ac, #00FF00);
        z-index: 6; display: flex; align-items: center; justify-content: space-between; padding: 0 90px;
        transform: translateY(60px); }
      .cs-foot .f1{ font-size: 22px; font-weight: 900; letter-spacing: .12em; color: #141414; }
      .cs-foot .f2{ font-size: 18px; letter-spacing: .26em; color: #141414; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="cs-head">
        <div class="rule" id="rule"></div>
        <div class="l mono" id="vol"></div>
        <div class="r mono" id="pageno"></div>
      </div>
      <div class="cs-kicker mono" id="kicker"></div>
      <div class="cs-stage" id="stage"></div>
      <div class="cs-foot" id="foot">
        <div class="f1">@老马AI研习社</div>
        <div class="f2 mono">MOTION LIBRARY · CARD STACK</div>
      </div>
    </div>
    <script>
      const fallback = {"vol": "VOL.15 · 视觉动效库", "pageno": "P.387 / 400", "kicker": "CARD STACK · 卡堆翻览", "cards": "选题库|先囤 100 个题，再谈日更;模板库|重复的结构，只做一次;素材库|用的时候，它得在手边", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("vol").textContent = V.vol;
      $("pageno").textContent = V.pageno;
      $("kicker").textContent = V.kicker;
      // 生成 3 张卡
      const items = String(V.cards).split(";").map(s => s.trim()).filter(Boolean).slice(0, 3);
      while (items.length < 3) items.push("卡片 " + (items.length + 1) + "|说明文字");
      const cards = items.map((it, i) => {
        const [title, desc] = it.split("|").map(s => (s || "").trim());
        const el = document.createElement("div");
        el.className = "cs-card";
        const stripe = document.createElement("div"); stripe.className = "stripe";
        const dot = document.createElement("div"); dot.className = "dot";
        const no = document.createElement("div"); no.className = "no mono"; no.textContent = "0" + (i + 1) + " / 03";
        const t = document.createElement("div"); t.className = "t"; t.textContent = title;
        const r2 = document.createElement("div"); r2.className = "rule2";
        const d = document.createElement("div"); d.className = "d"; d.textContent = desc || "";
        el.appendChild(stripe); el.appendChild(dot); el.appendChild(no); el.appendChild(t); el.appendChild(r2); el.appendChild(d);
        $("stage").appendChild(el);
        return el;
      });
      // 堆内三个位置：0=顶
      const POS = [
        { x: 0, y: 0, rotate: -2.5, z: 13 },
        { x: 16, y: 16, rotate: 0.5, z: 12 },
        { x: 32, y: 32, rotate: 3, z: 11 }
      ];
      const FRONT = { x: -6, y: -20, rotate: 0, scale: 1.14, z: 20 };
      let order = [0, 1, 2]; // 卡 index，0 位为堆顶
      cards.forEach((el, i) => { const p = POS[i]; gsap.set(el, { x: p.x, y: p.y, rotate: p.rotate, zIndex: p.z }); });
      // 页眉
      tl.to("#rule", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(["#vol", "#pageno"], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.08 }, 0.25);
      tl.fromTo("#kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, 0.4);
      // 三卡从下方弹入叠成一摞（0.71s 内落位，之后停稳 1s 再开始循环）
      cards.forEach((el, i) => {
        const p = POS[i];
        tl.fromTo(el, { opacity: 0, y: p.y + 420, rotate: p.rotate - 6 },
          { opacity: 1, x: p.x, y: p.y, rotate: p.rotate, duration: 0.42, ease: "back.out(1.4)" }, 0.15 + i * 0.07);
      });
      // 底部署名条
      tl.to("#foot", { y: 0, duration: 0.5, ease: "expo.out" }, 0.9);
      tl.fromTo([".cs-foot .f1", ".cs-foot .f2"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.08 }, 1.15);
      // 循环翻览 3 张：快速抽出(0.34s 弧线) → 台前完全停稳 1.0s（无任何附加动作）→ 压回堆底(0.25s)
      // 压回与下一张抽出并行，不占循环节距；第 3 张不压回、台前定格到片尾
      const S = 1.71, M = 0.34, HOLD = 1.0, P = 0.25;
      for (let c = 0; c < 3; c++) {
        const t = S + c * (M + HOLD);
        const topIdx = order[0];
        const top = cards[topIdx];
        // 沿弧线抽到台前
        tl.to(top, { x: -440, y: -190, rotate: -9, scale: 1.04, duration: 0.13, ease: "power2.in" }, t);
        tl.set(top, { zIndex: FRONT.z }, t + 0.13);
        tl.to(top, { x: FRONT.x, y: FRONT.y, rotate: 0, scale: FRONT.scale, duration: 0.21, ease: "expo.out" }, t + 0.13);
        // 台前停稳 HOLD 秒后再压回堆底，其余卡同步上移一位；末张不压回、台前定格到片尾（保证 ≥1.4s 无遮挡可读窗口）
        const tp = t + M + HOLD;
        if (c < 2) {
          tl.set(top, { zIndex: POS[2].z }, tp);
          tl.to(top, { x: POS[2].x, y: POS[2].y, rotate: POS[2].rotate, scale: 1, duration: P, ease: "power3.inOut" }, tp);
          const nxt = [order[1], order[2]];
          nxt.forEach((ci, k) => {
            const p = POS[k];
            tl.to(cards[ci], { x: p.x, y: p.y, rotate: p.rotate, duration: P, ease: "power2.inOut" }, tp);
            tl.set(cards[ci], { zIndex: p.z }, tp);
          });
          order.push(order.shift());
        }
      }
      // 时间轴补满到片尾，防渲染器 static-frame dedup 复用坏帧
      tl.set("#root", {}, 5.99);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
