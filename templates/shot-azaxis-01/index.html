<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "图表标题", "default": "周活跃用户"}, {"id": "valueLabel", "type": "string", "label": "真值标签", "default": "41.2万 · +128%"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#card{ position:absolute; left:300px; top:180px; width:1320px; height:760px; border-radius:22px;
  background:#14141C; border:1px solid rgba(255,255,255,.10); padding:40px 46px; }
#ct{ font-size:44px; color:var(--fg); }
#vlab{ position:absolute; left:1290px; top:120px; font-size:38px; color:#061106; background:var(--accent);
  border-radius:12px; padding:10px 22px; opacity:0; font-family:'MiSans SemiBold',sans-serif; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
<div id="card"><div id="ct"></div></div>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0">
  <g id="gridOld"><line x1="380" y1="880" x2="1560" y2="880" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/><line x1="380" y1="725" x2="1560" y2="725" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/><line x1="380" y1="570" x2="1560" y2="570" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/><line x1="380" y1="415" x2="1560" y2="415" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/><line x1="380" y1="260" x2="1560" y2="260" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/></g><g id="gridNew" opacity="0"><line class="gn" x1="380" y1="802" x2="1560" y2="802" stroke="rgba(255,255,255,.10)" stroke-width="1"/><line class="gn" x1="380" y1="647" x2="1560" y2="647" stroke="rgba(255,255,255,.10)" stroke-width="1"/><line class="gn" x1="380" y1="492" x2="1560" y2="492" stroke="rgba(255,255,255,.10)" stroke-width="1"/><line class="gn" x1="380" y1="337" x2="1560" y2="337" stroke="rgba(255,255,255,.10)" stroke-width="1"/></g>
  <g id="labOld"><text class="lo" x="340" y="888" fill="rgba(255,255,255,.5)" font-size="24" text-anchor="end">0</text><text class="lo" x="340" y="733" fill="rgba(255,255,255,.5)" font-size="24" text-anchor="end">10万</text><text class="lo" x="340" y="578" fill="rgba(255,255,255,.5)" font-size="24" text-anchor="end">20万</text><text class="lo" x="340" y="423" fill="rgba(255,255,255,.5)" font-size="24" text-anchor="end">30万</text><text class="lo" x="340" y="268" fill="rgba(255,255,255,.5)" font-size="24" text-anchor="end">40万</text></g><g id="labNew"><text class="ln" x="340" y="888" fill="rgba(255,255,255,.5)" font-size="24" text-anchor="end" opacity="0">0</text><text class="ln" x="340" y="733" fill="rgba(255,255,255,.5)" font-size="24" text-anchor="end" opacity="0">50万</text><text class="ln" x="340" y="578" fill="rgba(255,255,255,.5)" font-size="24" text-anchor="end" opacity="0">100万</text><text class="ln" x="340" y="423" fill="rgba(255,255,255,.5)" font-size="24" text-anchor="end" opacity="0">150万</text><text class="ln" x="340" y="268" fill="rgba(255,255,255,.5)" font-size="24" text-anchor="end" opacity="0">200万</text></g>
  <g id="oldLineG">
    <polyline id="oldLine" points="420,850 560,810 700,768 840,742 980,700 1120,668 1260,612 1400,560" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="4"/>
  </g>
  <polyline id="burst" points="1400,560 1460,420 1500,150" fill="none" stroke="#00FF00" stroke-width="8" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
  <circle id="bdot" cx="1500" cy="150" r="12" fill="#00FF00" opacity="0"/>
  <polyline id="newLine" points="420,872 560,862 700,853 840,848 980,838 1120,833 1260,821 1400,812 1460,788 1500,748" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="4" opacity="0"/>
  <polyline id="newHot" points="1400,812 1460,788 1500,748" fill="none" stroke="#00FF00" stroke-width="8" opacity="0"/>
  <circle id="ndot" cx="1500" cy="748" r="12" fill="#00FF00" opacity="0"/>
</svg>
<div id="vlab"></div>
    </div>
    <script>
      const FB = {"title": "周活跃用户", "valueLabel": "41.2万 · +128%", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#ct').textContent=v.title||'';$('#vlab').textContent=v.valueLabel||'';
const A=v.accent||'#00FF00';
$('#burst').setAttribute('stroke',A);$('#bdot').setAttribute('fill',A);$('#newHot').setAttribute('stroke',A);$('#ndot').setAttribute('fill',A);
// 新值冲出画框 220px 插进标题区（16f 写入）
tl.to('#burst',{attr:{'stroke-dashoffset':0},duration:F(16),ease:'power2.out'},F(10));
tl.to('#bdot',{opacity:1,duration:F(4)},F(24));
// 停半拍 + 震 8px
tl.to('#card',{x:8,duration:F(2),yoyo:true,repeat:3},F(28));
tl.set('#card',{x:0},F(36));
// 轴重标三联动：旧刻度飞出 / 新刻度滑入 / 网格加密 / 旧线压扁成地平线
tl.to('#labOld text',{y:-26,opacity:0,duration:F(12),stagger:F(2),ease:'power2.in'},F(40));
tl.fromTo('#labNew text',{y:26},{y:0,opacity:1,duration:F(12),stagger:F(2),ease:'power2.out'},F(44));
tl.to('#gridNew',{opacity:1,duration:F(10)},F(46));
tl.to('#oldLineG',{scaleY:.18,transformOrigin:'0px 880px',duration:F(14),ease:'power2.inOut'},F(44));
// 爆表段淡出，新标尺下的完整线落位，真值标签弹出
tl.to(['#burst','#bdot'],{opacity:0,duration:F(8)},F(58));
tl.to(['#newLine','#newHot','#ndot'],{opacity:1,duration:F(8)},F(58));
tl.fromTo('#vlab',{opacity:0,scale:1.3},{opacity:1,scale:1,duration:F(10),ease:'back.out(2)'},F(66));
tl.to({},{duration:F(89)},F(76)); // 真静止

      window.__timelines.main = tl;
    </script>
  </body>
</html>
