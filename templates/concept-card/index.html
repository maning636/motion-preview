<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"label","type":"string","label":"标签","default":"概念解释"},{"id":"term","type":"string","label":"术语","default":"RLHF"},{"id":"definition","type":"string","label":"解释","default":"基于人类反馈的强化学习，让模型输出更符合人类偏好。"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

html[data-export-mode="mp4"] body, html[data-export-mode="mp4"] #root{ background: #12100E !important;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      *{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, transparent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      body{ font-family: 'MEBHeiHeiTi', sans-serif; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100E); color: var(--foreground);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 96px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .card{ position: relative; width: 420px; padding: 30px 32px; background: rgba(18,16,14,0.82); border: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 16px; backdrop-filter: blur(18px);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .card::before{ content: ""; position: absolute; left: 0; top: 0; width: 6px; height: 100%; background: var(--accent); border-radius: 16px 0 0 16px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .label{ font-size: 14px; font-weight: 700; opacity: 0.6; letter-spacing: 0.1em; margin-bottom: 12px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .term{ margin: 0 0 14px; font-size: 32px; font-weight: 800; color: var(--accent); letter-spacing: -0.02em;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .definition{ margin: 0; font-size: 22px; font-weight: 500; line-height: 1.5; opacity: 0.85;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="card">
          <div class="label" id="label"></div>
          <h3 class="term" id="term"></h3>
          <p class="definition" id="definition"></p>
        </div>
      </section>
    </div>
    <script>
      const fallback = { label: "概念解释", term: "RLHF", definition: "基于人类反馈的强化学习，让模型输出更符合人类偏好。", accent: "#00FF00", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.dataset.exportMode = v.exportMode || "transparent";
      document.documentElement.style.setProperty("--accent", v.accent);
      document.documentElement.style.setProperty("--foreground", v.foreground);
      document.getElementById("label").textContent = v.label;
      document.getElementById("term").textContent = v.term;
      document.getElementById("definition").textContent = v.definition;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".card", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".label", { opacity: 0 }, { opacity: 0.6, duration: 0.3 }, 0.35);
      tl.fromTo(".term", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.45);
      tl.fromTo(".definition", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.65);
      tl.to(".scene", { opacity: 0, x: 40, duration: 0.4, ease: "power2.in" }, 4.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
