<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "heroTitle", "type": "string", "label": "主角卡标题", "default": "智能剪辑引擎"}, {"id": "heroText", "type": "string", "label": "主角卡描述", "default": "一条时间轴，自动完成粗剪"}, {"id": "kicker", "type": "string", "label": "顶部小字", "default": "PRODUCT TOUR"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

.stage{ position:absolute; inset:0; transform-style:preserve-3d; }
.page{ position:absolute; left:260px; top:120px; width:1400px; height:840px; border-radius:20px;
  background:#101016; border:1px solid rgba(255,255,255,.1); padding:44px;
  display:grid; grid-template-columns:repeat(4,1fr); gap:26px; transform-style:preserve-3d; }
.pcard{ border-radius:16px; background:#17171F; border:1px solid rgba(255,255,255,.1); padding:22px; }
.pcard .pt{ height:16px; width:58%; border-radius:8px; background:rgba(255,255,255,.26); margin-bottom:14px; }
.pcard .pl{ height:11px; border-radius:6px; background:rgba(255,255,255,.13); margin-bottom:9px; }
.pcard .pl.s{ width:64%; }
.pcard.hero{ background:#1B1B26; border:1px solid var(--accent); position:relative; }
.pcard.hero .pt{ background:var(--accent); opacity:.9; }
.hero-copy{ position:absolute; left:22px; right:22px; bottom:18px; }
.hero-copy h3{ font-size:30px; color:var(--fg); margin-bottom:8px; }
.hero-copy p{ font-family:'MiSans SemiBold'; font-size:15px; color:rgba(255,255,255,.55); line-height:1.5; }
.spot{ position:absolute; width:900px; height:900px; left:0; top:0; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(255,255,255,.28) 0%, rgba(255,255,255,.10) 34%, transparent 68%);
  mix-blend-mode:screen; transform:translate(-50%,-50%); }
.vig{ position:absolute; inset:0; pointer-events:none; opacity:.16;
  box-shadow:inset 0 0 320px 140px rgba(0,0,0,.95); }
.kick{ position:absolute; left:0; right:0; top:56px; text-align:center; font-family:'MiSans SemiBold';
  font-size:24px; letter-spacing:.5em; color:rgba(255,255,255,.4); }
.beam{ position:absolute; inset:-8px; width:calc(100% + 16px); height:calc(100% + 16px); pointer-events:none; overflow:visible; }
#root{ perspective:1200px; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
<div class="kick" id="k"></div>
<div class="stage" id="stage">
  <div class="page" id="page"></div>
</div>
<div class="spot" id="spot"></div>
<div class="vig" id="vig"></div>
    </div>
    <script>
      const FB = {"heroTitle": "智能剪辑引擎", "heroText": "一条时间轴，自动完成粗剪", "kicker": "PRODUCT TOUR", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#k').textContent=v.kicker||'';
const page=$('#page');
const cards=[];
for(let i=0;i<8;i++){
  const c=document.createElement('div');
  if(i===3){
    c.className='pcard hero';c.id='hero';
    c.innerHTML='<div class="pt"></div><div class="pl"></div><div class="pl s"></div>'
      +'<div class="hero-copy"><h3>'+(v.heroTitle||'')+'</h3><p>'+(v.heroText||'')+'</p></div>'
      +'<svg class="beam" id="beam" viewBox="0 0 340 240" preserveAspectRatio="none">'
      +'<rect id="br1" x="6" y="6" width="328" height="228" rx="20" fill="none" stroke="'+(v.accent||'#00FF00')+'" stroke-width="5" stroke-dasharray="0.14 1" pathLength="1" opacity="0"/>'
      +'<rect id="br2" x="6" y="6" width="328" height="228" rx="20" fill="none" stroke="'+(v.accent||'#00FF00')+'" stroke-width="2.5" stroke-dasharray="0.14 1" pathLength="1" opacity="0"/>'
      +'</svg>';
  }else{
    c.className='pcard';
    c.innerHTML='<div class="pt"></div><div class="pl"></div><div class="pl s"></div>';
  }
  page.appendChild(c);cards.push(c);
}
const hero=$('#hero'),spot=$('#spot'),stage=$('#stage');
// 布局实测（page 未变换时）
const pr=page.getBoundingClientRect(), hr=hero.getBoundingClientRect();
const hx=hr.left+hr.width/2, hy=hr.top+hr.height/2;
// 聚光灯 4 个中间站 → 锁定卡心
const stations=[[hx-620,hy-280],[hx+420,hy-360],[hx-380,hy+300],[hx+260,hy+180],[hx,hy]];
tl.set(spot,{xPercent:-50,yPercent:-50,left:stations[0][0],top:stations[0][1],scale:1.4},0);
tl.fromTo('.kick',{opacity:0},{opacity:1,duration:F(8)},0);
tl.fromTo('.page',{opacity:0,y:30},{opacity:1,y:0,duration:F(12),ease:'power3.out'},F(2));
for(let s=1;s<stations.length;s++){
  const at=F(12+s*8);
  tl.to(spot,{left:stations[s][0],top:stations[s][1],scale:1.4-0.12*s,duration:F(8),ease:'power2.inOut'},at);
}
const tLock=F(12+4*8)+F(8);
tl.to(spot,{scale:.95,duration:F(5),ease:'power2.out'},tLock); // 收拢+脉冲
tl.to(spot,{scale:1.06,duration:F(3),ease:'power2.inOut'},tLock+F(5));
tl.to(spot,{scale:1,duration:F(3),ease:'power2.inOut'},tLock+F(8));
tl.to('.vig',{opacity:.42,duration:F(16),ease:'power2.inOut'},tLock-F(6));
// 相机推进：整页绕 hero 做侧斜特写
const tCam=tLock+F(11);
tl.to(stage,{rotationY:14,rotationX:4,scale:1.55,x:960-hx*1.0,y:540-hy*1.0,transformOrigin:hx+'px '+hy+'px',duration:F(16),ease:'power3.inOut'},tCam);
// 卡片弹起（过冲）→ 悬停 bob → 轮廓光束两圈 → 贴回
const tRise=tCam+F(18);
tl.to(hero,{z:110,y:-20,boxShadow:'0 60px 120px rgba(0,0,0,.6)',duration:F(10),ease:'back.out(1.6)'},tRise);
tl.to(hero,{y:-14,duration:F(13),ease:'sine.inOut',yoyo:true,repeat:3},tRise+F(10));
// 光束两圈：dashoffset 走 1→0，lap1 快亮、lap2 慢弱
tl.to('#br1',{opacity:1,duration:F(2)},tRise+F(6));
tl.fromTo('#br1',{strokeDashoffset:1},{strokeDashoffset:0,duration:F(14),ease:'power1.inOut'},tRise+F(6));
tl.to('#br2',{opacity:.62,duration:F(2)},tRise+F(22));
tl.fromTo('#br2',{strokeDashoffset:1},{strokeDashoffset:0,duration:F(20),ease:'power1.inOut'},tRise+F(22));
const tSeat=tRise+F(64);
tl.to(hero,{z:0,y:0,boxShadow:'0 10px 30px rgba(0,0,0,.35)',duration:F(18),ease:'power3.inOut'},tSeat);
tl.to(hero,{scale:.997,duration:F(3),ease:'power2.out'},tSeat+F(18));
tl.to(hero,{scale:1,duration:F(3),ease:'power2.inOut'},tSeat+F(21));
tl.to(['#br1','#br2'],{opacity:0,duration:F(6)},tSeat+F(10));
// 收尾：相机回正、光收敛
const tOut=tSeat+F(26);
tl.to(stage,{rotationY:0,rotationX:0,scale:1,x:0,y:0,duration:F(18),ease:'power3.inOut'},tOut);
tl.to(spot,{scale:1.5,opacity:0,duration:F(14),ease:'power2.inOut'},tOut);
tl.to('.vig',{opacity:.16,duration:F(14)},tOut);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
