<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"图表标题","default":"模型能力演进"},{"id":"subtitle","type":"string","label":"副标题","default":"多模型评分趋势对比"},{"id":"labels","type":"string","label":"X 轴标签（逗号分隔）","default":"2023,2024 Q1,2024 Q3,2025"},{"id":"series1Label","type":"string","label":"系列 1 名称","default":"GPT-4"},{"id":"series1Values","type":"string","label":"系列 1 数值","default":"65,78,85,91"},{"id":"series2Label","type":"string","label":"系列 2 名称","default":"Claude"},{"id":"series2Values","type":"string","label":"系列 2 数值","default":"60,72,80,87"},{"id":"series3Label","type":"string","label":"系列 3 名称","default":"Gemini"},{"id":"series3Values","type":"string","label":"系列 3 数值","default":"55,68,75,84"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title-area{ margin-bottom: 40px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 10px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 28px; font-weight: 400; opacity: 0.55; }
      .chart-area{ position: relative; width: 100%; height: 620px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-svg{ width: 100%; height: 100%; overflow: visible;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .axis-text{ fill: rgba(244,239,231,0.55); font-family: 'MEBHeiHeiTi', sans-serif; font-size: 18px; font-weight: 500; text-anchor: middle; }
      .axis-text-y{ text-anchor: end; dominant-baseline: middle;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .grid-line{ stroke: rgba(244,239,231,0.10); stroke-width: 1;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .line-path{ fill: none; stroke-linecap: round; stroke-linejoin: round;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .point{ fill: var(--bg); stroke-width: 3;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .legend{ position: absolute; top: 0; right: 0; display: flex; gap: 28px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .legend-item{ display: flex; align-items: center; gap: 10px; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 18px; font-weight: 500; }
      .legend-dot{ width: 14px; height: 14px; border-radius: 2px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title-area">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <div class="legend" id="legend"></div>
          <svg class="chart-svg" id="chart" viewBox="0 0 1696 620" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "模型能力演进", subtitle: "多模型评分趋势对比", labels: "2023,2024 Q1,2024 Q3,2025", series1Label: "GPT-4", series1Values: "65,78,85,91", series2Label: "Claude", series2Values: "60,72,80,87", series3Label: "Gemini", series3Values: "55,68,75,84", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      root.style.setProperty("--bg", v.background);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      const labels = String(v.labels).split(",").map(s => s.trim());
      const seriesList = [
        { label: v.series1Label, values: String(v.series1Values).split(",").map(Number), color: v.accent },
        { label: v.series2Label, values: String(v.series2Values).split(",").map(Number), color: "rgba(244,239,231,0.70)" },
        { label: v.series3Label, values: String(v.series3Values).split(",").map(Number), color: "rgba(244,239,231,0.35)" }
      ].filter(s => s.values.some(n => !isNaN(n)));
      const allValues = seriesList.flatMap(s => s.values);
      const maxValue = Math.max(...allValues) * 1.1 || 100;
      const svg = document.getElementById("chart");
      const chartW = 1696, chartH = 620, marginLeft = 70, marginRight = 40, marginTop = 60, marginBottom = 50;
      const plotW = chartW - marginLeft - marginRight, plotH = chartH - marginTop - marginBottom;
      const baselineY = marginTop + plotH;
      const xFor = i => marginLeft + (i / (labels.length - 1)) * plotW;
      const yFor = val => baselineY - (val / maxValue) * plotH;
      const gridCount = 5;
      for (let i = 0; i <= gridCount; i++) {
        const val = (maxValue / gridCount) * i, y = yFor(val);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", marginLeft); line.setAttribute("x2", marginLeft + plotW); line.setAttribute("y1", y); line.setAttribute("y2", y);
        line.setAttribute("class", "grid-line"); svg.appendChild(line);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", marginLeft - 14); text.setAttribute("y", y); text.setAttribute("class", "axis-text axis-text-y");
        text.textContent = Math.round(val); svg.appendChild(text);
      }
      labels.forEach((label, i) => {
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", xFor(i)); text.setAttribute("y", baselineY + 32); text.setAttribute("class", "axis-text");
        text.textContent = label; svg.appendChild(text);
      });
      const legend = document.getElementById("legend");
      seriesList.forEach((s, si) => {
        const item = document.createElement("div"); item.className = "legend-item";
        item.innerHTML = `<span class="legend-dot" style="background:${s.color}"></span>${s.label}`;
        legend.appendChild(item);
        const d = s.values.map((val, i) => `${i === 0 ? "M" : "L"} ${xFor(i)} ${yFor(val)}`).join(" ");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d); path.setAttribute("stroke", s.color); path.setAttribute("stroke-width", si === 0 ? 4 : 2);
        path.setAttribute("class", "line-path"); path.setAttribute("id", `line-${si}`); svg.appendChild(path);
        s.values.forEach((val, i) => {
          const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          c.setAttribute("cx", xFor(i)); c.setAttribute("cy", yFor(val)); c.setAttribute("r", 5);
          c.setAttribute("stroke", s.color); c.setAttribute("class", "point"); c.setAttribute("id", `point-${si}-${i}`);
          svg.appendChild(c);
        });
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 18 }, { opacity: 0.55, y: 0, duration: 0.4, ease: "power2.out" }, 0.3);
      tl.fromTo(".grid-line", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.04 }, 0.4);
      tl.fromTo(".axis-text", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.03 }, 0.5);
      seriesList.forEach((s, si) => {
        const path = document.getElementById(`line-${si}`);
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
        tl.to(path, { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, 0.7 + si * 0.15);
        s.values.forEach((_, i) => {
          tl.fromTo(`#point-${si}-${i}`, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" }, 1.2 + si * 0.15 + i * 0.08);
        });
      });
      document.querySelectorAll(".legend-item").forEach((item, i) => {
        tl.fromTo(item, { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 1.4 + i * 0.1);
      });
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
