<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "POSTMORTEM / 复盘"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "这次出错的账要算清"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：分钟"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#3D7BFF"}, {"id": "aN", "name": "左侧名", "type": "string", "label": "左侧 · 名称", "default": "原来的做法"}, {"id": "bN", "name": "右侧名", "type": "string", "label": "右侧 · 名称", "default": "换成这套"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>对撞对比 · 这次出错的账要算清</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{position:relative;padding:64px 0 26px}
  .side{flex:1 1 0;min-width:0;border:var(--bw) solid var(--ink);
        display:flex;flex-direction:column;overflow:hidden;background:var(--white);color:var(--ink)}
  /* A 的名字靠左、B 的名字靠右：中间的接缝必须留空给 VS。
     两边都靠左时菱形正好盖住右侧面板的名字，版图上只剩一个「程」字露在外面。 */
  #sideB .hd2{justify-content:flex-end}
  .side .hd2{flex:0 0 auto;padding:18px 30px;border-bottom:var(--bw) solid var(--ink);
        display:flex;align-items:center;justify-content:space-between;gap:16px}
  .side .hd2 .nm{font-weight:900;font-size:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side .rows{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .side .r{flex:1 1 0;display:flex;align-items:center;justify-content:space-between;gap:20px;
        padding:0 30px;border-bottom:var(--bw) solid var(--ink);min-height:0}
  .side .r .k{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side .r .v{font-family:var(--mono);font-weight:700;font-size:42px;letter-spacing:-.03em;
        font-variant-numeric:tabular-nums;white-space:nowrap}
  .side .r .mtr{width:190px;height:16px;border:var(--bw) solid var(--ink);position:relative;
        overflow:hidden;flex:0 0 auto}
  .side .r .mtr i{position:absolute;left:0;top:0;bottom:0;display:block;background:var(--ink)}
  .side .foot{flex:0 0 auto;padding:16px 30px;background:var(--ink);color:var(--paper);
        font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vs{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);z-index:5;
      width:112px;height:112px;background:var(--ink);color:var(--paper);
      display:flex;align-items:center;justify-content:center;
      font-family:var(--mono);font-weight:700;font-size:38px;
      clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
  /* 角标用近黑字：白字印粉底只有 2.83:1（palette_contrast.py 实算），
     在缩略图上完全看不出飘，等到大图上才发现角标发灰。 */
  .win{position:absolute;z-index:6;right:0;top:2px;background:var(--pink);color:var(--ink);
      border:var(--bw) solid var(--ink);box-shadow:5px 5px 0 var(--ink);
      font-weight:900;font-size:21px;padding:9px 18px;transform:rotate(7deg)}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">POSTMORTEM / 复盘</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">这次出错的账要算清</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：分钟</div></div>
  <div class="body">
    <div class="side" id="sideA" style="box-shadow:8px 8px 0 var(--ink);border-radius:4px 0 0 4px">
    <div class="hd2" style="background:var(--blue);color:var(--ink)">
      <span class="nm" id="aN" data-fit-max="36" data-fit-min="22">原来的做法</span></div>
    <div class="rows"><div class="r"><span class="k" id="a0" data-fit-max="21" data-fit-min="14">发现耗时</span><span class="v" id="av0" data-fit-max="38" data-fit-min="20">12</span></div><div class="r"><span class="k" id="a1" data-fit-max="21" data-fit-min="14">定位耗时</span><span class="v" id="av1" data-fit-max="38" data-fit-min="20">46</span></div><div class="r"><span class="k" id="a2" data-fit-max="21" data-fit-min="14">修复耗时</span><span class="v" id="av2" data-fit-max="38" data-fit-min="20">28</span></div><div class="r"><span class="k" id="a3" data-fit-max="21" data-fit-min="14">验证耗时</span><span class="v" id="av3" data-fit-max="38" data-fit-min="20">19</span></div><div class="r"><span class="k" id="a3" data-fit-max="21" data-fit-min="14">改善幅度</span><span class="mtr"><i id="ab3" style="width:24%"></i></span></div></div>
    <div class="foot">BASELINE · min</div></div>
    <div class="side" id="sideB" style="box-shadow:-8px 8px 0 var(--ink);border-radius:0 4px 4px 0">
    <div class="hd2" style="background:var(--green);color:var(--ink)">
      <span class="nm" id="bN" data-fit-max="36" data-fit-min="22">换成这套</span></div>
    <div class="rows"><div class="r"><span class="k" id="b0" data-fit-max="21" data-fit-min="14">发现耗时</span><span class="v" id="bv0">4.6</span></div><div class="r"><span class="k" id="b1" data-fit-max="21" data-fit-min="14">定位耗时</span><span class="v" id="bv1">17.5</span></div><div class="r"><span class="k" id="b2" data-fit-max="21" data-fit-min="14">修复耗时</span><span class="v" id="bv2">10.6</span></div><div class="r"><span class="k" id="b3" data-fit-max="21" data-fit-min="14">验证耗时</span><span class="v" id="bv3">7.2</span></div><div class="r"><span class="k" id="b3" data-fit-max="21" data-fit-min="14">改善幅度</span><span class="mtr"><i id="bb3" style="width:84%"></i></span></div></div>
    <div class="foot">AFTER · 同样口径</div></div>
    <div class="vs" id="vs" data-fit-max="42" data-fit-min="26">VS</div>
    <div class="win" id="win">推荐</div>
  </div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "aN", "bN", "k0", "v0", "k1", "v1", "k2", "v2", "k3", "v3", "k4", "v4"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  tl.from('#sideA', { x: -70, opacity: 0, duration: 0.62, ease: 'power3.out' }, 0.05);
  tl.from('#sideB', { x: 70, opacity: 0, duration: 0.62, ease: 'power3.out' }, 0.05);
  B.in.stamp(tl, '#vs', 0.32, { d: 0.62 });
  document.querySelectorAll('#sideA .r').forEach(function (r, i) {
    B.in.slideX(tl, r, 0.44 + i * 0.11, { from: -40, d: 0.62 * 0.7 });
  });
  document.querySelectorAll('#sideB .r').forEach(function (r, i) {
    B.in.slideX(tl, r, 0.44 + i * 0.11, { from: 40, d: 0.62 * 0.7 });
  });
  B.in.grow(tl, '#ab3', '24%', 0.9, { d: 0.62 });
  B.in.grow(tl, '#bb3', '84%', 0.9, { d: 0.62 });
  B.in.stamp(tl, '#win', 0.92, { d: 0.62, rot: 7 });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
