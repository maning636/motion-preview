<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "影响效率的 Top 3 因素"}, {"id": "rank1", "type": "string", "label": "第一名", "default": "资料分散"}, {"id": "value1", "type": "number", "label": "第一名数值", "default": 48}, {"id": "rank2", "type": "string", "label": "第二名", "default": "缺少模板"}, {"id": "value2", "type": "number", "label": "第二名数值", "default": 31}, {"id": "rank3", "type": "string", "label": "第三名", "default": "反复改稿"}, {"id": "value3", "type": "number", "label": "第三名数值", "default": 21}, {"id": "unit", "type": "string", "label": "单位", "default": "%"}, {"id": "caption", "type": "string", "label": "说明", "default": "真正拖慢生产的，往往不是创意，而是重复整理和重复决策。"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #F5F0E6); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #F5F0E6); color: var(--foreground, #1D1D20);
  font-family:'Noto Sans SC','PingFang SC',sans-serif; }
.scene{ position:absolute; inset:0; padding:64px 80px; }
.card{ background:#FFFDF7; border:3px solid #1D1D20; border-radius:16px; box-shadow:6px 6px 0 #2A292B; }
.tape{ position:absolute; width:120px; height:32px; background:rgba(185,232,51,.6); border:2px solid #1D1D20;
  border-radius:4px; transform:rotate(-5deg); z-index:5; }
.tape.pink{ background:rgba(241,59,136,.35); transform:rotate(4deg); }
.tape.blue{ background:rgba(62,123,242,.3); transform:rotate(-3deg); }
.chip{ display:inline-flex; align-items:center; gap:8px; padding:6px 14px; background:#FFFDF7; border:3px solid #1D1D20;
  border-radius:999px; font-family:'Fredoka','Arial Rounded MT Bold',sans-serif; font-weight:700; font-size:18px;
  letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; box-shadow:4px 4px 0 #2A292B; }
.chip.lime{ background:#B9E833; } .chip.blue{ background:#3E7BF2; color:#FFFDF7; }
.chip.pink{ background:#F13B88; color:#FFFDF7; } .chip.orange{ background:#FF9F1C; }
.num{ font-family:'Fredoka','Arial Rounded MT Bold',sans-serif; font-weight:700; }
.mono{ font-family:'IBM Plex Mono','JetBrains Mono',monospace; font-weight:700; }
.dashline{ border:none; border-top:3px dashed #1D1D20; }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="6" data-track-index="1">

        <div class="card" style="position:absolute;left:60px;top:56px;padding:16px 28px;">
          <span class="chip pink">TOP</span>
          <h1 id="title" class="num" style="display:inline-block;margin:0 0 0 16px;font-size:40px;vertical-align:middle;"></h1>
        </div>
        <div id="rows" style="position:absolute;left:100px;right:100px;top:210px;display:flex;flex-direction:column;gap:30px;"></div>
        <style>
          .rrow{ display:flex; align-items:center; gap:28px; padding:22px 30px; background:#FFFDF7; border:3px solid #1D1D20;
            border-radius:16px; box-shadow:6px 6px 0 #2A292B; opacity:0; transform:translateX(-80px) rotate(-1deg); }
          .rrow.first{ background:#B9E833; }
          .rk{ width:80px; height:80px; flex:none; display:flex; align-items:center; justify-content:center;
            border:3px solid #1D1D20; border-radius:50%; background:#FFFDF7; font-size:38px; box-shadow:3px 3px 0 #2A292B; }
          .rbody{ flex:1; }
          .rname{ display:flex; justify-content:space-between; font-size:28px; font-weight:900; margin-bottom:10px; }
          .rtrack{ height:26px; border:3px solid #1D1D20; border-radius:8px; background:#F5F0E6; overflow:hidden; }
          .rbar{ height:100%; background:#3E7BF2; border-right:3px solid #1D1D20; transform:scaleX(0); transform-origin:left; }
          .rrow.first .rbar{ background:#3E7BF2; }
        </style>

      </section>
    </div>
    <script>
      const fallback = {"title": "影响效率的 Top 3 因素", "rank1": "资料分散", "value1": 48, "rank2": "缺少模板", "value2": 31, "rank3": "反复改稿", "value3": 21, "unit": "%", "caption": "真正拖慢生产的，往往不是创意，而是重复整理和重复决策。", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 6;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("title").textContent = v.title;
      const items = [[v.rank1, Number(v.value1)], [v.rank2, Number(v.value2)], [v.rank3, Number(v.value3)]].filter((x) => x[0]);
      const maxV = Math.max(...items.map((x) => x[1]), 1);
      items.forEach(([name, val], i) => {
        const row = document.createElement("div");
        row.className = "rrow" + (i === 0 ? " first" : "");
        row.innerHTML = `<span class="rk num">${i + 1}</span>
          <div class="rbody">
            <div class="rname"><span>${name}</span><span class="rv num">0</span></div>
            <div class="rtrack"><div class="rbar" data-w="${val / maxV}"></div></div>
          </div>`;
        $("rows").appendChild(row);
        row.dataset.val = val;
      });
      document.querySelectorAll(".rrow").forEach((row, i) => {
        tl.to(row, { opacity: 1, x: 0, rotate: 0, duration: 0.5, ease: "power3.out" }, 0.4 + i * 0.45);
        tl.to(row.querySelector(".rbar"), { scaleX: Number(row.querySelector(".rbar").dataset.w), duration: 0.9, ease: "power3.inOut" }, 0.6 + i * 0.45);
        countTo(row.querySelector(".rv"), row.dataset.val, 0.6 + i * 0.45, 0.9);
      });
      tl.to(".scene", { clipPath: "inset(0 100% 0 0)", duration: 0.5, ease: "power2.in" }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
