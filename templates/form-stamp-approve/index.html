<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "表单标题", "default": "项目立项批复单"}, {"id": "items", "type": "string", "label": "行项目（逗号分隔）", "default": "立项申请材料齐备,预算额度核定通过,实施方案合规,准予立项执行"}, {"id": "stamp", "type": "string", "label": "章文字", "default": "批准"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #F1EDE0; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #1D1D20; }
      .paper{ position: absolute; left: 460px; top: 100px; width: 1000px; height: 880px;
        background: #FFFDF7; border: 2px solid #1D1D20; padding: 52px 70px;
        box-shadow: 12px 12px 0 rgba(29,29,32,.10); }
      .p-no{ margin-bottom: 10px; font-size: 22px; color: #6B6560; letter-spacing: .08em; text-align: right; }
      .p-title{ font-size: 52px; font-weight: 900; letter-spacing: .06em; text-align: center; }
      .p-rule{ width: 460px; height: 8px; margin: 22px auto 40px; background: #C8392E; border-radius: 4px;
        transform-origin: left center; }
      .p-row{ display: flex; align-items: baseline; gap: 26px; padding: 19px 6px;
        border-bottom: 1.5px solid rgba(29,29,32,.22); font-size: 30px; font-weight: 700; }
      .p-row .n{ font-size: 22px; color: #6B6560; }
      .seal{ position: absolute; right: 64px; bottom: 64px; width: 300px; height: 300px;
        border: 9px solid #C8392E; border-radius: 50%; color: #C8392E;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
      .seal::before{ content: ""; position: absolute; inset: 12px; border: 3px solid #C8392E; border-radius: 50%; opacity: .85; }
      .seal .star{ font-size: 40px; line-height: 1; }
      .seal .txt{ font-size: 88px; font-weight: 900; letter-spacing: .1em; line-height: 1.05; }
      .seal .sub{ font-size: 22px; font-weight: 700; letter-spacing: .34em; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="paper" id="paper">
        <div class="p-no mono">No.2026-0814 · 批复联</div>
        <h1 class="p-title" id="title"></h1>
        <div class="p-rule" id="rule"></div>
        <div id="rows"></div>
        <div class="seal" id="seal"><span class="star">★</span><span class="txt" id="stampTxt"></span><span class="sub">审 核 专 用</span></div>
      </div>

    </div>
    <script>
      const fallback = {"title": "项目立项批复单", "items": "立项申请材料齐备,预算额度核定通过,实施方案合规,准予立项执行", "stamp": "批准", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      $("title").textContent = V.title;
      $("stampTxt").textContent = V.stamp;
      const items = split(V.items);
      const rowsEl = $("rows");
      items.forEach((it, i) => {
        const d = document.createElement("div");
        d.className = "p-row";
        d.innerHTML = `<span class="n mono">${String(i + 1).padStart(2, "0")}</span><span class="t"></span>`;
        d.querySelector(".t").textContent = it;
        rowsEl.appendChild(d);
      });
      tl.fromTo("#paper", { y: 48, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#title", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.45);
      tl.fromTo(".p-row", { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.28, stagger: 0.14, ease: "power2.out" }, 0.7);
      const tSeal = 0.7 + items.length * 0.14 + 0.3;
      tl.fromTo("#seal", { scale: 3.2, opacity: 0, rotation: -32 },
        { scale: 1, opacity: 1, rotation: -12, duration: 0.2, ease: "power4.in" }, tSeal);
      tl.to("#paper", { keyframes: [
        { x: -9, duration: 0.06 }, { x: 7, duration: 0.07 }, { x: -4, duration: 0.06 }, { x: 0, duration: 0.09 }
      ], ease: "none" }, tSeal + 0.18);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
