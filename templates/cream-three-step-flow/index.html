<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "把知识讲清楚的三步"}, {"id": "step1", "type": "string", "label": "步骤一", "default": "定义问题"}, {"id": "desc1", "type": "string", "label": "步骤一说明", "default": "先说它解决什么"}, {"id": "step2", "type": "string", "label": "步骤二", "default": "拆开机制"}, {"id": "desc2", "type": "string", "label": "步骤二说明", "default": "再讲为什么成立"}, {"id": "step3", "type": "string", "label": "步骤三", "default": "给出动作"}, {"id": "desc3", "type": "string", "label": "步骤三说明", "default": "最后落到怎么做"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #F5F0E6); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #F5F0E6); color: var(--foreground, #1D1D20);
  font-family:'Noto Sans SC','PingFang SC',sans-serif; }
.scene{ position:absolute; inset:0; padding:64px 80px; }
.card{ background:#FFFDF7; border:3px solid #1D1D20; border-radius:16px; box-shadow:6px 6px 0 #2A292B; }
.tape{ position:absolute; width:120px; height:32px; background:rgba(185,232,51,.6); border:2px solid #1D1D20;
  border-radius:4px; transform:rotate(-5deg); z-index:5; }
.tape.pink{ background:rgba(241,59,136,.35); transform:rotate(4deg); }
.tape.blue{ background:rgba(62,123,242,.3); transform:rotate(-3deg); }
.chip{ display:inline-flex; align-items:center; gap:8px; padding:6px 14px; background:#FFFDF7; border:3px solid #1D1D20;
  border-radius:999px; font-family:'Fredoka','Arial Rounded MT Bold',sans-serif; font-weight:700; font-size:18px;
  letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; box-shadow:4px 4px 0 #2A292B; }
.chip.lime{ background:#B9E833; } .chip.blue{ background:#3E7BF2; color:#FFFDF7; }
.chip.pink{ background:#F13B88; color:#FFFDF7; } .chip.orange{ background:#FF9F1C; }
.num{ font-family:'Fredoka','Arial Rounded MT Bold',sans-serif; font-weight:700; }
.mono{ font-family:'IBM Plex Mono','JetBrains Mono',monospace; font-weight:700; }
.dashline{ border:none; border-top:3px dashed #1D1D20; }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="6" data-track-index="1">

        <div class="card" style="position:absolute;left:60px;top:56px;padding:16px 28px;">
          <span class="chip blue">FLOW</span>
          <h1 id="title" class="num" style="display:inline-block;margin:0 0 0 16px;font-size:40px;vertical-align:middle;"></h1>
        </div>
        <div style="position:absolute;left:80px;right:80px;top:260px;display:flex;align-items:stretch;">
          <div class="step" style="flex:1;"><div class="scard card" style="height:100%;"><span class="snum num">1</span><h3 class="stitle num"></h3><p class="sdesc"></p></div></div>
          <div class="sarrow">→</div>
          <div class="step" style="flex:1;"><div class="scard card" style="height:100%;"><span class="snum num">2</span><h3 class="stitle num"></h3><p class="sdesc"></p></div></div>
          <div class="sarrow">→</div>
          <div class="step" style="flex:1;"><div class="scard card" style="height:100%;"><span class="snum num">3</span><h3 class="stitle num"></h3><p class="sdesc"></p></div></div>
        </div>
        <style>
          .scard{ padding:40px 34px; opacity:0; transform:translateY(50px) rotate(1.5deg); }
          .snum{ display:inline-flex; width:74px; height:74px; align-items:center; justify-content:center; border:3px solid #1D1D20; border-radius:50%; background:#B9E833; font-size:38px; box-shadow:4px 4px 0 #2A292B; }
          .stitle{ margin:22px 0 12px; font-size:36px; }
          .sdesc{ margin:0; font-size:22px; line-height:1.7; color:#4D4A48; }
          .sarrow{ align-self:center; padding:0 22px; font-size:48px; font-weight:900; opacity:0; }
        </style>

      </section>
    </div>
    <script>
      const fallback = {"title": "把知识讲清楚的三步", "step1": "定义问题", "desc1": "先说它解决什么", "step2": "拆开机制", "desc2": "再讲为什么成立", "step3": "给出动作", "desc3": "最后落到怎么做", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 6;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("title").textContent = v.title;
      const steps = [[v.step1, v.desc1], [v.step2, v.desc2], [v.step3, v.desc3]];
      document.querySelectorAll(".scard").forEach((card, i) => {
        card.querySelector(".stitle").textContent = steps[i][0] || "";
        card.querySelector(".sdesc").textContent = steps[i][1] || "";
      });
      tl.to(".scard", { opacity: 1, y: 0, rotate: 0, duration: 0.55, ease: "back.out(1.5)", stagger: 0.5 }, 0.4);
      tl.to(".sarrow", { opacity: 1, duration: 0.3, stagger: 0.5 }, 0.8);
      tl.to(".scene", { clipPath: "inset(0 0 0 100%)", duration: 0.5, ease: "power2.in" }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
