<script src="../_lib/packs.js"></script>
<style>
  /* 底色和字色**必须来自规格包**，不能写死。

     而写死字面量色的元素（比如 rgba(244,241,234,.82)）反而还看得见，
     画面上就成了一半能看一半不能看——比全黑更难认。

     等于要求补间再开一次透明度而没开——线永远是隐形的，F1~F5 一条都不报。

  .sv-rule{position:absolute;left:120px;top:610px;width:0;height:3px;

  /* ═══ 3 · 技能曲线：一条越走越平的线 + 三段 ═══

     标签写 top:-108px 直接跑到画布外，色带写 height:0 等于没有。
     F6 查不出这两类（它只查透明度），是目检看出来的。 */
  .skc{position:absolute;left:200px;top:330px;width:1500px;height:400px;opacity:0;
      z-index:2}
  .skc-bd{position:absolute;left:0;top:0;width:0;height:0;z-index:1}
  .skc-lbd{position:absolute;left:0;top:0;width:0;height:0;z-index:3}
  /* 色带的 left 要加 SVG 元素自己的 200px 偏移。
     SVG 内部的 viewBox 坐标从 0 起，但 SVG 元素在版面上是 left:200px，
     所以 viewBox 的 x=0 对应舞台的 x=200。直接照抄内部坐标会整体左移 200，
     探针的 F1 会报「贴在 x=0」——那不是误报，是真的错位。 */
  .skc-band{position:absolute;left:200px;top:330px;width:0;height:400px;
      opacity:0;background:var(--pk-line);z-index:1}
  .skc-lb{position:absolute;opacity:0}
  .skc-lb .t{font-size:31px;font-weight:800;color:var(--pk-fg)}
  .skc-lb .d{font-size:22px;line-height:1.5;color:var(--pk-muted);margin-top:8px}
  .skc-ax{position:absolute;left:200px;top:730px;width:0;height:3px;
      background:var(--pk-line)}

  .so-spine{position:absolute;left:120px;top:392px;width:4px;height:0;

  .so .ord{flex:0 0 184px;padding-left:34px;font-family:ui-monospace,Consolas,monospace;

  .so .now{flex:0 0 660px;font-size:34px;font-weight:700;line-height:1.32;
      color:var(--pk-fg)}

  .df-badge{position:absolute;right:40px;top:40px;padding:10px 22px;

  .df-when .wl{font-size:30px;line-height:1.6;color:var(--pk-fg)}
  .df-when .wl b{color:var(--pk-accent);font-weight:800}

  /* ═══ 6 · 可逆性分级：能反悔的 / 不能反悔的 ═══ */
  .rv{position:absolute;left:120px;top:340px;width:800px;height:416px;opacity:0;

  .rv .rh{display:flex;align-items:baseline;gap:20px}
  .rv .rh .t{font-family:ui-monospace,Consolas,monospace;font-size:28px;font-weight:800;
      letter-spacing:.20em;color:var(--pk-muted)}
  .rv .rh .sp{margin-left:auto;font-size:30px;font-weight:800;color:var(--pk-muted)}

<body>
<div id="stage">

  <div class="eyebrow" id="eyebrow">THE REVERSIBLE</div>
  <div class="h1" id="h1" data-fit-max="76" data-fit-min="44">先分清哪些决定能反悔</div>

  <div class="rv" id="rvL">
    <div class="rh">
      <span class="t" id="rvlt">可以反悔</span>
      <span class="sp" id="rvls">快点做</span>
    </div>
    <div class="ri" id="rvli0" data-fit-max="32" data-fit-min="21">改文案、换配色</div>
    <div class="rn" id="rvln0" data-fit-max="22" data-fit-min="15">成本几乎为零</div>
    <div class="ri" id="rvli1" data-fit-max="32" data-fit-min="21">调投放预算</div>
    <div class="rn" id="rvln1" data-fit-max="22" data-fit-min="15">一周内能退</div>
    <div class="ri" id="rvli2" data-fit-max="32" data-fit-min="21">试一个新功能</div>
    <div class="rn" id="rvln2" data-fit-max="22" data-fit-min="15">关掉就完</div>
  </div>

  <div class="rv key" id="rvR" style="left:1000px">
    <div class="rh">
      <span class="t" id="rvrt">不能反悔</span>
      <span class="sp" id="rvrs">慢点定</span>
    </div>
    <div class="ri" id="rvri0" data-fit-max="32" data-fit-min="21">换供应商</div>
    <div class="rn" id="rvrn0" data-fit-max="22" data-fit-min="15">迁移期断货</div>
    <div class="ri" id="rvri1" data-fit-max="32" data-fit-min="21">签三年合同</div>
    <div class="rn" id="rvrn1" data-fit-max="22" data-fit-min="15">违约金是硬约束</div>
    <div class="ri" id="rvri2" data-fit-max="32" data-fit-min="21">换城市、换团队</div>
    <div class="rn" id="rvrn2" data-fit-max="22" data-fit-min="15">人的成本不可逆</div>
  </div>

  <div class="footline" id="footline"></div>
  <div class="foot" id="footbox"><span id="foot">大部分人把时间平均分给了两类决定。</span><b>时间该按「退不回来」的比例分。</b></div>

</div>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  var tl = B.tl();
  /* 规格包：先定风格，再建任何元素。
     画面素材的配色**不跟着包走**——那是"底片"，用户自己的东西不能被模板改色；
     跟着包走的只有 UI 层（字色、强调色、描边、圆角、曲线）。这个边界必须守住。 */
  B.pack(v.pack);
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  function q(s) { return document.querySelector(s); }
  /* 素材位接真视频：留空就继续用 CSS 画面 */
  function live(n, src) {
    if (!src) return;
    var s = document.getElementById('s' + n), e = document.getElementById('v' + n);
    if (!s || !e) return;
    s.classList.add('live'); e.src = src;
    e.play().catch(function () {});
  }
  /* 景别缓推：v1/v3 里画面始终在极慢地动，这是「像镜头」的关键 */
  function push(n, at, dur, from, to, ease) {
    var s = q('#s' + n + ' .sky'), g = q('#s' + n + ' .glow'), r = q('#s' + n + ' .r2');
    if (s) tl.fromTo(s, { scale: from, y: '0%' },
      { scale: to, y: '-2%', duration: dur, ease: ease || 'none' }, at);
    if (g) tl.fromTo(g, { xPercent: -4, opacity: .8 },
      { xPercent: 5, opacity: 1, duration: dur, ease: 'none' }, at);
    if (r) tl.fromTo(r, { xPercent: 0 },
      { xPercent: -2.5, duration: dur, ease: 'none' }, at);
  }
  /* clip-path 形状插值。
     两个坑都在这里踩过：
       1. GSAP 各版本对 clipPath 字符串补间的处理不一致，所以不直接补间它，
          改成补间一个 {t:0→1} 的代理对象，onUpdate 里自己算 8 个点；
       2. **from 必须是编译期常量，不能从元素当前状态读。**
          settle 会把时间轴来回扫；一旦回退越过一个已完成的补间，
          GSAP 会把它按 ratio 0 重渲——onUpdate 拿到的就是起点，
          形状会「弹回矩形」。写成常量后，形状是 t 的纯函数，
          停在任何一帧算出来都一样。
     相邻两段的 from 必须等于上一段的 to，这条由 Python 侧保证。 */
  function polyStr(pts) {
    return 'polygon(' + pts.map(function (p) {
      return p[0].toFixed(2) + '% ' + p[1].toFixed(2) + '%'; }).join(',') + ')';
  }
  function morph(el, from, to, at, dur, ease) {
    if (!el || !to || !from || from.length !== to.length) return;
    var st = { t: 0 };
    tl.to(st, { t: 1, duration: dur == null ? .7 : dur, ease: ease || 'power2.inOut',
      onUpdate: function () {
        el.style.clipPath = polyStr(from.map(function (p, i) {
          return [p[0] + (to[i][0] - p[0]) * st.t,
                  p[1] + (to[i][1] - p[1]) * st.t];
        }));
      } }, at);
  }
  set('eyebrow', v.eyebrow); set('h1', v.title); set('foot', v.foot);
  set('rvlt', v.leftLabel); set('rvls', v.leftSpeed);
  set('rvrt', v.rightLabel); set('rvrs', v.rightSpeed);

  tl.fromTo('#eyebrow', { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: .4 }, 0);
  tl.fromTo('#h1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .08);
  tl.fromTo('#rvL', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .5,
    ease: 'power2.out' }, .32);
  tl.fromTo('#rvR', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .5,
    ease: 'power2.out' }, .5);
  for (var i = 0; i < 3; i++) {
    var at = .84 + i * .3;
    tl.fromTo('#rvli' + i, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: .36 }, at);
    tl.fromTo('#rvri' + i, { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: .36 }, at + .06);
  }
  tl.fromTo('#footline', { width: 0 }, { width: 420, duration: .5, ease: 'power2.out' }, 2.3);
  tl.fromTo('#footbox', { opacity: 0 }, { opacity: 1, duration: .5 }, 2.44);

  B.hold(tl, 3.6, .5);
  B.fitAll();

})();
</script>
