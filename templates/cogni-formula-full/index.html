<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"pack","name":"规格包","type":"select","label":"规格包（配色 / 字体 / 曲线）","options":[{"label":"暗色科技","value":"dark"},{"label":"奶油贴纸","value":"cream"},{"label":"单色克制","value":"mono"},{"label":"夜航","value":"night"}],"default":"night"},{"id":"eyebrow","name":"眉标","type":"string","label":"顶部眉标","default":"THE FORMULA"},{"id":"title","name":"标题","type":"string","label":"标题","default":"把「赚不赚钱」写成一个减法"},{"id":"left","name":"左项","type":"string","label":"等式左项","default":"月收入"},{"id":"right","name":"右项","type":"string","label":"等式右项","default":"月成本"},{"id":"result","name":"结果","type":"string","label":"等式结果","default":"月利润"},{"id":"leftDesc","name":"左项口径","type":"string","label":"左项口径说明","default":"过去 30 天所有渠道确认到账的钱，不含未结算"},{"id":"leftVal","name":"左项数值","type":"string","label":"左项实际值","default":"¥ 268,000"},{"id":"rightDesc","name":"右项口径","type":"string","label":"右项口径说明","default":"投放 + 人力 + 履约，含所有当月摊销"},{"id":"rightVal","name":"右项数值","type":"string","label":"右项实际值","default":"¥ 241,500"},{"id":"resultDesc","name":"结果口径","type":"string","label":"结果口径说明","default":"收入减成本。连续为负三个月就该停下来改结构"},{"id":"resultVal","name":"结果数值","type":"string","label":"结果实际值","default":"¥ 26,500"},{"id":"foot","name":"收口","type":"string","label":"底部收口一句","default":"口径一旦定死，结论就可以被反驳。别人不同意，就得改数，而不是改说法。"}]'>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<meta name="description" content="中间一个巨大减法，下面三张变量卡分别交代每个数的口径和实际值。认知类最容易做成「你听我讲」的一段，靠一个等式钉死口径，结论就变成可以被别人拿数字来驳的东西。">
<title>公式页 · 一个减法说清赚不赚</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<link rel="stylesheet" href="../_lib/packs.css">
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<!-- packs.js 必须排在 blocks.js **之后**：blocks.js 结尾是 global.BBlocks = BB，
     会把它整个替换掉。谁先加载谁的东西就没了，表现是 B.pack is not a function。 -->
<script src="../_lib/packs.js"></script>
<style>
  /* 底色和字色**必须来自规格包**，不能写死。
     写死 #000 + #F4F1EA 的时候，四个包里只有 dark / night 正常：
     cream 的 --pk-fg 是 #2A2118、mono 是 #14140F，两个都是**深字**，
     压在这个写死的黑底上 → 标题、标签、说明全糊掉。
     而写死字面量色的元素（比如 rgba(244,241,234,.82)）反而还看得见，
     画面上就成了一半能看一半不能看——比全黑更难认。
     一共 33 条模板中招（混剪 5 + 认知 22 + 节拍 6）。

     注意区分两层契约（packs.css 顶部注释里写过）：
       --pk-bg / --pk-fg      = 包自带底板，舞台自己用它
       --pk-*-media           = 压在用户素材上的那一层
     这里改的是前者。 */
  html,body{margin:0;padding:0;background:var(--pk-bg,#000)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--pk-bg,#000);
        color:var(--pk-fg,#F4F1EA);font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
        -webkit-font-smoothing:antialiased}
  /* 统一安全区：混剪里所有贴边元素都从 72/88 起，不贴 0 */
  
  /* ── 通用 ── */
  .eyebrow{position:absolute;left:120px;top:104px;opacity:0;
      font-family:ui-monospace,Consolas,monospace;font-size:26px;font-weight:700;
      letter-spacing:.34em;color:var(--pk-accent);text-indent:.34em}
  .h1{position:absolute;left:120px;top:148px;width:1680px;opacity:0;
      font-size:76px;font-weight:900;line-height:1.16;color:var(--pk-fg);letter-spacing:.01em}
  .foot{position:absolute;left:120px;top:922px;width:1680px;opacity:0;
      font-size:34px;line-height:1.5;color:var(--pk-muted)}
  .foot b{color:var(--pk-accent);font-weight:700}
  /* 底部一条极细的分隔，给满屏一个「结束感」 */
  .footline{position:absolute;left:120px;top:884px;width:0;height:2px;background:var(--pk-accent)}

  /* ── 因果链 ── */
  .spine{position:absolute;left:120px;top:0;width:4px;height:0;background:var(--pk-accent);opacity:.9}
  .node{position:absolute;left:120px;width:64px;height:64px;margin:-32px 0 0 -32px;
      border-radius:50%;border:3px solid var(--pk-accent);background:var(--pk-bg);opacity:0;
      display:flex;align-items:center;justify-content:center;
      font-family:ui-monospace,Consolas,monospace;font-size:26px;font-weight:800;color:var(--pk-accent)}
  .clabel{position:absolute;opacity:0;font-family:ui-monospace,Consolas,monospace;
      font-size:30px;font-weight:800;letter-spacing:.20em;color:var(--pk-accent)}
  .ctext{position:absolute;opacity:0;font-size:52px;font-weight:700;line-height:1.30;color:var(--pk-fg)}
  .cnote{position:absolute;opacity:0;font-size:27px;line-height:1.5;
      color:var(--pk-muted)}

  /* ── 公式页 ── */
  .eqbox{position:absolute;left:120px;top:352px;width:1680px;height:210px;opacity:0;
      display:flex;align-items:center;justify-content:center;gap:0;
      border-top:2px solid rgba(244,241,234,.14);border-bottom:2px solid rgba(244,241,234,.14)}
  .eqbox .t{font-size:150px;font-weight:900;color:var(--pk-fg);font-variant-numeric:tabular-nums}
  .eqbox .o{font-size:110px;font-weight:300;color:var(--pk-muted);padding:0 26px}
  .eqbox .r{font-size:150px;font-weight:900;color:var(--pk-accent);font-variant-numeric:tabular-nums}
  .vcard{position:absolute;top:650px;width:520px;opacity:0;
      border-left:4px solid rgba(244,241,234,.18);padding-left:28px}
  .vcard .vn{font-size:40px;font-weight:900;color:var(--pk-fg)}
  .vcard .vd{font-size:26px;line-height:1.5;color:var(--pk-muted);margin-top:14px}
  .vcard .vv{font-size:30px;font-weight:800;color:var(--pk-accent);margin-top:14px;
      font-family:ui-monospace,Consolas,monospace}

  /* ── 引述页 ── */
  .qm{position:absolute;left:120px;top:236px;opacity:0;
      font-family:Georgia,'Times New Roman',serif;font-size:220px;line-height:.7;
      color:var(--pk-accent);opacity:0}
  .qtext{position:absolute;left:120px;top:376px;width:1560px;opacity:0;
      font-size:96px;font-weight:800;line-height:1.42;color:var(--pk-fg);letter-spacing:.01em}
  .qwho{position:absolute;left:120px;opacity:0;
      font-family:ui-monospace,Consolas,monospace;font-size:28px;font-weight:700;
      letter-spacing:.16em;color:var(--pk-muted)}
  .qrule{position:absolute;left:120px;width:0;height:2px;background:rgba(244,241,234,.28)}
  .qlab{position:absolute;opacity:0;font-family:ui-monospace,Consolas,monospace;
      font-size:26px;font-weight:800;letter-spacing:.22em;color:var(--pk-accent)}
  .qtake{position:absolute;opacity:0;font-size:36px;line-height:1.52;
      color:var(--pk-fg)}

  /* ── 曲线页 ── */
  .chart{position:absolute;left:120px;top:400px;width:1680px;height:400px}
  .svgbox{position:absolute;left:0;top:0;width:100%;height:100%}
  .grid{position:absolute;left:0;right:0;height:1px;background:rgba(244,241,234,.10)}
  .pivot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
      background:var(--pk-accent);opacity:0;box-shadow:0 0 0 8px rgba(232,160,72,.18)}
  .pvline{position:absolute;width:2px;background:rgba(232,160,72,.55);opacity:0}
  .pvlab{position:absolute;opacity:0;font-size:30px;font-weight:800;color:var(--pk-accent)}
  .phase{position:absolute;top:0;opacity:0}
  .phase .pn{font-family:ui-monospace,Consolas,monospace;font-size:24px;font-weight:800;
      letter-spacing:.18em;color:var(--pk-accent)}
  .phase .pt{font-size:32px;font-weight:700;color:var(--pk-fg);margin-top:12px}
  .phase .pd{font-size:25px;color:var(--pk-muted);margin-top:10px;line-height:1.45}

</style>
</head>
<body>
<div id="stage">

  <div class="eyebrow" id="eb">THE FORMULA</div>
  <div class="h1" id="h1" data-fit-max="76" data-fit-min="44">把「赚不赚钱」写成一个减法</div>
  <div class="eqbox" id="eqbox">
    <span class="t" id="e1" data-fit-max="150" data-fit-min="72">月收入</span>
    <span class="o">−</span>
    <span class="t" id="e2" data-fit-max="150" data-fit-min="72">月成本</span>
    <span class="o">=</span>
    <span class="r" id="e3" data-fit-max="150" data-fit-min="72">月利润</span>
  </div>
  <div class="vcard" id="vc0" style="left:120px">
    <div class="vn" id="vn0">月收入</div>
    <div class="vd" id="vd0">过去 30 天所有渠道确认到账的钱，不含未结算</div>
    <div class="vv" id="vv0">¥ 268,000</div>
  </div>
  <div class="vcard" id="vc1" style="left:720px">
    <div class="vn" id="vn1">月成本</div>
    <div class="vd" id="vd1">投放 + 人力 + 履约，含所有当月摊销</div>
    <div class="vv" id="vv1">¥ 241,500</div>
  </div>
  <div class="vcard" id="vc2" style="left:1320px">
    <div class="vn" id="vn2">月利润</div>
    <div class="vd" id="vd2">收入减成本。连续为负三个月就该停下来改结构</div>
    <div class="vv" id="vv2">¥ 26,500</div>
  </div>
  <div class="footline" id="fline"></div>
  <div class="foot" id="foot" data-fit-max="34" data-fit-min="22">口径一旦定死，结论就可以被反驳。别人不同意，就得改数，而不是改说法。</div>

</div>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  var tl = B.tl();
  /* 规格包：先定风格，再建任何元素。
     画面素材的配色**不跟着包走**——那是"底片"，用户自己的东西不能被模板改色；
     跟着包走的只有 UI 层（字色、强调色、描边、圆角、曲线）。这个边界必须守住。 */
  B.pack(v.pack);
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
  function q(s) { return document.querySelector(s); }
  /* 素材位接真视频：留空就继续用 CSS 画面 */
  function live(n, src) {
    if (!src) return;
    var s = document.getElementById('s' + n), e = document.getElementById('v' + n);
    if (!s || !e) return;
    s.classList.add('live'); e.src = src;
    e.play().catch(function () {});
  }
  /* 景别缓推：v1/v3 里画面始终在极慢地动，这是「像镜头」的关键 */
  function push(n, at, dur, from, to, ease) {
    var s = q('#s' + n + ' .sky'), g = q('#s' + n + ' .glow'), r = q('#s' + n + ' .r2');
    if (s) tl.fromTo(s, { scale: from, y: '0%' },
      { scale: to, y: '-2%', duration: dur, ease: ease || 'none' }, at);
    if (g) tl.fromTo(g, { xPercent: -4, opacity: .8 },
      { xPercent: 5, opacity: 1, duration: dur, ease: 'none' }, at);
    if (r) tl.fromTo(r, { xPercent: 0 },
      { xPercent: -2.5, duration: dur, ease: 'none' }, at);
  }
  /* clip-path 形状插值。
     两个坑都在这里踩过：
       1. GSAP 各版本对 clipPath 字符串补间的处理不一致，所以不直接补间它，
          改成补间一个 {t:0→1} 的代理对象，onUpdate 里自己算 8 个点；
       2. **from 必须是编译期常量，不能从元素当前状态读。**
          settle 会把时间轴来回扫；一旦回退越过一个已完成的补间，
          GSAP 会把它按 ratio 0 重渲——onUpdate 拿到的就是起点，
          形状会「弹回矩形」。写成常量后，形状是 t 的纯函数，
          停在任何一帧算出来都一样。
     相邻两段的 from 必须等于上一段的 to，这条由 Python 侧保证。 */
  function polyStr(pts) {
    return 'polygon(' + pts.map(function (p) {
      return p[0].toFixed(2) + '% ' + p[1].toFixed(2) + '%'; }).join(',') + ')';
  }
  function morph(el, from, to, at, dur, ease) {
    if (!el || !to || !from || from.length !== to.length) return;
    var st = { t: 0 };
    tl.to(st, { t: 1, duration: dur == null ? .7 : dur, ease: ease || 'power2.inOut',
      onUpdate: function () {
        el.style.clipPath = polyStr(from.map(function (p, i) {
          return [p[0] + (to[i][0] - p[0]) * st.t,
                  p[1] + (to[i][1] - p[1]) * st.t];
        }));
      } }, at);
  }
  set('eb', v.eyebrow); set('h1', v.title); set('foot', v.foot);
  set('e1', v.left); set('e2', v.right); set('e3', v.result);
  set('vn0', v.left); set('vd0', v.leftDesc); set('vv0', v.leftVal);
  set('vn1', v.right); set('vd1', v.rightDesc); set('vv1', v.rightVal);
  set('vn2', v.result); set('vd2', v.resultDesc); set('vv2', v.resultVal);

  tl.fromTo('#eb', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .4 }, 0);
  tl.fromTo('#h1', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, .1);
  tl.fromTo('#eqbox', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .7, ease: 'power3.out' }, .24);

  /* 三个变量卡逐个进：观众的眼睛跟着等式从左走到右，
     卡片出现的顺序必须和等式的顺序一致，不然会跳。 */
  for (var k = 0; k < 3; k++) {
    var at = .9 + k * .34;
    tl.fromTo('#vc' + k, { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, at);
  }
  tl.fromTo('#fline', { width: 0 }, { width: 200, duration: .5, ease: 'power3.out' }, 2.4);
  tl.fromTo('#foot', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .5, ease: 'power3.out' }, 2.52);
  B.hold(tl, 3.8, .6);
  B.fitAll();

})();
</script>
</body>
</html>
