<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "words", "type": "string", "label": "形容词（逗号分隔）", "default": "沉稳,鲜亮,复古,凌厉,温暖,深邃"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#bg{ position:absolute; inset:0; background:#141419; }
#win{ position:absolute; left:610px; top:0; bottom:0; width:700px; overflow:hidden; }
#wlist{ position:absolute; left:0; top:0; width:700px; }
.wd{ height:140px; display:flex; align-items:center; justify-content:center; font-size:84px; color:rgba(255,255,255,.34); }
#pill{ position:absolute; left:660px; top:450px; width:600px; height:180px; border-radius:999px; background:#F4F4F2;
  display:flex; align-items:center; justify-content:center; font-size:96px; color:#141419; }
#fadeT{ position:absolute; left:0; right:0; top:0; height:300px; pointer-events:none; }
#fadeB{ position:absolute; left:0; right:0; bottom:0; height:300px; pointer-events:none; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
<div id="bg"></div><div id="win"><div id="wlist" id="wl"></div></div><div id="fadeT"></div><div id="fadeB"></div><div id="pill"></div>
    </div>
    <script>
      const FB = {"words": "沉稳,鲜亮,复古,凌厉,温暖,深邃", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

const words=(v.words||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean);
const wl=$('#wlist');
words.forEach(w=>{ const d=document.createElement('div'); d.className='wd'; d.textContent=w; wl.appendChild(d); });
// 主题表：胶囊色/底色（同明度深色对）
const TH=[['#F4F4F2','#141419'],['#00FF00','#0E1A12'],['#B78CFF','#18122B'],['#FF5A7A','#231016'],['#4FC3FF','#0E1A24']];
const hx=(h)=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return 'rgb('+A.map((c,i)=>Math.round(c+(B[i]-c)*t)).join(',')+')';};
const pill=$('#pill');
const apply=(i,t)=>{
  const pc=mix(TH[i][0],TH[i+1][0],t), bc=mix(TH[i][1],TH[i+1][1],t);
  pill.style.background=pc; $('#bg').style.background=bc;
  $('#fadeT').style.background='linear-gradient('+bc+',transparent)';
  $('#fadeB').style.background='linear-gradient(transparent,'+bc+')';
};
apply(0,0);
pill.textContent=words[0];
wl.style.transform='translateY(470px)'; // 词0 行进胶囊中心
// 铺垫 30f 静置，随后 4 拍 × 18f：拍头 6f 三通道齐跳，其余静置
const prox={t:0};
for(let b=0;b<4;b++){
  const bs=30+b*18;
  prox.t=0;
  tl.to(prox,{t:1,duration:F(6),ease:'power3.out',onUpdate:((n)=>()=>apply(n,prox.t))(b)},F(bs));
  tl.to(wl,{y:470-(b+1)*140,duration:F(6),ease:'power3.out'},F(bs));
  tl.call(((n)=>()=>{pill.textContent=words[n+1];})(b),[],F(bs+3));
  // 胶囊落位 squash 1.12→0.97→1
  tl.fromTo(pill,{scale:1.12},{scale:0.97,duration:F(3),ease:'power2.in'},F(bs));
  tl.to(pill,{scale:1,duration:F(3),ease:'power2.out'},F(bs+3));
}
tl.set(prox,{t:0},F(103));
tl.to({},{duration:F(47)},F(103)); // 停在最终色 ≥45f

      window.__timelines.main = tl;
    </script>
  </body>
</html>
