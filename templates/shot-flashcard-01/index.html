<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "w1", "type": "string", "label": "词1", "default": "日更"}, {"id": "w2", "type": "string", "label": "词2", "default": "不难"}, {"id": "w3", "type": "string", "label": "词3", "default": "现在就开始"}, {"id": "label", "type": "string", "label": "标签条", "default": "模板库 · 215 个镜头直接抄"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#bgF{ position:absolute; inset:0; background:#ECECEA; }
.wd{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; }
.wd span{ font-size:230px; color:#17171C; }
.wd .em{ color:#0A8A3C; }
#tag{ position:absolute; left:0; right:0; bottom:120px; text-align:center; opacity:0; }
#tag span{ display:inline-block; font-size:30px; color:#ECECEA; background:#17171C; padding:14px 44px; border-radius:999px; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
<div id="bgF"></div><div class="wd" id="w0"><span></span></div><div class="wd" id="w1"><span></span></div><div class="wd" id="w2"><span class="em"></span></div><div id="tag"><span></span></div>
    </div>
    <script>
      const FB = {"w1": "日更", "w2": "不难", "w3": "现在就开始", "label": "模板库 · 215 个镜头直接抄", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#w0 span').textContent=v.w1||'';$('#w1 span').textContent=v.w2||'';$('#w2 span').textContent=v.w3||'';
$('#tag span').textContent=v.label||'';
// 三词逐拍硬切：入场 6f scale 1.18→1(2%过冲) + 歪角交替 +2.5/-2.5/0
const ROT=[2.5,-2.5,0], CUES=[0,30,60];
CUES.forEach((cue,i)=>{
  const w='#w'+i;
  tl.set(w,{display:'flex'},F(cue));
  tl.set(w,{rotation:ROT[i]},F(cue));
  tl.fromTo(w+' span',{scale:1.18},{scale:0.98,duration:F(3),ease:'power4.out'},F(cue));
  tl.to(w+' span',{scale:1,duration:F(3),ease:'power2.out'},F(cue+3));
  // 落定帧起底闪：#ECECEA ↔ #CFCFCA 每 2f 交替共 6f（文字纹丝不动）
  const land=cue+6, flashes=i===2?4:3, dark=i===2?'#C4C4C0':'#CFCFCA';
  for(let k=0;k<flashes;k++){
    tl.set('#bgF',{background:dark},F(land+k*2));
    tl.set('#bgF',{background:'#ECECEA'},F(land+k*2+1));
  }
  if(i<2) tl.set(w,{display:'none'},F(cue+30));
});
// 末词闪结束同帧：底部标签条 14f 淡入
tl.to('#tag',{opacity:1,duration:F(14),ease:'power1.out'},F(68));
tl.to({},{duration:F(53)},F(82)); // 重拳双倍 hold ≥45f

      window.__timelines.main = tl;
    </script>
  </body>
</html>
