<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"决策树"},{"id":"subtitle","type":"string","label":"副标题","default":"多层判断如何收敛到结论"},{"id":"root","type":"string","label":"根节点","default":"需求类型"},{"id":"level1","type":"string","label":"第一层分支（逗号分隔）","default":"实时性高,实时性低"},{"id":"level2","type":"string","label":"第二层分支（逗号分隔）","default":"数据大,数据小,预算足,预算紧"},{"id":"leaves","type":"string","label":"叶子结论（逗号分隔）","default":"流式处理,批处理,自研模型,调用 API"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      body{ font-family: 'MEBHeiHeiTi', sans-serif; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e); color: var(--foreground, #f4efe7);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title-area{ margin-bottom: 40px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0 0 12px; font-size: 72px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .subtitle{ margin: 0; font-size: 32px; font-weight: 400; color: #6B7280;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-area{ position: relative; width: 100%; height: 620px; display: flex; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-svg{ width: 100%; height: 100%; overflow: visible;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node-box{ fill: #211c18; stroke: #3a3029; stroke-width: 2;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node-text{ fill: #f4efe7; font-size: 20px; font-weight: 600; text-anchor: middle;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .leaf-box{ fill: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .leaf-text{ fill: #12100e; font-size: 20px; font-weight: 700; text-anchor: middle;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .link{ fill: none; stroke: #3a3029; stroke-width: 2.5; stroke-linecap: round;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title-area">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <svg class="chart-svg" id="chart-svg" viewBox="0 0 1696 620" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "决策树", subtitle: "多层判断如何收敛到结论", root: "需求类型", level1: "实时性高,实时性低", level2: "数据大,数据小,预算足,预算紧", leaves: "流式处理,批处理,自研模型,调用 API", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      document.documentElement.style.setProperty("--accent", v.accent);
      document.getElementById("root").style.backgroundColor = v.background;
      document.getElementById("root").style.color = v.foreground;
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;

      const svg = document.getElementById("chart-svg");
      const cx = 848, w = 1696, h = 620;
      const levels = [
        [{ x: cx, y: 60, text: v.root, type: "root" }],
        v.level1.split(",").map((t, i) => ({ x: 424 + i * 848, y: 240, text: t, type: "level1" })),
        v.level2.split(",").map((t, i) => ({ x: 212 + i * 424, y: 400, text: t, type: "level2" })),
        v.leaves.split(",").map((t, i) => ({ x: 212 + i * 424, y: 560, text: t, type: "leaf" }))
      ];

      const nodeW = 180, nodeH = 48, leafW = 200, leafH = 48;
      const allNodes = [];
      levels.forEach((level, li) => {
        level.forEach((n, i) => {
          const isLeaf = n.type === "leaf";
          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          const nw = isLeaf ? leafW : nodeW, nh = isLeaf ? leafH : nodeH;
          rect.setAttribute("x", n.x - nw / 2); rect.setAttribute("y", n.y - nh / 2); rect.setAttribute("width", nw); rect.setAttribute("height", nh); rect.setAttribute("rx", 6);
          rect.setAttribute("class", isLeaf ? "leaf-box tree-node" : "node-box tree-node"); rect.setAttribute("opacity", "0"); svg.appendChild(rect);
          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", n.x); text.setAttribute("y", n.y + 6); text.setAttribute("class", isLeaf ? "leaf-text tree-label" : "node-text tree-label"); text.textContent = n.text; text.setAttribute("opacity", "0"); svg.appendChild(text);
          allNodes.push({ rect, text, delay: li * 0.4 });
        });
      });

      const links = [
        [levels[0][0], levels[1][0]], [levels[0][0], levels[1][1]],
        [levels[1][0], levels[2][0]], [levels[1][0], levels[2][1]],
        [levels[1][1], levels[2][2]], [levels[1][1], levels[2][3]],
        [levels[2][0], levels[3][0]], [levels[2][1], levels[3][1]],
        [levels[2][2], levels[3][2]], [levels[2][3], levels[3][3]]
      ];
      const linkElems = [];
      links.forEach(([a, b]) => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${a.x} ${a.y + nodeH / 2} C ${a.x} ${a.y + 80}, ${b.x} ${b.y - 80}, ${b.x} ${b.y - nodeH / 2}`);
        path.setAttribute("class", "link tree-link"); path.setAttribute("opacity", "0"); svg.appendChild(path);
        linkElems.push(path);
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      allNodes.forEach((n, i) => {
        tl.fromTo([n.rect, n.text], { opacity: 0, y: 15, scale: 0.95, transformOrigin: "center" }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power2.out" }, 0.6 + n.delay + i * 0.05);
      });
      linkElems.forEach((link, i) => {
        tl.fromTo(link, { opacity: 0, strokeDasharray: 400, strokeDashoffset: 400 }, { opacity: 1, strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 1.0 + i * 0.08);
      });
      tl.to(".scene", { opacity: 0, scale: 1.01, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
