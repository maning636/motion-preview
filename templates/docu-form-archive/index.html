<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "code", "type": "string", "label": "档案编号", "default": "DA-2026-0813"}, {"id": "title", "type": "string", "label": "档案名称", "default": "自动化运营复盘材料"}, {"id": "level", "type": "string", "label": "密级", "default": "内部"}, {"id": "date", "type": "string", "label": "归档日期", "default": "2026-08-13"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      #root{ background: #F1EDE0; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: #1D1D20;
        background-image: linear-gradient(rgba(29,29,32,.05) 1px, transparent 1px); background-size: 100% 90px; }
      .card{ position: absolute; left: 610px; top: 90px; width: 700px; height: 900px;
        background: #FFFDF7; border: 3px solid #1D1D20; padding: 46px 54px;
        box-shadow: 12px 12px 0 rgba(29,29,32,.14); }
      .card::before{ content: ""; position: absolute; inset: 14px; border: 2px dashed rgba(29,29,32,.4); pointer-events: none; }
      .tape{ position: absolute; left: 50%; top: -18px; width: 150px; height: 36px; margin-left: -75px;
        background: rgba(255,255,255,.6); transform: rotate(-2deg);
        border-left: 1px solid rgba(29,29,32,.1); border-right: 1px solid rgba(29,29,32,.1); }
      .a-code{ font-size: 26px; color: #3A3733; letter-spacing: .06em; padding-bottom: 16px;
        border-bottom: 2.5px solid #1D1D20; display: flex; justify-content: space-between; }
      .a-title{ margin-top: 44px; font-size: 52px; font-weight: 900; text-align: center; line-height: 1.3; }
      .a-rows{ margin-top: 48px; }
      .a-row{ display: flex; justify-content: space-between; align-items: baseline; padding: 18px 4px;
        border-bottom: 1.5px solid rgba(29,29,32,.25); font-size: 28px; font-weight: 700; }
      .a-row .k{ color: #6B6560; font-size: 24px; letter-spacing: .14em; }
      .a-lvl{ display: inline-block; padding: 2px 16px; border: 4px solid #C8392E; color: #C8392E;
        border-radius: 4px; font-weight: 900; letter-spacing: .2em; transform: rotate(-6deg); }
      .a-stamp{ position: absolute; right: 60px; bottom: 60px; width: 150px; height: 150px;
        border: 6px solid #C8392E; border-radius: 50%; color: #C8392E; font-size: 26px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; text-align: center;
        letter-spacing: .1em; transform: rotate(10deg); opacity: .92; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="card" id="card">
        <span class="tape"></span>
        <div class="a-code mono"><span>档案编号</span><span id="code"></span></div>
        <h1 class="a-title" id="title"></h1>
        <div class="a-rows">
          <div class="a-row"><span class="k">密　级</span><span class="a-lvl" id="level"></span></div>
          <div class="a-row"><span class="k">归档日期</span><span class="mono" id="date"></span></div>
          <div class="a-row"><span class="k">保管期限</span><span>长期</span></div>
          <div class="a-row"><span class="k">归档单位</span><span>综合档案室</span></div>
        </div>
        <div class="a-stamp" id="stamp">档案管理<br/>专用</div>
      </div>

    </div>
    <script>
      const fallback = {"code": "DA-2026-0813", "title": "自动化运营复盘材料", "level": "内部", "date": "2026-08-13", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      $("code").textContent = V.code;
      $("title").textContent = V.title;
      $("level").textContent = V.level;
      $("date").textContent = V.date;
      tl.fromTo("#card", { y: -70, opacity: 0, rotation: -5 }, { y: 0, opacity: 1, rotation: -2, duration: 0.55, ease: "back.out(1.6)" }, 0);
      tl.fromTo(".a-code", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.45);
      tl.fromTo("#title", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power3.out" }, 0.6);
      tl.fromTo(".a-row", { opacity: 0, x: -22 }, { opacity: 1, x: 0, duration: 0.28, stagger: 0.14, ease: "power2.out" }, 0.85);
      tl.fromTo(".a-lvl", { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.in" }, 1.5);
      tl.fromTo("#stamp", { scale: 2.6, opacity: 0, rotation: 30 }, { scale: 1, opacity: 0.92, rotation: 10, duration: 0.2, ease: "power4.in" }, 1.75);
      tl.to("#card", { keyframes: [
        { x: -7, duration: 0.06 }, { x: 5, duration: 0.07 }, { x: -3, duration: 0.06 }, { x: 0, duration: 0.08 }
      ], ease: "none" }, 1.93);
      window.__timelines.main = tl;

    </script>
  </body>
</html>
