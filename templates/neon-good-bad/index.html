<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "顶部标题（含高亮词）", "default": "先给结论，再讲理由"}, {"id": "titleAccent", "type": "string", "label": "标题高亮词（绿色，须为标题子串）", "default": "结论"}, {"id": "goodLabel", "type": "string", "label": "好条标签", "default": "你要的"}, {"id": "goodMain", "type": "string", "label": "好条绿色实心 chip", "default": "结论"}, {"id": "goodSub", "type": "string", "label": "好条灰色 chip", "default": "理由 · 展开"}, {"id": "badLabel", "type": "string", "label": "坏条标签", "default": "常见回答"}, {"id": "badMain", "type": "string", "label": "坏条内容", "default": "铺垫 · 背景 · 场面话 · 还在铺垫……"}, {"id": "badSub", "type": "string", "label": "坏条下方灰色注释", "default": "铺垫了半天，最后连个结论都没找到"}, {"id": "duration", "type": "number", "label": "总时长（秒，演完定格）", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0D12); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0D12);
  color: var(--foreground, #F5F5F3); font-family:'MEBHeiHeiTi',sans-serif; }

/* 顶部标题 */
.ctitle{ position:absolute; left:0; right:0; top:100px; text-align:center;
  font-family:'MiSans SemiBold'; font-weight:700; font-size:72px; letter-spacing:2px;
  white-space:nowrap; }
.ctitle .acc{ color:#34D399; text-shadow:0 0 20px rgba(52,211,153,.6); position:relative; padding:0 4px; }
.ctitle .acc::after{ content:''; position:absolute; left:6px; right:6px; bottom:-12px; height:5px;
  border-radius:3px; background:#10B981; box-shadow:0 0 14px rgba(16,185,129,.8); }

/* 标签行（✓ 你要的 / ✗ 常见回答） */
.lbl{ position:absolute; left:340px; display:flex; align-items:center; gap:14px;
  font-family:'MiSans SemiBold'; font-weight:700; font-size:30px; letter-spacing:2px; }
.lbl svg{ width:40px; height:40px; overflow:visible; }
#goodLbl{ top:290px; color:#34D399; text-shadow:0 0 12px rgba(52,211,153,.45); }
#badLbl{ top:560px; color:#9CA3AF; }
#goodLbl .ic{ stroke:#34D399; stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round;
  filter:drop-shadow(0 0 8px rgba(52,211,153,.6)); }
#badLbl .ic{ stroke:#EF4444; stroke-width:5; fill:none; stroke-linecap:round;
  filter:drop-shadow(0 0 8px rgba(239,68,68,.6)); }

/* 对比条 */
.bar{ position:absolute; left:340px; width:1240px; height:118px; background:#12161C;
  border-radius:16px; display:flex; align-items:center; padding:0 36px; gap:24px;
  will-change:transform; }
#goodBar{ top:352px; border:1px solid rgba(16,185,129,.9);
  box-shadow:0 0 26px rgba(16,185,129,.35), 0 0 60px rgba(16,185,129,.12), inset 0 0 30px rgba(16,185,129,.05); }
#badBar{ top:622px; border:1px solid rgba(239,68,68,.55);
  box-shadow:0 0 22px rgba(239,68,68,.18), 0 0 50px rgba(239,68,68,.07); }

/* 好条内 chip */
.chip-main{ flex:0 0 auto; min-width:300px; height:76px; border-radius:12px; background:#10B981;
  color:#06281D; font-family:'MiSans SemiBold'; font-weight:700; font-size:38px;
  display:flex; align-items:center; justify-content:center; padding:0 44px;
  box-shadow:0 0 18px rgba(16,185,129,.5); max-width:560px; overflow:hidden; white-space:nowrap; }
.chip-sub{ flex:1 1 auto; height:76px; border-radius:12px; border:1px solid rgba(156,163,175,.5);
  background:rgba(156,163,175,.06); color:#C9CDD4; font-family:'MiSans SemiBold'; font-weight:700;
  font-size:34px; display:flex; align-items:center; padding:0 36px;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }

/* 坏条内文字 */
.badtext{ font-family:'MiSans SemiBold'; font-weight:700; font-size:34px; color:rgba(156,163,175,.85);
  text-decoration:line-through; text-decoration-color:rgba(239,68,68,.55); text-decoration-thickness:3px;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:1170px; }

/* 坏条下方注释 */
.note{ position:absolute; left:340px; right:340px; top:772px; font-size:28px;
  color:#9CA3AF; letter-spacing:1px; overflow-wrap:break-word; }
.note::before{ content:''; display:inline-block; width:10px; height:10px; border-radius:50%;
  background:#9CA3AF; margin-right:14px; vertical-align:middle; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="ctitle" id="titleWrap"><span id="tPre"></span><span class="acc" id="tAcc"></span><span id="tPost"></span></div>

      <div class="lbl" id="goodLbl">
        <svg viewBox="0 0 40 40"><circle class="ic" cx="20" cy="20" r="17"/><path class="ic" d="M12 20.5 L17.5 26 L28 14"/></svg>
        <span id="goodLblTxt"></span>
      </div>
      <div class="bar" id="goodBar">
        <div class="chip-main" id="goodMainTxt"></div>
        <div class="chip-sub" id="goodSubTxt"></div>
      </div>

      <div class="lbl" id="badLbl">
        <svg viewBox="0 0 40 40"><circle class="ic" cx="20" cy="20" r="17"/><line class="ic" x1="13" y1="13" x2="27" y2="27"/><line class="ic" x1="27" y1="13" x2="13" y2="27"/></svg>
        <span id="badLblTxt"></span>
      </div>
      <div class="bar" id="badBar">
        <div class="badtext" id="badMainTxt"></div>
      </div>
      <div class="note" id="noteTxt"></div>
    </div>
    <script>
      const FB = {"title": "先给结论，再讲理由", "titleAccent": "结论", "goodLabel": "你要的", "goodMain": "结论", "goodSub": "理由 · 展开", "badLabel": "常见回答", "badMain": "铺垫 · 背景 · 场面话 · 还在铺垫……", "badSub": "铺垫了半天，最后连个结论都没找到", "duration": 6};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      const $=(s)=>document.querySelector(s);
      const DUR=+v.duration>0?+v.duration:6;
      $('[data-composition-id]').setAttribute('data-duration',String(DUR));

      /* 标题：高亮词作为子串拆分，找不到则整体前置、高亮词附加在后 */
      const title=String(v.title??''), acc=String(v.titleAccent??'');
      const idx=acc?title.indexOf(acc):-1;
      if(idx>=0){
        $('#tPre').textContent=title.slice(0,idx);
        $('#tAcc').textContent=acc;
        $('#tPost').textContent=title.slice(idx+acc.length);
      }else{
        $('#tPre').textContent=title;
        $('#tAcc').textContent=acc;
        $('#tPost').textContent='';
      }

      $('#goodLblTxt').textContent=v.goodLabel||'';
      $('#goodMainTxt').textContent=v.goodMain||'';
      $('#goodSubTxt').textContent=v.goodSub||'';
      $('#badLblTxt').textContent=v.badLabel||'';
      $('#badMainTxt').textContent=v.badMain||'';
      $('#noteTxt').textContent=v.badSub||'';

      window.__timelines=window.__timelines||{};
      const tl=gsap.timeline({paused:true});

      /* 1. 标题淡入上移 */
      tl.fromTo('#titleWrap',{opacity:0,y:36},{opacity:1,y:0,duration:0.6,ease:'power3.out'},0.25);
      /* 2. 好条（标签+条）从左滑入 */
      tl.fromTo('#goodLbl',{x:-160,opacity:0},{x:0,opacity:1,duration:0.6,ease:'power3.out'},0.9);
      tl.fromTo('#goodBar',{x:-160,opacity:0},{x:0,opacity:1,duration:0.7,ease:'power3.out'},1.0);
      /* 3. 坏条（标签+条）从右滑入 */
      tl.fromTo('#badLbl',{x:160,opacity:0},{x:0,opacity:1,duration:0.6,ease:'power3.out'},1.9);
      tl.fromTo('#badBar',{x:160,opacity:0},{x:0,opacity:1,duration:0.7,ease:'power3.out'},2.0);
      /* 4. 注释淡入 */
      tl.fromTo('#noteTxt',{opacity:0,y:16},{opacity:1,y:0,duration:0.5,ease:'power2.out'},2.7);
      /* 演完定格，无收尾出场动画 */

      window.__timelines.main = tl;
    </script>
  </body>
</html>
