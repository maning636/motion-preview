<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"常用图标库"},{"id":"subtitle","type":"string","label":"副标题","default":"48 个精选线性图标"},{"id":"duration","type":"number","label":"总时长（秒）","default":5},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 50px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 12px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 400; opacity: 0.55; }
      .grid{ display: grid; grid-template-columns: repeat(8, 1fr); gap: 32px; width: 1100px; margin: 0 auto;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .icon-cell{ width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(244,239,231,0.1); border-radius: 12px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .icon-cell.accent{ border-color: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .icon-cell svg{ width: 48px; height: 48px; stroke: currentColor; stroke-width: 2; fill: none;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .icon-cell.accent svg{ stroke: var(--accent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="grid" id="grid"></div>
      </section>
    </div>
    <script>
      const fallback = { title: "常用图标库", subtitle: "48 个精选线性图标", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      const icons = [
        "M4 12h16M4 6h16M4 18h16", "M12 4v16M4 12h16", "M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0", "M5 12l5 5l9 -9", "M12 5v14M5 12h14",
        "M4 4h16v16H4z", "M12 2l3 7h7l-5.5 4.5L18 21l-6 -4l-6 4l2.5 -7.5L3 11h7z", "M9 18l6 -12", "M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0", "M16 8l-8 8M8 8l8 8",
        "M4 16l4 -8l4 8M6 14h4", "M12 3v18M3 12h18", "M5 5l14 14M19 5L5 19", "M12 8v8M8 12h8", "M4 20h16M4 6l8 -3l8 3",
        "M3 17h18M3 12h18M3 7h18", "M12 2a10 10 0 1 0 0 20a10 10 0 0 0 0 -20M12 6v6l4 2", "M4 10h16v10H4zM12 10V6", "M7 20l5 -12l5 12M8 16h8",
        "M2 12h4l2 -7l4 14l2 -7h4", "M12 22s8 -4 8 -10V5l-8 -3l-8 3v7c0 6 8 10 8 10", "M15 12a3 3 0 1 1 -6 0a3 3 0 0 1 6 0", "M17 21v-2a4 4 0 0 0 -4 -4H7a4 4 0 0 0 -4 4v2",
        "M4 4h16v5H4zM4 12h16v8H4z", "M3 3h18v18H3zM9 3v18M15 3v18", "M12 2l8 8l-8 8l-8 -8z", "M12 15l-6 -6h12z",
        "M4 6h16M4 12h16M4 18h16M8 6v12M16 6v12", "M2 7l10 -4l10 4v10l-10 4l-10 -4z", "M12 22c5.5 0 10 -4.5 10 -10S17.5 2 12 2S2 6.5 2 12s4.5 10 10 10",
        "M12 22c5.5 0 10 -4.5 10 -10H2c0 5.5 4.5 10 10 10", "M12 2v20", "M12 2a10 10 0 0 1 10 10H2A10 10 0 0 1 12 2", "M7 8h10M7 12h10M7 16h10",
        "M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z", "M12 2a15 15 0 0 1 0 30M12 2a15 15 0 0 0 0 30M2 17h20",
        "M5 3v18M19 3v18M5 12h14", "M3 6h18M3 12h18M3 18h18", "M12 3l9 15H3zM12 11v4", "M13 2L3 14h9l-1 8l10 -12h-9l1 -8",
        "M4 4l16 16M20 4L4 20", "M12 4a8 8 0 1 0 0 16a8 8 0 0 0 0 -16M12 8v8l4 2", "M9 12l2 2l5 -5"
      ];
      const grid = document.getElementById("grid");
      icons.forEach((d, i) => {
        const cell = document.createElement("div");
        cell.className = "icon-cell" + (i === 17 ? " accent" : "");
        cell.innerHTML = `<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
        grid.appendChild(cell);
      });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      document.querySelectorAll(".icon-cell").forEach((cell, i) => {
        tl.fromTo(cell, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.7)" }, 0.4 + i * 0.02);
      });
      tl.fromTo(".icon-cell.accent", { opacity: 0.5 }, { opacity: 1, duration: 0.4, repeat: 1, yoyo: true }, 1.8);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.4, ease: "power2.in" }, 4.4);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
