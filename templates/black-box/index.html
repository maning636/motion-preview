<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"大模型黑盒"},{"id":"subtitle","type":"string","label":"副标题","default":"输入与输出明确，中间过程不可解释"},{"id":"inputLabel","type":"string","label":"输入标签","default":"Prompt"},{"id":"outputLabel","type":"string","label":"输出标签","default":"Answer"},{"id":"boxLabel","type":"string","label":"黑盒内标签","default":"175B 参数 · 不可解释"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .header{ margin-bottom: 56px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0; font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 64px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
      .subtitle{ margin: 12px 0 0; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 24px; font-weight: 400; opacity: 0.55; }
      .diagram{ position: relative; width: 100%; height: 600px; display: flex; align-items: center; justify-content: center; gap: 64px;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .box{ width: 320px; height: 320px; border: 2px solid var(--accent); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: color-mix(in srgb, var(--accent) 6%, transparent); box-shadow: 0 0 80px color-mix(in srgb, var(--accent) 12%, transparent);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .box-q{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 120px; font-weight: 700; color: var(--accent); line-height: 1; }
      .box-sub{ font-family: 'MEBHeiHeiTi', sans-serif; font-size: 18px; opacity: 0.6; margin-top: 12px; text-align: center; padding: 0 24px; }
      .io{ width: 240px; height: 100px; border: 1px solid rgba(244,239,231,0.18); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'MEBHeiHeiTi', sans-serif; font-size: 28px; font-weight: 600; }
      .arrow{ font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 48px; font-weight: 500; opacity: 0.35; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="header">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="diagram">
          <div class="io" id="inputLabel"></div>
          <div class="arrow">→</div>
          <div class="box">
            <div class="box-q">?</div>
            <div class="box-sub" id="boxLabel"></div>
          </div>
          <div class="arrow">→</div>
          <div class="io" id="outputLabel"></div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "大模型黑盒", subtitle: "输入与输出明确，中间过程不可解释", inputLabel: "Prompt", outputLabel: "Answer", boxLabel: "175B 参数 · 不可解释", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      const root = document.getElementById("root");
      root.style.backgroundColor = v.background;
      root.style.color = v.foreground;
      root.style.setProperty("--accent", v.accent);
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;
      document.getElementById("inputLabel").textContent = v.inputLabel;
      document.getElementById("outputLabel").textContent = v.outputLabel;
      document.getElementById("boxLabel").textContent = v.boxLabel;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo("#inputLabel", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.5);
      tl.fromTo(".arrow", { opacity: 0, x: -10 }, { opacity: 0.35, x: 0, duration: 0.4, stagger: 0.15, ease: "power2.out" }, 0.7);
      tl.fromTo(".box", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.5)" }, 0.9);
      tl.fromTo(".box-q", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 1.2);
      tl.fromTo("#boxLabel", { opacity: 0 }, { opacity: 0.6, duration: 0.4 }, 1.5);
      tl.fromTo("#outputLabel", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 1.1);
      tl.to(".scene", { opacity: 0, y: -16, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
