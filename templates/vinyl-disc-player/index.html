<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "img1", "type": "image", "label": "主视觉（一图四用）", "default": "./placeholder-1.png"}, {"id": "song", "type": "string", "label": "歌名", "default": "第 57 次取消发送"}, {"id": "artist", "type": "string", "label": "歌手/副标", "default": "AI COVER · LO-FI"}, {"id": "lyrics", "type": "string", "label": "歌词（逗号分隔逐句）", "default": "凌晨的站台还没有人,风把车票吹成了船,我把再见练习了很多遍,第 57 次取消发送,月亮蹲在铁轨尽头,数我没说出口的晚安,如果告别有回程票,你会不会也回头看"}, {"id": "accent", "type": "color", "label": "强调色（书名号/当前句/频谱）", "default": "#f3d394"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      :root{ --gold: #f3d394; --goldGlow: rgba(243,211,148,.06); --goldHalo: rgba(243,211,148,.18);
        --goldHi: rgba(243,211,148,.48); --goldLo: rgba(243,211,148,.35); }
      #root{ background: #0d0f0d; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: rgba(255,253,246,.94); }
      /* 图层0：同封面放大铺底 + tint + vignette（对照原型 acceptance/vinyl-prototype-ref.html 移植） */
      .vp-bg{ position: absolute; inset: -2%; z-index: 0; background-size: cover; background-position: center 44%;
        background-image: url("./placeholder-1.png");
        filter: brightness(.76) saturate(1.04); transform: scale(1.04); }
      .vp-tint{ position: absolute; inset: 0; z-index: 1; background:
        radial-gradient(100% 86% at 74% 42%, var(--goldGlow), transparent 64%),
        linear-gradient(90deg, rgba(7,10,9,.20), rgba(9,10,8,.06) 56%, rgba(7,8,7,.17)),
        linear-gradient(180deg, rgba(8,10,9,.03), rgba(7,9,8,.23)); }
      .vp-vign{ position: absolute; inset: 0; z-index: 2; box-shadow: inset 0 0 190px rgba(0,0,0,.36); }
      /* 底部镜面水波倒影：封面翻转 scaleY(-1) + blur 2.5 + 横向细纹 + mask 渐隐 */
      .vp-refl{ position: absolute; left: -3%; right: -3%; bottom: -18px; height: 250px; z-index: 2;
        background-size: cover; background-position: center 82%; background-image: url("./placeholder-1.png");
        opacity: .46; transform: scaleY(-1); transform-origin: center bottom;
        filter: blur(2.5px) brightness(.68) saturate(1.06);
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 100%);
        mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 100%); }
      .vp-ripple{ position: absolute; inset: 0; mix-blend-mode: overlay; background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 2px, rgba(0,0,0,.10) 3px 5px, transparent 6px 10px); }
      /* 专辑封面 */
      .vp-cover{ position: absolute; left: 150px; top: 262px; width: 556px; height: 556px; border-radius: 20px;
        background-size: cover; background-position: center; background-image: url("./placeholder-1.png"); z-index: 4;
        box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 1.5px rgba(255,255,255,.55); }
      /* 半透明「图片碟」：透出封面，随碟自转；同心纹路 + conic 高光扫过 */
      .vp-discbox{ position: absolute; left: 430px; top: 262px; width: 556px; height: 556px; z-index: 3; }
      .vp-disc{ position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
        background-size: cover; background-position: center; background-image: url("./placeholder-1.png"); opacity: .82;
        box-shadow: 0 30px 70px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.18); }
      .vp-disc::before{ content: ""; position: absolute; inset: 0; border-radius: 50%;
        background: repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.14) 0 1px, transparent 1px 5px);
        box-shadow: inset 0 0 70px rgba(0,0,0,.55); }
      .vp-disc::after{ content: ""; position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0 10%, rgba(255,255,255,.22) 16%, transparent 24% 58%, rgba(255,255,255,.12) 64%, transparent 72%); }
      /* hub：多层透明 CD 中心环 + backdrop blur + 非对称乳白高光（mix-blend screen） */
      .vp-glass{ position: absolute; left: 616px; top: 450px; width: 180px; height: 180px; border-radius: 50%; z-index: 5;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%,
          rgba(28,35,34,.14) 0 14%, rgba(222,231,232,.30) 15%, rgba(255,255,255,.82) 17.5% 20%,
          rgba(245,248,248,.42) 23% 54%, rgba(255,255,255,.64) 58% 61%,
          rgba(233,240,241,.31) 64% 89%, rgba(255,255,255,.78) 95%, rgba(255,255,255,0) 100%);
        box-shadow: 0 8px 22px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.46), inset 0 0 24px rgba(255,255,255,.18);
        -webkit-backdrop-filter: blur(2.4px) saturate(.76) brightness(1.12);
        backdrop-filter: blur(2.4px) saturate(.76) brightness(1.12); }
      .vp-glass::before{ content: ""; position: absolute; inset: 5px; border-radius: 50%;
        background: radial-gradient(circle at 50% 50%,
          transparent 0 14%, rgba(255,255,255,.54) 16%, rgba(255,255,255,0) 22% 57%,
          rgba(255,255,255,.20) 59%, rgba(255,255,255,0) 64% 92%, rgba(255,255,255,.24) 96%, transparent 100%);
        box-shadow: inset 0 0 16px rgba(120,140,145,.10); }
      .vp-glass::after{ content: ""; position: absolute; inset: 0; border-radius: 50%;
        background:
          conic-gradient(from 212deg, rgba(255,255,255,.44), transparent 18% 42%, rgba(255,255,255,.15) 52%, transparent 65% 84%, rgba(255,255,255,.30)),
          radial-gradient(ellipse at 32% 24%, rgba(255,255,255,.34), transparent 41%),
          radial-gradient(ellipse at 70% 78%, rgba(160,180,187,.12), transparent 48%);
        mix-blend-mode: screen; opacity: .62; }
      /* 标题：《》金色书名号 + 歌手行 */
      .vp-title{ position: absolute; left: 1010px; top: 150px; width: 760px; text-align: center; z-index: 6;
        font-family: 'MiSans SemiBold', sans-serif; font-size: 52px; font-weight: 600; letter-spacing: .04em;
        text-shadow: 0 2px 24px rgba(0,0,0,.5), 0 0 30px var(--goldHalo); }
      .vp-title .br{ color: var(--gold); font-weight: 500; }
      .vp-artist{ position: absolute; left: 1010px; top: 226px; width: 760px; text-align: center; z-index: 6;
        font-size: 20px; letter-spacing: .34em; color: rgba(255,253,246,.5); }
      /* 滚动歌词：当前句金色 36px 带光晕，上下 mask 渐隐 */
      .vp-lyrics{ position: absolute; left: 1010px; top: 250px; width: 760px; height: 640px; z-index: 6;
        text-align: center; overflow: hidden;
        -webkit-mask-image: linear-gradient(180deg, transparent, #000 16%, #000 82%, transparent);
        mask-image: linear-gradient(180deg, transparent, #000 16%, #000 82%, transparent); }
      .vp-lines{ margin-top: 310px; }
      .vp-line{ height: 64px; line-height: 64px; font-size: 30px; font-weight: 400; color: rgba(255,253,246,.26);
        white-space: nowrap; }
      .vp-line.near{ color: rgba(255,253,246,.5); font-size: 31px; font-weight: 450; }
      .vp-line.cur{ color: var(--gold); font-size: 36px; font-weight: 650; text-shadow: 0 0 26px var(--goldHi); }
      /* 56 柱正弦频谱 */
      .vp-spec{ position: absolute; left: 150px; top: 858px; width: 660px; height: 64px; z-index: 6;
        display: flex; align-items: flex-end; gap: 4px; }
      .vp-spec i{ flex: 1; height: 100%; border-radius: 2px; transform-origin: bottom;
        background: linear-gradient(180deg, var(--gold), var(--goldLo)); }
      /* 5 个 SVG 播放控件 */
      .vp-controls{ position: absolute; left: 150px; top: 952px; width: 660px; height: 80px; z-index: 6;
        display: flex; align-items: center; justify-content: center; gap: 52px; }
      .vp-controls svg{ fill: none; stroke: rgba(255,253,246,.94); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .vp-controls .sm{ width: 34px; height: 34px; opacity: .85; }
      .vp-controls .play{ width: 74px; height: 74px; border-radius: 20px; display: grid; place-items: center;
        background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.2); }
      .vp-controls .play svg{ width: 30px; height: 30px; fill: rgba(255,253,246,.94); stroke: none; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="vp-bg" id="bgImg"></div>
      <div class="vp-tint"></div>
      <div class="vp-refl" id="reflImg"><div class="vp-ripple" id="ripple"></div></div>
      <div class="vp-vign"></div>
      <div class="vp-discbox" id="discbox"><div class="vp-disc" id="discImg"></div></div>
      <div class="vp-glass" id="glass"></div>
      <div class="vp-cover" id="coverImg"></div>
      <div class="vp-title" id="title"><span class="br">《</span><span id="song"></span><span class="br">》</span></div>
      <div class="vp-artist" id="artist"></div>
      <div class="vp-lyrics" id="lyrics"><div class="vp-lines" id="lines"></div></div>
      <div class="vp-spec" id="spec"></div>
      <div class="vp-controls" id="controls">
        <svg class="sm" viewBox="0 0 24 24"><path d="M4 5l5 5-5 5M9 5h4a6 6 0 016 6M20 19l-5-5 5-5M15 19h-2a6 6 0 01-6-6"/></svg>
        <svg class="sm" viewBox="0 0 24 24"><path d="M7 5v14M19 5L9 12l10 7z" fill="rgba(255,253,246,.94)" stroke="none"/></svg>
        <div class="play"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></div>
        <svg class="sm" viewBox="0 0 24 24"><path d="M17 5v14M5 5l10 7-10 7z" fill="rgba(255,253,246,.94)" stroke="none"/></svg>
        <svg class="sm" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg>
      </div>

    </div>
    <script>
      const fallback = {"img1": "./placeholder-1.png", "song": "第 57 次取消发送", "artist": "AI COVER · LO-FI", "lyrics": "凌晨的站台还没有人,风把车票吹成了船,我把再见练习了很多遍,第 57 次取消发送,月亮蹲在铁轨尽头,数我没说出口的晚安,如果告别有回程票,你会不会也回头看", "accent": "#f3d394", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      // accent → 金色调色板（--gold 及各档透明度），改 accent 全场景联动（默认金，可自行改绿）
      const hexRgb = (h) => { const m = String(h || "#f3d394").replace("#", "");
        const v = (m.length === 3 ? m.split("").map((c) => c + c).join("") : m).padEnd(6, "0").slice(0, 6);
        const n = parseInt(v, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
      const [gr, gg, gb] = hexRgb(V.accent);
      const gA = (a) => "rgba(" + gr + "," + gg + "," + gb + "," + a + ")";
      const rs = document.documentElement.style;
      rs.setProperty("--gold", V.accent);
      rs.setProperty("--goldGlow", gA(0.06));
      rs.setProperty("--goldHalo", gA(0.18));
      rs.setProperty("--goldHi", gA(0.48));
      rs.setProperty("--goldLo", gA(0.35));
      $("song").textContent = V.song;
      $("artist").textContent = V.artist;
      if (V.img1) ["bgImg", "reflImg", "coverImg", "discImg"].forEach((k) => {
        $(k).style.backgroundImage = 'url("' + V.img1 + '")';
      });
      const lines = split(V.lyrics);
      const linesEl = $("lines");
      lines.forEach((t) => {
        const d = document.createElement("div");
        d.className = "vp-line";
        d.textContent = t;
        linesEl.appendChild(d);
      });
      const lineEls = Array.from(linesEl.children);
      const spec = $("spec"), bars = [];
      for (let i = 0; i < 56; i++) { const b = document.createElement("i"); spec.appendChild(b); bars.push(b); }
      // 0.6.x 契约：禁 CSS infinite 动画。所有运动挂主 paused timeline，
      // 由 master onUpdate 按 t 确定性求值（渲染器按帧 seek，任意帧状态确定）
      const lineH = 64, N = Math.max(lines.length, 1);
      // 长视频模式（duration>30s，如整首歌曲成片）：时间轴铺满全片，歌词均分滚动；
      // 短模板（默认 6s）保持原型节奏不变
      const _dur = Number(V.duration) || 6, LONG = _dur > 30;
      const SCENE = LONG ? _dur - 0.1 : 5.9, LINE_T = LONG ? SCENE / N : 2;
      const discbox = $("discbox"), ripple = $("ripple");
      let cur = -1;
      const master = { p: 0 };
      const applyFrame = () => {
        const t = master.p * SCENE;
        // 碟片匀速自转：速率对齐原型 14s/圈
        discbox.style.transform = "rotate(" + (t * (360 / 14)) + "deg)";
        // 歌词 2s/行连续上滚（原型 20s 时钟压到 6s，约推进 3 行），当前句金色放大带光晕
        const posL = Math.min(t / LINE_T, N - 1);
        linesEl.style.transform = "translateY(" + (-posL * lineH) + "px)";
        const c = Math.round(posL);
        if (c !== cur) {
          lineEls.forEach((el, i) => {
            el.classList.toggle("cur", i === c);
            el.classList.toggle("near", Math.abs(i - c) === 1);
          });
          cur = c;
        }
        // 频谱：每柱 scaleY 是 (t, i) 的确定性周期函数（换算原型 eq 关键帧，禁 Math.random）
        bars.forEach((b, i) => {
          const T = 0.75 + (i % 5) * 0.12;
          let ph = ((t - (i * 0.13) % 1.1) / T) % 1;
          if (ph < 0) ph += 1;
          const s = 0.5 - 0.5 * Math.cos(2 * Math.PI * ph);
          b.style.transform = "scaleY(" + ((0.22 + 0.78 * s) * 0.2) + ")";
        });
        // 倒影水波细纹：原型 ripple 4.8s ease-in-out 关键帧的 seek-safe 换算
        const rp = 0.5 - 0.5 * Math.cos(2 * Math.PI * ((t / 4.8) % 1));
        ripple.style.transform = "translateX(" + (-9 + 18 * rp) + "px) scaleX(" + (1.01 - 0.025 * rp) + ")";
        ripple.style.opacity = (0.55 + 0.35 * rp).toFixed(3);
      };
      tl.fromTo(["#coverImg", "#title", "#artist", "#lyrics"], { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0);
      tl.fromTo("#discbox", { opacity: 0 }, { opacity: 1, duration: 0.7 }, 0.12);
      tl.fromTo("#glass", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.3);
      tl.fromTo(["#spec", "#controls"], { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.35);
      tl.to(master, { p: 1, duration: SCENE, ease: "none", onUpdate: applyFrame }, 0.1);
      applyFrame();  // t=0 初始帧（seek 到 0~0.1s 时 onUpdate 尚未触发）
      window.__timelines.main = tl;

    </script>
  </body>
</html>
