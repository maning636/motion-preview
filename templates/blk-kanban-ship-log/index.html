<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "eyebrow", "name": "眉标", "type": "string", "label": "顶部眉标", "default": "SHIPLOG / 版本节奏"}, {"id": "title", "name": "主标题", "type": "string", "label": "主标题", "default": "发版不是终点，是下一起点"}, {"id": "note", "name": "注释", "type": "string", "label": "右上角注释", "default": "单位：次"}, {"id": "accent", "name": "强调色", "type": "color", "label": "强调色", "default": "#FF8A3D"}]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>三列看板 · 发版不是终点，是下一起点</title>
<link rel="stylesheet" href="../_lib/blocks.css">
<style>
  html,body{margin:0;padding:0;background:var(--ink)}
  #stage{width:1920px;height:1080px;position:relative;overflow:hidden;
        background:var(--paper);color:var(--ink);font-family:var(--sans);
        display:flex;flex-direction:column;padding:58px 72px 0}
  #stage.on-ink{background:var(--ink);color:var(--paper)}

  .hd{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
  .hd h1{font-size:60px;font-weight:900;line-height:1.04;margin:8px 0 0;letter-spacing:-.015em}
  .hd .note{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.1em;
        border:var(--bw) solid var(--ink);border-radius:9999px;padding:9px 20px;
        background:var(--white);color:var(--ink);box-shadow:4px 4px 0 var(--ink);white-space:nowrap}
  #stage.on-ink .hd .note{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--accent)}

  /* 底部色带：把画面「压」住，不然上面排得再满底部都是飘的 */
  .ft{flex:0 0 auto;height:18px;border-top:var(--bw) solid var(--ink);
      border-bottom:var(--bw) solid var(--ink);
      background:repeating-linear-gradient(45deg,var(--ink) 0 10px,var(--accent) 10px 20px)}
  #stage.on-ink .ft{border-color:var(--paper)}

  .body{flex:1 1 auto;min-height:0;display:flex;margin-top:32px;padding-bottom:26px}

  /* 图标必须锁死尺寸。只写 viewBox 而不写 width/height 的 SVG，浏览器会按
     「默认替换元素尺寸」给它 300px——图标从 52px 的底座里横着冲出去，
     把整张卡片撑破。版图上表现为卡片右边被顶掉一截，而溢出检测只报"出框"，
     看不出是被一个看不见的图标顶的。 */
  .ico{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ico svg{width:100%;height:100%;display:block}

  .body{display:flex;gap:24px}
  .lane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px}
  .lane .lh{flex:0 0 auto;border:var(--bw) solid var(--ink);border-radius:4px;
        padding:14px 20px;box-shadow:6px 6px 0 var(--ink);display:flex;
        align-items:center;justify-content:space-between;gap:12px}
  .lane .lh .t{font-weight:900;font-size:28px;white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis}
  .lane .lh .c{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.1em;
        border:var(--bw) solid currentColor;border-radius:9999px;padding:3px 11px;
        white-space:nowrap;flex:0 0 auto}
  .lane .cards{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
  .kcard{flex:1 1 0;min-height:0;border:var(--bw) solid var(--ink);border-radius:4px;
        background:var(--white);color:var(--ink);padding:16px 18px;
        display:flex;align-items:stretch;gap:18px;
        box-shadow:5px 5px 0 var(--ink);min-width:0}
  /* color:var(--ink) 不是冗余：#stage.on-ink 把整台的颜色设成纸色，
     .kcard 只给 background 不给 color 时，文字就变成 #FFF6E5 印在 #FFFFFF 上，
     对比度 1.03:1，整卡文字隐形——而溢出、ink 面积、YSTD 全绿。 */
  /* 卡片改成上下三段：状态行 / 数值 / 占比条。
     原来一条 12px 横条在 313px 高的卡里细得看不见，上下各空一百多像素；
     试过换成占满高度的竖轨，30px 宽的杆子在 300px 宽的卡旁边更立不住。
     真正填满这块地方的是内容本身：状态 + 大数 + 条子，三段各自吃一段高度。 */
  .kcard{flex:1 1 0;min-height:0;border:var(--bw) solid var(--ink);border-radius:4px;
        background:var(--white);color:var(--ink);padding:20px 24px;
        display:flex;flex-direction:column;gap:12px;
        box-shadow:5px 5px 0 var(--ink);min-width:0}
  .kcard .krow{flex:0 0 auto;display:flex;align-items:flex-start;gap:14px;min-width:0}
  .kcard .st{flex:0 0 16px;width:16px;height:16px;margin-top:6px;border:var(--bw) solid var(--ink)}
  .kcard .k{font-size:25px;font-weight:900;line-height:1.14;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
  /* 中段吃剩余高度：大数字贴底，标签和数字之间的空当由 flex 撑开，
     读起来是「先看标题、再看量」，不是「上面一块下面空一块」 */
  .kcard .mid{flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;gap:12px}
  .kcard .v{font-family:var(--mono);font-weight:700;font-size:62px;line-height:.88;
        letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .kcard .u{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.14em;
        opacity:.75;padding-bottom:6px}
  .kcard .tk{flex:0 0 18px;position:relative;overflow:hidden;
        border:var(--bw) solid var(--ink);background:var(--paper)}
  .kcard .tk i{position:absolute;left:0;top:0;bottom:0;width:0;display:block}
</style>
</head>
<body>
<div id="stage" class="blk-noise">
  <div class="blk-corner tl"></div><div class="blk-corner tr"></div>
  <div class="blk-corner bl"></div><div class="blk-corner br"></div>

  <div class="hd"><div><div class="blk-eyebrow" id="eyebrow">SHIPLOG / 版本节奏</div>
    <h1 id="title" data-fit-max="60" data-fit-min="32">发版不是终点，是下一起点</h1></div><div class="note" id="note" data-fit-max="15" data-fit-min="11">单位：次</div></div>
  <div class="body"><div class="lane" id="lane0"><div class="lh" style="background:var(--white);color:var(--ink)"><span class="t">待处理</span><span class="c">4 项</span></div><div class="cards"><div class="kcard" id="kc0"><div class="krow"><span class="st" style="background:var(--white)"></span><span class="k" id="k0" data-fit-max="25" data-fit-min="14">提测</span></div><div class="mid"><span class="v" id="v0" data-fit-max="62" data-fit-min="31">18</span><span class="u">次</span></div><span class="tk"><i id="kt0" style="background:var(--white)"></i></span></div><div class="kcard" id="kc1"><div class="krow"><span class="st" style="background:var(--yellow)"></span><span class="k" id="k1" data-fit-max="25" data-fit-min="14">紧急回滚</span></div><div class="mid"><span class="v" id="v1" data-fit-max="62" data-fit-min="31">2</span><span class="u">次</span></div><span class="tk"><i id="kt1" style="background:var(--yellow)"></i></span></div></div></div><div class="lane" id="lane1"><div class="lh" style="background:var(--blue);color:var(--ink)"><span class="t">进行中</span><span class="c">3 项</span></div><div class="cards"><div class="kcard" id="kc10"><div class="krow"><span class="st" style="background:var(--yellow)"></span><span class="k" id="k10">灰度</span></div><div class="mid"><span class="v" id="v10">9</span><span class="u">次</span></div><span class="tk"><i id="kt10" style="background:var(--yellow)"></i></span></div></div></div><div class="lane" id="lane2"><div class="lh" style="background:var(--pink);color:var(--ink)"><span class="t">已完成</span><span class="c">2 项</span></div><div class="cards"><div class="kcard" id="kc20"><div class="krow"><span class="st" style="background:var(--blue)"></span><span class="k" id="k20">正式发布</span></div><div class="mid"><span class="v" id="v20">14</span><span class="u">次</span></div><span class="tk"><i id="kt20" style="background:var(--blue)"></i></span></div></div></div></div>
  <div class="ft"></div>
</div>
<script src="../_lib/gsap.min.js"></script>
<script src="../_lib/blocks.js"></script>
<script>
(function () {
  'use strict';
  var B = window.BBlocks;
  var v = B.vars();
  function set(id, val) { var e = document.getElementById(id);
    if (e && val != null && val !== '') e.textContent = val; }
    ["eyebrow", "title", "note", "accent", "k0", "v0", "k1", "v1", "k2", "v2", "k3", "v3"]
.forEach(function (k) { set(k, v[k]); });
  if (v.accent) document.documentElement.style.setProperty('--accent', v.accent);
  B.fitAll();
  var tl = B.tl();

  document.querySelectorAll('.lane').forEach(function (l, i) {
    B.in.drop(tl, l, 0.1 + i * 0.15, { dist: 110, rot: (i % 2 ? 1.6 : -1.6), d: 0.8 });
  });
  var sh = [0.4186, 0.2093, 0.3256, 0.0465];
  document.querySelectorAll('.kcard').forEach(function (c, i) {
    tl.from(c, { opacity: 0, y: 16, duration: 0.32 }, 0.34 + i * 0.06);
    B.in.grow(tl, c.querySelector('.tk i'),
      Math.max(6, Math.round((sh[i] || 0) * 100)) + '%', 0.5 + i * 0.06, { d: 0.8 * 0.85 });
  });
  B.finish(tl);
  B.hold(tl);
})();
</script>
</body></html>
