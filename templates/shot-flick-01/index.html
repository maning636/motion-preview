<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "段落标题", "default": "内容库"}, {"id": "count", "type": "string", "label": "卡片数量", "default": "15"}, {"id": "caption", "type": "string", "label": "收尾文案", "default": "全部模板已就位"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

.dkick{ position:absolute; left:90px; top:110px; font-family:'MiSans SemiBold'; font-size:28px;
  letter-spacing:.4em; color:rgba(255,255,255,.5); }
.dttl{ position:absolute; left:90px; top:150px; font-size:88px; color:var(--fg); }
.dpile{ position:absolute; left:150px; top:430px; width:270px; height:165px; }
.pchip{ position:absolute; inset:0; border-radius:14px; background:#1B1B24;
  border:1px solid rgba(255,255,255,.16); box-shadow:0 14px 30px rgba(0,0,0,.4); }
.dgrid{ position:absolute; right:80px; top:250px; width:1470px; height:660px; }
.dcard{ position:absolute; width:270px; height:165px; border-radius:14px; background:#16161D;
  border:1px solid rgba(255,255,255,.12); padding:18px; }
.dcard .dt{ height:14px; width:55%; border-radius:7px; background:rgba(255,255,255,.28); margin-bottom:12px; }
.dcard .dl{ height:10px; border-radius:5px; background:rgba(255,255,255,.13); margin-bottom:8px; }
.dcard .dl.s{ width:64%; }
.dcard .db{ position:absolute; right:14px; bottom:12px; width:44px; height:26px; border-radius:8px;
  background:var(--accent); opacity:.85; }
.dghost{ position:absolute; width:270px; height:165px; border-radius:14px; background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.06); pointer-events:none; }
.dcount{ position:absolute; left:90px; top:880px; font-family:'MiSans SemiBold'; font-size:30px;
  letter-spacing:.2em; color:var(--accent); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
<div class="dkick" id="k">LIBRARY</div>
<div class="dttl" id="t"></div>
<div class="dpile" id="pile"></div>
<div class="dgrid" id="grid"></div>
<div class="dcount" id="c"></div>
    </div>
    <script>
      const FB = {"title": "内容库", "count": "15", "caption": "全部模板已就位", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#t').textContent=v.title||'';$('#c').textContent=(v.count||'15')+' 张卡片 · '+(v.caption||'');
const grid=$('#grid'),pile=$('#pile');
const CW=270,CH=165,GX=36,GY=60,COLS=5;
const PX=150+135, PY=430+82; // 牌堆中心
const jit=(i,k)=>{const x=Math.sin(i*127.3+k*57.7)*43758.5453;return (x-Math.floor(x));};
// 牌堆 4 片
for(let j=0;j<4;j++){
  const p=document.createElement('div');p.className='pchip';
  p.style.transform='translateY('+(-j*3)+'px) rotate('+(((jit(j,3)*6)-3))+'deg)';
  pile.appendChild(p);
}
const N=+(v.count||15);
const cards=[];
for(let k=0;k<N;k++){
  const col=k%COLS,rowi=Math.floor(k/COLS);
  const sx=col*(CW+GX),sy=rowi*(CH+GY);
  const c=document.createElement('div');c.className='dcard';
  c.style.left=sx+'px';c.style.top=sy+'px';
  c.innerHTML='<div class="dt"></div><div class="dl"></div><div class="dl s"></div><div class="db"></div>';
  grid.appendChild(c);
  const g=document.createElement('div');g.className='dghost';
  g.style.left=sx+'px';g.style.top=sy+'px';grid.appendChild(g);
  cards.push({c,g,sx,sy,k});
}
tl.fromTo('.dkick',{opacity:0},{opacity:1,duration:F(8)},0);
tl.fromTo('.dttl',{opacity:0,y:20},{opacity:1,y:0,duration:F(10),ease:'power3.out'},F(2));
tl.fromTo('.dpile',{opacity:0},{opacity:1,duration:F(8)},F(4));
// 预备拍：牌堆下压 + 顶片回拉
tl.to('.dpile',{y:40,duration:F(8),ease:'power2.out'},F(10));
tl.to('.pchip:last-child',{x:-30,duration:F(8),ease:'power2.out'},F(10));
cards.forEach(({c,g,sx,sy,k})=>{
  const cue=F(20)+F(4*k)-F(0.0792*k*(k-1));
  const dx=PX-(sx+135), dy=PY-(sy+82);
  [ [c,0,.95],[g,F(1.5),.18] ].forEach(([el,lag,op])=>{
    tl.set(el,{x:dx,y:dy,opacity:0,scale:.85,rotate:(jit(k,1)*8-4)},cue+lag);
    tl.to(el,{opacity:op,duration:F(2)},cue+lag);
    tl.to(el,{x:0,duration:F(8),ease:'power1.inOut'},cue+lag);
    tl.to(el,{y:dy*0.5-90,duration:F(4),ease:'power2.out'},cue+lag);
    tl.to(el,{y:0,duration:F(4),ease:'power2.in'},cue+lag+F(4));
    tl.to(el,{scale:1.06,duration:F(4),ease:'power2.out'},cue+lag);
    tl.to(el,{scale:1,duration:F(4),ease:'power2.in'},cue+lag+F(4));
    tl.to(el,{rotate:0,duration:F(8),ease:'power1.inOut'},cue+lag);
  });
  const land=cue+F(8);
  tl.to(c,{scale:1.03,duration:F(2),ease:'power2.out'},land);
  tl.to(c,{scale:1,duration:F(2),ease:'power2.inOut'},land+F(2));
  tl.to(c,{boxShadow:'0 12px 30px rgba(0,0,0,.45)',duration:F(4)},land+F(2));
  tl.to(g,{opacity:0,duration:F(3)},land);
});
// 牌堆随发牌消耗
const lastCue=F(20)+F(4*(N-1))-F(0.0792*(N-1)*(N-2));
tl.to('.dpile',{y:0,duration:F(6),ease:'power2.inOut'},F(18));
document.querySelectorAll('.pchip').forEach((p,j)=>{
  tl.to(p,{opacity:0,duration:F(4)},F(24)+j*F(10));
});
const tEnd=lastCue+F(14);
tl.fromTo('.dcount',{opacity:0,y:12},{opacity:1,y:0,duration:F(10)},tEnd);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
