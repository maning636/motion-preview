<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"分支流程"},{"id":"subtitle","type":"string","label":"副标题","default":"根据条件选择不同执行路径"},{"id":"root","type":"string","label":"根节点","default":"用户输入"},{"id":"question","type":"string","label":"判断问题","default":"是否已登录？"},{"id":"yesLabel","type":"string","label":"是分支标签","default":"是 → 进入主页"},{"id":"noLabel","type":"string","label":"否分支标签","default":"否 → 跳转登录"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"background","type":"color","label":"背景色","default":"#12100E"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>

@font-face {
  font-family: 'MiSans SemiBold';
  src: url('../_fonts/MiSansSemiBold.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'MEBHeiHeiTi';
  src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype');
  font-weight: 100 1000;
  font-weight: normal;
  font-style: normal;
}

*{ box-sizing: border-box;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      html, body{ margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      body{ font-family: 'MEBHeiHeiTi', sans-serif; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--background, #12100e); color: var(--foreground, #f4efe7);font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .scene{ position: absolute; inset: 0; width: 100%; height: 100%; padding: 96px 112px; overflow: hidden;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title-area{ margin-bottom: 48px;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .title{ margin: 0 0 12px; font-size: 72px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em;font-family: 'MiSans SemiBold', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .subtitle{ margin: 0; font-size: 32px; font-weight: 400; color: #6B7280;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-area{ position: relative; width: 100%; height: 620px; display: flex; align-items: center; justify-content: center;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .chart-svg{ width: 100%; height: 100%; overflow: visible;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node-box{ fill: #211c18; stroke: #3a3029; stroke-width: 2;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .node-text{ fill: #f4efe7; font-size: 24px; font-weight: 600; text-anchor: middle;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .diamond{ fill: #211c18; stroke: var(--accent); stroke-width: 3;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .diamond-text{ fill: #f4efe7; font-size: 22px; font-weight: 700; text-anchor: middle;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .branch-text{ fill: #6B7280; font-size: 20px; font-weight: 500;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
      .link{ fill: none; stroke: #3a3029; stroke-width: 3; stroke-linecap: round;font-family: 'MEBHeiHeiTi', 'PingFang SC', 'Microsoft YaHei', sans-serif;}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="title-area">
          <h1 class="title" id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="chart-area">
          <svg class="chart-svg" id="chart-svg" viewBox="0 0 1696 620" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "分支流程", subtitle: "根据条件选择不同执行路径", root: "用户输入", question: "是否已登录？", yesLabel: "是 → 进入主页", noLabel: "否 → 跳转登录", accent: "#00FF00", background: "#12100E", foreground: "#F4EFE7" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--background", v.background ?? "#12100E");
      document.documentElement.style.setProperty("--accent", v.accent);
      document.getElementById("root").style.backgroundColor = v.background;
      document.getElementById("root").style.color = v.foreground;
      document.getElementById("title").textContent = v.title;
      document.getElementById("subtitle").textContent = v.subtitle;

      const svg = document.getElementById("chart-svg");
      const cx = 848, startY = 80, diamondY = 260, endY = 500;

      const rootRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rootRect.setAttribute("x", cx - 120); rootRect.setAttribute("y", startY); rootRect.setAttribute("width", 240); rootRect.setAttribute("height", 64); rootRect.setAttribute("rx", 8); rootRect.setAttribute("class", "node-box root-node"); svg.appendChild(rootRect);
      const rootText = document.createElementNS("http://www.w3.org/2000/svg", "text");
      rootText.setAttribute("x", cx); rootText.setAttribute("y", startY + 40); rootText.setAttribute("class", "node-text root-node"); rootText.textContent = v.root; svg.appendChild(rootText);

      const diamondSize = 90;
      const diamond = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      const pts = `${cx},${diamondY - diamondSize} ${cx + diamondSize},${diamondY} ${cx},${diamondY + diamondSize} ${cx - diamondSize},${diamondY}`;
      diamond.setAttribute("points", pts); diamond.setAttribute("class", "diamond diamond-node"); svg.appendChild(diamond);
      const diaText = document.createElementNS("http://www.w3.org/2000/svg", "text");
      diaText.setAttribute("x", cx); diaText.setAttribute("y", diamondY + 6); diaText.setAttribute("class", "diamond-text diamond-node"); diaText.textContent = v.question; svg.appendChild(diaText);

      const yesX = 420, noX = 1276;
      const yesRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      yesRect.setAttribute("x", yesX - 130); yesRect.setAttribute("y", endY); yesRect.setAttribute("width", 260); yesRect.setAttribute("height", 64); yesRect.setAttribute("rx", 8); yesRect.setAttribute("class", "node-box end-node"); svg.appendChild(yesRect);
      const yesText = document.createElementNS("http://www.w3.org/2000/svg", "text");
      yesText.setAttribute("x", yesX); yesText.setAttribute("y", endY + 40); yesText.setAttribute("class", "node-text end-node"); yesText.textContent = v.yesLabel; svg.appendChild(yesText);

      const noRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      noRect.setAttribute("x", noX - 130); noRect.setAttribute("y", endY); noRect.setAttribute("width", 260); noRect.setAttribute("height", 64); noRect.setAttribute("rx", 8); noRect.setAttribute("class", "node-box end-node"); svg.appendChild(noRect);
      const noText = document.createElementNS("http://www.w3.org/2000/svg", "text");
      noText.setAttribute("x", noX); noText.setAttribute("y", endY + 40); noText.setAttribute("class", "node-text end-node"); noText.textContent = v.noLabel; svg.appendChild(noText);

      const link1 = document.createElementNS("http://www.w3.org/2000/svg", "path");
      link1.setAttribute("d", `M ${cx} ${startY + 64} L ${cx} ${diamondY - diamondSize}`); link1.setAttribute("class", "link link-line"); svg.appendChild(link1);
      const linkYes = document.createElementNS("http://www.w3.org/2000/svg", "path");
      linkYes.setAttribute("d", `M ${cx - diamondSize * 0.7} ${diamondY + diamondSize * 0.7} L ${yesX} ${endY}`); linkYes.setAttribute("class", "link link-line"); svg.appendChild(linkYes);
      const linkNo = document.createElementNS("http://www.w3.org/2000/svg", "path");
      linkNo.setAttribute("d", `M ${cx + diamondSize * 0.7} ${diamondY + diamondSize * 0.7} L ${noX} ${endY}`); linkNo.setAttribute("class", "link link-line"); svg.appendChild(linkNo);

      const yesBranch = document.createElementNS("http://www.w3.org/2000/svg", "text");
      yesBranch.setAttribute("x", cx - 130); yesBranch.setAttribute("y", diamondY + 110); yesBranch.setAttribute("class", "branch-text branch-label"); yesBranch.textContent = "是"; svg.appendChild(yesBranch);
      const noBranch = document.createElementNS("http://www.w3.org/2000/svg", "text");
      noBranch.setAttribute("x", cx + 110); noBranch.setAttribute("y", diamondY + 110); noBranch.setAttribute("class", "branch-text branch-label"); noBranch.textContent = "否"; svg.appendChild(noBranch);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo(".subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo(".root-node", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.1, ease: "power2.out" }, 0.5);
      tl.fromTo(".link-line", { opacity: 0, strokeDasharray: 300, strokeDashoffset: 300 }, { opacity: 1, strokeDashoffset: 0, duration: 0.6, stagger: 0.15, ease: "power2.out" }, 0.9);
      tl.fromTo(".diamond-node", { opacity: 0, scale: 0.8, transformOrigin: "center" }, { opacity: 1, scale: 1, duration: 0.6, stagger: 0.1, ease: "back.out(1.5)" }, 1.2);
      tl.fromTo(".branch-label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.1, ease: "power2.out" }, 1.6);
      tl.fromTo(".end-node", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.1, ease: "power2.out" }, 1.9);
      tl.to(".scene", { opacity: 0, scale: 1.01, duration: 0.5, ease: "power2.in" }, 5.3);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
