<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "cardTitle", "type": "string", "label": "卡标题", "default": "季度复盘"}, {"id": "bigNum", "type": "string", "label": "大数字", "default": "+218%"}, {"id": "numLabel", "type": "string", "label": "数字说明", "default": "内容产出环比增长"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#card{ position:absolute; left:660px; top:340px; width:600px; height:400px; border-radius:14px;
  background:#15151C; border:1px solid transparent; padding:44px; }
#card .t{ font-size:34px; color:rgba(255,255,255,.6); margin-bottom:30px; }
#card .n{ font-size:96px; color:var(--accent); font-family:'MiSans SemiBold',sans-serif; }
#card .x{ font-size:24px; color:rgba(255,255,255,.55); margin-top:14px; }
#cc{ opacity:0; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0">
  <rect id="trace" x="660" y="340" width="600" height="400" rx="14" fill="none"
        stroke="#00FF00" stroke-width="4" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
  <rect id="pen" x="660" y="340" width="600" height="400" rx="14" fill="none"
        stroke="#FFFFFF" stroke-width="7" pathLength="1" stroke-dasharray="0.045 0.955" stroke-dashoffset="0.045"/>
</svg>
<div id="card"><div id="cc"><div class="t" id="ct"></div><div class="n" id="cn"></div><div class="x" id="cx"></div></div></div>
    </div>
    <script>
      const FB = {"cardTitle": "季度复盘", "bigNum": "+218%", "numLabel": "内容产出环比增长", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#ct').textContent=v.cardTitle||'';$('#cn').textContent=v.bigNum||'';$('#cx').textContent=v.numLabel||'';
const A=v.accent||'#00FF00';
$('#trace').setAttribute('stroke',A);
// 描一圈 40f inOut cubic；笔头 7px 短 dash 跑最前
tl.to('#trace',{attr:{'stroke-dashoffset':0},duration:F(40),ease:'power2.inOut'},F(6));
tl.to('#pen',{attr:{'stroke-dashoffset':-0.955},duration:F(40),ease:'power2.inOut'},F(6));
// 闭合闪：2f 冲白加粗，6f 回落（句号）
tl.set('#trace',{attr:{stroke:'#FFFFFF','stroke-width':8}},F(48));
tl.to('#trace',{attr:{stroke:A,'stroke-width':4},duration:F(6),ease:'power2.out'},F(50));
// 交棒：描边层淡出，真 border 与内容同窗淡入
tl.to(['#trace','#pen'],{opacity:0,duration:F(10)},F(54));
tl.to('#card',{borderColor:'rgba(255,255,255,.16)',duration:F(10)},F(54));
tl.to('#cc',{opacity:1,duration:F(8)},F(56));
tl.to({},{duration:F(56)},F(64)); // 真静止 ≥35f

      window.__timelines.main = tl;
    </script>
  </body>
</html>
