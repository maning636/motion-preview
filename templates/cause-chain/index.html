<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"为什么效率会提升？"},{"id":"cause","type":"string","label":"原因","default":"重复动效被模板化"},{"id":"mechanism","type":"string","label":"机制","default":"只修改文案和数据"},{"id":"result","type":"string","label":"结果","default":"新视频能快速生成"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="5.5" data-track-index="1">

        <div class="gridbg"></div>
        <h1 id="title" class="num" style="position:relative;z-index:2;margin:0 0 40px;font-size:54px;"></h1>
        <div style="position:relative;margin-left:60px;">
          <div id="rail" style="position:absolute;left:0;top:20px;width:3px;height:0;background:linear-gradient(180deg,var(--accent,#00FF00),#2A2A2E);"></div>
          <div class="node" data-tag="起因" id="n1" style="margin-bottom:56px;">
            <span class="chip"><b>因</b>CAUSE</span>
            <p class="ntext" style="margin:14px 0 0 24px;font-size:38px;color:#D4D4D8;"></p>
          </div>
          <div class="node" data-tag="机制" id="n2" style="margin-bottom:56px;">
            <span class="chip"><b>机制</b>HOW</span>
            <p class="ntext" style="margin:14px 0 0 24px;font-size:38px;color:#D4D4D8;"></p>
          </div>
          <div class="node" id="n3" style="padding:28px 32px;border:1px solid var(--accent,#00FF00);border-radius:16px;background:color-mix(in srgb, var(--accent) 5%, transparent);display:inline-block;">
            <span class="chip" style="border-color:var(--accent,#00FF00);"><b>果</b>RESULT</span>
            <p class="ntext num" style="margin:14px 0 0 24px;font-size:44px;color:var(--accent,#00FF00);"></p>
          </div>
        </div>
        <style>.node{opacity:0;transform:translateX(-40px);position:relative;padding-left:48px;} .node::before{content:"";position:absolute;left:-8px;top:14px;width:19px;height:19px;border-radius:50%;background:#0A0A0B;border:3px solid var(--accent,#00FF00);}</style>

      </section>
    </div>
    <script>
      const fallback = {"title": "为什么效率会提升？", "cause": "重复动效被模板化", "mechanism": "只修改文案和数据", "result": "新视频能快速生成", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 5.5;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("title").textContent = v.title;
      const nodes = [$("n1"), $("n2"), $("n3")];
      [v.cause, v.mechanism, v.result].forEach((text, i) => { nodes[i].querySelector(".ntext").textContent = text; });
      tl.fromTo("#title", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "power3.out" }, 0.1);
      tl.to("#rail", { height: 620, duration: 2.0, ease: "power2.inOut" }, 0.4);
      tl.to(".node", { opacity: 1, x: 0, duration: 0.6, ease: "power3.out", stagger: 0.6 }, 0.5);
      tl.to(".scene", { clipPath: "inset(0 0 0 100%)", duration: 0.5, ease: "power2.in" }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
