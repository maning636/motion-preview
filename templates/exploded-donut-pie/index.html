<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "标题", "default": "内容形态占比"}, {"id": "data", "type": "string", "label": "数据数组（逗号分隔）", "default": "42,28,18,12"}, {"id": "labels", "type": "string", "label": "标签（逗号分隔）", "default": "短视频,图文,直播,其他"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "duration", "type": "number", "label": "总时长(秒)", "default": 6}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
      *{ box-sizing: border-box; margin: 0; padding: 0; }
      html, body{ width: 1920px; height: 1080px; overflow: hidden; }
      #root{ position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      @font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
      #root{ background: #080A08; font-family: 'MEBHeiHeiTi', 'PingFang SC', sans-serif; color: #F0F5F0; }
      .mono{ font-family: 'IBM Plex Mono', 'JetBrains Mono', monospace; }
      .edp-head{ position: absolute; left: 90px; top: 80px; z-index: 6; }
      .edp-kicker{ font-size: 20px; letter-spacing: .34em; color: rgba(240,245,240,.5); }
      .edp-title{ margin-top: 14px; font-size: 64px; font-weight: 900; }
      .edp-formula{ position: absolute; right: 90px; top: 100px; font-size: 24px; color: rgba(240,245,240,.55);
        letter-spacing: .1em; z-index: 6; }
      .edp-stage{ position: absolute; left: 50%; top: 56%; transform: translate(-50%,-50%); width: 1160px; height: 860px; }
      .edp-lead{ stroke: rgba(240,245,240,.7); stroke-width: 2.5; fill: none; }
      .edp-lab{ font-size: 27px; fill: #F0F5F0; font-family: 'MEBHeiHeiTi', sans-serif; }
      .edp-pct{ font-size: 27px; font-family: 'IBM Plex Mono', monospace; }
      .edp-center-t{ font-size: 22px; fill: rgba(240,245,240,.5); font-family: 'IBM Plex Mono', monospace; letter-spacing: .3em; }
      .edp-center-v{ font-size: 64px; fill: #F0F5F0; font-family: 'MiSans SemiBold', sans-serif; font-weight: 900; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="edp-head"><div class="edp-kicker mono">EXTRUDED DONUT PIE · 2.5D</div><div class="edp-title" id="title"></div></div>
      <div class="edp-formula mono">θ = value / total × 360°</div>
      <svg class="edp-stage" id="svg" viewBox="0 0 1160 860"></svg>

    </div>
    <script>
      const fallback = {"title": "内容形态占比", "data": "42,28,18,12", "labels": "短视频,图文,直播,其他", "accent": "#00FF00", "duration": 6};
      const V = Object.assign({}, fallback, (window.__hyperframes?.getVariables?.() || {}));
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const countTo = (el, target, at, dur = 1.0, dec = 0, wobble = false) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(String(target).replace(/,/g, "")) || 0, duration: dur,
          ease: wobble ? "back.out(1.6)" : "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };
      document.documentElement.style.setProperty("--ac", V.accent ?? "#00FF00");
      $("title").textContent = V.title;
      const data = split(V.data).map(Number).filter((x) => isFinite(x) && x > 0);
      const labels = split(V.labels);
      const total = data.reduce((a, b) => a + b, 0) || 1;
      const NS = "http://www.w3.org/2000/svg";
      const svg = $("svg"), CXS = 580, CYS = 400, R = 250, RI = 130, EX = 26;
      const hexRgb = (h) => { const m = String(h || "#00FF00").replace("#", "");
        const v = (m.length === 3 ? m.split("").map((c) => c + c).join("") : m).padEnd(6, "0").slice(0, 6);
        const n = parseInt(v, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
      const base = hexRgb(V.accent);
      const shade = (f) => "rgb(" + base.map((v) => Math.max(0, Math.min(255, Math.round(v * f)))).join(",") + ")";
      const P = (a, r) => { const rad = (a - 90) * Math.PI / 180; return [CXS + r * Math.cos(rad), CYS + r * Math.sin(rad)]; };
      const sectorTop = (a0, a1) => {
        const [ox0, oy0] = P(a0, R), [ox1, oy1] = P(a1, R), [ix1, iy1] = P(a1, RI), [ix0, iy0] = P(a0, RI);
        const laf = (a1 - a0) > 180 ? 1 : 0;
        return "M" + ox0 + " " + oy0 + " A" + R + " " + R + " 0 " + laf + " 1 " + ox1 + " " + oy1 +
          " L" + ix1 + " " + iy1 + " A" + RI + " " + RI + " 0 " + laf + " 0 " + ix0 + " " + iy0 + " Z";
      };
      const sectorSide = (a0, a1) => {
        const [ox0, oy0] = P(a0, R), [ox1, oy1] = P(a1, R);
        const laf = (a1 - a0) > 180 ? 1 : 0;
        return "M" + ox0 + " " + oy0 + " A" + R + " " + R + " 0 " + laf + " 1 " + ox1 + " " + oy1 +
          " L" + ox1 + " " + (oy1 + EX) + " A" + R + " " + R + " 0 " + laf + " 0 " + ox0 + " " + (oy0 + EX) + " Z";
      };
      const mk = (tag, attrs, parent) => {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        (parent || svg).appendChild(el);
        return el;
      };
      // defs：金属外圈渐变
      const defs = mk("defs", {});
      const lg = mk("linearGradient", { id: "metal", x1: "0", y1: "0", x2: "1", y2: "1" }, defs);
      [["0%", "#F2F5F2"], ["45%", "#7E857E"], ["62%", "#D9DED9"], ["100%", "#4A4F4A"]].forEach(([o, c]) =>
        mk("stop", { offset: o, "stop-color": c }, lg));
      // 挤出厚度底座（整个圆环下移 EX，深色金属体）
      const ring = "M" + (CXS - R) + " " + CYS + " A" + R + " " + R + " 0 1 1 " + (CXS + R) + " " + CYS +
        " A" + R + " " + R + " 0 1 1 " + (CXS - R) + " " + CYS + " Z M" + (CXS - RI) + " " + CYS +
        " A" + RI + " " + RI + " 0 1 0 " + (CXS + RI) + " " + CYS + " A" + RI + " " + RI + " 0 1 0 " + (CXS - RI) + " " + CYS + " Z";
      mk("path", { d: ring, fill: "#20241F", "fill-rule": "evenodd", transform: "translate(0," + EX + ")" });
      mk("circle", { cx: CXS, cy: CYS + EX, r: R + 16, fill: "none", stroke: "#2B302B", "stroke-width": 12 });
      // 扇区：θ = value/total × 360°，顺时针
      const FAC = [1.0, 0.55, 0.8, 0.4, 0.66, 0.3];
      const sectors = [], leads = [];
      let acc = 0;
      data.forEach((v, i) => {
        const a0 = acc, a1 = acc + v / total * 360, mid = (a0 + a1) / 2;
        acc = a1;
        const g = mk("g", { "class": "edp-sec" });
        mk("path", { d: sectorSide(a0, a1), fill: shade(0.22) }, g);
        mk("path", { d: sectorTop(a0, a1), fill: shade(FAC[i % FAC.length]),
          stroke: "rgba(0,0,0,.4)", "stroke-width": 2 }, g);
        sectors.push({ g, mid });
        // 引导线 + 标签 + 百分比（延迟浮出）
        const lg2 = mk("g", { "class": "edp-leadg", opacity: 0 });
        const p1 = P(mid, R + 30), p2 = P(mid, R + 82);
        const side = Math.cos((mid - 90) * Math.PI / 180) >= 0 ? 1 : -1;
        const p3 = [p2[0] + side * 66, p2[1]];
        mk("polyline", { points: p1.join(",") + " " + p2.join(",") + " " + p3.join(","), "class": "edp-lead" }, lg2);
        const pct = Math.round(v / total * 100);
        const tx = mk("text", { x: p3[0] + side * 12, y: p3[1] + 9,
          "text-anchor": side > 0 ? "start" : "end", "class": "edp-lab" }, lg2);
        tx.textContent = (labels[i] || "项 " + (i + 1)) + " ";
        const ts = mk("tspan", { "class": "edp-pct", fill: V.accent ?? "#00FF00" }, tx);
        ts.textContent = pct + "%";
        leads.push(lg2);
      });
      // 金属外圈顶面 + 中心合计
      mk("circle", { cx: CXS, cy: CYS, r: R + 16, fill: "none", stroke: "url(#metal)", "stroke-width": 12 });
      mk("circle", { cx: CXS, cy: CYS, r: RI - 6, fill: "none", stroke: "rgba(240,245,240,.14)", "stroke-width": 2 });
      const ct = mk("text", { x: CXS, y: CYS - 16, "text-anchor": "middle", "class": "edp-center-t" });
      ct.textContent = "TOTAL";
      const cv = mk("text", { x: CXS, y: CYS + 62, "text-anchor": "middle", "class": "edp-center-v" });
      cv.textContent = total;
      // 动效：圆盘旋入 → 扇区顺时针逐块弹起向外分离 → 引导线/百分比延迟浮出
      tl.fromTo(svg, { rotation: -150, scale: 0.55, opacity: 0, transformOrigin: "50% 50%" },
        { rotation: 0, scale: 1, opacity: 1, duration: 1.1, ease: "power3.out" }, 0.15);
      sectors.forEach((s, i) => {
        const rad = (s.mid - 90) * Math.PI / 180;
        tl.to(s.g, { x: Math.cos(rad) * 34, y: Math.sin(rad) * 34 - 10,
          duration: 0.5, ease: "back.out(1.8)" }, 1.15 + i * 0.16);
      });
      tl.fromTo(".edp-head", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo(".edp-formula", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.5);
      leads.forEach((el, i) => tl.to(el, { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.15 + i * 0.12));
      window.__timelines.main = tl;

    </script>
  </body>
</html>
