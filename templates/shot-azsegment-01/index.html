<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "segA", "type": "string", "label": "左段标签", "default": "手动"}, {"id": "segB", "type": "string", "label": "右段标签", "default": "自动"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#ctl{ position:absolute; left:420px; top:430px; width:1080px; height:220px; border-radius:110px;
  background:#1A1D26; border:1px solid color-mix(in srgb, var(--fg) 14%, transparent);
  box-shadow:0 24px 70px rgba(0,0,0,.55); will-change:transform; }
#thumb{ position:absolute; left:16px; top:16px; width:508px; height:188px; border-radius:94px;
  background:#F4F4F2; will-change:transform; z-index:2; }
.seg{ position:absolute; top:0; width:540px; height:220px; display:flex; align-items:center;
  justify-content:center; gap:18px; font-size:52px; font-weight:800; z-index:3; }
#segA{ left:0; color:#0A0A0F; }
#segB{ left:540px; color:color-mix(in srgb, var(--fg) 55%, transparent); }
.ico{ display:inline-flex; align-items:center; justify-content:center; width:64px; height:64px;
  border-radius:50%; font-size:38px; overflow:hidden; }
#icoA{ background:#0A0A0F; color:#F4F4F2; }
#icoB{ background:var(--accent); color:#0A0A0F; transform:scale(0); width:0; }
#ripple{ position:absolute; width:90px; height:90px; border-radius:50%; border:4px solid var(--accent);
  opacity:0; z-index:4; pointer-events:none; }
#cursor{ position:absolute; width:130px; height:130px; z-index:6; will-change:transform;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.4)); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.6666666666666665" data-width="1920" data-height="1080">
<div id="ctl"><div id="thumb"></div><div class="seg" id="segA"><span class="ico" id="icoA">✋</span><span id="la"></span></div><div class="seg" id="segB"><span class="ico" id="icoB">🤖</span><span id="lb"></span></div><div id="ripple"></div></div><div id="cursor"><svg viewBox="0 0 130 130"><polygon points="30,14 112,66 72,76 58,116" fill="#F4F4F2" stroke="#221F1A" stroke-width="7" stroke-linejoin="round"/></svg></div>
    </div>
    <script>
      const FB = {"segA": "手动", "segB": "自动", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#la').textContent=v.segA||'';$('#lb').textContent=v.segB||'';
const ctl=$('#ctl'), thumb=$('#thumb'), cursor=$('#cursor'), ripple=$('#ripple');
// 弹簧浮入（下 200px），大阴影随落位收小
tl.fromTo(ctl,{y:200,opacity:0},{y:0,opacity:1,duration:F(18),ease:'back.out(1.3)'},0);
tl.fromTo(ctl,{boxShadow:'0 60px 110px rgba(0,0,0,.6)'},{boxShadow:'0 24px 70px rgba(0,0,0,.55)',duration:F(18)},0);
// 光标画外滑入 24f 到右段上
gsap.set(cursor,{x:1750,y:950});
tl.to(cursor,{x:1050,y:640,duration:F(24),ease:'power3.out'},F(20));
// 按下 scale 0.86（3f 下 4f 回）+ 涟漪 12f
tl.to(cursor,{scale:.86,duration:F(3),ease:'power2.in'},F(46));
tl.to(cursor,{scale:1,duration:F(4),ease:'power2.out'},F(49));
tl.set(ripple,{x:960,y:64,opacity:.9,scale:.4},F(46));
tl.to(ripple,{scale:2.4,opacity:0,duration:F(12),ease:'power2.out'},F(46));
// thumb 严格 8f 滑到右段
tl.to(thumb,{x:540,duration:F(8),ease:'power3.out'},F(54));
// 到位同帧：新图标 spring 弹出、旧图标塌缩 width 归零让文字回流；段色对调
tl.fromTo('#icoB',{scale:0,width:0},{scale:1,width:64,duration:F(10),ease:'back.out(2.2)'},F(62));
tl.to('#icoA',{scale:0,width:0,duration:F(6),ease:'power2.in'},F(62));
tl.to('#segB',{color:'#0A0A0F',duration:F(6)},F(62));
tl.to('#segA',{color:'color-mix(in srgb, var(--fg) 55%, transparent)',duration:F(6)},F(62));
// 光标撤场
tl.to(cursor,{x:1500,y:980,opacity:0,duration:F(14),ease:'power2.in'},F(72));
// 新态静置（补齐到 110f）
tl.to({},{duration:F(24)},F(86));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
