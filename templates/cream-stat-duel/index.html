<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "leftLabel", "type": "string", "label": "左侧标签", "default": "上海 SHANGHAI"}, {"id": "leftValue", "type": "number", "label": "左侧数值", "default": 92}, {"id": "leftUnit", "type": "string", "label": "左侧单位", "default": "%"}, {"id": "rightLabel", "type": "string", "label": "右侧标签", "default": "亚马逊 AMAZON"}, {"id": "rightValue", "type": "number", "label": "右侧数值", "default": 90}, {"id": "rightUnit", "type": "string", "label": "右侧单位", "default": "%"}, {"id": "operator", "type": "enum", "label": "比较符号", "default": ">", "options": [{"value": ">", "label": "大于"}, {"value": "=", "label": "等于"}, {"value": "<", "label": "小于"}]}, {"id": "verdict", "type": "string", "label": "结论", "default": "上海湿度更高"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="../_lib/gsap.min.js"></script>
    <style>
*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #F5F0E6); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #F5F0E6); color: var(--foreground, #1D1D20);
  font-family:'Noto Sans SC','PingFang SC',sans-serif; }
.scene{ position:absolute; inset:0; padding:64px 80px; }
.card{ background:#FFFDF7; border:3px solid #1D1D20; border-radius:16px; box-shadow:6px 6px 0 #2A292B; }
.tape{ position:absolute; width:120px; height:32px; background:rgba(185,232,51,.6); border:2px solid #1D1D20;
  border-radius:4px; transform:rotate(-5deg); z-index:5; }
.tape.pink{ background:rgba(241,59,136,.35); transform:rotate(4deg); }
.tape.blue{ background:rgba(62,123,242,.3); transform:rotate(-3deg); }
.chip{ display:inline-flex; align-items:center; gap:8px; padding:6px 14px; background:#FFFDF7; border:3px solid #1D1D20;
  border-radius:999px; font-family:'Fredoka','Arial Rounded MT Bold',sans-serif; font-weight:700; font-size:18px;
  letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; box-shadow:4px 4px 0 #2A292B; }
.chip.lime{ background:#B9E833; } .chip.blue{ background:#3E7BF2; color:#FFFDF7; }
.chip.pink{ background:#F13B88; color:#FFFDF7; } .chip.orange{ background:#FF9F1C; }
.num{ font-family:'Fredoka','Arial Rounded MT Bold',sans-serif; font-weight:700; }
.mono{ font-family:'IBM Plex Mono','JetBrains Mono',monospace; font-weight:700; }
.dashline{ border:none; border-top:3px dashed #1D1D20; }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="6" data-track-index="1">

        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:80px;">
          <div class="dcard card" id="sideL" style="width:560px;padding:50px;text-align:center;">
            <span class="tape" style="left:-22px;top:-16px;"></span>
            <span class="chip blue" id="leftLabel"></span>
            <div class="num" style="margin-top:24px;font-size:180px;line-height:1;color:#3E7BF2;"><span class="dv">0</span><span class="du" style="font-size:60px;"></span></div>
          </div>
          <div id="badge" class="num" style="width:120px;height:120px;border-radius:50%;background:#FF9F1C;border:3px solid #1D1D20;box-shadow:5px 5px 0 #2A292B;display:flex;align-items:center;justify-content:center;font-size:40px;transform:scale(0) rotate(-8deg);"></div>
          <div class="dcard card" id="sideR" style="width:560px;padding:50px;text-align:center;">
            <span class="tape pink" style="right:-22px;top:-16px;"></span>
            <span class="chip pink" id="rightLabel"></span>
            <div class="num" style="margin-top:24px;font-size:180px;line-height:1;color:#F13B88;"><span class="dv">0</span><span class="du" style="font-size:60px;"></span></div>
          </div>
        </div>

      </section>
    </div>
    <script>
      const fallback = {"leftLabel": "上海 SHANGHAI", "leftValue": 92, "leftUnit": "%", "rightLabel": "亚马逊 AMAZON", "rightValue": 90, "rightUnit": "%", "operator": ">", "verdict": "上海湿度更高", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 6;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("leftLabel").textContent = v.leftLabel; $("rightLabel").textContent = v.rightLabel;
      $("badge").textContent = v.operator || "VS";
      document.querySelector("#sideL .du").textContent = v.leftUnit || "";
      document.querySelector("#sideR .du").textContent = v.rightUnit || "";
      tl.fromTo("#sideL", { x: -150, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#sideR", { x: 150, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.2);
      countTo(document.querySelector("#sideL .dv"), v.leftValue, 0.6, 1.3);
      countTo(document.querySelector("#sideR .dv"), v.rightValue, 0.6, 1.3);
      tl.to("#badge", { scale: 1, rotate: -8, duration: 0.5, ease: "back.out(2.5)" }, 1.4);
      const winner = Number(v.leftValue) >= Number(v.rightValue) ? "#sideL" : "#sideR";
      tl.to(winner, { y: -20, duration: 0.4, ease: "back.out(2)" }, 2.4);
      tl.to(".scene", { opacity: 0, duration: 0.5 }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
