<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "title", "type": "string", "label": "沸腾标题", "default": "手工的温度"}, {"id": "accent", "type": "color", "label": "强调色", "default": "#00FF00"}, {"id": "background", "type": "color", "label": "背景色", "default": "#0A0A0F"}, {"id": "foreground", "type": "color", "label": "文字色", "default": "#F4F4F2"}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg,#0A0A0F);
  color:var(--fg,#F4F4F2); font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; }

#bg{ position:absolute; inset:0; background:#101010; }
#bt{ position:absolute; left:0; right:0; top:420px; text-align:center; font-size:150px;
  color:#F2F0EB; letter-spacing:8px; }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.3" data-width="1920" data-height="1080">
<div id="bg"></div><svg width="0" height="0"><defs><filter id="boil"><feTurbulence id="tb" type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="0" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="8"/></filter></defs></svg><div id="bt"></div>
    </div>
    <script>
      const FB = {"title": "手工的温度", "accent": "#00FF00", "background": "#0A0A0F", "foreground": "#F4F4F2"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : FB;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4F4F2");
      document.documentElement.style.setProperty("--background", v.background ?? "#0A0A0F");
const $=(s)=>document.querySelector(s);
const de=document.documentElement;
de.style.setProperty('--accent',v.accent||'#00FF00');
de.style.setProperty('--bg',v.background||'#0A0A0F');
de.style.setProperty('--fg',v.foreground||'#F4F4F2');
const F=(f)=>f/30; // 30fps: 帧→秒
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

$('#bt').textContent=v.title||'';
// 静止 20f → 沸腾 60f（seed 每 3f 阶梯换，10fps 手翻书质感）→ 摘罩静止 20f
const tb=document.getElementById('tb');
tl.set('#bt',{filter:'url(#boil)'},F(20));
const sd={n:0};
tl.to(sd,{n:20,duration:F(60),ease:'steps(20)',onUpdate:()=>{
  tb.setAttribute('seed',Math.round(sd.n)*3); // ~每 3f 重描一次
}},F(20));
tl.set('#bt',{filter:'none'},F(80)); // 摘罩归位本身就是收束
tl.to({},{duration:F(20)},F(80));

      window.__timelines.main = tl;
    </script>
  </body>
</html>
