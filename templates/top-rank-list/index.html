<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"影响效率的 Top 3 因素"},{"id":"rank1","type":"string","label":"第一名","default":"资料分散"},{"id":"value1","type":"number","label":"第一名数值","default":48},{"id":"rank2","type":"string","label":"第二名","default":"缺少模板"},{"id":"value2","type":"number","label":"第二名数值","default":31},{"id":"rank3","type":"string","label":"第三名","default":"反复改稿"},{"id":"value3","type":"number","label":"第三名数值","default":21},{"id":"unit","type":"string","label":"单位","default":"%"},{"id":"caption","type":"string","label":"说明","default":"真正拖慢生产的，往往不是创意，而是重复整理和重复决策。"},{"id":"accent","type":"color","label":"强调色","default":"#00FF00"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: 'MiSans SemiBold'; src: url('../_fonts/MiSansSemiBold.ttf') format('truetype'); }
@font-face { font-family: 'MEBHeiHeiTi'; src: url('../_fonts/MEBHeiHeiTi.ttf') format('truetype'); font-weight: 100 1000; }

*{ box-sizing: border-box; }
html, body{ margin:0; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); }
#root{ position:relative; width:1920px; height:1080px; overflow:hidden; background: var(--background, #0A0A0B); color: var(--foreground, #F5F5F4);
  font-family:'MEBHeiHeiTi','PingFang SC','Microsoft YaHei',sans-serif; }
.scene{ position:absolute; inset:0; padding:72px 88px; }
.gridbg{ position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px); background-size:48px 48px; }
.chip{ display:inline-flex; align-items:center; gap:10px; padding:8px 16px; border:1px solid #2A2A2E; border-radius:999px;
  font-size:18px; letter-spacing:.16em; color:#9CA3AF; text-transform:uppercase; white-space:nowrap; }
.chip b{ color:var(--accent,#00FF00); font-weight:700; letter-spacing:.05em; }
.num{ font-family:'MiSans SemiBold','PingFang SC',sans-serif; font-weight:700; }
.wipe{ clip-path: inset(0 100% 0 0); }
</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
      <section id="scene" class="scene" data-start="0" data-duration="5.5" data-track-index="1">

        <div class="gridbg"></div>
        <header style="position:relative;z-index:2;margin-bottom:56px;">
          <span class="chip"><b>TOP</b>排行</span>
          <h1 id="title" class="num" style="margin:18px 0 0;font-size:52px;"></h1>
        </header>
        <div id="rows" style="display:flex;flex-direction:column;gap:34px;"></div>
        <style>
          .rrow{ display:flex; align-items:center; gap:34px; opacity:0; transform:translateX(-100px); }
          .rk{ width:110px; font-size:74px; line-height:1; color:transparent; -webkit-text-stroke:2px #6B7280; text-align:center; flex:none; }
          .rrow.first .rk{ -webkit-text-stroke:2px var(--accent,#00FF00); }
          .rbody{ flex:1; }
          .rname{ font-size:34px; margin-bottom:12px; display:flex; justify-content:space-between; }
          .rname .rv{ color:#9CA3AF; }
          .rrow.first .rname .rv{ color:var(--accent,#00FF00); }
          .rtrack{ height:34px; background:#1A1A1E; border-radius:8px; overflow:hidden; }
          .rbar{ height:100%; background:#3F3F46; transform:scaleX(0); transform-origin:left; border-radius:8px; }
          .rrow.first .rbar{ background:linear-gradient(90deg,color-mix(in srgb, var(--accent) 45%, transparent),var(--accent,#00FF00)); }
        </style>

      </section>
    </div>
    <script>
      const fallback = {"title": "影响效率的 Top 3 因素", "rank1": "资料分散", "value1": 48, "rank2": "缺少模板", "value2": 31, "rank3": "反复改稿", "value3": 21, "unit": "%", "caption": "真正拖慢生产的，往往不是创意，而是重复整理和重复决策。", "accent": "#00FF00", "foreground": "#F4EFE7", "exportMode": "transparent"};
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.style.setProperty("--foreground", v.foreground ?? "#F4EFE7");
      document.documentElement.style.setProperty("--accent", v.accent ?? "#00FF00");
      const $ = (id) => document.getElementById(id);
      const split = (s) => String(s ?? "").split(",").map((x) => x.trim()).filter(Boolean);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 5.5;
      const countTo = (el, target, at, dur = 1.1, dec = 0) => {
        const o = { n: 0 };
        tl.to(o, { n: Number(target) || 0, duration: dur, ease: "power2.out",
          onUpdate: () => { el.textContent = dec ? o.n.toFixed(dec) : Math.round(o.n).toLocaleString("en-US"); } }, at);
      };

      $("title").textContent = v.title;
      const items = [[v.rank1, Number(v.value1)], [v.rank2, Number(v.value2)], [v.rank3, Number(v.value3)]].filter((x) => x[0]);
      const maxV = Math.max(...items.map((x) => x[1]), 1);
      items.forEach(([name, val], i) => {
        const row = document.createElement("div");
        row.className = "rrow" + (i === 0 ? " first" : "");
        row.innerHTML = `<span class="rk num">0${i + 1}</span>
          <div class="rbody">
            <div class="rname"><span>${name}</span><span class="rv num">0</span></div>
            <div class="rtrack"><div class="rbar" data-w="${val / maxV}"></div></div>
          </div>`;
        $("rows").appendChild(row);
        row.dataset.val = val;
      });
      tl.fromTo("header", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "power3.out" }, 0.1);
      document.querySelectorAll(".rrow").forEach((row, i) => {
        tl.to(row, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.5 + i * 0.45);
        tl.to(row.querySelector(".rbar"), { scaleX: Number(row.querySelector(".rbar").dataset.w), duration: 0.9, ease: "power4.inOut" }, 0.7 + i * 0.45);
        countTo(row.querySelector(".rv"), row.dataset.val, 0.7 + i * 0.45, 0.9);
      });
      tl.to(".scene", { clipPath: "inset(0 100% 0 0)", duration: 0.5, ease: "power2.in" }, DUR - 0.6);

      window.__timelines.main = tl;
    </script>
  </body>
</html>
