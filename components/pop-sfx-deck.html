<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"text","name":"拟声词串","type":"string","label":"用逗号分隔，建议 3–5 个","default":"咣！,铛！,嘭！,啪！"},{"id":"accent","name":"强调色","type":"color","label":"字色 / 强调","default":"#FF6B35"},{"id":"color","name":"硬阴影色","type":"color","label":"描边硬阴影深色","default":"#241C18"},{"id":"fontSize","name":"字号","type":"number","label":"字号 px（超出画面自动缩）","default":52},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":2.8}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>拟声词连发</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    /* 透明底：这层是挂件，底下是用户自己的实拍 */
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }

  .p-grp { position: absolute; inset: 0; }
  /* 每个拟声词一层全屏 flex，位置用 x/y 平移出去：
     居中交给 flex，偏移交给 transform，两者互不干扰 */
  .p-dw { position: absolute; inset: 0; display: flex;
          align-items: center; justify-content: center; opacity: 0; }
  .p-dws {
    display: inline-block; white-space: nowrap;
    font-size: var(--fs, 52px); font-weight: 900; line-height: 1;
    letter-spacing: -.01em; color: var(--ac);
    transform-origin: 50% 50%;
    -webkit-font-smoothing: antialiased;
  }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"text":"咣！,铛！,嘭！,啪！","accent":"#FF6B35","color":"#241C18","fontSize":52,"duration":2.8};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--ink', v.color || FALLBACK.color);
  root.style.setProperty('--ac2', '#FFC93C');
  const dur = parseFloat(v.duration) || 2.8;
  const fs = parseFloat(v.fontSize) || 52;
  root.style.setProperty('--fs', fs + 'px');
  const raw = String(v.text == null ? FALLBACK.text : v.text);
  let words = raw.split(/[,，、\/\s]+/).filter(function (s) { return s.length; });
  if (words.length < 2) words = ['咣！', '铛！', '嘭！', '啪！'];
  if (words.length > 6) words = words.slice(0, 6);

  const stage = document.getElementById('stage');
  function put(tag, cls, css, text_, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text_ != null) el.textContent = text_;
    (parent || stage).appendChild(el);
    return el;
  }

  /* 8 方向白描边 + 硬阴影，硬阴影排最底层。全程字符串拼接，不用 % 格式化 */
  function outlineShadow(r, d, off, ink) {
    const W = 'rgba(255,255,255,1)';
    return [
      off + 'px ' + off + 'px 0 ' + ink,
      r + 'px 0 0 ' + W, (0 - r) + 'px 0 0 ' + W,
      '0 ' + r + 'px 0 ' + W, '0 ' + (0 - r) + 'px 0 ' + W,
      d + 'px ' + d + 'px 0 ' + W, (0 - d) + 'px ' + d + 'px 0 ' + W,
      d + 'px ' + (0 - d) + 'px 0 ' + W, (0 - d) + 'px ' + (0 - d) + 'px 0 ' + W
    ].join(',');
  }

  const grp = put('div', 'p-grp', '');
  /* 收尾叠成一团的位置与歪斜角：固定数组，第 4 个压在最上面 */
  const POSE = [{ x: -46, y: -30, r: -9 }, { x: 40, y: -18, r: 7 },
                { x: -22, y: 26, r: -5 }, { x: 12, y: 2, r: 4 },
                { x: 34, y: 30, r: -3 }, { x: -30, y: 8, r: 6 }];
  const ink = v.color || FALLBACK.color;
  const layers = words.map(function (w, i) {
    const p = POSE[i % POSE.length];
    const layer = put('div', 'p-dw', '', null, grp);
    const span = put('span', 'p-dws', '', w, layer);
    span.style.textShadow = outlineShadow(2.8, 2.1, 4.5, ink);
    return { layer: layer, span: span, pose: p };
  });

  const tl = gsap.timeline({ paused: true });
  /* 注册：云渲染的 settle / 逐帧定位靠 window.__timelines 驱动时间轴 */
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  /* 收口：取最宽的一个定字号，保证一整串都不越界 */
  (function fit() {
    root.style.setProperty('--fs', fs + 'px');
    let widest = 0;
    layers.forEach(function (L) { widest = Math.max(widest, L.span.scrollWidth); });
    const avail = 400;
    if (widest > avail) {
      root.style.setProperty('--fs', Math.max(20, Math.floor(fs * avail / widest)) + 'px');
    }
  })();

  /* 间隔递减：0.14 → 0.112 → 0.09 … 越冲越急，最后一个才叠成一团。
     头一个字从 .06 起：再晚一点，开头小半秒画面是空的。 */
  let at = .06;
  let lastLand = 0;
  layers.forEach(function (L, i) {
    const p = L.pose;
    const land = at + .28;
    tl.fromTo(L.layer,
      { x: p.x, y: p.y - 130, scale: 1.3, rotation: p.r - 18, opacity: 0 },
      { x: p.x, y: p.y, scale: 1, rotation: p.r, opacity: 1, duration: .28,
        ease: 'power4.in', immediateRender: false }, at);
    // 落地压扁一下
    tl.to(L.layer, { scaleX: 1.12, scaleY: .8, duration: .09, yoyo: true, repeat: 1,
      ease: 'power2.inOut' }, land);
    lastLand = land + .18;
    at += .14 * Math.pow(.8, i);
  });

  // 最后一个压上去，整团抖一下
  tl.fromTo(grp, { x: 0, y: 0 }, {
    keyframes: [
      { x: 2.4, y: -1.8, duration: .045, ease: 'none' },
      { x: -2.2, y: 1.6, duration: .045, ease: 'none' },
      { x: 1.8, y: 2, duration: .045, ease: 'none' },
      { x: -1.4, y: -1.6, duration: .045, ease: 'none' },
      { x: 1, y: 1, duration: .045, ease: 'none' },
      { x: 0, y: 0, duration: .045, ease: 'none' }
    ], immediateRender: false
  }, lastLand);
  // 抖完之后整团轻轻鼓一下，定住
  tl.to(grp, { scale: 1.03, duration: .3, yoyo: true, repeat: 1,
    ease: 'sine.inOut' }, lastLand + .28);

  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  tl.play(0);
})();
</script>
</body>
</html>
