<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"text","name":"文案","type":"string","label":"主文案","default":"过曝了！"},{"id":"accent","name":"强调色","type":"color","label":"强调色","default":"#FF6B35"},{"id":"accent2","name":"次强调色","type":"color","label":"次强调色","default":"#FFC93C"},{"id":"accent3","name":"辅助色","type":"color","label":"辅助色","default":"#2EC4B6"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":2.6}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>饱和度拉满爆开</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  .p-tint { position: absolute; inset: 0; background: rgba(12, 12, 18, .50); }
  .p-halo { position: absolute; inset: 0;
    background: radial-gradient(72% 82% at 50% 50%, rgba(0,0,0,.52) 0%, rgba(0,0,0,.28) 54%, rgba(0,0,0,0) 84%); }
  /* 两层色彩层：靠 mix-blend-mode 压在锚点上，不是简单盖一块半透明色 */
  .p-clr1 { position: absolute; inset: 0; opacity: 0; mix-blend-mode: hard-light; pointer-events: none;
    background: linear-gradient(118deg, var(--ac) 0%, var(--ac2) 46%, var(--ac3) 100%); }
  .p-clr2 { position: absolute; inset: 0; opacity: 0; mix-blend-mode: color-dodge; pointer-events: none;
    background: radial-gradient(46% 52% at 50% 50%, rgba(255,201,60,.85) 0%, rgba(255,107,53,.30) 58%, rgba(0,0,0,0) 82%); }
  .p-ray { position: absolute; left: 240px; top: 135px; width: 260px; height: 4px; margin-top: -2px;
    transform-origin: 0 50%; border-radius: 3px; will-change: transform, opacity; }
  .p-ring { position: absolute; left: 240px; top: 135px; width: 120px; height: 120px; margin: -60px 0 0 -60px;
    border-radius: 50%; border: 5px solid var(--ac2); will-change: transform, opacity; }
  .p-wordrow { position: absolute; left: 0; right: 0; top: 88px; display: flex; justify-content: center; }
  .p-word { display: inline-block; white-space: nowrap; font-size: 54px; font-weight: 900;
    line-height: 1.06; color: var(--fg); -webkit-text-stroke: 2px var(--ink);
    text-shadow: 5px 5px 0 rgba(0,0,0,.85); }
  .p-bot { position: absolute; left: 50%; top: 178px; margin-left: -20px; width: 40px; height: 36px;
    background: var(--ac2); border: 3px solid var(--ink); border-radius: 7px 7px 4px 4px; }
  .p-bot::before, .p-bot::after { content: ''; position: absolute; top: 8px; width: 7px; height: 9px;
    background: var(--ink); border-radius: 50%; }
  .p-bot::before { left: 7px; }
  .p-bot::after { right: 7px; }
  .p-bot i { position: absolute; left: 10px; bottom: 5px; width: 20px; height: 9px;
    border-bottom: 3px solid var(--ink); border-radius: 0 0 12px 12px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"text":"过曝了！","accent":"#FF6B35","accent2":"#FFC93C","accent3":"#2EC4B6","duration":2.6};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  const dur = parseFloat(v.duration) || 2.6;
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--ac2', v.accent2 || FALLBACK.accent2);
  root.style.setProperty('--ac3', v.accent3 || FALLBACK.accent3);
  root.style.setProperty('--fg', '#FFF8EE');
  root.style.setProperty('--ink', '#1B1B24');
  const text = String(v.text == null ? FALLBACK.text : v.text);

  const stage = document.getElementById('stage');
  function put(tag, cls, css, tx, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (tx != null) el.textContent = tx;
    (parent || stage).appendChild(el);
    return el;
  }

  put('div', 'p-tint');
  put('div', 'p-halo');

  const RAYS = 24;
  const rays = [];
  const rayCol = ['var(--ac)', 'var(--ac2)', 'var(--ac3)', '#FFFFFF'];
  for (let i = 0; i < RAYS; i++) {
    const ang = i * 15;
    const len = 170 + ((i * 29) % 110);
    const r = put('div', 'p-ray',
      'width:' + len + 'px;height:' + (3 + (i * 7) % 4) + 'px;background:' + rayCol[i % 4] + ';opacity:0;');
    r.dataset.ang = ang;
    rays.push(r);
  }
  const rings = [];
  for (let i = 0; i < 3; i++) {
    const rg = put('div', 'p-ring', 'border-color:' + (i % 2 ? 'var(--ac)' : 'var(--ac2)') + ';opacity:0;');
    rings.push(rg);
  }

  const bot = put('div', 'p-bot');
  put('i', '', '', null, bot);
  const row = put('div', 'p-wordrow');
  const word = put('div', 'p-word', '', text, row);

  const clr1 = put('div', 'p-clr1');
  const clr2 = put('div', 'p-clr2');

  function fitText(el, maxPx, avail, minPx) {
    el.style.fontSize = maxPx + 'px';
    el.style.whiteSpace = 'nowrap';
    const natural = el.scrollWidth;
    if (natural > avail && natural > 0) {
      el.style.fontSize = Math.max(minPx, Math.floor(maxPx * avail / natural)) + 'px';
    }
  }
  fitText(word, 54, 420, 20);

  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  tl.fromTo(word, { scale: .2, opacity: 0 },
    { scale: 1, opacity: 1, duration: .42, ease: 'back.out(2.4)' }, 0);
  tl.fromTo(bot, { scale: .2, opacity: 0, y: 14 },
    { scale: 1, opacity: 1, y: 0, duration: .38, ease: 'back.out(2.6)' }, .06);

  /* 爆开包络 B(t)：0.06 起爆、0.16 冲到顶、之后指数回落。
     只读绝对时间，不累加，所以 settle 来回扫时间轴每次结果一样。 */
  const B0 = .06, B1 = .16;
  const burst = (t) => {
    if (t <= B0) return 0;
    if (t <= B1) return (t - B0) / (B1 - B0);
    return Math.exp(-(t - B1) * 3.3);
  };

  const P = { t: 0 };
  const paint = (t) => {
    const B = burst(t);
    for (let i = 0; i < RAYS; i++) {
      const d = i * .004;
      const u = Math.max(0, Math.min(1, (t - d - B0) / .30));
      const g = u * u * (3 - 2 * u);
      const el = rays[i];
      el.style.transform = 'rotate(' + el.dataset.ang + 'deg) scaleX(' + (g * (1 + B * .5)).toFixed(3) + ')';
      el.style.opacity = (B * (.45 + .5 * ((i * 17) % 5) / 4)).toFixed(3);
    }
    for (let i = 0; i < rings.length; i++) {
      const u = Math.max(0, Math.min(1, (t - B0 - i * .11) / .58));
      const e = 1 - Math.pow(1 - u, 3);
      rings[i].style.transform = 'scale(' + (.3 + e * 2.3).toFixed(3) + ')';
      rings[i].style.opacity = ((1 - u) * .8).toFixed(3);
    }
    clr1.style.opacity = Math.min(1, B * .92).toFixed(3);
    clr2.style.opacity = Math.min(1, B * .60).toFixed(3);
    word.style.filter = 'saturate(' + (1 + B * 1.7).toFixed(2) + ') contrast(' + (1 + B * .28).toFixed(2) + ')';
    bot.style.filter = 'saturate(' + (1 + B * 1.5).toFixed(2) + ')';
  };
  tl.fromTo(P, { t: 0 }, {
    t: dur, duration: dur, ease: 'none',
    onUpdate() { paint(P.t); }
  }, 0);
  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  tl.play(0);
  paint(0);
})();
</script>
</body>
</html>
