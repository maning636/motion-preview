<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"moods","name":"表情序列","type":"string","label":"表情序列（逗号分隔）","default":"plain,smile,star,angry"},{"id":"accent","name":"角色色","type":"color","label":"角色色","default":"#FF6B35"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":3.4}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>方块角色表情切换</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  :root {
    --ac2: #FFC93C;
    --ac3: #2EC4B6;
    --ink: #241C18;
    --fg: #FFF8EE;
  }

  .pop-spark { position: absolute; left: 100px; top: -4px; width: 36px; height: 36px;
    background: var(--ac2); opacity: 0;
    clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%); }

  .pop-hero { position: absolute; left: 190px; top: 106px; width: 100px; height: 92px;
    transform-origin: 50% 100%; opacity: 0; }
  .pop-leg { position: absolute; top: 71px; width: 20px; height: 21px;
    border-radius: 3px 3px 9px 9px; background: var(--ac); border: 3px solid var(--ink); }
  .pop-leg-l { left: 22px; }
  .pop-leg-r { left: 54px; }
  .pop-arm { position: absolute; top: 34px; width: 24px; height: 15px; z-index: 1;
    border-radius: 15px; background: var(--ac); border: 3px solid var(--ink); }
  .pop-arm-l { left: -7px; transform-origin: 100% 50%; }
  .pop-arm-r { left: 83px; transform-origin: 0 50%; }
  .pop-body { position: absolute; left: 14px; top: 0; width: 72px; height: 74px; z-index: 2;
    border-radius: 24px 26px 22px 26px; background: var(--ac); border: 3px solid var(--ink); }

  /* 每个表情是一整层，覆盖在同一张脸上 */
  .pop-mood { position: absolute; left: 0; top: 0; width: 72px; height: 74px;
    opacity: 0; transform-origin: 50% 42%; }
  .m-eye { position: absolute; top: 22px; width: 20px; height: 24px;
    border-radius: 50%; background: var(--ink); }
  .m-eye-l { left: 12px; }
  .m-eye-r { left: 40px; }
  .m-arc { position: absolute; top: 27px; width: 22px; height: 13px;
    border-bottom: 4px solid var(--ink); border-radius: 0 0 14px 14px; }
  .m-arc-l { left: 11px; }
  .m-arc-r { left: 39px; }
  .m-star-ink { position: absolute; top: 18px; width: 30px; height: 30px;
    background: var(--ink);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .m-star { position: absolute; top: 20px; width: 26px; height: 26px;
    background: var(--ac2);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .m-star-l-ink { left: 7px; }
  .m-star-r-ink { left: 35px; }
  .m-star-l { left: 9px; }
  .m-star-r { left: 37px; }
  .m-mouth-o { position: absolute; left: 23px; top: 48px; width: 26px; height: 20px;
    border-radius: 50%; background: var(--ink); }
  .m-brow { position: absolute; top: 19px; width: 22px; height: 5px;
    border-radius: 3px; background: var(--ink); }
  .m-brow-l { left: 10px; transform: rotate(-20deg); }
  .m-brow-r { left: 40px; transform: rotate(20deg); }
  .m-pupil { position: absolute; top: 26px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--ink); }
  .m-pupil-l { left: 13px; }
  .m-pupil-r { left: 41px; }
  .m-smile-m { position: absolute; left: 19px; top: 49px; width: 34px; height: 17px;
    border-bottom: 5px solid var(--ink); border-radius: 0 0 18px 18px; }
  .m-frown { position: absolute; left: 20px; top: 55px; width: 32px; height: 14px;
    border-top: 5px solid var(--ink); border-radius: 18px 18px 0 0; }
  .m-bar { position: absolute; left: 24px; top: 54px; width: 24px; height: 5px;
    border-radius: 3px; background: var(--ink); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"moods":"plain,smile,star,angry","accent":"#FF6B35","duration":3.4};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  const dur = parseFloat(v.duration) || FALLBACK.duration;

  const stage = document.getElementById('stage');
  function put(tag, cls, css, text, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text != null) el.textContent = text;
    (parent || stage).appendChild(el);
    return el;
  }

  // ——— 方块小角色 ———
  const hero = put('div', 'pop-hero');
  put('div', 'pop-leg pop-leg-l', '', null, hero);
  put('div', 'pop-leg pop-leg-r', '', null, hero);
  put('div', 'pop-arm pop-arm-l', '', null, hero);
  put('div', 'pop-arm pop-arm-r', '', null, hero);
  const body = put('div', 'pop-body', '', null, hero);
  const spark = put('div', 'pop-spark', '', null, hero);

  // ——— 表情库：名字 → 一层 DOM ———
  const KNOWN = ['plain', 'smile', 'star', 'angry'];
  function buildMood(name, parent) {
    const layer = put('div', 'pop-mood', '', null, parent);
    if (name === 'smile') {
      put('div', 'm-arc m-arc-l', '', null, layer);
      put('div', 'm-arc m-arc-r', '', null, layer);
      put('div', 'm-smile-m', '', null, layer);
    } else if (name === 'star') {
      put('div', 'm-star-ink m-star-l-ink', '', null, layer);
      put('div', 'm-star-ink m-star-r-ink', '', null, layer);
      put('div', 'm-star m-star-l', '', null, layer);
      put('div', 'm-star m-star-r', '', null, layer);
      put('div', 'm-mouth-o', '', null, layer);
    } else if (name === 'angry') {
      put('div', 'm-brow m-brow-l', '', null, layer);
      put('div', 'm-brow m-brow-r', '', null, layer);
      put('div', 'm-pupil m-pupil-l', '', null, layer);
      put('div', 'm-pupil m-pupil-r', '', null, layer);
      put('div', 'm-frown', '', null, layer);
    } else {
      put('div', 'm-eye m-eye-l', '', null, layer);
      put('div', 'm-eye m-eye-r', '', null, layer);
      put('div', 'm-bar', '', null, layer);
    }
    return layer;
  }

  const raw = String(v.moods == null || v.moods === '' ? FALLBACK.moods : v.moods);
  const names = raw.split(/[,，\s]+/).filter(Boolean).map(s => s.toLowerCase());
  const list = (names.length ? names : KNOWN.slice()).map(s => (KNOWN.indexOf(s) >= 0 ? s : 'plain'));
  const layers = list.map(n => buildMood(n, body));

  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  // 每个表情停留约 0.5s；表情多时自动压缩，但保证切换过程读得清
  const INTRO = .34, TAIL = .34, n = layers.length;
  const step = Math.min(.5, Math.max(n * .26, dur - INTRO - TAIL) / n);

  // 入场
  tl.fromTo(hero, { scale: .55, opacity: 0, y: 10 },
    { scale: 1, opacity: 1, y: 0, duration: INTRO, ease: 'back.out(2.6)' }, 0);

  // 逐个表情切换，每步约 0.5s，带一个小弹过渡
  layers.forEach((layer, i) => {
    const t = INTRO + i * step;
    if (i === 0) {
      tl.fromTo(layer, { scale: .3, opacity: 0, rotate: -12 },
        { scale: 1, opacity: 1, rotate: 0, duration: .2, ease: 'back.out(3)' }, t);
      return;
    }
    tl.to(layers[i - 1], { scale: .7, opacity: 0, duration: .13, ease: 'power2.in' }, t);
    tl.fromTo(layer, { scale: .3, opacity: 0, rotate: -12 },
      { scale: 1, opacity: 1, rotate: 0, duration: .2, ease: 'back.out(3)' }, t + .06);
    tl.fromTo(spark, { scale: .2, opacity: 0, rotate: -40 },
      { scale: 1.15, opacity: .95, rotate: 10, duration: .13, ease: 'back.out(3)' }, t + .06);
    tl.to(spark, { scale: .4, opacity: 0, duration: .2, ease: 'power2.in' }, t + .19);
    tl.to(hero, { y: -4, duration: .08, repeat: 1, yoyo: true, ease: 'power1.inOut' }, t + .06);
  });

  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  tl.play(0);
})();
</script>
</body>
</html>
