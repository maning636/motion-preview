<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"accent","name":"角色色","type":"color","label":"角色色","default":"#FF6B35"},{"id":"accent2","name":"道具色","type":"color","label":"道具色","default":"#FFC93C"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":3.6}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>方块角色抛物线投掷</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  :root {
    --ink: #241C18;
    --fg: #FFF8EE;
    --dust: #F7E2BE;
  }

  .pop-shadow { position: absolute; left: 96px; top: 188px; width: 100px; height: 18px;
    border-radius: 50%; background: rgba(27, 27, 36, .28); }
  .pop-ring { position: absolute; left: 410px; top: 190px; width: 64px; height: 16px;
    border-radius: 50%; border: 3px solid var(--ink); background: var(--dust); opacity: 0; }

  .pop-hero { position: absolute; left: 96px; top: 106px; width: 100px; height: 92px;
    transform-origin: 50% 100%; opacity: 0; }
  .pop-leg { position: absolute; top: 71px; width: 20px; height: 21px;
    border-radius: 3px 3px 9px 9px; background: var(--ac); border: 3px solid var(--ink); }
  .pop-leg-l { left: 22px; }
  .pop-leg-r { left: 54px; }
  .pop-arm { position: absolute; top: 34px; width: 24px; height: 15px; z-index: 1;
    border-radius: 15px; background: var(--ac); border: 3px solid var(--ink); }
  .pop-arm-l { left: -7px; transform-origin: 100% 50%; }
  .pop-arm-r { left: 83px; transform-origin: 0 50%; }
  .pop-body { position: absolute; left: 14px; top: 0; width: 72px; height: 74px; z-index: 2;
    border-radius: 24px 26px 22px 26px; background: var(--ac); border: 3px solid var(--ink); }
  .pop-eye { position: absolute; top: 23px; width: 20px; height: 23px;
    border-radius: 50%; background: var(--ink); }
  .pop-eye-l { left: 12px; }
  .pop-eye-r { left: 40px; }
  .pop-mouth { position: absolute; left: 21px; top: 53px; width: 30px; height: 14px;
    border-bottom: 4px solid var(--ink); border-radius: 0 0 16px 16px; }

  /* 被抛出去的小方块 */
  .pop-cube { position: absolute; left: 196px; top: 128px; width: 28px; height: 28px;
    border-radius: 9px; background: var(--ac2); border: 3px solid var(--ink); opacity: 0; }
  .pop-cube::after { content: ''; position: absolute; left: 5px; top: 5px;
    width: 9px; height: 9px; border-radius: 3px; background: rgba(255, 248, 238, .7); }
  /* 飞行拖尾：三段递减的残影 */
  .pop-trail { position: absolute; left: 196px; top: 132px; height: 12px;
    border-radius: 6px; background: var(--ac2); opacity: 0; }
  .pop-shout { position: absolute; left: 214px; top: 62px; width: 104px; text-align: center;
    font-size: 24px; font-weight: 800; color: var(--ink); opacity: 0;
    -webkit-text-stroke: 3px var(--fg); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"accent":"#FF6B35","accent2":"#FFC93C","duration":3.6};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--ac2', v.accent2 || FALLBACK.accent2);
  const dur = parseFloat(v.duration) || FALLBACK.duration;

  const stage = document.getElementById('stage');
  function put(tag, cls, css, text, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text != null) el.textContent = text;
    (parent || stage).appendChild(el);
    return el;
  }
  function fitText(el, avail, max, min) {
    const ws = el.style.whiteSpace;
    el.style.whiteSpace = 'nowrap';
    const natural = el.scrollWidth;
    el.style.whiteSpace = ws;
    if (natural > avail) el.style.fontSize = Math.max(min, Math.floor(max * avail / natural)) + 'px';
  }

  // ——— 方块小角色（投掷手）———
  const shadow = put('div', 'pop-shadow');
  const ring = put('div', 'pop-ring');
  const trail = [
    put('div', 'pop-trail', 'width:16px;'),
    put('div', 'pop-trail', 'width:11px;height:9px;top:135px;'),
    put('div', 'pop-trail', 'width:7px;height:7px;top:136px;')
  ];
  const cube = put('div', 'pop-cube');

  const hero = put('div', 'pop-hero');
  const armL = put('div', 'pop-arm pop-arm-l', '', null, hero);
  const armR = put('div', 'pop-arm pop-arm-r', '', null, hero);
  put('div', 'pop-leg pop-leg-l', '', null, hero);
  put('div', 'pop-leg pop-leg-r', '', null, hero);
  const body = put('div', 'pop-body', '', null, hero);
  put('div', 'pop-eye pop-eye-l', '', null, body);
  put('div', 'pop-eye pop-eye-r', '', null, body);
  put('div', 'pop-mouth', '', null, body);

  const shout = put('div', 'pop-shout', '', '嘿!');
  fitText(shout, 104, 24, 12);

  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  // 入场，手里已经拿着小方块
  tl.fromTo(shadow, { opacity: 0, scale: .6 }, { opacity: .28, scale: 1, duration: .26, ease: 'power2.out' }, 0);
  tl.fromTo(hero, { scale: .7, opacity: 0, y: 10 },
    { scale: 1, opacity: 1, y: 0, duration: .28, ease: 'back.out(2.2)' }, 0);
  tl.fromTo(cube, { scale: .4, opacity: 0, rotate: -30 },
    { scale: 1, opacity: 1, rotate: 0, duration: .2, ease: 'back.out(3)' }, .10);

  // 0.38 蓄力压缩：身体下蹲、手往后拉
  tl.to(hero, { scaleY: .78, scaleX: 1.14, y: 9, rotate: -5, duration: .3, ease: 'power2.in' }, .38);
  tl.to(armR, { rotate: -74, duration: .3, ease: 'power2.in' }, .38);
  tl.to(armL, { rotate: 26, duration: .3, ease: 'power2.in' }, .38);
  tl.to(shadow, { scaleX: 1.14, scaleY: .8, duration: .3, ease: 'power2.in' }, .38);

  // 0.68 抛出：手臂甩出去，身体反向拉伸
  tl.to(armR, { rotate: 66, duration: .14, ease: 'power4.out' }, .68);
  tl.to(armL, { rotate: -30, duration: .14, ease: 'power4.out' }, .68);
  tl.to(hero, { scaleY: 1.12, scaleX: .90, y: -12, rotate: 5, duration: .16, ease: 'power2.out' }, .68);

  // 小方块出手：x 线性推进，y 走 power2.out → power2.in 的抛物线
  const T0 = .70;
  const GROUND = 42;            // 方块底部回到地面线的位移
  tl.to(cube, { rotation: 720, duration: .84, ease: 'none' }, T0);
  tl.to(cube, { x: 232, duration: .84, ease: 'none' }, T0);
  tl.to(cube, { y: -92, duration: .40, ease: 'power2.out' }, T0);
  tl.to(cube, { y: GROUND, duration: .44, ease: 'power2.in' }, T0 + .40);

  // 拖尾残影跟着走
  trail.forEach((el, i) => {
    const off = 26 + i * 22;
    tl.to(el, { opacity: .45 - i * .12, duration: .1, ease: 'power2.out' }, T0 + i * .03);
    tl.to(el, { x: 232 - off, y: -92 + i * 6, rotation: 360, duration: .84, ease: 'none' }, T0);
    tl.to(el, { y: GROUND + i * 4, duration: .44, ease: 'power2.in' }, T0 + .40);
    tl.to(el, { opacity: 0, duration: .16, ease: 'power2.in' }, T0 + .78);
  });

  // 「嘿！」喊出来
  tl.fromTo(shout, { scale: .25, opacity: 0, rotate: -18 },
    { scale: 1, opacity: 1, rotate: -6, duration: .2, ease: 'back.out(3)' }, .64);
  tl.to(shout, { opacity: 0, y: -14, duration: .18, ease: 'power2.in' }, 1.16);

  // 投完身体回正
  tl.to(hero, { scaleY: 1, scaleX: 1, y: 0, rotate: 0, duration: .24, ease: 'back.out(2.6)' }, .84);
  tl.to(armR, { rotate: 6, duration: .28, ease: 'back.out(2.4)' }, .82);
  tl.to(armL, { rotate: 0, duration: .28, ease: 'back.out(2.4)' }, .82);
  tl.to(shadow, { scaleX: 1, scaleY: 1, duration: .26, ease: 'back.out(2)' }, .82);

  // 1.54 落地压扁 → 弹起 → 再落地弹两下
  tl.to(cube, { scaleY: .70, scaleX: 1.28, duration: .08, ease: 'power2.out' }, 1.54);
  tl.to(cube, { scaleY: 1, scaleX: 1, duration: .1, ease: 'back.out(3.4)' }, 1.62);
  tl.to(cube, { y: GROUND - 21, duration: .16, ease: 'power2.out' }, 1.68);
  tl.to(cube, { y: GROUND, scaleY: .80, scaleX: 1.16, duration: .18, ease: 'power2.in' }, 1.84);
  tl.to(cube, { scaleY: 1, scaleX: 1, duration: .12, ease: 'back.out(3.6)' }, 2.02);
  tl.to(cube, { y: GROUND - 9, duration: .14, ease: 'power2.out' }, 2.14);
  tl.to(cube, { y: GROUND, scaleY: .86, scaleX: 1.08, duration: .15, ease: 'power2.in' }, 2.28);
  tl.to(cube, { scaleY: 1, scaleX: 1, duration: .14, ease: 'back.out(4)' }, 2.43);

  // 落地的扬尘
  tl.fromTo(ring, { scale: .24, opacity: .9 }, { scale: 1.8, opacity: 0, duration: .46, ease: 'power2.out' }, 1.54);

  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  tl.play(0);
})();
</script>
</body>
</html>
