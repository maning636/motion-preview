<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"color","name":"字色","type":"color","label":"正文颜色","default":"#F4F1EA"},{"id":"accent","name":"强调色","type":"color","label":"强调色","default":"#E8A048"},{"id":"panel","name":"面板底","type":"color","label":"文字块底色","default":"rgba(12,12,18,.68)"},{"id":"fontScale","name":"字号缩放","type":"number","label":"字号缩放（1 = 默认）","default":1},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":5.4},{"id":"axis","name":"轴名","type":"string","label":"左上角轴名","default":"投入 → 产出"},{"id":"curve","name":"曲线","type":"string","label":"曲线控制点（SVG points）","default":"0,86 40,84 76,80 110,72 150,58 190,38 230,16 270,4 320,0 396,0"},{"id":"pivot","name":"拐点","type":"string","label":"拐点标注","default":"三个月之后开始变快"},{"id":"before","name":"拐点前","type":"string","label":"左下文字","default":"前期：钱在烧，看不见回报"},{"id":"after","name":"拐点后","type":"string","label":"右下文字","default":"后期：自己会滚"},{"id":"note","name":"结论","type":"string","label":"底部结论","default":"看不清曲线的人，只会觉得「一直没效果」，然后在拐点前放弃"}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>拐点 · 一条曲线的转折</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    /* 透明底：底下是用户自己的实拍或录屏 */
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }

  /* 文字块后面的一块半透明面板——只护住字，不铺满屏。
     满屏面板会被云渲染 settle 当成"面积最大的一帧"，抢掉底片的定格。 */
  .panel {
    position: absolute; left: 22px; right: 22px;
    background: var(--panel); border-radius: 14px; opacity: 0;
    box-shadow: 0 10px 34px rgba(0,0,0,.28);
  }
  .lb { font-size: 12px; font-weight: 700; letter-spacing: .22em;
        text-transform: uppercase; color: var(--ac); }
  .lb.mut { color: rgba(244,241,234,.42); }
  .tx { color: var(--fg); line-height: 1.28; }
  /* 文字装在一个 inline-block 里：要量「文字排出来多宽」时只能量它。
     直接量 .tx（left/right 撑满的块级）拿到的是容器宽 400px；
     用 Range.getBoundingClientRect 又会被祖先 transform 放大——
     预览页把组件放大 2 倍看时，划线就长成了两倍。offsetWidth 是布局宽，
     两者都不受影响。 */
  .tx > i { display: inline-block; font-style: normal; }
  .sub { color: rgba(244,241,234,.62); line-height: 1.4; }
  .rule { position: absolute; left: 0; height: 2px; background: var(--ac);
          transform-origin: 0 50%; }
  .no { position: absolute; display: flex; align-items: center; justify-content: center;
        border: 2px solid var(--ac); color: var(--ac);
        font-family: ui-monospace, Consolas, monospace; font-weight: 800; }
  /* 竖排连接线：因果链用它 */
  .conn { position: absolute; width: 2px; background: var(--ac); transform-origin: 50% 0; }
  .hit { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--ac); }

  /* 无面板的两条（尺度标尺 / 数量级切换）需要一层软晕把字托起来。
     云渲染对 external 图层**不合成底片**，组件预览被渲在浅灰底上，
     #F4F1EA 的浅色字在浅灰上几乎看不见——指标全绿、图是坏的。
     opt-* 和 beat-* 早就带了这层，cog 族因为都有面板一直没发现这个缺口。
     带面板的四条不要加：面板本身就是底板，再压一层晕会发闷。 */
  .halo { position: absolute; inset: 0;
          background: radial-gradient(74% 84% at 50% 50%,
            rgba(0,0,0,.62) 0%, rgba(0,0,0,.36) 54%, rgba(0,0,0,0) 84%); }
  /* 尺度标尺的字偏左（标题在左上、量级在左下），晕心跟着往左挪。
     写成复合选择器 .halo.halo-l 而不是独立一条 .halo-l：
     修饰类不该有自己的独立规则（audit_dom 的 D8 就是查这个），
     独立规则会和别的组件的同名类撞车。 */
  .halo.halo-l { background: radial-gradient(76% 90% at 34% 50%,
            rgba(0,0,0,.60) 0%, rgba(0,0,0,.34) 56%, rgba(0,0,0,0) 86%); }
  /* 底色/字色三类：HEAD 里没有，但这一批用到了。
     漏掉的直接后果是「透明件上的黑字」——body 没设 color，
     没命中任何类的元素一律继承成 rgb(0,0,0)，叠在深色实拍上等于隐形。 */
  .mu { color: rgba(244,241,234,.5); letter-spacing: .06em; }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  .ac { color: var(--ac); }
  /* 术语卡 */
  .term { color: var(--fg); font-weight: 900; letter-spacing: .02em; }
  /* 修饰类必须自带前缀。原来的 .yes / .no 里那个 no 撞上了 HEAD 的
     `.no { border: 2px solid var(--ac) }`（坑位清单的序号牌），
     于是「不适用」整行凭空多出一圈橙框——DOM 读数完全正常，
     只有把组件单独渲在中灰底上才看得见。 */
  .bnd { position: absolute; left: 20px; right: 20px; display: flex; gap: 10px;
         align-items: flex-start; }
  .bnd .tag2 { flex: 0 0 auto; padding: 3px 9px; border-radius: 6px;
              font-size: 11px; font-weight: 700; letter-spacing: .1em; }
  .bnd.is-yes .tag2 { background: var(--ac); color: #14140F; }
  .bnd.is-no .tag2 { background: rgba(244,241,234,.14); color: rgba(244,241,234,.72); }
  .bnd .bd { flex: 1 1 auto; color: rgba(244,241,234,.72); }
  /* 正反对照 */
  .ab { position: absolute; top: 13px; bottom: 13px; width: 196px; border-radius: 10px;
        background: rgba(244,241,234,.06); }
  .ab .h { font-size: 11px; font-weight: 700; letter-spacing: .2em; margin-bottom: 8px;
           padding: 0 12px; }
  .ab .b2 { color: rgba(244,241,234,.78); padding: 2px 12px 0; }
  /* 数字打脸 */
  /* .num 必须自己带 color：正文 div 没命中任何带 color 的类时会继承
     body 的默认黑，压在深色面板上=看不见。加 color 之后 .num.sub 会被
     这里盖掉 .sub 的灰，所以「你以为」那行只挂 .sub。 */
  .num { display: block; width: 100%; text-align: center; font-weight: 900;
         color: var(--fg); font-variant-numeric: tabular-nums; }
  .gap { position: absolute; left: 50%; top: 176px; transform: translateX(-50%);
         display: flex; align-items: center; gap: 12px; }
  .gap .l { width: 56px; height: 2px; background: var(--ac); }
  /* 尺度标尺 */
  .ruler { position: absolute; right: 26px; top: 18px; bottom: 18px; width: 2px;
           background: rgba(244,241,234,.22); }
  .ruler .m { position: absolute; left: -3px; width: 8px; height: 2px;
              background: rgba(244,241,234,.5); }
  .ruler .m.maj { left: -6px; width: 14px; background: var(--ac); }
  .ruler .t { position: absolute; right: 14px; white-space: nowrap;
              font-family: ui-monospace, Consolas, monospace; font-size: 11px;
              letter-spacing: .06em; color: rgba(244,241,234,.7);
              transform: translateY(-50%); }
  /* 不能写成 left:50% + translate(-50%,-50%)：那样容器是 shrink-to-fit，
     可用宽度只剩右半边 240px。MiSans 下「100× 更大」约 225px 刚好塞得下，
     云渲染拿不到字体、回退到更宽的字面就被挤断，「更大」竖成两行。
     改成左右拉满 + justify-content:center，宽度不再受字体影响。 */
  .mag { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
         display: flex; align-items: baseline; justify-content: center; gap: 10px; }
  .mag .x { font-size: 66px; font-weight: 900; color: var(--fg); letter-spacing: -.01em;
            white-space: nowrap; }
  .mag .u { font-size: 20px; font-weight: 700; color: var(--ac);
            letter-spacing: .14em; white-space: nowrap; }

  /* ── 权衡 ── */
  .tk { position: absolute; top: 14px; width: 190px; border-radius: 10px;
        background: rgba(244,241,234,.06); }
  .tk .hd { font-size: 15px; font-weight: 800; padding: 10px 12px 0; }
  .tk .bd2 { font-size: 12.5px; line-height: 1.5; color: rgba(244,241,234,.7);
             padding: 6px 12px 10px; }
  .tk.a .hd { color: var(--ac); }
  .tk.b .hd { color: rgba(244,241,234,.8); }
  .vs { position: absolute; left: 50%; top: 30px; width: 30px; height: 30px;
        margin-left: -15px; border-radius: 50%; background: #14140F;
        border: 2px solid var(--ac); color: var(--ac);
        display: flex; align-items: center; justify-content: center;
        font: 800 10px/1 ui-monospace, Consolas, monospace; letter-spacing: .04em; }
  /* ── 等式 ── */
  .eq { position: absolute; left: 20px; right: 20px; text-align: center;
        font-weight: 900; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .eq em { font-style: normal; color: var(--ac); }
  .eq s { text-decoration: none; color: rgba(244,241,234,.45); padding: 0 4px; }
  /* ── 曲线 ── */
  .cv { position: absolute; left: 20px; right: 20px; }
  .cv .ln { position: absolute; left: 0; right: 0; height: 1px;
            background: rgba(244,241,234,.14); }
  .cv .dot { position: absolute; width: 11px; height: 11px; border-radius: 50%;
             margin: -5.5px 0 0 -5.5px; background: var(--ac);
             box-shadow: 0 0 0 4px rgba(232,160,72,.22); }
  /* ── 成本拆解 ── */
  .led { position: absolute; left: 20px; right: 20px; }
  .led .nm { font-size: 13px; font-weight: 700; color: var(--fg); }
  .led .pc { font-size: 12px; color: rgba(244,241,234,.55); text-align: right;
             font-variant-numeric: tabular-nums; }
  .led .track { position: absolute; left: 0; right: 0; height: 6px; border-radius: 3px;
                background: rgba(244,241,234,.10); overflow: hidden; }
  .led .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0;
               border-radius: 3px; background: var(--ac); }
  .led .fill2 { background: rgba(244,241,234,.42); }
  /* ── 二维判据 ── */
  .quad { position: absolute; left: 44px; top: 40px; width: 176px; height: 128px; }
  .quad .cell { position: absolute; width: 84px; height: 60px; padding: 7px 8px;
                border: 1px solid rgba(244,241,234,.12); font-size: 11.5px;
                line-height: 1.35; color: rgba(244,241,234,.6); }
  .quad .cell.on { border-color: var(--ac); background: rgba(232,160,72,.14);
                   color: var(--fg); font-weight: 700; }
  .quad .axis { position: absolute; background: rgba(244,241,234,.28); }
  /* ── 引述 ── */
  .qm { font-size: 56px; line-height: .8; color: var(--ac); opacity: .5;
        font-family: Georgia, 'Times New Roman', serif; }
  .qt { font-size: 19px; font-weight: 800; line-height: 1.45; color: var(--fg); }
  .qa { font-size: 11.5px; color: rgba(244,241,234,.5); letter-spacing: .06em; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"color":"#F4F1EA","accent":"#E8A048","panel":"rgba(12,12,18,.68)","fontScale":1,"duration":5.4,"axis":"投入 → 产出","curve":"0,86 40,84 76,80 110,72 150,58 190,38 230,16 270,4 320,0 396,0","pivot":"三个月之后开始变快","before":"前期：钱在烧，看不见回报","after":"后期：自己会滚","note":"看不清曲线的人，只会觉得「一直没效果」，然后在拐点前放弃"};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--fg', v.color || FALLBACK.color);
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--panel', v.panel || FALLBACK.panel);
  const dur = parseFloat(v.duration) || 5.4;
  const scale = parseFloat(v.fontScale) || 1;

  const stage = document.getElementById('stage');
  const build = 
(stage, put, fit, v, FB, scale) => {
  const L = Math.round(14 * scale), T = Math.round(11 * scale);
  const panel = put('div', 'panel', 'top:28px;height:196px');
  const lb = put('div', 'lb', 'position:absolute;left:20px;top:12px;', v.axis || FB.axis, panel);
  const cv = put('div', 'cv', 'top:46px;height:96px;', null, panel);
  /* 网格线 + SVG 折线。用 innerHTML 一次性塞进去：
     put() 建的是 HTML 元素，SVG 要 createElementNS，不值当为一条线包一层。
     注意 curve 必须进 FIELDS —— 只写在 SPEC 里的话 FALLBACK 没有它，
     points="undefined"，getTotalLength() 返回 0，**线一条都画不出来**，
     而且画面上除了少一条线之外没有任何异常：面板、网格、圆点、字全都在。 */
  const pts = String(v.curve || FB.curve).trim().split(/\s+/).map(function (p) {
    const xy = p.split(',');
    return [parseFloat(xy[0]), parseFloat(xy[1])];
  }).filter(function (p) { return !isNaN(p[0]) && !isNaN(p[1]); });
  cv.innerHTML =
    '<svg width="100%" height="100%" viewBox="0 0 396 96" preserveAspectRatio="none">' +
    '<polyline fill="none" stroke="#E8A048" stroke-width="2.5" stroke-linecap="round" ' +
    'stroke-linejoin="round" points="' + pts.map(function (p) {
      return p[0] + ',' + p[1];
    }).join(' ') + '"/>' +
    '</svg>';
  /* 拐点圆点自己算：取斜率最大的那一段的中点。
     让用户手填 atX/atY 的话，换一条曲线就得重填两个数，填错了对不上线，
     而且这种错在画面上表现为「点飘在曲线旁边」，很难一眼看出是数据错了。
     SVG 的 y=0 在上，CSS 的 top:0% 也在上，方向一致，可以直接换算。 */
  let bi = 0, bd = -1;
  for (let i = 1; i < pts.length - 1; i++) {
    const d = Math.abs(pts[i][1] - pts[i - 1][1]);
    if (d > bd) { bd = d; bi = i; }
  }
  const spanX = pts.length ? pts[pts.length - 1][0] : 396;
  const spanY = pts.length ? Math.max.apply(null, pts.map(function (p) { return p[1]; })) : 96;
  const bp = pts[bi] || [0, 0];
  const g1 = put('div', 'ln', 'top:0;', null, cv);
  const g2 = put('div', 'ln', 'top:50%;', null, cv);
  const dot = put('div', 'dot', 'left:' + (bp[0] / spanX * 100) + '%;top:' +
    (bp[1] / spanY * 100) + '%;', null, cv);
  /* 前后两段话放到图表**外面**：挂在 .cv 里的话，曲线左下那一段正好压在上面 */
  const aLb = put('div', 'mu', 'position:absolute;left:20px;top:150px;font-size:' + T + 'px;',
    v.before || FB.before, panel);
  const bLb = put('div', 'ac mu', 'position:absolute;right:20px;top:150px;font-size:' + T + 'px;',
    v.after || FB.after, panel);
  const call = put('div', 'tx', 'position:absolute;left:0;top:4px;width:176px;font-size:' +
    L + 'px;font-weight:800;', v.pivot || FB.pivot, cv);
  const tail = put('div', 'sub', 'position:absolute;left:20px;right:20px;bottom:10px;' +
    'font-size:' + Math.round(11.5 * scale) + 'px;', v.note || FB.note, panel);
  fit([{ el: call, max: L, min: Math.round(10 * scale), box: 168 },
       { el: tail, max: Math.round(11.5 * scale), min: Math.round(9.5 * scale), box: 380 }]);
  return {
    build(tl, dur) {
      tl.fromTo(panel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .34, ease: 'power3.out' }, 0);
      tl.fromTo(lb, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: .26 }, .04);
      tl.fromTo([g1, g2], { opacity: 0 }, { opacity: 1, duration: .3, stagger: .08 }, .1);
      /* 曲线本身交给 SVG 的 stroke-dashoffset 画出来：
         社区里「过程类」动画最常见的一招，观众能看清是「长出来」不是「切进去」 */
      const path = cv.querySelector('polyline');
      if (path) {
        const len = path.getTotalLength ? path.getTotalLength() : 400;
        gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
        tl.to(path, { strokeDashoffset: 0, duration: 1.1, ease: 'power2.inOut' }, .18);
      }
      tl.fromTo(dot, { opacity: 0, scale: .2 }, { opacity: 1, scale: 1, duration: .3, ease: 'back.out(3)' }, 1.0);
      tl.fromTo([aLb, bLb], { opacity: 0 }, { opacity: 1, duration: .28, stagger: .08 }, 1.16);
      tl.fromTo(call, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .34, ease: 'power3.out' }, 1.26);
      tl.fromTo(tail, { opacity: 0 }, { opacity: 1, duration: .3 }, 1.5);
      tl.to({}, { duration: .3 }, dur - 1.8);
    }
  };
}
;

  /* 每一项 {el, max, min, box}：量自然宽度，超了就缩字号。
     中文宽度对字号极其敏感，写死字号必然在某组文案上溢出——
     上一轮 blk-* 那批「文字溢出」的根因就是这个。 */
  const fits = [];
  function fit(list) { fits.push.apply(fits, list); }
  function runFit() {
    fits.forEach((f) => {
      const el = f.el;
      el.style.fontSize = f.max + 'px';
      const avail = f.box || el.clientWidth;
      /* 量真实排版宽，只能靠临时 nowrap。
         之前两版都错在这：
           ① 直接量 .tx（left/right 撑满的块级）——一换行 scrollWidth 就等于
              容器宽，量出来永远是 avail，fit 形同虚设；
           ② 为此在父元素里塞一个装着同样文字的 inline-block span 来量——
              同一段话在页面上渲染了两遍（肉眼看到的就是「重影」），
              而且 inline-block 自己的宽度是 shrink-to-fit，量短句时
              同样会被容器宽吃掉。
         nowrap 一次性解决两个：文字不折行，scrollWidth 就是它本该多宽；
         量完恢复，长句该折还是折。 */
      const ws = el.style.whiteSpace;
      el.style.whiteSpace = 'nowrap';
      const natural = el.scrollWidth;
      el.style.whiteSpace = ws;
      if (natural > avail) {
        el.style.fontSize = Math.max(f.min, Math.floor(f.max * avail / natural)) + 'px';
      }
    });
  }
  function put(tag, cls, css, text, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text != null) el.textContent = text;
    (parent || stage).appendChild(el);
    return el;
  }

  const ctx = build(stage, put, fit, v, FALLBACK, scale);
  ctx.fitTargets && ctx.fitTargets();

  const tl = gsap.timeline({ paused: true });
  /* 注册：云渲染的 settle / 逐帧定位靠 window.__timelines 驱动时间轴。
     组件曾全部没注册，渲染停在第 0 帧、整层空。 */
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
  ctx.build(tl, dur);
  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  /* 收口必须放在建完时间轴之后、第一次渲染之前：
     量的时候元素还没被补间动过，量到的是真实排版宽度。 */
  runFit();
  tl.play(0);
})();
</script>
</body>
</html>
