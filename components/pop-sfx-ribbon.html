<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"text","name":"拟声词","type":"string","label":"压在缎带上的文案","default":"开工！"},{"id":"accent","name":"强调色","type":"color","label":"缎带颜色","default":"#FF6B35"},{"id":"color","name":"硬阴影色","type":"color","label":"描边硬阴影深色","default":"#241C18"},{"id":"fontSize","name":"字号","type":"number","label":"字号 px（超出画面自动缩）","default":50},{"id":"tilt","name":"倾角","type":"number","label":"缎带倾角（度）","default":-8},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":2.8}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>斜切缎带拟声词</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    /* 透明底：这层是挂件，底下是用户自己的实拍 */
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }

  .p-grp { position: absolute; inset: 0; display: flex;
           align-items: center; justify-content: center; }
  /* 倾角固定在这一层（CSS transform），补间只动 x/scale，两种变换不会互相覆盖 */
  .p-tilt { position: relative; transform: rotate(var(--tilt, -8deg)); }

  /* 硬阴影必须挂在 clip-path 的**外层**：
     filter 在 clip-path 之前渲染，阴影会被裁掉（这是本批次实测踩到的坑）。
     所以形状层只管填充和切角，阴影交给外面的壳。 */
  .p-bandwrap { position: relative; display: inline-block;
                filter: drop-shadow(5px 6px 0 var(--ink, #241C18)); }
  .p-band {
    position: relative; height: 76px; padding: 0 30px;
    display: flex; align-items: center; justify-content: center;
    background: var(--ac, #FF6B35);
    clip-path: polygon(0 0, 100% 0, 100% 34%, 91% 50%, 100% 66%, 100% 100%, 0 100%);
  }
  /* 左端折回来的一片深色（缎带绕过背面的那一面） */
  .p-fold { position: absolute; left: 0; top: 0; width: 28px; height: 100%;
            background: var(--ink, #241C18); opacity: .3;
            transform-origin: 50% 0%; }
  /* 右端飘动的尾巴：外壳带阴影，里面两层都是切角形状。
     .p-tailin 是固定的垂坠角——尾巴必须比带子低一截才读得出「这是缎带的另一头」，
     平齐的话它就是带子的延续，燕尾缺口以外什么也看不出来。 */
  .p-tailwrap {
    position: absolute; right: -44px; top: 0; bottom: 0; width: 48px;
    transform-origin: 0 50%;
    filter: drop-shadow(5px 6px 0 var(--ink, #241C18));
  }
  .p-tailin { position: absolute; inset: 0; transform: rotate(-6deg);
              transform-origin: 0 50%; }
  .p-tail, .p-tailfold {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    clip-path: polygon(0 0, 100% 34%, 100% 100%, 0 100%);
  }
  .p-tail { background: var(--ac, #FF6B35); }
  /* 尾巴下缘的暗面：同形同位，渐变到半透明黑，只为让尾巴有厚度。
     不能渐变到纯 var(--ink)——那半截尾巴会变成一块死黑，不是"缎带"了。 */
  .p-tailfold { background: linear-gradient(180deg, rgba(0,0,0,0) 38%, rgba(0,0,0,.4) 100%); }
  .p-rtext {
    position: relative; z-index: 1; display: inline-block; white-space: nowrap;
    font-size: var(--fs, 50px); font-weight: 900; line-height: 1;
    letter-spacing: .02em; color: var(--fg, #FFF8EE);
    text-shadow: 3px 3px 0 var(--ink, #241C18);
    transform-origin: 50% 50%;
    -webkit-font-smoothing: antialiased;
  }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"text":"开工！","accent":"#FF6B35","color":"#241C18","fontSize":50,"tilt":-8,"duration":2.8};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--ink', v.color || FALLBACK.color);
  root.style.setProperty('--fg', '#FFF8EE');
  const dur = parseFloat(v.duration) || 2.8;
  const fs = parseFloat(v.fontSize) || 50;
  root.style.setProperty('--fs', fs + 'px');
  const tiltRaw = parseFloat(v.tilt);
  const tilt = isNaN(tiltRaw) ? -8 : Math.max(-30, Math.min(30, tiltRaw));
  root.style.setProperty('--tilt', tilt + 'deg');
  const text = String(v.text == null ? FALLBACK.text : v.text);

  const stage = document.getElementById('stage');
  function put(tag, cls, css, text_, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text_ != null) el.textContent = text_;
    (parent || stage).appendChild(el);
    return el;
  }

  const grp = put('div', 'p-grp', '');
  const tiltEl = put('div', 'p-tilt', '', null, grp);
  const bandwrap = put('div', 'p-bandwrap', '', null, tiltEl);
  const band = put('div', 'p-band', '', null, bandwrap);
  const fold = put('div', 'p-fold', '', null, band);
  const label = put('span', 'p-rtext', '', text, band);
  const tailwrap = put('div', 'p-tailwrap', '', null, tiltEl);
  const tailin = put('div', 'p-tailin', '', null, tailwrap);
  put('div', 'p-tail', '', null, tailin);
  put('div', 'p-tailfold', '', null, tailin);

  const tl = gsap.timeline({ paused: true });
  /* 注册：云渲染的 settle / 逐帧定位靠 window.__timelines 驱动时间轴 */
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  /* 收口：量文字自然宽 → 决定缎带总宽 → 尾巴必须留在画面内。
     缎带 76 高、尾巴 44 宽，最宽 360 + 44 = 404 < 480。 */
  (function fit() {
    root.style.setProperty('--fs', fs + 'px');
    const natural = label.scrollWidth;
    const padX = 60;
    const maxBand = 360;
    let need = natural + padX;
    if (need > maxBand) {
      root.style.setProperty('--fs', Math.max(20, Math.floor(fs * (maxBand - padX) / natural)) + 'px');
      need = maxBand;
    }
    band.style.width = need + 'px';
  })();

  // 斜色带从左边横扫进来
  tl.fromTo(tiltEl, { x: -430 },
    { x: 0, duration: .36, ease: 'power4.out', immediateRender: false }, 0);
  // 到位瞬间的压扁，像布被拉停
  tl.to(tiltEl, { scaleX: 1.05, scaleY: .9, duration: .1, yoyo: true, repeat: 1,
    ease: 'power2.inOut' }, .36);

  // 字被"压"在缎带上：先大后小砸实
  tl.fromTo(label, { scale: 1.5, opacity: 0, x: -34 },
    { scale: 1, opacity: 1, x: 0, duration: .3, ease: 'back.out(2.2)',
      immediateRender: false }, .24);
  tl.to(label, { scaleY: .88, scaleX: 1.06, duration: .09, yoyo: true, repeat: 1,
    ease: 'power2.inOut' }, .54);

  // 左端折角随缎带一起被压下去
  tl.fromTo(fold, { scaleY: .2 }, { scaleY: 1, duration: .3, ease: 'back.out(2)',
    immediateRender: false }, .06);

  // 尾巴先伸出来，之后开始飘
  tl.fromTo(tailwrap, { scaleX: .2, opacity: .2 },
    { scaleX: 1, opacity: 1, duration: .28, ease: 'back.out(2)',
      immediateRender: false }, .2);
  // repeat 取奇数 = 最后回到起始角，尾巴不会把时间轴拖过 dur
  let flap = Math.floor((dur - .85) / .38);
  if (flap < 1) flap = 1;
  if (flap % 2 === 0) flap -= 1;
  tl.to(tailwrap, { rotation: 3.2, duration: .38, yoyo: true, repeat: flap,
    ease: 'sine.inOut' }, .55);

  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  tl.play(0);
})();
</script>
</body>
</html>
