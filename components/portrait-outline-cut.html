<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"outlineColor","type":"color","label":"描边颜色","default":"#22c55e"},{"id":"glowIntensity","type":"number","label":"发光强度（1-3）","default":"2"},{"id":"silhouetteColor","type":"color","label":"人形配色","default":"#1a1a2e"},{"id":"entranceDirection","type":"select","label":"入场方向","options":[{"label":"从下往上","value":"bottom"},{"label":"从左往右","value":"left"},{"label":"从右往左","value":"right"}],"default":"bottom"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=480, height=270" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 480px; height: 270px; overflow: hidden; background: transparent; }
      body { display: flex; align-items: center; justify-content: center; }

      #scene {
        position: relative;
        width: 480px;
        height: 270px;
        overflow: hidden;
        background: transparent;
      }

      #figure-wrap {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 180px;
        height: 240px;
        filter: drop-shadow(0 0 var(--glow1, 12px) var(--oc, #22c55e))
                drop-shadow(0 0 var(--glow2, 24px) var(--oc, #22c55e))
                drop-shadow(0 0 var(--glow3, 40px) var(--oc, #22c55e));
        will-change: transform, opacity, filter;
      }

      #figure-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* 描边光效层 */
      #outline-sweep {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 180px;
        height: 240px;
        pointer-events: none;
        opacity: 0;
      }

      /* 底座渐变光斑 */
      #ground-glow {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 30px;
        border-radius: 50%;
        background: radial-gradient(ellipse, var(--oc, #22c55e) 0%, transparent 70%);
        opacity: 0;
        filter: blur(8px);
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div id="ground-glow"></div>
      <div id="figure-wrap">
        <!-- SVG 人形剪影：头部 + 身体 -->
        <svg id="figure-svg" viewBox="0 0 180 240" xmlns="http://www.w3.org/2000/svg" fill="none">
          <!-- 描边光晕（叠加在外层） -->
          <defs>
            <filter id="glow-filter" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <!-- 身形路径：抽象人形立绘 -->
          <!-- 头部 -->
          <ellipse cx="90" cy="42" rx="28" ry="30" fill="var(--sc, #1a1a2e)" />
          <!-- 颈部 -->
          <rect x="82" y="68" width="16" height="14" rx="4" fill="var(--sc, #1a1a2e)" />
          <!-- 躯干（肩宽腰窄） -->
          <path d="M40 88 Q50 82 90 80 Q130 82 140 88 L148 160 Q145 175 138 188 L130 228 L50 228 L42 188 Q35 175 32 160 Z"
                fill="var(--sc, #1a1a2e)" />
          <!-- 左臂 -->
          <path d="M40 88 Q28 95 22 115 Q18 130 20 148 Q22 158 26 162 Q30 160 32 152 L38 118 Q40 105 40 88"
                fill="var(--sc, #1a1a2e)" />
          <!-- 右臂 -->
          <path d="M140 88 Q152 95 158 115 Q162 130 160 148 Q158 158 154 162 Q150 160 148 152 L142 118 Q140 105 140 88"
                fill="var(--sc, #1a1a2e)" />

          <!-- 描边光圈（叠加在剪影上，通过叠加混合形成描边效果） -->
          <ellipse cx="90" cy="42" rx="30" ry="32" stroke="var(--oc, #22c55e)"
                   stroke-width="2" fill="none" opacity="0.9" filter="url(#glow-filter)" />
          <path d="M40 88 Q50 82 90 80 Q130 82 140 88 L148 160 Q145 175 138 188 L130 228 L50 228 L42 188 Q35 175 32 160 Z"
                stroke="var(--oc, #22c55e)" stroke-width="1.8" fill="none" opacity="0.9" filter="url(#glow-filter)" />
          <path d="M40 88 Q28 95 22 115 Q18 130 20 148 Q22 158 26 162 Q30 160 32 152 L38 118 Q40 105 40 88"
                stroke="var(--oc, #22c55e)" stroke-width="1.5" fill="none" opacity="0.85" filter="url(#glow-filter)" />
          <path d="M140 88 Q152 95 158 115 Q162 130 160 148 Q158 158 154 162 Q150 160 148 152 L142 118 Q140 105 140 88"
                stroke="var(--oc, #22c55e)" stroke-width="1.5" fill="none" opacity="0.85" filter="url(#glow-filter)" />

          <!-- 描边流光扫光（沿路径运动的渐变条） -->
          <clipPath id="body-clip">
            <ellipse cx="90" cy="42" rx="30" ry="32" />
            <path d="M40 88 Q50 82 90 80 Q130 82 140 88 L148 160 Q145 175 138 188 L130 228 L50 228 L42 188 Q35 175 32 160 Z" />
            <path d="M40 88 Q28 95 22 115 Q18 130 20 148 Q22 158 26 162 Q30 160 32 152 L38 118 Q40 105 40 88" />
            <path d="M140 88 Q152 95 158 115 Q162 130 160 148 Q158 158 154 162 Q150 160 148 152 L142 118 Q140 105 140 88" />
          </clipPath>
          <!-- 流光光束 -->
          <rect id="sweep-bar" x="-20" y="60" width="18" height="180"
                fill="url(#sweep-gradient)" opacity="0" clip-path="url(#body-clip)" />
          <defs>
            <linearGradient id="sweep-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="transparent" />
              <stop offset="40%" stop-color="var(--oc, #22c55e)" stop-opacity="0.9" />
              <stop offset="70%" stop-color="white" stop-opacity="0.6" />
              <stop offset="100%" stop-color="transparent" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    </div>

  <script src="/templates/_lib/gsap.min.js"></script>
  <script>
    (() => {
      const fallback = {
        outlineColor: "#22c55e",
        glowIntensity: "2",
        silhouetteColor: "#1a1a2e",
        entranceDirection: "bottom"
      };
      const v = window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : fallback;

      const oc = v.outlineColor || "#22c55e";
      const gi = parseFloat(v.glowIntensity) || 2;
      const sc = v.silhouetteColor || "#1a1a2e";
      const dir = v.entranceDirection || "bottom";

      // 设置 CSS 变量
      document.documentElement.style.setProperty('--oc', oc);
      document.documentElement.style.setProperty('--sc', sc);

      // 发光强度：gi=1/2/3 对应不同 drop-shadow 强度
      const g1 = (gi * 6).toFixed(0);
      const g2 = (gi * 12).toFixed(0);
      const g3 = (gi * 20).toFixed(0);
      const fw = document.getElementById('figure-wrap');
      fw.style.filter =
        `drop-shadow(0 0 ${g1}px ${oc}) ` +
        `drop-shadow(0 0 ${g2}px ${oc}) ` +
        `drop-shadow(0 0 ${g3}px ${oc})`;

      // 入场初始位置
      let startY = 80, startX = 0;
      if (dir === 'bottom') { startY = 80; startX = 0; }
      else if (dir === 'left') { startY = 0; startX = -80; }
      else if (dir === 'right') { startY = 0; startX = 80; }

      gsap.set(fw, { y: startY, x: startX, opacity: 0 });
      gsap.set('#ground-glow', { opacity: 0 });

      // 流光条初始
      const sweepBar = document.getElementById('sweep-bar');
      gsap.set(sweepBar, { opacity: 0, x: -20 });

      function runLoop() {
        const tl = gsap.timeline();

        // 1. 入场：从下方/侧边浮入
        tl.to(fw, {
          y: 0, x: 0, opacity: 1,
          duration: 0.9,
          ease: 'back.out(1.4)'
        });

        // 底座光斑
        tl.to('#ground-glow', {
          opacity: 0.7,
          duration: 0.5,
          ease: 'power2.out'
        }, 0.3);

        // 2. 入场后短暂停顿
        tl.to(fw, { duration: 0.4 });

        // 3. 描边流光扫一圈（从头到脚来回两次）
        // 第一次：从左到右
        tl.to(sweepBar, {
          opacity: 0.95,
          duration: 0.05
        });
        tl.to(sweepBar, {
          x: 200,
          duration: 1.1,
          ease: 'none'
        });
        tl.to(sweepBar, {
          opacity: 0,
          x: 200,
          duration: 0.15
        });

        // 第二次：从右到左（复位）
        tl.set(sweepBar, { x: -20 });
        tl.to(sweepBar, {
          opacity: 0.95,
          duration: 0.05
        });
        tl.to(sweepBar, {
          x: 200,
          duration: 0.9,
          ease: 'none'
        });
        tl.to(sweepBar, {
          opacity: 0,
          x: 200,
          duration: 0.15
        });

        // 4. 呼吸浮动（轻微上下浮动 + 发光脉冲）
        tl.to(fw, {
          y: -6,
          duration: 1.0,
          ease: 'sine.inOut'
        }, '-=0.2');
        tl.to(fw, {
          y: 4,
          duration: 1.0,
          ease: 'sine.inOut'
        }, '+=0.1');
        tl.to(fw, {
          y: 0,
          duration: 0.8,
          ease: 'sine.inOut'
        });

        // 呼吸期间底座光斑联动
        tl.to('#ground-glow', {
          opacity: 0.4,
          duration: 1.0,
          ease: 'sine.inOut'
        }, '-=2.8');

        // 5. 淡出（为下一次循环准备）
        tl.to(fw, {
          opacity: 0,
          y: dir === 'bottom' ? -30 : (dir === 'left' ? 0 : 0),
          x: dir === 'left' ? -60 : (dir === 'right' ? 60 : 0),
          duration: 0.6,
          ease: 'power2.in'
        }, '+=0.3');

        tl.to('#ground-glow', {
          opacity: 0,
          duration: 0.4
        }, '-=0.5');

        // 重置状态
        tl.call(() => {
          gsap.set(fw, { y: startY, x: startX, opacity: 0 });
          gsap.set('#ground-glow', { opacity: 0 });
          gsap.set(sweepBar, { x: -20, opacity: 0 });
        });

        return tl;
      }

      const master = gsap.timeline({ repeat: -1, delay: 0.2 });
      master.add(runLoop());
      master.duration(4.0);
    })();
  </script>
  </body>
</html>
