<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"bpm","name":"BPM","type":"number","label":"速度 BPM（40~220）","default":140},{"id":"beatsPerBar","name":"拍号","type":"number","label":"每小节几拍","default":4},{"id":"color","name":"字色","type":"color","label":"文字颜色","default":"#F4F1EA"},{"id":"accent","name":"强调色","type":"color","label":"强调色","default":"#E8A048"},{"id":"panel","name":"面板底","type":"color","label":"面板底色","default":"rgba(12,12,18,.68)"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":6.4}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>卡点条 · 切点直读</title>
<style>
  @font-face { font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype'); font-weight: 400 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 480px; height: 270px; overflow: hidden; background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  .halo { position: absolute; inset: 0;
    background: radial-gradient(64% 76% at 50% 50%, rgba(0,0,0,.60) 0%, rgba(0,0,0,.30) 54%, rgba(0,0,0,0) 78%); }
  .panel { position: absolute; left: 20px; right: 20px; background: var(--panel);
    border-radius: var(--radius, 12px); opacity: 0;
    box-shadow: 0 12px 40px rgba(0,0,0,.42); }
  .ac { color: var(--ac); }
  .fg { color: var(--fg); }
  .mu { color: rgba(244,241,234,.58); }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  .bar { position: absolute; height: 4px; border-radius: 2px; background: var(--ac); }
  .tick { position: absolute; width: 2px; background: var(--ac); opacity: 0; }
  .flash { position: absolute; inset: 0; background: var(--ac); opacity: 0; }
</style>
</head>
<body>
<div id="stage"><div class="halo"></div></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"bpm":140,"beatsPerBar":4,"color":"#F4F1EA","accent":"#E8A048","panel":"rgba(12,12,18,.68)","duration":6.4};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--fg', v.color || FALLBACK.color);
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--panel', v.panel || FALLBACK.panel);
  const dur = parseFloat(v.duration) || 6.4;
  const stage = document.getElementById('stage');
  const put = (tag, cls, css, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (css) e.style.cssText = css;
    if (text != null) e.textContent = text;
    stage.appendChild(e);
    return e;
  };

  /* ── 节拍地图 ──────────────────────────────────────────────
     这一族的地基：给定 BPM 和拍号，算出每一拍的绝对时刻。
     后面所有切点、闪光、弹字都从这张表推，不各自算一遍——
     否则换 BPM 时三处会对不上，正是社区说的「各长各的」。 */
  const bpm = Math.max(40, Math.min(220, parseFloat(v.bpm) || FALLBACK.bpm));
  const beatsPerBar = Math.max(1, Math.min(8, parseInt(v.beatsPerBar, 10) || FALLBACK.beatsPerBar));
  const spb = 60 / bpm;                       // 一拍多少秒
  const total = Math.floor(dur / spb);
  const BEATS = [];
  for (let i = 0; i <= total; i++) {
    BEATS.push({ i: i, t: i * spb, bar: Math.floor(i / beatsPerBar) + 1,
                 beat: (i % beatsPerBar) + 1, down: i % beatsPerBar === 0 });
  }
  /* 小节线：小节头那一拍 */
  const BARS = BEATS.filter((b) => b.down);
  /* 强调拍：每 4 小节的第一拍，社区里最常用的"情绪拉高"点 */
  const ACCENT = BARS.filter((b) => (b.bar - 1) % 4 === 0);

  const build = 
(stage, put, v, FB, T) => (tl, dur) => {
  /* 卡点条：一条进度条在每一拍上鼓一下，等于把「什么时候切」直接画出来。 */
  const panel = put('div', 'panel', 'top:96px;height:78px');
  const label = put('div', 'mono ac', 'position:absolute;left:18px;top:12px;font-size:12px;' +
    'letter-spacing:.2em;', T.BPMVAL);
  const track = put('div', '', 'position:absolute;left:18px;right:18px;top:46px;height:6px;' +
    'border-radius:3px;background:rgba(244,241,234,.16)');
  const fill = put('div', 'bar', 'left:18px;top:46px;width:0;height:6px');
  const head = put('div', '', 'position:absolute;left:18px;top:39px;width:5px;height:20px;' +
    'border-radius:3px;background:var(--ac)');
  const caps = put('div', 'mono mu', 'position:absolute;left:18px;top:62px;font-size:10px;',
    T.MAPNOTE);
  tl.fromTo(panel, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .34, ease: 'power3.out' }, 0);
  tl.fromTo([label, caps], { opacity: 0 }, { opacity: 1, duration: .3, stagger: .07 }, .05);
  const W = 480 - 36;
  tl.to(fill, { width: W, duration: T.dur, ease: 'none' }, 0);
  tl.fromTo(head, { x: 0 }, { x: W, duration: T.dur, ease: 'none' }, 0);
  T.BEATS.forEach((b) => {
    tl.to(track, { scaleY: b.down ? 1.9 : 1.45, transformOrigin: '50% 50%',
      duration: .08, ease: 'power2.out' }, b.t);
    tl.to(track, { scaleY: 1, duration: .22, ease: 'power2.inOut' }, b.t + .08);
    tl.fromTo(head, { scaleY: b.down ? 2.0 : 1.5 },
      { scaleY: 1, duration: .3, ease: 'elastic.out(1,.5)' }, b.t);
  });
}
;
  /* 给 build 的东西一次给全：BPM 相关派生值在共用头部算好。
     早先是把派生代码拼在 BUILD 函数**后面**，结果落在箭头函数体之外，
     整个表达式语法错误 → ctx 抛错 → 页面只剩一层 halo，
     nodes=1、D=NO-TL。一眼看不出来是拼接位置错了。
     （此处刻意不写占位名原文：HEAD 是按占位名做 replace 的，
       注释里一旦出现同名占位，replace-all 会把函数体塞进注释中间。） */
  const T = {
    BEATS: BEATS, BARS: BARS, ACCENT: ACCENT, spb: spb, dur: dur,
    BPMTEXT: v.bpmLabel || 'BEAT MAP',
    BPMVAL: Math.round(bpm) + ' BPM · ' + beatsPerBar + '/4',
    MAPNOTE: '强拍 ' + BARS.length + ' 个 · 共 ' + BEATS.length + ' 拍 · 一拍 '
      + (spb * 1000).toFixed(0) + 'ms',
  };
  const ctx = build(stage, put, v, FALLBACK, T);

  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
  ctx(tl, dur);
  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  tl.play(0);
})();
</script>
</body>
</html>
