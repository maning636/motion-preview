<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"accent","name":"强调色","type":"color","label":"强调色","default":"#FF6B35"},{"id":"accent2","name":"次强调色","type":"color","label":"次强调色","default":"#FFC93C"},{"id":"accent3","name":"辅助色","type":"color","label":"辅助色","default":"#2EC4B6"},{"id":"intensity","name":"强度","type":"number","label":"震动强度（0.3–2）","default":1},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":2.6}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>衰减震屏</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  .p-tint { position: absolute; inset: 0; background: rgba(12, 12, 18, .34); }
  /* 震屏是「氛围」不做文案，但必须有一眼认得出的画面在抖，
     所以自带一块缩略画面：落日 + 山 + 地面 + 一个方块角色。 */
  .p-frame { position: absolute; left: 20px; top: 20px; width: 440px; height: 230px;
    border-radius: 14px; overflow: hidden; border: 3px solid rgba(255, 248, 238, .55);
    will-change: transform; background: rgba(12, 12, 18, .55); }
  .p-sky { position: absolute; left: 0; top: 0; right: 0; height: 148px;
    background: linear-gradient(180deg, rgba(46, 196, 182, .30) 0%, rgba(255, 201, 60, .34) 62%, rgba(255, 107, 53, .40) 100%); }
  .p-sun { position: absolute; left: 50%; top: 66px; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%; background: var(--ac2); }
  .p-mt { position: absolute; bottom: 52px; width: 0; height: 0;
    border-left: 78px solid transparent; border-right: 78px solid transparent; }
  .p-mt.l { left: 18px; border-bottom: 66px solid rgba(27, 27, 36, .82); }
  .p-mt.r { left: 282px; border-bottom: 52px solid rgba(27, 27, 36, .62); }
  .p-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 54px;
    background: linear-gradient(180deg, rgba(255, 107, 53, .34), rgba(27, 27, 36, .88)); }
  .p-bar { position: absolute; bottom: 54px; width: 22px; border-radius: 3px 3px 0 0;
    background: rgba(27, 27, 36, .78); }
  .p-char { position: absolute; left: 50%; top: 96px; width: 38px; height: 34px; margin-left: -19px;
    background: var(--ac); border: 3px solid #1B1B24; border-radius: 6px 6px 3px 3px; }
  .p-char::before, .p-char::after { content: ''; position: absolute; top: 7px; width: 6px; height: 8px;
    background: #1B1B24; border-radius: 50%; }
  .p-char::before { left: 7px; }
  .p-char::after { right: 7px; }
  .p-char i { position: absolute; left: 9px; bottom: 4px; width: 20px; height: 9px;
    border-bottom: 3px solid #1B1B24; border-radius: 0 0 12px 12px; }
  .p-echo { position: absolute; left: 20px; top: 20px; width: 440px; height: 230px;
    border-radius: 14px; overflow: hidden; pointer-events: none; opacity: .20;
    mix-blend-mode: screen; will-change: transform; }
  .p-vig { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    box-shadow: inset 0 0 46px rgba(255, 201, 60, .8); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"accent":"#FF6B35","accent2":"#FFC93C","accent3":"#2EC4B6","intensity":1,"duration":2.6};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  const dur = parseFloat(v.duration) || 2.6;
  const amp0 = Math.max(.3, Math.min(2, parseFloat(v.intensity) || 1));
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--ac2', v.accent2 || FALLBACK.accent2);
  root.style.setProperty('--ac3', v.accent3 || FALLBACK.accent3);

  const stage = document.getElementById('stage');
  function put(tag, cls, css, tx, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (tx != null) el.textContent = tx;
    (parent || stage).appendChild(el);
    return el;
  }

  put('div', 'p-tint');

  /* 画面内容：纯静态 DOM，位置全部写死，不含随机量。
     克隆一份当「运动残影」，用相反方向的偏移叠在上面，抖动才有速度感。 */
  function buildScene() {
    const f = document.createElement('div');
    f.className = 'p-frame';
    put('div', 'p-sky', '', null, f);
    put('div', 'p-sun', '', null, f);
    put('div', 'p-mt l', '', null, f);
    put('div', 'p-mt r', '', null, f);
    put('div', 'p-ground', '', null, f);
    put('div', 'p-bar', 'left:44px;height:52px;', null, f);
    put('div', 'p-bar', 'left:78px;height:34px;', null, f);
    put('div', 'p-bar', 'left:340px;height:44px;', null, f);
    put('div', 'p-bar', 'left:374px;height:66px;', null, f);
    const c = put('div', 'p-char', '', null, f);
    put('i', '', '', null, c);
    return f;
  }
  const frame = buildScene();
  stage.appendChild(frame);
  const echoWrap = document.createElement('div');
  echoWrap.className = 'p-echo';
  echoWrap.appendChild(buildScene());
  stage.appendChild(echoWrap);

  const vig = put('div', 'p-vig');

  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
  tl.fromTo(frame, { scale: .94, opacity: .3 },
    { scale: 1, opacity: 1, duration: .3, ease: 'power3.out' }, 0);

  /* 衰减震屏：三次冲击（主震 + 两次余震），幅度指数衰减。
     全部由绝对时间 t 直接算出——没有「上一次位置」这种累加量，
     所以时间轴来回扫，抖动帧完全可复现。 */
  const kick = (t, t0, k) => (t < t0 ? 0 : k * 11 * amp0 * Math.exp(-4.6 * (t - t0)));
  const amp = (t) => Math.max(kick(t, .04, 1), kick(t, .62, .55), kick(t, 1.02, .30));

  const P = { t: 0 };
  const paint = (t) => {
    const A = amp(t);
    const x = A * Math.sin(t * 61);
    const y = A * .62 * Math.cos(t * 73);
    const r = A * .09 * Math.sin(t * 47);
    frame.style.transform = 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) rotate(' + r.toFixed(3) + 'deg)';
    /* 残影走「延迟一拍」的同一组公式，所以看起来是错开的，而不是同步平移 */
    const A2 = amp(t + .012);
    echoWrap.style.transform = 'translate3d(' + (-x - A2 * Math.sin((t + .012) * 61) * .9).toFixed(2) + 'px,' +
      (-y - A2 * .62 * Math.cos((t + .012) * 73) * .9).toFixed(2) + 'px,0)';
    vig.style.opacity = Math.min(1, A * .42).toFixed(3);
  };
  tl.fromTo(P, { t: 0 }, {
    t: dur, duration: dur, ease: 'none',
    onUpdate() { paint(P.t); }
  }, 0);
  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  tl.play(0);
  paint(0);
})();
</script>
</body>
</html>
