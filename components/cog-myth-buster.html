<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"color","name":"字色","type":"color","label":"正文颜色","default":"#F4F1EA"},{"id":"accent","name":"强调色","type":"color","label":"强调色","default":"#E8A048"},{"id":"panel","name":"面板底","type":"color","label":"文字块底色","default":"rgba(12,12,18,.68)"},{"id":"fontScale","name":"字号缩放","type":"number","label":"字号缩放（1 = 默认）","default":1},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":4.2},{"id":"myth","name":"你以为","type":"string","label":"你以为（会被划掉的那句）","default":"加了杠杆就能赚钱"},{"id":"fact","name":"其实","type":"string","label":"其实（真相）","default":"杠杆放大的是亏损"}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>误区拆解 · 你以为／其实</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    /* 透明底：底下是用户自己的实拍或录屏 */
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }

  /* 文字块后面的一块半透明面板——只护住字，不铺满屏。
     满屏面板会被云渲染 settle 当成"面积最大的一帧"，抢掉底片的定格。 */
  .panel {
    position: absolute; left: 22px; right: 22px;
    background: var(--panel); border-radius: 14px; opacity: 0;
    box-shadow: 0 10px 34px rgba(0,0,0,.28);
  }
  .lb { font-size: 12px; font-weight: 700; letter-spacing: .22em;
        text-transform: uppercase; color: var(--ac); }
  .lb.mut { color: rgba(244,241,234,.42); }
  .tx { color: var(--fg); line-height: 1.28; }
  /* 文字装在一个 inline-block 里：要量「文字排出来多宽」时只能量它。
     直接量 .tx（left/right 撑满的块级）拿到的是容器宽 400px；
     用 Range.getBoundingClientRect 又会被祖先 transform 放大——
     预览页把组件放大 2 倍看时，划线就长成了两倍。offsetWidth 是布局宽，
     两者都不受影响。 */
  .tx > i { display: inline-block; font-style: normal; }
  .sub { color: rgba(244,241,234,.62); line-height: 1.4; }
  .rule { position: absolute; left: 0; height: 2px; background: var(--ac);
          transform-origin: 0 50%; }
  .no { position: absolute; display: flex; align-items: center; justify-content: center;
        border: 2px solid var(--ac); color: var(--ac);
        font-family: ui-monospace, Consolas, monospace; font-weight: 800; }
  /* 竖排连接线：因果链用它 */
  .conn { position: absolute; width: 2px; background: var(--ac); transform-origin: 50% 0; }
  .hit { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--ac); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"color":"#F4F1EA","accent":"#E8A048","panel":"rgba(12,12,18,.68)","fontScale":1,"duration":4.2,"myth":"加了杠杆就能赚钱","fact":"杠杆放大的是亏损"};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--fg', v.color || FALLBACK.color);
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--panel', v.panel || FALLBACK.panel);
  const dur = parseFloat(v.duration) || 4.2;
  const scale = parseFloat(v.fontScale) || 1;

  const stage = document.getElementById('stage');
  const build = 
(stage, put, fit, v, FB, scale) => {
  const S = Math.round(26 * scale), S2 = Math.round(38 * scale);
  const tx = (parent, top, size, weight, text, op) => {
    const el = put('div', 'tx',
      'position:absolute;left:20px;right:20px;top:' + top + 'px;font-size:' + size +
      'px;font-weight:' + weight + (op ? ';opacity:' + op : '') + ';', null, parent);
    put('i', '', '', text, el);
    return el;
  };
  const panel = put('div', 'panel', 'top:44px;height:190px');
  /* 三个位置基准必须统一成面板内坐标。
     原来 aLb / strike / bLb 都没传 parent，全按 stage 坐标排：
     「其实」落在 y=100，正好压在 myth 句（82~115）和划线（98）上。
     面板 44~234，于是标签分别放在 12 / 96。 */
  const aLb = put('div', 'lb mut', 'position:absolute;left:20px;top:12px;', '你以为', panel);
  const aTx = tx(panel, 38, S, 600, v.myth || FB.myth, .72);
  const strike = put('div', 'rule', 'left:20px;top:' + (38 + Math.round(S * 1.28 / 2) - 1) +
    'px;width:0;background:rgba(244,241,234,.72)', null, panel);
  const bLb = put('div', 'lb', 'position:absolute;left:20px;top:96px;', '其实', panel);
  const bTx = tx(panel, 126, S2, 900, v.fact || FB.fact);
  /* 量内层 inline-block 的布局宽 */
  const textWidth = (el) => (el.querySelector('i') || el).offsetWidth;
  fit([{ el: aTx, max: S, min: Math.round(16 * scale), box: 400 },
       { el: bTx, max: S2, min: Math.round(20 * scale), box: 400 }]);
  return {
    build(tl, dur) {
      const T0 = dur * .30, T1 = dur * .58;
      tl.fromTo(panel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .38, ease: 'power3.out' }, 0);
      tl.fromTo([aLb, aTx], { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: .42, ease: 'power3.out', stagger: .07 }, .08);
      /* 划掉「你以为」：一根线从左往右抹过去 */
      tl.to(strike, { width: () => textWidth(aTx), duration: .34, ease: 'power2.inOut' }, T0);
      tl.to([aLb, aTx], { opacity: .3, duration: .3 }, T0 + .3);
      /* 「其实」从右边推上来 */
      tl.fromTo([bLb, bTx], { opacity: 0, x: 22 },
        { opacity: 1, x: 0, duration: .46, ease: 'power4.out', stagger: .06 }, T1);
      tl.fromTo(bTx, { scale: 1.06 }, { scale: 1, duration: .4, ease: 'power3.out' }, T1 + .1);
    }
  };
}
;

  /* 每一项 {el, max, min, box}：量自然宽度，超了就缩字号。
     中文宽度对字号极其敏感，写死字号必然在某组文案上溢出——
     上一轮 blk-* 那批「文字溢出」的根因就是这个。 */
  const fits = [];
  function fit(list) { fits.push.apply(fits, list); }
  function runFit() {
    fits.forEach((f) => {
      const el = f.el;
      el.style.fontSize = f.max + 'px';
      const avail = f.box || el.clientWidth;
      /* 量真实排版宽，只能靠临时 nowrap。
         之前两版都错在这：
           ① 直接量 .tx（left/right 撑满的块级）——一换行 scrollWidth 就等于
              容器宽，量出来永远是 avail，fit 形同虚设；
           ② 为此在父元素里塞一个装着同样文字的 inline-block span 来量——
              同一段话在页面上渲染了两遍（肉眼看到的就是「重影」），
              而且 inline-block 自己的宽度是 shrink-to-fit，量短句时
              同样会被容器宽吃掉。
         nowrap 一次性解决两个：文字不折行，scrollWidth 就是它本该多宽；
         量完恢复，长句该折还是折。 */
      const ws = el.style.whiteSpace;
      el.style.whiteSpace = 'nowrap';
      const natural = el.scrollWidth;
      el.style.whiteSpace = ws;
      if (natural > avail) {
        el.style.fontSize = Math.max(f.min, Math.floor(f.max * avail / natural)) + 'px';
      }
    });
  }
  function put(tag, cls, css, text, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text != null) el.textContent = text;
    (parent || stage).appendChild(el);
    return el;
  }

  const ctx = build(stage, put, fit, v, FALLBACK, scale);
  ctx.fitTargets && ctx.fitTargets();

  const tl = gsap.timeline({ paused: true });
  /* 注册：云渲染的 settle / 逐帧定位靠 window.__timelines 驱动时间轴。
     组件曾全部没注册，渲染停在第 0 帧、整层空。 */
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
  ctx.build(tl, dur);
  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  /* 收口必须放在建完时间轴之后、第一次渲染之前：
     量的时候元素还没被补间动过，量到的是真实排版宽度。 */
  runFit();
  tl.play(0);
})();
</script>
</body>
</html>
