<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"text","name":"文案","type":"string","label":"被强调的单字/词","default":"绝了"},{"id":"accent","name":"强调色","type":"color","label":"强调色","default":"#FF6B35"},{"id":"flash","name":"闪变色","type":"color","label":"闪变色","default":"#FFF8EE"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":3}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>抖动强调字</title>
<style>
  @font-face { font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype'); font-weight: 400 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }

  /* 局部软晕：只罩住主体那一团 */
  .p-sk-halo {
    position: absolute; left: 96px; top: 62px; width: 288px; height: 146px;
    background: radial-gradient(62% 72% at 50% 50%,
      rgba(0, 0, 0, .52) 0%, rgba(0, 0, 0, .26) 54%, rgba(0, 0, 0, 0) 84%);
  }
  .p-sk-stagebox {
    position: absolute; left: 0; right: 0; top: 76px; height: 118px;
    display: flex; align-items: center; justify-content: center;
    will-change: transform;
  }
  .p-sk-word {
    position: relative; z-index: 3; display: inline-block; white-space: nowrap;
    font-size: 54px; line-height: 1; font-weight: 900; letter-spacing: .02em;
    color: var(--ac, #FF6B35);
    -webkit-text-stroke: 7px var(--ink, #1B1B24);
    paint-order: stroke fill;
    text-shadow: 4px 4px 0 rgba(0, 0, 0, .55);
    will-change: transform, color;
  }
  /* 放射线：八条，从字后面炸出来 */
  .p-sk-ray {
    position: absolute; z-index: 1; left: 50%; top: 50%;
    width: 5px; height: 22px; margin: -11px 0 0 -2.5px;
    background: var(--ac, #FF6B35); border-radius: 3px;
    transform-origin: 50% 50%; opacity: 0;
    will-change: transform, opacity;
  }
  /* 冲击环 */
  .p-sk-ring {
    position: absolute; z-index: 2; left: 50%; top: 50%;
    width: 92px; height: 92px; margin: -46px 0 0 -46px;
    border: 4px solid var(--ac, #FF6B35); border-radius: 50%;
    opacity: 0; will-change: transform, opacity;
  }
  /* 落点小注 */
  .p-sk-note {
    position: absolute; left: 0; right: 0; top: 204px; text-align: center;
    font-size: 11px; line-height: 1; font-weight: 700; letter-spacing: .18em;
    color: rgba(255, 248, 238, .62);
    will-change: transform, opacity;
  }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"text":"绝了","accent":"#FF6B35","flash":"#FFF8EE","duration":3};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--ink', '#1B1B24');
  root.style.setProperty('--fl', v.flash || FALLBACK.flash);
  const dur = parseFloat(v.duration) || 3;

  const stage = document.getElementById('stage');
  function put(tag, cls, css, text, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text != null) el.textContent = text;
    (parent || stage).appendChild(el);
    return el;
  }

  const text = (v.text == null || v.text === '' ? FALLBACK.text : v.text)
    .toString().replace(/\s+/g, '').trim().slice(0, 4);

  put('div', 'p-sk-halo');
  const box = put('div', 'p-sk-stagebox');
  const ring = put('div', 'p-sk-ring', null, null, box);
  const word = put('div', 'p-sk-word', null, text, box);
  const note = put('div', 'p-sk-note', null, '就 是 这 句', stage);

  /* 八条放射线：角度写死成常量数组（确定性，不随机） */
  const ANGLES = [0, 45, 90, 135, 180, 225, 270, 315];
  const rays = ANGLES.map(function (a) {
    const r = put('div', 'p-sk-ray', null, null, box);
    r.style.transform = 'rotate(' + a + 'deg) translateY(-62px)';
    return r;
  });

  /* §3.2 中文溢出防护 */
  const MAXFS = 54, MINFS = 22, AVAIL = 300;
  word.style.whiteSpace = 'nowrap';
  const natural = word.scrollWidth;
  if (natural > AVAIL && natural > 0) {
    word.style.fontSize = String(Math.max(MINFS, Math.floor(MAXFS * AVAIL / natural))) + 'px';
  }

  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  const T0 = .34;

  /* ① 砸入：过冲 + 回正 */
  tl.fromTo(word, { scale: .55, opacity: 0, rotate: -10 },
    { scale: 1.16, opacity: 1, rotate: 3, duration: .18, ease: 'power4.out' }, 0);
  tl.to(word, { scale: 1, rotate: -1.5, duration: .26, ease: 'back.out(3)' }, T0 - .16);

  /* ② 放射线逐条炸开 */
  rays.forEach(function (r, i) {
    tl.fromTo(r,
      { scale: .35, opacity: 0 },
      { scale: 1.45, opacity: .95, duration: .12, ease: 'power3.out' },
      T0 + i * .012);
    tl.to(r, { opacity: 0, duration: .42, ease: 'power2.in' }, T0 + i * .012 + .14);
  });

  /* ③ 冲击环 */
  tl.fromTo(ring, { scale: .30, opacity: 0 },
    { scale: 2.45, opacity: .85, duration: .10, ease: 'power2.out' }, T0);
  tl.to(ring, { scale: 2.9, opacity: 0, duration: .48, ease: 'power2.out' }, T0 + .10);

  /* ④ 高频抖动：x / y 两组短 tween 交替，repeat + yoyo */
  tl.to(word, { x: 4, duration: .05, repeat: 5, yoyo: true, ease: 'none' }, T0);
  tl.to(word, { y: -3.5, duration: .05, repeat: 5, yoyo: true, ease: 'none' }, T0);
  tl.to(word, { rotation: 2.2, duration: .06, repeat: 4, yoyo: true, ease: 'none' }, T0);

  /* ⑤ 颜色闪变：keyframes 式的一串短 tween（不依赖任何随机） */
  const FLASH = ['#FFF8EE', '#FF6B35', '#FFF8EE', '#FFC93C', '#FF6B35', '#FFF8EE', '#FF6B35'];
  FLASH.forEach(function (c, i) {
    tl.to(word, { color: c, duration: .07, ease: 'none' }, T0 + i * .09);
  });
  tl.to(word, { color: v.accent || FALLBACK.accent, duration: .16, ease: 'power2.out' }, T0 + FLASH.length * .09 + .04);

  /* ⑥ 小注跟上 */
  tl.fromTo(note, { y: 8, opacity: 0 },
    { y: 0, opacity: 1, duration: .34, ease: 'back.out(2.4)' }, T0 + .42);

  /* ⑦ 余韵：整体压一下再弹回，然后停住 */
  const tail = Math.max(T0 + 1.3, dur - .9);
  tl.to(word, { scale: 1.09, duration: .14, ease: 'power2.out' }, tail);
  tl.to(word, { scale: 1, duration: .24, ease: 'back.out(2.6)' }, tail + .14);

  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  tl.play(0);
})();
</script>
</body>
</html>
