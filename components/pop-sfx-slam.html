<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"text","name":"拟声词","type":"string","label":"主文案（2–4 字最像原片）","default":"唰！"},{"id":"accent","name":"强调色","type":"color","label":"字色 / 强调","default":"#FF6B35"},{"id":"color","name":"硬阴影色","type":"color","label":"描边硬阴影 / 冲击线深色","default":"#241C18"},{"id":"fontSize","name":"字号","type":"number","label":"字号 px（超出画面自动缩）","default":92},{"id":"rayCount","name":"射线数","type":"number","label":"射线数量 0–12","default":8},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":2.8}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>拟声词砸入</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    /* 透明底：这层是挂件，底下是用户自己的实拍 */
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }

  /* 整块的容器：只有它做 ±2.5px 震屏，环 / 射线 / 字一起抖，物理感才对 */
  .p-shake { position: absolute; inset: 0; }

  /* 冲击波环。硬边 2px 投影代替模糊阴影——手绘感来自硬边 */
  .p-ring {
    position: absolute; left: 50%; top: 50%;
    width: 168px; height: 168px; margin: -84px 0 0 -84px;
    border-radius: 50%; opacity: 0;
    filter: drop-shadow(2px 2px 0 var(--ink));
  }
  .p-ring.r1 { border: 8px solid var(--ac2); }
  .p-ring.r2 { width: 132px; height: 132px; margin: -66px 0 0 -66px;
               border: 5px solid var(--ink); opacity: 0; }

  /* 射线：底边贴着画面中心点，transform-origin 50% 100% 就是爆发原点 */
  .p-ray {
    position: absolute; left: 50%; top: 50%;
    width: 11px; height: 48px; margin-left: -5.5px; margin-top: -48px;
    border-radius: 6px; background: var(--ac2); opacity: 0;
    transform-origin: 50% 100%;
    filter: drop-shadow(1.5px 1.5px 0 var(--ink));
  }

  /* 字。inline-block + nowrap：宽度恒等于文字自然宽，
     量 scrollWidth 得到的才是真宽度（见 SPEC §3.2） */
  .p-core { position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center; }
  .p-word {
    display: inline-block; white-space: nowrap;
    font-size: var(--fs, 92px); font-weight: 900; line-height: 1;
    letter-spacing: -.01em; color: var(--ac);
    transform-origin: 50% 58%;
    -webkit-font-smoothing: antialiased;
  }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"text":"唰！","accent":"#FF6B35","color":"#241C18","fontSize":92,"rayCount":8,"duration":2.8};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--ink', v.color || FALLBACK.color);
  root.style.setProperty('--ac2', '#FFC93C');
  const dur = parseFloat(v.duration) || 2.8;
  const fs = parseFloat(v.fontSize) || 92;
  root.style.setProperty('--fs', fs + 'px');
  const text = String(v.text == null ? FALLBACK.text : v.text);
  const rcRaw = parseFloat(v.rayCount);
  const rayN = Math.max(0, Math.min(12, isNaN(rcRaw) ? 8 : Math.round(rcRaw)));

  const stage = document.getElementById('stage');
  function put(tag, cls, css, text_, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text_ != null) el.textContent = text_;
    (parent || stage).appendChild(el);
    return el;
  }

  /* 白色描边用 8 方向 text-shadow 叠：paint-order 在部分浏览器不可靠，这是最稳的跨浏览器做法。
     硬阴影排在列表第一位 = 画在最底下，描边环压在它上面，不会把硬边切碎。
     全程字符串拼接，不用 % 格式化。 */
  function outlineShadow(r, d, off, ink) {
    const W = 'rgba(255,255,255,1)';
    return [
      off + 'px ' + off + 'px 0 ' + ink,
      r + 'px 0 0 ' + W, (0 - r) + 'px 0 0 ' + W,
      '0 ' + r + 'px 0 ' + W, '0 ' + (0 - r) + 'px 0 ' + W,
      d + 'px ' + d + 'px 0 ' + W, (0 - d) + 'px ' + d + 'px 0 ' + W,
      d + 'px ' + (0 - d) + 'px 0 ' + W, (0 - d) + 'px ' + (0 - d) + 'px 0 ' + W
    ].join(',');
  }

  const shake = put('div', 'p-shake', 'opacity:1;');
  const ring1 = put('div', 'p-ring r1', '', null, shake);
  const ring2 = put('div', 'p-ring r2', '', null, shake);
  const rays = [];
  for (let i = 0; i < rayN; i++) rays.push(put('div', 'p-ray', '', null, shake));
  const core = put('div', 'p-core', '', null, shake);
  const word = put('span', 'p-word', '', text, core);
  word.style.textShadow = outlineShadow(3, 2.2, 4.5, v.color || FALLBACK.color);

  const tl = gsap.timeline({ paused: true });
  /* 注册：云渲染的 settle / 逐帧定位靠 window.__timelines 驱动时间轴 */
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  /* ——— SPEC §4.1 的时间轴，一个参数没动 ——— */

  // 0.00 scale 0.2 → 1.18，rotate -14° → 4°  duration .16  power4.out
  // immediateRender:false + CSS 初始态兜底：晚于 0 起的补间在它开始前保持初始态，
  // 不用 tl.set 也不用 tl.call（settle 会来回扫时间轴）。
  tl.fromTo(word,
    { scale: .2, rotation: -14, opacity: 0 },
    { scale: 1.18, rotation: 4, opacity: 1, duration: .16, ease: 'power4.out',
      immediateRender: false }, 0);
  // 0.16 scale 1.18 → 1，rotate 4° → -3°  duration .22  back.out(3)
  tl.to(word, { scale: 1, rotation: -3, duration: .22, ease: 'back.out(3)' }, .16);
  // 落点压扁回弹（SPEC §4 的砸入基线）
  tl.to(word, { scaleX: 1.1, scaleY: .82, duration: .09, yoyo: true, repeat: 1,
    ease: 'power2.inOut' }, .38);

  // 0.16 冲击波环 scale 0.3 → 2.4，opacity .9 → 0  duration .5
  tl.fromTo(ring1, { scale: .3, opacity: .9 },
    { scale: 2.4, opacity: 0, duration: .5, ease: 'power2.out', immediateRender: false }, .16);
  tl.fromTo(ring2, { scale: .35, opacity: .7 },
    { scale: 2.1, opacity: 0, duration: .44, ease: 'power2.out', immediateRender: false }, .2);

  // 0.20 射线 8 条 scale 0.4 → 1.5，逐条 stagger .012
  if (rays.length) {
    const step = 360 / rays.length;
    rays.forEach((r, i) => {
      const a = i * step + 22.5;
      tl.fromTo(r, { scaleY: .4, scaleX: .7, rotation: a - 16, opacity: 0 },
        { scaleY: 1.5, scaleX: 1, rotation: a, opacity: 1, duration: .26,
          ease: 'back.out(2.4)', immediateRender: false }, .2 + i * .012);
    });
    // 稳定后射线退到半透明，给字让位
    tl.to(rays, { opacity: .45, duration: .5, ease: 'sine.inOut' }, .9);
  }

  // 0.38 整块轻微震屏（父容器 x/y 抖动 ±2.5）
  tl.fromTo(shake, { x: 0, y: 0 },
    { keyframes: [
      { x: 2.5, y: -1.6, duration: .045, ease: 'none' },
      { x: -2.4, y: 1.5, duration: .045, ease: 'none' },
      { x: 1.9, y: 2.2, duration: .045, ease: 'none' },
      { x: -1.6, y: -2.0, duration: .045, ease: 'none' },
      { x: 1.2, y: 1.3, duration: .045, ease: 'none' },
      { x: 0, y: 0, duration: .045, ease: 'none' }
    ], immediateRender: false }, .38);

  /* 收口：量自然宽度 vs 可用宽度，超了缩字号。
     放在建完时间轴之后、第一次播放之前：元素还没被补间动过，量到的是真实排版宽度。
     量的是 inline-block 的 .p-word 本身——它 nowrap 且宽度等于文字自然宽，
     不是被容器撑满的块级（那样一换行 scrollWidth 就等于容器宽，量了等于没量）。 */
  (function fit() {
    word.style.fontSize = fs + 'px';
    const natural = word.scrollWidth;
    const avail = 440;
    if (natural > avail) {
      word.style.fontSize = Math.max(28, Math.floor(fs * avail / natural)) + 'px';
    }
  })();

  /* 0.60 之后稳定停留，靠尾部空补间把时长撑到 dur */
  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  tl.play(0);
})();
</script>
</body>
</html>
