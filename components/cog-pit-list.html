<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"color","name":"字色","type":"color","label":"正文颜色","default":"#F4F1EA"},{"id":"accent","name":"强调色","type":"color","label":"强调色","default":"#E8A048"},{"id":"panel","name":"面板底","type":"color","label":"文字块底色","default":"rgba(12,12,18,.68)"},{"id":"fontScale","name":"字号缩放","type":"number","label":"字号缩放（1 = 默认）","default":1},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":4.6},{"id":"title","name":"标题","type":"string","label":"标题","default":"3 个常见坑"},{"id":"p1","name":"坑1","type":"string","label":"坑 1 名","default":"先做产品再找客户"},{"id":"c1","name":"代价1","type":"string","label":"坑 1 的代价","default":"做完才知道没人买"},{"id":"p2","name":"坑2","type":"string","label":"坑 2 名","default":"把降价当增长"},{"id":"c2","name":"代价2","type":"string","label":"坑 2 的代价","default":"越卖越亏"},{"id":"p3","name":"坑3","type":"string","label":"坑 3 名","default":"招人代替建流程"},{"id":"c3","name":"代价3","type":"string","label":"坑 3 的代价","default":"人一走流程就塌"},{"id":"tip","name":"脚注","type":"string","label":"底部一句话","default":"代价写在右边，比坑名更刺眼"}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>坑位清单 · 坑名与代价</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    /* 透明底：底下是用户自己的实拍或录屏 */
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }

  /* 文字块后面的一块半透明面板——只护住字，不铺满屏。
     满屏面板会被云渲染 settle 当成"面积最大的一帧"，抢掉底片的定格。 */
  .panel {
    position: absolute; left: 22px; right: 22px;
    background: var(--panel); border-radius: 14px; opacity: 0;
    box-shadow: 0 10px 34px rgba(0,0,0,.28);
  }
  .lb { font-size: 12px; font-weight: 700; letter-spacing: .22em;
        text-transform: uppercase; color: var(--ac); }
  .lb.mut { color: rgba(244,241,234,.42); }
  .tx { color: var(--fg); line-height: 1.28; }
  /* 文字装在一个 inline-block 里：要量「文字排出来多宽」时只能量它。
     直接量 .tx（left/right 撑满的块级）拿到的是容器宽 400px；
     用 Range.getBoundingClientRect 又会被祖先 transform 放大——
     预览页把组件放大 2 倍看时，划线就长成了两倍。offsetWidth 是布局宽，
     两者都不受影响。 */
  .tx > i { display: inline-block; font-style: normal; }
  .sub { color: rgba(244,241,234,.62); line-height: 1.4; }
  .rule { position: absolute; left: 0; height: 2px; background: var(--ac);
          transform-origin: 0 50%; }
  .no { position: absolute; display: flex; align-items: center; justify-content: center;
        border: 2px solid var(--ac); color: var(--ac);
        font-family: ui-monospace, Consolas, monospace; font-weight: 800; }
  /* 竖排连接线：因果链用它 */
  .conn { position: absolute; width: 2px; background: var(--ac); transform-origin: 50% 0; }
  .hit { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--ac); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"color":"#F4F1EA","accent":"#E8A048","panel":"rgba(12,12,18,.68)","fontScale":1,"duration":4.6,"title":"3 个常见坑","p1":"先做产品再找客户","p2":"把降价当增长","p3":"招人代替建流程","c1":"做完才知道没人买","c2":"越卖越亏","c3":"人一走流程就塌","tip":"代价写在右边，比坑名更刺眼"};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--fg', v.color || FALLBACK.color);
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--panel', v.panel || FALLBACK.panel);
  const dur = parseFloat(v.duration) || 4.6;
  const scale = parseFloat(v.fontScale) || 1;

  const stage = document.getElementById('stage');
  const build = 
(stage, put, fit, v, FB, scale) => {
  const S = Math.round(21 * scale), C = Math.round(14 * scale);
  /* 面板 top 必须是 10 而不是 30。
     标题在 top:16、行高 31 ⇒ 占 16..47；原来面板从 30 开始，
     于是标题**横跨面板边缘**：上 14px 落在浅色舞台上，下 17px 落在深面板上。
     标题色是 --fg（#F4F1EA，为深底设计），
     浅字压浅底那段几乎看不见，画面上读起来就是「标题被切了一半」。
     把面板上移到 10，标题整块落进面板内，颜色才成立。
     行 52/102/152（高 30 ⇒ 52..182）仍在面板内；底部 .lb 在 244..258，不冲突。 */
  const panel = put('div', 'panel', 'top:10px;height:212px');
  const title = put('div', 'tx', 'position:absolute;left:20px;top:16px;font-size:' + Math.round(24 * scale) + 'px;font-weight:900;', v.title || FB.title);
  const names = [v.p1, v.p2, v.p3].map((x, i) => (x == null || x === '') ? (FB['p' + (i + 1)]) : x);
  const costs = [v.c1, v.c2, v.c3].map((x, i) => (x == null || x === '') ? (FB['c' + (i + 1)]) : x);
  fit([{ el: title, max: Math.round(24 * scale), min: 16, box: 400 }]);
  const rows = [];
  for (let i = 0; i < 3; i++) {
    const y = 52 + i * 50;
    const no = put('div', 'no', 'left:20px;top:' + y + 'px;width:30px;height:30px;font-size:' + C + 'px;', String(i + 1));
    const nm = put('div', 'tx', 'position:absolute;left:60px;top:' + (y + 2) + 'px;width:236px;font-size:' + S + 'px;font-weight:700;', names[i]);
    const co = put('div', 'sub', 'position:absolute;left:300px;top:' + (y + 6) + 'px;width:118px;text-align:right;font-size:' + Math.round(14 * scale) + 'px;', costs[i]);
    fit([{ el: nm, max: S, min: 12, box: 232 },
         { el: co, max: Math.round(14 * scale), min: 10, box: 114 }]);
    rows.push([no, nm, co]);
  }
  const tail = put('div', 'lb', 'position:absolute;left:20px;bottom:12px;font-size:11px;', v.tip || FB.tip);
  return {
    build(tl, dur) {
      tl.fromTo(panel, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .4, ease: 'power3.out' }, 0);
      tl.fromTo(title, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: .42, ease: 'power3.out' }, .06);
      rows.forEach((r, i) => {
        const at = .2 + i * .17;
        tl.fromTo(r[0], { opacity: 0, scale: .6, rotate: -8 },
          { opacity: 1, scale: 1, rotate: 0, duration: .38, ease: 'back.out(2)' }, at);
        tl.fromTo(r[1], { opacity: 0, x: -18 },
          { opacity: 1, x: 0, duration: .4, ease: 'power3.out' }, at + .05);
        tl.fromTo(r[2], { opacity: 0, x: 14 },
          { opacity: 1, x: 0, duration: .4, ease: 'power3.out' }, at + .11);
      });
      tl.fromTo(tail, { opacity: 0 }, { opacity: 1, duration: .4 }, .2 + rows.length * .17);
    }
  };
}
;

  /* 每一项 {el, max, min, box}：量自然宽度，超了就缩字号。
     中文宽度对字号极其敏感，写死字号必然在某组文案上溢出——
     上一轮 blk-* 那批「文字溢出」的根因就是这个。 */
  const fits = [];
  function fit(list) { fits.push.apply(fits, list); }
  function runFit() {
    fits.forEach((f) => {
      const el = f.el;
      el.style.fontSize = f.max + 'px';
      const avail = f.box || el.clientWidth;
      /* 量真实排版宽，只能靠临时 nowrap。
         之前两版都错在这：
           ① 直接量 .tx（left/right 撑满的块级）——一换行 scrollWidth 就等于
              容器宽，量出来永远是 avail，fit 形同虚设；
           ② 为此在父元素里塞一个装着同样文字的 inline-block span 来量——
              同一段话在页面上渲染了两遍（肉眼看到的就是「重影」），
              而且 inline-block 自己的宽度是 shrink-to-fit，量短句时
              同样会被容器宽吃掉。
         nowrap 一次性解决两个：文字不折行，scrollWidth 就是它本该多宽；
         量完恢复，长句该折还是折。 */
      const ws = el.style.whiteSpace;
      el.style.whiteSpace = 'nowrap';
      const natural = el.scrollWidth;
      el.style.whiteSpace = ws;
      if (natural > avail) {
        el.style.fontSize = Math.max(f.min, Math.floor(f.max * avail / natural)) + 'px';
      }
    });
  }
  function put(tag, cls, css, text, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text != null) el.textContent = text;
    (parent || stage).appendChild(el);
    return el;
  }

  const ctx = build(stage, put, fit, v, FALLBACK, scale);
  ctx.fitTargets && ctx.fitTargets();

  const tl = gsap.timeline({ paused: true });
  /* 注册：云渲染的 settle / 逐帧定位靠 window.__timelines 驱动时间轴。
     组件曾全部没注册，渲染停在第 0 帧、整层空。 */
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
  ctx.build(tl, dur);
  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  /* 收口必须放在建完时间轴之后、第一次渲染之前：
     量的时候元素还没被补间动过，量到的是真实排版宽度。 */
  runFit();
  tl.play(0);
})();
</script>
</body>
</html>
