<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"accent","name":"角色色","type":"color","label":"角色色","default":"#FF6B35"},{"id":"accent2","name":"手部色","type":"color","label":"手部色","default":"#FFC93C"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":3.0}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>橡皮手臂拉长去够</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  :root {
    --ink: #241C18;
    --fg: #FFF8EE;
  }

  .pop-shadow { position: absolute; left: 96px; top: 188px; width: 96px; height: 18px;
    border-radius: 50%; background: rgba(27, 27, 36, .26); }

  /* hero：角色 + 伸出去的手臂，手臂从躯干右缘长出去 */
  .pop-hero { position: absolute; left: 96px; top: 106px; width: 260px; height: 92px;
    transform-origin: 8% 100%; opacity: 0; }
  .pop-leg { position: absolute; top: 71px; width: 20px; height: 21px;
    border-radius: 3px 3px 9px 9px; background: var(--ac); border: 3px solid var(--ink); }
  .pop-leg-l { left: 22px; }
  .pop-leg-r { left: 54px; }
  .pop-arm { position: absolute; top: 34px; width: 24px; height: 15px; z-index: 1;
    border-radius: 15px; background: var(--ac); border: 3px solid var(--ink); }
  .pop-arm-l { left: -7px; transform-origin: 100% 50%; }
  .pop-body { position: absolute; left: 14px; top: 0; width: 72px; height: 74px; z-index: 2;
    border-radius: 24px 26px 22px 26px; background: var(--ac); border: 3px solid var(--ink); }
  .pop-eye { position: absolute; top: 23px; width: 20px; height: 23px;
    border-radius: 50%; background: var(--ink); }
  .pop-eye-l { left: 12px; }
  .pop-eye-r { left: 40px; }
  .pop-mouth-o { position: absolute; left: 26px; top: 50px; width: 20px; height: 18px;
    border-radius: 50%; background: var(--ink); }

  /* 橡皮条手臂：从身体右缘向右拉长 */
  .pop-rubber { position: absolute; left: 82px; top: 36px; width: 148px; height: 24px;
    border-radius: 24px; background: var(--ac); border: 3px solid var(--ink);
    transform-origin: 0 50%; transform: scaleX(.15); opacity: 0; }
  /* 高光线：更细的一条，跟随 scale 一起拉长 */
  .pop-rubber::after { content: ''; position: absolute; left: 10px; top: 4px;
    width: 118px; height: 5px; border-radius: 5px; background: rgba(255, 248, 238, .55); }
  /* 末端圆头（手）：不是橡皮条的子元素，所以要单独把 left 跟着 scaleX 一起推出去，
     否则手会飘在橡皮条前面；两段用同一组时刻与缓动，视觉上始终咬在末端 */
  .pop-tip { position: absolute; left: 81px; top: 25px; width: 46px; height: 46px;
    border-radius: 50%; background: var(--ac2); border: 3px solid var(--ink);
    transform: scale(.4); opacity: 0; }
  /* 抓住时的两片指头 */
  .pop-finger { position: absolute; width: 12px; height: 18px; border-radius: 6px;
    background: var(--ac2); border: 3px solid var(--ink); }
  .pop-finger-t { left: 12px; top: -9px; }
  .pop-finger-b { left: 12px; bottom: -9px; }
  /* 拉伸时的速度线 */
  .pop-streak { position: absolute; left: 120px; height: 4px; border-radius: 3px;
    background: var(--ink); opacity: 0; transform-origin: 0 50%; }
  .pop-streak-1 { top: 24px; width: 40px; }
  .pop-streak-2 { top: 70px; width: 30px; }
  .pop-streak-3 { top: 78px; width: 20px; }
  /* 抓到的小星星 */
  .pop-spark { position: absolute; left: 240px; top: 8px; width: 30px; height: 30px;
    background: var(--ac2); opacity: 0;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"accent":"#FF6B35","accent2":"#FFC93C","duration":3.0};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--ac2', v.accent2 || FALLBACK.accent2);
  const dur = parseFloat(v.duration) || FALLBACK.duration;

  const stage = document.getElementById('stage');
  function put(tag, cls, css, text, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text != null) el.textContent = text;
    (parent || stage).appendChild(el);
    return el;
  }

  // ——— 方块小角色（伸右臂）———
  const shadow = put('div', 'pop-shadow');
  const s1 = put('div', 'pop-streak pop-streak-1');
  const s2 = put('div', 'pop-streak pop-streak-2');
  const s3 = put('div', 'pop-streak pop-streak-3');
  const spark = put('div', 'pop-spark');

  const hero = put('div', 'pop-hero');
  put('div', 'pop-leg pop-leg-l', '', null, hero);
  put('div', 'pop-leg pop-leg-r', '', null, hero);
  put('div', 'pop-arm pop-arm-l', '', null, hero);
  const body = put('div', 'pop-body', '', null, hero);
  put('div', 'pop-eye pop-eye-l', '', null, body);
  put('div', 'pop-eye pop-eye-r', '', null, body);
  put('div', 'pop-mouth-o', '', null, body);

  const rubber = put('div', 'pop-rubber', '', null, hero);
  const tip = put('div', 'pop-tip', '', null, hero);
  put('div', 'pop-finger pop-finger-t', '', null, tip);
  put('div', 'pop-finger pop-finger-b', '', null, tip);

  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  // 入场 + 身体被反向轻拉：边弹入边被自己的手臂往左拽 4px（§4.2 的物理感）
  tl.fromTo(shadow, { opacity: 0, scale: .6 }, { opacity: .26, scale: 1, duration: .26, ease: 'power2.out' }, 0);
  tl.fromTo(hero, { scale: .6, opacity: 0, x: 0 },
    { scale: 1, opacity: 1, x: -4, duration: .40, ease: 'power2.out' }, 0);

  // 0.00 手臂从身体伸出去（scaleX 0.15 → 1）
  tl.fromTo(rubber, { scaleX: .15, opacity: 0 },
    { scaleX: 1, opacity: 1, duration: .40, ease: 'power2.out' }, 0);
  // 末端圆头同步右移，始终贴在橡皮条末端（left = 59 + 148 × scaleX）
  tl.fromTo(tip, { left: 81, opacity: 0 },
    { left: 207, opacity: 1, duration: .40, ease: 'power2.out' }, 0);

  // 速度线跟着拉伸出来
  tl.fromTo(s1, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: .55, duration: .18, ease: 'power2.out' }, .04);
  tl.fromTo(s2, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: .45, duration: .18, ease: 'power2.out' }, .08);
  tl.fromTo(s3, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: .35, duration: .18, ease: 'power2.out' }, .12);
  tl.to([s1, s2, s3], { opacity: 0, duration: .18, ease: 'power2.in' }, .42);

  // 0.05 末端圆头：0.4 → 1.1 → 1 的过冲
  tl.fromTo(tip, { scale: .4, opacity: 0 },
    { scale: 1.1, opacity: 1, duration: .18, ease: 'back.out(3)' }, .05);
  tl.to(tip, { scale: 1, duration: .12, ease: 'back.out(2.4)' }, .23);

  // 0.40 末端抓握：两片指头一开一合
  tl.to(tip, { scale: 1.18, duration: .05, ease: 'power2.out' }, .40);
  tl.to(tip, { scale: .88, duration: .05, ease: 'power2.in' }, .45);
  tl.to(tip, { scale: 1.05, duration: .05, ease: 'power2.out' }, .50);

  // 抓到东西的小星星
  tl.fromTo(spark, { scale: .3, opacity: 0, rotate: -30 },
    { scale: 1.25, opacity: 1, rotate: 10, duration: .16, ease: 'back.out(3)' }, .44);
  tl.to(spark, { scale: .8, opacity: 0, duration: .2, ease: 'power2.in' }, .62);

  // 0.55 回弹：scaleX 1 → 0.6 → 0.15，末端跟着一起收
  tl.to(rubber, { scaleX: .6, duration: .17, ease: 'power2.inOut' }, .55);
  tl.to(rubber, { scaleX: .15, opacity: 0, duration: .17, ease: 'power2.inOut' }, .72);
  tl.to(tip, { scale: .4, duration: .24, ease: 'power2.inOut' }, .55);
  tl.to(tip, { left: 148, duration: .17, ease: 'power2.inOut' }, .55);
  tl.to(tip, { left: 81, duration: .17, ease: 'power2.inOut' }, .72);
  tl.to(tip, { opacity: 0, duration: .2, ease: 'power2.inOut' }, .69);
  // 身体被拉回原位
  tl.to(hero, { x: 0, duration: .34, ease: 'power2.out' }, .55);

  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  tl.play(0);
})();
</script>
</body>
</html>
