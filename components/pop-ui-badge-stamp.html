<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"label","name":"控件文案","type":"string","label":"控件说明文案","default":"限时折扣"},{"id":"amount","name":"数字","type":"string","label":"角标数字","default":"59"},{"id":"unit","name":"单位","type":"string","label":"数字单位","default":"元"},{"id":"accent","name":"强调色","type":"color","label":"强调色","default":"#FF6B35"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":3.2}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>角标盖章</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  .p-halo { position: absolute; inset: 0;
    background: radial-gradient(58% 70% at 50% 46%,
      rgba(0,0,0,.56) 0%, rgba(0,0,0,.30) 54%, rgba(0,0,0,0) 84%); }
  .p-glow { position: absolute; left: 145px; top: 27px; width: 190px; height: 190px;
    border-radius: 50%; opacity: 0;
    background: radial-gradient(closest-side,
      rgba(255,201,60,.92) 0%, rgba(255,201,60,.38) 44%, rgba(255,107,53,0) 72%); }
  .p-label { position: absolute; font-size: 11px; font-weight: 700; letter-spacing: .18em;
    color: rgba(255,248,238,.6); white-space: nowrap; }
  .p-badge { position: absolute; left: 190px; top: 72px; width: 100px; height: 100px;
    border-radius: 50%; background: var(--ac); border: 3px solid #FFF8EE;
    box-shadow: 4px 5px 0 rgba(0,0,0,.34); display: flex; flex-direction: column;
    align-items: center; justify-content: center; }
  .p-amt { font-size: 34px; font-weight: 900; color: #FFF8EE; line-height: 1;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .p-unit { font-size: 11px; font-weight: 700; letter-spacing: .1em;
    color: rgba(255,255,255,.88); white-space: nowrap; margin-top: 3px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"label":"限时折扣","amount":"59","unit":"元","accent":"#FF6B35","duration":3.2};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  const dur = parseFloat(v.duration) || 3.2;

  const stage = document.getElementById('stage');
  function put(tag, cls, css, text, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text != null) el.textContent = text;
    (parent || stage).appendChild(el);
    return el;
  }
  const fits = [];
  function fit(list) { fits.push.apply(fits, list); }
  function runFit() {
    fits.forEach((f) => {
      const el = f.el;
      el.style.fontSize = f.max + 'px';
      const avail = f.box || el.clientWidth;
      const ws = el.style.whiteSpace;
      el.style.whiteSpace = 'nowrap';
      const natural = el.scrollWidth;
      el.style.whiteSpace = ws;
      if (natural > avail) {
        el.style.fontSize = Math.max(f.min, Math.floor(f.max * avail / natural)) + 'px';
      }
    });
  }

  put('div', 'p-halo');
  const glow = put('div', 'p-glow');
  const label = put('div', 'p-label', 'left:190px; top:196px;', v.label || FALLBACK.label);
  const badge = put('div', 'p-badge');
  const amt = put('div', 'p-amt', '', String(v.amount || FALLBACK.amount), badge);
  const unit = put('div', 'p-unit', '', String(v.unit || FALLBACK.unit), badge);

  fit([{ el: label, max: 11, min: 9, box: 160 },
       { el: amt, max: 34, min: 20, box: 84 },
       { el: unit, max: 11, min: 9, box: 84 }]);

  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  const T_HIT = 0.36;
  tl.fromTo(label, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .3 }, .04);
  /* 盖章：从大远处砸下来、越缩越快，落地带一点歪 */
  tl.fromTo(badge, { scale: 2.7, rotate: -26, opacity: 0 },
    { scale: 1, rotate: -7, opacity: 1, duration: .3, ease: 'power4.in' }, .06);
  /* 落地压扁回弹 + 轻微抖 */
  tl.to(badge, { scaleY: .82, scaleX: 1.08, duration: .1, yoyo: true, repeat: 1, ease: 'power2.inOut' },
    T_HIT);
  tl.to(badge, { x: 2.5, duration: .05, repeat: 4, yoyo: true, ease: 'none' }, T_HIT + 0.2);
  /* 数字在落地的同一刻跳出来 */
  tl.fromTo(amt, { scale: .3, opacity: 0 },
    { scale: 1.24, opacity: 1, duration: .18, ease: 'power4.out' }, T_HIT - 0.02);
  tl.to(amt, { scale: 1, duration: .3, ease: 'back.out(2.8)' }, T_HIT + 0.16);
  tl.fromTo(unit, { opacity: 0, y: 5 },
    { opacity: 1, y: 0, duration: .22, ease: 'power2.out' }, T_HIT + 0.1);
  /* 光晕脉冲：两下 */
  tl.fromTo(glow, { scale: .32, opacity: .95 },
    { scale: 1.8, opacity: 0, duration: .78, ease: 'power2.out' }, T_HIT - 0.04);
  tl.fromTo(glow, { scale: .32, opacity: .95 },
    { scale: 1.8, opacity: 0, duration: .78, ease: 'power2.out' }, T_HIT + 0.16);
  /* 再补一跳数字 */
  tl.to(amt, { scale: 1.16, duration: .14, ease: 'power2.out' }, 1.62);
  tl.to(amt, { scale: 1, duration: .34, ease: 'elastic.out(1,.5)' }, 1.76);

  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  runFit();
  tl.play(0);
})();
</script>
</body>
</html>
