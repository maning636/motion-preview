<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"label","name":"控件文案","type":"string","label":"控件说明文案","default":"时间轴片段"},{"id":"names","name":"片段名","type":"string","label":"四个片段名（逗号分隔）","default":"开场,正片,字幕,片尾"},{"id":"accent","name":"强调色","type":"color","label":"强调色","default":"#FF6B35"},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":3.2}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>时间轴片段落位</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }
  .p-halo { position: absolute; inset: 0;
    background: radial-gradient(62% 74% at 50% 50%,
      rgba(0,0,0,.56) 0%, rgba(0,0,0,.30) 54%, rgba(0,0,0,0) 84%); }
  .p-label { position: absolute; font-size: 11px; font-weight: 700; letter-spacing: .18em;
    color: rgba(255,248,238,.6); white-space: nowrap; }
  .p-ruler { position: absolute; left: 90px; top: 92px; width: 300px; height: 11px; }
  .p-tick { position: absolute; top: 0; width: 2px; height: 7px;
    background: rgba(255,248,238,.42); border-radius: 1px; }
  /* 复合选择器，不独立成条：.p-tick-maj 在 DOM 上是 .p-tick 的修饰类，
     独立规则会命中同名的任何元素，组件一多就撞车。 */
  .p-tick.p-tick-maj { height: 11px; width: 2.5px; background: rgba(255,248,238,.66); }
  .p-track { position: absolute; left: 90px; top: 118px; width: 300px; height: 34px;
    border-radius: 9px; background: rgba(255,248,238,.06); }
  .p-clip { position: absolute; top: 118px; width: 71px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; }
  .p-clip-tx { font-size: 10px; font-weight: 800; letter-spacing: .04em;
    color: rgba(255,255,255,.92); white-space: nowrap; }
  /* 定格高亮边框：单独一层，闪一下后停在那儿 */
  .p-lock { position: absolute; top: 116px; width: 75px; height: 38px; border-radius: 10px;
    opacity: 0; border: 2px solid #FFF8EE; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"label":"时间轴片段","names":"开场,正片,字幕,片尾","accent":"#FF6B35","duration":3.2};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  const dur = parseFloat(v.duration) || 3.2;

  const stage = document.getElementById('stage');
  function put(tag, cls, css, text, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text != null) el.textContent = text;
    (parent || stage).appendChild(el);
    return el;
  }
  const fits = [];
  function fit(list) { fits.push.apply(fits, list); }
  function runFit() {
    fits.forEach((f) => {
      const el = f.el;
      el.style.fontSize = f.max + 'px';
      const avail = f.box || el.clientWidth;
      const ws = el.style.whiteSpace;
      el.style.whiteSpace = 'nowrap';
      const natural = el.scrollWidth;
      el.style.whiteSpace = ws;
      if (natural > avail) {
        el.style.fontSize = Math.max(f.min, Math.floor(f.max * avail / natural)) + 'px';
      }
    });
  }
  function list4(s, fb) {
    const a = String(s == null ? '' : s).split(/[,，|]/);
    const out = [];
    for (let i = 0; i < 4; i++) {
      const t = (a[i] || '').trim();
      out.push(t || fb[i]);
    }
    return out;
  }

  put('div', 'p-halo');
  const label = put('div', 'p-label', 'left:90px; top:58px;', v.label || FALLBACK.label);
  const ruler = put('div', 'p-ruler');
  const track = put('div', 'p-track');

  const ticks = [];
  for (let i = 0; i <= 8; i++) {
    ticks.push(put('div', (i % 2 === 0 ? 'p-tick p-tick-maj' : 'p-tick'),
      'left:' + (i * 37.5).toFixed(1) + 'px;', null, ruler));
  }

  const names = list4(v.names, list4(FALLBACK.names, ['开场', '正片', '字幕', '片尾']));
  const fills = ['var(--ac)', '#FFC93C', '#2EC4B6', '#E8A048'];
  const lock = put('div', 'p-lock', 'left:315px;');
  const clips = names.map(function (s, i) {
    const c = put('div', 'p-clip', 'left:' + (92 + i * 75) + 'px; background:' + fills[i] + ';', null, track);
    put('div', 'p-clip-tx', '', s, c);
    return c;
  });
  clips.forEach(function (c) { fits.push({ el: c.firstChild, max: 10, min: 8, box: 62 }); });

  fit([{ el: label, max: 11, min: 9, box: 300 }]);

  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  const T0 = 0.2, STEP = 0.17, FALL = 0.3;
  tl.fromTo(label, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .3 }, .04);
  tl.fromTo(ticks, { opacity: 0, scaleY: 0 },
    { opacity: 1, scaleY: 1, duration: .26, ease: 'back.out(2)', stagger: .03 }, 0);
  tl.fromTo(track, { opacity: 0 }, { opacity: 1, duration: .26 }, .06);
  /* 片段连续落位：一条压着一条，最后一段定格高亮 */
  tl.fromTo(clips, { y: -74, opacity: 0, rotate: -4 },
    { y: 0, opacity: 1, rotate: 0, duration: FALL, ease: 'power4.in', stagger: STEP }, T0);
  clips.forEach(function (c, i) {
    tl.to(c, { scaleY: .84, scaleX: 1.06, duration: .1, yoyo: true, repeat: 1, ease: 'power2.inOut' },
      T0 + i * STEP + FALL);
  });
  const T_LOCK = T0 + 3 * STEP + FALL;
  tl.fromTo(lock, { opacity: 0, scale: 1.18 },
    { opacity: .92, scale: 1, duration: .22, ease: 'power3.out' }, T_LOCK + 0.08);
  tl.to(lock, { opacity: .55, duration: .3 }, T_LOCK + 0.42);

  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  runFit();
  tl.play(0);
})();
</script>
</body>
</html>
