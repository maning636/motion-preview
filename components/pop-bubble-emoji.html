<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"glyph","name":"图形串","type":"string","label":"心 / 星 组成的序列，最多 5 个","default":"心星心星心"},{"id":"accent","name":"强调色","type":"color","label":"第一层图形颜色","default":"#FF6B35"},{"id":"accent2","name":"次强调色","type":"color","label":"第二层图形颜色","default":"#FFC93C"},{"id":"edge","name":"描边色","type":"color","label":"白边外的硬阴影色","default":"#241C18"},{"id":"size","name":"图形大小","type":"number","label":"图形边长 px","default":38},{"id":"duration","name":"时长","type":"number","label":"时长（秒）","default":2.8}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=270" />
<title>表情图形弹跳</title>
<style>
  @font-face {
    font-family: 'MiSans';
    src: url('/templates/_fonts/MiSansSemiBold.ttf') format('truetype');
    font-weight: 400 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 480px; height: 270px; overflow: hidden;
    /* 透明底：这层是挂件，底下是用户自己的实拍 */
    background: transparent;
    font-family: 'MiSans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; }

  /* 全部是 CSS 画的形状，没有用任何 emoji 字形：
     headless Chrome 上 emoji 会渲染成方块/豆腐，形状靠 clip-path 画死最稳。 */
  .p-gw {
    position: absolute; opacity: 0;
    filter: drop-shadow(2.5px 3.5px 0 var(--edge, #241C18));
  }
  .p-gring, .p-gfill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* 白边 = 同形状放大一圈垫在下面，露出的一圈就是描边。
     比 filter: drop-shadow(0 0 0 白) 可靠——后者 Chrome 根本不支持 0 扩散。 */
  .p-gring { background: var(--fg, #FFF8EE); transform: scale(1.2); }
  .p-gfill { background: var(--gcol, #FF6B35); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../templates/_lib/gsap.min.js"></script>
<script>
(() => {
  const FALLBACK = {"glyph":"心星心星心","accent":"#FF6B35","accent2":"#FFC93C","edge":"#241C18","size":38,"duration":2.8};
  const v = (window.__hyperframes && window.__hyperframes.getVariables)
    ? window.__hyperframes.getVariables() : FALLBACK;
  const root = document.documentElement;
  root.style.setProperty('--ac', v.accent || FALLBACK.accent);
  root.style.setProperty('--ac2', v.accent2 || FALLBACK.accent2);
  root.style.setProperty('--edge', v.edge || FALLBACK.edge);
  root.style.setProperty('--fg', '#FFF8EE');
  const dur = parseFloat(v.duration) || 2.8;
  const szRaw = parseFloat(v.size);
  const sz = isNaN(szRaw) ? 38 : Math.max(14, Math.min(60, szRaw));
  const seq = Array.from(String(v.glyph == null ? FALLBACK.glyph : v.glyph))
    .filter(function (c) { return c !== ' ' && c !== '　'; });
  const kinds = (seq.length ? seq : Array.from(FALLBACK.glyph)).slice(0, 5);

  /* 20 顶点的爱心 / 10 顶点的五角星，顶点是定死的常量，不是随机数 */
  const HEART = [[50, 100], [25, 78], [10, 60], [2, 45], [0, 32], [4, 20], [12, 11],
                 [24, 6], [36, 9], [44, 16], [50, 26], [56, 16], [64, 9], [76, 6],
                 [88, 11], [96, 20], [100, 32], [98, 45], [90, 60], [75, 78]];
  const STAR = [[50, 2], [61, 35], [96, 35], [68, 56], [79, 92],
                [50, 70], [21, 92], [32, 56], [4, 35], [39, 35]];
  function shapeClip(pts) {
    return 'polygon(' + pts.map(function (p) {
      return p[0] + '% ' + p[1] + '%';
    }).join(', ') + ')';
  }
  const CLIP = { heart: shapeClip(HEART), star: shapeClip(STAR) };

  const stage = document.getElementById('stage');
  function put(tag, cls, css, text_, parent) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (css) el.style.cssText = css;
    if (text_ != null) el.textContent = text_;
    (parent || stage).appendChild(el);
    return el;
  }

  /* 位置 / 大小 / 入场角度 / 弹跳曲线全都按序号取数组：每个都不同，但全是定值 */
  const POSE = [
    { x: 88, y: 172, s: 1.2, r: -18, at: .05, d: .42, e: 'back.out(3)' },
    { x: 162, y: 118, s: .92, r: 14, at: .18, d: .58, e: 'elastic.out(1,.55)' },
    { x: 240, y: 154, s: 1.08, r: -10, at: .32, d: .5, e: 'bounce.out' },
    { x: 316, y: 106, s: .8, r: 20, at: .44, d: .52, e: 'back.out(1.6)' },
    { x: 392, y: 148, s: .98, r: -6, at: .56, d: .66, e: 'elastic.out(1.1,.42)' }
  ];
  const items = kinds.map(function (c, i) {
    const p = POSE[i];
    const side = Math.round(sz * p.s);
    const g = put('div', 'p-gw', 'left:' + Math.round(p.x - side / 2) + 'px;top:' +
      Math.round(p.y - side / 2) + 'px;width:' + side + 'px;height:' + side + 'px;', null, stage);
    g.style.setProperty('--gcol', i % 2 === 0 ? 'var(--ac)' : 'var(--ac2)');
    const ring = put('div', 'p-gring', '', null, g);
    const fill = put('div', 'p-gfill', '', null, g);
    const clip = CLIP[c === '星' ? 'star' : 'heart'];
    ring.style.clipPath = clip;
    fill.style.clipPath = clip;
    return { el: g, pose: p };
  });

  const tl = gsap.timeline({ paused: true });
  /* 注册：云渲染的 settle / 逐帧定位靠 window.__timelines 驱动时间轴 */
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  items.forEach(function (it) {
    const p = it.pose;
    tl.fromTo(it.el, { scale: 0, y: 30, rotation: p.r, opacity: 0 },
      { scale: 1, y: 0, rotation: 0, opacity: 1, duration: p.d, ease: p.e,
        immediateRender: false }, p.at);
    // 落定后各自不同周期地飘
    const per = .7 + p.at;
    let rep = Math.floor((dur - .3 - (p.at + p.d + .12)) / (per * 2));
    if (rep > 3) rep = 3;
    tl.to(it.el, { y: -6, duration: per, yoyo: true, repeat: rep,
      ease: 'sine.inOut' }, p.at + p.d + .12);
  });

  tl.to({}, { duration: .3 }, Math.max(.1, dur - .3));
  tl.play(0);
})();
</script>
</body>
</html>
